,6,0],[35,2024,11,38,0,"감정평가론","감정평가 3방식·시산가액","틀린것 고르기","원가법에서의 재조달원가에 관한 설명으로 틀린 것은?\n① 재조달원가란 대상물건을 기준시점에 재생산하거나 재취 득하는 데 필요한 적정원가의 총액을 말한다.\n② 총량조사법, 구성단위법, 비용지수법은 재조달원가의 산정방법에 해당한다.\n③ 재조달원가는 대상물건을 일반적인 방법으로 생산하거나 취득하는 데 드는 비용으로 하되, 제세공과금은 제외한다.\n④ 재조달원가를 구성하는 표준적 건설비에는 수급인의 적정이윤이 포함된다.\n⑤ 재조달원가를 구할 때 직접법과 간접법을 병용할 수 있다. 2024년 제35회 공인중개","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",6,0],[35,2024,11,39,0,"감정평가론","부동산가격공시","틀린것 고르기","부동산 가격공시에 관한 법령상 부동산 가격공시제도에 관한 내용으로 틀린 것은?\n① 표준주택으로 선정된 단독주택, 국세 또는 지방세 부과대상이 아닌 단독주택에 대하여는 개별주택가격을 결정ㆍ공시하지 아니할 수 있다.\n② 표준주택가격은 국가ㆍ지방자치단체 등이 그 업무와 관련하여 개별주택가격을 산정하는 경우에 그 기준이 된다.\n③ 개별주택가격 및 공동주택가격은 주택시장의 가격정보를 제공하고, 국가ㆍ지방자치단체 등이 과세 등의 업무와 관련하여 주택의 가격을 산정하는 경우에 그 기준으로 활용될 수 있다.\n④ 개별주택가격에 이의가 있는 자는 그 결정ㆍ공시일부터 30일 이내에 서면(전자문서를 포함한다)으로 시장ㆍ군수 또는 구청장에게 이의를 신청할 수 있다.\n⑤ 시장ㆍ군수 또는 구청장은 공시기준일 이후에 토지의 분할ㆍ합병이나 건축물의 신축 등이 발생한 경우에는 대통령령으로 정하는 날을 기준으로 하여 공동주택가격을 결정ㆍ공시하여야 한다.","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",6,0],[35,2024,11,40,0,"감정평가론","감정평가 3방식·시산가액","박스형(모두고르기), 옳은것 고르기","감정평가에 관한 규칙상 대상물건별로 정한 감정평가방법(주된 감정평가방법)에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 건물의 주된 감정평가방법은 원가법이다.\nㄴ. ｢집합건물의 소유 및 관리에 관한 법률｣에 따른 구분소유권의 대상이 되는 건물부분과 그 대지사용권을 일괄하여 감정평가하는 경우의 주된 감정평가방법은 거래사례비교법이다.\nㄷ. 자동차와 선박의 주된 감정평가방법은 거래사례비교법이다. 다만, 본래 용도의 효용가치가 없는 물건은 해체처분가액으로 감정평가할 수 있다.\nㄹ. 영업권과 특허권의 주된 감정평가방법은 수익 분석법이다.\n① ㄱ, ㄴ ② ㄴ, ㄹ ③ ㄱ, ㄴ, ㄷ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄱ, ㄷ, ㄹ","1","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",6,0],[35,2024,11,41,1,"민법총칙","법률행위(반사회·불공정)","판례, 옳은것 고르기","반사회질서의 법률행위에 해당하는 것은?(다툼이 있으면 판례에 따름)\n① 법령에서 정한 한도를 초과하는 부동산 중개수수료 약정\n② 강제집행을 면할 목적으로 허위의 근저당권을 설정하는 행위\n③ 다수의 보험계약을 통해 보험금을 부정취득할 목적으로 체결한 보험계약\n④ 반사회적 행위에 의하여 조성된 비자금을 소극적으로 은닉하기 위한 임치계약\n⑤ 양도소득세를 회피할 목적으로 실제 거래가액보다 낮은 금액을 대금으로 기재한 매매계약","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",7,0],[35,2024,11,42,1,"물권법","물권변동·등기","판례, 틀린것 고르기","甲은 강제집행을 피하기 위해 자신의 X부동산을 乙에게 가장매도하여 소유권이전등기를 해 주었는데, 乙이이를 丙에게 매도하고 소유권이전등기를 해 주었다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 甲과 乙사이의 계약은 무효이다.\n② 甲과 乙사이의 계약은 채권자취소권의 대상이 될 수 있다.\n③ 丙이 선의인 경우, 선의에 대한 과실의 유무를 묻지 않고 丙이 소유권을 취득한다.\n④ 丙이 악의라는 사실에 관한 증명책임은 허위표시의 무효를 주장하는 자에게 있다.\n⑤ 만약 악의의 丙이 선의의 丁에게 X부동산을 매도하고 소유권이전등기를 해 주더라도 丁은 소유권을 취득하지 못한다.","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",7,0],[35,2024,11,43,1,"민법총칙","의사표시(착오·사기·통정허위)","박스형(모두고르기), 판례, 옳은것 고르기","착오로 인한 의사표시에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 착오로 인한 의사표시의 취소는 선의의 제3자에게 대항하지 못한다.\nㄴ. 의사표시의 상대방이 의사표시자의 착오를 알고 이용한 경우, 착오가 중대한 과실로 인한 것이 라도 의사표시자는 의사표시를 취소할 수 있다.\nㄷ. X토지를 계약의 목적물로 삼은 당사자가 모두 지번에 착오를 일으켜 계약서에 목적물을 Y토지로 표시한 경우, 착오를 이유로 의사표시를 취소할 수 있다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",7,0],[35,2024,11,44,1,"민법총칙","의사표시(착오·사기·통정허위)","박스형(모두고르기), 판례, 옳은것 고르기","사기ㆍ강박에 의한 의사표시에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 아파트 분양자가 아파트단지 인근에 대규모 공동 묘지가 조성된 사실을 알면서 수분양자에게 고지하지 않은 경우, 이는 기망행위에 해당한다.\nㄴ. 교환계약의 당사자가 목적물의 시가를 묵비한 것은 원칙적으로 기망행위에 해당한다.\nㄷ. ‘제3자의 강박’에 의한 의사표시에서 상대방의 대리인은 제3자에 포함되지 않는다. 2024년 제35회 공인중개\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",7,0],[35,2024,11,45,1,"민법총칙","의사표시(착오·사기·통정허위)","박스형(모두고르기), 옳은것 고르기","의사표시의 취소에 관한 설명으로 옳은 것을 모두고른 것은?\nㄱ. 취소권은 추인할 수 있는 날로부터 10년이 경 과하더라도 행사할 수 있다.\nㄴ. 강박에 의한 의사표시를 한 자는 강박상태를 벗어나기 전에도 이를 취소할 수 있다.\nㄷ. 취소할 수 있는 법률행위의 상대방이 확정되 었더라도 상대방이 그 법률행위로부터 취득한 권리를 제3자에게 양도하였다면 취소의 의사표시는 그 제3자에게 해야 한다.\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄴ ⑤ ㄴ, ㄷ","2","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",7,0],[35,2024,11,46,1,"민법총칙","의사표시(착오·사기·통정허위)","판례, 옳은것 고르기","甲의 乙에 대한 의사표시에 관한 설명으로 옳은 것은?\n(다툼이 있으면 판례에 따름)\n① 甲이 부동산 매수청약의 의사표시를 발송한 후 사망하였다면 그 효력은 발생하지 않는다.\n② 乙이 의사표시를 받은 때에 제한능력자이더라도 甲은 원칙적으로 그 의사표시의 효력을 주장할 수 있다.\n③ 甲의 의사표시가 乙에게 도달되었다고 보기 위해서는 乙이 그 내용을 알았을 것을 요한다.\n④ 甲의 의사표시가 등기우편의 방법으로 발송된 경우, 상당한 기간 내에 도달되었다고 추정할 수 없다.\n⑤ 乙이 정당한 사유 없이 계약해지 통지의 수령을 거절한 경우, 乙이 그 통지의 내용을 알 수 있는 객관적 상태에 놓여 있는 때에 의사표시의 효력이 생긴다.","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",7,0],[35,2024,11,47,1,"민법총칙","대리(무권대리·표현대리)","판례, 옳은것 고르기","계약의 무권대리에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 본인이 추인하면 특별한 사정이 없는 한 그때부터 계약의 효력이 생긴다.\n② 본인의 추인의 의사표시는 무권대리행위로 인한 권리의 승계인에 대하여는 할 수 없다.\n③ 계약 당시 무권대리행위임을 알았던 상대방은 본인의 추인이 있을 때까지 의사표시를 철회할 수 있다.\n④ 무권대리의 상대방은 상당한 기간을 정하여 본인에게 추인여부의 확답을 최고할 수 있고, 본인이 그 기간 내에 확답을 발하지 않으면 추인한 것으로 본다.\n⑤ 본인이 무권대리행위를 안 후 그것이 자기에게 효력이 없다고 이의를 제기하지 않고 이를 장시간 방치한 사실 만으로는 추인하였다고 볼 수 없다.","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",7,0],[35,2024,11,48,1,"민법총칙","대리(무권대리·표현대리)","박스형(모두고르기), 판례, 옳은것 고르기","甲은 자신의 토지에 관한 매매계약 체결을 위해 乙 에게 대리권을 수여하였고, 乙은 甲의 대리인으로서 丙과 매매계약을 체결하였다. 다음 설명 중 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 乙은 원칙적으로 복대리인을 선임할 수 있다.\nㄴ. 乙은 특별한 사정이 없는 한 계약을 해제할 권한이 없다.\nㄷ. 乙이 丙에게 甲의 위임장을 제시하고 계약을 체결하면서 계약서상 매도인을 乙로 기재한 경우, 특별한 사정이 없는 한 甲에게 그 계약의 효력이 미치지 않는다.\n① ㄴ ② ㄷ ③ ㄱ, ㄴ ④ ㄱ, ㄷ ⑤ ㄴ, ㄷ","1","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",8,0],[35,2024,11,49,1,"민법총칙","무효·취소·추인","틀린것 고르기","취소할 수 있는 법률행위의 법정추인 사유가 아닌 것은?\n① 혼동\n② 경개\n③ 취소권자의 이행청구\n④ 취소권자의 강제집행\n⑤ 취소권자인 채무자의 담보제공","1","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",8,0],[35,2024,11,50,1,"민법총칙","법률행위(반사회·불공정)","판례, 틀린것 고르기","법률행위의 부관에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 조건의사가 있더라도 외부에 표시되지 않으면 그것만 으로는 조건이 되지 않는다.\n② 기한이익 상실특약은 특별한 사정이 없는 한 정지조건부 기한이익 상실특약으로 추정한다.\n③ 조건을 붙일 수 없는 법률행위에 조건을 붙인 경우, 다른 정함이 없으면 그 법률행위 전부가 무효로 된다.\n④ ‘정지조건부 법률행위에 해당한다는 사실’에 대한 증명책임은 그 법률행위로 인한 법률효과의 발생을 다투는 자에게 있다.\n⑤ 불확정한 사실이 발생한 때를 이행기한으로 정한 경우, 그 사실의 발생이 불가능하게 된 때에도 기한이 도래한 것으로 보아야 한다.","2","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",8,0],[35,2024,11,51,1,"물권법","물권 일반","판례, 옳은것 고르기","물권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 관습법에 의한 물권은 인정되지 않는다.\n② 저당권은 법률규정에 의해 성립할 수 없다.\n③ 부동산 물권변동에 관해서 공신의 원칙이 인정된다.\n④ 1필 토지의 일부에 대해서는 저당권이 성립할 수 없다.\n⑤ 물건의 집단에 대해서는 하나의 물권이 성립하는 경우가 없다. 2024년 제35회 공인중개","4","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",8,0],[35,2024,11,52,1,"계약법","매매(계약금·담보책임·환매)","박스형(모두고르기), 판례","등기 없이도 부동산 물권취득의 효력이 있는 경우를 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 매매\nㄴ. 건물신축\nㄷ. 점유시효취득\nㄹ. 공유물의 현물분할판결\n① ㄱ, ㄴ ② ㄴ, ㄷ ③ ㄴ, ㄹ\n④ ㄷ, ㄹ ⑤ ㄱ, ㄷ, ㄹ","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",8,0],[35,2024,11,53,1,"물권법","점유권","판례, 틀린것 고르기","점유보호청구권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n\n① 점유권에 기인한 소는 본권에 관한 이유로 재판하지 못한다.\n\n② 과실 없이 점유를 방해하는 자에 대해서도 방해배제를 청구할 수 있다.\n\n③ 점유자가 사기를 당해 점유를 이전한 경우, 점유물반환을 청구할 수 없다.\n\n④ 공사로 인하여 점유의 방해를 받은 경우, 그 공사가 완성한 때에는 방해의 제거를 청구하지 못한다.\n\n⑤ 타인의 점유를 침탈한 뒤 제3자에 의해 점유를 침탈당한 자는 점유물반환청구권의 상대방이 될 수 있다.","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",8,0],[35,2024,11,54,1,"물권법","물권변동·등기","판례, 옳은것 고르기","甲은 자신의 토지를 乙에게 매도하여 인도하였고, 乙 은 그 토지를 점유․사용하다가 다시 丙에게 매도하여 인도하였다. 甲과 乙은 모두 대금 전부를 수령하였고, 甲ㆍ乙ㆍ丙 사이에 중간생략등기의 합의가 있었다. 다음 설명 중 옳은 것은?(다툼이 있으면 판례에 따름)\n① 甲은 丙을 상대로 소유물반환을 청구할 수 있다.\n② 甲은 乙을 상대로 소유물반환을 청구할 수 없다.\n③ 丙은 직접 甲을 상대로 소유권이전등기를 청구할 수 없다.\n④ 丙은 乙을 대위하여 甲을 상대로 소유권이전등기를 청구할 수 없다.\n⑤ 만약 乙이 인도받은 후 현재 10년이 지났다면, 乙은 甲에 대해 소유권이전등기를 청구할 수 없다.","2","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",8,0],[35,2024,11,55,1,"물권법","공동소유","판례, 틀린것 고르기","부동산 공유에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 공유물의 보존행위는 공유자 각자가 할 수 있다.\n② 공유자는 공유물 전부를 지분의 비율로 사용ㆍ수익할 수 있다.\n③ 공유자는 다른 공유자의 동의 없이 공유물을 처분하거나 변경하지 못한다.\n④ 공유자는 자신의 지분에 관하여 단독으로 제3자의 취득시효를 중단시킬 수 없다.\n⑤ 공유물 무단점유자에 대한 차임 상당 부당이득반환청구 권은 특별한 사정이 없는 한 각 공유자에게 지분 비율만큼 귀속된다.","4","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",8,0],[35,2024,11,56,1,"계약법","매매(계약금·담보책임·환매)","박스형(모두고르기), 판례, 옳은것 고르기","공유물분할에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 재판상 분할에서 분할을 원하는 공유자의 지 분만큼은 현물분할하고, 분할을 원하지 않는 공유자는 계속 공유로 남게 할 수 있다.\nㄴ. 토지의 협의분할은 등기를 마치면 그 등기가 접수된 때 물권변동의 효력이 있다.\nㄷ. 공유자는 다른 공유자가 분할로 인하여 취득한 물건에 대하여 그 지분의 비율로 매도인과 동일한 담보책임이 있다.\nㄹ. 공유자 사이에 이미 분할협의가 성립하였는데 일부 공유자가 분할에 따른 이전등기에 협조하지 않은 경우, 공유물분할소송을 제기할 수 없다.\n① ㄱ ② ㄴ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",9,0],[35,2024,11,57,1,"물권법","점유권","판례, 틀린것 고르기","甲소유 토지에 乙이 무단으로 건물을 신축한 뒤 丙에게 임대하여 丙이 현재 그 건물을 점유하고 있다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 甲은 丙을 상대로 건물에서의 퇴거를 청구할 수 없다.\n② 甲은 乙을 상대로 건물의 철거 및 토지의 인도를 청구할 수 있다.\n③ 甲은 乙을 상대로 토지의 무단 사용을 이유로 부당이득반환청구권을 행사할 수 있다.\n④ 만약 乙이 임대하지 않고 스스로 점유하고 있다면, 甲은 乙을 상대로 건물에서의 퇴거를 청구할 수 없다.\n⑤ 만약 丙이 무단으로 건물을 점유하고 있다면, 乙은 丙을 상대로 건물의 인도를 청구할 수 있다.","1","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",9,0],[35,2024,11,58,1,"계약법","계약의 성립(청약·승낙)","박스형(모두고르기), 판례, 옳은것 고르기","분묘기지권에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 분묘기지권은 봉분 등 외부에서 분묘의 존재를 인식할 수 있는 형태를 갖추고 등기하여야 성립한다.\nㄴ. 토지소유자의 승낙을 얻어 분묘를 설치함으로 써 분묘기지권을 취득한 경우, 설치할 당시 토지소유자와의 합의에 의하여 정한 지료지급의 무의 존부나 범위의 효력은 그 토지의 승계인 에게는 미치지 않는다.\nㄷ. 자기 소유 토지에 분묘를 설치한 사람이 그 토지를 양도하면서 분묘를 이장하겠다는 특약을 하지 않음으로써 분묘기지권을 취득한 경우, 분묘기지권자는 특별한 사정이 없는 한 분묘기지권이 성립한 때부터 지료를 지급할 의무가 있다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ 2024년 제35회 공인중개","2","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",9,0],[35,2024,11,59,1,"물권법","지역권","틀린것 고르기","지역권에 관한 설명으로 틀린 것은?\n① 지역권은 요역지와 분리하여 양도할 수 없다.\n② 지역권은 표현된 것이 아니더라도 시효취득할 수 있다.\n③ 요역지의 소유권이 이전되면 다른 약정이 없는 한 지역 권도 이전된다.\n④ 요역지의 공유자 1인은 그 토지 지분에 관한 지역권을 소멸시킬 수 없다.\n⑤ 공유자의 1인이 지역권을 취득한 때에는 다른 공유자도 지역권을 취득한다.","2","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",9,0],[35,2024,11,60,1,"물권법","전세권","틀린것 고르기","전세권에 관한 설명으로 틀린 것은?\n① 전세금의 반환은 전세권말소등기에 필요한 서류를 교부하기 전에 이루어져야 한다.\n② 전세권자는 전세권설정자에 대하여 통상의 수선에 필요한 비용의 상환을 청구할 수 없다.\n③ 전전세한 목적물에 불가항력으로 인한 손해가 발생한 경우, 그 손해가 전전세하지 않았으면 면할 수 있는 것 이었던 때에는 전세권자는 그 책임을 부담한다.\n④ 대지와 건물을 소유한 자가 건물에 대해서만 전세권을 설정한 후 대지를 제3자에게 양도한 경우, 제3자는 전세권설정자에 대하여 대지에 대한 지상권을 설정한 것으로 본다.\n⑤ 타인의 토지에 지상권을 설정한 자가 그 위에 건물을 신축하여 그 건물에 전세권을 설정한 경우, 그 건물소 유자는 전세권자의 동의 없이 지상권을 소멸하게 하는 행위를 할 수 없다.","1","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",9,0],[35,2024,11,61,1,"물권법","유치권","판례, 틀린것 고르기","민법상 유치권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 권리금반환청구권은 유치권의 피담보채권이 될 수 없다.\n② 유치권의 행사는 피담보채권 소멸시효의 진행에 영향을 미치지 않는다.\n③ 공사대금채권에 기하여 유치권을 행사하는 자가 스스로 유치물인 주택에 거주하며 사용하는 것은 특별한 사정이 없는 한 유치물의 보존에 필요한 사용에 해당한다.\n④ 유치권에 의한 경매가 목적부동산 위의 부담을 소멸시 키는 법정매각조건으로 실시된 경우, 그 경매에서 유치권자는 일반채권자보다 우선하여 배당을 받을 수 있다.\n⑤ 건물신축공사를 도급받은 수급인이 사회통념상 독립한 건물이 되지 못한 정착물을 토지에 설치한 상태에서 공사가 중단된 경우, 수급인은 그 정착물에 대하여 유치권을 행사할 수 없다.","4","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",9,0],[35,2024,11,62,1,"물권법","지상권(법정지상권·분묘기지권)","박스형(모두고르기), 판례, 옳은것 고르기","저당물의 경매로 토지와 건물의 소유자가 달라지는 경우에 성립하는 법정지상권에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 토지에 관한 저당권설정 당시 해당 토지에 일시사용을 위한 가설건축물이 존재하였던 경우, 법정지상권은 성립하지 않는다.\nㄴ. 토지에 관한 저당권설정 당시 존재하였던 건물이 무허가건물인 경우, 법정지상권은 성립하지 않는다.\nㄷ. 지상건물이 없는 토지에 저당권을 설정받으면서 저당권자가 신축 개시 전에 건축을 동의한 경우, 법정지상권은 성립하지 않는다.\n① ㄴ ② ㄷ ③ ㄱ, ㄴ\n④ ㄱ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","4","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",10,0],[35,2024,11,63,1,"물권법","저당권·근저당권","계산","甲은 2020. 1. 1. 乙에게 1억원을 대여하면서 변제기\n2020. 12. 31., 이율 연 5 %, 이자는 매달 말일 지급하기로 약정하였고, 그 담보로 당일 乙소유 토지에 저당권을 취득하였다. 乙이 차용일 이후부터 한 번도 이자를 지급하지 않았고, 甲은 2023. 7. 1. 저당권실행을 위한 경매를 신청하였다. 2023. 12. 31. 배당절차에서 배당재원 3억원으로 배당을 실시하게 되었는데, 甲은 총 1억 2,000만원의 채권신고서를 제출하였다. 甲의 배당금액은?(甲보다 우선하는 채권자는 없으나 2억원의 후순위저당권자가 있고, 공휴일 및 소멸시효와 이자에 대한 지연손해금 등은 고려하지 않음)\n① 1억 500만원 ② 1억 1,000만원 ③ 1억 1,500만원\n④ 1억 1,750만원 ⑤ 1억 2,000만원","2","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",10,0],[35,2024,11,64,1,"물권법","저당권·근저당권","박스형(모두고르기), 판례, 옳은것 고르기","근저당권에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 채무자가 아닌 제3자도 근저당권을 설정할 수 있다.\nㄴ. 피담보채무 확정 전에는 채무자를 변경할 수 있다.\nㄷ. 근저당권에 의해 담보될 채권최고액에 채무의 이자는 포함되지 않는다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",10,0],[35,2024,11,65,1,"계약법","계약 일반","옳은것 고르기","민법상 계약에 관한 설명으로 옳은 것은?\n① 매매계약은 요물계약이다.\n② 도급계약은 편무계약이다.\n③ 교환계약은 무상계약이다.\n④ 증여계약은 요식계약이다.\n⑤ 임대차계약은 유상계약이다. 2024년 제35회 공인중개사","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",10,0],[35,2024,11,66,1,"계약법","계약의 성립(청약·승낙)","판례, 틀린것 고르기","계약의 성립과 내용에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 격지자간의 계약은 승낙의 통지를 발송한 때에 성립한다.\n② 관습에 의하여 승낙의 통지가 필요하지 않는 경우, 계약은 승낙의 의사표시로 인정되는 사실이 있는 때에 성립한다.\n③ 당사자간에 동일한 내용의 청약이 상호교차된 경우, 양 청약이 상대방에게 도달한 때에 계약이 성립한다.\n④ 승낙자가 청약에 대하여 변경을 가하여 승낙한 때에는 그 청약의 거절과 동시에 새로 청약한 것으로 본다.\n⑤ 선시공ㆍ후분양이 되는 아파트의 경우, 준공 전 그 외 형ㆍ재질에 관하여 분양광고에만 표현된 내용은 특별한 사정이 없는 한 분양계약의 내용이 된다.","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",10,0],[35,2024,11,67,1,"계약법","매매(계약금·담보책임·환매)","박스형(모두고르기), 판례, 옳은것 고르기","계약체결상의 과실책임에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 계약이 의사의 불합치로 성립하지 않는다는 사실을 알지 못하여 손해를 입은 당사자는 계약체결 당시 그 계약이 불성립될 수 있다는 것을 안 상대방에게 계약체결상의 과실책임을 물을 수 있다.\nㄴ. 부동산 수량지정 매매에서 실제면적이 계약면적에 미달하는 경우, 그 부분의 원시적 불능을 이유로 계약체결상의 과실책임을 물을 수 없다.\nㄷ. 계약체결 전에 이미 매매목적물이 전부 멸실된 사실을 알지 못하여 손해를 입은 계약당사자는 계약체결 당시 그 사실을 안 상대방에게 계약체결상의 과실책임을 물을 수 있다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","전항정답","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",10,0],[35,2024,11,68,1,"계약법","동시이행·위험부담","판례, 틀린것 고르기","동시이행의 항변권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 서로 이행이 완료된 쌍무계약이 무효로 된 경우, 당사자 사이의 반환의무는 동시이행관계에 있다.\n② 구분소유적 공유관계가 해소된 경우, 공유지분권자 상호간의 지분이전등기의무는 동시이행관계에 있다.\n③ 동시이행의 항변권이 붙어 있는 채권은 특별한 사정이 없는 한 이를 자동채권으로 하여 상계하지 못한다.\n④ 양 채무의 변제기가 도래한 쌍무계약에서 수령지체에 빠진 자는 이후 상대방이 자기 채무의 이행제공 없이 이행을 청구하는 경우, 동시이행의 항변권을 행사할 수 있다.\n⑤ 채무를 담보하기 위해 채권자 명의의 소유권이전등기가 된 경우, 피담보채무의 변제의무와 그 소유권이전등기의 말소의무는 동시이행관계에 있다.","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",10,0],[35,2024,11,69,1,"계약법","매매(계약금·담보책임·환매)","박스형(모두고르기), 판례, 옳은것 고르기","甲은 X건물을 乙에게 매도하고 乙로부터 계약금을 지급받았는데, 그 후 甲과 乙의 귀책사유 없이 X건물이 멸실되었다. 다음 설명 중 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 甲은 乙에게 잔대금의 지급을 청구할 수 있다.\nㄴ. 乙은 甲에게 계약금의 반환을 청구할 수 있다.\nㄷ. 만약 乙의 수령지체 중에 甲과 乙의 귀책사유 없이 X건물이 멸실된 경우, 乙은 甲에게 계약금의 반환을 청구할 수 있다.\n① ㄴ ② ㄷ ③ ㄱ, ㄴ ④ ㄱ, ㄷ ⑤ ㄴ, ㄷ","1","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",11,0],[35,2024,11,70,1,"민법총칙","의사표시(착오·사기·통정허위)","판례, 옳은것 고르기","매도인 甲과 매수인 乙사이에 매매대금을 丙에게 지급하기로 하는 제3자를 위한 계약을 체결하였고, 丙 이 乙에게 수익의 의사표시를 하였다. 다음 설명 중 옳은 것은?(다툼이 있으면 판례에 따름)\n① 乙의 대금채무 불이행이 있는 경우, 甲은 丙의 동의 없이 乙과의 계약을 해제할 수 없다.\n② 乙의 기망행위로 甲과 乙의 계약이 체결된 경우, 丙은 사기를 이유로 그 계약을 취소할 수 있다.\n③ 甲과 丙의 법률관계가 무효인 경우, 특별한 사정이 없는 한 乙은 丙에게 대금지급을 거절할 수 있다.\n④ 乙이 매매대금을 丙에게 지급한 후에 甲과 乙의 계약이 취소된 경우, 乙은 丙에게 부당이득반환을 청구할 수 있다.\n⑤ 甲과 乙이 계약을 체결할 때 丙의 권리를 변경시킬 수 있음을 유보한 경우, 甲과 乙은 丙의 권리를 변경시킬 수 있다.","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",11,0],[35,2024,11,71,1,"계약법","해제·해지","판례","매도인 甲과 매수인 乙사이의 X주택에 관한 계약이 적법하게 해제된 경우, 해제 전에 이해관계를 맺은 자로서 ‘계약해제로부터 보호되는 제3자’에 해당하지 않는 자는?(다툼이 있으면 판례에 따름)\n① 乙의 소유권이전등기청구권을 압류한 자\n② 乙의 책임재산이 된 X주택을 가압류한 자\n③ 乙명의로 소유권이전등기가 된 X주택에 관하여 저당권을 취득한 자\n④ 乙과 매매예약에 따라 소유권이전등기청구권보전을 위한 가등기를 마친 자\n⑤ 乙명의로 소유권이전등기가 된 X주택에 관하여 주택임대차보호법상 대항요건을 갖춘 자","1","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",11,0],[35,2024,11,72,1,"계약법","매매(계약금·담보책임·환매)","판례, 틀린것 고르기","乙은 甲소유 X토지를 매수하고 계약금을 지급한 후 X토지를 인도받아 사용․수익하고 있다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 계약이 채무불이행으로 해제된 경우, 乙은 甲에게 X토지와 그 사용이익을 반환할 의무가 있다. 2024년 제35회 공인중개사\n② 계약이 채무불이행으로 해제된 경우, 甲은 乙로부터 받은 계약금에 이자를 가산하여 반환할 의무를 진다.\n③ 甲이 乙의 중도금 지급채무 불이행을 이유로 계약을 해제한 이후에도 乙은 착오를 이유로 계약을 취소할 수 있다.\n④ 만약 甲의 채권자가 X토지를 가압류하면, 乙은 이를 이유로 계약을 즉시 해제할 수 있다.\n⑤ 만약 乙명의로 소유권이전등기가 된 후 계약이 합의해제 되면, X토지의 소유권은 甲에게 당연히 복귀한다.","4","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",11,0],[35,2024,11,73,1,"계약법","임대차(민법)","판례, 옳은것 고르기","건물소유를 목적으로 하는 토지임차인의 지상물매수 청구권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 지상 건물을 타인에게 양도한 임차인도 매수청구권을 행사할 수 있다.\n② 임차인은 저당권이 설정된 건물에 대해서는 매수청구권을 행사할 수 없다.\n③ 토지소유자가 아닌 제3자가 토지를 임대한 경우, 임대인은 특별한 사정이 없는 한 매수청구권의 상대방이 될 수 없다.\n④ 임대인이 임차권 소멸 당시에 이미 토지소유권을 상실하였더라도 임차인은 그에게 매수청구권을 행사할 수 있다.\n⑤ 기간의 정함이 없는 임대차에서 임대인의 해지통고에 의하여 임차권이 소멸된 경우, 임차인은 매수청구권을 행사할 수 없다.","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",11,0],[35,2024,11,74,1,"계약법","매매(계약금·담보책임·환매)","판례, 틀린것 고르기, 계산","甲은 자신의 X주택을 보증금 2억원, 월차임 50만원으로 乙에게 임대하였는데, 乙이 전입신고 후 X주택을 점유․사용하면서 차임을 연체하다가 계약이 종료되었다. 계약 종료 전에 X주택의 소유권이 매매를 원인으로 丙에게 이전되었다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 특별한 사정이 없는 한 丙이 임대인의 지위를 승계한 것으로 본다.\n② 연체차임에 대한 지연손해금의 발생종기는 특별한 사정이 없는 한 X주택이 반환되는 때이다.\n③ 丙은 甲의 차임채권을 양수하지 않았다면 X주택을 반환받을 때 보증금에서 이를 공제할 수 없다.\n④ X주택을 반환할 때까지 잔존하는 甲의 차임채권은 압류가 되었더라도 보증금에서 당연히 공제된다.\n⑤ X주택을 반환하지 않으면, 특별한 사정이 없는 한 乙은 보증금이 있음을 이유로 연체차임의 지급을 거절할 수 없다.","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",11,0],[35,2024,11,75,1,"민사특별법","주택임대차보호법","판례","임차인 乙은 임대인 甲에게 2024. 3. 10.로 기간이 만료되는 X주택의 임대차계약에 대해 주택임대차보호법에 따라 갱신요구 통지를 하여 그 통지가 2024.\n1. 5. 甲에게 도달하였고, 甲이 갱신거절 통지를 하지 않아 계약이 갱신되었다. 그 후 乙이 갱신된 계약기 간이 개시되기 전인 2024. 1. 29. 갱신된 임대차계약의 해지를 통지하여 2024. 1. 30. 甲에게 도달하였다. 임대차계약의 종료일은?(다툼이 있으면 판례에 따름)\n① 2024. 1. 30. ② 2024. 3. 10. ③ 2024. 4. 30.\n④ 2024. 6. 10. ⑤ 2026. 3. 10.","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",12,0],[35,2024,11,76,1,"민사특별법","집합건물법","틀린것 고르기","집합건물의 소유 및 관리에 관한 법률상 관리인에 관한 설명으로 틀린 것은?\n① 관리인은 구분소유자여야 한다.\n② 관리인은 공용부분의 보존행위를 할 수 있다.\n③ 관리인의 임기는 2년의 범위에서 규약으로 정한다.\n④ 관리인은 규약에 달리 정한 바가 없으면 관리위원회의 위원이 될 수 없다.\n⑤ 관리인의 대표권은 제한할 수 있지만, 이를 선의의 제3자에게 대항할 수 없다.","1","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",12,0],[35,2024,11,77,1,"물권법","물권변동·등기","판례, 틀린것 고르기, 계산","甲은 乙에게 무이자로 빌려준 1억원을 담보하기 위해, 丙명의의 저당권(피담보채권 5,000만원)이 설정된 乙소유의 X건물(시가 2억원)에 관하여 담보가등기를 마쳤고, 乙은 변제기가 도래한 甲에 대한 차용금을 지급하지 않고 있다. 다음 설명 중 틀린 것은?\n(다툼이 있으면 판례에 따름)\n① 甲이 귀속정산절차에 따라 적법하게 X건물의 소유권을 취득하면 丙의 저당권은 소멸한다.\n② 甲이 乙에게 청산금을 지급하지 않고 자신의 명의로 본등기를 마친 경우, 그 등기는 무효이다.\n③ 甲의 청산금지급채무와 乙의 가등기에 기한 본등기 및 X건물 인도채무는 동시이행관계에 있다.\n④ 경매절차에서 丁이 X건물의 소유권을 취득하면 특별한 사정이 없는 한 甲의 가등기담보권은 소멸한다.\n⑤ 만약 청산금이 없는 경우, 적법하게 실행통지를 하여 2개월의 청산기간이 지나면 청산절차의 종료와 함께 X건물에 대한 사용ㆍ수익권은 甲에게 귀속된다.","1","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",12,0],[35,2024,11,78,1,"민사특별법","부동산실명법(명의신탁)","판례, 옳은것 고르기","甲은 친구 乙과의 명의신탁약정에 따라 2024. 3. 5. 자신의 X부동산을 乙명의로 소유권이전등기를 해 주 었고, 그 후 乙은 丙에게 이를 매도하고 丙명의로 소유권이전등기를 해 주었다. 다음 설명 중 옳은 것은?(다툼이 있으면 판례에 따름)\n① 甲은 乙을 상대로 불법행위로 인한 손해배상을 청구할 수 있다.\n② 甲과 乙의 명의신탁약정으로 인해 乙과 丙의 매매계약은 무효이다. 2024년 제35회 공인중개사\n③ 甲은 丙을 상대로 X부동산에 관한 소유권이전등기말소를 청구할 수 있다.\n④ 甲은 乙을 상대로 명의신탁약정 해지를 원인으로 하는 소유권이전등기를 청구할 수 있다.\n⑤ 만약 乙이 X부동산의 소유권을 丙으로부터 다시 취득한다면, 甲은 乙을 상대로 소유권에 기하여 이전등기를 청구할 수 있다.","1","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",12,0],[35,2024,11,79,1,"민사특별법","상가건물임대차보호법","판례, 계산","임차인 乙은 甲소유의 X상가건물에 관하여 월차임 200만원, 기간 2023. 5. 24. ～ 2024. 5. 23.로 하는 임대차계약을 甲과 체결하였고, 기간만료 14일 전인\n2024. 5. 9. 갱신거절의 통지를 하여 다음날 甲에게 도달하였다. 임대차계약의 종료일은?(다툼이 있으면 판례에 따름)\n① 2024. 5. 10. ② 2024. 5. 23. ③ 2024. 8. 23.\n④ 2024. 11. 23. ⑤ 2025. 5. 23.","2","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",12,0],[35,2024,11,80,1,"민사특별법","상가건물임대차보호법","판례, 옳은것 고르기, 계산","상가건물임대차보호법이 적용되는 X건물에 관하여 임대인 甲과 임차인 乙이 보증금 3억원, 월차임 60만원으로 정하여 체결한 임대차가 기간만료로 종료되 었다. 그런데 甲이 乙에게 보증금을 반환하지 않아서 乙이 현재 X건물을 점유ㆍ사용하고 있다. 다음 설명 중 옳은 것은?(다툼이 있으면 판례에 따름)\n① 甲은 乙에게 불법행위로 인한 손해배상을 청구할 수 있다.\n② 乙은 甲에 대해 채무불이행으로 인한 손해배상의무를 진다.\n③ 甲은 乙에게 차임에 상당하는 부당이득반환을 청구할 수 있다.\n④ 甲은 乙에게 종전 임대차계약에서 정한 차임의 지급을 청구할 수 있다.\n⑤ 乙은 보증금을 반환받을 때까지 X건물에 대해 유치권을 행사할 수 있다.","4","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",12,0],[35,2024,21,1,2,"공인중개사법","정책심의위원회·자격·시험","옳은것 고르기","공인중개사법령상 공인중개사 정책심의위원회(이하 “위원회”라 함)에 관한 설명으로 옳은 것은?\n① 위원회는 국무총리 소속으로 한다.\n② 손해배상책임의 보장에 관한 사항은 위원회의 심의사항에 해당하지 않는다.\n③ 위원회 위원장은 위원이 제척사유에 해당하는 데에도 불구하고 회피하지 아니한 경우에는 해당 위원을 해촉 할 수 있다.\n④ 위원회에서 심의한 중개보수 변경에 관한 사항의 경우 시ㆍ도지사는 이에 따라야 한다.\n⑤ 국토교통부장관이 직접 공인중개사자격시험을 시행하려는 경우에는 위원회의 의결을 미리 거쳐야 한다.","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",1,0],[35,2024,21,2,2,"공인중개사법","거래정보망·기타","","공인중개사법령상 법인인 개업공인중개사가 중개업과 함께 할 수 없는 업무는?(단, 다른 법률의 규정은 고려하지 않음)\n① 주택의 임대업\n② 상업용 건축물의 분양대행\n③ 부동산의 이용ㆍ개발 및 거래에 관한 상담\n④ 중개의뢰인의 의뢰에 따른 도배ㆍ이사업체의 소개\n⑤ 개업공인중개사를 대상으로 한 중개업의 경영기법 및 경영정보의 제공","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",1,0],[35,2024,21,3,2,"공인중개사법","휴업·폐업","틀린것 고르기","공인중개사법령상 개업공인중개사의 휴업의 신고 등에 관한 설명으로 틀린 것은?\n① 법인인 개업공인중개사가 4개월간 분사무소의 휴업을 하려는 경우 휴업신고서에 그 분사무소설치 신고확인서를 첨부하여 분사무소의 휴업신고를 해야 한다.\n② 개업공인중개사가 신고한 휴업기간을 변경하려는 경우 휴업기간 변경신고서에 중개사무소등록증을 첨부하여 등록관청에 미리 신고해야 한다.\n③ 관할 세무서장이 ｢부가가치세법 시행령｣에 따라 공인중개사법령상의 휴업신고서를 함께 받아 이를 해당 등록관청에 송부한 경우에는 휴업신고서가 제출된 것으로 본다.\n④ 등록관청은 개업공인중개사가 대통령령으로 정하는 부득이한 사유가 없음에도 계속하여 6개월을 초과하여 휴업한 경우 중개사무소의 개설등록을 취소할 수 있다.\n⑤ 개업공인중개사가 휴업한 중개업을 재개하고자 등록관청에 중개사무소재개신고를 한 경우 해당 등록관청은 반납받은 중개사무소등록증을 즉시 반환해야 한다. 2024년 제35회 공인중개","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",1,0],[35,2024,21,4,2,"공인중개사법","확인·설명(서)","박스형(모두고르기), 틀린것 고르기","공인중개사법령상 공인중개사인 개업공인중개사 甲 과 그에 소속된 소속공인중개사 乙에 관한 설명으로 틀린 것을 모두 고른 것은?\nㄱ. 甲과 乙은 실무교육을 받은 후 2년마다 등록관청이 실시하는 연수교육을 받아야 한다.\nㄴ. 甲이 중개를 의뢰받아 乙의 중개행위로 중개가 완성되어 중개대상물 확인ㆍ설명서를 작성하는 경우 乙은 甲과 함께 그 확인ㆍ설명서에서명 또는 날인하여야 한다.\nㄷ. 乙이 甲과의 고용관계 종료 신고 후 1년 이내에 중개사무소의 개설등록을 신청한 경우 개설등록 후 1년 이내에 실무교육을 받아야 한다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",1,0],[35,2024,21,5,2,"공인중개사법","고용인(소속공인중개사·중개보조원)","옳은것 고르기","공인중개사법령상 고용인의 신고 등에 관한 설명으로 옳은 것은?\n① 등록관청은 중개보조원의 고용 신고를 받은 경우 이를 공인중개사협회에 통보하지 않아도 된다.\n② 개업공인중개사는 소속공인중개사를 고용한 경우에는 소속공인중개사가 업무를 개시한 날부터 10일 이내에 등록관청에 신고하여야 한다.\n③ 개업공인중개사가 고용할 수 있는 중개보조원의 수는 개업공인중개사와 소속공인중개사를 합한 수의 5배를 초과하여서는 아니 된다.\n④ 개업공인중개사는 소속공인중개사와의 고용관계가 종료된 때에는 고용관계가 종료된 날부터 30일 이내에 등록관청에 신고하여야 한다.\n⑤ 소속공인중개사에 대한 고용 신고를 받은 등록관청은 공인중개사협회에게 그 소속공인중개사의 공인중개사자격 확인을 요청하여야 한다.","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",1,0],[35,2024,21,6,2,"공인중개사법","금지행위·거래질서","틀린것 고르기","공인중개사법령상 부동산거래질서교란행위에 해당하지 않는 것은?\n① 공인중개사자격증 양도를 알선한 경우\n② 중개보조원이 중개업무를 보조하면서 중개의뢰인에게 본인이 중개보조원이라는 사실을 미리 알리지 않은 경우\n③ 개업공인중개사가 중개행위로 인한 손해배상책임을 보장하기 위하여 가입해야 하는 보증보험이나 공제에 가 입하지 않은 경우\n④ 개업공인중개사가 동일한 중개대상물에 대한 하나의 거래를 완성하면서 서로 다른 둘 이상의 거래계약서를 작성한 경우\n⑤ 개업공인중개사가 거래당사자 쌍방을 대리한 경우","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",1,0],[35,2024,21,7,2,"중개실무","경매·매수신청대리","박스형(모두고르기)","공인중개사법령상 개업공인중개사가 다음의 행위를 하기 위하여 법원에 등록해야 하는 것을 모두 고른 것은?\n(단, 법 제7638호 부칙 제6조제2항은 고려하지 않음)\nㄱ. ｢민사집행법｣에 의한 경매대상 부동산의 매수신청의 대리\nㄴ. ｢국세징수법｣에 의한 공매대상 부동산의 입찰신청의 대리\nㄷ. 중개행위에 사용할 인장의 변경\nㄹ. 중개행위로 인한 손해배상책임을 보장하기 위한 보증보험의 가입\n① ㄱ ② ㄱ, ㄴ ③ ㄴ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄱ, ㄷ, ㄹ","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",2,0],[35,2024,21,8,2,"공인중개사법","손해배상책임·보증·계약금 예치","박스형(모두고르기)","공인중개사법령상 소속공인중개사를 둔 개업공인중개사가 중개사무소 안의 보기 쉬운 곳에 게시하여야 하는 것을 모두 고른 것은?\nㄱ. 소속공인중개사의 공인중개사자격증 원본\nㄴ. 보증의 설정을 증명할 수 있는 서류\nㄷ. 소속공인중개사의 고용신고서\nㄹ. 개업공인중개사의 실무교육 수료확인증\n① ㄱ, ㄴ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄹ","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",2,0],[35,2024,21,9,2,"공인중개사법","중개사무소 개설등록·결격사유","틀린것 고르기","공인중개사법령상 중개사무소의 개설등록에 관한 설명으로 틀린 것은?\n① 금고 이상의 형의 집행유예를 받고 그 유예기간이 만료된 날부터 2년이 지나지 아니한 자는 개설등록을 할 수 없다.\n② 공인중개사협회는 매월 중개사무소의 등록에 관한 사항을 중개사무소등록ㆍ행정처분등통지서에 기재하여 다음 달 10일까지 시․도지사에게 통보하여야 한다.\n③ 외국에 주된 영업소를 둔 법인의 경우에는 ｢상법｣상 외국회사 규정에 따른 영업소의 등기를 증명할 수 있는 서류를 제출하여야 한다.\n④ 개설등록의 신청을 받은 등록관청은 개업공인중개사의 종별에 따라 구분하여 개설등록을 하고, 개설등록 신청을 받은 날부터 7일 이내에 등록신청인에게 서면으로 통지하여야 한다.\n⑤ 공인중개사인 개업공인중개사가 법인인 개업공인중개사로 업무를 하고자 개설등록신청서를 다시 제출하는 경우 종전의 등록증은 이를 반납하여야 한다.","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",2,0],[35,2024,21,10,2,"공인중개사법","중개계약(일반·전속)","틀린것 고르기","공인중개사법령상 개업공인중개사와 중개의뢰인의 중개계약에 관한 설명으로 틀린 것은?\n① 일반중개계약은 계약서의 작성 없이도 체결할 수 있다.\n② 전속중개계약을 체결하면서 유효기간을 3개월 미만으로 약정한 경우 그 유효기간은 3개월로 한다.\n③ 전속중개계약을 체결한 개업공인중개사는 중개대상물의 권리자의 인적 사항에 관한 정보를 공개해서는 안 된다. 2024년 제35회 공인중개\n④ 중개의뢰인은 일반중개계약을 체결하면서 거래예정가격을 포함한 일반중개계약서의 작성을 요청할 수 있다.\n⑤ 임대차에 대한 전속중개계약을 체결한 개업공인중개사는 중개의뢰인의 비공개 요청이 없어도 중개대상물의 공시지가를 공개하지 아니할 수 있다.","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",2,0],[35,2024,21,11,2,"공인중개사법","거래정보망·기타","옳은것 고르기","공인중개사법령상 부동산거래정보망의 지정 및 이용에 관한 설명으로 옳은 것은?\n① ｢전기통신사업법｣의 규정에 의한 부가통신사업자가 아니어도 국토교통부령으로 정하는 요건을 갖추면 거래정보사업자로 지정받을 수 있다.\n② 거래정보사업자로 지정받으려는 자는 공인중개사의 자격을 갖추어야 한다.\n③ 거짓이나 그 밖의 부정한 방법으로 거래정보사업자로 지정받은 경우 그 지정은 무효이다.\n④ 법인인 거래정보사업자의 해산으로 부동산거래정보망의 계속적인 운영이 불가능한 경우 국토교통부장관은 청문 없이 그 지정을 취소할 수 있다.\n⑤ 부동산거래정보망에 정보가 공개된 중개대상물의 거래가 완성된 경우 개업공인중개사는 3개월 이내에 해당 거래정보사업자에게 이를 통보하여야 한다.","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",2,0],[35,2024,21,12,2,"공인중개사법","손해배상책임·보증·계약금 예치","","공인중개사법령상 개업공인중개사가 계약금등을 금융기관에 예치하도록 거래당사자에게 권고하는 경우 예치명의자가 될 수 없는 자는?\n① 개업공인중개사\n② 거래당사자 중 일방\n③ 부동산 거래계약의 이행을 보장하기 위하여 계약 관련서 류 및 계약금등을 관리하는 업무를 수행하는 전문회사\n④ 국토교통부장관의 승인을 얻어 공제사업을 하는 공인중개사협회\n⑤ ｢은행법｣에 따른 은행","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",2,0],[35,2024,21,13,2,"공인중개사법","표시·광고","박스형(모두고르기)","공인중개사법령상 누구든지 시세에 부당한 영향을 줄 목적으로 개업공인중개사등의 업무를 방해해서는 아니 되는 행위를 모두 고른 것은?\nㄱ. 중개의뢰인과 직접 거래를 하는 행위\nㄴ. 안내문, 온라인 커뮤니티 등을 이용하여 특정가격 이하로 중개를 의뢰하지 아니하도록 유 도하는 행위\nㄷ. 정당한 사유 없이 개업공인중개사등의 중개대상물에 대한 정당한 표시․광고 행위를 방해하는 행위\nㄹ. 단체를 구성하여 특정 중개대상물에 대하여 중개를 제한하거나 단체 구성원 이외의 자와 공동중개를 제한하는 행위\n① ㄱ, ㄷ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄴ, ㄷ, ㄹ","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",2,0],[35,2024,21,14,2,"공인중개사법","벌칙·과태료·포상금","","공인중개사법령상 다음의 행위를 한 자에 대하여 3 년의 징역에 처할 수 있는 경우는?\n① 거짓이나 그 밖의 부정한 방법으로 중개사무소의 개설등록을 한 경우\n② 공인중개사가 다른 사람에게 자기의 성명을 사용하여 중개업무를 하게 한 경우\n③ 등록관청의 관할 구역안에 2개의 중개사무소를 둔 경우\n④ 개업공인중개사가 천막 그 밖에 이동이 용이한 임시 중개시설물을 설치한 경우\n⑤ 공인중개사가 아닌 자로서 공인중개사 또는 이와 유사한 명칭을 사용한 경우","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",3,0],[35,2024,21,15,2,"공인중개사법","중개보수·실비","","공인중개사법령상 중개보수 등에 관한 설명으로 틀린 것은?\n① 개업공인중개사의 중개업무상 과실로 인하여 중개의뢰인간의 거래행위가 무효가 된 경우 개업공인중개사는 중개의뢰인으로부터 소정의 보수를 받을 수 없다.\n② 주택의 중개에 대한 보수는 중개의뢰인 쌍방으로부터 각각 받되, 그 금액은 시ㆍ도의 조례로 정하는 요율한도 이내에서 중개의뢰인과 개업공인중개사가 서로 협의하여 결정한다.\n③ 중개보수의 지급시기는 개업공인중개사와 중개의뢰인간의 약정에 따르되, 약정이 없을 때에는 중개대상물의 거래대금 지급이 완료된 날로 한다.\n④ 중개대상물인 주택의 소재지와 중개사무소의 소재지가 다른 경우 중개보수는 중개대상물의 소재지를 관할하는 시ㆍ도의 조례에서 정한 기준에 따라야 한다.\n⑤ 개업공인중개사는 중개의뢰인으로부터 중개대상물의 권리관계 등의 확인에 소요되는 실비를 받을 수 있다.","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",3,0],[35,2024,21,16,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","","공인중개사법령상 개업공인중개사 업무정지의 기준에서 개별기준에 따른 업무정지기간이 6개월인 것은?\n① 인장등록을 하지 않거나 등록하지 않은 인장을 사용한 경우\n② 거래정보사업자에게 공개를 의뢰한 중개대상물의 거래가 완성된 사실을 그 거래정보사업자에게 통보하지 않은 경우\n③ 부동산거래정보망에 중개대상물에 관한 정보를 거짓으로 공개한 경우\n④ 중개대상물 확인ㆍ설명서를 보존기간 동안 보존하지 않은 경우\n⑤ 법령상의 전속중개계약서 서식에 따르지 않고 전속중개계약을 체결한 경우","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",3,0],[35,2024,21,17,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","","공인중개사법령상 공인중개사인 개업공인중개사의 중개사무소 개설등록 취소 사유에 해당하지 않는 경우는?\n① 중개대상물 확인ㆍ설명서를 교부하지 아니한 경우\n② 거짓으로 중개사무소의 개설등록을 한 경우 2024년 제35회 공인중개\n③ 업무정지기간 중에 중개업무를 한 경우\n④ 공인중개사인 개업공인중개사가 개업공인중개사인 법인의 사원ㆍ임원이 된 경우\n⑤ 개업공인중개사가 사망한 경우","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",3,0],[35,2024,21,18,2,"공인중개사법","교육·협회·공제","틀린것 고르기","공인중개사법령상 국토교통부장관이 공인중개사협회의 공제사업 운영에 대한 개선조치로서 명할 수 있는 것이 아닌 것은?\n① 가치가 없다고 인정되는 자산의 손실 처리\n② 공제사업의 양도\n③ 불건전한 자산에 대한 적립금의 보유\n④ 업무집행방법의 변경\n⑤ 자산의 장부가격의 변경","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",3,0],[35,2024,21,19,2,"공인중개사법","확인·설명(서)","박스형(모두고르기)","공인중개사법령상 개업공인중개사가 중개를 완성한 때에 작성하는 거래계약서에 기재하여야 하는 사항을 모두 고른 것은?\nㄱ. 권리이전의 내용\nㄴ. 물건의 인도일시\nㄷ. 계약의 조건이나 기한이 있는 경우에는 그 조건 또는 기한\nㄹ. 중개대상물 확인ㆍ설명서 교부일자\n① ㄱ, ㄹ ② ㄴ, ㄷ ③ ㄱ, ㄴ, ㄷ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",3,0],[35,2024,21,20,2,"공인중개사법","확인·설명(서)","틀린것 고르기","공인중개사법령상 중개대상물 확인ㆍ설명서[Ⅱ] (비주거용 건축물)에서 개업공인중개사 기본 확인사항이 아닌 것은?\n① 토지의 소재지, 면적 등 대상물건의 표시\n② 소유권 외의 권리사항 등 등기부 기재사항\n③ 관리비\n④ 입지조건\n⑤ 거래예정금액","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",3,0],[35,2024,21,21,2,"공인중개사법","표시·광고","박스형(모두고르기)","공인중개사법령상 공인중개사협회의 업무에 해당하는 것을 모두 고른 것은?\nㄱ. 회원의 윤리헌장 제정 및 그 실천에 관한 업무\nㄴ. 부동산 정보제공에 관한 업무\nㄷ. 인터넷을 이용한 중개대상물에 대한 표시ㆍ광고 모니터링 업무\nㄹ. 회원의 품위유지를 위한 업무\n① ㄱ, ㄹ ② ㄴ, ㄷ ③ ㄱ, ㄴ, ㄷ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",3,0],[35,2024,21,22,2,"부동산거래신고법","토지거래허가","옳은것 고르기","부동산 거래신고 등에 관한 법령상 토지거래허가구역(이하 “허가구역”이라 함)의 지정에 관한 설명으로 옳은 것은?\n① 허가구역이 둘 이상의 시ㆍ도의 관할구역에 걸쳐 있는 경우 해당 시ㆍ도지사가 공동으로 지정한다.\n② 토지의 투기적인 거래 성행으로 지가가 급격히 상승하는 등의 특별한 사유가 있으면 7년 이내의 기간을 정하여 허가구역을 지정할 수 있다.\n③ 허가구역의 지정은 시장ㆍ군수 또는 구청장이 허가구역 지정의 통지를 받은 날부터 5일 후에 그 효력이 발생한다.\n④ 허가구역 지정에 관한 공고 내용의 통지를 받은 시장ㆍ군수 또는 구청장은 지체 없이 그 공고 내용을 관할 등기소의 장에게 통지해야 한다.\n⑤ 허가구역 지정에 관한 공고 내용의 통지를 받은 시장ㆍ군수 또는 구청장은 그 사실을 7일 이상 공고해야 하고, 그 공고 내용을 30일간 일반이 열람할 수 있도록 해야 한다.","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",4,0],[35,2024,21,23,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기","부동산 거래신고 등에 관한 법령상 부동산 거래계약의 변경신고사항이 아닌 것은?\n\n① 거래가격\n\n② 공동매수의 경우 매수인의 추가\n\n③ 거래 지분 비율\n\n④ 거래대상 부동산의 면적\n\n⑤ 거래 지분","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",4,0],[35,2024,21,24,2,"부동산거래신고법","주택임대차계약 신고","옳은것 고르기","부동산 거래신고 등에 관한 법령상 주택 임대차계약의 신고에 관한 설명으로 옳은 것은?(단, 다른 법률에 따른 신고의 의제는 고려하지 않음)\n① A특별자치시 소재 주택으로서 보증금이 6천만원이고 월 차임이 30만원으로 임대차계약을 신규 체결한 경우 신고 대상이다.\n② B시 소재 주택으로서 보증금이 5천만원이고 월 차임이 40만원으로 임대차계약을 신규 체결한 경우 신고 대상이 아니다.\n③ 자연인 甲과 ｢지방공기업법｣에 따른 지방공사 乙이 신고 대상인 주택 임대차계약을 체결한 경우 甲과 乙은 관할 신고관청에 공동으로 신고하여야 한다.\n④ C광역시 D군 소재 주택으로서 보증금이 1억원이고 월 차임이 100만원으로 신고된 임대차계약에서 보증금 및 차임의 증감 없이 임대차 기간만 연장하는 갱신계약은 신고 대상이 아니다.\n⑤ 개업공인중개사가 신고 대상인 주택 임대차계약을 중개한 경우 해당 개업공인중개사가 신고하여야 한다. 2024년 제35회 공인중개","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",4,0],[35,2024,21,25,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기","부동산 거래신고 등에 관한 법령상 부동산거래신고에 관한 설명으로 틀린 것은?\n① 거래당사자 또는 개업공인중개사는 부동산 거래계약 신고 내용 중 거래 지분 비율이 잘못 기재된 경우 신고관청에 신고 내용의 정정을 신청할 수 있다.\n② 자연인 甲이 단독으로 ｢주택법｣상 투기과열지구 외에 소재하는 주택을 실제 거래가격 6억원으로 매수한 경우 입주 예정 시기 등 그 주택의 이용계획은 신고사항이다.\n③ 법인이 주택의 매수자로서 거래계약을 체결한 경우 임대 등 그 주택의 이용계획은 신고사항이다.\n④ 부동산의 매수인은 신고인이 부동산거래계약 신고필증을 발급받은 때에 ｢부동산등기 특별조치법｣에 따른 검인을 받은 것으로 본다.\n⑤ 개업공인중개사가 신고한 후 해당 거래계약이 해제된 경우 그 계약을 해제한 거래당사자는 해제가 확정된 날부터 30일 이내에 해당 신고관청에 단독으로 신고하여야 한다.","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",4,0],[35,2024,21,26,2,"부동산거래신고법","외국인 등의 부동산 취득","틀린것 고르기","부동산 거래신고 등에 관한 법령상 외국인등의 대한민국 안의 부동산(이하 “국내 부동산”이라 함) 취득에 관한 설명으로 틀린 것은?(단, 상호주의에 따른 제한은 고려하지 않음)\n① 정부간 기구는 외국인등에 포함된다.\n② 외국의 법령에 따라 설립된 법인이 건축물의 신축으로 국내 부동산을 취득한 때에는 부동산을 취득한 날부터 60일 이내에 신고관청에 취득신고를 하여야 한다.\n③ 외국인이 국내 부동산을 취득하는 교환계약을 체결하였을 때에는 계약체결일부터 60일 이내에 신고관청에 취득신고를 하여야 한다.\n④ 외국인이 국내 부동산을 매수하기 위하여 체결한 매매계약은 부동산 거래신고의 대상이다.\n⑤ 국내 부동산을 가지고 있는 대한민국국민이 외국인으로 변경된 경우 그 외국인이 해당 부동산을 계속보유하려는 때에는 외국인으로 변경된 날부터 6개월 이내에 신고관청에 계속보유신고를 하여야 한다.","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",4,0],[35,2024,21,27,2,"부동산거래신고법","외국인 등의 부동산 취득","박스형(모두고르기)","부동산 거래신고 등에 관한 법령상 ‘허가구역 내 토지거래에 대한 허가’의 규정이 적용되지 않는 경우를 모두 고른 것은?\nㄱ. ｢부동산 거래신고 등에 관한 법률｣에 따라 외국인이 토지취득의 허가를 받은 경우\nㄴ. ｢공익사업을 위한 토지 등의 취득 및 보상에 관한 법률｣에 따라 토지를 환매하는 경우\nㄷ. ｢한국농어촌공사 및 농지관리기금법｣에 따라 한국농어촌공사가 농지의 매매를 하는 경우\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",4,0],[35,2024,21,28,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기","부동산 거래신고 등에 관한 법령상 부동산거래신고의 대상이 아닌 것은?\n① ｢주택법｣에 따른 조정대상지역에 소재하는 주택의 증여계약\n② ｢공공주택 특별법｣에 따른 부동산의 공급계약\n③ 토지거래허가를 받은 토지의 매매계약\n④ ｢택지개발촉진법｣에 따른 부동산 공급계약을 통하여 부동산을 공급받는 자로 선정된 지위의 매매계약\n⑤ ｢빈집 및 소규모주택 정비에 관한 특례법｣에 따른 사업시 행계획인가로 취득한 입주자로 선정된 지위의 매매계약","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",5,0],[35,2024,21,29,2,"공인중개사법","거래정보망·기타","판례, 옳은것 고르기","甲의 저당권이 설정되어 있는 乙소유의 X주택을 丙 이 임차하려고 한다. 개업공인중개사가 중개의뢰인 丙에게 임대차계약 체결 후 발생할 수 있는 상황에 관하여 설명한 내용으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 丙이 X주택을 인도받고 그 주소로 동거하는 자녀의 주민등록을 이전하면 대항력이 인정되지 않는다.\n② 丙이 부동산임대차 등기를 한 때에도 X주택을 인도받고 주민등록의 이전을 하지 않으면 대항력이 인정되지 않는다.\n③ 乙이 보증금반환채권을 담보하기 위하여 丙에게 전세권을 설정해 준 경우, 乙은 丙의 전세권을 양수한 선의의 제3자에게 연체차임의 공제 주장으로 대항할 수 있다.\n④ 丙이 ｢주택임대차보호법｣상 최우선변제권이 인정되는 소액임차인인 때에도 甲의 저당권이 실행되면 丙의 임차권은 소멸한다.\n⑤ 丙이 임대차계약을 체결한 후 丁이 X주택에 저당권을 설정받았는데, 丁이 채권을 변제받지 못하자 X주택을 경매한 경우 甲의 저당권과 丙의 임차권은 매각으로 소멸하지 않는다.","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",5,0],[35,2024,21,30,2,"중개실무","경매·매수신청대리","틀린것 고르기","개업공인중개사가 ｢민사집행법｣에 따른 강제경매에 관하여 중개의뢰인에게 설명한 내용으로 틀린 것은?\n① 법원이 경매절차를 개시하는 결정을 할 때에는 동시에 그 부동산의 압류를 명하여야 한다.\n② 압류는 부동산에 대한 채무자의 관리ㆍ이용에 영향을 미치지 아니한다.\n③ 제3자는 권리를 취득할 때에 경매신청 또는 압류가 있다는 것을 알았을 경우에도 압류에 대항할 수 있다.\n④ 경매개시결정이 등기된 뒤에 가압류를 한 채권자는 배당요구를 할 수 있다.\n⑤ 이해관계인은 매각대금이 모두 지급될 때까지 법원에 경매개시결정에 대한 이의신청을 할 수 있다. 2024년 제35회 공인중개","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",5,0],[35,2024,21,31,2,"중개실무","경매·매수신청대리","옳은것 고르기","개업공인중개사 甲은 ｢공인중개사의 매수신청대리인 등록 등에 관한 규칙｣에 따라 매수신청대리인으로 등록한 후 乙과 매수신청대리에 관한 위임계약을 체결하였다. 이에 관한 설명으로 옳은 것은?\n① 甲이 법인이고 분사무소를 1개 둔 경우 매수신청대리에 따른 손해배상책임을 보장하기 위하여 설정해야 하는 보증의 금액은 6억원 이상이다.\n② 甲은 매수신청대리 사건카드에 乙에게서 위임받은 사건에 관한 사항을 기재하고 서명날인 한 후 이를 3년간 보존해야 한다.\n③ 甲은 매수신청대리 대상물에 대한 확인ㆍ설명 사항을 서면으로 작성하여 사건카드에 철하여 3년간 보존해야 하며 乙에게 교부할 필요는 없다.\n④ 등기사항증명서는 甲이 乙에게 제시할 수 있는 매수신청대리 대상물에 대한 설명의 근거자료에 해당하지 않는다.\n⑤ 甲이 중개사무소를 이전한 경우 14일 이내에 乙에게 통지하고 지방법원장에게 그 사실을 신고해야 한다.","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",5,0],[35,2024,21,32,2,"공인중개사법","거래정보망·기타","옳은것 고르기","개업공인중개사가 구분소유권의 목적인 건물을 매수하려는 중개의뢰인에게 ｢집합건물의 소유 및 관리에 관한 법률｣에 관하여 설명한 내용으로 옳은 것은?\n① 일부의 구분소유자만이 공용하도록 제공되는 것임이 명백한 공용부분도 구분소유자 전원의 공유에 속한다.\n② 대지의 공유자는 그 대지에 구분소유권의 목적인 1동의 건물이 있을 때에도 그 건물 사용에 필요한 범위의 대지에 대해 분할을 청구할 수 있다.\n③ 구분소유자는 공용부분을 개량하기 위해서 필요한 범위에서 다른 구분소유자의 전유부분의 사용을 청구할 수 있다.\n④ 전유부분이 속하는 1동의 건물의 설치 또는 보존의 흠 으로 인하여 다른 자에게 손해를 입힌 경우에는 그 흠은 전유부분에 존재하는 것으로 추정한다.\n⑤ 대지사용권이 없는 구분소유자는 대지사용권자에게 대지사용권을 시가(時價)로 매도할 것을 청구할 수 있다.","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",5,0],[35,2024,21,33,2,"공인중개사법","거래정보망·기타","판례","개업공인중개사가 중개의뢰인에게 건물의 소유를 목적으로 한 토지임대차를 중개하면서 임대인을 상대로 지상건물에 대한 매수청구권을 행사할 수 있는 임차인에 대하여 설명하였다. 이에 해당하는 자를 모두 고른 것은?(다툼이 있으면 판례에 따르며, 특별한 사정은 고려하지 않음)\nㄱ. 종전 임차인이 신축한 건물을 매수한 임차인\nㄴ. 차임연체를 이유로 계약을 해지당한 임차인\nㄷ. 건물을 신축하였으나 행정관청의 허가를 받지 않은 임차인\nㄹ. 토지에 지상권이 설정된 경우 지상권자로부터 그 토지를 임차하여 건물을 신축한 임차인\n① ㄱ, ㄴ ② ㄴ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄱ, ㄷ, ㄹ","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",5,0],[35,2024,21,34,2,"중개실무","주택·상가 임대차 실무","박스형(모두고르기), 판례, 옳은것 고르기","개업공인중개사가 소유자 甲으로부터 X주택을 임차한 ｢주택임대차보호법｣상 임차인 乙에게 임차권등기명령과 그에 따른 임차권등기에 대하여 설명한 내용으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 법원의 임차권등기명령이 甲에게 송달되어야 임차권등기명령을 집행할 수 있다.\nㄴ. 乙이 임차권등기를 한 이후에 甲으로부터 X주택을 임차한 임차인은 최우선변제권을 가지지 못한다.\nㄷ. 乙이 임차권등기를 한 이후 대항요건을 상실하더라도, 乙은 이미 취득한 대항력이나 우선변제권을 잃지 않는다.\nㄹ. 乙이 임차권등기를 한 이후에는 이행지체에 빠진 甲의 보증금반환의무가 乙의 임차권등기 말소의무보다 먼저 이행되어야 한다.\n① ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",6,0],[35,2024,21,35,2,"공인중개사법","거래정보망·기타","박스형(모두고르기), 판례, 옳은것 고르기","개업공인중개사가 X토지를 공유로 취득하고자 하는 甲, 乙에게 설명한 내용으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 甲의 지분이 1/2, 乙의 지분이 1/2인 경우, 乙과 협의 없이 X토지 전체를 사용ㆍ수익하는 甲에 대하여 乙은 X토지의 인도를 청구할 수 있다.\nㄴ. 甲의 지분이 2/3, 乙의 지분이 1/3인 경우, 甲 이 X토지를 임대하였다면 乙은 그 임대차의 무효를 주장할 수 없다.\nㄷ. 甲의 지분이 1/3, 乙의 지분이 2/3인 경우, 乙 은 甲의 동의 없이 X토지를 타인에게 매도할 수 없다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",6,0],[35,2024,21,36,2,"공인중개사법","중개사무소·분사무소·인장·게시","판례, 틀린것 고르기","甲이 乙로부터 乙 소유의 X주택을 2020. 1. 매수하면서 그 소유권이전등기는 자신의 친구인 丙에게로 해 줄 것을 요구하였다(이에 대한 丙의 동의가 있었음). 乙로부터 X주택의 소유권이전등기를 받은 丙은 甲의 허락을 얻지 않고 X주택을 丁에게 임대하였고, 丁은 X주택을 인도받은 후 주민등록을 이전하였다. 그런데 丁은 임대차계약 체결 당시에 甲의 허락이 없었음을 알고 있었다. 이에 대하여 개업공인중개사가 丁에게 설명한 내용으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 丙은 X주택의 소유권을 취득할 수 없다.\n② 乙은 丙을 상대로 진정명의 회복을 위한 소유권이전등기를 청구할 수 있다.\n③ 甲은 乙과의 매매계약을 기초로 乙에게 X주택의 소유권이전등기를 청구할 수 있다. 2024년 제35회 공인중개\n④ 丁은 甲 또는 乙에 대하여 임차권을 주장할 수 있다.\n⑤ 丙은 丁을 상대로 임대차계약의 무효를 주장할 수 없지만, 甲은 그 계약의 무효를 주장할 수 있다.","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",6,0],[35,2024,21,37,2,"중개실무","주택·상가 임대차 실무","옳은것 고르기","개업공인중개사가 중개의뢰인에게 ｢주택임대차보호법｣ 상 계약갱신요구권에 관하여 설명한 것으로 옳은 것은?\n① 임차인은 최초의 임대차기간을 포함한 전체 임대차기간이 10년을 초과하지 아니하는 범위에서 계약갱신요구권을 행사할 수 있다.\n② 임차인뿐만 아니라 임대인도 계약갱신요구권을 행사할 수 있다.\n③ 임차인이 계약갱신요구권을 행사하여 임대차계약이 갱신된 경우 임차인은 언제든지 임대인에게 계약해지를 통지할 수 있다.\n④ 임차인이 계약갱신요구권을 행사하여 임대차계약이 갱신된 경우 임대인은 차임을 증액할 수 없다.\n⑤ 임차인이 계약갱신요구권을 행사하려는 경우 계약기간이 끝난 후 즉시 이를 행사하여야 한다.","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",6,0],[35,2024,21,38,2,"중개실무","주택·상가 임대차 실무","틀린것 고르기","개업공인중개사가 상가건물을 임차하려는 중개의뢰인 甲에게 ｢상가건물 임대차보호법｣의 내용에 관하여 설명한 것으로 틀린 것은?\n① 甲이 건물을 인도 받고 ｢부가가치세법｣에 따른 사업자등록을 신청하면 그 다음 날부터 대항력이 생긴다.\n② 확정일자는 건물의 소재지 관할 세무서장이 부여한다.\n③ 임대차계약을 체결하려는 甲은 임대인의 동의를 받아 관할 세무서장에게 건물의 확정일자 부여일 등 관련 정보의 제공을 요청할 수 있다.\n④ 甲이 거짓이나 그 밖의 부정한 방법으로 임차한 경우 임대인은 甲의 계약갱신요구를 거절할 수 있다.\n⑤ 건물의 경매 시 甲은 환가대금에서 우선변제권에 따른 보증금을 지급받은 이후에 건물을 양수인에게 인도하면 된다.","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",6,0],[35,2024,21,39,2,"중개실무","분묘기지권·장사법","박스형(모두고르기), 판례, 옳은것 고르기","개업공인중개사가 토지를 매수하려는 중개의뢰인에게 분묘기지권에 관하여 설명한 내용으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 분묘기지권을 시효취득한 사람은 시효취득한 때부터 지료를 지급할 의무가 발생한다.\nㄴ. 특별한 사정이 없는 한 분묘기지권자가 분묘의 수호와 봉사를 계속하는 한 그 분묘가 존속하는 동안은 분묘기지권이 존속한다.\nㄷ. 분묘기지권을 취득한 자는 그 분묘기지권의 등기 없이도 그 분묘가 설치된 토지의 매수인에게 대항할 수 있다.\n① ㄴ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",6,0],[35,2024,21,40,2,"중개실무","분묘기지권·장사법","옳은것 고르기","토지를 매수하여 사설묘지를 설치하려는 중개의뢰인에게 개업공인중개사가 장사 등에 관한 법령에 관하여 설명한 내용으로 옳은 것은?\n① 개인묘지를 설치하려면 그 묘지를 설치하기 전에 해당 묘지를 관할하는 시장등에게 신고해야 한다.\n② 가족묘지를 설치하려면 해당 묘지를 관할하는 시장등의 허가를 받아야 한다.\n③ 개인묘지나 가족묘지의 면적은 제한을 받지만, 분묘의 형태나 봉분의 높이는 제한을 받지 않는다.\n④ 분묘의 설치기간은 원칙적으로 30년이지만, 개인묘지의 경우에는 3회에 한하여 그 기간을 연장할 수 있다.\n⑤ 설치기간이 끝난 분묘의 연고자는 그 끝난 날부터 1개월 이내에 해당 분묘에 설치된 시설물을 철거하고 매장된 유골을 화장하거나 봉안해야 한다.","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",7,0],[35,2024,21,41,3,"국토계획법","국토계획법 일반","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 용어에 관한 설명으로 옳은 것은?\n① 행정청이 설치하는 공동묘지는 “공공시설”에 해당한다.\n② 성장관리계획구역에서의 난개발을 방지하고 계획적인 개발을 유도하기 위하여 수립하는 계획은 “공간재구조 화계획”이다.\n③ 자전거전용도로는 “기반시설”에 해당하지 않는다.\n④ 지구단위계획구역의 지정에 관한 계획은 “도시ㆍ군기본계획”에 해당한다.\n⑤ “기반시설부담구역”은 기반시설을 설치하기 곤란한 지역을 대상으로 지정한다.","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",7,0],[35,2024,21,42,3,"국토계획법","국토계획법 일반","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 지방자치단체의 장이 다른 법률에 따른 토지 이용에 관한 구역을 지정하는 경우에 관한 설명으로 틀린 것은?\n① 지정하려는 구역의 면적이 1제곱킬로미터 미만인 경우 승인을 받지 않아도 된다.\n② 농림지역에서 ｢수도법｣에 따른 상수원보호구역을 지정하는 경우 국토교통부장관의 승인을 받아야 한다.\n③ 지정하려는 구역이 도시ㆍ군기본계획에 반영된 경우에는 승인 없이 구역을 지정할 수 있다.\n④ 승인을 받아 지정한 구역의 면적의 10퍼센트의 범위안에서 면적을 증감시키는 경우에는 따로 승인을 받지 않아도 된다.\n⑤ 지정된 구역을 변경하거나 해제하려면 도시ㆍ군관리계획의 입안권자의 의견을 들어야 한다.","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",7,0],[35,2024,21,43,3,"국토계획법","국토계획법 일반","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 도시ㆍ군계획에 관한 설명으로 옳은 것은?\n① 도시ㆍ군기본계획의 내용이 광역도시계획의 내용과 다를 때에는 도시ㆍ군기본계획의 내용이 우선한다. 2024년 제35회 공인중개\n② 도시ㆍ군기본계획의 수립권자가 생활권계획을 따로 수립한 때에는 해당 계획이 수립된 생활권에 대해서는 도시ㆍ군관리계획이 수립된 것으로 본다.\n③ 시장ㆍ군수가 미리 지방의회의 의견을 들어 수립한 도시ㆍ군기본계획의 경우 도지사는 지방도시계획위원회의 심의를 거치지 않고 해당 계획을 승인할 수 있다.\n④ 주민은 공공청사의 설치에 관한 사항에 대하여 도시ㆍ군관리계획의 입안권자에게 그 계획의 입안을 제안할 수 있다.\n⑤ 광역도시계획이나 도시ㆍ군기본계획을 수립할 때 도시ㆍ군관리계획을 함께 입안할 수 없다.","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",7,0],[35,2024,21,44,3,"국토계획법","도시·군관리계획·기본계획","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 도시ㆍ군관리계획의 결정에 관한 설명으로 옳은 것은?\n① 도시ㆍ군관리계획 결정의 효력은 지형도면을 고시한 날의 다음 날부터 발생한다.\n② 시가화조정구역의 지정에 관한 도시ㆍ군관리계획 결정 당시 이미 사업에 착수한 자는 그 결정에도 불구하고 신고 없이 그 사업을 계속할 수 있다.\n③ 국토교통부장관이 도시ㆍ군관리계획을 직접 입안한 경우에는 시ㆍ도지사가 지형도면을 작성하여야 한다.\n④ 시장ㆍ군수가 입안한 지구단위계획의 수립에 관한 도시ㆍ군관리계획은 시장ㆍ군수의 신청에 따라 도지사가 결정한다.\n⑤ 시ㆍ도지사는 국가계획과 관련되어 국토교통부장관이 입안하여 결정한 도시ㆍ군관리계획을 변경하려면 미리 국토교통부장관과 협의하여야 한다.","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",7,0],[35,2024,21,45,3,"국토계획법","용도지역·용도지구·용도구역","박스형(모두고르기)","국토의 계획 및 이용에 관한 법령상 해당 구역으로 지정되면 ｢건축법｣ 제69조에 따른 특별건축구역으로 지정된 것으로 보는 구역을 모두 고른 것은?\nㄱ. 도시혁신구역 ㄴ. 복합용도구역\nㄷ. 시가화조정구역 ㄹ. 도시자연공원구역\n① ㄱ ② ㄱ, ㄴ ③ ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",7,0],[35,2024,21,46,3,"국토계획법","도시·군계획시설·매수청구","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 도시ㆍ군계획시설(이하 ‘시설’이라 함)에 관한 설명으로 옳은 것은?\n① 시설결정의 고시일부터 10년 이내에 실시계획의 인가만 있고 시설사업이 진행되지 아니하는 경우 그 부지의 소유자는 그 토지의 매수를 청구할 수 있다.\n② 공동구가 설치된 경우 쓰레기수송관은 공동구협의회의 심의를 거쳐야 공동구에 수용할 수 있다.\n③ ｢택지개발촉진법｣에 따른 택지개발지구가 200만제곱미터를 초과하는 경우에는 공동구를 설치하여야 한다.\n④ 시설결정의 고시일부터 20년이 지날 때까지 시설사업이 시행되지 아니하는 경우 그 시설결정은 20년이 되는 날에 효력을 잃는다.\n⑤ 시설결정의 고시일부터 10년 이내에 시설사업이 시행되지 아니하는 경우 그 부지 내에 건물만을 소유한 자도 시설결 정 해제를 위한 도시․군관리계획 입안을 신청할 수 있다.","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",7,0],[35,2024,21,47,3,"국토계획법","개발행위허가·성장관리","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 개발행위허가(이하 ‘허가’라 함)에 관한 설명으로 옳은 것은?\n① 도시․군계획사업에 의하여 10층 이상의 건축물을 건축하려는 경우에는 허가를 받아야 한다.\n② 건축물의 건축에 대한 허가를 받은 자가 그 건축을 완료하고 ｢건축법｣에 따른 건축물의 사용승인을 받은 경우 허가권자의 준공검사를 받지 않아도 된다.\n③ 허가를 받은 건축물의 연면적을 5퍼센트 범위에서 축소 하려는 경우에는 허가권자에게 미리 신고하여야 한다.\n④ 허가의 신청이 있는 경우 특별한 사유가 없으면 도시계획위원회의 심의 또는 기타 협의 기간을 포함하여 15일 이내에 허가 또는 불허가의 처분을 하여야 한다.\n⑤ 국토교통부장관이 지구단위계획구역으로 지정된 지역에 대하여 허가의 제한을 연장하려면 중앙도시계획위원회의 심의를 거쳐야 한다.","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",8,0],[35,2024,21,48,3,"국토계획법","용도지역·용도지구·용도구역","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 용도지역에 관한 설명으로 옳은 것은?\n① 용도지역은 토지를 경제적ㆍ효율적으로 이용하기 위하여 필요한 경우 서로 중복되게 지정할 수 있다.\n② 용도지역은 필요한 경우 도시ㆍ군기본계획으로 결정할 수 있다.\n③ 주민은 상업지역에 산업ㆍ유통개발진흥지구를 지정하여 줄 것을 내용으로 하는 도시․군관리계획의 입안을 제안할 수 있다.\n④ 바다인 공유수면의 매립구역이 둘 이상의 용도지역과 이웃하고 있는 경우 그 매립구역은 이웃하고 있는 가장 큰 용도지역으로 지정된 것으로 본다.\n⑤ 관리지역에서 ｢농지법｣에 따른 농업진흥지역으로 지정․고시된 지역은 ｢국토의 계획 및 이용에 관한 법률｣ 에 따른 농림지역으로 결정ㆍ고시된 것으로 본다.","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",8,0],[35,2024,21,49,3,"국토계획법","개발행위허가·성장관리","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 기반시설부담구역에 관한 설명으로 옳은 것은?\n① 공원의 이용을 위하여 필요한 편의시설은 기반시설부담구역에 설치가 필요한 기반시설에 해당하지 않는다.\n② 기반시설부담구역에서 기존 건축물을 철거하고 신축하는 경우에는 기존 건축물의 건축연면적을 포함하는 건축행위를 기반시설설치비용의 부과대상으로 한다.\n③ 지구단위계획을 수립한 경우에는 기반시설설치계획을 수립한 것으로 본다.\n④ 기반시설부담구역 내에서 신축된 ｢건축법 시행령｣상의 종교집회장은 기반시설설치비용의 부과대상이다.\n⑤ 기반시설부담구역으로 지정된 지역에 대해서는 개발행위허가의 제한을 연장할 수 없다. 2024년 제35회 공인중개","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",8,0],[35,2024,21,50,3,"국토계획법","국토계획법 일반","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 개발진흥지구를 세분하여 지정할 수 있는 지구에 해당하지 않는 것은?(단, 조례는 고려하지 않음)\n① 주거개발진흥지구 ② 중요시설물개발진흥지구\n③ 복합개발진흥지구 ④ 특정개발진흥지구\n⑤ 관광ㆍ휴양개발진흥지구","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",8,0],[35,2024,21,51,3,"국토계획법","개발행위허가·성장관리","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 개발밀도관리구역에 관한 설명으로 틀린 것은?\n① 개발밀도관리구역의 변경고시는 당해 지방자치단체의 공보에 게재하는 방법에 의한다.\n② 개발밀도관리구역으로 지정될 수 있는 지역에 농림지역은 포함되지 않는다.\n③ 개발밀도관리구역의 지정은 해당 지방자치단체에 설치된 지방도시계획위원회의 심의대상이다.\n④ 개발밀도관리구역에서는 해당 용도지역에 적용되는 건폐율의 최대한도의 50퍼센트 범위에서 건폐율을 강화하여 적용한다.\n⑤ 개발밀도관리구역은 기반시설부담구역으로 지정될 수 없다.","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",8,0],[35,2024,21,52,3,"국토계획법","용도지역·용도지구·용도구역","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 성장관리계획구 역에서 30퍼센트 이하의 범위에서 성장관리계획으로 정하는 바에 따라 건폐율을 완화하여 적용할 수 있는 지역이 아닌 것은?(단, 조례는 고려하지 않음)\n① 생산관리지역 ② 생산녹지지역 ③ 보전녹지지역\n④ 자연녹지지역 ⑤ 농림지역","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",8,0],[35,2024,21,53,3,"도시개발법","도시개발구역 지정·계획","옳은것 고르기","도시개발법령상 환지 방식의 도시개발사업에 대한 개발계획 수립에 필요한 동의자의 수를 산정하는 방법으로 옳은 것은?\n① 도시개발구역의 토지면적을 산정하는 경우: 국공유지를 제외하고 산정할 것\n② 1인이 둘 이상 필지의 토지를 단독으로 소유한 경우:\n필지의 수에 관계없이 토지 소유자를 1인으로 볼 것\n③ 둘 이상 필지의 토지를 소유한 공유자가 동일한 경우:\n공유자 각각을 토지 소유자 1인으로 볼 것\n④ 1필지의 토지 소유권을 여럿이 공유하는 경우: ｢집합건물의 소유 및 관리에 관한 법률｣에 따른 구분소유자인 지 여부와 관계없이 다른 공유자의 동의를 받은 대표 공유자 1인을 해당 토지 소유자로 볼 것\n⑤ 도시개발구역의 지정이 제안된 후부터 개발계획이 수립 되기 전까지의 사이에 토지 소유자가 변경된 경우: 변경된 토지 소유자의 동의서를 기준으로 할 것","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",8,0],[35,2024,21,54,3,"도시개발법","도시개발구역 지정·계획","","도시개발법령상 수용 또는 사용 방식으로 시행하는 도시개발사업의 시행자로 지정될 수 없는 자는?\n① ｢한국철도공사법｣에 따른 한국철도공사\n② 지방자치단체\n③ ｢지방공기업법｣에 따라 설립된 지방공사\n④ 도시개발구역의 국공유지를 제외한 토지면적의 3분의 2 이상을 소유한 자\n⑤ 도시개발구역의 토지 소유자가 도시개발을 위하여 설립 한 조합","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",9,0],[35,2024,21,55,3,"도시개발법","도시개발구역 지정·계획","틀린것 고르기","도시개발법령상 한국토지주택공사가 발행하려는 토지상환채권의 발행계획에 포함되어야 하는 사항이 아닌 것은?\n① 보증기관 및 보증의 내용\n② 토지가격의 추산방법\n③ 상환대상지역 또는 상환대상토지의 용도\n④ 토지상환채권의 발행가액 및 발행시기\n⑤ 토지상환채권의 발행총액","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",9,0],[35,2024,21,56,3,"도시개발법","수용·사용·환지","틀린것 고르기","도시개발법령상 환지 방식에 의한 사업 시행에 관한 설명으로 틀린 것은?\n① 행정청이 아닌 시행자가 환지 계획을 작성하여 인가를 신청하려는 경우 토지 소유자와 임차권자등에게 환지 계획의 기준 및 내용 등을 알려야 한다.\n② ｢집합건물의 소유 및 관리에 관한 법률｣에 따른 대지사용권에 해당하는 토지지분은 분할환지할 수 없다.\n③ 환지 예정지가 지정되면 종전의 토지의 소유자는 환지예정지 지정의 효력발생일부터 환지처분이 공고되는 날까지 종전의 토지를 사용할 수 없다.\n④ 도시개발사업으로 임차권의 목적인 토지의 이용이 방해를 받아 종전의 임대료가 불합리하게 된 경우라도, 환지처분이 공고된 날의 다음 날부터는 임대료 감액을 청구할 수 없다.\n⑤ 도시개발사업의 시행으로 행사할 이익이 없어진 지역권은 환지처분이 공고된 날이 끝나는 때에 소멸한다.","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",9,0],[35,2024,21,57,3,"도시개발법","시행자·조합","옳은것 고르기","도시개발법령상 도시개발사업 조합에 관한 설명으로 옳은 것은?\n① 조합을 설립하려면 도시개발구역의 토지 소유자 10명 이상이 정관을 작성하여 지정권자에게 조합 설립의 인가를 받아야 한다.\n② 조합이 설립인가를 받은 사항 중 청산에 관한 사항을 변경하려는 경우에는 지정권자에게 신고하여야 한다.\n③ 다른 조합원으로부터 해당 도시개발구역에 그가 가지고 있는 토지 소유권 전부를 이전 받은 조합원은 정관으로 정하는 바에 따라 본래의 의결권과는 별도로 그 토지소유권을 이전한 조합원의 의결권을 승계할 수 있다. 2024년 제35회 공인중개\n④ 조합은 총회의 권한을 대행하게 하기 위하여 대의원회를 두어야 한다.\n⑤ 조합의 임원으로 선임된 자가 금고 이상의 형을 선고받 으면 그 날부터 임원의 자격을 상실한다.","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",9,0],[35,2024,21,58,3,"도시개발법","도시개발구역 지정·계획","박스형(모두고르기)","도시개발법령상 도시개발구역지정 이후 지정권자가 도시개발사업의 시행방식을 변경할 수 있는 경우를 모두 고른 것은?(단, 시행자는 국가이며, 시행방식 변경을 위한 다른 요건은 모두 충족됨)\nㄱ. 수용 또는 사용방식에서 전부 환지 방식으로의 변경\nㄴ. 수용 또는 사용방식에서 혼용방식으로의 변경\nㄷ. 혼용방식에서 전부 환지 방식으로의 변경\nㄹ. 전부 환지 방식에서 혼용방식으로의 변경\n① ㄱ, ㄷ ② ㄱ, ㄹ ③ ㄴ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄴ, ㄷ, ㄹ","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",9,0],[35,2024,21,59,3,"정비법","정비사업 일반","","도시 및 주거환경정비법령상 “토지등소유자”에 해당하지 않는 자는?\n① 주거환경개선사업 정비구역에 위치한 건축물의 소유자\n② 재개발사업 정비구역에 위치한 토지의 지상권자\n③ 재개발사업 정비구역에 위치한 건축물의 소유자\n④ 재건축사업 정비구역에 위치한 건축물 및 그 부속토지의 소유자\n⑤ 재건축사업 정비구역에 위치한 건축물 부속토지의 지상권자","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",9,0],[35,2024,21,60,3,"정비법","정비계획·정비구역","옳은것 고르기, 빈칸","도시 및 주거환경정비법령상 임대주택 및 주택규모별 건설비율에 관한 규정의 일부이다. ( )에 들어갈 숫자로 옳은 것은?\n정비계획의 입안권자는 주택수급의 안정과 저소득 주민의 입주기회 확대를 위하여 정비사업으로 건설하는 주택에 대하여 다음 각 호의 구분에 따른 범위에서 국토교통부장관이 정하여 고시하는 임대주택 및 주택규모별 건설비율 등을 정비계획에 반영하여야 한다.\n1. ｢주택법｣에 따른 국민주택규모의 주택이 전체 세대수의 100분의 ( ㄱ ) 이하에서 대통령령으로 정하는 범위\n2. 공공임대주택 및 ｢민간임대주택에 관한 특별법｣에 따른 민간임대주택이 전체 세대수 또는 전체 연면적의 100분의 ( ㄴ ) 이하에서 대통령령으로 정하는 범위\n① ㄱ: 80, ㄴ: 20 ② ㄱ: 80, ㄴ: 30 ③ ㄱ: 80, ㄴ: 50\n④ ㄱ: 90, ㄴ: 30 ⑤ ㄱ: 90, ㄴ: 50","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",9,0],[35,2024,21,61,3,"정비법","정비사업 일반","틀린것 고르기","도시 및 주거환경정비법령상 정비사업의 시행방법으로 허용되지 않는 것은?\n① 주거환경개선사업: 환지로 공급하는 방법\n② 주거환경개선사업: 인가받은 관리처분계획에 따라 주택및 부대시설ㆍ복리시설을 건설하여 공급하는 방법\n③ 재개발사업: 인가받은 관리처분계획에 따라 건축물을 건설하여 공급하는 방법\n④ 재개발사업: 환지로 공급하는 방법\n⑤ 재건축사업: ｢국토의 계획 및 이용에 관한 법률｣에 따른 일반주거지역인 정비구역에서 인가받은 관리처분계획에 따라 ｢건축법｣에 따른 오피스텔을 건설하여 공급하는 방법","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",10,0],[35,2024,21,62,3,"정비법","조합·추진위원회","옳은것 고르기","도시 및 주거환경정비법령상 조합설립 등에 관한 설명으로 옳은 것은?\n① 재개발조합이 조합설립인가를 받은 날부터 3년 이내에 사업시행계획인가를 신청하지 아니한 때에는 시장ㆍ군수등은 직접 정비사업을 시행할 수 있다.\n② 재개발사업의 추진위원회가 조합을 설립하려면 토지등소유자의 3분의 2 이상 및 토지면적의 2분의 1 이상의 토지소유자의 동의를 받아야 한다.\n③ 토지등소유자가 30인 미만인 경우 토지등소유자는 조합을 설립하지 아니하고 재개발사업을 시행할 수 있다.\n④ 조합은 재개발조합설립인가를 받은 때에도 토지등소유자에게 그 내용을 통지하지 아니한다.\n⑤ 추진위원회는 조합설립인가 후 지체 없이 추정분담금에 관한 정보를 토지등소유자에게 제공하여야 한다.","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",10,0],[35,2024,21,63,3,"정비법","사업시행·관리처분","옳은것 고르기","도시 및 주거환경정비법령상 사업시행계획의 통합심의에 관한 설명으로 옳은 것은?\n① ｢경관법｣에 따른 경관 심의는 통합심의 대상이 아니다.\n② 시장ㆍ군수등은 특별한 사유가 없으면 통합심의 결과를 반영하여 사업시행계획을 인가하여야 한다.\n③ 통합심의를 거친 경우 해당 사항에 대한 조정 또는 재정을 거친 것으로 보지 아니한다.\n④ 통합심의위원회 위원장은 위원 중에서 호선한다.\n⑤ 사업시행자는 통합심의를 신청할 수 없다.","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",10,0],[35,2024,21,64,3,"정비법","사업시행·관리처분","박스형(모두고르기)","도시 및 주거환경정비법령상 사업시행자가 관리처분계획이 인가ㆍ고시된 다음 날부터 90일 이내에 손실 보상 협의를 하여야 하는 토지등소유자를 모두 고른 것은?(단, 분양신청기간 종료일의 다음 날부터 협의를 시작할 수 있음)\nㄱ. 분양신청기간 내에 분양신청을 하지 아니한 자\nㄴ. 인가된 관리처분계획에 따라 분양대상에서 제외된 자\nㄷ. 분양신청기간 종료 후에 분양신청을 철회한 자\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ 2024년 제35회 공인중개사\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",10,0],[35,2024,21,65,3,"주택법","리모델링·기타","틀린것 고르기","주택법령상 “기간시설”에 해당하지 않는 것은?\n① 전기시설 ② 통신시설 ③ 상하수도\n④ 어린이놀이터 ⑤ 지역난방시설","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",10,0],[35,2024,21,66,3,"주택법","리모델링·기타","","주택법령상 사업계획의 승인 등에 관한 설명으로 틀린 것은?\n① 승인받은 사업계획 중 공공시설 설치계획의 변경이 필요한 경우에는 사업계획승인권자로부터 변경승인을 받지 않아도 된다.\n② 주택건설사업계획에는 부대시설 및 복리시설의 설치에 관한 계획 등이 포함되어야 한다.\n③ 주택건설사업을 시행하려는 자는 전체 세대수가 600세대 이상인 주택단지를 공구별로 분할하여 주택을 건설ㆍ공급할 수 있다.\n④ 주택건설사업계획의 승인을 받으려는 한국토지주택공사는 해당 주택건설대지의 소유권을 확보하지 않아도 된다.\n⑤ 사업주체는 입주자 모집공고를 한 후 사업계획변경승인을 받은 경우에는 14일 이내에 문서로 입주예정자에게 그 내용을 통보하여야 한다.","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",10,0],[35,2024,21,67,3,"주택법","용어(주택·공동주택 등)","옳은것 고르기, 빈칸","주택법령상 수직증축형 리모델링의 허용 요건에 관한 규정의 일부이다. ( )에 들어갈 숫자로 옳은 것은?\n시행령 제13조 ① 법 제2조제25호다목1)에서 “대통령령으로 정하는 범위”란 다음 각 호의 구분에 따른 범위를 말한다.\n1. 수직으로 증축하는 행위(이하 “수직증축형 리모델링”이라 한다)의 대상이 되는 기존 건축물의 층수가 ( ㄱ )층 이상인 경우: ( ㄴ )개층\n2. 수직증축형 리모델링의 대상이 되는 기존 건축물의 층수가 ( ㄷ )층 이하인 경우: ( ㄹ )개층\n① ㄱ: 10, ㄴ: 3, ㄷ: 9, ㄹ: 2\n② ㄱ: 10, ㄴ: 4, ㄷ: 9, ㄹ: 3\n③ ㄱ: 15, ㄴ: 3, ㄷ: 14, ㄹ: 2\n④ ㄱ: 15, ㄴ: 4, ㄷ: 14, ㄹ: 3\n⑤ ㄱ: 20, ㄴ: 5, ㄷ: 19, ㄹ: 4","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",10,0],[35,2024,21,68,3,"주택법","리모델링·기타","옳은것 고르기","주택법령상 주택의 건설에 관한 설명으로 옳은 것은?(단, 조례는 고려하지 않음)\n① 하나의 건축물에는 단지형 연립주택 또는 단지형 다세대주택과 소형 주택을 함께 건축할 수 없다.\n② 국토교통부장관이 적정한 주택수급을 위하여 필요하다고 인정하는 경우, 고용자가 건설하는 주택에 대하여 국민주택규모로 건설하게 할 수 있는 비율은 주택의 75 퍼센트 이하이다.\n③ ｢주택법｣에 따라 건설사업자로 간주하는 등록사업자는 주택건설사업계획승인을 받은 주택의 건설공사를 시공할 수 없다.\n④ 장수명 주택의 인증기준ㆍ인증절차 및 수수료 등은 ｢주택공급에 관한 규칙｣으로 정한다.\n⑤ 국토교통부장관은 바닥충격음 성능등급을 인정받은 제품이 인정받은 내용과 다르게 판매ㆍ시공한 경우에 해당하면 그 인정을 취소하여야 한다.","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",11,0],[35,2024,21,69,3,"주택법","리모델링·기타","틀린것 고르기","주택법령상 사전방문 등에 관한 설명으로 틀린 것은?\n① 사전방문한 입주예정자가 보수공사 등 적절한 조치를 요청한 사항이 하자가 아니라고 판단하는 사업주체는 사용검사권자에게 하자 여부를 확인해줄 것을 요청할 수 있다.\n② 사업주체는 사전방문을 주택공급계약에 따라 정한 입주 지정기간 시작일 60일 전까지 1일 이상 실시해야 한다.\n③ 사업주체가 사전방문을 실시하려는 경우, 사용검사권자에 대한 사전방문계획의 제출은 사전방문기간 시작일 1 개월 전까지 해야 한다.\n④ 사용검사권자는 사업주체로부터 하자 여부의 확인 요청을 받은 날부터 7일 이내에 하자 여부를 확인하여 해당 사업주체에게 통보해야 한다.\n⑤ 보수공사 등의 조치계획을 수립한 사업주체는 사전방문 기간의 종료일부터 7일 이내에 사용검사권자에게 해당 조치계획을 제출해야 한다.","2","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",11,0],[35,2024,21,70,3,"주택법","리모델링·기타","틀린것 고르기","주택법령상 입주자저축에 관한 설명으로 틀린 것은?\n① 입주자저축정보를 제공하는 입주자저축취급기관의 장은 입주자저축정보의 명의인이 요구하더라도 입주자저축정보의 제공사실을 통보하지 아니할 수 있다.\n② 국토교통부장관으로부터 ｢주택법｣에 따라 입주자저축정보의 제공 요청을 받은 입주자저축취급기관의 장은 ｢금융실명거래 및 비밀보장에 관한 법률｣에도 불구하고 입주자저축정보를 제공하여야 한다.\n③ “입주자저축”이란 국민주택과 민영주택을 공급받기 위하여 가입하는 주택청약종합저축을 말한다.\n④ 국토교통부장관은 입주자저축의 납입방식ㆍ금액 및 조건 등에 필요한 사항에 관한 국토교통부령을 제정하거나 개 정할 때에는 기획재정부장관과 미리 협의해야 한다.\n⑤ 입주자저축은 한 사람이 한 계좌만 가입할 수 있다. 2024년 제35회 공인중개사","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",11,0],[35,2024,21,71,3,"주택법","주택공급·분양가상한·전매제한","박스형(모두고르기)","주택법령상 ｢주택공급에 관한 규칙｣으로 정하는 사항을 모두 고른 것은?\nㄱ. 법 제54조에 따른 주택의 공급\nㄴ. 법 제57조에 따른 분양가격 산정방식\nㄷ. 법 제60조에 따른 견본주택의 건축기준\nㄹ. 법 제65조제5항에 따른 입주자자격 제한\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",11,0],[35,2024,21,72,3,"건축법","건축물·용어·적용범위","틀린것 고르기","건축법령상 건축물의 “대수선”에 해당하지 않는 것은?\n(단, 건축물의 증축ㆍ개축 또는 재축에 해당하지 않음)\n① 보를 두 개 변경하는 것\n② 기둥을 세 개 수선하는 것\n③ 내력벽의 벽면적을 30제곱미터 수선하는 것\n④ 특별피난계단을 변경하는 것\n⑤ 다세대주택의 세대 간 경계벽을 증설하는 것","1","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",11,0],[35,2024,21,73,3,"건축법","건축물·용어·적용범위","틀린것 고르기","건축법령상 대지의 조경 등의 조치를 하지 아니할 수 있는 건축물이 아닌 것은?(단, 가설건축물은 제외하고, 건축법령상 특례, 기타 강화ㆍ완화조건 및 조례는 고려하지 않음)\n① 녹지지역에 건축하는 건축물\n② 면적 4천 제곱미터인 대지에 건축하는 공장\n③ 연면적의 합계가 1천 제곱미터인 공장\n④ ｢국토의 계획 및 이용에 관한 법률｣에 따라 지정된 관리지역(지구단위계획구역으로 지정된 지역이 아님)의 건축물\n⑤ 주거지역에 건축하는 연면적의 합계가 1천500제곱미터인 물류시설","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",11,0],[35,2024,21,74,3,"건축법","대지·도로·건축선","옳은것 고르기","건축법령상 공개공지등에 관한 설명으로 옳은 것은?(단, 건축법령상 특례, 기타 강화ㆍ완화조건은 고려하지 않음)\n① 노후 산업단지의 정비가 필요하다고 인정되어 지정ㆍ공고된 지역에는 공개공지등을 설치할 수 없다.\n② 공개 공지는 필로티의 구조로 설치할 수 없다.\n③ 공개공지등을 설치할 때에는 모든 사람들이 환경친화적 으로 편리하게 이용할 수 있도록 긴 의자 또는 조경시 설 등 건축조례로 정하는 시설을 설치해야 한다.\n④ 공개공지등에는 건축조례로 정하는 바에 따라 연간 최 장 90일의 기간 동안 주민들을 위한 문화행사를 열거나 판촉활동을 할 수 있다.\n⑤ 울타리나 담장 등 시설의 설치 또는 출입구의 폐쇄 등을 통하여 공개공지등의 출입을 제한한 경우 지체 없이 관할 시장ㆍ군수ㆍ구청장에게 신고하여야 한다.","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",11,0],[35,2024,21,75,3,"건축법","건축물·용어·적용범위","옳은것 고르기","건축법령상 건축물 안전영향평가에 관한 설명으로 옳은 것은?\n① 초고층 건축물에 대하여는 건축허가 이후 지체 없이 건축물 안전영향평가를 실시하여야 한다.\n② 안전영향평가기관은 안전영향평가를 의뢰받은 날부터 30일 이내에 안전영향평가 결과를 허가권자에게 제출하여야 하며, 이 기간은 연장될 수 없다.\n③ 건축물 안전영향평가 결과는 도시계획위원회의 심의를 거쳐 확정된다.\n④ 허가권자는 안전영향평가에 대한 심의 결과 및 안전영향평가 내용을 일간신문에 게재하는 방법으로 공개하여야 한다.\n⑤ 안전영향평가를 실시하여야 하는 건축물이 다른 법률에 따라 구조안전과 인접 대지의 안전에 미치는 영향 등을 평가 받은 경우에는 안전영향평가의 해당 항목을 평가 받은 것으로 본다.","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",12,0],[35,2024,21,76,3,"건축법","건축허가·신고·사용승인","옳은것 고르기","건축법령상 건축허가 제한 등에 관한 설명으로 옳은 것은?\n① 도지사는 지역계획에 특히 필요하다고 인정하더라도 허가 받은 건축물의 착공을 제한할 수 없다.\n② 시장ㆍ군수ㆍ구청장이 건축허가를 제한하려는 경우에는 주민의견을 청취한 후 도시계획위원회의 심의를 거쳐야 한다.\n③ 건축허가를 제한하는 경우 제한기간은 2년 이내로 하며, 1회에 한하여 1년 이내의 범위에서 제한기간을 연장할 수 있다.\n④ 건축허가를 제한하는 경우 국토교통부장관은 제한 목적ㆍ기간 등을 상세하게 정하여 지체 없이 공고하여야 한다.\n⑤ 건축허가를 제한한 경우 허가권자는 즉시 국토교통부장관에게 보고하여야 하며, 보고를 받은 국토교통부장관은 제한 내용이 지나치다고 인정하면 직권으로 이를 해제하여야 한다.","3","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",12,0],[35,2024,21,77,3,"건축법","건축물·용어·적용범위","옳은것 고르기, 빈칸","건축법령상 건축물의 마감재료 등에 관한 규정의 일부이다. ( )에 들어갈 내용으로 옳은 것은?\n대통령령으로 정하는 용도 및 규모의 건축물의 벽, 반자, 지붕(반자가 없는 경우에 한정한다) 등 내부의 ( ㄱ )는 ( ㄴ )에 지장이 없는 재료로 하되, ｢실내공기질 관리법｣ 제5조 및 제6조에 따른\n( ㄷ ) 유지기준 및 권고기준을 고려하고 관계 중앙행정기관의 장과 협의하여 국토교통부령으로 정하는 기준에 따른 것이어야 한다.\n① ㄱ: 난연재료, ㄴ: 방화, ㄷ: 공기청정\n② ㄱ: 완충재료, ㄴ: 내진, ㄷ: 실내공기질\n③ ㄱ: 완충재료, ㄴ: 내진, ㄷ: 공기청정\n④ ㄱ: 마감재료, ㄴ: 방화, ㄷ: 실내공기질\n⑤ ㄱ: 마감재료, ㄴ: 내진, ㄷ: 실내공기질 2024년 제35회 공인중개사","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",12,0],[35,2024,21,78,3,"건축법","건축물·용어·적용범위","틀린것 고르기","건축법령상 건축허가 대상 건축물로서 내진능력을 공개하여야 하는 건축물에 해당하지 않는 것은?(단, 소규모건축구조기준을 적용한 건축물이 아님)\n① 높이가 13미터인 건축물\n② 처마높이가 9미터인 건축물\n③ 기둥과 기둥 사이의 거리가 10미터인 건축물\n④ 건축물의 용도 및 규모를 고려한 중요도가 높은 건축물로서 국토교통부령으로 정하는 건축물\n⑤ 국가적 문화유산으로 보존할 가치가 있는 것으로 문화 체육관광부령으로 정하는 건축물","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",12,0],[35,2024,21,79,3,"농지법","농지 소유·이용·보전","틀린것 고르기","농지법령상 농지의 타용도 일시사용신고를 할 수 있는 용도에 해당하지 않는 것은?(단, 일시사용기간은 6개월 이내이며, 신고의 다른 요건은 충족한 것으로 봄)\n① 썰매장으로 사용하는 경우\n② 지역축제장으로 사용하는 경우\n③ 해당 농지에서 허용되는 주목적사업을 위하여 물건을 매설하는 경우\n④ 해당 농지에서 허용되는 주목적사업을 위하여 현장 사무소를 설치하는 경우\n⑤ ｢전기사업법｣상 전기사업을 영위하기 위한 목적으로 ｢신에너지 및 재생에너지 개발ㆍ이용ㆍ보급 촉진법｣ 에 따른 태양에너지 발전설비를 설치하는 경우","5","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",12,0],[35,2024,21,80,3,"농지법","농지 소유·이용·보전","박스형(모두고르기), 틀린것 고르기","농지법령상 농지를 농축산물 생산시설의 부지로 사용할 경우 “농지의 전용”으로 보지 않는 것을 모두 고른 것은?\nㄱ. 연면적 33제곱미터인 농막\nㄴ. 연면적 33제곱미터인 간이저온저장고\nㄷ. 저장 용량이 200톤인 간이액비저장조\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","4","1LTQkJMFbx5GQQyP06rv3eniAWemqvUw4",12,0],[35,2024,22,1,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적소관청은 토지의 이동 등으로 토지의 표시 변경에 관한 등기를 할 필요가 있는 경우에는 지체 없이 관할 등기관서에 그 등기를 촉탁하여야 한다. 이 경우 등기촉탁의 대상이 아닌 것은?\n① 지목변경 ② 지번변경 ③ 신규등록\n④ 축척변경 ⑤ 합병","3","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",1,0],[35,2024,22,2,4,"공간정보법","지번·지목·면적·경계","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지목의 구분 및 설정방법 등에 관한 설명으로 틀린 것은?\n① 필지마다 하나의 지목을 설정하여야 한다.\n② 1필지가 둘 이상의 용도로 활용되는 경우에는 주된 용도에 따라 지목을 설정하여야 한다.\n③ 토지가 일시적 또는 임시적인 용도로 사용될 때에는 그 용도에 따라 지목을 변경하여야 한다.\n④ 물을 상시적으로 이용하지 않고 닥나무ㆍ묘목ㆍ관상수 등의 식물을 주로 재배하는 토지의 지목은 “전”으로 한다.\n⑤ 물을 상시적으로 직접 이용하여 벼ㆍ연(蓮)ㆍ미나리ㆍ왕골 등의 식물을 주로 재배하는 토지의 지목은 “답”으로 한다.","3","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",1,0],[35,2024,22,3,4,"공간정보법","지번·지목·면적·경계","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지상경계및 지상경계점등록부 등에 관한 설명으로 틀린 것은?\n① 지적공부에 등록된 경계점을 지상에 복원하는 경우에는 지상경계점등록부를 작성ㆍ관리하여야 한다.\n② 토지의 지상경계는 둑, 담장이나 그 밖에 구획의 목표가 될 만한 구조물 및 경계점표지 등으로 구분한다.\n③ 지상경계의 구획을 형성하는 구조물 등의 소유자가 다른 경우에는 그 소유권에 따라 지상경계를 결정한다.\n④ 경계점 좌표는 경계점좌표등록부 시행지역의 지상경계점등록부의 등록사항이다.\n⑤ 토지의 소재, 지번, 공부상 지목과 실제 토지이용 지목, 경계점의 사진 파일은 지상경계점등록부의 등록사항이다.","1","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",1,0],[35,2024,22,4,4,"공간정보법","지번·지목·면적·경계","박스형(모두고르기), 옳은것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 등록전환에 따른 지번부여 시 그 지번부여지역의 최종 본번의 다음 순번부터 본번으로 하여 순차적으로 지번을 부여할 수 있는 경우에 해당하는 것을 모두 고른 것은?\nㄱ. 대상토지가 여러 필지로 되어 있는 경우\nㄴ. 대상토지가 그 지번부여지역의 최종 지번의 토지에 인접하여 있는 경우\nㄷ. 대상토지가 이미 등록된 토지와 멀리 떨어져 있어서 등록된 토지의 본번에 부번을 부여하는 것이 불합리한 경우\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ 2024년 제35회 공인중개","5","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",1,0],[35,2024,22,5,4,"공간정보법","지번·지목·면적·경계","옳은것 고르기, 빈칸","공간정보의 구축 및 관리 등에 관한 법령상 경계점좌 표등록부가 있는 지역의 토지분할을 위하여 면적을 정할 때의 기준에 대한 내용이다. ( )에 들어갈 내용으로 옳은 것은?(단, 다른 조건은 고려하지 아니함)\n○ 분할 후 각 필지의 면적합계가 분할 전 면적보 다 많은 경우에는 구하려는 ( ㄱ )부터 순차적으로 버려서 정하되, 분할 전 면적에 증감이 없도록 할 것\n○ 분할 후 각 필지의 면적합계가 분할 전 면적보 다 적은 경우에는 구하려는 ( ㄴ )부터 순차적으로 올려서 정하되, 분할 전 면적에 증감이 없도록 할 것\n① ㄱ: 끝자리의 숫자가 작은 것,\nㄴ: 끝자리의 숫자가 큰 것\n② ㄱ: 끝자리의 다음 숫자가 작은 것,\nㄴ: 끝자리의 다음 숫자가 큰 것\n③ ㄱ: 끝자리의 숫자가 큰 것,\nㄴ: 끝자리의 숫자가 작은 것\n④ ㄱ: 끝자리의 다음 숫자가 큰 것,\nㄴ: 끝자리의 다음 숫자가 작은 것\n⑤ ㄱ: 끝자리의 숫자가 큰 것,\nㄴ: 끝자리의 다음 숫자가 작은 것","2","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",1,0],[35,2024,22,6,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 합병 신청을 할 수 없는 경우에 관한 내용으로 틀린 것은?\n(단, 다른 조건은 고려하지 아니함)\n① 합병하려는 토지의 지목이 서로 다른 경우\n② 합병하려는 토지의 소유자별 공유지분이 다른 경우\n③ 합병하려는 토지의 지번부여지역이 서로 다른 경우\n④ 합병하려는 토지의 소유자에 대한 소유권이전등기 연월일이 서로 다른 경우\n⑤ 합병하려는 토지의 지적도 축척이 서로 다른 경우","4","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",1,0],[35,2024,22,7,4,"공간정보법","지적공부·부동산종합공부","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적소관청이 지적공부의 등록사항을 직권으로 조사ㆍ측량하여 정정할 수 있는 경우로 틀린 것은?\n① 연속지적도가 잘못 작성된 경우\n② 지적공부의 작성 또는 재작성 당시 잘못 정리된 경우\n③ 토지이동정리 결의서의 내용과 다르게 정리된 경우\n④ 지적도 및 임야도에 등록된 필지가 면적의 증감 없이 경계의 위치만 잘못된 경우\n⑤ 지방지적위원회 또는 중앙지적위원회의 의결서 사본을 받은 지적소관청이 그 내용에 따라 지적공부의 등록사항을 정정하여야 하는 경우","1","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",1,0],[35,2024,22,8,4,"공간정보법","지번·지목·면적·경계","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지목을 ‘잡종지’로 정할 수 있는 기준에 대한 내용으로 틀린 것은?(단, 원상회복을 조건으로 돌을 캐내는 곳 또는 흙을 파내는 곳으로 허가된 토지는 제외함)\n① 공항시설 및 항만시설 부지\n② 변전소, 송신소, 수신소 및 송유시설 등의 부지\n③ 도축장, 쓰레기처리장 및 오물처리장 등의 부지\n④ 모래ㆍ바람 등을 막기 위하여 설치된 방사제ㆍ방파제 등의 부지\n⑤ 갈대밭, 실외에 물건을 쌓아두는 곳, 돌을 캐내는 곳, 흙을 파내는 곳, 야외시장 및 공동우물 개","4","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",1,0],[35,2024,22,9,4,"공간정보법","지적공부·부동산종합공부","옳은것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적도와 임야도의 축척 중에서 공통된 것으로 옳은 것은?\n① 1/1200, 1/2400 ② 1/1200, 1/3000\n③ 1/2400, 1/3000 ④ 1/2400, 1/6000\n⑤ 1/3000, 1/6000","5","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",2,0],[35,2024,22,10,4,"공간정보법","지적공부·부동산종합공부","옳은것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적공부와 등록사항의 연결이 옳은 것은?\n① 토지대장 - 지목, 면적, 경계\n② 경계점좌표등록부 - 지번, 토지의 고유번호, 지적도면의 번호\n③ 공유지연명부 - 지번, 지목, 소유권 지분\n④ 대지권등록부 - 좌표, 건물의 명칭, 대지권 비율\n⑤ 지적도 - 삼각점 및 지적기준점의 위치, 도곽선(圖廓線)과 그 수치, 부호 및 부호도","2","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",2,0],[35,2024,22,11,4,"공간정보법","지적공부·부동산종합공부","박스형(모두고르기), 옳은것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적공부의 복구에 관한 관계 자료에 해당하는 것을 모두고른 것은?\nㄱ. 측량 결과도\nㄴ. 법원의 확정판결서 정본 또는 사본\nㄷ. 토지(건물)등기사항증명서 등 등기사실을 증명하는 서류\nㄹ. 지적소관청이 작성하거나 발행한 지적공부의 등록내용을 증명하는 서류\n① ㄱ, ㄴ ② ㄴ, ㄷ ③ ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",2,0],[35,2024,22,12,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","옳은것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 축척변경에 관한 설명으로 옳은 것은?\n① 도시개발사업 등의 시행지역에 있는 토지로서 그 사업시행에서 제외된 토지의 축척변경을 하는 경우 축척변경위원회의 심의 및 시ㆍ도지사 또는 대도시 시장의 승인을 받아야 한다.\n② 지적소관청은 시ㆍ도지사 또는 대도시 시장으로부터 축척변경 승인을 받았을 때에는 지체 없이 축척변경의 목적, 시행지역 및 시행기간, 축척변경의 시행에 관한 세부계획, 축척변경의 시행에 따른 청산금액의 내용, 축척변경의 시행에 따른 토지소유자 등의 협조에 관한 사항을 15일 이상 공고하여야 한다.\n③ 지적소관청은 축척변경에 관한 측량을 한 결과 측량 전에 비하여 면적의 증감이 있는 경우에는 그 증감면적에 대하여 청산을 하여야 한다. 다만, 토지소유자 3분의 2 이상이 청산하지 아니하기로 합의하여 서면으로 제출한 경우에는 그러하지 아니하다.\n④ 지적소관청은 청산금을 내야 하는 자가 납부고지를 받은 날부터 1개월 이내에 청산금에 관한 이의신청을 하지 아니하고, 고지를 받은 날부터 3개월 이내에 지적소관청에 청산금을 내지 아니하면 ｢지방행정제재ㆍ부과금의 징수 등에 관한 법률｣에 따라 징수할 수 있다. 2024년 제35회 공인중개\n⑤ 청산금의 납부 및 지급이 완료되었을 때에는 지적소관청은 지체 없이 축척변경의 확정공고를 하여야 하며, 확정 공고 사항에는 토지의 소재 및 지역명, 축척변경 지번별 조서, 청산금 조서, 지적도의 축척이 포함되어야 한다.","5","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",2,0],[35,2024,22,13,4,"부동산등기법","등기부·등기기록·구분건물","","다음 중 등기원인에 약정이 있더라도 등기기록에 기록할 수 없는 사항은?\n① 지상권의 존속기간\n② 지역권의 지료\n③ 전세권의 위약금\n④ 임차권의 차임지급시기\n⑤ 저당권부 채권의 이자지급장소","2","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",2,0],[35,2024,22,14,4,"부동산등기법","등기신청(공동·단독·전자신청)","","등기권리자와 등기의무자가 공동으로 등기신청을 해야 하는 것은?(단, 판결 등 집행권원에 의한 등기신청은 제외함)\n① 소유권보존등기의 말소등기를 신청하는 경우\n② 법인의 합병으로 인한 포괄승계에 따른 등기를 신청하는 경우\n③ 등기명의인표시의 경정등기를 신청하는 경우\n④ 토지를 수용한 사업시행자가 수용으로 인한 소유권이전등기를 신청하는 경우\n⑤ 변제로 인한 피담보채권의 소멸에 의해 근저당권설정등기의 말소등기를 신청하는 경우","5","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",2,0],[35,2024,22,15,4,"부동산등기법","등기신청(공동·단독·전자신청)","틀린것 고르기","등기소에 제공해야 하는 부동산등기의 신청정보와 첨부정보에 관한 설명으로 틀린 것은?\n① 등기원인을 증명하는 정보가 등기절차의 인수를 명하는 집행력 있는 판결인 경우, 승소한 등기의무자는 등기신청 시 등기필정보를 제공할 필요가 없다.\n② 대리인에 의하여 등기를 신청하는 경우, 신청정보의 내용으로 대리인의 성명과 주소를 제공해야 한다.\n③ 매매를 원인으로 소유권이전등기를 신청하는 경우, 등기의무자의 주소 또는 사무소 소재지를 증명하는 정보를 제공해야 한다.\n④ 등기상 이해관계 있는 제3자의 승낙이 필요한 경우, 이를 증명하는 정보 또는 이에 대항할 수 있는 재판이 있음을 증명하는 정보를 첨부정보로 제공해야 한다.\n⑤ 첨부정보가 외국어로 작성된 경우에는 그 번역문을 붙여야 한다.","1","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",2,0],[35,2024,22,16,4,"부동산등기법","등기신청(공동·단독·전자신청)","박스형(모두고르기)","등기신청의 각하사유로서 ‘사건이 등기할 것이 아닌 경우’를 모두 고른 것은?\nㄱ. 구분건물의 전유부분과 대지사용권의 분리처 분 금지에 위반한 등기를 신청한 경우\nㄴ. 농지를 전세권설정의 목적으로 하는 등기를 신청한 경우\nㄷ. 공동상속인 중 일부가 자신의 상속지분만에 대한 상속등기를 신청한 경우\nㄹ. 소유권 외의 권리가 등기되어 있는 일반건물에 대해 멸실등기를 신청한 경우\n① ㄱ, ㄴ ② ㄴ, ㄹ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ, ㄹ 개","4","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",2,0],[35,2024,22,17,4,"부동산등기법","등기신청(공동·단독·전자신청)","박스형(모두고르기), 옳은것 고르기","진정명의회복을 위한 소유권이전등기에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 진정명의회복을 원인으로 하는 소유권이전등기를 신청하는 경우, 그 신청정보에 등기원인일자는 기재하지 않는다.\nㄴ. 토지거래허가의 대상이 되는 토지에 관하여 진정명의회복을 원인으로 하는 소유권이전등기를 신청하는 경우에는 토지거래허가증을 첨부해야 한다.\nㄷ. 진정명의회복을 위한 소유권이전등기청구소송에서 승소확정판결을 받은 자는 그 판결을 등기원인으로 하여 현재 등기명의인의 소유권이전등기에 대하여 말소등기를 신청할 수는 없다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",3,0],[35,2024,22,18,4,"부동산등기법","등기 일반·효력","옳은것 고르기","부동산등기에 관한 설명으로 옳은 것은?\n① 유증으로 인한 소유권이전등기는 상속등기를 거치지 않으면 유증자로부터 직접 수증자 명의로 신청할 수 없다.\n② 유증으로 인한 소유권이전등기 신청이 상속인의 유류분을 침해하는 내용인 경우에는 등기관은 이를 수리할 수 없다.\n③ 상속재산분할심판에 따른 상속인의 소유권이전등기는 법정상속분에 따른 상속등기를 거치지 않으면 할 수 없다.\n④ 상속등기 경료 전의 상속재산분할협의에 따라 상속등기를 신청하는 경우, 등기원인일자는 ‘협의분할일’로 한다.\n⑤ 권리의 변경등기는 그 등기로 등기상 이해관계 있는 제 3자의 권리가 침해되는 경우, 그 제3자의 승낙 또는 이에 대항할 수 있는 재판이 있음을 증명하는 정보의 제 공이 없으면 부기등기로 할 수 없다.","5","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",3,0],[35,2024,22,19,4,"부동산등기법","등기 일반·효력","틀린것 고르기","환매특약 등기에 관한 설명으로 틀린 것은?\n① 매매로 인한 소유권이전등기의 신청과 환매특약등기의 신청은 동시에 하여야 한다.\n② 환매등기의 경우 매도인이 아닌 제3자를 환매권리자로 하는 환매등기를 할 수 있다.\n③ 환매특약등기에 처분금지적 효력은 인정되지 않는다.\n④ 매매목적물의 소유권의 일부 지분에 대한 환매권을 보류 하는 약정을 맺은 경우, 환매특약등기 신청은 할 수 없다.\n⑤ 환매기간은 등기원인에 그 사항이 정하여져 있는 경우에만 기록한다.","2","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",3,0],[35,2024,22,20,4,"부동산등기법","소유권 등기(보존·이전·신탁·공동소유)","박스형(모두고르기), 옳은것 고르기","임차권등기에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 임차권설정등기가 마쳐진 후 임대차 기간 중 임대인의 동의를 얻어 임차물을 전대하는 경우, 그 전대등기는 부기등기의 방법으로 한다.\nㄴ. 임차권등기명령에 의한 주택임차권등기가 마쳐진 경우, 그 등기에 기초한 임차권이전등기를 할 수 있다.\nㄷ. 미등기 주택에 대하여 임차권등기명령에 의한 등기촉탁이 있는 경우, 등기관은 직권으로 소유권보존등기를 한 후 주택임차권등기를 해야 한다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ 2024년 제35회 공인중개","3","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",3,0],[35,2024,22,21,4,"부동산등기법","등기신청(공동·단독·전자신청)","박스형(모두고르기), 옳은것 고르기","부동산 공동저당의 등기에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 공동저당의 설정등기를 신청하는 경우, 각 부동산에 관한 권리의 표시를 신청정보의 내용으로 등기소에 제공해야 한다.\nㄴ. 등기관이 공동저당의 설정등기를 하는 경우, 각 부동산의 등기기록 중 해당 등기의 끝부분에 공동담보라는 뜻의 기록을 해야 한다.\nㄷ. 등기관이 공동저당의 설정등기를 하는 경우, 공동저당의 목적이 된 부동산이 3개일 때에는 등기관은 공동담보목록을 전자적으로 작성해야 한다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",3,0],[35,2024,22,22,4,"부동산등기법","가등기","","X토지에 관하여 A등기청구권보전을 위한 가등기 이후, B - C의 순서로 각 등기가 적법하게 마쳐졌다. B 등기가 직권말소의 대상인 것은?(A, B, C등기는 X 를 목적으로 함) A B C\n① 전세권설정 - 가압류등기 - 전세권설정본등기\n② 임차권설정 - 저당권설정등기 - 임차권설정본등기\n③ 저당권설정 - 소유권이전등기 - 저당권설정본등기\n④ 소유권이전 - 저당권설정등기 - 소유권이전본등기\n⑤ 지상권설정 - 가압류등기 - 지상권설정본등기","4","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",3,0],[35,2024,22,23,4,"부동산등기법","등기 일반·효력","틀린것 고르기","등기의 촉탁에 관한 설명으로 틀린 것은?\n① 관공서가 상속재산에 대해 체납처분으로 인한 압류등기를 촉탁하는 경우, 상속인을 갈음하여 상속으로 인한 권리이전의 등기를 함께 촉탁할 수 없다.\n② 법원의 촉탁으로 실행되어야 할 등기가 신청된 경우, 등기관은 그 등기신청을 각하해야 한다.\n③ 법원은 수탁자 해임의 재판을 한 경우, 지체 없이 신탁원부 기록의 변경등기를 등기소에 촉탁하여야 한다.\n④ 관공서가 등기를 촉탁하는 경우 우편으로 그 촉탁서를 제출할 수 있다.\n⑤ 촉탁에 따른 등기절차는 법률에 다른 규정이 없는 경우에는 신청에 따른 등기에 관한 규정을 준용한다.","1","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",3,0],[35,2024,22,24,4,"부동산등기법","가등기","판례, 옳은것 고르기","가등기에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 소유권이전등기청구권 보전을 위한 가등기에 기한 본등기가 경료된 경우, 본등기에 의한 물권변동의 효력은 가등기한 때로 소급하여 발생한다.\n② 소유권이전등기청구권 보전을 위한 가등기가 마쳐진 부동산에 처분금지가처분등기가 된 후 본등기가 이루어진 경우, 그 본등기로 가처분채권자에게 대항할 수 있다.\n③ 정지조건부의 지상권설정청구권을 보전하기 위해서는 가등기를 할 수 없다.\n④ 가등기된 소유권이전등기청구권이 양도된 경우, 그 가등기상의 권리의 이전등기를 가등기에 대한 부기등기의 형식으로 경료할 수 없다.\n⑤ 소유권이전등기청구권 보전을 위한 가등기가 있으면 소유권이전등기를 청구할 어떤 법률관계가 있다고 추정된다. 개","2","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",3,0],[35,2024,22,25,5,"조세총론","조세총론(납세의무·부과·징수)","틀린것 고르기","국세기본법령 및 지방세기본법령상 조세채권과 일반 채권의 우선관계에 관한 설명으로 틀린 것은?(단, 납세의무자의 신고는 적법한 것으로 가정함)\n① 취득세의 법정기일은 과세표준과 세액을 신고한 경우 그 신고일이다.\n② 토지를 양도한 거주자가 양도소득세 과세표준과 세액을 예정신고한 경우 양도소득세의 법정기일은 그 예정신고일이다.\n③ 법정기일 전에 전세권이 설정된 사실은 양도소득세의 경우 부동산등기부 등본 또는 공증인의 증명으로 증명한다.\n④ 주택의 직전 소유자가 국세의 체납 없이 전세권이 설정된 주택을 양도하였으나, 양도 후 현재 소유자의 소득세가 체납되어 해당 주택의 매각으로 그 매각금액에서 소득세를 강제징수하는 경우 그 소득세는 해당 주택의 전세권담보채권에 우선한다.\n⑤ ｢주택임대차보호법｣ 제8조가 적용되는 임대차관계에 있는 주택을 매각하여 그 매각금액에서 지방세를 강제징수하는 경우에는 임대차에 관한 보증금 중 일정액으로서 같은 법에 따라 임차인이 우선하여 변제받을 수 있는 금액에 관한 채권이 지방세에 우선한다.","4","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",4,0],[35,2024,22,26,5,"조세총론","조세총론(납세의무·부과·징수)","옳은것 고르기","국세기본법령 및 지방세기본법령상 국세 또는 지방세 징수권의 소멸시효에 관한 설명으로 옳은 것은?\n① 가산세를 제외한 국세가 10억원인 경우 국세징수권은 5 년 동안 행사하지 아니하면 소멸시효가 완성된다.\n② 가산세를 제외한 지방세가 1억원인 경우 지방세징수권은 7년 동안 행사하지 아니하면 소멸시효가 완성된다.\n③ 가산세를 제외한 지방세가 5천만원인 경우 지방세징수 권은 5년 동안 행사하지 아니하면 소멸시효가 완성된다.\n④ 납세의무자가 양도소득세를 확정신고하였으나 정부가 경정하는 경우, 국세징수권을 행사할 수 있는 때는 납세의무자가 확정신고한 법정 신고납부기한의 다음 날이다.\n⑤ 납세의무자가 취득세를 신고하였으나 지방자치단체의 장이 경정하는 경우, 납세고지한 세액에 대한 지방세징 수권을 행사할 수 있는 때는 그 납세고지서에 따른 납부기한의 다음 날이다.","5","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",4,0],[35,2024,22,27,5,"종합부동산세","종합부동산세","옳은것 고르기","종합부동산세법령상 주택에 대한 과세에 관한 설명으로 옳은 것은?\n① ｢신탁법｣ 제2조에 따른 수탁자의 명의로 등기된 신탁주택의 경우에는 수탁자가 종합부동산세를 납부할 의무가 있으며, 이 경우 수탁자가 신탁주택을 소유한 것으로 본다.\n② 법인이 2주택을 소유한 경우 종합부동산세의 세율은 1천분의 50을 적용한다.\n③ 거주자 甲이 2023년부터 보유한 3주택(주택 수 계산에서 제외되는 주택은 없음) 중 2주택을 2024.6.17.에 양도하고 동시에 소유권이전등기를 한 경우, 甲의 2024년도 주택분 종합부동산세액은 3주택 이상을 소유한 경우의 세율을 적용하여 계산한다. 2024년 제35회 공인중개\n④ 신탁주택의 수탁자가 종합부동산세를 체납한 경우 그 수탁자의 다른 재산에 대하여 강제징수하여도 징수할 금액에 미치지 못할 때에는 해당 주택의 위탁자가 종합부동산세를 납부할 의무가 있다.\n⑤ 공동명의 1주택자인 경우 주택에 대한 종합부동산세의 과세표준은 주택의 시가를 합산한 금액에서 11억원을 공제한 금액에 100분의 50을 한도로 공정시장가액비율을 곱한 금액으로 한다.","3","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",4,0],[35,2024,22,28,5,"종합부동산세","종합부동산세","옳은것 고르기","종합부동산세법령상 토지에 대한 과세에 관한 설명으로 옳은 것은?\n① 토지분 재산세의 납세의무자로서 종합합산과세대상 토지의 공시가격을 합한 금액이 5억원인 자는 종합부동산세를 납부할 의무가 있다.\n② 토지분 재산세의 납세의무자로서 별도합산과세대상 토지의 공시가격을 합한 금액이 80억원인 자는 종합부동산세를 납부할 의무가 있다.\n③ 토지에 대한 종합부동산세는 종합합산과세대상, 별도합산과세대상 그리고 분리과세대상으로 구분하여 과세한다.\n④ 종합합산과세대상인 토지에 대한 종합부동산세의 과세표준은 해당 토지의 공시가격을 합산한 금액에서 5억원을 공제한 금액에 100분의 50을 한도로 공정시장가액비율을 곱한 금액으로 한다.\n⑤ 별도합산과세대상인 토지의 과세표준 금액에 대하여 해당 과세대상 토지의 토지분 재산세로 부과된 세액(｢지방세법｣에 따라 가감조정된 세율이 적용된 경우에는 그 세율이 적용된 세액, 같은 법에 따라 세부담 상한을 적용받은 경우에는 그 상한을 적용받은 세액을 말한다)은 토지분 별도합산세액에서 이를 공제한다.","5","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",4,0],[35,2024,22,29,5,"취득세","취득세","옳은것 고르기","지방세법령상 취득세의 취득당시가액에 관한 설명으로 옳은 것은?(단, 주어진 조건 외에는 고려하지 않음)\n① 건축물을 교환으로 취득하는 경우에는 교환으로 이전받는 건축물의 시가표준액과 이전하는 건축물의 시가표준 액 중 낮은 가액을 취득당시가액으로 한다.\n② 상속에 따른 건축물 무상취득의 경우에는 ｢지방세법｣ 제4조에 따른 시가표준액을 취득당시가액으로 한다.\n③ 대물변제에 따른 건축물 취득의 경우에는 대물변제액\n(대물변제액 외에 추가로 지급한 금액이 있는 경우에는 그 금액을 제외한다)을 취득당시가액으로 한다.\n④ 법인이 아닌 자가 건축물을 건축하여 취득하는 경우로서 사실상취득가격을 확인할 수 없는 경우에는 시가인 정액을 취득당시가액으로 한다.\n⑤ 법인이 아닌 자가 건축물을 매매로 승계취득하는 경우에는 그 건축물을 취득하기 위하여 ｢공인중개사법｣에 따른 공인중개사에게 지급한 중개보수를 취득당시가액에 포함한다. 개","2","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",4,0],[35,2024,22,30,5,"취득세","취득세","틀린것 고르기","지방세법령상 취득세에 관한 설명으로 틀린 것은?(단, 지방세특례제한법령은 고려하지 않음)\n① 대한민국 정부기관의 취득에 대하여 과세하는 외국정부의 취득에 대해서는 취득세를 부과한다.\n② 토지의 지목을 사실상 변경함으로써 그 가액이 증가한 경우에는 취득으로 본다.\n③ 국가에 귀속의 반대급부로 영리법인이 국가 소유의 부동산을 무상으로 양여받는 경우에는 취득세를 부과하지 아니한다.\n④ 영리법인이 취득한 임시흥행장의 존속기간이 1년을 초과하는 경우에는 취득세를 부과한다.\n⑤ 신탁(｢신탁법｣에 따른 신탁으로서 신탁등기가 병행되는 것만 해당한다)으로 인한 신탁재산의 취득 중 주택조합등과 조합원 간의 부동산 취득에 대해서는 취득세를 부과한다.","3","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",5,0],[35,2024,22,31,5,"취득세","취득세","박스형(모두고르기), 옳은것 고르기","지방세법령상 부동산 취득에 대한 취득세의 표준세율로 옳은 것을 모두 고른 것은?(단, 조례에 의한 세율조 정, 지방세관계법령상 특례 및 감면은 고려하지 않음)\nㄱ. 상속으로 인한 농지의 취득: 1천분의 23\nㄴ. 법인의 합병으로 인한 농지 외의 토지 취득: 1천분의 40\nㄷ. 공유물의 분할로 인한 취득: 1천분의 17\nㄹ. 매매로 인한 농지 외의 토지 취득: 1천분의 19\n① ㄱ, ㄴ ② ㄴ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄴ, ㄷ, ㄹ","1","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",5,0],[35,2024,22,32,5,"종합소득세","부동산임대 사업소득","옳은것 고르기","소득세법령상 거주자의 부동산과 관련된 사업소득에 관한 설명으로 옳은 것은?\n① 해당 과세기간의 종합소득금액이 있는 거주자(종합소득과세표준이 없거나 결손금이 있는 거주자를 포함한다)는 그 종합소득 과세표준을 그 과세기간의 다음 연도 5월 1일부터 5월 31일까지 대통령령으로 정하는 바에 따라 납세지 관할 세무서장에게 신고하여야 하며, 해당 과세기간에 분리과세 주택임대소득이 있는 경우에도 이를 적용한다.\n② 공장재단을 대여하는 사업은 부동산임대업에 해당되지 않는다.\n③ 해당 과세기간의 주거용 건물 임대업을 제외한 부동산임대업에서 발생한 결손금은 그 과세기간의 종합소득 과세표준을 계산할 때 공제한다.\n④ ｢공익사업을 위한 토지 등의 취득 및 보상에 관한 법률｣ 제4조에 따른 공익사업과 관련하여 지역권을 설정함으로써 발생하는 소득은 부동산업에서 발생하는 소득에 해당한다.\n⑤ 사업소득에 부동산임대업에서 발생한 소득이 포함되어 있는 사업자는 그 소득별로 구분하지 않고 회계처리하여야 한다.","1","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",5,0],[35,2024,22,33,5,"재산세","재산세","틀린것 고르기","지방세법령상 재산세 과세기준일 현재 납세의무자로 틀린 것은?\n① 공부상에 개인 등의 명의로 등재되어 있는 사실상의 종중재산으로서 종중소유임을 신고하지 아니하였을 경우: 종중 2024년 제35회 공인중개\n② 상속이 개시된 재산으로서 상속등기가 이행되지 아니하고 사실상의 소유자를 신고하지 아니하였을 경우: 행정안전부령으로 정하는 주된 상속자\n③ ｢도시 및 주거환경정비법｣에 따른 정비사업(재개발사업만 해당한다)의 시행에 따른 환지계획에서 일정한 토지를 환지로 정하지 아니하고 체비지로 정한 경우: 사업시행자\n④ ｢채무자 회생 및 파산에 관한 법률｣에 따른 파산선고이후 파산종결의 결정까지 파산재단에 속하는 재산의 경우: 공부상 소유자\n⑤ 지방자치단체와 재산세 과세대상 재산을 연부(年賦)로 매매계약을 체결하고 그 재산의 사용권을 무상으로 받은 경우: 그 매수계약자","1","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",5,0],[35,2024,22,34,5,"재산세","재산세","박스형(모두고르기), 옳은것 고르기","지방세법령상 재산세의 물납에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 지방자치단체의 장은 재산세의 납부세액이 1 천만원을 초과하는 경우에는 납세의무자의 신청을 받아 해당 지방자치단체의 관할구역에 있는 부동산에 대하여만 대통령령으로 정하는 바에 따라 물납을 허가할 수 있다.\nㄴ. 시장ㆍ군수ㆍ구청장은 법령에 따라 불허가 통지를 받은 납세의무자가 그 통지를 받은 날부터 10일 이내에 해당 시ㆍ군ㆍ구의 관할구역에 있는 부동산으로서 관리ㆍ처분이 가능한 다른 부동산으로 변경 신청하는 경우에는 변경하여 허가할 수 있다.\nㄷ. 물납을 허가하는 부동산의 가액은 물납 허가일 현재의 시가로 한다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",5,0],[35,2024,22,35,5,"재산세","재산세","옳은것 고르기","지방세법령상 재산세에 관한 설명으로 옳은 것은?\n(단, 주어진 조건 외에는 고려하지 않음)\n① 특별시 지역에서 ｢국토의 계획 및 이용에 관한 법률｣에 따라 지정된 주거지역의 대통령령으로 정하는 공장용 건축물의 표준세율은 초과누진세율이다.\n② 수탁자 명의로 등기ㆍ등록된 신탁재산의 수탁자는 과세기준일부터 15일 이내에 그 소재지를 관할하는 지방자치단체의 장에게 그 사실을 알 수 있는 증거자료를 갖추어 신고하여야 한다.\n③ 주택의 토지와 건물 소유자가 다를 경우 해당 주택에 대한 세율을 적용할 때 해당 주택의 토지와 건물의 가액을 소유자별로 구분계산한 과세표준에 세율을 적용한다.\n④ 주택의 재산세로서 해당 연도에 부과할 세액이 20만원 이하인 경우에는 납기를 9월 16일부터 9월 30일까지로 하여 한꺼번에 부과ㆍ징수할 수 있다.\n⑤ 지방자치단체의 장은 과세대상의 누락으로 이미 부과한 재산세액을 변경하여야 할 사유가 발생하여도 수시로 부과ㆍ징수할 수 없다. 개","2","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",5,0],[35,2024,22,36,5,"양도소득세","양도소득세","옳은것 고르기, 계산","다음 자료를 기초로 할 때 소득세법령상 국내 토지A 에 대한 양도소득세에 관한 설명으로 옳은 것은?(단, 甲, 乙, 丙은 모두 거주자임)\n○ 甲은 2018.6.20. 토지A를 3억원에 취득하였으며, 2020.5.15. 토지A에 대한 자본적 지출로 5 천만원을 지출하였다.\n○ 乙은 2022.7.1. 직계존속인 甲으로부터 토지A 를 증여받아 2022.7.25. 소유권이전등기를 마쳤다(토지A의 증여 당시 시가는 6억원임).\n○ 乙은 2024.10.20. 토지A를 甲 또는 乙과 특수관계가 없는 丙에게 10억원에 양도하였다.\n○ 토지A는 법령상 협의매수 또는 수용된 적이 없으며, 소득세법 제97조의2 양도소득의 필요경비 계산 특례(이월과세)를 적용하여 계산한 양도소득 결정세액이 이를 적용하지 않고 계산한 양도소득 결정세액보다 크다고 가정한다.\n① 양도차익 계산시 양도가액에서 공제할 취득가액은 6억원이다.\n② 양도차익 계산시 甲이 지출한 자본적 지출액 5천만원은 양도가액에서 공제할 수 없다.\n③ 양도차익 계산시 乙이 납부하였거나 납부할 증여세 상당액이 있는 경우 양도차익을 한도로 필요경비에 산입한다.\n④ 장기보유 특별공제액 계산 및 세율 적용시 보유기간은 乙의 취득일부터 양도일까지의 기간으로 한다.\n⑤ 甲과 乙은 양도소득세에 대하여 연대납세의무를 진다.","3","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",6,0],[35,2024,22,37,5,"양도소득세","양도소득세","박스형(모두고르기), 옳은것 고르기","소득세법령상 다음의 국내자산 중 양도소득세 과세대상에 해당하는 것을 모두 고른 것은?(단, 비과세와 감면은 고려하지 않음)\nㄱ. 토지 및 건물과 함께 양도하는 ｢개발제한구역의 지정 및 관리에 관한 특별조치법｣에 따른 이축권(해당 이축권 가액을 대통령령으로 정하는 방법에 따라 별도로 평가하여 신고하지 않음)\nㄴ. 조합원입주권\nㄷ. 지역권\nㄹ. 부동산매매계약을 체결한 자가 계약금만 지급한 상태에서 양도하는 권리\n① ㄱ, ㄷ ② ㄴ, ㄹ ③ ㄱ, ㄴ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",6,0],[35,2024,22,38,5,"양도소득세","양도소득세","옳은것 고르기","소득세법령상 거주자의 국내자산 양도에 대한 양도소득세에 관한 설명으로 옳은 것은?\n① 부담부증여의 채무액에 해당하는 부분으로서 양도로 보는 경우에는 그 양도일이 속하는 달의 말일부터 2개월 이내에 양도소득세를 신고하여야 한다.\n② 토지를 매매하는 거래당사자가 매매계약서의 거래가액을 실지거래가액과 다르게 적은 경우에는 해당 자산에 대하여 ｢소득세법｣에 따른 양도소득세의 비과세에 관한 규정을 적용할 때, 비과세 받을 세액에서 ‘비과세에 관한 규정을 적용하지 아니하였을 경우의 양도소득 산출세액’과 ‘매매계약서의 거래가액과 실지거래가액과의 차액’ 중 큰 금액을 뺀다. 2024년 제35회 공인중개\n③ 사업상의 형편으로 인하여 세대전원이 다른 시ㆍ군으로 주거를 이전하게 되어 6개월 거주한 주택을 양도하는 경우 보유기간 및 거주기간의 제한을 받지 아니하고 양도소득세가 비과세된다.\n④ 토지의 양도로 발생한 양도차손은 동일한 과세기간에 전세권의 양도로 발생한 양도소득금액에서 공제할 수 있다.\n⑤ 상속받은 주택과 상속개시 당시 보유한 일반주택을 국내에 각각 1개씩 소유한 1세대가 상속받은 주택을 양도하는 경우에는 국내에 1개의 주택을 소유하고 있는 것으로 보아 1세대 1주택 비과세 규정을 적용한다.","4","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",6,0],[35,2024,22,39,5,"양도소득세","양도소득세","틀린것 고르기","소득세법령상 거주자가 2024년에 양도한 국외자산의 양도소득세에 관한 설명으로 틀린 것은?(단, 거주자는 해당 국외자산 양도일까지 계속 5년 이상 국내에 주소를 두고 있으며, 국외 외화차입에 의한 취득은 없음)\n① 국외자산의 양도에 대한 양도소득이 있는 거주자는 양도소득 기본공제는 적용받을 수 있으나 장기보유 특별 공제는 적용받을 수 없다.\n② 국외 부동산을 양도하여 발생한 양도차손은 동일한 과세기간에 국내 부동산을 양도하여 발생한 양도소득금액에서 통산할 수 있다.\n③ 국외 양도자산이 부동산임차권인 경우 등기여부와 관계없이 양도소득세가 과세된다.\n④ 국외자산의 양도가액은 그 자산의 양도 당시의 실지거래가액으로 한다. 다만, 양도 당시의 실지거래가액을 확인할 수 없는 경우에는 양도자산이 소재하는 국가의 양도 당시 현황을 반영한 시가에 따르되, 시가를 산정하기 어려울 때에는 그 자산의 종류, 규모, 거래상황 등을 고려하여 대통령령으로 정하는 방법에 따른다.\n⑤ 국외 양도자산이 양도 당시 거주자가 소유한 유일한 주택으로서 보유기간이 2년 이상인 경우에도 1세대 1주택 비과세 규정을 적용받을 수 없다.","2","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",6,0],[35,2024,22,40,5,"양도소득세","양도소득세","계산","다음 자료를 기초로 할 때 소득세법령상 거주자 甲 이 확정신고시 신고할 건물과 토지B의 양도소득과세표준을 각각 계산하면?(단, 아래 자산 외의 양도자산은 없고, 양도소득과세표준 예정신고는 모두 하지 않았으며, 감면소득금액은 없다고 가정함) 건물 구분 토지A 토지B\n(주택아님) 양도차익 15,000,000원 (20,000,000원) 25,000,000원\n(차손) 양도일자 2024.3.10. 2024.5.20. 2024.6.25. 보유기간 1년 8개월 4년 3개월 3년 5개월 * 위 자산은 모두 국내에 있으며 등기됨 * 토지A, 토지B는 비사업용 토지 아님 * 장기보유 특별공제율은 6%로 가정함 건물 토지B\n① 0원 16,000,000원\n② 0원 18,500,000원\n③ 11,600,000원 5,000,000원\n④ 12,500,000원 3,500,000원\n⑤ 12,500,000원 1,000,000원 개","4","127qNOY0H8BL6EWv78DuYberZUlkwYEUQ",6,0],[36,2025,11,1,0,"부동산의 개념·특성","부동산 개념·특성·분류","","다음에서 설명하고 있는 토지의 자연적 특성은? ○ 최유효이용의 근거가 된다. ○ 지대 또는 지가를 발생시킨다. ○ 토지이용을 집약화시킨다. ○ 물리적으로 생산할 수 없다.\n① 부증성\n② 인접성\n③ 개별성\n④ 영속성\n⑤ 적재성","1","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",1,0],[36,2025,11,2,0,"부동산의 개념·특성","부동산 개념·특성·분류","틀린것 고르기, 빈칸","한국표준산업분류(KSIC)에 따라 부동산업을 분류할 경우 부동산관련 서비스업에 해당하지 않는 것은?\n\n① 부동산 임대 및 공급업\n\n② 부동산 중개 및 대리업\n\n③ 부동산 감정 평가업\n\n④ 부동산 투자 자문업\n\n⑤ 부동산 분양 대행업","1","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",1,0],[36,2025,11,3,0,"부동산의 개념·특성","부동산 개념·특성·분류","","건축법령상 용도별 건축물의 종류 중 단독주택에 해당하는 것은?\n① 아파트\n② 연립주택\n③ 다중주택\n④ 오피스텔\n⑤ 다세대주택","3","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",1,0],[36,2025,11,4,0,"부동산의 개념·특성","부동산 개념·특성·분류","박스형(모두고르기)","부동산 용어에 관한 설명으로 옳은 것을 모두 고른 것은? ㄱ. 주거용·상업용·공업용으로 이용되고 있거나 해당 용도로 이용할 목적으로 조성된 토지는 택지(宅地)에 해당한다. ㄴ. 토지의 현황을 조사하고 측량해서 토지의 소재, 지목, 지번, 경계 또는 좌표를 지적공부에 등록하는 단위가 되는 일정한 토지를 획지(劃地)라 한다. ㄷ. 용도상 불가분의 관계에 있는 2필지 이상의 일단의 토지를 일단지(一團地)라 한다. ㄹ. 소유권이 인정되지 않는 바다와 육지 사이의 해변 토지를 포락지(浦落地)라 한다. ㅁ. 택지지역·농지지역·산지(임지)지역 상호 간에 다른 지역으로 전환되고 있는 지역의 토지는 후보지(候補地)에 해당한다.\n① ㄱ, ㄴ\n② ㄱ, ㄹ\n③ ㄱ, ㄷ, ㅁ\n④ ㄴ, ㄷ, ㅁ\n⑤ ㄴ, ㄹ, ㅁ","3","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",1,0],[36,2025,11,5,0,"개발·관리·마케팅","부동산마케팅","틀린것 고르기","부동산마케팅에 관한 설명으로 틀린 것은?\n① 4P Mix전략에서 4P는 제품(Product), 가격(Price), 유통경로(Place), 판매촉진(Promotion)을 말한다.\n② 관계 마케팅전략은 고객과 공급자의 관계를 일회적이 아닌 지속적인 관계로 유지함으로써 마케팅효과를 도모하는 전략이다.\n③ 고객점유 마케팅전략에서 AIDA는 주의(Attention), 관심(Interest), 욕구(Desire), 행동(Action)의 과정을 의미한다.\n④ STP전략에서 STP는 시장세분화(Segmentation), 표적시장 선정(Targeting), 동반자관계(Partnership)로 구성된다.\n⑤ STP전략에서 시장세분화는 부동산시장에서 마케팅활동을 수행하기 위하여 고객의 집단을 세분하는 것이다.","4","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",1,0],[36,2025,11,6,0,"경제론","수요·공급 결정요인·균형","틀린것 고르기","부동산 수요와 공급의 변화에 관한 설명으로 틀린 것은?(단, X축은 수량, Y축은 가격, 수요곡선은 우하향, 공급곡선은 우상향하며, 다른 조건은 동일함)\n① 담보대출금리의 인하는 부동산의 수요곡선을 우측(우상향)으로 이동하게 한다.\n② 건축자재 가격의 하락은 부동산의 공급곡선을 우측(우하향)으로 이동하게 한다.\n③ 대체재 가격의 상승은 해당 부동산의 수요곡선을 좌측(좌하향)으로 이동하게 한다.\n④ 공급자에 대한 보조금 지급은 부동산의 공급곡선을 우측(우하향)으로 이동하게 한다.\n⑤ 보완재 가격의 하락은 해당 부동산의 수요곡선을 우측(우상향)으로 이동하게 한다.","3","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",1,0],[36,2025,11,7,0,"경제론","수요·공급 결정요인·균형","","다음은 부동산관련 경제변수들이다. 유량(flow)과 저량(stock)의 경제변수로 옳게 묶인 것은? ㄱ. 통화량 ㄴ. 연간 이자비용 ㄷ. 자본총량 ㄹ. 주택거래량 ㅁ. 신규주택 공급량 ㅂ. 주택재고량 | 유량변수 | 저량변수 |\n① ㄱ, ㄴ, ㄹ | ㄷ, ㅁ, ㅂ |\n② ㄱ, ㄷ, ㅂ | ㄴ, ㄹ, ㅁ |\n③ ㄱ, ㄹ, ㅁ | ㄴ, ㄷ, ㅂ |\n④ ㄴ, ㄷ, ㅂ | ㄱ, ㄹ, ㅁ |\n⑤ ㄴ, ㄹ, ㅁ | ㄱ, ㄷ, ㅂ","5","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",1,0],[36,2025,11,8,0,"시장론","부동산시장 일반","틀린것 고르기","토지시장의 특성에 관한 설명으로 틀린 것은?\n① 수급조절이 용이하다.\n② 법·제도적 규제가 많다.\n③ 재화의 이질성을 보인다.\n④ 정보의 불완전성 및 비대칭성을 보인다.\n⑤ 부분시장으로 나뉠 수 있는 국지성을 보인다.","1","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",1,0],[36,2025,11,9,0,"경제론","수요·공급 결정요인·균형","","부동산의 수요와 공급이 동시에 변화할 때, 균형가격이 상승하고 균형거래량이 감소하는 경우는?(단, X축은 수량, Y축은 가격, 수요곡선은 우하향, 공급곡선은 우상향, 수요곡선과 공급곡선 기울기의 절댓값은 1이며, 다른 조건은 동일함)\n\n① 수요의 증가폭이 공급의 증가폭보다 클 경우\n\n② 수요의 감소폭이 공급의 감소폭보다 클 경우\n\n③ 수요의 증가폭이 공급의 감소폭보다 작을 경우\n\n④ 수요의 감소폭이 공급의 증가폭보다 작을 경우\n\n⑤ 수요의 증가폭이 공급의 감소폭보다 작을 경우","3","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",2,0],[36,2025,11,10,0,"경제론","수요·공급 결정요인·균형","","부동산매매시장의 수요와 공급에 관한 설명으로 옳은 것은?(단, 수요곡선은 우하향, 공급곡선은 우상향하며, 다른 조건은 동일함)\n\n① 수요곡선은 한계비용곡선이다.\n\n② 수요곡선상의 수요량은 주어진 가격에서 수요자들이 구입하고자 하는 부동산의 최소수량이다.\n\n③ 수요량의 변화는 수요 자체의 변화를 말하며, 수요곡선 자체를 이동시킨다.\n\n④ 공급곡선은 한계편익곡선이다.\n\n⑤ 공급함수는 부동산의 공급량에 영향을 미치는 요인들과 공급량의 관계를 나타내는 함수이다.","5","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",2,0],[36,2025,11,11,0,"기타","기타","","C지역의 부동산시장에서 시장수요는 개인 A의 수요와 개인 B의 수요로만 구성되어 있고, 개인 A의 수요함수는 P=100-Qd_A, 개인 B의 수요함수는 P=100-2Qd_B일 때, 시장수요함수는?(단, X축은 수량, Y축은 가격, Qd_M은 시장수요량, Qd_A와 Qd_B는 각각 개인 A와 B의 개별수요량, P는 가격, C지역의 부동산시장은 완전경쟁시장이며, 다른 조건은 동일함)\n\n① P=100-2/3Qd_M\n\n② P=100-3/2Qd_M\n\n③ P=200-1/2Qd_M\n\n④ P=200-2/3Qd_M\n\n⑤ P=200-3/2Qd_M","1","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",2,0],[36,2025,11,12,0,"경제론","탄력성","계산","어느 지역 아파트시장에서 수요의 가격탄력성이 1.6이다. 아파트가격이 5% 하락할 때 수요량의 변화는?(단, 수요곡선은 우하향, 수요의 가격탄력성은 절댓값이며, 다른 조건은 동일함)\n\n① 4% 증가\n\n② 4% 하락\n\n③ 6% 증가\n\n④ 6% 하락\n\n⑤ 8% 증가","5","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",2,0],[36,2025,11,13,0,"입지·지대이론","공업입지·지대이론","","베버(A. Weber)의 최소비용이론에 관한 설명으로 옳은 것은?(단, 기업은 단일 입지 공장이고, 다른 조건은 동일함)\n\n① 국지원료의 중량이 제품의 중량보다 무거우면, 원료지수(material index)는 음(-)의 값을 갖는다.\n\n② 등비용선(isodapane)은 최소운송비지점으로부터 기업이 입지를 바꿀 경우, 이에 따른 추가적인 운송비의 부담액이 동일한 지점을 연결한 것이다.\n\n③ 임계등비용선(critical isodapane)은 최소운송비지점을 중심으로 운송비 절감액과 운송비 추가 부담액이 동일한 등비용선을 말한다.\n\n④ 최소운송비지점은 원료 및 제품의 중량, 노동비, 집적이익에 따라 결정된다.\n\n⑤ 최소비용보다 최대수익이 더 큰 곳을 기업의 최적입지로 본다.","2","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",2,0],[36,2025,11,14,0,"입지·지대이론","공업입지·지대이론","박스형(모두고르기)","지대이론에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 리카도(D. Ricardo)는 지대 발생의 원인으로 비옥한 토지의 부족과 수확체감의 법칙을 제시하면서, 지대는 잉여이기 때문에 생산물의 가격에 영향을 주지 않는다고 보았다.\nㄴ. 알론소(W. Alonso)는 토지를 소유하고 있다는 독점적 지위 때문에 토지소유자가 받는 수입이 지대이며, 이 지대는 토지의 비옥도나 생산력에 관계없이 발생한다고 보았다.\nㄷ. 튀넨(J. H. von Thünen)은 운송수단의 차이에 따라 한계지대곡선의 기울기가 달라지며, 이 곡선의 기울기에 따라 집약적 농업과 조방적 농업으로 구분된다고 보았다.\n\n① ㄱ\n\n② ㄷ\n\n③ ㄱ, ㄷ\n\n④ ㄴ, ㄷ\n\n⑤ ㄱ, ㄴ, ㄷ","1","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",2,0],[36,2025,11,15,0,"시장론","부동산시장 일반","틀린것 고르기","부동산시장에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)\n\n① 약성 효율적 시장에서는 과거의 자료를 토대로 시장가치의 변동을 분석하는 기술적 분석으로 초과이윤을 얻을 수 없다.\n\n② 준강성 효율적 시장에서는 공표된 사실을 토대로 시장가치의 변동을 분석하는 기본적 분석으로 초과이윤을 얻을 수 없다.\n\n③ 강성 효율적 시장에서는 어떠한 정보를 이용하더라도 초과이윤을 얻을 수 없다.\n\n④ 불완전경쟁시장은 할당효율적 시장이 될 수 없다.\n\n⑤ 불완전경쟁시장에서는 초과이윤이 발생할 수 있다.","4","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",2,0],[36,2025,11,16,0,"입지·지대이론","상업입지이론","계산","허프(D. Huff)모형으로 다음 자료를 활용하여 산출한 2022년 점포 A의 월 매출액은 4억원이었다. 다른 조건은 기존과 동일하지만, 점포 A의 경우 증축을 통해 2024년 매장면적이 2,500㎡가 되었다. 허프(D. Huff)모형을 활용한 2024년 점포 A의 월 매출액은? (단, 주어진 조건에 한함)\n○ X지역에는 점포 A, 점포 B, 점포 C만 존재함\n○ X지역의 주민은 모두 구매자이고, 점포(A, B, C)에서만 구매함\n○ X지역의 주민: 8,000명\n○ 공간(거리)마찰계수: 2\n○ 점포(A, B, C)의 매출액은 X지역 주민에 의해서만 발생함\n○ 1인당 월 점포 구매액은 2022년과 2024년이 동일함\n구 분 | 점포 A | 점포 B | 점포 C\n매장면적(2022년 기준) | 500㎡ | 2,000㎡ | 1,000㎡\nX지역 거주지로부터의 거리 | 5km | 10km | 5km\n\n① 6억원\n\n② 10억원\n\n③ 16억원\n\n④ 20억원\n\n⑤ 26억원","2","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",3,0],[36,2025,11,17,0,"정책론","조세정책·조세전가","옳은것 고르기","부동산관련 조세 중 국세와 보유세에 모두 해당하는 것은?\n\n① 재산세\n\n② 상속세\n\n③ 등록면허세\n\n④ 양도소득세\n\n⑤ 종합부동산세","5","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",3,0],[36,2025,11,18,0,"정책론","토지정책·지역지구제","박스형(모두고르기), 옳은것 고르기","국토의 계획 및 이용에 관한 법령상 용도지역 중 도시지역에 해당하는 것은 모두 몇 개인가?\n○ 농림지역\n○ 준주거지역\n○ 근린상업지역\n○ 자연녹지지역\n○ 계획관리지역\n○ 자연환경보전지역\n\n① 1개\n\n② 2개\n\n③ 3개\n\n④ 4개\n\n⑤ 5개","3","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",3,0],[36,2025,11,19,0,"투자론","투자분석기법(NPV·IRR 등)","박스형(모두고르기), 옳은것 고르기","부동산투자의 분석기법 중 할인현금수지분석법(DCF)에 해당하는 것을 모두 고른 것은?\nㄱ. 순현재가치법\nㄴ. 회수기간법\nㄷ. 내부수익률법\nㄹ. 승수법\nㅁ. 수익성지수법\n\n① ㄱ, ㄴ\n\n② ㄱ, ㄷ, ㅁ\n\n③ ㄱ, ㄹ, ㅁ\n\n④ ㄴ, ㄷ, ㄹ, ㅁ\n\n⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","2","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",3,0],[36,2025,11,20,0,"정책론","조세정책·조세전가","박스형(모두고르기)","부동산조세에 관한 설명으로 옳은 것을 모두 고른 것은?(단, 다른 조건은 동일함)\nㄱ. 취득세는 지방자치단체의 재정수요를 충족시키는 기능이 있다.\nㄴ. 부동산 거래세를 부과하면 총잉여가 증가하므로 경제적 순손실이 발생하지 않는다.\nㄷ. 양도소득세가 강화되어 동결효과(lock-in effect)가 발생하면 부동산가격이 하락한다.\nㄹ. 공급의 가격탄력성이 수요의 가격탄력성보다 작은 경우 공급자가 수요자보다 조세부담이 더 크다.\nㅁ. 헨리 조지(H. George)는 토지세가 임차인에게 모두 전가되는 것을 근거로 토지단일세 도입을 주장하였다.\n\n① ㄱ, ㄴ\n\n② ㄱ, ㄹ\n\n③ ㄴ, ㄷ, ㅁ\n\n④ ㄴ, ㄹ, ㅁ\n\n⑤ ㄱ, ㄷ, ㄹ, ㅁ","2","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",3,0],[36,2025,11,21,0,"정책론","주택·임대료 정책","계산","A도시의 임대주택시장에서 수요함수는 Qd = 1,000 - 2P, 공급함수는 Qs = 100 + 4P이고, 정부는 A도시의 임대료상한(최고가격)을 호당 120만원으로 규제하였다. 임대주택 수요량과 공급량이 호당 120만원의 임대료에서 결정되는 경우 발생하는 초과수요량은?(단, 임대주택의 규모와 품질은 모두 동일하고, Qd는 임대주택의 수요량(단위: 호), Qs는 임대주택의 공급량(단위: 호), P는 호당 임대료(단위: 만원)이며, 다른 조건은 동일함)\n\n① 100호\n\n② 120호\n\n③ 150호\n\n④ 180호\n\n⑤ 200호","4","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",3,0],[36,2025,11,22,0,"정책론","토지정책·지역지구제","박스형(모두고르기), 옳은것 고르기","부동산정책을 직접개입방식과 간접개입방식으로 구분할 때, 간접개입방식에 해당하는 것을 모두 고른 것은?(단, 다른 조건은 동일함)\nㄱ. 임대료 보조\nㄴ. 재산세 부과\nㄷ. 공공임대주택 공급\nㄹ. 공공토지비축제도\nㅁ. 토지거래허가제도\nㅂ. 개발부담금제도\n\n① ㄱ, ㄴ, ㄷ\n\n② ㄱ, ㄴ, ㅂ\n\n③ ㄷ, ㄹ, ㅁ\n\n④ ㄱ, ㄹ, ㅁ, ㅂ\n\n⑤ ㄴ, ㄷ, ㄹ, ㅁ, ㅂ","2","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",3,0],[36,2025,11,23,0,"금융론","대출 상환방식·대출한도","","부동산 대출에 관한 설명으로 옳은 것은?(단, 다른 조건은 동일함)\n① 담보인정비율(LTV)은 담보물의 자산가치에 대한 융자비율로 LTV가 올라갈수록 차입자의 자기자본비율도 증가한다.\n② 총부채상환비율(DTI)은 상업용 부동산의 순수입에 대한 연간채무부담액을 의미하므로 DTI가 올라가면 부채서비스액도 증가한다.\n③ 고정금리대출은 이자율 변동으로 인한 위험을 차입자에게 전가하는 방식이므로 금융기관(대출자)은 금리가 변동해도 위험이 없다.\n④ 총부채원리금상환비율(DSR)은 차입자의 총 금융부채 상환부담을 판단하기 위하여 산정하는 차입자의 연간 소득 대비 연간 금융부채 원리금 상환액 비율을 말한다.\n⑤ 부동산담보대출의 금리가 인상되어 차입자가 원리금에 대한 채무상환을 정해진 시기에 이행하지 못하는 것을 조기상환위험이라고 한다.","4","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",4,0],[36,2025,11,24,0,"정책론","주택·임대료 정책","틀린것 고르기","주거정책에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)\n① 공공임대주택의 공급은 소득재분배 효과를 기대할 수 있다.\n② 주택임대료를 시장가격 미만으로 규제하면 주택임대시장에서는 이중가격이 형성될 수 있다.\n③ 공공주택 특별법령상 통합공공임대주택이란 국가나 지방자치단체의 재정이나 주택도시기금의 자금을 지원받아 최저소득 계층, 저소득 서민, 젊은 층 및 장애인·국가유공자 등 사회 취약계층 등의 주거안정을 목적으로 공급하는 공공임대주택을 말한다.\n④ 임대료 보조정책은 저소득층의 실질소득을 증가시킬 수 있다.\n⑤ 주거급여법령상 주택을 소유한 모든 사람은 주거급여의 수급권자가 될 수 없다.","5","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",4,0],[36,2025,11,25,0,"투자론","현금흐름·수익률·위험","틀린것 고르기","부동산투자에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)\n① 투자위험과 요구수익률은 정(+)의 관계를 가진다.\n② 위험회피형 투자자는 기대수익률이 요구수익률보다 높을 경우 투자가치가 있다고 판단한다.\n③ 민감도분석은 투자효과를 분석하는 모형의 투입요소가 변화함에 따라 순현재가치와 내부수익률에 어떠한 영향을 주는가를 분석하는 기법이다.\n④ 부(-)의 레버리지효과란 부채비율이 커질수록 자기자본수익률이 하락하는 것을 말한다.\n⑤ 부동산관련 세제 등 정부정책이나 각종 토지의 이용규제의 변화로 야기되는 불확실성은 유동성 위험이다.","5","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",4,0],[36,2025,11,26,0,"투자론","현금흐름·수익률·위험","","부동산투자의 포트폴리오이론에 관한 설명으로 옳은 것은?(단, 다른 조건은 동일함)\n① 인플레이션, 경기변동 등의 체계적 위험은 분산투자를 통해 제거할 수 없다.\n② 2개 투자자산의 수익률이 서로 아무런 관계없이 움직인다면 상관계수는 1이다.\n③ 투자자가 효용이 동일하다고 느끼는 조합을 연결한 선을 효율적 투자선이라 한다.\n④ 포트폴리오 구성자산의 수익률이 같은 방향으로 움직일 경우 위험감소의 효과가 크다.\n⑤ 기대수익률의 분산 또는 표준편차는 투자안의 수익을 측정하는 전통적인 방법이다.","1","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",4,0],[36,2025,11,27,0,"투자론","현금흐름·수익률·위험","","다음은 甲의 부동산 임대사업의 1년간 운영수지에 관한 내용이다. 甲의 1년간 자기자본수익률은?(단, 주어진 조건에 한함) ○ 기간 초 부동산 매입가격: 8억원 ○ 대출비율: 80% ○ 1년간 부동산가격 상승률: 연 5% ○ 매입 1년 후 부동산을 처분함 ○ 순영업소득(NOI): 연 4,000만원(기간 말 발생) ○ 대출조건: 이자율 연 5%, 대출기간 1년, 원리금은 만기시 일시 상환함\n① 15%\n② 25%\n③ 30%\n④ 40%\n⑤ 45%","3","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",4,0],[36,2025,11,28,0,"투자론","투자분석기법(NPV·IRR 등)","","다음 대상부동산의 3년간 현금흐름을 이용한 임대사업의 수익성지수(PI)는?(단, 연간 기준이며, 결과값은 소수점 셋째자리에서 반올림하고, 주어진 조건에 한함) ○ 모든 현금의 유입과 유출은 매년 말에만 발생 ○ 현금유입은 1년차 800만원, 2년차 1,000만원, 3년차 1,200만원 ○ 매년 현금유출은 현금유입의 70% ○ 1년 후 일시불의 현가계수 0.90 ○ 2년 후 일시불의 현가계수 0.85 ○ 3년 후 일시불의 현가계수 0.80\n① 0.70\n② 0.93\n③ 1.22\n④ 1.43\n⑤ 1.62","4","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",4,0],[36,2025,11,29,0,"투자론","현금흐름·수익률·위험","","다음 대상부동산의 순영업소득(NOI)은?(단, 연간 기준이며, 주어진 조건에 한함) ○ 건축연면적: 2,000㎡ ○ 유효임대면적: 건축연면적의 80% ○ 연평균임대료: 유효임대면적 ㎡당 6만원 ○ 평균공실률: 유효임대면적의 10% ○ 영업경비: 유효총소득의 50% ○ 연부채상환액: 1,000만원\n① 3,820만원\n② 4,320만원\n③ 6,900만원\n④ 7,680만원\n⑤ 8,640만원","2","1MNr-9ifimtZ
