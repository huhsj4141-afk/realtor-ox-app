SkCAc8gOFB4qUMvpcF",2,0],[32,2021,11,14,0,"정책론","토지정책·지역지구제","틀린것 고르기","현행 법제도상 부동산투기억제제도에 해당하지 않는 것은?\n① 토지거래허가제\n② 주택거래신고제\n③ 토지초과이득세\n④ 개발이익환수제\n⑤ 부동산 실권리자명의 등기제도","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",3,0],[32,2021,11,15,0,"정책론","조세정책·조세전가","틀린것 고르기","부동산 조세에 관한 설명으로 틀린 것은?\n① 조세의 중립성은 조세가 시장의 자원배분에 영향을 미치지 않아야 한다는 원칙을 의미한다.\n② 양도소득세를 중과하면 부동산의 보유기간이 늘어나는 현상이 발생할 수 있다.\n③ 조세의 사실상 부담이 최종적으로 어떤 사람에게 귀속되는 것을 조세의 귀착이라 한다.\n④ 양도소득세는 양도로 인해 발생하는 소득에 대해 부과되는 것으로 타인에게 전가될 수 있다.\n⑤ 재산세와 종합부동산세는 보유세로서 지방세이다.","5","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",3,0],[32,2021,11,16,0,"금융론","부동산금융 일반·주택금융","틀린것 고르기","부동산 거래규제에 관한 설명으로 틀린 것은?\n① 주택취득 시 자금조달계획서의 제출을 요구하는 것은 주택취득을 제한하는 방법이라 볼 수 있다.\n② 투기지역으로 지정되면 그 지역에서 건설ㆍ공급하는 도시형생활주택에 대해 분양가상한제가 적용된다.\n③ 농지취득자격증명제는 농지취득을 제한하는 제도다.\n④ 토지거래허가구역으로 지정된 지역에서 토지거래계약을 체결할 경우 시장ㆍ군수 또는 구청장의 허가를 받아야 한다.\n⑤ 부동산거래신고제는 부동산 매매계약을 체결하는 경우 그 실제 거래가격 등을 신고하게 하는 제도다.","2","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",3,0],[32,2021,11,17,0,"정책론","주택·임대료 정책","틀린것 고르기","현재 우리나라에서 시행되고 있는 주택정책수단이 아닌 것은?\n① 공공임대주택제도 ② 주거급여제도\n③ 주택청약종합저축제도 ④ 개발권양도제도\n⑤ 재건축초과이익환수제도","4","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",3,0],[32,2021,11,18,0,"금융론","대출 상환방식·대출한도","틀린것 고르기","주택담보대출에 관한 설명으로 틀린 것은?\n① 담보인정비율(LTV)은 주택담보대출 취급시 담보가치에 대한 대출취급가능금액의 비율을 말한다.\n② 총부채상환비율(DTI)은 차주의 소득을 중심으로 대출 규모를 결정하는 기준이다.\n③ 담보인정비율이나 총부채상환비율에 대한 구체적인 기준은 한국은행장이 정하는 기준에 의한다.\n④ 총부채원리금상환비율(DSR)은 차주의 총 금융부채 상환부담을 판단하기 위하여 산정하는 차주의 연간 소득대비 연간 금융부채 원리금 상환액 비율을 말한다.\n⑤ 변동금리 주택담보대출은 이자율 변동으로 인한 위험을 차주에게 전가하는 방식으로 금융기관의 이자율 변동위 험을 줄일 수 있다. 2021년 제32회 공인중개","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",3,0],[32,2021,11,19,0,"감정평가론","가치·가격원칙·지역분석","","다음은 투자부동산의 매입, 운영 및 매각에 따른 현금흐름이다. 이에 기초한 순현재가치는?(단, 0년차 현금흐름은 초기투자액, 1년차부터 7년차까지 현금흐름은 현금유입과 유출을 감안한 순현금흐름이며, 기간이 7년인 연금의 현가계수는 3.50, 7년 일시불의 현가계수는 0.60이고, 주어진 조건에 한함)\n(단위: 만원) 기간 0 1 2 3 4 5 6 7\n(년) 현금\n-1,100 120 120 120 120 120 120 1,420 흐름\n① 100만원 ② 120만원 ③ 140만원\n④ 160만원 ⑤ 180만원","1","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",3,0],[32,2021,11,20,0,"감정평가론","가치·가격원칙·지역분석","옳은것 고르기, 계산","화폐의 시간가치 계산에 관한 설명으로 옳은 것은?\n① 현재 10억 원인 아파트가 매년 2%씩 가격이 상승한다고 가정할 때, 5년 후의 아파트가격을 산정하는 경우 연금의 미래가치계수를 사용한다.\n② 원리금균등상환방식으로 담보대출 받은 가구가 매월 상환할 금액을 산정하는 경우, 일시불의 현재가치계수를 사용한다.\n③ 연금의 현재가치계수에 감채기금계수를 곱하면 일시불의 현재가치계수이다.\n④ 임대기간 동안 월임대료를 모두 적립할 경우, 이 금액의 현재시점 가치를 산정한다면 감채기금계수를 사용한다.\n⑤ 나대지에 투자하여 5년 후 8억 원에 매각하고 싶은 투자자는 현재 이 나대지의 구입금액을 산정하는 경우, 저당상수를 사용한다.","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",3,0],[32,2021,11,21,0,"투자론","현금흐름·수익률·위험","옳은것 고르기","부동산 투자수익률에 관한 설명으로 옳은 것은?(단, 위험회피형 투자자를 가정함)\n① 기대수익률이 요구수익률보다 높을 경우 투자자는 투자 가치가 있는 것으로 판단한다.\n② 기대수익률은 투자에 대한 위험이 주어졌을 때, 투자자가 투자부동산에 대하여 자금을 투자하기 위해 충족되어야 할 최소한의 수익률을 말한다.\n③ 요구수익률은 투자가 이루어진 후 현실적으로 달성된 수익률을 말한다.\n④ 요구수익률은 투자에 수반되는 위험이 클수록 작아진다.\n⑤ 실현수익률은 다른 투자의 기회를 포기한다는 점에서 기회비용이라고도 한다.","1","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",3,0],[32,2021,11,22,0,"투자론","현금흐름·수익률·위험","옳은것 고르기","포트폴리오이론에 관한 설명으로 옳은 것은?(단, 위험회피형 투자자를 가정함)\n① 포트폴리오 분산투자를 통해 체계적 위험뿐만 아니라 비체계적 위험도 감소시킬 수 있다.\n② 효율적 프론티어(efficient frontier)는 평균-분산 지배원리에 의해 동일한 기대수익률을 얻을 수 있는 상황에서 위험을 최소화할 수 있는 포트폴리오의 집합을 말한다.\n③ 분산투자효과는 포트폴리오를 구성하는 투자자산 비중을 늘릴수록 체계적 위험이 감소되어 포트폴리오 전체의 위험이 감소되는 것이다.\n④ 최적의 포트폴리오는 투자자의 무차별곡선과 효율적 프론티어의 접점에서 선택된다.\n⑤ 두 자산으로 포트폴리오를 구성할 경우, 포트폴리오에 포함된 개별자산의 수익률 간 상관계수에 상관없이 분 산투자효과가 있다.","2,4","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",4,0],[32,2021,11,23,0,"투자론","투자분석기법(NPV·IRR 등)","옳은것 고르기","부동산 투자분석기법에 관한 설명으로 옳은 것은?\n① 부동산 투자분석기법 중 화폐의 시간가치를 고려한 방법에는 순현재가치법, 내부수익률법, 회계적이익률법이 있다.\n② 내부수익률이란 순현가를 ‘1’로 만드는 할인율이고, 기대수익률은 순현가를 ‘0’으로 만드는 할인율이다.\n③ 어림셈법 중 순소득승수법의 경우 승수값이 작을수록 자본회수기간이 길어진다.\n④ 순현가법에서는 재투자율로 시장수익률을 사용하고, 내부수익률법에서는 요구수익률을 사용한다.\n⑤ 내부수익률법에서는 내부수익률이 요구수익률보다 작은 경우 해당 투자안을 선택하지 않는다.","5","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",4,0],[32,2021,11,24,0,"투자론","현금흐름·수익률·위험","옳은것 고르기, 계산","다음 표와 같은 투자사업(A～C)이 있다. 모두 사업기 간이 1년이며, 사업 초기(1월 1일)에 현금지출만 발생하고 사업 말기(12월 31일)에는 현금유입만 발생한다고 한다. 할인율이 연 5%라고 할 때 다음 중 옳은 것은?\n투자사업 초기 현금지출 말기 현금유입 A 3,800만원 6,825만원 B 1,250만원 2,940만원 C 1,800만원 4,725만원\n① 수익성지수(PI)가 가장 큰 사업은 A이다.\n② 순현재가치(NPV)가 가장 큰 사업은 B이다.\n③ 수익성지수가 가장 작은 사업은 C이다.\n④ A의 순현재가치는 B의 순현재가치의 2.5배이다.\n⑤ A와 C의 순현재가치는 같다. 2021년 제32회 공인중개","5","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",4,0],[32,2021,11,25,0,"금융론","대출 상환방식·대출한도","박스형(모두고르기), 옳은것 고르기","부채금융(debt financing)에 해당하는 것을 모두 고른 것은?\nㄱ. 주택저당대출\nㄴ. 조인트 벤처(joint venture)\nㄷ. 신탁증서금융\nㄹ. 자산담보부기업어음(ABCP)\nㅁ. 부동산투자회사(REITs)\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㅁ ⑤ ㄷ, ㄹ, ㅁ","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",4,0],[32,2021,11,26,0,"입지·지대이론","공업입지·지대이론","","각 지역과 산업별 고용자수가 다음과 같을 때, A지역과 B지역에서 입지계수(LQ)에 따른 기반산업의 개수는?(단, 주어진 조건에 한하며, 결과 값은 소수점 셋째자리에서 반올림함) 전지역 구 분 A지역 B지역 고용자수 고용자수 30 50 X산업 80 입지계수 0.79 ?\n고용자수 30 30 Y산업 60 입지계수 ? ?\n고용자수 30 20 Z산업 50 입지계수 ? 0.76 고용자수 합계 90 100 190\n① A지역: 0개, B지역: 1개 ② A지역: 1개, B지역: 0개\n③ A지역: 1개, B지역: 1개 ④ A지역: 1개, B지역: 2개\n⑤ A지역: 2개, B지역: 1개","5","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",4,0],[32,2021,11,27,0,"금융론","대출 상환방식·대출한도","계산","A는 주택 구입을 위해 연초에 6억 원을 대출 받았다. A 가 받은 대출 조건이 다음과 같을 때, (ㄱ)대출금리와 3 회 차에 상환할 (ㄴ)원리금은?(단, 주어진 조건에 한함)\n○ 대출금리: 고정금리\n○ 대출기간: 30년\n○ 원리금 상환조건: 원금균등상환방식 매년 말 연단위로 상환\n○ 1회 차 원리금 상환액: 4,400만원\n① ㄱ: 연 4%, ㄴ: 4,240만원\n② ㄱ: 연 4%, ㄴ: 4,320만원\n③ ㄱ: 연 5%, ㄴ: 4,240만원\n④ ㄱ: 연 5%, ㄴ: 4,320만원\n⑤ ㄱ: 연 6%, ㄴ: 4,160만원","1","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",4,0],[32,2021,11,28,0,"금융론","대출 상환방식·대출한도","박스형(모두고르기), 옳은것 고르기","메자닌금융(mezzanine financing)에 해당하는 것을 모두 고른 것은?\nㄱ. 후순위대출 ㄴ. 전환사채\nㄷ. 주택상환사채 ㄹ. 신주인수권부사채\nㅁ. 보통주\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㅁ ⑤ ㄴ, ㄹ, ㅁ","2","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",4,0],[32,2021,11,29,0,"금융론","유동화·MBS·리츠·PF","틀린것 고르기","모기지(mortgage) 유동화에 관한 설명으로 틀린 것은?\n① MPTS(mortgage pass-through securities)는 지분형 증권이다.\n② MPTB(mortgage pay-through bond)의 경우, 조기상환 위험은 증권발행자가 부담하고, 채무불이행 위험은 투자자가 부담한다.\n③ MBB(mortgage backed bond)의 경우, 신용보강을 위한 초과담보가 필요하다.\n④ CMO(collateralized mortgage obligation)는 상환우선순위와 만기가 다른 다수의 층(tranche)으로 구성된 증권이다.\n⑤ 우리나라의 모기지 유동화중개기관으로는 한국주택금융 공사가 있다.","2","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",5,0],[32,2021,11,30,0,"금융론","대출 상환방식·대출한도","옳은것 고르기","대출 상환방식에 관한 설명으로 옳은 것은?(단, 고정금리 기준이고, 다른 조건은 동일함)\n① 원리금균등상환방식의 경우, 매기 상환하는 원금이 점차 감소한다.\n② 원금균등상환방식의 경우, 매기 상환하는 원리금이 동일하다.\n③ 원금균등상환방식의 경우, 원리금균등상환방식보다 대출금의 가중평균상환기간(duration)이 더 짧다.\n④ 점증(체증)상환방식의 경우, 장래 소득이 줄어들 것으로 예상되는 차입자에게 적합하다.\n⑤ 만기일시상환방식의 경우, 원금균등상환방식에 비해 대출 금융기관의 이자수입이 줄어든다.","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",5,0],[32,2021,11,31,0,"투자론","현금흐름·수익률·위험","","민간투자사업의 유형이 옳게 짝지어진 것은?\nㄱ. 민간사업자가 자금을 조달하여 시설을 건설하고, 일정기간 소유 및 운영을 한 후, 사업종료 후 국가 또는 지방자치단체 등에게 시설의 소유권을 이전하는 방식\nㄴ. 민간사업자가 자금을 조달하여 시설을 건설하고 일정기간 동안 타인에게 임대하고, 임대기간 종료 후 국가 또는 지방자치단체 등에게 시설의 소유권을 이전하는 방식\nㄷ. 민간사업자가 자금을 조달하여 시설을 건설하고, 준공과 함께 민간사업자가 당해 시설의 소유권과 운영권을 갖는 방식\n<보기>\na. BTO(build-transfer-operate) 방식\nb. BOT(build-operate-transfer) 방식\nc. BTL(build-transfer-lease) 방식\nd. BLT(build-lease-transfer) 방식\ne. BOO(build-own-operate) 방식 f. ROT(rehabilitate-operate-transfer) 방식\n① ㄱ-a, ㄴ-c, ㄷ-e ② ㄱ-a, ㄴ-d, ㄷ-e\n③ ㄱ-b, ㄴ-c, ㄷ-f ④ ㄱ-b, ㄴ-d, ㄷ-e\n⑤ ㄱ-b, ㄴ-d, ㄷ-f 2021년 제32회 공인중개","4","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",5,0],[32,2021,11,32,0,"개발·관리·마케팅","부동산마케팅","틀린것 고르기","부동산마케팅에 관한 설명으로 틀린 것은?\n① 부동산시장이 공급자 우위에서 수요자 우위의 시장으로 전환되면 마케팅의 중요성이 더욱 증대된다.\n② STP전략이란 고객집단을 세분화(Segmentation)하고 표적시장을 선정(Targeting)하여 효과적으로 판매촉진\n(Promotion)을 하는 전략이다.\n③ 경쟁사의 가격을 추종해야 할 경우 4P Mix의 가격전략 으로 시가전략을 이용한다.\n④ 관계 마케팅전략이란 고객과 공급자 간의 지속적인 관계를 유지하여 마케팅효과를 도모하는 전략이다.\n⑤ 시장점유 마케팅전략이란 부동산시장을 점유하기 위한 전략으로 4P Mix전략, STP전략이 있다.","2","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",5,0],[32,2021,11,33,0,"개발·관리·마케팅","부동산개발·민간투자","틀린것 고르기","부동산개발에 관한 설명으로 틀린 것은?\n① 부동산개발사업 진행시 행정의 변화에 따른 사업의 인․허가 지연위험은 사업시행자가 스스로 관리할 수 없는 위험이다.\n② 공영(공공)개발은 공공성과 공익성을 위해 택지를 조성한 후 분양 또는 임대하는 토지개발방식을 말한다.\n③ 환지방식은 택지가 개발되기 전 토지의 위치ㆍ지목ㆍ면적 등을 고려하여 택지개발 후 개발된 토지를 토지소유자에게 재분배하는 방식을 말한다.\n④ 부동산개발은 미래의 불확실한 수익을 근거로 개발을 진행하기 때문에 위험성이 수반된다.\n⑤ 흡수율분석은 재무적 사업타당성분석에서 사용했던 주요 변수들의 투입 값을 낙관적, 비관적 상황으로 적용하여 수익성을 예측하는 것을 말한다.","5","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",5,0],[32,2021,11,34,0,"개발·관리·마케팅","부동산마케팅","옳은것 고르기","부동산마케팅 전략에 관한 설명으로 옳은 것은?\n① 바이럴 마케팅(viral marketing)전략은 SNS, 블로그 등 다양한 매체를 통해 해당 브랜드나 제품에 대해 입소문을 내게 하여 마케팅효과를 극대화시키는 것이다.\n② 분양성공을 위해 아파트 브랜드를 고급스러운 이미지로 고객의 인식에 각인시키도록 하는 노력은 STP전략 중 시장세분화(Segmentation) 전략에 해당한다.\n③ 아파트 분양 모델하우스 방문고객 대상으로 추첨을 통해 자동차를 경품으로 제공하는 것은 4P Mix 전략 중 유통경로(Place)전략에 해당한다.\n④ 아파트의 차별화를 위해 커뮤니티 시설에 헬스장, 골프 연습장을 설치하는 방안은 4P Mix 전략 중 가격(Price) 전략에 해당한다.\n⑤ 고객점유 마케팅전략에서 AIDA의 원리는 주의\n(Attention) - 관심(Interest) - 결정(Decision) - 행동\n(Action)의 과정을 말한다.","1","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",5,0],[32,2021,11,35,0,"감정평가론","가치·가격원칙·지역분석","빈칸","다음은 감정평가 과정상 지역분석 및 개별분석과 관련된 내용이다. ( )에 들어갈 용어는?\n지역분석은 해당 지역의 ( ㄱ ) 및 그 지역 내 부동산의 가격수준을 판정하는 것이며, 개별분석은 대상부동산의 ( ㄴ )을 판정하는 것이다. 지역분석의 분석 대상지역 중 ( ㄷ )은 대상부동산이 속한 지역으로서 부동산의 이용이 동질적이고 가치형성요인 중 지역요인을 공유하는 지역이다.\n① ㄱ: 표준적이용, ㄴ: 최유효이용, ㄷ: 유사지역\n② ㄱ: 표준적이용, ㄴ: 최유효이용, ㄷ: 인근지역\n③ ㄱ: 최유효이용, ㄴ: 표준적이용, ㄷ: 유사지역\n④ ㄱ: 최유효이용, ㄴ: 표준적이용, ㄷ: 인근지역\n⑤ ㄱ: 최유효이용, ㄴ: 최유효이용, ㄷ: 유사지역","2","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",6,0],[32,2021,11,36,0,"감정평가론","감정평가 3방식·시산가액","틀린것 고르기","원가법에서 사용하는 감가수정 방법에 관한 설명으로 틀린 것은?\n① 정률법에서는 매년 감가율이 감소함에 따라 감가액이 감소한다.\n② 정액법에서는 감가누계액이 경과연수에 정비례하여 증가한다.\n③ 정액법을 직선법 또는 균등상각법이라고도 한다.\n④ 상환기금법은 건물 등의 내용연수가 만료될 때 감가누 계상당액과 그에 대한 복리계산의 이자상당액분을 포함하여 당해 내용연수로 상환하는 방법이다.\n⑤ 정액법, 정률법, 상환기금법은 모두 내용연수에 의한 감가수정 방법이다.","1","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",6,0],[32,2021,11,37,0,"감정평가론","감정평가에 관한 규칙","틀린것 고르기","감정평가에 관한 규칙상 용어의 정의로 틀린 것은?\n① 기준가치란 감정평가의 기준이 되는 가치를 말한다.\n② 가치형성요인이란 대상물건의 경제적 가치에 영향을 미치는 일반요인, 지역요인 및 개별요인 등을 말한다.\n③ 원가법이란 대상물건의 재조달원가에 감가수정을 하여 대상물건의 가액을 산정하는 감정평가방법을 말한다.\n④ 거래사례비교법이란 대상물건과 가치형성요인이 같거나 비슷한 물건의 거래사례와 비교하여 대상물건의 현황에 맞게 사정보정, 시점수정, 가치형성요인 비교 등의 과정을 거쳐 대상물건의 가액을 산정하는 감정평가방법을 말한다.\n⑤ 수익분석법이란 대상물건이 장래 산출할 것으로 기대되는 순수익이나 미래의 현금흐름을 환원하거나 할인하여 대상물건의 가액을 산정하는 감정평가방법을 말한다. 2021년 제32회 공인중개","5","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",6,0],[32,2021,11,38,0,"감정평가론","감정평가 3방식·시산가액","계산","다음 자료를 활용하여 직접환원법으로 산정한 대상부동산의 수익가액은?(단, 연간 기준이며, 주어진 조건에 한함)\n○ 가능총소득(PGI): 70,000,000원\n○ 공실상당액 및 대손충당금: 가능총소득의 5%\n○ 영업경비(OE): 유효총소득(EGI)의 40%\n○ 환원율: 10%\n① 245,000,000원 ② 266,000,000원 ③ 385,00 유흥비로 탕진하였다. 이에 관한 설명으로 틀린 것은?(단, 표현대리는 성립하지 않으며, 다툼이 있으면 판례에 따름)\n① 매수인의 지위 양도계약 체결 당시 乙의 무권대리를 모른 丙은 甲의 추인이 있을 때까지 계약을 철회할 수 있다.\n② 丙이 계약을 유효하게 철회하면, 무권대리행위는 확정적으로 무효가 된다.\n③ 丙이 계약을 유효하게 철회하면, 丙은 甲을 상대로 계약금 상당의 부당이득반환을 청구할 수 있다.\n④ 丙이 계약을 철회한 경우, 甲이 그 철회의 유효를 다투 기 위해서는 乙에게 대리권이 없음을 丙이 알았다는 것에 대해 증명해야 한다.\n⑤ 丙의 계약 철회 전 甲이 사망하고 乙이 단독상속인이 된 경우, 乙이 선의․무과실인 丙에게 추인을 거절하는 것은 신의칙에 반한다. 2021년 제32회 공인중개","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",7,0],[32,2021,11,44,1,"민법총칙","의사표시(착오·사기·통정허위)","판례, 옳은것 고르기","의사와 표시가 불일치하는 경우에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 통정허위표시의 무효로 대항할 수 없는 제3자에 해당하 는지를 판단할 때, 파산관재인은 파산채권자 일부가 선의라면 선의로 다루어진다.\n② 비진의 의사표시는 상대방이 표의자의 진의 아님을 알 수 있었을 경우 취소할 수 있다.\n③ 비진의 의사표시는 상대방과 통정이 없었다는 점에서 착오와 구분된다.\n④ 통정허위표시의 무효에 대항하려는 제3자는 자신이 선의라는 것을 증명하여야 한다.\n⑤ 매수인의 채무불이행을 이유로 매도인이 계약을 적법하게 해제했다면, 착오를 이유로 한 매수인의 취소권은 소멸한다.","1","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",7,0],[32,2021,11,45,1,"물권법","물권변동·등기","박스형(모두고르기), 판례, 틀린것 고르기","효력규정이 아닌 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. ｢부동산등기 특별조치법｣상 중간생략등기를 금지하는 규정\nㄴ. ｢공인중개사법｣상 개업공인중개사가 중개의뢰인과 직접 거래를 하는 행위를 금지하는 규정\nㄷ. ｢공인중개사법｣상 개업공인중개사가 법령에 규정된 중개보수 등을 초과하여 금품을 받는 행위를 금지하는 규정\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄴ ⑤ ㄴ, ㄷ","4","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",7,0],[32,2021,11,46,1,"계약법","매매(계약금·담보책임·환매)","판례, 틀린것 고르기","부동산이중매매에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 반사회적 법률행위에 해당하는 제2매매계약에 기초하여 제2매수인으로부터 그 부동산을 매수하여 등기한 선의의 제3자는 제2매매계약의 유효를 주장할 수 있다.\n② 제2매수인이 이중매매사실을 알았다는 사정만으로 제2매매계약을 반사회적 법률행위에 해당한다고 볼 수 없다.\n③ 특별한 사정이 없는 한, 먼저 등기한 매수인이 목적 부동산의 소유권을 취득한다.\n④ 반사회적 법률행위에 해당하는 이중매매의 경우, 제1매수인은 제2매수인에 대하여 직접 소유권이전등기말소를 청구할 수 없다.\n⑤ 부동산이중매매의 법리는 이중으로 부동산임대차계약이 체결되는 경우에도 적용될 수 있다.","1","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",7,0],[32,2021,11,47,1,"민법총칙","무효·취소·추인","틀린것 고르기","법률행위의 취소에 관한 설명으로 틀린 것은?\n① 취소권은 추인할 수 있는 날로부터 3년내에 법률행위를 한 날로부터 10년내에 행사해야 한다.\n② 취소할 수 있는 법률행위에 관하여 법정추인이 되려면 취소권자가 취소권의 존재를 인식해야 한다.\n③ 취소된 법률행위는 처음부터 무효인 것으로 본다.\n④ 취소권의 법적성질은 형성권이다.\n⑤ 취소할 수 있는 법률행위의 상대방이 확정된 경우, 그 취소는 그 상대방에 대한 의사표시로 하여야 한다.","2","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",7,0],[32,2021,11,48,1,"민법총칙","대리(무권대리·표현대리)","판례, 옳은것 고르기","표현대리에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 본인이 타인에게 대리권을 수여하지 않았지만 수여하였 다고 상대방에게 통보한 경우, 그 타인이 통보받은 상대방 외의 자와 본인을 대리하여 행위를 한 때는 민법 제125조의 표현대리가 적용된다.\n② 표현대리가 성립하는 경우, 과실상계의 법리를 유추적 용하여 본인의 책임을 경감할 수 있다.\n③ 민법 제129조의 표현대리를 기본대리권으로 하는 민법 제126조의 표현대리는 성립될 수 없다.\n④ 대리행위가 강행법규에 위반하여 무효인 경우에는 표현대리의 법리가 적용되지 않는다.\n⑤ 유권대리의 주장 속에는 표현대리의 주장이 포함되어 있다.","4","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",8,0],[32,2021,11,49,1,"민법총칙","조건·기한","틀린것 고르기","법률행위의 조건과 기한에 관한 설명으로 틀린 것은?\n① 법정조건은 법률행위의 부관으로서의 조건이 아니다.\n② 조건이 선량한 풍속 기타 사회질서에 위반한 것이면 그 법률행위는 무효이다.\n③ 조건부 법률행위는 조건이 성취되었을 때에 비로소 그 법률행위가 성립한다.\n④ 조건부 법률행위에서 불능조건이 정지조건이면 그 법률행위는 무효이다.\n⑤ 과거의 사실은 법률행위의 부관으로서의 조건으로 되지 못한다.","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",8,0],[32,2021,11,50,1,"민법총칙","무효·취소·추인","판례, 옳은것 고르기","법률행위의 무효에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 무효인 법률행위의 추인은 그 무효의 원인이 소멸한 후에 하여야 그 효력이 인정된다.\n② 무효인 법률행위는 무효임을 안 날로부터 3년이 지나면 추인할 수 없다.\n③ 법률행위의 일부분이 무효일 때, 그 나머지 부분의 유효성을 판단함에 있어 나머지 부분을 유효로 하려는 당사자의 가정적 의사는 고려되지 않는다.\n④ 무효인 법률행위의 추인은 묵시적인 방법으로 할 수는 없다.\n⑤ 강행법규 위반으로 무효인 법률행위를 추인한 때에는 다른 정함이 없으면 그 법률행위는 처음부터 유효한 법률행위가 된다.","1","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",8,0],[32,2021,11,51,1,"물권법","물권 일반","틀린것 고르기","물권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 민법 제185조에서의 ‘법률’은 국회가 제정한 형식적 의미의 법률을 의미한다.\n② 사용ㆍ수익 권능을 대세적ㆍ영구적으로 포기한 소유권도 존재한다. 2021년 제32회 공인중개\n③ 처분권능이 없는 소유권은 인정되지 않는다.\n④ 근린공원을 자유롭게 이용한 사정만으로 공원이용권이 라는 배타적 권리를 취득하였다고 볼 수는 없다.\n⑤ 온천에 관한 권리를 관습법상의 물권이라고 볼 수는 없다.","2","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",8,0],[32,2021,11,52,1,"물권법","물권적 청구권","판례, 옳은것 고르기","물권적 청구권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 소유권을 양도한 전소유자가 물권적 청구권만을 분리, 유보하여 불법점유자에 대해 그 물권적 청구권에 의한 방해배제를 할 수 있다.\n② 물권적 청구권을 행사하기 위해서는 그 상대방에게 귀책사유가 있어야 한다.\n③ 소유권에 기한 방해배제청구권에 있어서 방해에는 과거에이미 종결된 손해가 포함된다.\n④ 소유권에 기한 물권적 청구권은 그 소유권과 분리하여 별도의 소멸시효의 대상이 된다.\n⑤ 소유권에 기한 물권적 청구권은 그 소유자가 소유권을 상실하면 더 이상 인정되지 않는다.","5","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",8,0],[32,2021,11,53,1,"민법총칙","법률행위(반사회·불공정)","박스형(모두고르기), 판례, 옳은것 고르기","등기청구권에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 등기청구권이란 등기권리자와 등기의무자가 함께 국가에 등기를 신청하는 공법상의 권리이다.\nㄴ. 부동산 매수인이 그 목적물을 인도받아 이를 사용수익하고 있는 이상 그 매수인의 등기청 구권은 시효로 소멸하지 않는다.\nㄷ. 취득시효완성으로 인한 소유권이전등기청구권은 시효완성 당시의 등기명의인이 동의해야만 양도할 수 있다.\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄴ ⑤ ㄴ, ㄷ","2","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",8,0],[32,2021,11,54,1,"물권법","물권변동·등기","판례, 틀린것 고르기","청구권보전을 위한 가등기에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 가등기된 소유권이전청구권은 가등기에 대한 부기등기의 방법으로 타인에게 양도될 수 있다.\n② 정지조건부 청구권을 보전하기 위한 가등기도 허용된다.\n③ 가등기에 기한 본등기 절차에 의하지 않고 별도의 본등기를 경료받은 경우, 제3자 명의로 중간처분의 등기가 있어도 가등기에 기한 본등기 절차의 이행을 구할 수 없다.\n④ 가등기는 물권적 청구권을 보전하기 위해서는 할 수 없다.\n⑤ 소유권이전청구권을 보전하기 위한 가등기에 기한 본등기를 청구하는 경우, 가등기 후 소유자가 변경되더라도 가등기 당시의 등기명의인을 상대로 하여야 한다.","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",8,0],[32,2021,11,55,1,"민사특별법","집합건물법","판례, 옳은것 고르기","甲, 乙, 丙은 X토지를 각 1/2, 1/4, 1/4의 지분으로 공유하고 있다. 이에 관한 설명으로 옳은 것은?(단, 구분소유적 공유관계는 아니며, 다툼이 있으면 판례에 따름)\n① 乙이 X토지에 대한 자신의 지분을 포기한 경우, 乙의 지분은 甲, 丙에게 균등한 비율로 귀속된다.\n② 당사자간의 특약이 없는 경우, 甲은 단독으로 X토지를 제3자에게 임대할 수 있다.\n③ 甲, 乙은 X토지에 대한 관리방법으로 X토지에 건물을 신축할 수 있다.\n④ 甲, 乙, 丙이 X토지의 관리에 관한 특약을 한 경우, 그 특약은 특별한 사정이 없는 한 그들의 특정승계인에게도 효력이 미친다.\n⑤ 丙이 甲, 乙과의 협의없이 X토지를 배타적ㆍ독점적으로 점유하고 있는 경우, 乙은 공유물에 대한 보존행위로 X 토지의 인도를 청구할 수 있다.","4","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",9,0],[32,2021,11,56,1,"물권법","소유권(취득시효·부합·상린)","판례, 틀린것 고르기","소유권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 기술적 착오로 지적도상의 경계선이 진실한 경계선과 다르게 작성된 경우, 그 토지의 경계는 실제의 경계에 따른다.\n② 토지가 포락되어 원상복구가 불가능한 경우, 그 토지에 대한 종전 소유권은 소멸한다.\n③ 타인의 토지를 통과하지 않으면 필요한 수도를 설치할 수 없는 토지의 소유자는 그 타인의 승낙 없이도 수도를 시설할 수 있다.\n④ 포위된 토지가 공로에 접하게 되어 주위토지통행권을 인정할 필요성이 없어진 경우에도 그 통행권은 존속한다.\n⑤ 증축된 부분이 기존의 건물과 구조상ㆍ이용상 독립성이 없는 경우, 그 부분은 기존의 건물에 부합한다.","4","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",9,0],[32,2021,11,57,1,"물권법","소유권(취득시효·부합·상린)","판례, 틀린것 고르기","부동산의 점유취득시효에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 성명불상자(姓名不詳者)의 소유물에 대하여 시효취득을 인정할 수 있다.\n② 국유재산도 취득시효기간 동안 계속하여 일반재산인 경우 취득시효의 대상이 된다.\n③ 점유자가 자주점유의 권원을 주장하였으나 이것이 인정되지 않는 경우, 특별한 사정이 없는 한 자주점유의 추정은 번복된다.\n④ 점유의 승계가 있는 경우 시효이익을 받으려는 자는 자기 또는 전(前)점유자의 점유개시일 중 임의로 점유기 산점을 선택할 수 있다.\n⑤ 취득시효완성 후 소유권이전등기를 마치지 않은 시효완성자는 소유자에 대하여 취득시효 기간 중의 점유로 발생한 부당이득의 반환의무가 없다. 2021년 제32회 공인중개","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",9,0],[32,2021,11,58,1,"물권법","점유권","판례, 틀린것 고르기","점유권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 특별한 사정이 없는 한, 건물의 부지가 된 토지는 그 건물의 소유자가 점유하는 것으로 보아야 한다.\n② 전후 양 시점의 점유자가 다른 경우 점유승계가 증명되면 점유계속은 추정된다.\n③ 적법하게 과실을 취득한 선의의 점유자는 회복자에게 통상의 필요비의 상환을 청구하지 못한다.\n④ 점유자가 상대방의 사기에 의해 물건을 인도한 경우 점유 침탈을 이유로 한 점유물반환청구권은 발생하지 않는다.\n⑤ 선의의 점유자가 본권의 소에서 패소하면 패소 확정시 부터 악의의 점유자로 본다.","5","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",9,0],[32,2021,11,59,1,"물권법","소유권(취득시효·부합·상린)","박스형(모두고르기), 판례, 틀린것 고르기","지상권에 관한 설명으로 틀린 것을 모두 고른 것은?\n(다툼이 있으면 판례에 따름)\nㄱ. 담보목적의 지상권이 설정된 경우 피담보채권이 변제로 소멸하면 그 지상권도 소멸한다.\nㄴ. 지상권자의 지료지급 연체가 토지소유권의 양도 전후에 걸쳐 이루어진 경우, 토지양수인은 자신에 대한 연체기간이 2년 미만이더라도 지상권의 소멸을 청구할 수 있다.\nㄷ. 분묘기지권을 시효취득한 자는 토지소유자가 지료를 청구한 날부터의 지료를 지급할 의무가 있다.\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄴ ⑤ ㄴ, ㄷ","2","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",9,0],[32,2021,11,60,1,"물권법","지역권","틀린것 고르기","지역권에 관한 설명으로 틀린 것은?\n① 지역권은 요역지와 분리하여 따로 양도하거나 다른 권리의 목적으로 하지 못한다.\n② 1필의 토지의 일부에는 지역권을 설정할 수 없다.\n③ 요역지의 공유자 중 1인이 지역권을 취득한 경우, 요역지의 다른 공유자도 지역권을 취득한다.\n④ 지역권에 기한 승역지 반환청구권은 인정되지 않는다.\n⑤ 계속되고 표현된 지역권은 시효취득의 대상이 될 수 있다.","2","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",9,0],[32,2021,11,61,1,"물권법","전세권","판례, 틀린것 고르기","전세권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 전세금의 지급은 전세권 성립의 요소이다.\n② 당사자가 주로 채권담보의 목적을 갖는 전세권을 설정하였더라도 장차 전세권자의 목적물에 대한 사용수익권을 완전히 배제하는 것이 아니라면 그 효력은 인정된다.\n③ 건물전세권이 법정갱신된 경우 전세권자는 전세권갱신에 관한 등기없이도 제3자에게 전세권을 주장할 수 있다.\n④ 전세권의 존속기간 중 전세목적물의 소유권이 양도되면, 그 양수인이 전세권설정자의 지위를 승계한다.\n⑤ 건물의 일부에 대한 전세에서 전세권설정자가 전세금의 반환을 지체하는 경우, 전세권자는 전세권에 기하여 건물 전부에 대해서 경매청구할 수 있다.","5","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",9,0],[32,2021,11,62,1,"계약법","해제·해지","박스형(모두고르기), 판례, 옳은것 고르기","저당부동산의 제3취득자에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 저당부동산에 대한 후순위저당권자는 저당부동산의 피담보채권을 변제하고 그 저당권의 소멸을 청구할 수 있는 제3취득자에 해당하지 않는다.\nㄴ. 저당부동산의 제3취득자는 부동산의 보존․개량을 위해 지출한 비용을 그 부동산의 경매대가에서 우선상환을 받을 수 없다.\nㄷ. 저당부동산의 제3취득자는 저당권을 실행하는 경매에 참가하여 매수인이 될 수 있다.\nㄹ. 피담보채권을 변제하고 저당권의 소멸을 청구할 수 있는 제3취득자에는 경매신청 후에 소유권, 지상권 또는 전세권을 취득한 자도 포함된다.\n① ㄱ, ㄴ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄱ, ㄷ, ㄹ ⑤ ㄴ, ㄷ, ㄹ","4","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",10,0],[32,2021,11,63,1,"물권법","저당권·근저당권","판례, 틀린것 고르기","저당권의 효력이 미치는 목적물의 범위에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 당사자는 설정계약으로 저당권의 효력이 종물에 미치지 않는 것으로 정할 수 있다.\n② 저당권의 목적토지가 ｢공익사업을 위한 토지 등의 취득및 보상에 관한 법률｣에 따라 협의취득된 경우, 저당권자는 그 보상금청구권에 대해 물상대위권을 행사할 수 없다.\n③ 건물 소유를 목적으로 토지를 임차한 자가 그 토지 위에 소유하는 건물에 저당권을 설정한 경우 건물 소유를 목적으로 한 토지 임차권에도 저당권의 효력이 미친다.\n④ 저당목적물의 변형물인 금전에 대해 이미 제3자가 압류한 경우 저당권자는 물상대위권을 행사할 수 없다.\n⑤ 저당부동산에 대한 압류 이후의 저당권설정자의 저당부동산에 관한 차임채권에도 저당권의 효력이 미친다.","4","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",10,0],[32,2021,11,64,1,"민법총칙","법률행위(반사회·불공정)","판례","유치권 성립을 위한 견련관계가 인정되는 경우를 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 임대인과 임차인 사이에 건물명도시 권리금을 반환하기로 약정을 한 때, 권리금반환청구권을 가지고 건물에 대한 유치권을 주장하는 경우\nㄴ. 건물의 임대차에서 임차인의 임차보증금반환 청구권으로써 임차인이 그 건물에 유치권을 주장하는 경우\nㄷ. 가축이 타인의 농작물을 먹어 발생한 손해에 관한 배상청구권에 기해 그 타인이 그 가축에 대한 유치권을 주장하는 경우\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄷ ⑤ ㄴ, ㄷ 2021년 제32회 공인중개사","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",10,0],[32,2021,11,65,1,"계약법","동시이행·위험부담","박스형(모두고르기), 판례","동시이행관계에 있는 것을 모두 고른 것은?(단, 이에 관한 특약은 없으며, 다툼이 있으면 판례에 따름)\nㄱ. 부동산의 매매계약이 체결된 경우 매도인의 소유권이전등기의무와 매수인의 잔대금지급의무\nㄴ. 임대차 종료시 임대인의 임차보증금 반환의무와 임차인의 임차물 반환의무\nㄷ. 매도인의 토지거래허가 신청절차에 협력할 의무와 매수인의 매매대금지급의무\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄴ ⑤ ㄴ, ㄷ","4","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",10,0],[32,2021,11,66,1,"계약법","제3자를 위한 계약","판례, 틀린것 고르기","제3자를 위한 계약에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 제3자의 권리는 그 제3자가 채무자에 대해 수익의 의사표시를 하면 계약의 성립시에 소급하여 발생한다.\n② 제3자는 채무자의 채무불이행을 이유로 그 계약을 해제할 수 없다.\n③ 채무자에게 수익의 의사표시를 한 제3자는 그 채무자에게 그 채무의 이행을 직접 청구할 수 있다.\n④ 채무자는 상당한 기간을 정하여 계약이익의 향수 여부의 확답을 제3자에게 최고할 수 있다.\n⑤ 채무자와 인수인의 계약으로 체결되는 병존적 채무인수는 제3자를 위한 계약으로 볼 수 있다.","1","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",10,0],[32,2021,11,67,1,"계약법","해제·해지","판례, 틀린것 고르기","합의해제에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 부동산매매계약이 합의해제된 경우, 다른 약정이 없는 한 매도인은 수령한 대금에 이자를 붙여 반환할 필요가 없다.\n② 당사자 쌍방은 자기 채무의 이행제공 없이 합의에 의해 계약을 해제할 수 있다.\n③ 합의해제의 소급효는 법정해제의 경우와 같이 제3자의 권리를 해하지 못한다.\n④ 계약이 합의해제된 경우 다른 사정이 없는 한, 합의해제 시에 채무불이행으로 인한 손해배상을 청구할 수 있다.\n⑤ 매도인이 잔금기일 경과 후 해제를 주장하며 수령한 대금을 공탁하고 매수인이 이의 없이 수령한 경우, 특별한 사정이 없는 한 합의해제된 것으로 본다.","4","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",10,0],[32,2021,11,68,1,"계약법","계약의 성립(청약·승낙)","판례, 옳은것 고르기","청약에 관한 설명으로 옳은 것은?(단, 특별한 사정은 없으며, 다툼이 있으면 판례에 따름)\n① 불특정다수인에 대한 청약은 효력이 없다.\n② 청약이 상대방에게 도달하여 그 효력이 발생하더라도 청약자는 이를 철회할 수 있다.\n③ 당사자간에 동일한 내용의 청약이 상호교차된 경우, 양 청약이 상대방에게 발송된 때에 계약이 성립한다.\n④ 계약내용이 제시되지 않은 광고는 청약에 해당한다.\n⑤ 하도급계약을 체결하려는 교섭당사자가 견적서를 제출하는 행위는 청약의 유인에 해당한다.","5","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",10,0],[32,2021,11,69,1,"민법총칙","무효·취소·추인","판례, 틀린것 고르기","약관에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 고객에게 부당하게 과중한 지연 손해금 등의 손해배상의무를 부담시키는 약관 조항은 무효로 한다.\n② 약관내용이 명백하지 못한 때에는 약관작성자에게 불리 하게 제한해석해야 한다.\n③ 보통거래약관은 신의성실의 원칙에 따라 그 약관의 목적과 취지를 고려하여 공정하고 합리적으로 해석해야 한다.\n④ 고객에게 부당하게 불리한 약관조항은 공정을 잃은 것으로 추정된다.\n⑤ 보통거래약관의 내용은 개개 계약체결자의 의사나 구체적인 사정을 고려하여 구체적ㆍ주관적으로 해석해야 한다.","5","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",11,0],[32,2021,11,70,1,"계약법","매매(계약금·담보책임·환매)","판례, 틀린것 고르기","수량을 지정한 매매의 목적물의 일부가 멸실된 경우 매도인의 담보책임에 관한 설명으로 틀린 것은?(단, 이에 관한 특약은 없으며, 다툼이 있으면 판례에 따름)\n① 수량을 지정한 매매란 특정물이 일정한 수량을 가지고 있다는 데 주안을 두고 대금도 그 수량을 기준으로 정한 경우를 말한다.\n② 악의의 매수인은 대금감액과 손해배상을 청구할 수 있다.\n③ 선의의 매수인은 멸실된 부분의 비율로 대금감액을 청구할 수 있다.\n④ 잔존한 부분만이면 매수하지 아니하였을 때에는 선의의 매수인은 계약전부를 해제할 수 있다.\n⑤ 선의의 매수인은 일부멸실의 사실을 안 날부터 1년내에 매도인의 담보책임에 따른 매수인의 권리를 행사해야 한다.","2","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",11,0],[32,2021,11,71,1,"민법총칙","법률행위(반사회·불공정)","판례, 틀린것 고르기, 계산","甲은 자기 소유 X토지를 3억원에 乙에게 매도하면서 동시에 환매할 권리를 보유하기로 약정하고 乙이 X 토지에 대한 소유권 이전등기를 마쳤다. 이에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 특별한 약정이 없는 한, 甲은 환매기간 내에 그가 수령한 3억원과 乙이 부담한 매매비용을 반환하고 X토지를 환매할 수 있다.\n② 甲과 乙이 환매기간을 정하지 아니한 경우 그 기간은 5 년으로 한다.\n③ 환매등기는 乙 명의의 소유권이전등기에 대한 부기등기의 형식으로 한다.\n④ 만일 甲의 환매등기 후 丙이 乙로부터 X토지를 매수하 였다면, 乙은 환매등기를 이유로 丙의 X토지에 대한 소유권이전등기청구를 거절할 수 있다.\n⑤ 만일 甲의 환매등기 후 丁이 X토지에 乙에 대한 채권을 담보하기 위하여 저당권을 설정하였다면, 甲이 적법하게 환매권을 행사하여 X토지의 소유권이전등기를 마친 경우 丁의 저당권은 소멸한다. 2021년 제32회 공인중개사","4","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",11,0],[32,2021,11,72,1,"계약법","매매(계약금·담보책임·환매)","박스형(모두고르기), 판례, 옳은것 고르기","부동산의 교환계약에 관한 설명으로 옳은 것을 모두고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 유상ㆍ쌍무계약이다.\nㄴ. 일방이 금전의 보충지급을 약정한 경우 그 금전에 대하여는 매매대금에 관한 규정을 준용한다.\nㄷ. 다른 약정이 없는 한 각 당사자는 목적물의 하자에 대해 담보책임을 부담한다.\nㄹ. 당사자가 자기 소유 목적물의 시가를 묵비하 여 상대방에게 고지하지 않은 경우, 특별한 사정이 없는 한 상대방의 의사결정에 불법적인 간섭을 한 것이다.\n① ㄱ, ㄴ ② ㄷ, ㄹ ③ ㄱ, ㄴ, ㄷ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",11,0],[32,2021,11,73,1,"계약법","임대차(민법)","판례, 틀린것 고르기","乙이 甲으로부터 건물의 소유를 목적으로 X토지를 10 년간 임차하여 그 위에 자신의 건물을 신축한 경우에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 특별한 사정이 없는 한 甲이 X토지의 소유자가 아닌 경우에도 임대차 계약은 유효하게 성립한다.\n② 甲과 乙 사이에 반대약정이 없으면 乙은 甲에 대하여 임대차등기절차에 협력할 것을 청구할 수 있다.\n③ 乙이 현존하는 지상건물을 등기해도 임대차를 등기하지 않은 때에는 제3자에 대해 임대차의 효력이 없다.\n④ 10년의 임대차 기간이 경과한 때 乙의 지상건물이 현존하는 경우 乙은 임대차 계약의 갱신을 청구할 수 있다.\n⑤ 乙의 차임연체액이 2기의 차임액에 달하는 경우, 특약이 없는 한 甲은 임대차 계약을 해지할 수 있다.","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",11,0],[32,2021,11,74,1,"계약법","임대차(민법)","판례, 틀린것 고르기, 계산","甲은 자기 소유 X창고건물 전부를 乙에게 월차임 60 만원에 3년간 임대하였고, 乙은 甲의 동의를 얻어 X 건물 전부를 丙에게 월차임 70만원에 2년간 전대하였다. 이에 관한 설명으로 틀린 것은?(단, 이에 관한 특약은 없으며, 다툼이 있으면 판례에 따름)\n① 甲과 乙의 합의로 임대차 계약을 종료한 경우 丙의 권리는 소멸한다.\n② 丙은 직접 甲에 대해 월차임 60만원을 지급할 의무를 부담한다.\n③ 甲은 乙에게 월차임 60만원의 지급을 청구할 수 있다.\n④ 甲에 대한 차임연체액이 120만원에 달하여 甲이 임대차계약을 해지한 경우, 丙에게 그 사유를 통지하지 않아도 해지로써 丙에게 대항할 수 있다.\n⑤ 전대차 기간이 만료한 경우 丙은 甲에게 전전대차(前轉 貸借)와 동일한 조건으로 임대할 것을 청구할 수 없다.","1","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",11,0],[32,2021,11,75,1,"민사특별법","주택임대차보호법","판례, 틀린것 고르기","주택임대차보호법상의 대항력에 관한 설명으로 틀린 것은?(단, 일시사용을 위한 임대차가 아니고 임차권등기가 이루어지지 아니한 경우를 전제하며 다툼이 있으면 판례에 따름)\n① 임차인이 타인의 점유를 매개로 임차주택을 간접점유하는 경우에도 대항요건인 점유가 인정될 수 있다.\n② 임차인이 지위를 강화하고자 별도로 전세권 설정등기를 마친 후 ｢주택임대차보호법｣상의 대항요건을 상실한 경우, ｢주택임대차보호법｣상의 대항력을 상실한다.\n③ 주민등록을 마치고 거주하던 자기 명의의 주택을 매도한 자가 매도와 동시에 이를 다시 임차하기로 약정한 경우, 매수인 명의의 소유권 이전등기 여부와 관계없이 대항력이 인정된다.\n④ 임차인이 주택의 인도와 주민등록을 마친 때에는 그 다음 날 오전 영시부터 대항력이 생긴다.\n⑤ 임차인이 가족과 함께 임차주택의 점유를 계속하면서 가족의 주민등록은 그대로 둔 채 임차인의 주민등록만 일시적으로 옮긴 경우 대항력을 상실하지 않는다.","3","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",12,0],[32,2021,11,76,1,"민사특별법","주택임대차보호법","박스형(모두고르기), 옳은것 고르기","주택임대차보호법상 임차인의 계약갱신요구권에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 임대차기간이 끝나기 6개월 전부터 2개월 전까지의 기간에 행사해야 한다.\nㄴ. 임대차의 조건이 동일한 경우 여러 번 행사할 수 있다.\nㄷ. 임차인이 임대인의 동의 없이 목적 주택을 전대한 경우 임대인은 계약갱신요구를 거절하지 못한다.\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄷ ⑤ ㄴ, ㄷ","1","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",12,0],[32,2021,11,77,1,"민사특별법","상가건물임대차보호법","박스형(모두고르기), 판례, 옳은것 고르기, 계산","甲은 2021년 2월 1일 서울특별시에 위치한 乙 소유 X상가건물에 대하여 보증금 5억원, 월차임 5백만원 으로 임대차계약을 체결하였다. 甲은 2021년 2월 15 일 건물의 인도를 받아 영업을 개시하고, 사업자등록을 신청하였다. 이에 관한 설명으로 옳은 것을 모두고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 위 계약에는 확정일자 부여 등에 대해 규정하고 있는 ｢상가건물 임대차보호법｣ 제4조의 규정이 적용된다.\nㄴ. 甲이 임차건물의 일부를 중과실로 파손한 경우 계약갱신을 요구할 수 있다.\nㄷ. 甲이 2개월분의 차임을 연체하던 중 매매로 건물의 소유자가 丙으로 바뀐 경우, 특별한 사정이 없는 한 연체차임은 乙에게 지급해야 한다.\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄴ ⑤ ㄱ, ㄷ 2021년 제32회 공인중개사","전항정답","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",12,0],[32,2021,11,78,1,"민사특별법","가등기담보법","판례, 틀린것 고르기","가등기담보등에 관한 법률에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 담보가등기를 마친 부동산에 대하여 강제경매가 된 경우 담보가등기권리는 그 부동산의 매각에 의해 소멸한다.\n② 가등기의 피담보채권은 당사자의 약정과 관계없이 가등기의 원인증서인 매매예약서상의 매매대금의 한도로 제한된다.\n③ 채무자가 청산기간이 지나기 전에 한 청산금에 관한 권리의 양도는 이로써 후순위권리자에게 대항하지 못한다.\n④ 가등기가 담보가등기인지 여부는 거래의 실질과 당사자의 의사해석에 따라 결정된다.\n⑤ 가등기담보부동산의 예약 당시 시가가 그 피담보채무액에 미달하는 경우에는 청산금평가액의 통지를 할 필요가 없다.","2","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",12,0],[32,2021,11,79,1,"민사특별법","부동산실명법(명의신탁)","판례, 틀린것 고르기","甲은 법령상의 제한을 피하여 乙 소유의 X부동산을 매수하고자 자신의 친구 丙과 X부동산의 매수에 관한 명의신탁약정을 체결하였다. 그에 따라 2021년 5 월 丙은 乙과 X부동산 매매계약을 체결하고, 甲의 자금으로 그 대금을 지급하여 丙 명의로 등기 이전을 마쳤다. 이에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 甲과 丙 사이의 명의신탁약정은 무효이다.\n② 乙이 매매계약 체결 당시 그 명의신탁약정이 있다는 사실을 알았다면 丙은 X부동산의 소유권을 취득할 수 없다.\n③ 乙이 매매계약 체결 당시 그 명의신탁약정이 있다는 사실을 몰랐다면, 그 후 명의신탁약정 사실을 알게 되었 어도 丙은 X부동산의 소유권을 취득한다.\n④ 丙이 X부동산의 소유권을 취득한 경우 甲은 丙에게 제공한 X부동산의 매수자금 상당액을 부당이득으로 반환청구할 수 있다.\n⑤ X부동산의 소유권을 유효하게 취득한 丙이 명의신탁약정 외의 적법한 원인에 의하여 甲 앞으로 X부동산에 대한 소유권이전등기를 마친다고 해도 그 소유권이전등기는 무효이다.","5","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",12,0],[32,2021,11,80,1,"민사특별법","집합건물법","박스형(모두고르기), 판례, 틀린것 고르기","집합건물의 소유 및 관리에 관한 법률에 관한 설명으로 틀린 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 구분건물이 객관적ㆍ물리적으로 완성되더라도 그 건물이 집합건축물대장에 등록되지 않는 한 구분소유권의 객체가 되지 못한다.\nㄴ. 집합건물구분소유권의 특별승계인이 그 구분소유 권을 다시 제3자에게 이전한 경우, 관리규약에 달리 정함이 없는 한, 각 특별승계인들은 자신의 전(前)구분소유자의 공용부분에 대한 체납관리비를 지급할 책임이 있다.\nㄷ. 전유부분은 구분소유권의 목적인 건물부분을 말한다.\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄴ ⑤ ㄴ, ㄷ","1","1bLCeJFyMjHFv0SSkCAc8gOFB4qUMvpcF",12,0],[32,2021,21,1,2,"공인중개사법","중개대상물·용어","판례, 옳은것 고르기","공인중개사법령상 중개대상물에 해당하는 것은?(다툼이 있으면 판례에 따름)\n① 토지에서 채굴되지 않은 광물\n② 영업상 노하우 등 무형의 재산적 가치\n③ 토지로부터 분리된 수목\n④ 지목(地目)이 양어장인 토지\n⑤ 주택이 철거될 경우 일정한 요건하에 택지개발지구 내 이주자택지를 공급받을 수 있는 지위","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",1,0],[32,2021,21,2,2,"공인중개사법","중개보수·실비","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 공인중개사 정책심의위원회(이하 ‘위원회’라 함)에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 위원회는 중개보수 변경에 관한 사항을 심의할 수 있다.\nㄴ. 위원회는 위원장 1명을 포함하여 7명 이상 11명 이내의 위원으로 구성한다.\nㄷ. 위원장은 국토교통부장관이 된다.\nㄹ. 위원장이 부득이한 사유로 직무를 수행할 수 없을 때에는 위원 중에서 호선된 자가 그 직무를 대행한다.\n① ㄱ, ㄴ ② ㄱ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄹ","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",1,0],[32,2021,21,3,2,"중개실무","농지 취득","박스형(모두고르기), 판례, 옳은것 고르기","2020. 10. 1. 甲과 乙은 甲 소유의 X토지에 관해 매매계약을 체결하였다. 乙과 丙은 ｢농지법｣상 농지소 유제한을 회피할 목적으로 명의신탁 약정을 하였다. 그 후 甲은 乙의 요구에 따라 丙 명의로 소유권이전등기를 마쳐주었다. 그 사정을 아는 개업공인중개사가 X토지의 매수의뢰인에게 설명한 내용으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 甲이 丙 명의로 마쳐준 소유권이전등기는 유효하다.\nㄴ. 乙은 丙을 상대로 매매대금 상당의 부당이득반환청구권을 행사할 수 있다.\nㄷ. 乙은 甲을 대위하여 丙 명의의 소유권이전등기의 말소를 청구할 수 있다.\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄴ ⑤ ㄴ, ㄷ","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",1,0],[32,2021,21,4,2,"중개실무","분묘기지권·장사법","판례, 틀린것 고르기","분묘가 있는 토지에 관하여 개업공인중개사가 중개의뢰인에게 설명한 내용으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 분묘기지권은 등기사항증명서를 통해 확인할 수 없다. 2021년 제32회 공인중개\n② 분묘기지권은 분묘의 설치 목적인 분묘의 수호와 제사에 필요한 범위 내에서 분묘 기지 주위의 공지를 포함한 지역에까지 미친다.\n③ 분묘기지권이 인정되는 경우 분묘가 멸실되었더라도 유골이 존재하여 분묘의 원상회복이 가능하고 일시적인 멸실에 불과하다면 분묘기지권은 소멸하지 않는다.\n④ 분묘기지권에는 그 효력이 미치는 범위 안에서 새로운 분묘를 설치할 권능은 포함되지 않는다.\n⑤ 甲이 자기 소유 토지에 분묘를 설치한 후 그 토지를 乙 에게 양도하면서 분묘를 이장하겠다는 특약을 하지 않음으로써 甲이 분묘기지권을 취득한 경우, 특별한 사정이 없는 한 甲은 분묘의 기지에 대한 토지사용의 대가로서 지료를 지급할 의무가 없다.","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",1,0],[32,2021,21,5,2,"공인중개사법","표시·광고","틀린것 고르기","공인중개사법령상 중개대상물의 표시ㆍ광고 및 모니터링에 관한 설명으로 틀린 것은?\n① 개업공인중개사는 의뢰받은 중개대상물에 대하여 표시ㆍ광고를 하려면 개업공인중개사, 소속공인중개사 및 중개보조원에 관한 사항을 명시해야 한다.\n② 개업공인중개사는 중개대상물이 존재하지 않아서 실제로 거래를 할 수 없는 중개대상물에 대한 광고와 같은 부당한 표시ㆍ광고를 해서는 안 된다.\n③ 개업공인중개사는 중개대상물의 가격 등 내용을 과장되 게 하는 부당한 표시ㆍ광고를 해서는 안 된다.\n④ 국토교통부장관은 인터넷을 이용한 중개대상물에 대한 표시ㆍ광고의 규정준수 여부에 관하여 기본 모니터링과 수시 모니터링을 할 수 있다.\n⑤ 국토교통부장관은 인터넷 표시ㆍ광고 모니터링 업무 수 행에 필요한 전문인력과 전담조직을 갖췄다고 국토교통부장관이 인정하는 단체에게 인터넷 표시ㆍ광고 모니터링 업무를 위탁할 수 있다.","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",1,0],[32,2021,21,6,2,"공인중개사법","거래정보망·기타","판례, 틀린것 고르기","개업공인중개사가 집합건물의 매매를 중개하면서 설명한 내용으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 아파트 지하실은 특별한 사정이 없는 한 구분소유자 전원의 공용부분으로, 따로 구분소유의 목적이 될 수 없다.\n② 전유부분이 주거 용도로 분양된 경우, 구분소유자는 정당한 사유 없이 그 부분을 주거 외의 용도로 사용해서는 안 된다.\n③ 구분소유자는 구조상 구분소유자 전원의 공용에 제공된 건물 부분에 대한 공유지분을 그가 가지는 전유부분과 분리하여 처분할 수 없다.\n④ 규약으로써 달리 정한 경우에도 구분소유자는 그가 가지는 전유부분과 분리하여 대지사용권을 처분할 수 없다.\n⑤ 일부의 구분소유자만이 공용하도록 제공되는 것임이 명백한 공용부분은 그들 구분소유자의 공유에 속한다.","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",1,0],[32,2021,21,7,2,"공인중개사법","고용인(소속공인중개사·중개보조원)","틀린것 고르기","공인중개사법령상 개업공인중개사의 고용인에 관한 설명으로 틀린 것은?\n① 개업공인중개사는 중개보조원과 고용관계가 종료된 경우 그 종료일부터 10일 이내에 등록관청에 신고해야 한다.\n② 소속공인중개사의 고용신고를 받은 등록관청은 공인중개사 자격증을 발급한 시ㆍ도지사에게 그 소속공인중개사의 공인중개사 자격 확인을 요청해야 한다.\n③ 중개보조원뿐만 아니라 소속공인중개사의 업무상 행위는 그를 고용한 개업공인중개사의 행위로 본다.\n④ 개업공인중개사는 중개보조원을 고용한 경우, 등록관청에 신고한 후 업무개시 전까지 등록관청이 실시하는 직무교육을 받도록 해야 한다.\n⑤ 중개보조원의 고용신고를 받은 등록관청은 그 사실을 공인중개사협회에 통보해야 한다.","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",2,0],[32,2021,21,8,2,"공인중개사법","중개사무소 개설등록·결격사유","판례, 틀린것 고르기","공인중개사법령상 중개사무소의 명칭 및 등록증 등의 게시에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 법인인 개업공인중개사의 분사무소에는 분사무소설치신 고확인서 원본을 게시해야 한다.\n② 소속공인중개사가 있는 경우 그 소속공인중개사의 공인중개사자격증 원본도 게시해야 한다.\n③ 개업공인중개사가 아닌 자가 ‘부동산중개’라는 명칭을 사용한 경우, 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.\n④ 무자격자가 자신의 명함에 ‘부동산뉴스 대표’라는 명칭을 기재하여 사용하였다면 공인중개사와 유사한 명칭을 사용한 것에 해당한다.\n⑤ 공인중개사인 개업공인중개사가 ｢옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률｣에 따른 옥외광고물을 설치하는 경우, 중개사무소등록증에 표기된 개업공인중개사의 성명을 표기해야 한다.","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",2,0],[32,2021,21,9,2,"공인중개사법","중개사무소 개설등록·결격사유","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 중개사무소 개설등록에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 피특정후견인은 중개사무소의 등록을 할 수 없다.\nㄴ. 금고 이상의 형의 집행유예를 받고 그 유예기간 중에 있는 자는 중개사무소의 등록을 할 수 없다.\nㄷ. 자본금이 5천만원 이상인 ｢협동조합 기본법｣ 상 사회적협동조합은 중개사무소의 등록을 할 수 있다.\n① ㄱ ② ㄴ ③ ㄱ, ㄴ ④ ㄱ, ㄷ ⑤ ㄴ, ㄷ","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",2,0],[32,2021,21,10,2,"공인중개사법","거래정보망·기타","틀린것 고르기","공인중개사법령상 법인인 개업공인중개사의 업무범 위에 해당하지 않는 것은?(단, 다른 법령의 규정은 고려하지 않음)\n① 주택의 임대관리 2021년 제32회 공인중개\n② 부동산 개발에 관한 상담 및 주택의 분양대행\n③ 개업공인중개사를 대상으로 한 공제업무의 대행\n④ ｢국세징수법｣상 공매대상 부동산에 대한 취득의 알선\n⑤ 중개의뢰인의 의뢰에 따른 이사업체의 소개","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",2,0],[32,2021,21,11,2,"공인중개사법","확인·설명(서)","박스형(모두고르기)","공인중개사법령상 ‘중개대상물의 확인ㆍ설명사항’과 ‘전속중개계약에 따라 부동산거래정보망에 공개해야 할 중개대상물에 관한 정보’에 공통으로 규정된 것을 모두 고른 것은?\nㄱ. 공법상의 거래규제에 관한 사항\nㄴ. 벽면 및 도배의 상태\nㄷ. 일조ㆍ소음의 환경조건\nㄹ. 취득시 부담해야 할 조세의 종류와 세율\n① ㄱ, ㄴ ② ㄷ, ㄹ ③ ㄱ, ㄴ, ㄷ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",2,0],[32,2021,21,12,2,"중개실무","경매·매수신청대리","틀린것 고르기","매수신청대리인으로 등록한 개업공인중개사 甲이 매수신청대리 위임인 乙에게 ｢공인중개사의 매수신청대리인 등록 등에 관한 규칙｣에 관하여 설명한 내용으로 틀린 것은?(단, 위임에 관하여 특별한 정함이 없음)\n① 甲의 매수신고액이 차순위이고 최고가매수신고액에서 그 보증액을 뺀 금액을 넘는 때에만 甲은 차순위매수신고를 할 수 있다.\n② 甲은 乙을 대리하여 입찰표를 작성ㆍ제출할 수 있다.\n③ 甲의 입찰로 乙이 최고가매수신고인이나 차순위매수신 고인이 되지 않은 경우, 甲은 ｢민사집행법｣에 따라 매수신청의 보증을 돌려 줄 것을 신청할 수 있다.\n④ 乙의 甲에 대한 보수의 지급시기는 당사자 간 약정이 없으면 매각허가결정일로 한다.\n⑤ 甲은 기일입찰의 방법에 의한 매각기일에 매수신청대리행위를 할 때 집행법원이 정한 매각장소 또는 집행법원에 직접 출석해야 한다.","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",2,0],[32,2021,21,13,2,"공인중개사법","확인·설명(서)","박스형(모두고르기)","｢전자문서 및 전자거래 기본법｣에 따른 공인전자문서센터에 보관된 경우, 공인중개사법령상 개업공인중개사가 원본, 사본 또는 전자문서를 보존기간 동안 보존해야 할 의무가 면제된다고 명시적으로 규정된 것을 모두 고른 것은?\nㄱ. 중개대상물 확인ㆍ설명서\nㄴ. 손해배상책임보장에 관한 증서\nㄷ. 소속공인중개사 고용신고서\nㄹ. 거래계약서\n① ㄱ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",2,0],[32,2021,21,14,2,"공인중개사법","거래정보망·기타","틀린것 고르기","공인중개사법령상 거래정보사업자지정대장 서식에 기재되는 사항이 아닌 것은?\n① 지정 번호 및 지정 연월일\n② 상호 또는 명칭 및 대표자의 성명\n③ 주된 컴퓨터설비의 내역\n④ 전문자격자의 보유에 관한 사항\n⑤ ｢전기통신사업법｣에 따른 부가통신사업자번호","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",3,0],[32,2021,21,15,2,"공인중개사법","손해배상책임·보증·계약금 예치","틀린것 고르기","공인중개사법령상 손해배상책임의 보장에 관한 설명으로 틀린 것은?\n① 개업공인중개사는 중개가 완성된 때에는 거래당사자에게 손해배상책임의 보장기간을 설명해야 한다.\n② 개업공인중개사는 고의로 거래당사자에게 손해를 입힌 경우에는 재산상의 손해뿐만 아니라 비재산적 손해에 대해서도 공인중개사법령상 손해배상책임보장규정에 의해 배상할 책임이 있다.\n③ 개업공인중개사가 자기의 중개사무소를 다른 사람의 중개행위의 장소로 제공하여 거래당사자에게 재산상의 손해를 발생하게 한 때에는 그 손해를 배상할 책임이 있다.\n④ 법인인 개업공인중개사가 분사무소를 두는 경우 분사무 소마다 추가로 1억원 이상의 손해배상책임의 보증설정을 해야 하나 보장금액의 상한은 없다.\n⑤ 지역농업협동조합이 ｢농업협동조합법｣에 의해 부동산중 개업을 하는 경우 보증기관에 설정하는 손해배상책임 보증의 최저보장금액은 개업공인중개사의 최저보장금액과 다르다.","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",3,0],[32,2021,21,16,2,"공인중개사법","중개사무소 개설등록·결격사유","박스형(모두고르기), 틀린것 고르기","공인중개사법령상 공인중개사인 개업공인중개사가 중개사무소를 등록관청의 관할 지역 내로 이전한 경우에 관한 설명으로 틀린 것을 모두 고른 것은?\nㄱ. 중개사무소를 이전한 날부터 10일 이내에 신고해야 한다.\nㄴ. 등록관청이 이전신고를 받은 경우, 중개사무소등록증에 변경사항만을 적어 교부할 수 없고 재교부해야 한다.\nㄷ. 이전신고를 할 때 중개사무소등록증을 제출하지 않아도 된다.\nㄹ. 건축물대장에 기재되지 않은 건물로 이전신고를 하는 경우, 건축물대장 기재가 지연되는 사유를 적은 서류도 제출해야 한다.\n① ㄱ, ㄴ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄷ, ㄹ ⑤ ㄴ, ㄷ, ㄹ","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",3,0],[32,2021,21,17,2,"공인중개사법","휴업·폐업","옳은것 고르기","공인중개사법령상 중개업의 휴업 및 재개신고 등에 관한 설명으로 옳은 것은?\n① 개업공인중개사가 3개월의 휴업을 하려는 경우 등록관청에 신고해야 한다.\n② 개업공인중개사가 6개월을 초과하여 휴업을 할 수 있는 사유는 취학, 질병으로 인한 요양, 징집으로 인한 입영에 한한다. 2021년 제32회 공인중개\n③ 개업공인중개사가 휴업기간 변경신고를 하려면 중개사무소등록증을 휴업기간변경신고서에 첨부하여 제출해야 한다.\n④ 재개신고는 휴업기간 변경신고와 달리 전자문서에 의한 신고를 할 수 없다.\n⑤ 재개신고를 받은 등록관청은 반납을 받은 중개사무소등록증을 즉시 반환해야 한다.","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",3,0],[32,2021,21,18,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","박스형(모두고르기)","공인중개사법령상 개업공인중개사가 지체 없이 사무소의 간판을 철거해야 하는 사유를 모두 고른 것은?\nㄱ. 등록관청에 중개사무소의 이전사실을 신고한 경우\nㄴ. 등록관청에 폐업사실을 신고한 경우\nㄷ. 중개사무소의 개설등록 취소처분을 받은 경우\nㄹ. 등록관청에 6개월을 초과하는 휴업신고를 한 경우\n① ㄹ ② ㄱ, ㄷ ③ ㄴ, ㄷ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",3,0],[32,2021,21,19,2,"공인중개사법","거래정보망·기타","판례","공인중개사법령상 중개행위 등에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 중개행위에 해당하는지 여부는 개업공인중개사의 행위를 객관적으로 보아 판단할 것이 아니라 개업공인중개사의 주관적 의사를 기준으로 판단해야 한다.\n② 임대차계약을 알선한 개업공인중개사가 계약 체결 후에도 목적물의 인도 등 거래당사자의 계약상 의무의 실현에 관여함으로써 계약상 의무가 원만하게 이행되도록 주선할 것이 예정되어 있는 경우, 그러한 개업공인중개사의 행위는 사회통념상 중개행위의 범주에 포함된다.\n③ 소속공인중개사는 자신의 중개사무소 개설등록을 신청할 수 있다.\n④ 개업공인중개사는 거래계약서를 작성하는 경우 거래계약서에 서명하거나 날인하면 된다.\n⑤ 개업공인중개사가 국토교통부장관이 정한 거래계약서 표준서식을 사용하지 않는 경우 과태료부과처분을 받게 된다.","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",3,0],[32,2021,21,20,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기","부동산 거래신고 등에 관한 법령상 벌금 또는 과태료의 부과기준이 ‘계약 체결 당시의 개별공시지가에 따른 해당 토지가격’ 또는 ‘해당 부동산등의 취득가액’의 비율 형식으로 규정된 경우가 아닌 것은?\n① 토지거래허가구역 안에서 허가 없이 토지거래계약을 체결한 경우\n② 외국인이 부정한 방법으로 허가를 받아 토지취득계약을 체결한 경우\n③ 토지거래허가구역 안에서 속임수나 그 밖의 부정한 방법으로 토지거래계약 허가를 받은 경우\n④ 부동산매매계약을 체결한 거래당사자가 그 실제거래가 격을 거짓으로 신고한 경우\n⑤ 부동산매매계약을 체결한 후 신고 의무자가 아닌 자가 거짓으로 부동산거래신고를 한 경우","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",3,0],[32,2021,21,21,2,"공인중개사법","중개계약(일반·전속)","박스형(모두고르기), 옳은것 고르기","개업공인중개사 甲, 乙, 丙에 대한 ｢공인중개사법｣ 제40조(행정제재처분효과의 승계 등)의 적용에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 甲이 2020. 11. 16. ｢공인중개사법｣에 따른 과태료부과처분을 받았으나 2020. 12. 16. 폐업신고를 하였다가 2021. 10. 15. 다시 중개사무소의 개설등록을 하였다면, 위 과태료부과처분의 효과는 승계된다.\nㄴ. 乙이 2020. 8. 1. 국토교통부령으로 정하는 전속중개계약서에 의하지 않고 전속중개계약을 체결한 후, 2020. 9. 1. 폐업신고를 하였다가\n2021. 10. 1. 다시 중개사무소의 개설등록을 하였다면, 등록관청은 업무정지처분을 할 수 있다.\nㄷ. 丙이 2018. 8. 5. 다른 사람에게 자기의 상호를 사용하여 중개업무를 하게 한 후, 2018. 9. 5. 폐업신고를 하였다가 2021. 10. 5. 다시 중개사무소의 개설등록을 하였다면, 등록관청은 개설등록을 취소해야 한다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",4,0],[32,2021,21,22,2,"중개실무","주택·상가 임대차 실무","틀린것 고르기","개업공인중개사 甲의 중개로 乙과 丙은 丙 소유의 주택에 관하여 임대차계약(이하 ‘계약’이라 함)을 체결하려 한다. ｢주택임대차보호법｣의 적용에 관한 甲 의 설명으로 틀린 것은?(임차인 乙은 자연인임)\n① 乙과 丙이 임대차기간을 2년 미만으로 정한다면 乙은 그 임대차기간이 유효함을 주장할 수 없다.\n② 계약이 묵시적으로 갱신되면 임대차의 존속기간은 2년으로 본다.\n③ 계약이 묵시적으로 갱신되면 乙은 언제든지 丙에게 계약해지를 통지할 수 있고, 丙이 그 통지를 받은 날부터 3개월이 지나면 해지의 효력이 발생한다.\n④ 乙이 丙에게 계약갱신요구권을 행사하여 계약이 갱신되면, 갱신되는 임대차의 존속기간은 2년으로 본다.\n⑤ 乙이 丙에게 계약갱신요구권을 행사하여 계약이 갱신된 경우 乙은 언제든지 丙에게 계약해지를 통지할 수 있다.","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",4,0],[32,2021,21,23,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","박스형(모두고르기)","공인중개사법령상 공인중개사 자격의 취소사유에 해당하는 것을 모두 고른 것은?\nㄱ. 부정한 방법으로 공인중개사의 자격을 취득한 경우\nㄴ. 다른 사람에게 자기의 공인중개사자격증을 대여한 경우\nㄷ. ｢공인중개사법｣에 따라 공인중개사 자격정지처분을 받고 그 자격정지기간 중에 중개업무를 행한 경우\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ 2021년 제32회 공인중개","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",4,0],[32,2021,21,24,2,"공인중개사법","손해배상책임·보증·계약금 예치","빈칸","｢공인중개사법｣의 내용으로 ( )에 들어갈 숫자를 바르게 나열한 것은?\n○ 등록관청은 개업공인중개사가 최근 ( ㄱ )년 이내에 이 법에 의하여 ( ㄴ )회 이상 업무정지처분을 받고 다시 업무정지처분에 해당하는 행위를 한 경우에는 중개사무소의 개설등록을 취소하여야 한다.\n○ 금고 이상의 실형의 선고를 받고 그 집행이 종료(집행이 종료된 것으로 보는 경우를 포함한다)되거나 집행이 면제된 날부터 ( ㄷ )년이 지나지 아니한 자는 중개사무소의 개설등록을 할 수 없다.\n○ 중개행위와 관련된 손해배상책임을 보장하기 위하여 이 법에 따라 공탁한 공탁금은 개업공인중개사가 폐업한 날부터 ( ㄹ )년 이내에는 회수할 수 없다.\n① ㄱ: 1, ㄴ: 2, ㄷ: 1, ㄹ: 3 ② ㄱ: 1, ㄴ: 2, ㄷ: 3, ㄹ: 3\n③ ㄱ: 1, ㄴ: 3, ㄷ: 3, ㄹ: 1 ④ ㄱ: 2, ㄴ: 3, ㄷ: 1, ㄹ: 1\n⑤ ㄱ: 2, ㄴ: 3, ㄷ: 3, ㄹ: 3","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",4,0],[32,2021,21,25,2,"공인중개사법","중개사무소 개설등록·결격사유","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 중개사무소 개설등록을 취소하여야 하는 사유에 해당하는 것을 모두 고른 것은?\nㄱ. 개업공인중개사인 법인이 해산한 경우\nㄴ. 개업공인중개사가 거짓으로 중개사무소 개설등록을 한 경우\nㄷ. 개업공인중개사가 이중으로 중개사무소 개설등록을 한 경우\nㄹ. 개업공인중개사가 개설등록 후 금고 이상의 형의 집행유예를 받고 그 유예기간 중에 있게 된 경우\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",4,0],[32,2021,21,26,2,"공인중개사법","손해배상책임·보증·계약금 예치","옳은것 고르기","공인중개사법령상 개업공인중개사의 보증설정 등에 관한 설명으로 옳은 것은?\n① 개업공인중개사가 보증설정신고를 할 때 등록관청에 제출해야 할 증명서류는 전자문서로 제출할 수 없다.\n② 보증기관이 보증사실을 등록관청에 직접 통보한 경우라도 개업공인중개사는 등록관청에 보증설정신고를 해야 한다.\n③ 보증을 다른 보증으로 변경하려면 이미 설정된 보증의 효력이 있는 기간이 지난 후에 다른 보증을 설정해야 한다.\n④ 보증변경신고를 할 때 손해배상책임보증 변경신고서 서 식의 “보증”란에 ‘변경 후 보증내용’을 기재한다.\n⑤ 개업공인중개사가 보증보험금으로 손해배상을 한 때에는 그 보증보험의 금액을 보전해야 하며 다른 공제에 가입할 수 없다.","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",4,0],[32,2021,21,27,2,"공인중개사법","교육·협회·공제","틀린것 고르기","공인중개사법령상 공인중개사협회(이하 ‘협회’라 함) 에 관한 설명으로 틀린 것은?\n① 협회는 시ㆍ도지사로부터 위탁을 받아 실무교육에 관한 업무를 할 수 있다.\n② 협회는 공제사업을 하는 경우 책임준비금을 다른 용도로 사용하려면 국토교통부장관의 승인을 얻어야 한다.\n③ 협회는 ｢공인중개사법｣에 따른 협회의 설립목적을 달성하기 위한 경우에도 부동산 정보제공에 관한 업무를 수행할 수 없다.\n④ 협회에 관하여 ｢공인중개사법｣에 규정된 것 외에는 ｢민법｣ 중 사단법인에 관한 규정을 적용한다.\n⑤ 협회는 공제사업을 다른 회계와 구분하여 별도의 회계로 관리해야 한다.","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",5,0],[32,2021,21,28,2,"공인중개사법","벌칙·과태료·포상금","틀린것 고르기","공인중개사법령상 포상금을 지급받을 수 있는 신고 또는 고발의 대상이 아닌 것은?\n① 중개사무소의 개설등록을 하지 않고 중개업을 한 자\n② 부정한 방법으로 중개사무소의 개설등록을 한 자\n③ 공인중개사자격증을 다른 사람으로부터 양수받은 자\n④ 개업공인중개사로서 부당한 이익을 얻을 목적으로 거짓으로 거래가 완료된 것처럼 꾸미는 등 중개대상물의 시세에 부당한 영향을 줄 우려가 있는 행위를 한 자\n⑤ 개업공인중개사로서 중개의뢰인과 직접 거래를 한 자","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",5,0],[32,2021,21,29,2,"공인중개사법","확인·설명(서)","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 개업공인중개사에 대한 업무정지처분을 할 수 있는 사유에 해당하는 것을 모두 고른 것은?\nㄱ. 부동산거래정보망에 중개대상물에 관한 정보를 거짓으로 공개한 경우\nㄴ. 거래당사자에게 교부해야 하는 중개대상물확인ㆍ설명서를 교부하지 않은 경우\nㄷ. 거래당사자에게 교부해야 하는 거래계약서를 적 정하게 작성ㆍ교부하지 않은 경우\nㄹ. 해당 중개대상물의 거래상의 중요사항에 관하여 거짓된 언행으로 중개의뢰인의 판단을 그르치게 하는 행위를 한 경우\n① ㄱ, ㄷ ② ㄴ, ㄹ ③ ㄱ, ㄴ, ㄷ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",5,0],[32,2021,21,30,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","","공인중개사법령상 소속공인중개사로서 업무를 수행하는 기간 동안 발생한 사유 중 자격정지사유로 규정되어 있지 않은 것은?\n① 둘 이상의 중개사무소에 소속된 경우\n② 성실ㆍ정확하게 중개대상물의 확인ㆍ설명을 하지 않은 경우\n③ 등록관청에 등록하지 않은 인장을 사용하여 중개행위를 한 경우\n④ ｢공인중개사법｣을 위반하여 징역형의 선고를 받은 경우\n⑤ 중개대상물의 매매를 업으로 하는 행위를 한 경우 2021년 제32회 공인중개","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",5,0],[32,2021,21,31,2,"공인중개사법","벌칙·과태료·포상금","틀린것 고르기","공인중개사법령상 개업공인중개사의 행위 중 과태료 부과대상이 아닌 것은?\n① 중개대상물의 거래상의 중요사항에 관해 거짓된 언행으로 중개의뢰인의 판단을 그르치게 한 경우\n② 휴업신고에 따라 휴업한 중개업을 재개하면서 등록관청에 그 사실을 신고하지 않은 경우\n③ 중개대상물에 관한 권리를 취득하려는 중개의뢰인에게 해당 중개대상물의 권리관계를 성실․정확하게 확인․ 설명하지 않은 경우\n④ 인터넷을 이용하여 중개대상물에 대한 표시ㆍ광고를 하면서 중개대상물의 종류별로 가격 및 거래형태를 명시하지 않은 경우\n⑤ 연수교육을 정당한 사유 없이 받지 않은 경우","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",5,0],[32,2021,21,32,2,"부동산거래신고법","토지거래허가","박스형(모두고르기)","부동산 거래신고 등에 관한 법령상 신고포상금 지급 대상에 해당하는 위반행위를 모두 고른 것은?\nㄱ. 부동산 매매계약의 거래당사자가 부동산의 실제 거래가격을 거짓으로 신고하는 행위\nㄴ. 부동산 매매계약에 관하여 개업공인중개사에게 신고를 하지 않도록 요구하는 행위\nㄷ. 토지거래계약허가를 받아 취득한 토지를 허가받은 목적대로 이용하지 않는 행위\nㄹ. 부동산 매매계약에 관하여 부동산의 실제 거래가격을 거짓으로 신고하도록 조장하는 행위\n① ㄱ, ㄷ ② ㄱ, ㄹ ③ ㄴ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄴ, ㄷ, ㄹ","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",5,0],[32,2021,21,33,2,"공인중개사법","중개사무소·분사무소·인장·게시","틀린것 고르기","공인중개사법령상 중개사무소의 설치에 관한 설명으로 틀린 것은?\n① 법인이 아닌 개업공인중개사는 그 등록관청의 관할구역안에 1개의 중개사무소만 둘 수 있다.\n② 다른 법률의 규정에 따라 중개업을 할 수 있는 법인의 분사무소에는 공인중개사를 책임자로 두지 않아도 된다.\n③ 개업공인중개사가 중개사무소를 공동으로 사용하려면 중개사무소의 개설등록 또는 이전신고를 할 때 그 중개사무소를 사용할 권리가 있는 다른 개업공인중개사의 승낙서를 첨부해야 한다.\n④ 법인인 개업공인중개사가 분사무소를 두려는 경우 소유ㆍ전세ㆍ임대차 또는 사용대차 등의 방법으로 사용권을 확보해야 한다.\n⑤ 법인인 개업공인중개사가 그 등록관청의 관할구역 외의 지역에 둘 수 있는 분사무소는 시․도별로 1개소를 초과할 수 없다.","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",5,0],[32,2021,21,34,2,"부동산거래신고법","부동산 거래신고","박스형(모두고르기), 계산","甲이 ｢건축법 시행령｣에 따른 단독주택을 매수하는 계약을 체결하였을 때, 부동산 거래신고 등에 관한 법령에 따라 甲 본인이 그 주택에 입주할지 여부를 신고해야 하는 경우를 모두 고른 것은?(甲, 乙, 丙은 자연인이고, 丁은 ｢지방공기업법｣상 지방공단임)\nㄱ. 甲이 ｢주택법｣상 투기과열지구에 소재하는 乙 소유의 주택을 실제 거래가격 3억원으로 매수하는 경우\nㄴ. 甲이 ｢주택법｣상 ‘투기과열지구 또는 조정대상지역’ 외의 장소에 소재하는 丙 소유의 주택을 실제 거래가격 5억원으로 매수하는 경우\nㄷ. 甲이 ｢주택법｣상 투기과열지구에 소재하는 丁 소유의 주택을 실제 거래가격 10억원으로 매수하는 경우\n① ㄱ ② ㄴ ③ ㄱ, ㄴ ④ ㄱ, ㄷ ⑤ ㄴ, ㄷ","1,4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",6,0],[32,2021,21,35,2,"부동산거래신고법","주택임대차계약 신고","빈칸","개업공인중개사 甲이 A도 B시 소재의 X주택에 관한 乙과 丙 간의 임대차계약 체결을 중개하면서 ｢부동산거래신고 등에 관한 법률｣에 따른 주택임대차계약의 신고에 관하여 설명한 내용의 일부이다. ( )에 들어갈 숫자를 바르게 나열한 것은?(X주택은 ｢주택임대차보호법｣의 적용대상이며, 乙과 丙은 자연인임) 보증금이 ( ㄱ )천만원을 초과하거나 월 차임이\n( ㄴ )만원을 초과하는 주택임대차계약을 신규로 체결한 계약당사자는 그 보증금 또는 차임 등을 임대차계약의 체결일부터 ( ㄷ )일 이내에 주택 소재지를 관할하는 신고관청에 공동으로 신고해야 한다.\n① ㄱ: 3, ㄴ: 30, ㄷ: 60 ② ㄱ: 3, ㄴ: 50, ㄷ: 30\n③ ㄱ: 6, ㄴ: 30, ㄷ: 30 ④ ㄱ: 6, ㄴ: 30, ㄷ: 60\n⑤ ㄱ: 6, ㄴ: 50, ㄷ: 60","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",6,0],[32,2021,21,36,2,"공인중개사법","벌칙·과태료·포상금","","공인중개사법령상 벌칙 부과대상 행위 중 피해자의 명시한 의사에 반하여 벌하지 않는 경우는?\n① 거래정보사업자가 개업공인중개사로부터 의뢰받은 내용과 다르게 중개대상물의 정보를 부동산거래정보망에 공개한 경우\n② 개업공인중개사가 그 업무상 알게 된 비밀을 누설한 경우\n③ 개업공인중개사가 중개의뢰인으로부터 법령으로 정한 보수를 초과하여 금품을 받은 경우\n④ 시세에 부당한 영향을 줄 목적으로 개업공인중개사에게 중개대상물을 시세보다 현저하게 높게 표시ㆍ광고하도록 강요하는 방법으로 개업공인중개사의 업무를 방해한 경우\n⑤ 개업공인중개사가 단체를 구성하여 단체 구성원 이외의 자와 공동중개를 제한한 경우 2021년 제32회 공인중개","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",6,0],[32,2021,21,37,2,"부동산거래신고법","외국인 등의 부동산 취득","박스형(모두고르기), 옳은것 고르기","부동산 거래신고 등에 관한 법령상 외국인등의 부동산 취득에 관한 설명으로 옳은 것을 모두 고른 것은?(단, 법 제7조에 따른 상호주의는 고려하지 않음)\nㄱ. 대한민국의 국적을 보유하고 있지 않은 개인이 이사 등 임원의 2분의 1 이상인 법인은 외국인등에 해당한다.\nㄴ. 외국인등이 건축물의 개축을 원인으로 대한민국 안의 부동산을 취득한 때에도 부동산 취득신고를 해야 한다.\nㄷ. ｢군사기지 및 군사시설 보호법｣에 따른 군사기지 및 군사시설 보호구역 안의 토지는 외국인등이 취득할 수 없다.\nㄹ. 외국인등이 허가 없이 ｢자연환경보전법｣에 따른 생태ㆍ경관보전지역 안의 토지를 취득하는 계약을 체결한 경우 그 계약은 효력이 발생하지 않는다.\n① ㄱ, ㄷ ② ㄱ, ㄹ ③ ㄱ, ㄴ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",6,0],[32,2021,21,38,2,"부동산거래신고법","토지거래허가","틀린것 고르기","부동산 거래신고 등에 관한 법령상 토지거래계약허가를 받아 취득한 토지를 허가받은 목적대로 이용하고 있지 않은 경우 시장ㆍ군수ㆍ구청장이 취할 수 있는 조치가 아닌 것은?\n① 과태료를 부과할 수 있다.\n② 토지거래계약허가를 취소할 수 있다.\n③ 3개월 이내의 기간을 정하여 토지의 이용 의무를 이행하도록 문서로 명할 수 있다.\n④ 해당 토지에 관한 토지거래계약 허가신청이 있을 때 국가, 지방자치단체, 한국토지주택공사가 그 토지의 매수를 원하면 이들 중에서 매수할 자를 지정하여 협의 매수하게 할 수 있다.\n⑤ 해당 토지를 직접 이용하지 않고 임대하고 있다는 이유로 이행명령을 했음에도 정해진 기간에 이행되지 않은 경우, 토지 취득가액의 100분의 7에 상당하는 금액의 이행강제금을 부과한다.","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",6,0],[32,2021,21,39,2,"부동산거래신고법","토지거래허가","옳은것 고르기","부동산 거래신고 등에 관한 법령상 토지거래허가에 관한 내용으로 옳은 것은?\n① 토지거래허가구역의 지정은 그 지정을 공고한 날부터 3 일 후에 효력이 발생한다.\n② 토지거래허가구역의 지정 당시 국토교통부장관 또는 시ㆍ도지사가 따로 정하여 공고하지 않은 경우, ｢국토의 계획 및 이용에 관한 법률｣에 따른 도시지역 중 녹지지역 안의 180제곱미터 면적의 토지거래계약에 관하여는 허가가 필요 없다.\n③ 토지거래계약을 허가받은 자는 대통령령으로 정하는 사유가 있는 경우 외에는 토지 취득일부터 10년간 그 토지를 허가받은 목적대로 이용해야 한다.\n④ 허가받은 목적대로 토지를 이용하지 않았음을 이유로 이행강제금 부과처분을 받은 자가 시장ㆍ군수ㆍ구청장에게 이의를 제기하려면 그 처분을 고지받은 날부터 60 일 이내에 해야 한다.\n⑤ 토지거래허가신청에 대해 불허가처분을 받은 자는 그 통지를 받은 날부터 1개월 이내에 시장ㆍ군수ㆍ구청장에게 해당 토지에 관한 권리의 매수를 청구할 수 있다.","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",7,0],[32,2021,21,40,2,"부동산거래신고법","토지거래허가","옳은것 고르기","부동산 거래신고 등에 관한 법령상 토지거래허가구역\n(이하 ‘허가구역’이라 함)에 관한 설명으로 옳은 것은?\n① 시․도지사는 법령의 개정으로 인해 토지이용에 대한 행위제한이 강화되는 지역을 허가구역으로 지정할 수 있다.\n② 토지의 투기적인 거래 성행으로 지가가 급격히 상승하는 등의 특별한 사유가 있으면 5년을 넘는 기간으로 허가구역을 지정할 수 있다.\n③ 허가구역 지정의 공고에는 허가구역에 대한 축척 5만분의 1 또는 2만5천분의 1의 지형도가 포함되어야 한다.\n④ 허가구역을 지정한 시ㆍ도지사는 지체 없이 허가구역 지정에 관한 공고내용을 관할 등기소의 장에게 통지해야 한다.\n⑤ 허가구역 지정에 이의가 있는 자는 그 지정이 공고된 날부터 1개월 내에 시장ㆍ군수ㆍ구청장에게 이의를 신청할 수 있다. 2021년 제32회 공인중개","전항정답","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",7,0],[32,2021,21,41,3,"국토계획법","도시·군관리계획·기본계획","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 광역도시계획에 관한 설명으로 틀린 것은?\n① 광역도시계획의 수립기준은 국토교통부장관이 정한다.\n② 광역계획권이 같은 도의 관할 구역에 속하여 있는 경우 관할 도지사가 광역도시계획을 수립하여야 한다.\n③ 시ㆍ도지사, 시장 또는 군수는 광역도시계획을 수립하거나 변경하려면 미리 관계 시ㆍ도, 시 또는 군의 의회와 관계 시장 또는 군수의 의견을 들어야 한다.\n④ 시장 또는 군수가 기초조사정보체계를 구축한 경우에는 등록된 정보의 현황을 5년마다 확인하고 변동사항을 반영하여야 한다.\n⑤ 광역계획권을 지정한 날부터 3년이 지날 때까지 관할 시장 또는 군수로부터 광역도시계획의 승인 신청이 없는 경우 관할 도지사가 광역도시계획을 수립하여야 한다.","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",7,0],[32,2021,21,42,3,"국토계획법","도시·군관리계획·기본계획","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 도시ㆍ군기본계획에 관한 설명으로 틀린 것은?\n① ｢수도권정비계획법｣에 의한 수도권에 속하고 광역시와 경계를 같이하지 아니한 시로서 인구 20만명 이하인 시는 도시ㆍ군기본계획을 수립하지 아니할 수 있다.\n② 도시ㆍ군기본계획에는 기후변화 대응 및 에너지절약에 관한 사항에 대한 정책 방향이 포함되어야 한다.\n③ 광역도시계획이 수립되어 있는 지역에 대하여 수립하는도시ㆍ군기본계획은 그 광역도시계획에 부합되어야 한다.\n④ 시장 또는 군수는 5년마다 관할 구역의 도시ㆍ군기본계획에 대하여 타당성을 전반적으로 재검토하여 정비하여야 한다.\n⑤ 특별시장ㆍ광역시장ㆍ특별자치시장 또는 특별자치도지 사는 도시ㆍ군기본계획을 변경하려면 관계 행정기관의 장(국토교통부장관을 포함)과 협의한 후 지방도시계획위원회의 심의를 거쳐야 한다.","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",7,0],[32,2021,21,43,3,"국토계획법","도시·군계획시설·매수청구","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 도시ㆍ군계획시설에 관한 설명으로 틀린 것은?(단, 조례는 고려하지 않음)\n① 도시ㆍ군계획시설 부지의 매수의무자인 지방공사는 도시ㆍ군계획시설채권을 발행하여 그 대금을 지급할 수 있다.\n② 도시ㆍ군계획시설 부지의 매수의무자는 매수하기로 결정한 토지를 매수 결정을 알린 날부터 2년 이내에 매수하여야 한다.\n③ 200만제곱미터를 초과하는 ｢도시개발법｣에 따른 도시개발구역에서 개발사업을 시행하는 자는 공동구를 설치하여야 한다.\n④ 국가계획으로 설치하는 광역시설은 그 광역시설의 설치ㆍ관리를 사업종목으로 하여 다른 법률에 따라 설립된 법인이 설치ㆍ관리할 수 있다.\n⑤ 도시ㆍ군계획시설채권의 상환기간은 10년 이내로 한다.","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",7,0],[32,2021,21,44,3,"국토계획법","도시·군관리계획·기본계획","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 도시ㆍ군관리계획에 관한 설명으로 틀린 것은?\n① 국토교통부장관은 국가계획과 관련된 경우 직접 도시ㆍ군관리계획을 입안할 수 있다.\n② 주민은 산업ㆍ유통개발진흥지구의 지정에 관한 사항에 대하여 도시ㆍ군관리계획의 입안권자에게 도시ㆍ군관리계획의 입안을 제안할 수 있다.\n③ 도시ㆍ군관리계획으로 입안하려는 지구단위계획구역이 상업지역에 위치하는 경우에는 재해취약성분석을 하지 아니할 수 있다.\n④ 도시ㆍ군관리계획 결정의 효력은 지형도면을 고시한 다음 날부터 발생한다.\n⑤ 인접한 특별시ㆍ광역시ㆍ특별자치시ㆍ특별자치도ㆍ시 또는 군의 관할 구역에 대한 도시ㆍ군관리계획은 관계 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ특별자치도지사ㆍ시장 또는 군수가 협의하여 공동으로 입안하거나 입안할 자를 정한다.","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",8,0],[32,2021,21,45,3,"국토계획법","지구단위계획","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 지구단위계획구 역과 지구단위계획에 관한 설명으로 틀린 것은?(단, 조례는 고려하지 않음)\n① 지구단위계획이 수립되어 있는 지구단위계획구역에서 공사기간 중 이용하는 공사용 가설건축물을 건축하려면 그 지구단위계획에 맞게 하여야 한다.\n② 지구단위계획은 해당 용도지역의 특성을 고려하여 수립 한다.\n③ 시장 또는 군수가 입안한 지구단위계획구역의 지정ㆍ변경에 관한 도시ㆍ군관리계획은 시장 또는 군수가 직접 결정한다.\n④ 지구단위계획구역 및 지구단위계획은 도시ㆍ군관리계획으로 결정한다.\n⑤ ｢관광진흥법｣에 따라 지정된 관광단지의 전부 또는 일부에 대하여 지구단위계획구역을 지정할 수 있다.","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",8,0],[32,2021,21,46,3,"국토계획법","개발행위허가·성장관리","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 개발행위에 따른 공공시설 등의 귀속에 관한 설명으로 틀린 것은?\n① 개발행위허가를 받은 행정청이 기존의 공공시설에 대체되는 공공시설을 설치한 경우에는 새로 설치된 공공시설은 그 시설을 관리할 관리청에 무상으로 귀속된다.\n② 개발행위허가를 받은 행정청은 개발행위가 끝나 준공검사를 마친 때에는 해당 시설의 관리청에 공공시설의 종류와 토지의 세목을 통지하여야 한다.\n③ 개발행위허가를 받은 자가 행정청이 아닌 경우 개발행위허가를 받은 자가 새로 설치한 공공시설은 그 시설을 관리할 관리청에 무상으로 귀속된다.\n④ 개발행위허가를 받은 행정청이 기존의 공공시설에 대체되는 공공시설을 설치한 경우에는 종래의 공공시설은 그 행정청에게 무상으로 귀속된다. 2021년 제32회 공인중개\n⑤ 개발행위허가를 받은 자가 행정청이 아닌 경우 개발행위로 용도가 폐지되는 공공시설은 개발행위허가를 받은 자에게 무상으로 귀속된다.","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",8,0],[32,2021,21,47,3,"국토계획법","개발행위허가·성장관리","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 개발행위에 따른 기반시설의 설치에 관한 설명으로 옳은 것은?(단, 조례는 고려하지 않음)\n① 시장 또는 군수가 개발밀도관리구역을 변경하는 경우 관할 지방도시계획위원회의 심의를 거치지 않아도 된다.\n② 기반시설부담구역의 지정고시일부터 2년이 되는 날까지 기반시설설치계획을 수립하지 아니하면 그 2년이 되는 날에 기반시설부담구역의 지정은 해제된 것으로 본다.\n③ 시장 또는 군수는 기반시설설치비용 납부의무자가 지방자치단체로부터 건축허가를 받은 날부터 3개월 이내에 기반시설설치비용을 부과하여야 한다.\n④ 시장 또는 군수는 개발밀도관리구역에서는 해당 용도지역에 적용되는 용적률의 최대한도의 50퍼센트 범위에서 용적률을 강화하여 적용한다.\n⑤ 기반시설설치비용 납부의무자는 사용승인 신청 후 7일까지 그 비용을 내야 한다.","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",8,0],[32,2021,21,48,3,"국토계획법","도시·군관리계획·기본계획","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 성장관리계획구역을 지정할 수 있는 지역이 아닌 것은?\n① 녹지지역 ② 관리지역\n③ 주거지역 ④ 자연환경보전지역\n⑤ 농림지역","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",8,0],[32,2021,21,49,3,"국토계획법","용도지역·용도지구·용도구역","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 시가화조정구역에 관한 설명으로 옳은 것은?\n① 시가화조정구역은 도시지역과 그 주변지역의 무질서한 시가화를 방지하고 계획적ㆍ단계적인 개발을 도모하기 위하여 시ㆍ도지사가 도시ㆍ군기본계획으로 결정하여 지정하는 용도구역이다.\n② 시가화유보기간은 5년 이상 20년 이내의 기간이다.\n③ 시가화유보기간이 끝나면 국토교통부장관 또는 시․도지사는 이를 고시하여야 하고, 시가화조정구역 지정 결정은 그 고시일 다음 날부터 그 효력을 잃는다.\n④ 공익상 그 구역안에서의 사업시행이 불가피한 것으로서 주민의 요청에 의하여 시ㆍ도지사가 시가화조정구역의 지정목적달성에 지장이 없다고 인정한 도시ㆍ군계획사 업은 시가화조정구역에서 시행할 수 있다.\n⑤ 시가화조정구역에서 입목의 벌채, 조림, 육림 행위는 허가 없이 할 수 있다.","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",8,0],[32,2021,21,50,3,"국토계획법","도시·군계획시설·매수청구","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 도시․군계획시설 사업에 관한 설명으로 틀린 것은?\n① 도시ㆍ군계획시설은 기반시설 중 도시ㆍ군관리계획으로 결정된 시설이다.\n② 도시ㆍ군계획시설사업이 같은 도의 관할 구역에 속하는 둘 이상의 시 또는 군에 걸쳐 시행되는 경우에는 국토교통부장관이 시행자를 정한다.\n③ 한국토지주택공사는 도시ㆍ군계획시설사업 대상 토지소유자 동의 요건을 갖추지 않아도 도시ㆍ군계획시설사업의 시행자로 지정을 받을 수 있다.\n④ 도시ㆍ군계획시설사업 실시계획에는 사업의 착수예정일및 준공예정일도 포함되어야 한다.\n⑤ 도시ㆍ군계획시설사업 실시계획 인가 내용과 다르게 도시ㆍ군계획시설사업을 하여 토지의 원상회복 명령을 받은 자가 원상회복을 하지 아니하면 ｢행정대집행법｣에 따른 행정대집행에 따라 원상회복을 할 수 있다.","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",9,0],[32,2021,21,51,3,"국토계획법","도시·군계획시설·매수청구","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 기반시설의 종류와 그 해당 시설의 연결이 틀린 것은?\n① 교통시설 - 차량 검사 및 면허시설\n② 공간시설 - 녹지\n③ 유통ㆍ공급시설 - 방송ㆍ통신시설\n④ 공공․문화체육시설 - 학교\n⑤ 보건위생시설 - 폐기물처리 및 재활용시설","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",9,0],[32,2021,21,52,3,"국토계획법","용도지역·용도지구·용도구역","","국토의 계획 및 이용에 관한 법령상 용도지역별 용적률의 최대한도가 큰 순서대로 나열한 것은?(단, 조례 기타 강화ㆍ완화조건은 고려하지 않음)\nㄱ. 근린상업지역 ㄴ. 준공업지역\nㄷ. 준주거지역 ㄹ. 보전녹지지역\nㅁ. 계획관리지역\n① ㄱ - ㄴ - ㄷ - ㄹ - ㅁ ② ㄱ - ㄷ - ㄴ - ㅁ - ㄹ\n③ ㄴ - ㅁ - ㄱ - ㄹ - ㄷ ④ ㄷ - ㄱ - ㄹ - ㄴ - ㅁ\n⑤ ㄷ - ㄴ - ㄱ - ㅁ - ㄹ","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",9,0],[32,2021,21,53,3,"도시개발법","도시개발구역 지정·계획","박스형(모두고르기)","도시개발법령상 도시개발구역을 지정할 수 있는 자를 모두 고른 것은?\nㄱ. 시ㆍ도지사 ㄴ. 대도시 시장\nㄷ. 국토교통부장관 ㄹ. 한국토지주택공사\n① ㄱ ② ㄴ, ㄹ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",9,0],[32,2021,21,54,3,"도시개발법","수용·사용·환지","옳은것 고르기","도시개발법령상 토지등의 수용 또는 사용의 방식에 따른 사업 시행에 관한 설명으로 옳은 것은?\n① 도시개발사업을 시행하는 지방자치단체는 도시개발구역지정 이후 그 시행방식을 혼용방식에서 수용 또는 사용방식으로 변경할 수 있다. 2021년 제32회 공인중개\n② 도시개발사업을 시행하는 정부출연기관이 그 사업에 필요한 토지를 수용하려면 사업대상 토지면적의 3분의 2 이상에 해당하는 토지를 소유하고 토지 소유자 총수의 2분의 1 이상에 해당하는 자의 동의를 받아야 한다.\n③ 도시개발사업을 시행하는 공공기관은 토지상환채권을 발행할 수 없다.\n④ 원형지를 공급받아 개발하는 지방공사는 원형지에 대한 공사완료 공고일부터 5년이 지난 시점이라면 해당 원형지를 매각할 수 있다.\n⑤ 원형지가 공공택지 용도인 경우 원형지개발자의 선정은 추첨의 방법으로 할 수 있다.","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",9,0],[32,2021,21,55,3,"도시개발법","수용·사용·환지","틀린것 고르기","도시개발법령상 환지 방식에 의한 사업 시행에 관한 설명으로 틀린 것은?\n① 도시개발사업을 입체 환지 방식으로 시행하는 경우에는 환지 계획에 건축 계획이 포함되어야 한다.\n② 시행자는 토지면적의 규모를 조정할 특별한 필요가 있으면 면적이 넓은 토지는 그 면적을 줄여서 환지를 정하거나 환지 대상에서 제외할 수 있다.\n③ 도시개발구역 지정권자가 정한 기준일의 다음 날부터 단독주택이 다세대주택으로 전환되는 경우 시행자는 해당 건축물에 대하여 금전으로 청산하거나 환지 지정을 제한할 수 있다.\n④ 시행자는 환지 예정지를 지정한 경우에 해당 토지를 사용하거나 수익하는 데에 장애가 될 물건이 그 토지에 있으면 그 토지의 사용 또는 수익을 시작할 날을 따로 정할 수 있다.\n⑤ 시행자는 환지를 정하지 아니하기로 결정된 토지 소유자나 임차권자등에게 날짜를 정하여 그날부터 해당 토지 또는 해당 부분의 사용 또는 수익을 정지시킬 수 있다.","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",9,0],[32,2021,21,56,3,"도시개발법","도시개발채권·기타","옳은것 고르기","도시개발법령상 도시개발채권에 관한 설명으로 옳은 것은?\n① ｢국토의 계획 및 이용에 관한 법률｣에 따른 공작물의 설치허가를 받은 자는 도시개발채권을 매입하여야 한다.\n② 도시개발채권의 이율은 기획재정부장관이 국채ㆍ공채 등의 금리와 특별회계의 상황 등을 고려하여 정한다.\n③ 도시개발채권을 발행하려는 시ㆍ도지사는 기획재정부장관의 승인을 받은 후 채권의 발행총액 등을 공고하여야 한다.\n④ 도시개발채권의 상환기간은 5년보다 짧게 정할 수는 없다.\n⑤ 도시개발사업을 공공기관이 시행하는 경우 해당 공공기 관의 장은 시ㆍ도지사의 승인을 받아 도시개발채권을 발행할 수 있다.","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",9,0],[32,2021,21,57,3,"도시개발법","도시개발구역 지정·계획","","도시개발법령상 도시개발구역에서 허가를 받아야 할 행위로 명시되지 않은 것은?\n① 토지의 합병\n② 토석의 채취\n③ 죽목의 식재\n④ 공유수면의 매립\n⑤ ｢건축법｣에 따른 건축물의 용도 변경","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",10,0],[32,2021,21,58,3,"도시개발법","도시개발구역 지정·계획","","도시개발법령상 도시개발구역 지정권자가 속한 기관에 종사하는 자로부터 제공받은 미공개정보를 지정 목적 외로 사용하여 1억 5천만원 상당의 재산상 이익을 얻은 자에게 벌금을 부과하는 경우 그 상한액은?\n① 1억 5천만원 ② 4억 5천만원 ③ 5억원\n④ 7억 5천만원 ⑤ 10억원","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",10,0],[32,2021,21,59,3,"국토계획법","도시·군계획시설·매수청구","","도시 및 주거환경정비법령상 다음의 정의에 해당하는 정비사업은?\n도시저소득 주민이 집단거주하는 지역으로서 정비기반시설이 극히 열악하고 노후ㆍ불량건축물이 과도하게 밀집한 지역의 주거환경을 개선하거나 단독주택 및 다세대주택이 밀집한 지역에서 정비기 반시설과 공동이용시설 확충을 통하여 주거환경을 보전ㆍ정비ㆍ개량하기 위한 사업\n① 주거환경개선사업 ② 재건축사업\n③ 공공재건축사업 ④ 재개발사업\n⑤ 공공재개발사업","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",10,0],[32,2021,21,60,3,"정비법","조합·추진위원회","박스형(모두고르기)","도시 및 주거환경정비법령상 조합총회의 의결사항 중 대의원회가 대행할 수 없는 사항을 모두 고른 것은?\nㄱ. 조합임원의 해임\nㄴ. 사업완료로 인한 조합의 해산\nㄷ. 정비사업비의 변경\nㄹ. 정비사업전문관리업자의 선정 및 변경\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",10,0],[32,2021,21,61,3,"정비법","정비계획·정비구역","빈칸","도시 및 주거환경정비법령상 공공재개발사업에 관한 설명이다. ( )에 들어갈 내용과 숫자를 바르게 나열한 것은?\n정비계획의 입안권자가 정비구역의 지정권자에게 공공재개발사업 예정구역 지정을 신청한 경우 지방도시계획위원회는 ( ㄱ )부터 ( ㄴ )일 이내에 심의를 완료해야 한다. 다만, ( ㄴ )일 이내에 심의를 완료할 수 없는 정당한 사유가 있다고 판단되는 경우에는 심의기간을 ( ㄷ )일의 범위에서 한 차례 연장할 수 있다.\n① ㄱ: 신청일, ㄴ: 20, ㄷ: 20\n② ㄱ: 신청일, ㄴ: 30, ㄷ: 20 2021년 제32회 공인중개사\n③ ㄱ: 신청일, ㄴ: 30, ㄷ: 30\n④ ㄱ: 신청일 다음 날, ㄴ: 20, ㄷ: 20\n⑤ ㄱ: 신청일 다음 날, ㄴ: 30, ㄷ: 30","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",10,0],[32,2021,21,62,3,"정비법","사업시행·관리처분","옳은것 고르기","도시 및 주거환경정비법령상 관리처분계획 등에 관한 설명으로 옳은 것은?(단, 조례는 고려하지 않음)\n① 지분형주택의 규모는 주거전용면적 60제곱미터 이하인 주택으로 한정한다.\n② 분양신청기간의 연장은 30일의 범위에서 한 차례만 할 수 있다.\n③ 같은 세대에 속하지 아니하는 3명이 1토지를 공유한 경우에는 3주택을 공급하여야 한다.\n④ 조합원 10분의 1 이상이 관리처분계획인가 신청이 있은 날부터 30일 이내에 관리처분계획의 타당성 검증을 요청한 경우 시장ㆍ군수는 이에 따라야 한다.\n⑤ 시장․군수는 정비구역에서 면적이 100제곱미터의 토지를 소유한 자로서 건축물을 소유하지 아니한 자의 요청이 있는 경우에는 인수한 임대주택의 일부를 ｢주택법｣에 따른 토지임대부 분양주택으로 전환하여 공급하여야 한다.","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",10,0],[32,2021,21,63,3,"정비법","정비사업 일반","옳은것 고르기","도시 및 주거환경정비법령상 정비사업의 시행에 관한 설명으로 옳은 것은?\n① 세입자의 세대수가 토지등소유자의 3분의 1에 해당하는 경우 시장ㆍ군수등은 토지주택공사등을 주거환경개선사업 시행자로 지정하기 위해서는 세입자의 동의를 받아야 한다.\n② 재개발사업은 토지등소유자가 30인인 경우에는 토지등소유자가 직접 시행할 수 있다.\n③ 재건축사업 조합설립추진위원회가 구성승인을 받은 날부터 2년이 되었음에도 조합설립인가를 신청하지 아니한 경우 시장ㆍ군수등이 직접 시행할 수 있다.\n④ 조합설립추진위원회는 토지등소유자의 수가 200인인 경우 5명 이상의 이사를 두어야 한다.\n⑤ 주민대표회의는 토지등소유자의 과반수의 동의를 받아 구성하며, 위원장과 부위원장 각 1명과 1명 이상 3명 이하의 감사를 둔다.","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",10,0],[32,2021,21,64,3,"정비법","사업시행·관리처분","옳은것 고르기","도시 및 주거환경정비법령상 청산금 및 비용부담 등에 관한 설명으로 옳은 것은?\n① 청산금을 징수할 권리는 소유권 이전고시일부터 3년간 행사하지 아니하면 소멸한다.\n② 정비구역의 국유ㆍ공유재산은 정비사업 외의 목적으로 매각되거나 양도될 수 없다.\n③ 청산금을 지급받을 자가 받기를 거부하더라도 사업시행자는 그 청산금을 공탁할 수는 없다.\n④ 시장ㆍ군수등이 아닌 사업시행자는 부과금을 체납하는 자가 있는 때에는 지방세 체납처분의 예에 따라 부과ㆍ징수할 수 있다.\n⑤ 국가 또는 지방자치단체는 토지임대부 분양주택을 공급받는 자에게 해당 공급비용의 전부를 융자할 수는 없다.","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",10,0],[32,2021,21,65,3,"주택법","주택공급·분양가상한·전매제한","빈칸","주택법령상 한국토지주택공사가 우선 매입하는 분양가상한제 적용주택의 매입금액에 관한 설명이다. ( )에 들어갈 숫자를 바르게 나열한 것은?\n공공택지 외의 택지에서 건설․공급되는 주택의 분양가격이 인근지역주택매매가격의 80퍼센트 이상 100퍼센트 미만이고 보유기간이 3년 이상 4년 미만인 경우: 매입비용의 ( ㄱ )퍼센트에 인근지역주택매매가격의 ( ㄴ )퍼센트를 더한 금액\n① ㄱ: 25, ㄴ: 50 ② ㄱ: 25, ㄴ: 75 ③ ㄱ: 50, ㄴ: 50\n④ ㄱ: 50, ㄴ: 75 ⑤ ㄱ: 75, ㄴ: 25","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",11,0],[32,2021,21,66,3,"주택법","리모델링·기타","틀린것 고르기","주택법령상 주택단지가 일정한 시설로 분리된 토지는 각각 별개의 주택단지로 본다. 그 시설에 해당하지 않는 것은?\n① 철도\n② 폭 20미터의 고속도로\n③ 폭 10미터의 일반도로\n④ 폭 20미터의 자동차전용도로\n⑤ 폭 10미터의 도시계획예정도로","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",11,0],[32,2021,21,67,3,"건축법","건축법 일반","박스형(모두고르기), 옳은것 고르기","주택법령상 용어에 관한 설명으로 옳은 것을 모두고른 것은?\nㄱ. 주택에 딸린 ｢건축법｣에 따른 건축설비는 복리시설에 해당한다.\nㄴ. 300세대인 국민주택규모의 단지형 다세대주택은 도시형 생활주택에 해당한다.\nㄷ. 민영주택은 국민주택을 제외한 주택을 말한다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",11,0],[32,2021,21,68,3,"주택법","주택공급·분양가상한·전매제한","빈칸","주택법령상 투기과열지구의 지정 기준에 관한 설명이다.\n( )에 들어갈 숫자와 내용을 바르게 나열한 것은?\n○ 투기과열지구로 지정하는 날이 속하는 달의 바로 전 달(이하 “직전월”)부터 소급하여 주택공급이 있었던 ( ㄱ )개월 동안 해당 지역에서 공급되는 주택의 월평균 청약경쟁률이 모두 5대 1을 초과하였거나 국민주택규모 주택의 월평균 청약경쟁률이 모두 ( ㄴ )대 1을 초과한 곳\n○ 주택의 ( ㄷ )이 직전월보다 30퍼센트 이상 감소 하여 주택공급이 위축될 우려가 있는 곳\n① ㄱ: 2, ㄴ: 10, ㄷ: 분양계획\n② ㄱ: 2, ㄴ: 10, ㄷ: 건축허가실적\n③ ㄱ: 2, ㄴ: 20, ㄷ: 건축허가실적\n④ ㄱ: 3, ㄴ: 10, ㄷ: 분양계획\n⑤ ㄱ: 3, ㄴ: 20, ㄷ: 건축허가실적 2021년 제32회 공인중개사","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",11,0],[32,2021,21,69,3,"주택법","사업계획승인·사용검사","틀린것 고르기","주택법령상 사업계획승인 등에 관한 설명으로 틀린 것은?(단, 다른 법률에 따른 사업은 제외함)\n① 주택건설사업을 시행하려는 자는 전체 세대수가 600세대 이상의 주택단지를 공구별로 분할하여 주택을 건설ㆍ공급할 수 있다.\n② 사업계획승인권자는 착공신고를 받은 날부터 20일 이내에 신고수리 여부를 신고인에게 통지하여야 한다.\n③ 사업계획승인권자는 사업계획승인의 신청을 받았을 때에는 정당한 사유가 없으면 신청받은 날부터 60일 이내에 사업주체에게 승인 여부를 통보하여야 한다.\n④ 사업주체는 사업계획승인을 받은 날부터 1년 이내에 공사를 착수하여야 한다.\n⑤ 사업계획에는 부대시설 및 복리시설의 설치에 관한 계획 등이 포함되어야 한다.","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",11,0],[32,2021,21,70,3,"주택법","사업주체·주택조합","박스형(모두고르기)","주택법령상 주택상환사채의 납입금이 사용될 수 있는 용도로 명시된 것을 모두 고른 것은?\nㄱ. 주택건설자재의 구입\nㄴ. 택지의 구입 및 조성\nㄷ. 주택조합 운영비에의 충당\nㄹ. 주택조합 가입 청약철회자의 가입비 반환\n① ㄱ, ㄴ ② ㄱ, ㄹ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄴ, ㄷ, ㄹ","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",11,0],[32,2021,21,71,3,"주택법","주택공급·분양가상한·전매제한","박스형(모두고르기), 옳은것 고르기","주택법령상 주택공급과 관련하여 금지되는 공급질서 교란행위에 해당하는 것을 모두 고른 것은?\nㄱ. 주택을 공급받을 수 있는 조합원 지위의 상속\nㄴ. 입주자저축 증서의 저당\nㄷ. 공공사업의 시행으로 인한 이주대책에 따라 주택을 공급받을 수 있는 지위의 매매\nㄹ. 주택을 공급받을 수 있는 증서로서 시장․군수․구청장이 발행한 무허가건물 확인서의 증여\n① ㄱ, ㄴ ② ㄱ, ㄹ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄴ, ㄷ, ㄹ","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",11,0],[32,2021,21,72,3,"건축법","건축물·용어·적용범위","옳은것 고르기","건축법령상 특수구조 건축물의 특례에 관한 설명으로 옳은 것은?(단, 건축법령상 다른 특례 및 조례는 고려하지 않음)\n① 건축 공사현장 안전관리 예치금에 관한 규정을 강화하여 적용할 수 있다.\n② 대지의 조경에 관한 규정을 변경하여 적용할 수 있다.\n③ 한쪽 끝은 고정되고 다른 끝은 지지되지 아니한 구조로 된 차양이 외벽(외벽이 없는 경우에는 외곽 기둥을 말함)의 중심선으로부터 3미터 이상 돌출된 건축물은 특수구조 건축물에 해당한다.\n④ 기둥과 기둥 사이의 거리(기둥의 중심선 사이의 거리를 말함)가 15미터인 건축물은 특수구조 건축물로서 건축물 내진등급의 설정에 관한 규정을 강화하여 적용할 수 있다.\n⑤ 특수구조 건축물을 건축하려는 건축주는 건축허가 신청 전에 허가권자에게 해당 건축물의 구조 안전에 관하여 지방건축위원회의 심의를 신청하여야 한다.","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",11,0],[32,2021,21,73,3,"건축법","건축물·용어·적용범위","","건축주 甲은 수면 위에 건축물을 건축하고자 한다. 건축법령상 그 건축물의 대지의 범위를 설정하기 곤란한 경우 甲이 허가권자에게 완화 적용을 요청할 수 없는 기준은?(단, 다른 조건과 조례는 고려하지 않음)\n① 대지의 조경 ② 공개 공지 등의 확보\n③ 건축물의 높이 제한 ④ 대지의 안전\n⑤ 건축물 내진등급의 설정","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",12,0],[32,2021,21,74,3,"건축법","건축허가·신고·사용승인","옳은것 고르기","건축법령상 건축허가 제한에 관한 설명으로 옳은 것은?\n① 국방, 문화재보존 또는 국민경제를 위하여 특히 필요한 경우 주무부장관은 허가권자의 건축허가를 제한할 수 있다.\n② 지역계획을 위하여 특히 필요한 경우 도지사는 특별자 치시장의 건축허가를 제한할 수 있다.\n③ 건축허가를 제한하는 경우 건축허가 제한기간은 2년 이내로 하며, 1회에 한하여 1년 이내의 범위에서 제한기간을 연장할 수 있다.\n④ 시ㆍ도지사가 건축허가를 제한하는 경우에는 ｢토지이용규제 기본법｣에 따라 주민의견을 청취하거나 건축위원회의 심의를 거쳐야 한다.\n⑤ 국토교통부장관은 건축허가를 제한하는 경우 제한 목적ㆍ기간, 대상 건축물의 용도와 대상 구역의 위치ㆍ면적ㆍ경계를 지체 없이 공고하여야 한다.","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",12,0],[32,2021,21,75,3,"건축법","건축허가·신고·사용승인","옳은것 고르기","건축주 甲은 A도 B시에서 연면적이 100제곱미터이고 2층인 건축물을 대수선하고자 ｢건축법｣ 제14조에 따른 신고(이하 “건축신고”)를 하려고 한다. 건축법령상 이에 관한 설명으로 옳은 것은?(단, 건축법령상 특례 및 조례는 고려하지 않음)\n① 甲이 대수선을 하기 전에 B시장에게 건축신고를 하면 건축허가를 받은 것으로 본다.\n② 건축신고를 한 甲이 공사시공자를 변경하려면 B시장에게 허가를 받아야 한다.\n③ B시장은 건축신고의 수리 전에 건축물 안전영향평가를 실시하여야 한다.\n④ 건축신고를 한 甲이 신고일부터 6개월 이내에 공사에 착수하지 아니하면 그 신고의 효력은 없어진다.\n⑤ 건축신고를 한 甲은 건축물의 공사가 끝난 후 사용승인 신청 없이 건축물을 사용할 수 있다.","1","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",12,0],[32,2021,21,76,3,"정비법","정비사업 일반","박스형(모두고르기)","건축법령상 건축물대장에 건축물과 그 대지의 현황및 건축물의 구조내력에 관한 정보를 적어서 보관하고 이를 지속적으로 정비하여야 하는 경우를 모두고른 것은?(단, 가설건축물은 제외함)\nㄱ. 허가권자가 건축물의 사용승인서를 내준 경우\nㄴ. 건축허가 또는 건축신고 대상 건축물 외의 건축물의 공사가 끝난 후 기재 요청이 있는 경우\nㄷ. ｢집합건물의 소유 및 관리에 관한 법률｣에 따른 건축물대장의 신규등록 신청이 있는 경우\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ 2021년 제32회 공인중개사","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",12,0],[32,2021,21,77,3,"건축법","특별건축구역·건축협정·이행강제금","옳은것 고르기","건축법령상 특별건축구역에 관한 설명으로 옳은 것은?\n① 국토교통부장관은 지방자치단체가 국제행사 등을 개최하는 지역의 사업구역을 특별건축구역으로 지정할 수 있다.\n② ｢도로법｣에 따른 접도구역은 특별건축구역으로 지정될 수 없다.\n③ 특별건축구역에서의 건축기준의 특례사항은 지방자치단체가 건축하는 건축물에는 적용되지 않는다.\n④ 특별건축구역에서 ｢주차장법｣에 따른 부설주차장의 설치에 관한 규정은 개별 건축물마다 적용하여야 한다.\n⑤ 특별건축구역을 지정한 경우에는 ｢국토의 계획 및 이용에 관한 법률｣에 따른 용도지역ㆍ지구ㆍ구역의 지정이 있는 것으로 본다.","2","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",12,0],[32,2021,21,78,3,"건축법","특별건축구역·건축협정·이행강제금","","건축법령상 건축등과 관련된 분쟁으로서 건축분쟁전문 위원회의 조정 및 재정의 대상이 되는 것은?(단, ｢건설산업기본법｣ 제69조에 따른 조정의 대상이 되는 분쟁은 고려하지 않음)\n① ‘건축주’와 ‘건축신고수리자’ 간의 분쟁\n② ‘공사시공자’와 ‘건축지도원’ 간의 분쟁\n③ ‘건축허가권자’와 ‘공사감리자’ 간의 분쟁\n④ ‘관계전문기술자’와 ‘해당 건축물의 건축등으로 피해를 입은 인근주민’ 간의 분쟁\n⑤ ‘건축허가권자’와 ‘해당 건축물의 건축등으로 피해를 입은 인근주민’ 간의 분쟁","4","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",12,0],[32,2021,21,79,3,"농지법","농지 소유·이용·보전","틀린것 고르기","농지법령상 농지취득자격증명을 발급받지 아니하고 농지를 취득할 수 있는 경우가 아닌 것은?\n① 시효의 완성으로 농지를 취득하는 경우\n② 공유 농지의 분할로 농지를 취득하는 경우\n③ 농업법인의 합병으로 농지를 취득하는 경우\n④ 국가나 지방자치단체가 농지를 소유하는 경우\n⑤ 주말ㆍ체험영농을 하려고 농업진흥지역 외의 농지를 소유하는 경우","5","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",12,0],[32,2021,21,80,3,"농지법","농지 소유·이용·보전","옳은것 고르기","농지법령상 유휴농지에 대한 대리경작자의 지정에 관한 설명으로 옳은 것은?\n① 지력의 증진이나 토양의 개량ㆍ보전을 위하여 필요한 기간 동안 휴경하는 농지에 대하여도 대리경작자를 지정할 수 있다.\n② 대리경작자 지정은 유휴농지를 경작하려는 농업인 또는 농업법인의 신청이 있을 때에만 할 수 있고, 직권으로는 할 수 없다.\n③ 대리경작자가 경작을 게을리하는 경우에는 대리경작 기간이 끝나기 전이라도 대리경작자 지정을 해지할 수 있다.\n④ 대리경작 기간은 3년이고, 이와 다른 기간을 따로 정할 수 없다.\n⑤ 농지 소유권자를 대신할 대리경작자만 지정할 수 있고, 농지 임차권자를 대신할 대리경작자를 지정할 수는 없다.","3","15M7Fl98b4oAeb1GQcJOPkkzPY3PXgeot",12,0],[32,2021,22,1,4,"공간정보법","지번·지목·면적·경계","옳은것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지상경계의 결정기준으로 옳은 것은?(단, 지상경계의 구획을 형성하는 구조물 등의 소유자가 다른 경우는 제외함)\n① 연접되는 토지 간에 높낮이 차이가 있는 경우: 그 구조물 등의 하단부\n② 공유수면매립지의 토지 중 제방 등을 토지에 편입하여 등록하는 경우: 그 경사면의 하단부\n③ 도로ㆍ구거 등의 토지에 절토(땅깎기)된 부분이 있는 경우: 바깥쪽 어깨부분\n④ 토지가 해면 또는 수면에 접하는 경우: 최소만조위 또는 최소만수위가 되는 선\n⑤ 연접되는 토지 간에 높낮이 차이가 없는 경우: 그 구조물 등의 상단부","1","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",1,0],[32,2021,22,2,4,"공간정보법","지번·지목·면적·경계","","공간정보의 구축 및 관리 등에 관한 법령상 지상건축물 등의 현황을 지적도 및 임야도에 등록된 경계와 대비하여 표시하는 지적측량은?\n① 등록전환측량 ② 신규등록측량 ③ 지적현황측량\n④ 경계복원측량 ⑤ 토지분할측량","3","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",1,0],[32,2021,22,3,4,"공간정보법","지적공부·부동산종합공부","박스형(모두고르기), 옳은것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 임야도의 축척에 해당하는 것을 모두 고른 것은?\nㄱ. 1/2000 ㄴ. 1/2400 ㄷ. 1/3000\nㄹ. 1/6000 ㅁ. 1/50000\n① ㄱ, ㄷ ② ㄷ, ㄹ ③ ㄱ, ㄴ, ㅁ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄴ, ㄷ, ㄹ, ㅁ","2","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",1,0],[32,2021,22,4,4,"공간정보법","지번·지목·면적·경계","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지목의 구분에 관한 설명으로 틀린 것은?\n① 바닷물을 끌어들여 소금을 채취하기 위하여 조성된 토지와 이에 접속된 제염장(製鹽場) 등 부속시설물의 부지는 “염전”으로 한다. 다만, 천일제염 방식으로 하지 아니하고 동력으로 바닷물을 끌어들여 소금을 제조하는 공장시설물의 부지는 제외한다.\n② 저유소(貯油所) 및 원유저장소의 부지와 이에 접속된 부속시설물의 부지는 “주유소용지”로 한다. 다만, 자동차ㆍ선박ㆍ기차 등의 제작 또는 정비공장 안에 설치된 급유ㆍ송유시설 등의 부지는 제외한다.\n③ 물이 고이거나 상시적으로 물을 저장하고 있는 댐ㆍ저수지ㆍ소류지(沼溜地)ㆍ호수ㆍ연못 등의 토지와 물을 상시적으로 직접 이용하여 연(蓮)ㆍ왕골 등의 식물을 주로 재배하는 토지는 “유지”로 한다.\n④ 일반 공중의 보건ㆍ휴양 및 정서생활에 이용하기 위한 시설을 갖춘 토지로서 ｢국토의 계획 및 이용에 관한 법률｣에 따라 공원 또는 녹지로 결정ㆍ고시된 토지는 “공원”으로 한다. 2021년 제32회 공인중개\n⑤ 용수(用水) 또는 배수(排水)를 위하여 일정한 형태를 갖춘 인공적인 수로ㆍ둑 및 그 부속시설물의 부지와 자연의 유수(流水)가 있거나 있을 것으로 예상되는 소규모 수로부지는 “구거”로 한다.","3","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",1,0],[32,2021,22,5,4,"공간정보법","지번·지목·면적·경계","박스형(모두고르기), 계산","공간정보의 구축 및 관리 등에 관한 법령상 지적도및 임야도의 등록사항을 모두 고른 것은?\nㄱ. 토지의 소재\nㄴ. 좌표에 의하여 계산된 경계점 간의 거리(경계점좌표등록부를 갖춰 두는 지역으로 한정)\nㄷ. 삼각점 및 지적기준점의 위치\nㄹ. 건축물 및 구조물 등의 위치\nㅁ. 도곽선(圖廓線)과 그 수치\n① ㄱ, ㄷ, ㄹ ② ㄴ, ㄷ, ㅁ\n③ ㄴ, ㄹ, ㅁ ④ ㄱ, ㄴ, ㄷ, ㅁ\n⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","5","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",1,0],[32,2021,22,6,4,"공간정보법","지적측량·지적위원회","옳은것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적측량의 적부심사 등에 관한 설명으로 옳은 것은?\n① 지적측량 적부심사청구를 받은 지적소관청은 30일 이내에 다툼이 되는 지적측량의 경위 및 그 성과, 해당 토지에 대한 토지이동 및 소유권 변동 연혁, 해당 토지 주변의 측량기준점, 경계, 주요 구조물 등 현황 실측도를 조사하여 지방지적위원회에 회부하여야 한다.\n② 지적측량 적부심사청구를 회부받은 지방지적위원회는 부득이한 경우가 아닌 경우 그 심사청구를 회부받은 날부터 90일 이내에 심의ㆍ의결하여야 한다.\n③ 지방지적위원회는 부득이한 경우에 심의기간을 해당 지적위원회의 의결을 거쳐 60일 이내에서 한 번만 연장할 수 있다.\n④ 시ㆍ도지사는 지방지적위원회의 지적측량 적부심사 의결서를 받은 날부터 7일 이내에 지적측량 적부심사 청구인 및 이해관계인에게 그 의결서를 통지하여야 한다.\n⑤ 의결서를 받은 자가 지방지적위원회의 의결에 불복하는 경우에는 그 의결서를 받은 날부터 90일 이내에 시ㆍ도지사를 거쳐 중앙지적위원회에 재심사를 청구할 수 있다.","4","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",1,0],[32,2021,22,7,4,"공간정보법","지번·지목·면적·경계","","공간정보의 구축 및 관리 등에 관한 법령상 토지의 이동이 있을 때 토지소유자의 신청이 없어 지적소관청이 토지의 이동현황을 직권으로 조사ㆍ측량하여 토지의 지번ㆍ지목ㆍ면적ㆍ경계 또는 좌표를 결정하기 위해 수립하는 계획은?\n① 토지이동현황 조사계획 ② 토지조사계획\n③ 토지등록계획 ④ 토지조사ㆍ측량계획\n⑤ 토지조사ㆍ등록계획 개","1","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",1,0],[32,2021,22,8,4,"공간정보법","지번·지목·면적·경계","","공간정보의 구축 및 관리 등에 관한 법령상 공유지 연명부와 대지권등록부의 공통 등록사항을 모두 고른 것은?\nㄱ. 지번\nㄴ. 소유권 지분\nㄷ. 소유자의 성명 또는 명칭, 주소 및 주민등록번호\nㄹ. 토지의 고유번호\nㅁ. 토지소유자가 변경된 날과 그 원인\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ, ㅁ\n③ ㄱ, ㄷ, ㄹ, ㅁ ④ ㄴ, ㄷ, ㄹ, ㅁ\n⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","5","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",2,0],[32,2021,22,9,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","박스형(모두고르기), 틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 토지소유자 등 이해관계인이 지적측량수행자에게 지적측량을 의뢰하여야 하는 경우가 아닌 것을 모두 고른 것은?(단, 지적측량을 할 필요가 있는 경우임)\nㄱ. 지적측량성과를 검사하는 경우\nㄴ. 토지를 등록전환하는 경우\nㄷ. 축척을 변경하는 경우\nㄹ. ｢지적재조사에 관한 특별법｣에 따른 지적재조사사업에 따라 토지의 이동이 있는 경우\n① ㄱ, ㄴ ② ㄱ, ㄹ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄴ, ㄷ, ㄹ","2","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",2,0],[32,2021,22,10,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","옳은것 고르기, 빈칸","공간정보의 구축 및 관리 등에 관한 법령상 축척변경위원회의 구성에 관한 내용이다. ( )에 들어갈 사항으로 옳은 것은?\n축척변경위원회는 ( ㄱ ) 이상 10명 이하의 위원으로 구성하되, 위원의 2분의 1 이상을 토지소유 자로 하여야 한다. 이 경우 그 축척변경 시행지역의 토지소유자가 ( ㄴ ) 이하일 때에는 토지소유자 전원을 위원으로 위촉하여야 한다. 위원장은 위원 중에서 ( ㄷ )이 지명한다.\n① ㄱ: 3명, ㄴ: 3명, ㄷ: 지적소관청\n② ㄱ: 5명, ㄴ: 5명, ㄷ: 지적소관청\n③ ㄱ: 5명, ㄴ: 5명, ㄷ: 국토교통부장관\n④ ㄱ: 7명, ㄴ: 7명, ㄷ: 지적소관청\n⑤ ㄱ: 7명, ㄴ: 7명, ㄷ: 국토교통부장관","2","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",2,0],[32,2021,22,11,4,"공간정보법","지적공부·부동산종합공부","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 부동산종합공부에 관한 설명으로 틀린 것은?\n① 지적소관청은 ｢건축법｣ 제38조에 따른 건축물대장의 내용에서 건축물의 표시와 소유자에 관한 사항(토지에 건축물이 있는 경우만 해당)을 부동산종합공부에 등록하여야 한다.\n② 지적소관청은 ｢부동산등기법｣ 제48조에 따른 부동산의 권리에 관한 사항을 부동산종합공부에 등록하여야 한다.\n③ 지적소관청은 부동산의 효율적 이용과 부동산과 관련된 정보의 종합적 관리ㆍ운영을 위하여 부동산종합공부를 관리ㆍ운영한다. 2021년 제32회 공인중개\n④ 지적소관청은 부동산종합공부를 영구히 보존하여야 하며, 부동산종합공부의 멸실 또는 훼손에 대비하여 이를 별도로 복제하여 관리하는 정보관리체계를 구축하여야 한다.\n⑤ 부동산종합공부를 열람하려는 자는 지적소관청이나 읍ㆍ면ㆍ동의 장에게 신청할 수 있으며, 부동산종합공부 기록사항의 전부 또는 일부에 관한 증명서를 발급받으려는 자는 시ㆍ도지사에게 신청하여야 한다.","5","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",2,0],[32,2021,22,12,4,"공간정보법","지적공부·부동산종합공부","박스형(모두고르기), 옳은것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적공부의 보존 등에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 지적서고는 지적사무를 처리하는 사무실과 연접\n(連接)하여 설치하여야 한다.\nㄴ. 지적소관청은 천재지변이나 그 밖에 이에 준하는 재난을 피하기 위하여 필요한 경우에는 지적공부를 해당 청사 밖으로 반출할 수 있다.\nㄷ. 지적공부를 정보처리시스템을 통하여 기록ㆍ저장한 경우 관할 시ㆍ도지사, 시장ㆍ군수 또는 구청장은 그 지적공부를 지적정보관리체계에 영구히 보존하여야 한다.\nㄹ. 카드로 된 토지대장ㆍ임야대장 등은 200장 단위로 바인더(binder)에 넣어 보관하여야 한다.\n① ㄱ, ㄷ ② ㄴ, ㄹ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄹ","4","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",2,0],[32,2021,22,13,4,"부동산등기법","등기 일반·효력","틀린것 고르기","관공서의 촉탁등기에 관한 설명으로 틀린 것은?\n① 관공서가 경매로 인하여 소유권이전등기를 촉탁하는 경우, 등기기록과 대장상의 부동산의 표시가 부합하지 않은 때에는 그 등기촉탁을 수리할 수 없다.\n② 관공서가 등기를 촉탁하는 경우 우편에 의한 등기촉탁도 할 수 있다.\n③ 등기의무자인 관공서가 등기권리자의 청구에 의하여 등기를 촉탁하는 경우, 등기의무자의 권리에 관한 등기필정보를 제공할 필요가 없다.\n④ 등기권리자인 관공서가 부동산 거래의 주체로서 등기를 촉탁할 수 있는 경우라도 등기의무자와 공동으로 등기를 신청할 수 있다.\n⑤ 촉탁에 따른 등기절차는 법률에 다른 규정이 없는 경우에는 신청에 따른 등기에 관한 규정을 준용한다.","1","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",2,0],[32,2021,22,14,4,"부동산등기법","등기신청(공동·단독·전자신청)","박스형(모두고르기)","단독으로 등기신청할 수 있는 것을 모두 고른 것은?\n(단, 판결 등 집행권원에 의한 신청은 제외함)\nㄱ. 가등기명의인의 가등기말소등기 신청\nㄴ. 토지를 수용한 한국토지주택공사의 소유권이전등기 신청\nㄷ. 근저당권의 채권최고액을 감액하는 근저당권자의 변경등기 신청\nㄹ. 포괄유증을 원인으로 하는 수증자의 소유권이전등기 신청\n① ㄱ ② ㄱ, ㄴ ③ ㄴ, ㄷ\n④ ㄱ, ㄷ, ㄹ ⑤ ㄴ, ㄷ, ㄹ 개","2","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",2,0],[32,2021,22,15,4,"부동산등기법","등기 일반·효력","틀린것 고르기","부동산등기법상 등기의 당사자능력에 관한 설명으로 틀린 것은?\n① 법인 아닌 사단(社團)은 그 사단 명의로 대표자가 등기를 신청할 수 있다.\n② 시설물로서의 학교는 학교 명의로 등기할 수 없다.\n③ 행정조직인 읍, 면은 등기의 당사자능력이 없다.\n④ 민법상 조합을 채무자로 표시하여 조합재산에 근저당권설정등기를 할 수 있다.\n⑤ 외국인은 법령이나 조약의 제한이 없는 한 자기 명의로 등기신청을 하고 등기명의인이 될 수 있다.","4","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",3,0],[32,2021,22,16,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","박스형(모두고르기)","2021년에 사인(私人)간 토지소유권이전등기 신청시, 등기원인을 증명하는 서면에 검인을 받아야 하는 경우를 모두 고른 것은?\nㄱ. 임의경매\nㄴ. 진정명의 회복\nㄷ. 공유물분할합의\nㄹ. 양도담보계약\nㅁ. 명의신탁해지약정\n① ㄱ, ㄴ ② ㄱ, ㄷ ③ ㄴ, ㄹ\n④ ㄷ, ㅁ ⑤ ㄷ, ㄹ, ㅁ","5","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",3,0],[32,2021,22,17,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","옳은것 고르기","소유권에 관한 등기의 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 공유물분할금지약정이 등기된 부동산의 경우에 그 약정상 금지기간 동안에는 그 부동산의 소유권 일부에 관한 이전등기를 할 수 없다.\nㄴ. 2020년에 체결된 부동산매매계약서를 등기원인을 증명하는 정보로 하여 소유권이전등기를 신청하는 경우에는 거래가액을 신청정보의 내용으로 제공하여야 한다.\nㄷ. 거래가액을 신청정보의 내용으로 제공하는 경우, 1개의 부동산에 관한 여러 명의 매도인과 여러 명의 매수인 사이의 매매계약인 때에는 매매목록을 첨부정보로 제공하여야 한다.\nㄹ. 공유물분할금지약정이 등기된 경우, 그 약정의 변경등기는 공유자 중 1인이 단독으로 신청할 수 있다.\n① ㄱ, ㄴ ② ㄱ, ㄷ ③ ㄴ, ㄷ ④ ㄴ, ㄹ ⑤ ㄷ, ㄹ","3","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",3,0],[32,2021,22,18,4,"부동산등기법","용익권·담보권 등기","틀린것 고르기","甲은 乙과 乙 소유 A건물 전부에 대해 전세금 5억원, 기간 2년으로 하는 전세권설정계약을 체결하고 공동으로 전세권설정등기를 신청하였다. 이에 관한 설명으로 틀린 것은?\n① 등기관은 전세금을 기록하여야 한다.\n② 등기관은 존속기간을 기록하여야 한다.\n③ 전세권설정등기가 된 후, 전세금반환채권의 일부 양도를 원인으로 한 전세권 일부이전등기를 할 때에 등기관은 양도액을 기록한다. 2021년 제32회 공인중개\n④ 전세권설정등기가 된 후에 건물전세권의 존속기간이 만료되어 법정갱신이 된 경우, 甲은 존속기간 연장을 위한 변경등기를 하지 않아도 그 전세권에 대한 저당권설정등기를 할 수 있다.\n⑤ 전세권설정등기가 된 후에 甲과 丙이 A건물의 일부에 대한 전전세계약에 따라 전전세등기를 신청하는 경우, 그 부분을 표시한 건물도면을 첨부정보로 등기소에 제공하여야 한다.","4","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",3,0],[32,2021,22,19,4,"부동산등기법","용익권·담보권 등기","틀린것 고르기","乙은 甲에 대한 동일한 채무의 담보를 위해 자신 소유의 A와 B부동산에 甲 명의의 저당권설정등기를 하였다. 그 후 A부동산에는 丙 명의의 후순위 저당권설정등기가 되었다. 이에 관한 설명으로 틀린 것은?\n① 乙이 甲에 대한 동일한 채무를 담보하기 위해 추가로 C 부동산에 대한 저당권설정등기를 신청한 경우, 등기관은 C부동산의 저당권설정등기 및 A와 B부동산의 저당권설정등기의 끝부분에 공동담보라는 뜻을 기록하여야 한다.\n② 丙이 乙의 채무의 일부를 甲에게 변제하여 그 대위변제를 이유로 저당권 일부이전등기가 신청된 경우, 등기관은 변제액을 기록하여야 한다.\n③ 乙이 변제하지 않아 甲이 우선 A부동산을 경매하여 변제받은 경우, 丙은 후순위저당권자로서 대위등기를 할 때 ‘甲이 변제받은 금액’과 ‘매각대금’을 신청정보의 내용으로 제공하여야 한다.\n④ 甲에 대한 乙의 채무가 증액되어 C, D 및 E부동산이 담보로 추가된 경우, 이때 공동담보목록은 전자적으로 작성하고 1년마다 그 번호를 새로 부여하여야 한다.\n⑤ 丙이 후순위저당권자로서 대위등기를 할 경우, 甲이 등기의무자가 되고 丙이 등기권리자가 되어 공동으로 신청하여야 한다.","1","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",3,0],[32,2021,22,20,4,"부동산등기법","등기 일반·효력","틀린것 고르기","부동산등기에 관한 설명으로 틀린 것은?\n① 건물소유권의 공유지분 일부에 대하여는 전세권설정등기를 할 수 없다.\n② 구분건물에 대하여는 전유부분마다 부동산고유번호를 부여한다.\n③ 폐쇄한 등기기록에 대해서는 등기사항의 열람은 가능하 지만 등기사항증명서의 발급은 청구할 수 없다.\n④ 전세금을 증액하는 전세권변경등기는 등기상 이해관계 있는 제3자의 승낙 또는 이에 대항할 수 있는 재판의 등본이 없으면 부기등기가 아닌 주등기로 해야 한다.\n⑤ 등기관이 부기등기를 할 때에는 주등기 또는 부기등기의 순위번호에 가지번호를 붙여서 하여야 한다.","3","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",3,0],[32,2021,22,21,4,"부동산등기법","등기 일반·효력","박스형(모두고르기)","환매특약등기의 등기사항인 것을 모두 고른 것은?\nㄱ. 채권최고액\nㄴ. 이자지급시기\nㄷ. 매매비용\nㄹ. 매수인이 지급한 대금\n① ㄱ, ㄴ ② ㄱ, ㄹ ③ ㄴ, ㄷ ④ ㄴ, ㄹ ⑤ ㄷ, ㄹ 개","5","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",3,0],[32,2021,22,22,4,"부동산등기법","가등기","틀린것 고르기","가등기에 관한 설명으로 틀린 것은?\n① 가등기권리자는 가등기를 명하는 법원의 가처분명령이 있는 경우에는 단독으로 가등기를 신청할 수 있다.\n② 근저당권 채권최고액의 변경등기청구권을 보전하기 위해 가등기를 할 수 있다.\n③ 가등기를 한 후 본등기의 신청이 있을 때에는 가등기의 순위번호를 사용하여 본등기를 하여야 한다.\n④ 임차권설정등기청구권보전 가등기에 의한 본등기를 한 경우 가등기 후 본등기 전에 마쳐진 저당권설정등기는 직권말소의 대상이 아니다.\n⑤ 등기관이 소유권이전등기청구권보전 가등기에 의한 본등기를 한 경우, 가등기 후 본등기 전에 마쳐진 해당 가등기상 권리를 목적으로 하는 가처분등기는 직권으로 말소한다.","5","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",4,0],[32,2021,22,23,4,"부동산등기법","등기 일반·효력","판례, 틀린것 고르기","등기의 효력에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 등기관이 등기를 마친 경우 그 등기는 접수한 때부터 효력이 발생한다.\n② 소유권이전등기청구권 보전을 위한 가등기에 기한 본등기가 된 경우 소유권이전의 효력은 본등기시에 발생한다.\n③ 사망자 명의의 신청으로 마쳐진 이전등기에 대해서는 그 등기의 무효를 주장하는 자가 현재의 실체관계와 부합하지 않음을 증명할 책임이 있다.\n④ 소유권이전등기청구권 보전을 위한 가등기권리자는 그 본등기를 명하는 판결이 확정된 경우라도 가등기에 기한 본등기를 마치기 전 가등기만으로는 가등기된 부동산에 경료된 무효인 중복소유권보존등기의 말소를 청구할 수 없다.\n⑤ 폐쇄된 등기기록에 기록되어 있는 등기사항에 관한 경 정등기는 할 수 없다.","3","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",4,0],[32,2021,22,24,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","박스형(모두고르기), 옳은것 고르기","부동산등기법상 신탁등기에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 법원이 신탁 변경의 재판을 한 경우 수탁자는 지체 없이 신탁원부 기록의 변경등기를 신청하여야 한다.\nㄴ. 신탁재산이 수탁자의 고유재산이 되었을 때에는 그 뜻의 등기를 주등기로 하여야 한다.\nㄷ. 등기관이 신탁재산에 속하는 부동산에 관한 권리에 대하여 수탁자의 변경으로 인한 이전등기를 할 경우에는 직권으로 그 부동산에 관한 신탁원부 기록의 변경등기를 하여야 한다.\nㄹ. 수익자가 수탁자를 대위하여 신탁등기를 신청하는 경우에는 해당 부동산에 관한 권리의 설정등기의 신청과 동시에 하여야 한다.\n① ㄱ, ㄴ ② ㄴ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄱ, ㄷ, ㄹ","2","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",4,0],[32,2021,22,25,5,"취득세","취득세","틀린것 고르기","지방세법상 취득세에 관한 설명으로 틀린 것은?\n① ｢도시 및 주거환경정비법｣에 따른 재건축조합이 재건축사업을 하면서 조합원으로부터 취득하는 토지 중 조합원에게 귀속되지 아니하는 토지를 취득하는 경우에는 같은 법에 따른 소유권이전 고시일의 다음 날에 그 토지를 취득한 것으로 본다. 2021년 제32회 공인중개\n② 취득세 과세물건을 취득한 후에 그 과세물건이 중과세율의 적용대상이 되었을 때에는 취득한 날부터 60일 이내에 중 과세율을 적용하여 산출한 세액에서 이미 납부한 세액(가산세 포함)을 공제한 금액을 신고하고 납부하여야 한다.\n③ 대한민국 정부기관의 취득에 대하여 과세하는 외국정부의 취득에 대해서는 취득세를 부과한다.\n④ 상속으로 인한 취득의 경우에는 상속개시일에 취득한 것으로 본다.\n⑤ 부동산의 취득은 ｢민법｣ 등 관계 법령에 따른 등기ㆍ등록 등을 하지 아니한 경우라도 사실상 취득하면 취득한 것으로 본다.","2","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",4,0],[32,2021,22,26,5,"양도소득세","양도소득세","박스형(모두고르기), 옳은것 고르기","소득세법상 미등기양도자산(미등기양도제외자산 아님) 인 상가건물의 양도에 관한 내용으로 옳은 것을 모두고른 것은?\nㄱ. 양도소득세율은 양도소득 과세표준의 100분의 70\nㄴ. 장기보유특별공제 적용 배제\nㄷ. 필요경비개산공제 적용 배제\nㄹ. 양도소득기본공제 적용 배제\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","2","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",4,0],[32,2021,22,27,5,"취득세","취득세","옳은것 고르기","지방세법상 취득세 납세의무에 관한 설명으로 옳은 것은?\n① 토지의 지목을 사실상 변경함으로써 그 가액이 증가한 경우에는 취득으로 보지 아니한다.\n② 상속회복청구의 소에 의한 법원의 확정판결에 의하여 특정 상속인이 당초 상속분을 초과하여 취득하게 되는 재산가액은 상속분이 감소한 상속인으로부터 증여받아 취득한 것으로 본다.\n③ 권리의 이전이나 행사에 등기 또는 등록이 필요한 부동산을 직계존속과 서로 교환한 경우에는 무상으로 취득한 것으로 본다.\n④ 증여로 인한 승계취득의 경우 해당 취득물건을 등기ㆍ등록하더라도 취득일부터 60일 이내에 공증받은 공정증서에 의하여 계약이 해제된 사실이 입증되는 경우에는 취득한 것으로 보지 아니한다.\n⑤ 증여자가 배우자 또는 직계존비속이 아닌 경우 증여자의 채무를 인수하는 부담부 증여의 경우에는 그 채무액에 상당하는 부분은 부동산등을 유상으로 취득하는 것으로 본다.","5","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",4,0],[32,2021,22,28,5,"재산세","재산세","","지방세법상 다음에 적용되는 재산세의 표준세율이가장 높은 것은?(단, 재산세 도시지역분은 제외하고, 지방세관계법에 의한 특례는 고려하지 않음)\n① 과세표준이 5천만원인 종합합산과세대상 토지\n② 과세표준이 2억원인 별도합산과세대상 토지\n③ 과세표준이 1억원인 광역시의 군지역에서 ｢농지법｣에 따른 농업법인이 소유하는 농지로서 과세기준일 현재 실제 영농에 사용되고 있는 농지\n④ 과세표준이 5억원인 ｢수도권정비계획법｣에 따른 과밀억 제권역 외의 읍ㆍ면 지역의 공장용 건축물\n⑤ 과세표준이 1억 5천만원인 주택(별장 제외. 1세대 1주택에 해당되지 않음) 개","4","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",4,0],[32,2021,22,29,5,"재산세","재산세","틀린것 고르기","지방세법상 재산세에 관한 설명으로 틀린 것은?(단, 주어진 조건 외에는 고려하지 않음)\n① 토지에 대한 재산세의 과세표준은 시가표준액에 공정시장가액비율(100분의 70)을 곱하여 산정한 가액으로 한다.\n② 지방자치단체가 1년 이상 공용으로 사용하는 재산으로서 유료로 사용하는 경우에는 재산세를 부과한다.\n③ 재산세 물납신청을 받은 시장ㆍ군수ㆍ구청장이 물납을 허가하는 경우 물납을 허가하는 부동산의 가액은 물납 허가일 현재의 시가로 한다.\n④ 주택의 토지와 건물 소유자가 다를 경우 해당 주택에 대한 세율을 적용할 때 해당 주택의 토지와 건물의 가액을 합산한 과세표준에 주택의 세율을 적용한다.\n⑤ 주택공시가격이 6억원인 주택에 대한 재산세의 산출세액이 직전 연도의 해당 주택에 대한 재산세액 상당액의 100분의 110을 초과하는 경우에는 100분의 110에 해당하는 금액을 해당 연도에 징수할 세액으로 한다.","3","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",5,0],[32,2021,22,30,5,"조세총론","조세총론(납세의무·부과·징수)","박스형(모두고르기), 옳은것 고르기, 계산","지방세법상 시가표준액에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 토지의 시가표준액은 세목별 납세의무의 성립시기 당시 ｢부동산 가격공시에 관한 법률｣에 따른 개별공시지가가 공시된 경우 개별공시지가로 한다.\nㄴ. 건축물의 시가표준액은 소득세법령에 따라 매년 1회 국세청장이 산정, 고시하는 건물신축가격기 준액에 행정안전부장관이 정한 기준을 적용하여 국토교통부장관이 결정한 가액으로 한다.\nㄷ. 공동주택의 시가표준액은 공동주택가격이 공시되지 아니한 경우에는 지역별․단지별․면적별․층별 특성 및 거래가격을 고려하여 행정안전부장관이 정하는 기준에 따라 국토교통부장관이 산정한 가액으로 한다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","1","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",5,0],[32,2021,22,31,5,"등록면허세","등록면허세","옳은것 고르기, 계산","거주자인 개인 乙은 甲이 소유한 부동산(시가 6억원) 에 전세기간 2년, 전세보증금 3억원으로 하는 전세계 약을 체결하고, 전세권 설정등기를 하였다. 지방세법상 등록면허세에 관한 설명으로 옳은 것은?\n① 과세표준은 6억원이다.\n② 표준세율은 전세보증금의 1천분의 8이다.\n③ 납부세액은 6천원이다.\n④ 납세의무자는 乙이다.\n⑤ 납세지는 甲의 주소지이다.","4","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",5,0],[32,2021,22,32,5,"양도소득세","양도소득세","틀린것 고르기","거주자인 개인 甲이 乙로부터 부동산을 취득하여 보유하고 있다가 丙에게 양도하였다. 甲의 부동산 관련 조세의 납세의무에 관한 설명으로 틀린 것은?(단, 주어진 조건 외에는 고려하지 않음)\n① 甲이 乙로부터 증여받은 것이라면 그 계약일에 취득세 납세의무가 성립한다. 2021년 제32회 공인중개\n② 甲이 乙로부터 부동산을 취득 후 재산세 과세기준일까 지 등기하지 않았다면 재산세와 관련하여 乙은 부동산 소재지 관할 지방자치단체의 장에게 소유권변동사실을 신고할 의무가 있다.\n③ 甲이 종합부동산세를 신고납부방식으로 납부하고자 하는 경우 과세표준과 세액을 해당 연도 12월 1일부터 12 월 15일까지 관할 세무서장에게 신고하는 때에 종합부동산세 납세의무는 확정된다.\n④ 甲이 乙로부터 부동산을 40만원에 취득한 경우 등록면허세 납세의무가 있다.\n⑤ 양도소득세의 예정신고만으로 甲의 양도소득세 납세의무가 확정되지 아니한다.","5","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",5,0],[32,2021,22,33,5,"종합부동산세","종합부동산세","틀린것 고르기","거주자인 개인 甲은 국내에 주택 2채(다가구주택 아님) 및 상가건물 1채를 각각 보유하고 있다. 甲의 2021년 귀속 재산세 및 종합부동산세에 관한 설명으로 틀린 것은?(단, 甲의 주택은 종합부동산세법상 합산배제주택에 해당하지 아니하며, 지방세관계법상 재산세 특례 및 감면은 없음)\n① 甲의 주택에 대한 재산세는 주택별로 표준세율을 적용한다.\n② 甲의 상가건물에 대한 재산세는 시가표준액에 법령이 정하는 공정시장가액비율을 곱하여 산정한 가액을 과세표준으로 하여 비례세율로 과세한다.\n③ 甲의 주택분 종합부동산세액의 결정세액은 주택분 종합부동산세액에서 ‘(주택의 공시가격 합산액 - 6억원) × 종합부동산세 공정시장가액비율 × 재산세 표준세율’의 산식에 따라 산정한 재산세액을 공제하여 계산한다.\n④ 甲의 상가건물에 대해서는 종합부동산세를 과세하지 아니한다.\n⑤ 甲의 주택에 대한 종합부동산세는 甲이 보유한 주택의 공시가격을 합산한 금액에서 6억원을 공제한 금액에 공정시장가액비율(100분의 95)을 곱한 금액(영보다 작은 경우는 영)을 과세표준으로 하여 누진세율로 과세한다.","3","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",5,0],[32,2021,22,34,5,"종합부동산세","종합부동산세","옳은것 고르기","종합부동산세법상 1세대 1주택자에 관한 설명으로 옳은 것은?\n① 과세기준일 현재 세대원 중 1인과 그 배우자만이 공동으로 1주택을 소유하고 해당 세대원 및 다른 세대원이 다른 주택을 소유하지 아니한 경우 신청하지 않더라도 공동명의 1주택자를 해당 1주택에 대한 납세의무자로 한다.\n② 합산배제 신고한 ｢문화재보호법｣에 따른 국가등록문화재에 해당하는 주택은 1세대가 소유한 주택 수에서 제외한다.\n③ 1세대가 일반 주택과 합산배제 신고한 임대주택을 각각 1채씩 소유한 경우 해당 일반 주택에 그 주택소유자가 실제 거주하지 않더라도 1세대 1주택자에 해당한다.\n④ 1세대 1주택자는 주택의 공시가격을 합산한 금액에서 6 억원을 공제한 금액에서 다시 3억원을 공제한 금액에 공정시장가액비율을 곱한 금액을 과세표준으로 한다.\n⑤ 1세대 1주택자에 대하여는 주택분 종합부동산세 산출세액에서 소유자의 연령과 주택 보유기간에 따른 공제액을 공제율 합계 100분의 70의 범위에서 중복하여 공제한다. 개","2","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",5,0],[32,2021,22,35,5,"종합부동산세","종합부동산세","옳은것 고르기","2021년 귀속 토지분 종합부동산세에 관한 설명으로 옳은 것은?(단, 감면과 비과세와 지방세특례제한법 또는 조세특례제한법은 고려하지 않음)\n① 재산세 과세대상 중 분리과세대상 토지는 종합부동산세 과세대상이다.\n② 종합부동산세의 분납은 허용되지 않는다.\n③ 종합부동산세의 물납은 허용되지 않는다.\n④ 납세자에게 부정행위가 없으며 특례제척기간에 해당하지 않는 경우 원칙적으로 납세의무 성립일부터 3년이 지나면 종합부동산세를 부과할 수 없다.\n⑤ 별도합산과세대상인 토지의 재산세로 부과된 세액이 세부담 상한을 적용받는 경우 그 상한을 적용받기 전의 세액을 별도합산과세대상 토지분 종합부동산세액에서 공제한다.","3","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",6,0],[32,2021,22,36,5,"양도소득세","양도소득세","계산","다음은 거주자 甲의 상가건물 양도소득세 관련 자료이다. 이 경우 양도차익은?(단, 양도차익을 최소화하는 방향으로 필요경비를 선택하고, 부가가치세는 고려하지 않음)\n(1) 취득 및 양도 내역 실지거래가액 기준시가 거래일자 양도당시 5억원 4억원 2021. 4. 30. 취득당시 확인 불가능 2억원 2020. 3. 7.\n(2) 자본적지출액 및 소개비: 2억 6천만원(세금계산서 수취함)\n(3) 주어진 자료 외에는 고려하지 않는다.\n① 2억원 ② 2억 4천만원\n③ 2억 4천4백만원 ④ 2억 5천만원\n⑤ 2억 6천만원","2","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",6,0],[32,2021,22,37,5,"양도소득세","양도소득세","틀린것 고르기","소득세법상 양도소득세 과세대상 자산의 양도 또는 취득의 시기로 틀린 것은?\n① ｢도시개발법｣에 따라 교부받은 토지의 면적이 환지처분에 의한 권리면적보다 증가 또는 감소된 경우: 환지처분의 공고가 있은 날\n② 기획재정부령이 정하는 장기할부조건의 경우: 소유권이전등기(등록 및 명의개서를 포함) 접수일ㆍ인도일 또는 사용수익일 중 빠른 날\n③ 건축허가를 받지 않고 자기가 건설한 건축물의 경우:\n그 사실상의 사용일\n④ ｢민법｣ 제245조 제1항의 규정에 의하여 부동산의 소유권을 취득하는 경우: 당해 부동산의 점유를 개시한 날\n⑤ 대금을 청산한 날이 분명하지 아니한 경우: 등기부ㆍ등록부 또는 명부 등에 기재된 등기ㆍ등록접수일 또는 명의개서일","1","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",6,0],[32,2021,22,38,5,"양도소득세","양도소득세","틀린것 고르기","거주자 甲은 2015년에 국외에 1채의 주택을 미화 1십만 달러(취득자금 중 일부 외화 차입)에 취득하였고, 2021년에 동 주택을 미화 2십만 달러에 양도하였다. 이 경우 소득세법상 설명으로 틀린 것은?(단, 甲은 해당 자산의 양도일까지 계속 5년 이상 국내에 주소를 둠)\n① 甲의 국외주택에 대한 양도차익은 양도가액에서 취득가 액과 필요경비개산공제를 차감하여 계산한다. 2021년 제32회 공인중개\n② 甲의 국외주택 양도로 발생하는 소득이 환율변동으로 인하여 외화차입금으로부터 발생하는 환차익을 포함하고 있는 경우에는 해당 환차익을 양도소득의 범위에서 제외한다.\n③ 甲의 국외주택 양도에 대해서는 해당 과세기간의 양도소득금액에서 연 250만원을 공제한다.\n④ 甲은 국외주택을 3년 이상 보유하였음에도 불구하고 장기보유특별공제액은 공제하지 아니한다.\n⑤ 甲은 국외주택의 양도에 대하여 양도소득세의 납세의무가 있다.","1","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",6,0],[32,2021,22,39,5,"양도소득세","양도소득세","박스형(모두고르기)","소득세법상 미등기양도제외자산을 모두 고른 것은?\nㄱ. 양도소득세 비과세요건을 충족한 1세대 1주택으로서 ｢건축법｣에 따른 건축허가를 받지 아니하여 등기가 불가능한 자산\nㄴ. 법원의 결정에 의하여 양도 당시 그 자산의 취득에 관한 등기가 불가능한 자산\nㄷ. ｢도시개발법｣에 따른 도시개발사업이 종료되지 아니하여 토지 취득등기를 하지 아니하고 양도하는 토지\n① ㄱ ② ㄴ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","5","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",6,0],[32,2021,22,40,5,"양도소득세","양도소득세","옳은것 고르기","소득세법상 배우자 간 증여재산의 이월과세에 관한 설명으로 옳은 것은?\n① 이월과세를 적용하는 경우 거주자가 배우자로부터 증여받은 자산에 대하여 납부한 증여세를 필요경비에 산입하지 아니한다.\n② 이월과세를 적용받은 자산의 보유기간은 증여한 배우자가 그 자산을 증여한 날을 취득일로 본다.\n③ 거주자가 양도일부터 소급하여 5년 이내에 그 배우자(양도 당시 사망으로 혼인관계가 소멸된 경우 포함)로부터 증여받은 토지를 양도할 경우에 이월과세를 적용한다.\n④ 거주자가 사업인정고시일부터 소급하여 2년 이전에 배우자로부터 증여받은 경우로서 ｢공익사업을 위한 토지등의 취득 및 보상에 관한 법률｣에 따라 수용된 경우에는 이월과세를 적용하지 아니한다.\n⑤ 이월과세를 적용하여 계산한 양도소득결정세액이 이월과세를 적용하지 않고 계산한 양도소득결정세액보다 적은 경우에 이월과세를 적용한다. 개","4","1FVh7UmJZhhraYBxfOeq1zZJfM2N10yXC",6,0],[33,2022,11,1,0,"부동산의 개념·특성","부동산 개념·특성·분류","틀린것 고르기","토지의 정착물에 해당하지 않는 것은?\n① 구거 ② 다년생 식물 ③ 가식중인 수목\n④ 교량 ⑤ 담장","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",1,0],[33,2022,11,2,0,"부동산의 개념·특성","부동산 개념·특성·분류","옳은것 고르기","부동산의 특성에 관한 설명으로 옳은 것은?\n① 토지는 물리적 위치가 고정되어 있어 부동산시장이 국 지화 된다.\n② 토지는 생산요소와 자본의 성격을 가지고 있지만, 소비 재의 성격은 가지고 있지 않다.\n③ 토지는 개별성으로 인해 용도적 관점에서도 공급을 늘릴 수 없다.\n④ 토지의 부증성으로 인해 토지공급은 특정 용도의 토지에 대해서도 장ㆍ단기적으로 완전비탄력적이다.\n⑤ 토지는 영속성으로 인해 물리적ㆍ경제적인 측면에서 감가상각을 하게 한다.","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",1,0],[33,2022,11,3,0,"부동산의 개념·특성","부동산 개념·특성·분류","틀린것 고르기","토지는 사용하는 상황이나 관계에 따라 다양하게 불리는 바, 토지 관련 용어의 설명으로 틀린 것은?\n① 도시개발사업에 소요된 비용과 공공용지를 제외한 후 도시개발사업 전 토지의 위치ㆍ지목ㆍ면적 등을 고려하여 토지소유자에게 재분배하는 토지를 환지(換地)라 한다.\n② 토지와 도로 등 경계사이의 경사진 부분의 토지를 법지\n(法地)라 한다.\n③ 고압송전선로 아래의 토지를 선하지(線下地)라 한다.\n④ 소유권이 인정되지 않는 바다와 육지 사이의 해변 토지를 포락지(浦落地)라 한다.\n⑤ 도시개발사업에 필요한 경비에 충당하기 위해 환지로 정하지 아니한 토지를 체비지(替費地)라 한다.","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",1,0],[33,2022,11,4,0,"경제론","수요·공급 결정요인·균형","박스형(모두고르기)","신규주택시장에서 공급을 감소시키는 요인을 모두고른 것은?(단, 신규주택은 정상재이며, 다른 조건은 동일함)\nㄱ. 주택가격의 하락 기대\nㄴ. 주택건설업체 수의 감소\nㄷ. 주택건설용 토지의 가격 하락\nㄹ. 주택건설에 대한 정부 보조금 축소\nㅁ. 주택건설기술 개발에 따른 원가절감\n① ㄱ, ㄴ ② ㄴ, ㄹ ③ ㄷ, ㅁ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄴ, ㄹ, ㅁ 2022년 제33회 공인중개","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",1,0],[33,2022,11,5,0,"경제론","탄력성","계산","오피스텔 시장에서 수요의 가격탄력성은 0.5이고, 오피스텔의 대체재인 아파트 가격에 대한 오피스텔 수요의 교차탄력성은 0.3이다. 오피스텔 가격, 오피스텔 수요자의 소득, 아파트 가격이 각각 5%씩 상승함에 따른 오피스텔 전체 수요량의 변화율이 1%라고 하면, 오피스텔 수요의 소득탄력성은?(단, 오피스텔과 아파트 모두 정상재이고, 수요의 가격탄력성은 절댓값으로 나타내며, 다른 조건은 동일함)\n① 0.2 ② 0.4 ③ 0.6 ④ 0.8 ⑤ 1.0","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",1,0],[33,2022,11,6,0,"경제론","수요·공급 결정요인·균형","옳은것 고르기","A지역 단독주택 시장의 균형가격과 균형거래량의 변화에 관한 설명으로 옳은 것은?(단, 수요곡선은 우하향하고 공급곡선은 우상향하며, 다른 조건은 동일함)\n① 수요가 불변이고 공급이 감소하는 경우, 균형가격은 하락하고 균형거래량은 감소한다.\n② 공급이 불변이고 수요가 증가하는 경우, 균형가격은 상승하고 균형거래량은 감소한다.\n③ 수요와 공급이 동시에 증가하고 공급의 증가폭이 수요의 증가폭보다 더 큰 경우, 균형가격은 상승하고 균형거래량은 증가한다.\n④ 수요와 공급이 동시에 감소하고 수요의 감소폭이 공급의 감소폭보다 더 큰 경우, 균형가격은 하락하고 균형거래량은 감소한다.\n⑤ 수요는 증가하고 공급이 감소하는데 수요의 증가폭이 공급의 감소폭보다 더 큰 경우, 균형가격은 상승하고 균형거래량은 감소한다.","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",1,0],[33,2022,11,7,0,"부동산의 개념·특성","부동산 개념·특성·분류","옳은것 고르기","부동산경기변동에 관한 설명으로 옳은 것은?\n① 상향시장 국면에서는 부동산가격이 지속적으로 하락하고 거래량은 감소한다.\n② 후퇴시장 국면에서는 경기상승이 지속적으로 진행되어 경기의 정점에 도달한다.\n③ 하향시장 국면에서는 건축허가신청이 지속적으로 증가한다.\n④ 회복시장 국면에서는 매
