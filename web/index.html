 발표 후 추가","16y7rV494NY5-lTbsuBylbf6n6maI34Cc",6,0],[37,2026,11,41,1,"민법총칙","무효·취소·추인","틀린것 고르기","부동산학의 연구대상 및 연구분야에 관한 설명으로 옳은 것은?\n① 부동산학의 연구대상은 부동산활동과 부동산현상이다.\n② 부동산활동의 주체는 공적 주체에 한정된다.\n③ 부동산현상은 부동산활동을 통해 나타나는 기술적·경제적·법률적 제 측면의 현상을 의미한다.\n④ 부동산학의 연구분야 중 결정분야에는 투자, 금융, 개발, 관리, 마케팅 등이 포함된다.\n⑤ 부동산학의 연구분야 중 결정지원분야에는 감정평가, 컨설팅, 중개 등이 포함된다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",7,0],[37,2026,11,42,1,"민법총칙","무효·취소·추인","판례, 틀린것 고르기","부동산의 개념에 관한 설명으로 옳은 것은?\n① 기술적 개념의 부동산은 생산요소, 자산, 공간, 자연 등을 의미한다.\n② 경제적 개념의 부동산은 물리적 단위로서의 토지나 건물을 의미한다.\n③ 법률적 개념의 부동산은 협의의 부동산과 광의의 부동산으로 구분된다.\n④ 민법상 부동산은 토지 및 그 정착물을 말하며, 토지와 독립된 정착물로는 건물, 명인방법을 갖춘 수목 등이 있다.\n⑤ 준부동산은 등기·등록의 공시방법을 갖춤으로써 부동산에 준하여 취급되는 동산 등을 말하며, 공장재단, 선박, 자동차 등이 이에 해당한다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",7,0],[37,2026,11,43,1,"민법총칙","무효·취소·추인","틀린것 고르기","토지의 용어에 관한 설명으로 옳은 것은?\n① 택지지역 내에서 주거지역이 상업지역으로 변경되고 있는 토지를 이행지라 한다.\n② 후보지는 택지지역, 농지지역, 임지지역 상호 간에 다른 지역으로 전환되고 있는 지역의 토지를 말한다.\n③ 필지는 하나의 지번이 붙는 토지의 등록단위이며, 획지는 인위적·자연적·행정적 조건에 의해 다른 토지와 구별되는 가격수준이 비슷한 일단의 토지를 말한다.\n④ 나지는 토지에 건물 기타의 정착물이 없고, 지상권 등 토지의 사용·수익을 제한하는 사법상의 권리가 설정되어 있지 아니한 토지를 말한다.\n⑤ 맹지는 타인의 토지에 둘러싸여 도로와 접하고 있지 않은 토지로, 건축법상 건축이 가능한 토지이다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",7,0],[37,2026,11,44,1,"민법총칙","의사표시(착오·사기·통정허위)","","부동산의 특성에 관한 설명으로 옳은 것은?\n① 토지의 부증성은 토지의 물리적 공급을 불가능하게 하며, 토지의 용도적 공급도 불가능하게 한다.\n② 토지의 영속성은 소모를 전제로 하는 재생산이론이나 감가상각이론을 토지에 적용할 수 있게 한다.\n③ 토지의 개별성은 일물일가의 법칙이 적용되지 않게 하며, 부동산활동과 현상을 개별화시킨다.\n④ 토지의 인접성은 토지이용에 있어 협동적 논리를 배제하며, 외부효과를 발생시키지 않는다.\n⑤ 토지의 용도의 다양성은 토지의 최유효이용을 어렵게 하는 요인이 된다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",7,0],[37,2026,11,45,1,"민법총칙","의사표시(착오·사기·통정허위)","판례","부동산 수요와 공급에 관한 설명으로 옳은 것은?\n① 부동산 수요는 일정 기간 동안 부동산을 구매하고자 하는 욕구이며, 유량(flow) 개념이다.\n② 부동산 공급곡선은 우상향하는 형태를 가지며, 가격이 상승하면 공급량은 감소한다.\n③ 부동산 수요곡선이 우측으로 이동하는 요인에는 부동산 가격의 하락이 있다.\n④ 부동산 공급곡선이 좌측으로 이동하는 요인에는 생산요소 가격의 하락이 있다.\n⑤ 부동산 수요의 가격탄력성이 완전탄력적이면 가격이 변해도 수요량은 변하지 않는다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",7,0],[37,2026,11,46,1,"민법총칙","대리(무권대리·표현대리)","박스형(모두고르기), 판례, 옳은것 고르기","부동산 수요의 가격탄력성에 관한 설명으로 옳은 것은?\n① 수요의 가격탄력성이 1보다 크면 수요량의 변화율이 가격의 변화율보다 작다.\n② 수요의 가격탄력성이 0이면 수요곡선은 수직선이 된다.\n③ 수요의 가격탄력성이 무한대이면 수요곡선은 수평선이 된다.\n④ 대체재가 많을수록 수요의 가격탄력성은 작아진다.\n⑤ 주거용 부동산보다 상업용 부동산의 수요의 가격탄력성이 더 크다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",7,0],[37,2026,11,47,1,"민법총칙","법률행위(반사회·불공정)","틀린것 고르기","부동산 경기변동에 관한 설명으로 옳은 것은?\n① 부동산 경기변동은 일반 경기변동과 동일한 주기와 진폭을 가진다.\n② 부동산 경기는 일반 경기보다 후행하는 경향이 있다.\n③ 부동산 경기는 부문별로 다르게 나타날 수 있으며, 지역별로도 다르게 나타날 수 있다.\n④ 부동산 경기는 회복기, 호황기, 후퇴기, 불황기의 4국면으로 구분되며, 상향국면은 회복기와 호황기를 포함한다.\n⑤ 부동산 경기는 일반 경기보다 진폭이 작고 주기가 짧다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",7,0],[37,2026,11,48,1,"민법총칙","대리(무권대리·표현대리)","판례, 틀린것 고르기","부동산 시장의 특성에 관한 설명으로 옳은 것은?\n① 부동산 시장은 완전경쟁시장이다.\n② 부동산 시장은 정보의 비대칭성이 존재하며, 정보의 효율성이 낮다.\n③ 부동산 시장은 거래의 비공개성으로 인해 가격의 왜곡이 발생하지 않는다.\n④ 부동산 시장은 국지적 시장이므로 지역 간 가격 차이가 발생하지 않는다.\n⑤ 부동산 시장은 공급의 조절이 용이하여 단기적으로 가격이 안정적이다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",7,0],[37,2026,11,49,1,"민법총칙","무효·취소·추인","박스형(모두고르기), 판례","부동산투자회사법령상 부동산투자회사에 관한 설명으로 옳은 것은?\n① 자기관리 부동산투자회사의 설립자본금은 10억 원 이상이다.\n② 위탁관리 부동산투자회사는 본점 외의 지점을 설치할 수 없으며, 직원을 고용하거나 상근 임원을 둘 수 없다.\n③ 기업구조조정 부동산투자회사는 영업인가를 받은 날부터 6개월이 지난 후에는 최저자본금 이상을 갖추어야 한다.\n④ 부동산투자회사는 영업인가를 받거나 등록을 한 날부터 6개월이 지난 후에는 발행하는 주식총수의 100분의 30 이상을 일반의 청약에 제공하여야 한다.\n⑤ 부동산투자회사가 부동산을 취득한 후 5년 이내에 처분하는 경우에는 개발사업을 수행하는 경우를 제외하고는 처분제한을 받지 않는다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",8,0],[37,2026,11,50,1,"민법총칙","법률행위(반사회·불공정)","판례, 옳은것 고르기","부동산개발업의 관리 및 육성에 관한 법령상 부동산개발업의 등록 등에 관한 설명으로 옳은 것은?\n① 타인에게 의뢰하여 부동산개발을 하는 경우에는 등록하지 않아도 된다.\n② 부동산개발업을 등록하려는 자는 국토교통부장관에게 등록하여야 한다.\n③ 부동산개발업자는 등록사항 중 국토교통부령으로 정하는 경미한 사항을 변경하려는 경우에는 변경신고를 하지 않아도 된다.\n④ 부동산개발업자는 영업정지 처분을 받은 경우 그 사실을 해당 부동산개발사업장에 게시하여야 한다.\n⑤ 부동산개발업자는 등록증을 다른 사람에게 대여할 수 있다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",8,0],[37,2026,11,51,1,"물권법","저당권·근저당권","판례","주택법령상 주택의 공급에 관한 설명으로 옳은 것은?\n① 사업주체가 일반인에게 공급하는 주택 중 투기과열지구에서 건설·공급하는 주택의 입주자로 선정된 지위는 양도할 수 없다.\n② 사업주체가 주택건설사업계획승인을 받아 건설한 주택을 공급하는 경우에는 입주자모집공고안에 대하여 시장·군수·구청장의 승인을 받아야 한다.\n③ 사업주체가 주택을 공급하려는 경우에는 주택건설대지의 소유권을 확보하여야 하나, 사용검사 후 매도청구 대상이 되는 대지의 소유권은 확보하지 않아도 된다.\n④ 주택조합이 조합원에게 주택을 공급하는 경우에는 입주자모집공고를 하고 공개모집의 방법으로 하여야 한다.\n⑤ 사업주체는 주택을 공급하는 경우 주택의 분양가격 제한을 받지 않는다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",8,0],[37,2026,11,52,1,"물권법","물권변동·등기","판례, 틀린것 고르기","부동산 거래신고 등에 관한 법령상 외국인등의 부동산 취득 등에 관한 설명으로 옳은 것은?\n① 외국인등이 건축물의 개축으로 부동산을 취득하는 경우에는 부동산 취득 신고를 하여야 한다.\n② 외국인등이 상속으로 부동산을 취득한 경우, 취득한 날부터 3개월 이내에 신고관청에 신고하여야 한다.\n③ 외국인등이 대한민국 안의 부동산을 취득하는 계약을 체결한 경우, 계약을 체결한 날부터 30일 이내에 신고관청에 신고하여야 한다.\n④ 외국인등이 군사기지 및 군사시설 보호구역 안의 토지를 취득하려는 경우, 계약 체결 전에 신고관청으로부터 토지취득 허가를 받아야 한다.\n⑤ 신고관청은 외국인등의 토지 취득 허가 신청을 받은 경우, 신청서를 받은 날부터 30일 이내에 허가 또는 불허가 처분을 하여야 한다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",8,0],[37,2026,11,53,1,"물권법","점유권","판례","부동산 거래신고 등에 관한 법령상 부동산 거래신고에 관한 설명으로 옳은 것은?\n① 거래당사자 중 일방이 국가인 경우, 국가가 단독으로 신고하여야 한다.\n② 부동산 거래계약 해제등이 확정된 날부터 30일 이내에 공동으로 신고하여야 한다.\n③ 개업공인중개사가 거래계약서를 작성·교부한 경우, 거래당사자가 공동으로 신고하여야 한다.\n④ 부동산 거래신고를 받은 신고관청은 그 내용을 확인한 후 신고인에게 신고필증을 발급하여야 한다.\n⑤ 부동산 거래신고를 하지 아니한 자에 대하여는 과태료를 부과하지 않는다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",8,0],[37,2026,11,54,1,"물권법","유치권","틀린것 고르기","부동산 실권리자명의 등기에 관한 법률에 관한 설명으로 옳은 것은?\n① 명의신탁약정은 무효로 한다.\n② 명의신탁약정에 따라 행하여진 등기에 의한 부동산에 관한 물권변동은 효력이 있다.\n③ 명의신탁자는 명의수탁자에게 명의신탁약정의 해지를 원인으로 소유권이전등기를 청구할 수 있다.\n④ 종중이 보유한 부동산에 관한 물권을 종중 외의 자의 명의로 등기하는 것은 언제나 허용된다.\n⑤ 배우자 명의로 부동산에 관한 물권을 등기하는 경우, 조세 포탈의 목적이 없더라도 명의신탁약정은 무효이다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",8,0],[37,2026,11,55,1,"물권법","전세권","판례","점유에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 점유자의 점유권에 기한 반환청구권은 침탈된 날로부터 1년 내에 행사하여야 한다.\n\n② 점유권에 기한 본소(本訴)가 제기된 경우, 피고는 본권에 기한 반소(反訴)를 제기할 수 있다.\n\n③ 건물 소유자가 아닌 자가 건물의 부지를 점유하는 경우, 그 점유는 특별한 사정이 없는 한 타주점유이다.\n\n④ 점유자의 점유가 자주점유인지 여부는 점유자 내심의 의사에 의하여 결정되는 것이 아니다.\n\n⑤ 점유자의 점유권에 기한 소가 제기되어 점유자가 패소한 경우, 그 소가 제기된 때부터 악의의 점유자로 본다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",9,0],[37,2026,11,56,1,"물권법","전세권","판례","점유자와 회복자의 관계에 관한 설명으로 틀린 것은?\n\n① 선의의 점유자는 점유물의 과실을 취득한다.\n\n② 악의의 점유자는 과실(過失) 없이 과실(果實)을 수취하지 못한 때에도 그 과실(果實)의 대가를 보상하여야 한다.\n\n③ 악의의 점유자는 점유물의 멸실ㆍ훼손에 대하여 손해배상책임을 진다.\n\n④ 선의의 점유자라도 타주점유자는 점유물의 멸실ㆍ훼손에 대하여 손해의 전부를 배상하여야 한다.\n\n⑤ 점유자가 유익비를 지출한 경우, 점유물의 가액 증가가 현존한 때에 한하여 회복자의 선택에 따라 그 지출금액이나 증가액의 상환을 청구할 수 있다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",9,0],[37,2026,11,57,1,"물권법","지역권","판례","민법상 상린관계에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 인접지 소유자 사이의 상린관계에 따른 경계확정청구권은 소유권에 기한 권리이다.\n\n② 경계표나 담의 설치비용은 특별한 사정이 없는 한 인접지 소유자가 쌍방 절반하여 부담한다.\n\n③ 토지 소유자는 건물의 건축이나 수리를 위하여 필요한 범위 내에서 인접지의 사용을 청구할 수 있으나, 그 거주자의 승낙이 없으면 주거에 들어가지 못한다.\n\n④ 주위토지통행권자는 통행지 소유자에게 통행권 행사로 인한 손해를 보상하여야 함이 원칙이다.\n\n⑤ 주위토지통행권자가 통행지를 통행하고 있더라도, 그 통행으로 인한 손해의 보상의무를 이행하지 않은 경우 통행권 자체가 소멸한다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",9,0],[37,2026,11,58,1,"물권법","점유권","판례","민법상 소유권의 취득에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 부동산 점유취득시효의 경우, 취득시효 완성 당시의 소유자에게 시효완성을 원인으로 하는 소유권이전등기청구권을 취득한다.\n\n② 부동산 소유권의 점유취득시효 완성 후 취득시효 완성을 원인으로 하는 소유권이전등기청구권은 시효완성자가 점유를 상실하면 즉시 시효로 소멸한다.\n\n③ 부동산 소유권의 등기부취득시효를 완성한 자는 소유권을 취득한다.\n\n④ 부동산 소유권의 등기부취득시효 완성을 원인으로 하는 소유권이전등기가 무효인 경우, 점유자는 등기부취득시효의 완성을 주장할 수 없다.\n\n⑤ 타인 소유의 토지에 무단으로 농작물을 경작한 경우, 특별한 사정이 없는 한 그 농작물의 소유권은 경작자에게 귀속된다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",9,0],[37,2026,11,59,1,"계약법","해제·해지","판례, 틀린것 고르기","부합에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 건물은 토지에 부합하지 않는다.\nㄴ. 타인의 권원에 의하여 그 타인의 토지에 경작한 농작물은 토지에 부합하지 않는다.\nㄷ. 건물 임차인이 권원에 기하여 증축한 부분이 기존 건물과 구조상ㆍ이용상 독립성이 없는 경우, 그 증축부분은 기존 건물에 부합한다.\nㄹ. 토지 임차인의 동의만을 얻어 임차토지에 나무를 심은 자는 토지 소유자에 대하여 그 나무의 소유권을 주장할 수 없다.\n\n① ㄱ, ㄴ\n\n② ㄱ, ㄹ\n\n③ ㄴ, ㄷ\n\n④ ㄱ, ㄴ, ㄷ\n\n⑤ ㄱ, ㄴ, ㄷ, ㄹ","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",9,0],[37,2026,11,60,1,"민사특별법","집합건물법","박스형(모두고르기), 판례","공유에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)\n\n① 공유물분할금지의 약정은 갱신할 수 없다.\n\n② 구분소유적 공유관계에 있는 자가 자신 소유의 건물이 서 있는 토지구획만을 타인에게 양도한 경우, 관습상의 법정지상권이 성립한다.\n\n③ 공유자 중 1인의 지분 위에 설정된 저당권은 공유물분할로 인하여 설정자에게 분할된 부분에 집중된다.\n\n④ 공유자 중 1인이 단독으로 공유토지를 임대한 경우, 다른 공유자는 그 임차인에게 부당이득반환을 청구할 수 있다.\n\n⑤ 공유토지의 과반수 지분권자가 그 토지상에 건물을 신축하는 것은 공유물의 관리행위로서 허용된다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",9,0],[37,2026,11,67,1,"계약법","동시이행·위험부담","박스형(모두고르기), 판례, 옳은것 고르기","부동산경매에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 매각허가결정에 대하여 항고를 하고자 하는 사람은 보증으로 매각대금의 10분의 1에 해당하는 금전 또는 유가증권을 공탁하여야 한다.\n\n② 매수인은 매각대금을 다 낸 때에 매각의 목적인 권리를 취득한다.\n\n③ 매각부동산 위의 권리 중 저당권ㆍ압류채권ㆍ가압류채권은 매각으로 소멸된다.\n\n④ 매수인은 매각조건에 다른 합의가 없으면 매각부동산 위의 유치권자에게 그 유치권으로 담보하는 채권을 변제할 책임이 있다.\n\n⑤ 매각허가결정이 확정되면 법원은 매수인이 매각대금을 지급하여야 하는 기한을 정하고, 이를 매수인과 이해관계인에게 통지하여야 한다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",11,0],[37,2026,11,68,1,"계약법","동시이행·위험부담","박스형(모두고르기), 판례, 틀린것 고르기","공인중개사법령상 중개보수 및 실비에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 개업공인중개사가 중개대상물의 권리관계 등의 확인에 소요되는 실비를 받는 경우, 영수증은 공인중개사법령상 작성ㆍ교부의무가 있는 서식이 아니다.\n\n② 개업공인중개사가 주택인 중개대상물에 대하여 중개완성 전 권리관계 등의 확인에 소요되는 실비를 실비의 부담자에게 요구하는 경우, 소유권을 이전하고자 하는 중개의뢰인에게 요구할 수 있다.\n\n③ 개업공인중개사가 주택 임대차계약의 중개를 완성한 경우, 중개보수의 청구권은 개업공인중개사와 중개의뢰인 간의 별도의 약정이 없는 한 중개완성 시에 발생한다.\n\n④ 개업공인중개사가 권리금 지급에 관한 합의서 작성을 대리하고 받은 금원은 공인중개사법령상 초과수수금지에 해당하지 않는다.\n\n⑤ 중개대상물인 건축물 중 주택의 면적이 2분의 1 이상인 경우, 건축물 전체에 대하여 주택의 중개보수 기준을 적용한다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",11,0],[37,2026,11,69,1,"계약법","계약 일반","틀린것 고르기","공인중개사법령상 포상금에 관한 설명으로 옳은 것은?\n\n① 신고 또는 고발의 대상이 되는 자는 중개사무소 개설등록을 하지 아니하고 중개업을 한 자를 포함한다.\n\n② 포상금 지급에 소요되는 비용 중 국고에서 보조할 수 있는 비율은 100분의 50 이내로 한다.\n\n③ 포상금은 건당 50만원으로 한다.\n\n④ 등록관청은 하나의 사건에 대하여 2건 이상의 신고 또는 고발이 접수된 경우, 최초로 신고 또는 고발한 자에게 포상금을 지급한다.\n\n⑤ 등록관청은 포상금 지급결정일부터 1개월 이내에 포상금을 지급하여야 한다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",11,0],[37,2026,11,70,1,"계약법","임대차(민법)","틀린것 고르기","공인중개사법령상 개업공인중개사의 등록취소 사유 중 상대적 등록취소 사유에 해당하지 않는 것은?\n\n① 손해배상책임을 보장하기 위한 조치를 이행하지 아니하고 업무를 개시한 경우\n\n② 최근 1년 이내에 이 법에 의하여 1회 과태료 처분을 받고 다시 업무정지 처분에 해당하는 위반행위를 한 경우\n\n③ 등록기준에 미달하게 된 경우\n\n④ 2 이상의 중개사무소를 둔 경우\n\n⑤ 전속중개계약을 체결한 개업공인중개사가 중개대상물에 관한 정보를 공개하지 아니하거나 중개의뢰인의 비공개 요청에도 불구하고 정보를 공개한 경우","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",11,0],[37,2026,11,71,1,"계약법","임대차(민법)","박스형(모두고르기), 판례, 틀린것 고르기","공인중개사법령상 자격정지 처분에 관한 설명으로 틀린 것은?\n\n① 자격정지 처분을 받고 그 자격정지기간이 지나지 아니한 자는 개업공인중개사의 소속공인중개사가 될 수 없다.\n\n② 자격정지 기간 중에는 다른 개업공인중개사의 소속공인중개사, 중개보조원 또는 개업공인중개사인 법인의 임원ㆍ사원이 될 수 없다.\n\n③ 시ㆍ도지사는 공인중개사의 자격정지 처분을 한 때에는 지체 없이 이를 다른 시ㆍ도지사에게 통지하여야 한다.\n\n④ 등록관청은 소속공인중개사가 자격정지 처분 사유에 해당하는 사실을 알게 된 때에는 지체 없이 그 사실을 시ㆍ도지사에게 통보하여야 한다.\n\n⑤ 자격정지 처분 대상자에게 청문을 실시하지 않는다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",11,0],[37,2026,11,72,1,"계약법","매매(계약금·담보책임·환매)","","공인중개사법령상 개업공인중개사의 행위 중 과태료 부과 대상이 아닌 것은?\n\n① 등록관청의 중개사무소 출입ㆍ검사 시 지도ㆍ감독상 필요한 보고를 하지 아니한 경우\n\n② 손해배상책임의 보장에 관한 사항을 설명하지 아니하거나 관계 증서의 사본 등을 교부하지 아니한 경우\n\n③ 중개사무소의 개설등록이 취소된 후 중개사무소등록증을 반납하지 아니한 경우\n\n④ 휴업기간의 변경신고를 하지 아니한 경우\n\n⑤ 공인중개사자격이 취소된 후 공인중개사자격증을 반납하지 아니한 경우","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",11,0],[37,2026,11,73,1,"민법총칙","법률행위(반사회·불공정)","박스형(모두고르기)","부동산 거래신고 등에 관한 법률상 부동산 거래신고에 관한 설명으로 옳은 것은?\n\n① 「농지법」상 농지취득자격증명을 받은 경우, 부동산 거래신고를 한 것으로 본다.\n\n② 거래당사자 중 일방이 국가등인 경우, 거래당사자는 공동으로 신고하여야 한다.\n\n③ 신고관청은 신고 사항의 누락이 있는 경우 신고인에게 보완하게 할 수 있다.\n\n④ 부동산 거래신고를 받은 신고관청은 신고내용을 확인한 후 신고인에게 신고필증을 지체 없이 발급하여야 한다.\n\n⑤ 거래당사자는 부동산 매매계약을 체결한 경우, 계약체결일부터 60일 이내에 신고관청에 공동으로 신고하여야 한다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",11,0],[37,2026,11,74,1,"계약법","매매(계약금·담보책임·환매)","박스형(모두고르기), 판례, 틀린것 고르기","개업공인중개사가 중개의뢰인에게 「부동산 거래신고 등에 관한 법률」에 따른 주택 취득자금 조달 및 입주계획서(이하 \"자금조달ㆍ입주계획서\"라 함)의 작성 등에 관한 설명으로 틀린 것은? (단, 투기과열지구 및 조정대상지역이 아님)\n\n① 자연인이 투기과열지구가 아닌 지역의 실제 거래가격이 6억원 이상인 주택을 매수하는 경우, 자금조달ㆍ입주계획서를 제출하여야 한다.\n\n② 법인이 주택을 매수하는 경우, 거래지역 및 거래가격과 관계없이 자금조달ㆍ입주계획서를 제출하여야 한다.\n\n③ 개업공인중개사가 주택 취득자금 조달 및 입주계획서를 제출하는 경우, 매수인은 자금조달ㆍ입주계획서를 작성하여 계약체결일부터 50일 이내에 개업공인중개사에게 제공하여야 한다.\n\n④ 매수인 외의 자가 자금조달ㆍ입주계획서를 제출하는 경우, 매수인은 자금조달ㆍ입주계획서를 작성하여 계약체결일부터 45일 이내에 제출 담당자에게 제공하여야 한다.\n\n⑤ 매수인이 자금조달ㆍ입주계획서를 제공하지 아니하여 개업공인중개사가 자금조달ㆍ입주계획서를 제출할 수 없는 경우, 매수인이 별도로 자금조달ㆍ입주계획서를 제출할 수 있다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",11,0],[37,2026,11,75,1,"민사특별법","주택임대차보호법","박스형(모두고르기), 판례, 틀린것 고르기","주택임대차보호법상 임차인의 임차권등기명령 신청에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 임차인은 임대차가 끝난 후 보증금이 반환되지 아니한 경우 임차주택의 소재지를 관할하는 지방법원·지방법원지원 또는 시·군 법원에 임차권등기명령을 신청할 수 있다.\n\n② 임차인은 임차권등기명령의 신청과 그에 따른 임차권등기에 들은 비용을 임대인에게 청구할 수 있다.\n\n③ 임차권등기명령의 집행에 따른 임차권등기를 마치면 임차인은 대항력 및 우선변제권을 취득한다. 다만, 임차인이 등기 전에 이미 대항력이나 우선변제권을 취득한 경우에는 그 대항력이나 우선변제권은 그대로 유지된다.\n\n④ 임차권등기명령의 집행에 따른 임차권등기가 끝난 주택을 그 이후에 임차한 임차인은 소액보증금의 우선변제를 받을 권리가 있다.\n\n⑤ 임대인의 보증금반환의무와 임차인의 임차권등기 말소의무는 동시이행관계에 있지 않다(임대인의 보증금반환의무가 선이행의무이다).","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",12,0],[37,2026,11,76,1,"민사특별법","집합건물법","판례","갑은 을과 을 소유의 X주택에 관하여 보증금을 3억원으로 하는 임대차계약을 체결하고, 2024. 3. 5. 주택의 인도와 주민등록을 마쳤다. 다음 설명 중 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 임대차계약에 존속기간을 정하지 않은 경우, 그 기간은 2년으로 본다.\nㄴ. 갑이 2기(期)의 차임액에 달하도록 차임을 연체한 경우, 묵시적 갱신이 인정되지 않는다.\nㄷ. 묵시적 갱신이 된 경우, 임대차의 존속기간은 2년으로 본다.\nㄹ. 묵시적 갱신이 된 경우, 갑은 언제든지 을에게 계약해지를 통지할 수 있고, 을이 그 통지를 받은 날부터 3개월이 지나면 그 효력이 발생한다.\n\n① ㄱ, ㄷ\n\n② ㄴ, ㄹ\n\n③ ㄱ, ㄴ, ㄹ\n\n④ ㄴ, ㄷ, ㄹ\n\n⑤ ㄱ, ㄴ, ㄷ, ㄹ","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",12,0],[37,2026,11,77,1,"민사특별법","가등기담보법","판례","집합건물의 소유 및 관리에 관한 법률상 구분소유자의 권리와 의무에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 구분소유자는 건물의 보전과 관리에 관한 구분소유자의 공동의 이익에 어긋나는 행위를 하여서는 아니 된다.\n\n② 공용부분에 대한 공유자의 지분은 그가 가지는 전유부분의 처분에 따른다.\n\n③ 구분소유자는 그 전유부분과 분리하여 대지사용권을 처분할 수 없음이 원칙이다.\n\n④ 구분소유자가 공용부분에 관하여 다른 구분소유자에 대하여 가지는 채권은 그 특별승계인에 대해서도 행사할 수 있다.\n\n⑤ 공용부분의 변경에 관한 사항은 관리단집회에서 구분소유자의 3분의 2 이상 및 의결권의 3분의 2 이상의 결의로써 결정하는 것이 원칙이다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",12,0],[37,2026,11,78,1,"민사특별법","부동산실명법(명의신탁)","","집합건물의 소유 및 관리에 관한 법률상 공용부분에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 공용부분은 취득시효에 의한 소유권 취득의 대상이 될 수 없다.\n\n② 각 공유자는 공용부분을 그 용도에 따라 사용할 수 있다.\n\n③ 공용부분의 관리비용에 대한 채권은 특별승계인에 대하여도 행사할 수 있다.\n\n④ 구조상 공용부분에 관한 권리의 득실변경은 등기하여야 효력이 생긴다.\n\n⑤ 관리단은 규약으로 정하는 바에 따라 공용부분의 무상대여로 인한 수입의 전부 또는 일부를 구성원에게 분배할 수 있다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",12,0],[37,2026,11,79,1,"민사특별법","상가건물임대차보호법","박스형(모두고르기), 판례","갑은 을과의 약정에 따라 을 소유의 X토지를 명의신탁받아 자신의 명의로 소유권이전등기를 마친 후, 병에게 X토지를 매도하고 소유권이전등기를 마쳐주었다. 다음 설명 중 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 갑과 을 사이의 명의신탁약정은 무효이다.\n\n② 특별한 사정이 없는 한, 병은 X토지의 소유권을 취득한다.\n\n③ 병이 갑과 을 사이의 명의신탁약정 사실을 알았더라도, 병이 갑의 배임행위에 적극 가담하지 않은 한 병은 X토지의 소유권을 취득한다.\n\n④ 병이 X토지의 소유권을 취득한 경우, 갑은 을에게 부당이득반환의무를 부담한다.\n\n⑤ 병이 X토지의 소유권을 취득한 경우, 을은 병을 상대로 소유권이전등기의 말소를 청구할 수 있다.","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",12,0],[37,2026,11,80,1,"민사특별법","상가건물임대차보호법","박스형(모두고르기), 옳은것 고르기","부동산 실권리자명의 등기에 관한 법률이 적용되는 명의신탁약정에 해당하는 것은? (다툼이 있으면 판례에 따름)\n\n① 채무의 변제를 담보하기 위하여 채권자가 부동산에 관한 물권을 이전받기로 하는 약정\n\n② 부동산의 위치와 면적을 특정하여 2인 이상이 구분소유하기로 하는 약정을 하고 그 구분소유자의 공유로 등기하는 약정\n\n③ 「신탁법」에 따른 신탁재산인 사실을 등기하는 약정\n\n④ 부동산의 매수인이 대금을 지급하고 타인 명의로 소유권이전등기를 마치기로 하는 약정\n\n⑤ 「자본시장과 금융투자업에 관한 법률」에 따른 신탁재산인 사실을 등기하는 약정","12/2 발표 후 추가","1GxmdDp8XMioQDuOZxvqryHRgw8BSsA4F",12,0],[37,2026,21,1,2,"공인중개사법","중개대상물·용어","","공인중개사법령상 용어에 관한 설명으로 옳은 것은?\n\n① ‘개업공인중개사’는 모두 공인중개사이다.\n\n② 외국법에 따라 공인중개사 자격을 취득한 자는 ‘공인중개사’에 해당한다.\n\n③ 개업공인중개사인 법인의 임원으로서 그 개업공인중개사의 중개업무를 보조하는 공인중개사는 ‘소속공인중개사’에 해당한다.\n\n④ 개업공인중개사에 소속되어 개업공인중개사의 중개업무와 관련된 단순한 업무를 보조하는 공인중개사는 ‘중개보조원’에 해당한다.\n\n⑤ ‘공인중개사’란 공인중개사 자격을 취득한 후 중개사무소의 개설등록을 한 자이다.","12/2 발표 후 추가","1-ib1tDDcYtBxCkgah8WkgOtrrNnXI7-2",1,0],[37,2026,21,2,2,"공인중개사법","중개대상물·용어","틀린것 고르기","공인중개사법령상 중개대상물에 관한 설명으로 틀린 것은?\n\n① 「공장 및 광업재단 저당법」에 따른 광업재단은 중개대상물이다.\n\n② 거래정보사업자는 개업공인중개사로부터 공개를 의뢰받은 중개대상물의 정보에 한정하여 이를 부동산거래정보망에 공개하여야 한다.\n\n③ 개업공인중개사가 아닌 자는 중개대상물에 대한 표시·광고를 하여서는 아니 된다.\n\n④ 개업공인중개사가 의뢰받은 중개대상물에 대하여 표시·광고를 하려면 중개보조원에 관한 사항을 명시해서는 아니 된다.\n\n⑤ 개업공인중개사가 주택의 임대차를 중개하면서 중개대상물 확인·설명서[Ⅰ](주거용 건축물)를 작성하는 경우 ‘건물(주택)공시가격’은 생략할 수 없다.","12/2 발표 후 추가","1-ib1tDDcYtBxCkgah8WkgOtrrNnXI7-2",1,0],[37,2026,21,3,2,"공인중개사법","중개대상물·용어","","공인중개사법령상 부동산거래정보망을 설치·운영할 자로 지정받은 甲과 그 거래정보망에 중개대상물의 정보공개를 의뢰하는 개업공인중개사 乙에 관한 설명으로 옳은 것은?\n\n① 甲은 「전기통신사업법」상 부가통신사업자로서 정보처리기사 2명 이상을 확보해야 한다.\n\n② 甲은 乙로부터 의뢰받은 중개대상물의 정보를 다른 개업공인중개사의 정보와 차별적으로 공개할 수 있다.\n\n③ 乙은 甲에게 공개를 의뢰한 중개대상물의 거래가 완성된 때에는 1주일 이내에 이를 甲에게 통보하여야 한다.\n\n④ 국토교통부장관은 甲이 거짓으로 지정을 받은 경우 그 지정을 취소하여야 한다.\n\n⑤ 국토교통부장관은 甲이 정당한 사유 없이 지정받은 날부터 1년 이내에 부동산거래정보망을 설치·운영하지 아니한 경우 그 지정을 취소할 수 있다.","12/2 발표 후 추가","1-ib1tDDcYtBxCkgah8WkgOtrrNnXI7-2",1,0],[37,2026,21,4,2,"중개실무","주택·상가 임대차 실무","박스형(모두고르기)","공인중개사법령상 개업공인중개사가 확인·설명해야 하는 사항 중 주택 임대차 중개의 경우에만 적용하는 사항을 모두 고른 것은?\n\nㄱ. 관리비 금액과 그 산출내역\nㄴ. 벽면·바닥면 및 도배의 상태\nㄷ. 일조·소음·진동 등 환경조건\nㄹ. 「주민등록법」에 따른 전입세대확인서의 열람 또는 교부에 관한 사항\n\n\n① ㄱ\n\n② ㄹ\n\n③ ㄱ, ㄹ\n\n④ ㄴ, ㄷ\n\n⑤ ㄱ, ㄴ, ㄷ, ㄹ","12/2 발표 후 추가","1-ib1tDDcYtBxCkgah8WkgOtrrNnXI7-2",1,0],[37,2026,21,5,2,"공인중개사법","중개사무소·분사무소·인장·게시","","공인중개사법령상 개업공인중개사의 중개사무소 이전 및 중개업의 휴업·폐업 신고에 관한 설명으로 옳은 것은?\n\n① 중개사무소를 이전한 때에는 이전한 날부터 1개월 이내에 이전신고를 하여야 한다.\n\n② 3개월의 휴업을 하는 때에는 휴업신고를 하여야 한다.\n\n③ 등록관청에 폐업사실을 신고한 경우 1개월 이내에 사무소의 간판을 철거하여야 한다.\n\n④ 중개사무소를 등록관청의 관할 지역 외의 지역으로 이전한 경우, 이전신고 전에 발생한 사유로 인한 개업공인중개사에 대한 행정처분은 ‘이전후 등록관청’이 행한다.\n\n⑤ 분사무소를 이전한 때에는 분사무소의 소재지를 관할하는 등록관청에 이전신고를 하여야 한다.","12/2 발표 후 추가","1-ib1tDDcYtBxCkgah8WkgOtrrNnXI7-2",1,0],[37,2026,21,6,2,"공인중개사법","고용인(소속공인중개사·중개보조원)","","공인중개사법령상 중개보조원에 관한 설명으로 옳은 것은?\n\n① 중개보조원이 그 업무상 알게 된 비밀의 누설금지의무는 그 업무를 떠난 후에는 요구되지 않는다.\n\n② 개업공인중개사는 중개보조원과의 고용관계가 종료된 때에는 고용관계가 종료된 날부터 7일 이내에 등록관청에 신고하여야 한다.\n\n③ 중개보조원은 다른 개업공인중개사인 법인의 사원이 될 수 있다.\n\n④ 중개보조원의 업무상 행위는 그를 고용한 개업공인중개사의 행위로 보지 않는다.\n\n⑤ 중개보조원이 현장안내 등 중개업무를 보조하는 경우 중개의뢰인에게 본인이 중개보조원이라는 사실을 미리 알려야 한다.","12/2 발표 후 추가","1-ib1tDDcYtBxCkgah8WkgOtrrNnXI7-2",1,0],[37,2026,21,7,2,"공인중개사법","중개계약(일반·전속)","틀린것 고르기","공인중개사법령상 전속중개계약서의 서식에 포함되어 있는 사항이 아닌 것은?\n\n① 권리취득용(매수·임차 등)의 경우 거래규제 및 공법상 제한사항\n\n② 권리이전용(매도·임대 등)의 경우 권리관계\n\n③ 중개보수 또는 실비를 과다수령한 경우 차액 환급\n\n④ 첨부서류로서 중개보수 요율표\n\n⑤ 전속중개계약의 유효기간","12/2 발표 후 추가","1-ib1tDDcYtBxCkgah8WkgOtrrNnXI7-2",1,0],[37,2026,21,8,2,"공인중개사법","중개사무소·분사무소·인장·게시","틀린것 고르기","공인중개사법령상 공인중개사인 개업공인중개사가 중개사무소 안에 게시해야 하는 것에 해당하지 않는 것은?\n\n① 중개사무소등록증 원본\n\n② 중개보수ㆍ실비의 요율 및 한도액표\n\n③ 공인중개사시험 최종 합격 확인서 원본\n\n④ 보증의 설정을 증명할 수 있는 서류\n\n⑤ 「부가가치세법 시행령」에 따른 사업자등록  판례","부동산금융에 관한 설명으로 옳은 것은?\n① 지분금융은 타인자본을 조달하는 방법이다.\n② 저당대출의 상환방식 중 원리금균등상환방식은 매기 상환하는 원리금액이 점차 감소한다.\n③ 주택담보대출비율(LTV)은 주택가격에 대한 대출금액의 비율을 의미한다.\n④ 총부채상환비율(DTI)은 차주의 총소득에서 주택담보대출의 원리금 상환액이 차지하는 비율만을 고려한다.\n⑤ 고정금리 대출에서 시장금리가 대출약정금리보다 낮아지면 대출자는 조기상환 위험에 직면한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",7,0],[37,2026,21,41,3,"국토계획법","국토계획법 일반","","부동산개발 및 관리에 관한 설명으로 옳은 것은?\n① 부동산개발은 미래의 불확실한 시장상황에 대응하기 위한 과정이므로 위험요소가 존재한다.\n② 개발사업의 타당성 분석 결과가 동일하더라도 개발업자의 의사결정은 다를 수 없다.\n③ 부동산관리란 부동산의 물리적, 기능적, 경제적 측면에서 가치를 증진시키는 활동을 말한다.\n④ 위탁관리는 관리업무의 전문성과 효율성을 높일 수 있으나, 기밀유지에 취약하다는 단점이 있다.\n⑤ 직접관리는 관리업무의 타성화를 방지할 수 있다는 장점이 있다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",7,0],[37,2026,21,42,3,"국토계획법","도시·군관리계획·기본계획","틀린것 고르기","부동산 마케팅에 관한 설명으로 옳은 것은?\n① 마케팅 믹스(Marketing Mix)의 4P 전략은 제품(Product), 가격(Price), 유통경로(Place), 판매촉진(Promotion)으로 구성된다.\n② 시장점유 마케팅 전략은 공급자 중심의 마케팅 전략이다.\n③ 고객점유 마케팅 전략은 표적시장을 선점하거나 틈새시장을 점유하는 전략이다.\n④ 관계 마케팅 전략은 고객과 생산자의 일회성 거래를 강조한다.\n⑤ 마케팅 믹스 전략 중 가격 전략에는 고가전략, 저가전략, 시가전략 등이 포함되지 않는다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",7,0],[37,2026,21,43,3,"국토계획법","도시·군관리계획·기본계획","옳은것 고르기","부동산 감정평가론의 기초이론에 관한 설명으로 옳은 것은?\n① 감정평가란 부동산의 경제적 가치를 판정하여 그 결과를 가액으로 표시하는 것을 말한다.\n② 감정평가는 부동산의 가격을 결정하는 것이 아니라 가격을 형성하는 요인을 분석하는 것이다.\n③ 부동산의 가격은 수요와 공급의 상호작용에 의해 결정되지만, 부동산의 가치는 가격과 항상 일치한다.\n④ 부동산의 가치는 장래 기대되는 편익을 현재가치로 환원한 값이다.\n⑤ 부동산의 가격은 교환의 대가로 지불된 금액이므로, 가치와는 달리 시간의 흐름에 따라 변하지 않는다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",7,0],[37,2026,21,44,3,"국토계획법","용도지역·용도지구·용도구역","","부동산 가격공시에 관한 설명으로 옳은 것은?\n① 표준지공시지가는 국토교통부장관이 매년 공시기준일 현재의 단위면적당 적정가격을 조사·평가하여 공시한다.\n② 개별공시지가는 시장·군수 또는 구청장이 결정·공시한다.\n③ 공동주택가격은 국토교통부장관이 매년 공동주택에 대하여 조사·산정하여 공시한다.\n④ 표준주택가격은 개별주택가격을 산정하는 기준이 된다.\n⑤ 비주거용 부동산 가격공시제도는 존재하지 않는다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",7,0],[37,2026,21,45,3,"국토계획법","국토계획법 일반","틀린것 고르기","부동산투자분석기법에 관한 설명으로 옳은 것은?\n① 어림셈법 중 승수법의 경우 승수값이 클수록 자본회수기간이 길어진다.\n② 순현가법이란 투자안의 순현가가 0보다 작은 경우를 선택하는 방법이다.\n③ 내부수익률법이란 투자안의 내부수익률과 요구수익률을 비교하여 투자결정을 하는 방법이다.\n④ 수익성지수법이란 투자안의 현금유입의 현재가치를 현금유출의 현재가치로 나눈 비율이 1보다 작은 경우를 선택하는 방법이다.\n⑤ 회계적 수익률법은 투자안의 수익률을 내부수익률로 계산하여 투자결정을 하는 방법이다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",8,0],[37,2026,21,46,3,"국토계획법","용도지역·용도지구·용도구역","박스형(모두고르기)","부동산투자분석의 현금흐름 측정에 관한 설명으로 옳은 것은?\n① 영업경비에는 감가상각비, 공실손실상당액, 재산세가 포함된다.\n② 유효총소득은 가능총소득에서 공실손실상당액 및 대손충당금을 차감하고 기타소득을 합한 것이다.\n③ 순영업소득은 유효총소득에서 영업경비를 합한 것이다.\n④ 세전현금흐름은 순영업소득에서 부채서비스액을 더한 것이다.\n⑤ 세후현금흐름은 세전현금흐름에서 소득세를 더한 것이다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",8,0],[37,2026,21,47,3,"국토계획법","용도지역·용도지구·용도구역","","부동산금융에 관한 설명으로 옳은 것은?\n① 지분금융은 타인자본을 조달하는 방법이다.\n② 저당대출은 부채금융의 일종이다.\n③ 부동산투자회사(REITs)는 부채금융의 방식이다.\n④ 프로젝트금융(PF)은 대출기관이 프로젝트 사업주에게 상환청구권을 행사할 수 있는 것이 원칙이다.\n⑤ 주택저당증권(MBS)은 자산유동화와 관련이 없다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",8,0],[37,2026,21,48,3,"국토계획법","개발행위허가·성장관리","","주택저당대출방식에 관한 설명으로 옳은 것은?\n① 원리금균등상환방식은 매기 상환하는 원리금액이 점차 감소한다.\n② 원금균등상환방식은 매기 상환하는 원금액이 점차 증가한다.\n③ 점증상환방식은 대출 초기에는 원리금 상환액이 적지만 시간이 지날수록 상환액이 증가한다.\n④ 원리금균등상환방식은 대출 기간 중 대출잔액이 가장 빠르게 감소한다.\n⑤ 원금균등상환방식은 대출 초기보다 후기에 원리금 상환액이 많다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",8,0],[37,2026,21,49,3,"국토계획법","용도지역·용도지구·용도구역","","부동산개발 및 관리방론에 관한 설명으로 옳은 것은?\n① 부동산개발은 미래의 불확실한 시장상황에 대응하기 위한 위험분석이 필요하다.\n② 부동산관리란 부동산의 물리적, 기능적, 경제적 측면에서 가치를 유지·증진시키는 활동이다.\n③ 위탁관리는 관리의 전문성을 확보하기 어렵다.\n④ 자치관리는 관리업무의 기밀유지가 어렵다.\n⑤ 혼합관리는 자치관리와 위탁관리의 장점만을 취할 수 있어 항상 효율적이다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",8,0],[37,2026,21,50,3,"국토계획법","개발행위허가·성장관리","","부동산 마케팅 전략에 관한 설명으로 옳은 것은?\n① STP 전략은 시장세분화(Segmentation), 표적시장 선정(Targeting), 포지셔닝(Positioning)의 약자이다.\n② 4P Mix 전략은 제품(Product), 가격(Price), 유통경로(Place), 촉진(Promotion)의 4요소로 구성된다.\n③ 고객점유 마케팅 전략은 공급자 중심의 마케팅 전략이다.\n④ 관계 마케팅 전략은 일회성 거래를 중시한다.\n⑤ 포지셔닝 전략은 시장을 세분화하는 전략이다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",8,0],[37,2026,21,51,3,"국토계획법","개발행위허가·성장관리","틀린것 고르기","부동산 감정평가론의 가격제원칙에 관한 설명으로 옳은 것은?\n① 균형의 원칙은 부동산의 내부적 구성요소 간의 결합에 관한 원칙이다.\n② 적합의 원칙은 부동산의 외부적 환경과의 적합성에 관한 원칙이다.\n③ 대체의 원칙은 부동산의 가격이 대체 가능한 다른 부동산의 가격과 관련이 없다는 원칙이다.\n④ 기회비용의 원칙은 부동산의 가치가 투입된 비용의 합계와 항상 일치한다는 원칙이다.\n⑤ 수익배분의 원칙은 부동산의 가치가 토지, 노동, 자본, 경영의 생산요소에 배분되는 것과 관련이 없다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",8,0],[37,2026,21,52,3,"국토계획법","개발행위허가·성장관리","틀린것 고르기","감정평가방식에 관한 설명으로 옳은 것은?\n① 원가법은 비용성 사고에 근거한다.\n② 비교방식은 수익성 사고에 근거한다.\n③ 수익방식은 시장성 사고에 근거한다.\n④ 적산법은 임대료를 구하는 방법이 아니다.\n⑤ 수익환원법은 대상물건의 가액을 구하는 방법이 아니다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",8,0],[37,2026,21,53,3,"도시개발법","수용·사용·환지","","부동산투자분석기법에 관한 설명으로 옳은 것은?\n① 어림셈법 중 순소득승수법의 역수는 종합환원율이다.\n② 순현재가치법은 투자안의 내부수익률이 요구수익률보다 클 때 투자하는 방법이다.\n③ 내부수익률법은 투자안의 내부수익률이 시장이자율보다 작을 때 투자하는 방법이다.\n④ 수익성지수법은 투자안의 수익성지수가 0보다 작을 때 투자하는 방법이다.\n⑤ 회수기간법은 회수기간이 기업이 정한 목표회수기간보다 길 때 투자하는 방법이다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",9,0],[37,2026,21,54,3,"도시개발법","수용·사용·환지","","부동산금융에 관한 설명으로 옳은 것은?\n① 지분금융은 타인자본을 조달하는 방법이다.\n② 저당대출의 상환방식 중 원금균등상환방식은 매기 상환하는 원리금이 점차 감소한다.\n③ 저당대출의 상환방식 중 원리금균등상환방식은 매기 상환하는 원금의 규모가 점차 감소한다.\n④ 주택담보대출비율(LTV)은 주택가격에 대한 대출금액의 비율을 의미한다.\n⑤ 총부채상환비율(DTI)은 차주의 소득에 대한 주택담보대출의 원리금 상환액과 기타 대출의 이자 상환액을 합한 비율을 의미한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",9,0],[37,2026,21,55,3,"도시개발법","도시개발채권·기타","빈칸","부동산개발 및 관리에 관한 설명으로 옳은 것은?\n① 부동산개발은 미래의 불확실한 시장상황에 대응하기 위해 개발사업의 타당성 분석을 수행한다.\n② 부동산개발의 타당성 분석 중 시장분석은 특정 부동산에 대한 수요와 공급을 분석하여 가격을 결정하는 과정이다.\n③ 부동산관리 중 위탁관리는 관리업무의 전문성과 효율성을 높일 수 있으나, 기밀유지에 불리하다.\n④ 부동산관리 중 자치관리는 관리업무의 타성화를 방지할 수 있고, 관리의 전문성을 확보할 수 있다.\n⑤ 부동산관리 중 혼합관리는 자치관리에서 위탁관리로 이행하는 과도기에 유용한 방식이다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",9,0],[37,2026,21,56,3,"도시개발법","도시개발채권·기타","","부동산 마케팅에 관한 설명으로 옳은 것은?\n① 부동산 마케팅은 공급자 중심의 시장에서 수요자 중심의 시장으로 변화하고 있다.\n② 부동산 마케팅 전략 중 시장점유 마케팅 전략은 표적시장을 선정하거나 틈새시장을 점유하는 전략이다.\n③ 부동산 마케팅 전략 중 고객점유 마케팅 전략은 공급자의 마케팅 활동과 소비자의 구매의사결정 과정을 연결하는 전략이다.\n④ 부동산 마케팅 전략 중 관계 마케팅 전략은 생산자와 소비자 간의 일회성 거래를 강조하는 전략이다.\n⑤ 부동산 마케팅 믹스(Marketing Mix)의 4P 전략에는 제품(Product), 가격(Price), 유통경로(Place), 판매촉진(Promotion)이 포함된다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",9,0],[37,2026,21,57,3,"도시개발법","시행자·조합","","부동산 감정평가론의 기초이론에 관한 설명으로 옳은 것은?\n① 감정평가는 부동산의 가치를 화폐액으로 표시하는 작업이다.\n② 감정평가의 대상은 부동산에 한정된다.\n③ 감정평가는 부동산의 가격을 결정하는 과정이다.\n④ 감정평가는 부동산의 가치를 추계하는 작업이다.\n⑤ 감정평가는 부동산의 가격을 형성하는 요인을 분석하는 과정이다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",9,0],[37,2026,21,58,3,"도시개발법","도시개발구역 지정·계획","옳은것 고르기","부동산 가격공시에 관한 설명으로 옳은 것은?\n① 표준지공시지가는 토지시장의 지가정보를 제공하고, 일반적인 토지거래의 지표가 된다.\n② 개별공시지가는 시장·군수 또는 구청장이 결정·공시한다.\n③ 공동주택가격은 국토교통부장관이 조사·산정한다.\n④ 개별주택가격은 매년 1월 1일을 기준으로 공시한다.\n⑤ 표준주택가격은 개별주택가격의 산정기준이 된다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",9,0],[37,2026,21,59,3,"정비법","정비사업 일반","","부동산거래신고 등에 관한 법령상 토지거래허가구역에 관한 설명으로 옳은 것은?\n① 허가구역의 지정 당시의 이용현황 등을 고려하여 대통령령으로 정하는 용도지역별 토지의 면적을 초과하는 토지에 대하여 토지거래계약을 체결하려는 자는 시장·군수 또는 구청장의 허가를 받아야 한다.\n② 허가구역의 지정은 지정 공고일부터 5일 후에 그 효력이 발생한다.\n③ 국토교통부장관 또는 시·도지사는 허가구역의 지정 사유가 없어졌다고 인정되는 경우에는 중앙도시계획위원회 또는 시·도도시계획위원회의 심의를 거쳐 허가구역의 지정을 해제하여야 한다.\n④ 허가구역 내의 토지에 대하여 토지거래계약을 체결하려는 자는 공동으로 시장·군수 또는 구청장의 허가를 받아야 하며, 허가받은 사항을 변경하려는 경우에도 또한 같다.\n⑤ 허가구역 내의 토지거래계약에 관하여 허가를 받지 아니하고 체결한 계약은 그 효력이 발생한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",10,0],[37,2026,21,60,3,"정비법","정비사업 일반","틀린것 고르기","부동산거래신고 등에 관한 법령상 외국인등의 부동산 취득 등에 관한 설명으로 틀린 것은?\n① 외국인등이 건축물의 개축·재축·증축·개축을 원인으로 부동산을 취득하는 경우에는 부동산 취득 신고를 하여야 한다.\n② 외국인등이 상속·경매 그 밖의 대통령령으로 정하는 계약 외의 원인으로 부동산을 취득한 때에는 그 취득한 날부터 6개월 이내에 신고관청에 신고하여야 한다.\n③ 외국인등이 허가구역 내의 토지에 대하여 토지거래계약을 체결하려는 경우에는 토지거래허가를 받은 경우에도 외국인 토지 취득 허가를 별도로 받아야 한다.\n④ 외국인등이 대한민국 안의 부동산을 취득하는 계약을 체결한 경우, 부동산거래신고 등에 관한 법률에 따라 부동산거래신고를 한 때에는 외국인 토지 취득 신고를 하지 아니할 수 있다.\n⑤ 외국인등이 허가구역 내의 토지 취득 허가를 받지 아니하고 체결한 토지거래계약은 그 효력이 발생하지 아니한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",10,0],[37,2026,21,61,3,"국토계획법","도시·군계획시설·매수청구","틀린것 고르기","부동산 실권리자명의 등기에 관한 법률에 관한 설명으로 옳은 것은?\n① 배우자 명의로 부동산에 관한 물권을 등기한 경우, 조세 포탈, 강제집행의 면탈 또는 법령상 제한의 회피를 목적으로 하지 아니하는 경우에도 명의신탁약정은 무효이다.\n② 명의신탁약정에 따라 수탁자 명의로 등기된 경우, 그 명의신탁약정은 무효로 하며, 그 명의신탁약정에 따른 등기로 이루어진 부동산에 관한 물권변동은 무효로 한다.\n③ 명의신탁자는 명의수탁자에게 명의신탁약정의 해지를 원인으로 한 소유권이전등기를 청구할 수 있다.\n④ 명의신탁약정의 무효는 제3자에게 대항할 수 있다.\n⑤ 종중이 보유한 부동산에 관한 물권을 종중 외의 자의 명의로 등기한 경우, 조세 포탈 등의 목적이 있더라도 명의신탁약정은 유효하다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",10,0],[37,2026,21,62,3,"정비법","조합·추진위원회","틀린것 고르기","주택임대차보호법상 대항력에 관한 설명으로 옳은 것은?\n① 임차인이 주택의 인도와 주민등록을 마친 때에는 그 다음 날부터 제3자에 대하여 효력이 생긴다.\n② 전입신고를 한 때에 주민등록이 된 것으로 본다.\n③ 임차인의 배우자나 자녀 등 가족의 주민등록을 포함하지 아니한다.\n④ 다세대주택의 경우 전입신고를 할 때 지번만 기재하고 동·호수를 기재하지 않아도 대항력이 인정된다.\n⑤ 임차인이 주택을 인도받고 전입신고를 마친 당일에 저당권이 설정된 경우, 임차인의 대항력은 저당권보다 우선한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",10,0],[37,2026,21,63,3,"정비법","정비사업 일반","빈칸","상가건물 임대차보호법상 임차인의 계약갱신요구권에 관한 설명으로 틀린 것은?\n① 임대인은 임차인이 임대차기간이 만료되기 6개월 전부터 1개월 전까지 사이에 계약갱신을 요구할 경우 정당한 사유 없이 거절하지 못한다.\n② 임차인의 계약갱신요구권은 최초의 임대차기간을 포함한 전체 임대차기간이 10년을 초과하지 아니하는 범위에서만 행사할 수 있다.\n③ 갱신되는 임대차는 전 임대차와 동일한 조건으로 다시 계약된 것으로 본다.\n④ 임대인이 임대차 목적물인 상가건물의 전부 또는 대부분을 철거하거나 재건축하기 위하여 목적 건물의 점유 회복이 필요한 경우에는 임차인의 계약갱신요구를 거절할 수 있다.\n⑤ 임차인의 계약갱신요구권은 1회에 한하여 행사할 수 있다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",10,0],[37,2026,21,64,3,"정비법","조합·추진위원회","틀린것 고르기","집합건물의 소유 및 관리에 관한 법률에 관한 설명으로 옳은 것은?\n① 관리단은 어떠한 조직행위가 없더라도 구분소유자 전원을 구성원으로 하여 당연히 성립한다.\n② 관리인은 구분소유자가 아니면 될 수 없다.\n③ 규약은 특별한 사정이 없는 한 관리단집회에서 구분소유자의 3/4 이상의 찬성을 얻어야 설정·변경 또는 폐지할 수 있다.\n④ 공용부분의 관리에 관한 사항은 통상의 집회결의로써 결정한다.\n⑤ 전유부분에 대한 저당권의 효력은 그 전유부분의 소유자가 가지는 대지사용권에는 미치지 아니한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",10,0],[37,2026,21,65,3,"주택법","사업주체·주택조합","틀린것 고르기","가등기담보 등에 관한 법률에 관한 설명으로 틀린 것은?\n① 이 법은 차용물의 반환에 관하여 재산권을 이전할 것을 예약할 때 적용된다.\n② 채권자가 담보권을 실행하기 위해서는 채무자에게 청산금을 통지하여야 한다.\n③ 채권자는 담보권 실행 통지 후 청산기간이 경과하기 전에는 담보목적 부동산에 대하여 본등기를 청구할 수 없다.\n④ 채무자는 청산금을 지급받을 때까지 채무액을 채권자에게 지급하고 가등기담보권의 말소를 청구할 수 있다.\n⑤ 가등기담보권자가 담보권을 실행하여 소유권을 취득하기 위해서는 청산절차를 거칠 필요가 없다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",10,0],[37,2026,21,66,3,"주택법","리모델링·기타","틀린것 고르기","공인중개사법령상 중개대상물 확인·설명서[Ⅰ](주거용 건축물)의 작성방법으로 옳은 것은?\n① '대상물건의 상태에 관한 자료요구사항'란은 개업공인중개사가 매도·임대인에게 자료를 요구한 사항을 기재한다.\n② '실제 권리관계 또는 공시되지 아니한 물건의 권리사항'란은 매도(임대)인이 고지한 사항을 기재한다.\n③ '내·외부 시설물의 상태(벽면, 바닥면 및 도배)'란은 개업공인중개사가 매도(임대)인에게 자료를 요구하여 확인한 사항을 기재한다.\n④ '환경조건(일조량, 소음, 진동)'란은 개업공인중개사가 매도(임대)인에게 자료를 요구하여 확인한 사항을 기재한다.\n⑤ '중개보수 등에 관한 사항'란의 중개보수는 부가가치세를 포함하여 기재한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",11,0],[37,2026,21,67,3,"주택법","사업계획승인·사용검사","틀린것 고르기","공인중개사법령상 개업공인중개사의 금지행위에 해당하지 않는 것은?\n① 중개의뢰인과 직접 거래를 하는 행위\n② 중개의뢰인과 거래를 하려는 경우 중개의뢰인의 대리인과 거래를 하는 행위\n③ 건축물의 매매를 업으로 하는 행위\n④ 중개대상물의 매매를 업으로 하는 행위\n⑤ 중개대상물의 분양과 관련 있는 증서 등의 매매를 중개하는 행위","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",11,0],[37,2026,21,68,3,"주택법","주택공급·분양가상한·전매제한","틀린것 고르기","공인중개사법령상 개업공인중개사의 손해배상책임 및 보증설정에 관한 설명으로 옳은 것은?\n① 개업공인중개사는 업무를 개시하기 전까지 보증보험 또는 공제에 가입하거나 공탁을 하여야 한다.\n② 개업공인중개사가 자기의 중개사무소를 다른 사람의 중개행위의 장소로 제공함으로써 재산상의 손해를 발생하게 한 경우 그 손해를 배상할 책임이 없다.\n③ 보증보험금으로 손해배상을 한 때에는 30일 이내에 보증보험에 다시 가입하여야 한다.\n④ 공탁금은 개업공인중개사가 폐업한 날부터 2년 이내에는 회수할 수 없다.\n⑤ 개업공인중개사가 손해배상책임을 보장하기 위한 조치를 이행하지 아니하고 업무를 개시한 경우 등록관청은 중개사무소 개설등록을 취소할 수 있다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",11,0],[37,2026,21,69,3,"정비법","정비사업 일반","","공인중개사법령상 개업공인중개사의 교육에 관한 설명으로 옳은 것은?\n① 실무교육의 교육시간은 28시간 이상 32시간 이하로 한다.\n② 직무교육의 교육시간은 3시간 이상 4시간 이하로 한다.\n③ 연수교육의 교육시간은 12시간 이상 16시간 이하로 한다.\n④ 폐업신고 후 1년 이내에 중개사무소 개설등록을 다시 신청하려는 자는 실무교육을 받지 않아도 된다.\n⑤ 고용신고일 전 1년 이내에 직무교육을 받지 아니한 소속공인중개사는 직무교육을 받아야 한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",11,0],[37,2026,21,70,3,"주택법","용어(주택·공동주택 등)","빈칸","공인중개사법령상 개업공인중개사 등의 벌칙으로 옳은 것은?\n① 이중으로 중개사무소의 개설등록을 한 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.\n② 부정한 방법으로 중개사무소의 개설등록을 한 자는 1년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.\n③ 중개대상물의 매매를 업으로 한 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.\n④ 중개보수를 초과하여 금품을 받은 자는 1년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.\n⑤ 공인중개사가 아닌 자로서 공인중개사 또는 이와 유사한 명칭을 사용한 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",11,0],[37,2026,21,71,3,"주택법","리모델링·기타","","부동산 거래신고 등에 관한 법령상 부동산 거래신고에 관한 설명으로 옳은 것은?\n① 거래당사자 중 일방이 국가인 경우 국가가 신고하여야 한다.\n② 외국인이 부동산을 취득하는 계약을 체결한 경우 부동산 거래신고를 하면 외국인 토지 취득 신고를 별도로 하지 않아도 된다.\n③ 부동산 거래계약 해제등이 확정된 날부터 60일 이내에 신고하여야 한다.\n④ 개업공인중개사가 거래계약서를 작성·교부한 경우 거래당사자가 공동으로 신고하여야 한다.\n⑤ 부동산 거래신고를 받은 신고관청은 신고내용을 확인한 후 신고필증을 즉시 발급하여야 한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",11,0],[37,2026,21,72,3,"건축법","건축물·용어·적용범위","틀린것 고르기","부동산 거래신고 등에 관한 법령상 토지거래허가구역에 관한 설명으로 옳은 것은?\n① 국토교통부장관은 토지거래허가구역을 지정하는 경우 중앙도시계획위원회의 심의를 거쳐야 한다.\n② 시·도지사는 동일한 시·군·구 안의 일부 지역에 대하여만 토지거래허가구역을 지정할 수 없다.\n③ 토지거래허가구역의 지정은 공고한 날부터 3일 후에 그 효력이 발생한다.\n④ 토지거래허가구역 지정 당시의 허가구역 내 토지거래에 관하여는 허가를 받지 않아도 된다.\n⑤ 허가구역 지정권자는 허가구역의 지정 사유가 없어졌다고 인정되는 경우 중앙도시계획위원회의 심의를 거쳐 허가구역 지정을 해제하여야 한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",11,0],[37,2026,21,73,3,"건축법","건축물·용어·적용범위","","주택임대차보호법상 대항력에 관한 설명으로 옳은 것은?\n① 주택의 인도와 주민등록을 마친 때에는 그 다음 날부터 제3자에 대하여 효력이 생긴다.\n② 주민등록은 전입신고를 한 때에 주민등록이 된 것으로 본다.\n③ 다가구용 단독주택의 경우 전입신고를 할 때 지번만 기재하고 동·호수는 기재하지 않아도 대항력을 취득한다.\n④ 임차인이 주택의 인도를 받고 주민등록을 마친 후 그 주택의 소유권이 양도된 경우 양수인은 임대인의 지위를 승계한 것으로 본다.\n⑤ 임차인이 대항력을 갖춘 후 임차주택에 저당권이 설정된 경우 그 저당권 실행으로 인한 경매 시 임차인은 매수인에게 대항할 수 있다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",11,0],[37,2026,21,74,3,"건축법","건축허가·신고·사용승인","빈칸","부동산등기법상 등기절차에 관한 설명으로 옳은 것은?\n① 등기신청은 대법원규칙으로 정하는 바에 따라 전자문서로 할 수 있으나, 대리인이 신청하는 경우에는 전자문서로 할 수 없다.\n② 등기소의 등기관이 등기를 마쳤을 때에는 그 등기는 접수한 때부터 효력이 발생한다.\n③ 등기신청서에는 신청인 또는 그 대리인이 기명날인하거나 서명하여야 한다.\n④ 등기신청의 취하는 등기신청을 한 후 등기관이 등기를 마치기 전까지 할 수 있으나, 전자신청의 경우에는 등기신청을 취하할 수 없다.\n⑤ 등기신청이 접수된 후에는 신청인은 등기신청서에 기재된 사항을 보정할 수 없다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",12,0],[37,2026,21,75,3,"건축법","건축물·용어·적용범위","","부동산등기법상 등기신청의 당사자에 관한 설명으로 옳은 것은?\n① 태아는 등기신청능력이 있다.\n② 민법상 조합은 조합 명의로 등기를 신청할 수 있다.\n③ 사단법인이 아닌 사단은 대표자나 관리인이 있는 경우에 한하여 그 사단의 명의로 등기를 신청할 수 있다.\n④ 외국인은 대한민국에서 등기를 신청할 수 없다.\n⑤ 국가가 등기권리자로서 등기를 신청하는 경우에는 국가를 대리하는 공무원이 등기소에 출석하여야 한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",12,0],[37,2026,21,76,3,"건축법","건축물·용어·적용범위","틀린것 고르기","부동산등기법상 등기신청정보와 첨부정보에 관한 설명으로 옳은 것은?\n① 등기신청정보에는 등기원인과 그 연월일을 기록하여야 한다.\n② 등기원인을 증명하는 정보가 집행력 있는 판결서인 경우, 그 판결이 확정되어야만 등기를 신청할 수 있다.\n③ 등기신청서에 첨부하는 인감증명은 발행일로부터 3개월 이내의 것이어야 한다.\n④ 등기신청 시 등기필정보를 제공할 수 없는 경우에는 등기신청서에 등기필정보가 없다는 사유를 기재하여야 한다.\n⑤ 등기신청 시 등기원인을 증명하는 정보가 공정증서인 경우에는 검인을 받을 필요가 없다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",12,0],[37,2026,21,77,3,"건축법","건축물·용어·적용범위","","부동산등기법상 등기절차에 관한 설명으로 옳은 것은?\n① 등기관이 등기를 마친 경우, 그 등기는 등기신청정보가 접수된 때부터 효력이 발생한다.\n② 등기신청이 취하된 경우, 등기신청서와 그 부속서류는 신청인에게 반환하지 않는다.\n③ 등기신청의 각하결정에 대하여는 이의신청을 할 수 있으나, 등기실행처분에 대하여는 이의신청을 할 수 없다.\n④ 등기신청이 접수된 후에는 신청인은 등기신청서에 기재된 사항을 보정할 수 없다.\n⑤ 등기신청서에는 신청인 또는 그 대리인이 기명날인하거나 서명하여야 한다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",12,0],[37,2026,21,78,3,"국토계획법","도시·군계획시설·매수청구","박스형(모두고르기)","부동산등기법상 등기신청의 각하사유에 해당하지 않는 것은?\n① 사건이 등기할 사항이 아닌 경우\n② 신청정보의 제공이 대법원규칙으로 정한 방식에 맞지 않는 경우\n③ 신청정보의 등기사항과 등기기록이 일치하지 않는 경우\n④ 등기신청에 필요한 첨부정보를 제공하지 않은 경우\n⑤ 등기신청인이 등기신청의 권한이 없는 경우","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",12,0],[37,2026,21,79,3,"농지법","농지 소유·이용·보전","","부동산등기법상 등기필정보에 관한 설명으로 옳은 것은?\n① 등기필정보는 등기권리자가 등기소로부터 교부받는 것이다.\n② 등기필정보는 등기신청 시 항상 제공하여야 한다.\n③ 등기필정보를 분실한 경우에는 재발급받을 수 있다.\n④ 등기필정보는 등기신청서에 기재된 등기권리자의 성명과 일치하여야 한다.\n⑤ 등기필정보는 등기신청 시 등기소에 제출하여야 하며, 등기완료 후에는 반환되지 않는다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",12,0],[37,2026,21,80,3,"농지법","농지 소유·이용·보전","빈칸","부동산등기법상 등기절차에 관한 설명으로 옳은 것은?\n① 등기신청은 대법원규칙으로 정하는 바에 따라 전자문서로 할 수 있다.\n② 등기신청서에는 신청인 또는 그 대리인이 기명날인하거나 서명하여야 한다.\n③ 등기신청의 취하는 등기신청을 한 후 등기관이 등기를 마치기 전까지 할 수 있다.\n④ 등기신청이 접수된 후에는 신청인은 등기신청서에 기재된 사항을 보정할 수 없다.\n⑤ 등기신청이 각하된 경우, 신청인은 그 결정에 대하여 이의신청을 할 수 있다.","12/2 발표 후 추가","1pk3uB8H9T0BZxq3OL9OGYQDvwNYfrxi4",12,0],[37,2026,22,1,4,"공간정보법","지적측량·지적위원회","빈칸","공간정보의 구축 및 관리 등에 관한 법령상 지적측량의 측량기간과 측량검사기간에 관한 내용이다. ( )에 들어갈 내용으로 옳은 것은?(단, 측량검사를 필요로 하는 지적측량에 한함) 지적측량 의뢰인과 지적측량수행자가 서로 합의하여 따로 기간을 정하는 경우에는 그 기간에 따르되, 전체 기간의 ( ㄱ )은(는) 측량기간으로, 전체 기간의 ( ㄴ )은(는) 측량검사기간으로 본다.\n① ㄱ: 2분의 1, ㄴ: 2분의 1\n② ㄱ: 3분의 1, ㄴ: 3분의 2\n③ ㄱ: 3분의 2, ㄴ: 3분의 1\n④ ㄱ: 4분의 1, ㄴ: 4분의 3\n⑤ ㄱ: 4분의 3, ㄴ: 4분의 1","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",1,0],[37,2026,22,2,4,"공간정보법","지적측량·지적위원회","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 중앙지적위원회에 관한 설명으로 틀린 것은?\n① 중앙지적위원회는 위원장 1명과 부위원장 1명을 포함하여 5명 이상 10명 이하의 위원으로 구성한다.\n② 중앙지적위원회의 위원장은 국토교통부의 지적업무 담당 국장이, 부위원장은 국토교통부의 지적업무 담당 과장이 된다.\n③ 중앙지적위원회는 관계인을 출석하게 하여 의견을 들을 수 있으며, 필요하면 현지조사를 할 수 있다.\n④ 중앙지적위원회의 위원장 및 부위원장이 모두 부득이한 사유로 직무를 수행할 수 없을 때에는 국토교통부장관이 미리 지명한 위원이 위원장의 직무를 대행한다.\n⑤ 국토교통부장관은 중앙지적위원회의 위원이 직무태만, 품위손상이나 그 밖의 사유로 인하여 위원으로 적합하지 아니하다고 인정되는 경우에는 해당 위원을 해임하거나 해촉할 수 있다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",1,0],[37,2026,22,3,4,"공간정보법","지적공부·부동산종합공부","","공간정보의 구축 및 관리 등에 관한 법령상 지적도의 등록사항 등에 관한 설명으로 옳은 것은?\n① 건물의 명칭은 지적도의 등록사항이다.\n② 토지의 고유번호는 지적도의 등록사항이다.\n③ 지적도의 축척에는 1/6000이 포함된다.\n④ 경계점좌표등록부를 갖춰 두는 지역의 지적도에는 좌표에 의하여 계산된 토지의 면적을 등록한다.\n⑤ 경계점좌표등록부를 갖춰 두는 지역의 지적도에는 해당 도면의 제명 앞에 “(수치)”라고 표시한다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",1,0],[37,2026,22,4,4,"공간정보법","지번·지목·면적·경계","","공간정보의 구축 및 관리 등에 관한 법령상 지목의 구분에 관한 설명으로 옳은 것은?\n① 사과·배·밤·호두·귤나무 등 과수류를 집단적으로 재배하는 토지와 이에 접속된 저장고 등 부속시설물의 부지와 주거용 건축물의 부지는 “과수원”으로 한다.\n② 축산업 및 낙농업을 하기 위하여 초지를 조성한 토지와 접속된 부속시설물의 부지 및 주거용 건축물의 부지는 “목장용지”로 한다.\n③ 일반 공중의 종교의식을 위하여 예배·법요·설교·제사 등을 하기 위한 교회·사찰·향교 등 건축물의 부지와 이에 접속된 부속시설물의 부지는 “종교용지”로 한다.\n④ 영구적 건축물 중 박물관·미술관 등 문화시설과 공항시설 및 고속도로의 휴게소 부지 등 이에 접속된 부속시설물의 부지는 “대”로 한다.\n⑤ 「도시공원 및 녹지 등에 관한 법률」에 따른 묘지공원으로 결정·고시된 토지와 이에 접속된 부속시설물의 부지 및 묘지의 관리를 위한 건축물의 부지는 “묘지”로 한다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",1,0],[37,2026,22,5,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 토지소유자가 하여야 하는 토지의 이동 신청을 대신할 수 있는 자가 아닌 것은?(단, 등록사항 정정 대상토지는 제외하며, 다른 조건은 고려하지 않음)\n① 「민법」 제404조에 따른 채권자\n② 「주택법」에 따른 공동주택의 부지인 경우는 「집합건물의 소유 및 관리에 관한 법률」에 따른 관리인(관리인이 없는 경우에는 공유자가 선임한 대표자) 또는 해당 사업의 시행자\n③ 공공사업 등에 따라 학교용지·도로·철도용지·제방·하천·구거·유지·수도용지 등의 지목으로 되는 토지인 경우는 해당 사업의 시행자\n④ 「건축법」에 따른 주차전용 건축물 및 이에 접속된 부속시설물의 부지인 경우는 해당 토지의 임차인\n⑤ 국가나 지방자치단체가 취득하는 토지인 경우는 해당 토지를 관리하는 행정관의 장 또는 지방자치단체의 장","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",1,0],[37,2026,22,6,4,"공간정보법","지적측량·지적위원회","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 중앙지적위원회의 위원이 중앙지적위원회의 심의·의결에서 제척되는 경우로 틀린 것은?\n① 위원이 심신장애로 인하여 직무를 수행할 수 없게 된 경우\n② 위원이 해당 안건의 당사자와 친족이거나 친족이었던 경우\n③ 위원이 해당 안건에 대하여 증언, 진술 또는 감정을 한 경우\n④ 위원이 해당 안건의 원인이 된 처분 또는 부작위에 관여한 경우\n⑤ 위원이나 위원이 속한 법인·단체 등이 해당 안건의 당사자의 대리인이거나 대리인이었던 경우","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",1,0],[37,2026,22,7,4,"공간정보법","지번·지목·면적·경계","박스형(모두고르기)","공간정보의 구축 및 관리 등에 관한 법령상 분할에 따른 지상 경계가 지상건축물을 걸리게 결정할 수 있는 경우로 옳은 것을 모두 고른 것은? ㄱ. 공공사업 등에 따라 학교용지·도로·철도용지·제방·하천·구거·유지·수도용지 등의 지목으로 되는 토지를 분할하는 경우 ㄴ. 도시개발사업 등의 사업시행자가 사업지구의 경계를 결정하기 위하여 토지를 분할하는 경우 ㄷ. 「국토의 계획 및 이용에 관한 법률」에 따른 도시·군관리계획 결정고시와 지형도면 고시가 된 지역의 도시·군관리계획선에 따라 토지를 분할하는 경우\n① ㄱ\n② ㄴ\n③ ㄱ, ㄴ\n④ ㄴ, ㄷ\n⑤ ㄱ, ㄴ, ㄷ","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",1,0],[37,2026,22,8,4,"공간정보법","지적공부·부동산종합공부","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적공부의 복구에 관한 관계자료가 아닌 것은?\n\n① 지적측량 수행계획서\n\n② 토지이동정리 결의서\n\n③ 법원의 확정판결서 정본 또는 사본\n\n④ 토지(건물)등기사항증명서 등 등기사실을 증명하는 서류\n\n⑤ 지적소관청이 작성하거나 발행한 지적공부의 등록내용을 증명하는 서류","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",2,0],[37,2026,22,9,4,"공간정보법","지적공부·부동산종합공부","박스형(모두고르기)","공간정보의 구축 및 관리 등에 관한 법령상 부동산종합공부의 등록사항으로 옳은 것을 모두 고른 것은?\nㄱ. 토지의 이용 및 규제에 관한 사항: 「토지이용규제 기본법」 제10조에 따른 토지이용계획확인서의 내용\nㄴ. 부동산의 효율적 이용과 부동산과 관련된 정보의 종합적 관리·운영을 위하여 필요한 사항: 「부동산등기법」 제48조에 따른 부동산의 권리에 관한 사항\nㄷ. 부동산의 평가에 관한 사항: 「국토의 계획 및 이용에 관한 법률」 제20조 및 제27조에 따른 토지적성평가서의 내용\nㄹ. 부동산의 손실보상에 관한 사항: 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」 제68조에 따른 부동산의 보상 가격 내용\n\n① ㄱ, ㄴ\n② ㄱ, ㄷ\n③ ㄴ, ㄷ\n④ ㄴ, ㄹ\n⑤ ㄷ, ㄹ","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",2,0],[37,2026,22,10,4,"공간정보법","지번·지목·면적·경계","","공간정보의 구축 및 관리 등에 관한 법령상 지번의 부여방법 등에 관한 설명으로 옳은 것은?\n\n① 지번은 북동에서 남서로 순차적으로 부여한다.\n\n② 신규등록 및 등록전환의 경우에는 그 지번부여지역에서 인접토지의 본번에 부번을 붙여서 지번을 부여하는 것을 원칙으로 한다.\n\n③ 분할의 경우에는 분할 후의 필지 중 1필지의 지번은 분할 전의 지번으로 하고, 나머지 필지의 지번은 그 지번부여지역의 최종 본번의 다음 순번부터 본번으로 하여 순차적으로 부여한다.\n\n④ 합병의 경우에는 합병 전 필지의 면적이 큰 필지의 지번을 합병 후의 지번으로 부여하는 것을 원칙으로 한다.\n\n⑤ 도시개발사업 등이 준공되기 전에 사업시행자가 지번부여 신청을 할 경우 지적소관청은 지번을 부여할 수 없다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",2,0],[37,2026,22,11,4,"공간정보법","지적공부·부동산종합공부","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적공부와 등록사항의 연결이 틀린 것은?\n\n① 공유지연명부 - 소유권 지분, 토지의 고유번호\n\n② 대지권등록부 - 대지권 비율, 토지소유자가 변경된 날과 그 원인\n\n③ 경계점좌표등록부 - 좌표, 토지의 고유번호\n\n④ 지적도·임야도 - 경계, 건축물 및 구조물 등의 위치\n\n⑤ 토지대장·임야대장 - 토지의 이동사유, 소유권 지분","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",2,0],[37,2026,22,12,4,"공간정보법","지적측량·지적위원회","박스형(모두고르기)","공간정보의 구축 및 관리 등에 관한 법령상 지적확정측량을 실시한 지역의 각 필지에 새로 지번을 부여하는 방법을 준공하는 것을 모두 고른 것은?\nㄱ. 지번부여지역의 전부 또는 일부에 대하여 지번을 변경할 때\nㄴ. 지번부여지역의 일부가 행정구역이 개편되어 새로 지번을 부여할 때\nㄷ. 등록사항 정정 대상토지의 지번을 정정할 때\n\n① ㄱ\n② ㄴ\n③ ㄱ, ㄴ\n④ ㄴ, ㄷ\n⑤ ㄱ, ㄴ, ㄷ","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",2,0],[37,2026,22,13,4,"부동산등기법","등기부·등기기록·구분건물","","등기부 및 등기기록에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)\n\n① 등기부란 1필의 토지 또는 1개의 건물에 관한 등기정보자료를 말한다.\n\n② 대법원장의 위임을 받은 법원행정처장은 전자문서로 작성된 등기부 부속서류의 멸실방지에 필요한 처분을 명할 수 있다.\n\n③ 폐쇄한 등기기록은 20년 동안만 보존하면 된다.\n\n④ 부동산등기기록이 위법한 절차에 의하여 폐쇄된 경우, 소송의 방법으로 그 회복절차의 이행을 청구할 수 있다.\n\n⑤ 폐쇄한 등기기록에 대해서는 등기사항의 열람만 가능하고, 등기사항전부증명서의 발급은 청구할 수 없다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",2,0],[37,2026,22,14,4,"부동산등기법","등기부·등기기록·구분건물","박스형(모두고르기)","관련 사건의 등기소 관할에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 관할이 다른 여러 개의 부동산에 관한 전세권설정등기는 등기목적과 등기원인이 동일하면 그 중 하나의 관할 등기소에 일괄신청할 수 있다.\nㄴ. 동일한 채권에 관하여 소유자가 다른 여러 개의 부동산에 관한 권리를 목적으로 하는 공동저당권설정등기는 등기목적과 등기원인이 동일하면 관할이 달라도 그 중 하나의 관할 등기소에 일괄신청할 수 있다.\nㄷ. 공동저당 일부의 소멸에 관한 등기신청은 소멸되는 부동산의 관할 등기소 중 한 곳에 할 수 있다.\n\n① ㄱ\n② ㄴ\n③ ㄱ, ㄷ\n④ ㄴ, ㄷ\n⑤ ㄱ, ㄴ, ㄷ","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",2,0],[37,2026,22,15,4,"부동산등기법","등기부·등기기록·구분건물","박스형(모두고르기)","부동산등기법상 토지 등기기록의 표제부와 건물 등기기록의 표제부에 공통적으로 기록해야 하는 사항을 모두 고른 것은?\nㄱ. 접수연월일 ㄴ. 접수번호 ㄷ. 등기목적 ㄹ. 등기원인 ㅁ. 등기원인의 연월일\n\n① ㄱ, ㄹ\n② ㄴ, ㅁ\n③ ㄱ, ㄴ, ㄹ\n④ ㄴ, ㄷ, ㅁ\n⑤ ㄷ, ㄹ, ㅁ","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",2,0],[37,2026,22,16,4,"부동산등기법","등기신청(공동·단독·전자신청)","틀린것 고르기","전산정보처리조직을 이용한 등기신청(이하 '전자신청'이라 함)에 관한 설명으로 틀린 것은?\n\n① 자격자대리인이 아닌 사람은 당사자를 대리하여 전자신청을 할 수 없다.\n\n② 전자신청을 위한 최초의 사용자등록은 신청인의 주소지나 사무소 소재지 관할 이외의 등기소에서는 할 수 없다.\n\n③ 최초로 사용자등록을 신청하는 당사자 또는 자격자대리인은 등기소에 출석하여야 한다.\n\n④ 자격자대리인의 사용자등록의 유효기간은 3년이고, 유효기간 만료일 3개월 전부터 만료일까지 그 유효기간의 연장을 신청할 수 있다.\n\n⑤ 전자신청의 취하는 전산정보처리조직을 이용해서 하여야 한다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",3,0],[37,2026,22,17,4,"부동산등기법","부기·말소·회복·변경·경정 등기","틀린것 고르기","변경등기에 관한 설명으로 틀린 것은?\n\n① 부동산표시의 변경등기는 등기권리자와 등기의무자가 공동으로 신청하여야 한다.\n\n② 권리의 변경등기는 이에 관한 등기상 이해관계 있는 제3자의 승낙이 없는 경우에는 부기로 할 수 없다.\n\n③ 수탁자 해임의 재판을 한 법원은 지체 없이 등기소에 신탁원부 기록의 변경등기를 촉탁하여야 한다.\n\n④ 토지의 분할에 따른 표시변경등기를 신청하는 경우, 그 변경을 증명하는 첨부정보로서 토지대장 정보를 등기소에 제공하면 된다.\n\n⑤ 등기관은 수탁자의 변경으로 인한 신탁부동산의 이전등기를 할 경우에 직권으로 그 부동산에 관한 신탁원부 기록의 변경등기를 하여야 한다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",3,0],[37,2026,22,18,4,"부동산등기법","부기·말소·회복·변경·경정 등기","틀린것 고르기","부기등기에 관한 설명으로 틀린 것은?\n\n① 등기관이 공유물 분할금지의 약정등기를 할 때에는 부기로 해야 한다.\n\n② 등기관이 부기등기를 할 때에는 주등기 또는 부기등기의 순위번호에 가지번호를 붙여서 해야 한다.\n\n③ 부기등기의 순위는 주등기의 순위에 따르고, 같은 주등기에 관한 부기등기 상호간의 순위는 그 부기등기 순서에 따른다.\n\n④ 대지권을 등기한 후에 한 구분건물의 권리에 관한 등기는 건물만에 관한 것이라는 뜻의 부기등기가 있더라도 대지권에 대하여 동일한 등기로서 효력이 있다.\n\n⑤ 부동산등기법령에 따른 등기관의 처분에 관한 이의신청에 대하여 관할 지방법원이 결정을 하는 경우, 그 결정 전에 그 처분에 대하여 이의가 있다는 뜻의 부기등기를 등기관에게 명령할 수 있다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",3,0],[37,2026,22,19,4,"부동산등기법","등기 일반·효력","틀린것 고르기","부동산등기법상 등기할 수 있는 권리가 아닌 것은?\n\n① 지역권\n\n② 구분지상권\n\n③ 채권담보권\n\n④ 유치권\n\n⑤ 저당권부채권에 대한 질권","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",3,0],[37,2026,22,20,4,"부동산등기법","용익권·담보권 등기","틀린것 고르기","임차권등기에 관한 설명으로 틀린 것은?\n\n① 부동산임차권의 이전청구권 보전을 위한 가등기는 허용된다.\n\n② 상가건물의 임차권등기명령은 그 등기를 명하는 결정이 임대인에게 송달된 때에 효력이 발생한다.\n\n③ 임차권설정등기를 할 때에 등기원인에 차임지급시기가 있는 경우, 그 차임지급시기는 등기사항이다.\n\n④ 임차권등기명령에 의한 주택임차권등기가 마쳐진 경우, 그 등기에 기초한 임차권이전등기를 할 수 있다.\n\n⑤ 미등기 상가건물에 대하여 법원의 임차권등기명령에 의한 등기촉탁이 있는 경우, 등기관은 직권으로 소유권보존등기를 한 후 상가건물임차권등기를 해야 한다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",3,0],[37,2026,22,21,4,"부동산등기법","용익권·담보권 등기","틀린것 고르기","저당권 및 근저당권의 등기에 관한 설명으로 틀린 것은?\n\n① 저당권설정등기를 하는 경우, 변제기는 등기원인에 그에 관한 약정이 있는 경우에만 기록한다.\n\n② 피담보채권의 대위변제를 이유로 저당권의 일부이전등기를 하는 경우, 등기관은 그 변제액을 기록하여야 한다.\n\n③ 창설적으로 공동저당의 설정등기를 신청하는 경우에는 각 부동산에 관한 권리의 표시를 신청정보의 내용으로 등기소에 제공하여야 한다.\n\n④ 근저당권의 피담보채권이 확정되기 전에 그 피담보채권이 양도된 경우에는 이를 원인으로 하여 근저당이전등기를 신청할 수 없다.\n\n⑤ 근저당권설정등기를 함에 있어 그 근저당권의 채권자가 수인인 경우, 각 채권자별로 채권최고액을 구분하여 기록하여야 한다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",3,0],[37,2026,22,22,4,"부동산등기법","소유권 등기(보존·이전·신탁·공동소유)","","신탁등기에 관한 설명으로 옳은 것은?\n\n① 수탁자가 여러 명인 경우, 등기관은 신탁재산이 공유인 뜻을 기록하여야 한다.\n\n② 신탁재산에 속하는 부동산의 신탁등기는 신탁자와 수탁자가 공동으로 신청하여야 한다.\n\n③ 신탁종료로 인하여 신탁재산에 속한 권리가 소멸됨에 따라 신탁재산에 속하지 않게 된 경우, 수탁자는 단독으로 신탁등기의 말소등기를 신청할 수 있다.\n\n④ 신탁의 일부가 종료되어 권리이전등기와 함께 신탁등기의 변경등기를 할 때에는 각기 다른 순위번호를 사용하여야 한다.\n\n⑤ 신탁재산이 수탁자의 고유재산이 된 때에는 그 뜻의 등기를 부기등기로 하여야 한다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",3,0],[37,2026,22,23,4,"부동산등기법","가등기","틀린것 고르기","청구권 보전의 가등기에 관한 설명으로 틀린 것은?\n\n① 가등기에 의한 본등기 신청은 가등기 된 권리 중 일부 지분에 관해서도 할 수 있다.\n\n② 가등기에 기한 본등기가 마쳐진 후라도 그 가등기의 말소등기절차의 이행을 명하는 판결로서 본등기의 말소등기를 신청할 수 있다.\n\n③ 가등기권리자는 가등기를 명하는 법원의 가처분명령이 있을 때에는 단독으로 가등기를 신청할 수 있다.\n\n④ 가등기상의 권리를 제3자에게 양도하는 경우에는 양도인과 양수인이 공동으로 그 가등기상 권리의 이전등기를 신청할 수 있다.\n\n⑤ 저당권설정등기청구권 보전의 가등기에 의해 그 본등기를 한 경우, 그 가등기 후 본등기 전에 마쳐진 제3자 명의의 등기는 직권말소할 수 없다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",3,0],[37,2026,22,24,4,"부동산등기법","등기 일반·효력","박스형(모두고르기), 판례, 틀린것 고르기","가압류등기에 관한 설명으로 틀린 것을 모두 고른 것은? (다툼이 있으면 판례에 따름) ㄱ. 등기된 임차권에 대한 가압류등기는 허용되지 않는다. ㄴ. 가압류등기는 가압류채권자의 말소등기신청이 있는 경우에만 말소할 수 있다. ㄷ. 부동산에 대한 가압류가 본압류로 이행되어 본집행이 유효하게 존속하는 경우, 그 후에 이루어진 집행법원의 가압류등기 말소촉탁은 각하되어야 한다.\n① ㄱ\n② ㄷ\n③ ㄱ, ㄴ\n④ ㄴ, ㄷ\n⑤ ㄱ, ㄴ, ㄷ","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",4,0],[37,2026,22,25,5,"조세총론","조세총론(납세의무·부과·징수)","","국세기본법령상 이의신청·심사청구·심판청구에 관한 설명으로 옳은 것은?\n① 세법에 따른 처분으로서 위법한 처분에 대한 행정소송은 「국세기본법」에 따른 심사청구 또는 심판청구와 그에 대한 결정을 거치지 아니하더라도 제기할 수 있다.\n② 이의신청, 심사청구 또는 심판청구는 해당 처분의 집행에 효력을 미친다.\n③ 심판청구에 대한 결정이 있으면 해당 행정청은 결정의 취지에 따라 즉시 필요한 처분을 하여야 한다.\n④ 심사청구는 해당 처분이 있음을 안 날부터 6개월 이내에 제기하여야 한다.\n⑤ 국세청장은 심사청구에 대한 결정을 할 때 심사청구를 한 처분보다 청구인에게 불리한 결정을 할 수 있다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",4,0],[37,2026,22,26,5,"조세총론","조세총론(납세의무·부과·징수)","틀린것 고르기","지방세기본법령상 용어의 정의에 관한 설명으로 틀린 것은?\n① \"납세의무자\"란 「지방세법」에 따라 지방세를 납부할 의무가 있는 자와 지방세를 특별징수하여 납부할 의무가 있는 자를 말한다.\n② \"지방세\"란 특별시세, 광역시세, 특별자치시세, 도세, 특별자치도세 또는 시·군세, 구세(자치구의 구세를 말함)를 말한다.\n③ \"제2차 납세의무자\"란 납세자가 납세의무를 이행할 수 없는 경우에 납세자를 갈음하여 납세의무를 지는 자를 말한다.\n④ \"전자신고\"란 과세표준 신고서 등 「지방세기본법」이나 지방세관계법에 따른 신고 관련 서류를 지방세통합정보통신망 또는 연계정보통신망을 통하여 신고하는 것을 말한다.\n⑤ \"세무조사\"란 지방세의 부과·징수를 위하여 질문을 하거나 해당 장부·서류 또는 그 밖의 물건을 검사·조사하거나 그 제출을 명하는 활동을 말한다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",4,0],[37,2026,22,27,5,"취득세","취득세","","지방세법령상 취득세에 관한 설명으로 옳은 것은?\n① 납세의무자가 토지를 사실상 취득한 후 취득세를 신고하지 아니하고 매각하는 경우에는 산출세액에 100분의 40을 가산한 금액을 세액으로 하여 보통징수의 방법으로 징수한다.\n② 「주택법」 제2조제3호에 따른 공동주택의 개수(「건축법」 제2조제1항제9호에 따른 대수선을 포함)로 인한 취득에 대해서는 취득세를 부과하지 아니한다.\n③ 신축으로 주택과 주택 외의 건축물을 한꺼번에 취득한 경우에는 건축물의 전체 취득가액을 주택의 취득 당시의 가액으로 한다.\n④ 토지를 유상취득한 자는 그 취득한 날부터 90일 이내에 신고·납부하여야 한다.\n⑤ 토지의 지목변경에 따른 취득에서 토지의 지목변경일 이전에 사용하는 부분에 대해서는 그 사실상의 사용일을 취득일로 본다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",4,0],[37,2026,22,28,5,"조세총론","조세총론(납세의무·부과·징수)","박스형(모두고르기), 틀린것 고르기","지방세법령상 주택의 유상거래 취득에 대한 중과세율을 적용할 때 세대별 소유 주택 수에 가산하는 내용으로 틀린 것을 모두 고른 것은? ㄱ. 「신탁법」에 따라 신탁된 주택은 수탁자의 주택 수에 가산한다. ㄴ. 「부동산 거래신고 등에 관한 법률」 제3조제1항제2호에 따라 취득한 주택분양권은 해당 주택분양권을 소유한 자의 주택 수에 가산한다. ㄷ. 「지방세법」상 건축물로 과세하는 비주거용 오피스텔은 해당 오피스텔을 소유한 자의 주택 수에 가산한다. ㄹ. 「도시 및 주거환경정비법」 제74조에 따라 취득한 조합원입주권은 해당 주거용 건축물이 멸실된 경우라도 해당 조합원입주권 소유자의 주택 수에 가산한다.\n① ㄱ, ㄴ\n② ㄱ, ㄷ\n③ ㄱ, ㄹ\n④ ㄴ, ㄷ\n⑤ ㄷ, ㄹ","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",4,0],[37,2026,22,29,5,"재산세","재산세","","지방세법령상 재산세의 과세표준과 세율에 관한 설명으로 옳은 것은?(단, 지방세관계법령상 감면 및 특례는 고려하지 않음)\n① 주택이 아닌 건축물에 대한 과세표준은 시가표준액에 100분의 60(공정시장가액비율)을 곱하여 산정한 가액으로 한다.\n② 토지에 대한 과세표준은 개별공시지가로 한다.\n③ 지방자치단체의 장은 세율 조정이 불가피하다고 인정되는 경우 조례로 정하는 바에 따라 표준세율의 100분의 50의 범위에서 가감할 수 있으며, 가감한 세율은 3년간 적용한다.\n④ 특별시 지역에서 「국토의 계획 및 이용에 관한 법률」과 그 밖의 관계 법령에 따라 지정된 주거지역 및 해당 지방자치단체의 조례로 정하는 지역의 대통령령으로 정하는 공장용 건축물의 표준세율은 과세표준의 1천분의 5이다.\n⑤ 법령에 따른 고급오락장용 토지의 표준세율은 과세표준의 1천분의 50이다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",4,0],[37,2026,22,30,5,"취득세","취득세","박스형(모두고르기)","지방세법령상 취득세의 사실상취득가격에 포함하는 비용을 모두 고른 것은?\nㄱ. 「농지법」에 따른 농지보전부담금\nㄴ. 취득대금 외에 당사자의 약정에 따른 취득자 조건 부담액과 채무인수액\nㄷ. 이주비, 지장물 보상금 등 취득물건과는 별개의 권리에 관한 보상 성격으로 지급되는 비용\nㄹ. 취득에 필요한 용역을 제공받은 대가로 지급하는 용역비\nㅁ. 취득하는 물건의 판매를 위한 광고선전비\n\n① ㄱ, ㄴ, ㄷ\n\n② ㄱ, ㄴ, ㄹ\n\n③ ㄱ, ㄷ, ㅁ\n\n④ ㄴ, ㄹ, ㅁ\n\n⑤ ㄷ, ㄹ, ㅁ","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",5,0],[37,2026,22,31,5,"재산세","재산세","","지방세법령상 재산세에 관한 설명으로 옳은 것은? (단, 주어진 조건 외에는 고려하지 않음)\n\n① 해당 연도에 주택에 부과할 세액이 30만원인 경우에는 납기를 7월 16일부터 7월 31일까지로 하여 한꺼번에 부과·징수한다.\n\n② 과세대상인 건물을 구분함에 있어서 1구(構)의 건물이 주거와 주거 외의 용도로 사용되고 있는 경우, 주거용으로 사용되는 면적이 전체의 100분의 50 이상인 경우에는 주택으로 본다.\n\n③ 납세의무자는 재산세의 납부할 세액이 250만원 이하인 경우, 그 세액의 100분의 50 이하의 금액을 분할납부할 수 있다.\n\n④ 국가가 선수금을 받아 조성하는 매매용 토지로서 사실상 조성이 완료된 토지의 사용권을 무상으로 받은 자는 재산세를 납부할 의무가 없다.\n\n⑤ 「군사기지 및 군사시설 보호법」에 따른 군사기지 및 군사시설 보호구역 중 통제보호구역에 있는 전·답은 비과세 대상에 해당한다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",5,0],[37,2026,22,32,5,"등록면허세","등록면허세","","지방세법령상 등록면허세에 관한 설명으로 옳은 것은?\n\n① 부동산의 등록에 대한 등록면허세의 과세표준은 등록 당시의 신고가액으로 하며, 신고가액이 시가표준액보다 큰 경우에는 시가표준액으로 한다.\n\n② 등록 당시에 자산재평가의 사유로 가액이 달라진 경우 그 가액에 대한 증명과 관계없이 자산재평가 전의 가액을 과세표준으로 한다.\n\n③ 같은 채권의 담보를 위하여 설정하는 둘 이상의 저당권을 등록하는 경우에는 이를 하나의 등록으로 보아 그 등록에 관계되는 재산을 처음 등록하는 등록관청 소재지를 납세지로 한다.\n\n④ 등록을 하려는 자가 신고의무를 다하지 아니한 경우에도 등록면허세 산출세액을 등록하기 전까지 납부하였을 때에는 납부한 것으로 보며, 무신고가산세가 부과된다.\n\n⑤ 대도시 밖에 있는 법인의 본점이나 주사무소를 대도시로 전입함에 따른 등기를 할 때에는 법인 설립 등기에 대한 세율의 100분의 200을 적용한다.","12/2 발표 후 추가","1RgHuEQi7UFKGSCeZdN1Zqdck27xHeR7_",5,0],[37,2026,22,33,5,"종합부동산세","종합부동산세","틀린것 고르기","종합부동산세법령상 세액공제에 관한 설명으로 틀린 것은?\n\n① 연령에 따른 세액공제는 과세기준일 현재 만 65세 이상인 1세대 1주택자를 대상으로 하며 만 70세 이상의 공제액은 법정 산출세액에 100분의 30을 곱한 금액으로 한다.\n\n② 1세대 1주택자로서 보유기간에 따른 세액공제는 과세기준일 현재 해당 주택을 5년 이상 보유한 자에 한하여 법정 산출세액에 보유기간별 공제율을 곱한 금액으로 한다.\n\n③ 보유기간 관련 세액공제를 적용할 때 소실(燒失)·도괴(倒壞)·노후(老朽) 등으로 인하여 멸실되어 재건축 또는 재개발하는 주택에 대하여는 그 멸실된 function pickNext(pool,used){let best=null,bs=1e9;const mx=Math.max(...TH);
  for(const q of pool){if(used.has(q.id))continue;const r=P[q.id];let sc=Math.abs(pNow(q)-TG);
    if(r&&r[1]===1)sc+=.12;if(r&&r[1]===0)sc-=.04;if(!graded(q))sc+=.6;sc-=.03*(mx-TH[q.s]);sc+=Math.random()*.06;if(sc<bs){bs=sc;best=q}}
  return best}
function startAdaptive(pool,cnt,o){const used=new Set();const q=pickNext(pool,used);if(!q)return;startQuiz([q],{...o,ad:{pool,cnt}})}
function recentRate(){const a=RC.slice(-10);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*100):null}
/* ---------- 문제 풀이 ---------- */
let S=null,tick=null;
function startQuiz(list,o){if(!list.length)return;S={list,i:0,ans:{},ai:{},...o,end:o.exam?Date.now()+o.exam.sec*1000:0,done:false};clearInterval(tick);if(o.exam)tick=setInterval(()=>{const el=document.getElementById('tm');if(!el){return}const r=Math.max(0,S.end-Date.now());el.textContent=fmt(r);if(r<=0){clearInterval(tick);submitExam()}},1000);go('quiz')}
function fmt(ms){const s=ms/1000|0;return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function quiz(){
  const q=S.list[S.i],ex=!!S.exam&&!S.done,pick=S.ans[q.id];const ok=pick?isRight(q,pick):undefined;
  V.innerHTML=`<div class="qnav"><div class="row"><button class="btn sm" id="qx">✕</button><b class="grow" style="font-size:14px">${esc(S.title)}</b>${S.exam&&!S.done?`<span class="timer" id="tm">${fmt(S.end-Date.now())}</span>`:''}<span class="muted">${S.i+1}/${S.ad?(S.ad.cnt||'∞'):S.list.length}</span></div>
  <div class="bar" style="margin-top:6px"><i style="width:${S.ad?(S.ad.cnt?(S.i+1)/S.ad.cnt*100:100):(S.i+1)/S.list.length*100}%;background:var(--pri)"></i></div>
  ${S.ad?`<div class="muted" style="font-size:12px;margin-top:4px">${SUBS[q.s]} 내 수준 <b>Lv.${lvOf(TH[q.s]).toFixed(1)}</b> · 최근 10문제 정답률 <b>${recentRate()??'-'}%</b> · 목표 ${Math.round(TG*100)}%</div>`:''}</div>
  <div class="card"><div class="chips"><span class="chip">${SUB[q.s]}</span><span class="chip g">${esc(q.u)} › ${esc(q.t)}</span><span class="chip g">제${q.n}회 ${q.y} ${CT[q.ct]} ${q.no}번</span>${S.exam?'':`<span class="chip" title="난이도">난이도 ${stars(q)}</span>`}${q.ocr?'<span class="chip g">문자인식</span>':''}${EXC[q.id]&&EXC[q.id].warn?'<span class="chip warnc">⚠ 개정 주의</span>':''}</div>
  <div class="qtext">${esc(q.x)}</div>
  <div class="choices">${[1,2,3,4,5].map(c=>{let cl='';if(pick&&!ex){if(isRight(q,c))cl='ok';else if(c===pick)cl='no'}else if(c===pick)cl='pick';return `<button data-c="${c}" class="${cl}">${MARK[c-1]}</button>`}).join('')}</div>
  ${pick&&!ex?`<div class="fb ${ok===null?'na':ok?'ok':'no'}">${ok===null?'정답 미공개 문제예요 — 선택만 기록했어요':ok?'정답! ':'오답 — 정답 '+ansText(q)}${ok===true&&q.a.includes(',')?' (복수정답 '+ansText(q)+')':''}${q.a==='전항정답'?' (전항정답 처리된 문제)':''}<span style="font-weight:400;font-size:13px">${ok===null?'':srsNote(q)}</span></div>`:''}
  <div class="row" style="margin-top:12px"><button class="btn sm" id="qb">${BM[q.id]?'★ 북마크됨':'☆ 북마크'}</button><a class="btn sm" href="${pdf(q)}" target="_blank" rel="noopener">원본 PDF ${q.p?q.p+'쪽':''}</a>${!ex?`<button class="btn sm ${isCalc(q)?'pri':''}" id="qa">🤖 ${isCalc(q)?'계산 풀이':'AI 해설'}</button>${isCalc(q)?`<button class="btn sm" id="qv">🔁 숫자 바꿔 풀기</button>`:''}`:''}</div>
  ${S.ad&&pick?`<div class="row" style="margin-top:10px" id="tune"><span class="muted grow" style="font-size:13px">난이도 어때요?</span><button class="btn sm" data-d="1">😵 어려워요</button><button class="btn sm" data-d="0">👍 적당</button><button class="btn sm" data-d="-1">😴 쉬워요</button></div>`:''}
  <div id="aibox">${EXC[q.id]&&!ex?renderEx(EXC[q.id]):''}</div></div>
  <div class="row"><button class="btn grow" id="qp" ${S.i?'':'disabled'}>← 이전</button>${S.i<S.list.length-1||(S.ad&&(!S.ad.cnt||S.list.length<S.ad.cnt)&&S.ad.pool.some(x=>!S.list.includes(x)))?`<button class="btn pri grow" id="qn">다음 →</button>`:(S.exam&&!S.done?`<button class="btn pri grow" id="qs">제출하기</button>`:`<button class="btn pri grow" id="qf">결과 보기</button>`)}</div>
  ${S.exam?`<div class="card"><div class="muted">답안지 (번호를 누르면 이동)</div><div class="omr">${S.list.map((x,i)=>{const a=S.ans[x.id];let c=a?'d':'';if(S.done&&a){const r=isRight(x,a);c=r===false?'no':'ok'}return `<button data-i="${i}" class="${c} ${i===S.i?'cur':''}">${x.no}${a?'·'+a:''}</button>`}).join('')}</div></div>`:''}`;
  const $=id=>document.getElementById(id);
  V.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{const c=+b.dataset.c;if(!ex&&pick)return;S.ans[q.id]=c;if(!ex){record(q,c)}quiz();if(!ex&&isCalc(q)&&isRight(q,c)===false)explain(q);if(ex&&S.i<S.list.length-1)setTimeout(()=>{S.i++;quiz()},180)});
  $('qx').onclick=()=>{if(S.exam&&!S.done){openModal('모의고사를 그만둘까요?','지금까지 표시한 답은 저장되지 않아요.',[['계속 풀기',closeModal],['그만두기',()=>{closeModal();clearInterval(tick);go('exam')}]])}else go(S.from||'home')};
  $('qb').onclick=()=>{if(BM[q.id])delete BM[q.id];else BM[q.id]=1;touch('meta');quiz()};
  if($('qa'))$('qa').onclick=()=>explain(q);if($('qv'))$('qv').onclick=()=>go('variant',{q});
  $('qp').onclick=()=>{S.i--;quiz()};
  if($('qn'))$('qn').onclick=()=>{if(S.ad&&S.i===S.list.length-1){const nx=pickNext(S.ad.pool,new Set(S.list.map(x=>x.id)));if(!nx){go('result');return}S.list.push(nx)}S.i++;quiz()};
  if($('tune'))$('tune').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=+b.dataset.d;TG=Math.max(.5,Math.min(.9,TG+d*.07));TU=Date.now();touch('meta');
    $('tune').innerHTML=`<span class="muted" style="font-size:13px">${d>0?'다음 문제부터 조금 더 쉽게 낼게요':d<0?'다음 문제부터 조금 더 어렵게 낼게요':'지금 난이도를 유지할게요'} (목표 정답률 ${Math.round(TG*100)}%)</span>`};
  if($('qs'))$('qs').onclick=()=>{const left=S.list.filter(x=>!S.ans[x.id]).length;openModal('제출할까요?',left?`아직 ${left}문항을 안 풀었어요.`:'모든 문항에 답했어요.',[['더 풀기',closeModal],['제출',()=>{closeModal();submitExam()}]])};
  if($('qf'))$('qf').onclick=()=>go('result');
  V.querySelectorAll('.omr button').forEach(b=>b.onclick=()=>{S.i=+b.dataset.i;quiz()});
}
function submitExam(){if(!S||S.done)return;clearInterval(tick);S.done=true;S.doneAt=Date.now();S.list.forEach(q=>{if(S.ans[q.id])record(q,S.ans[q.id])});go('result')}
function result(){
  const L=S.list;const graded=L.filter(q=>/^[\d,]+$|전항/.test(q.a));
  let html='';
  if(S.exam){
    const groups=S.exam.ct===11?[['부동산학개론',q=>q.s===0],['민법 및 민사특별법',q=>q.s===1]]:S.exam.ct===21?[['중개사법령·실무',q=>q.s===2],['부동산공법',q=>q.s===3]]:[['공시법령·세법',q=>true]];
    const sc=groups.map(([n,fn])=>{const g=L.filter(fn);const ok=g.filter(q=>S.ans[q.id]&&isRight(q,S.ans[q.id])).length;return[n,g.length?Math.round(ok/g.length*1000)/10:0]});
    const can=graded.length===L.length;
    const avg=sc.reduce((a,b)=>a+b[1],0)/sc.length;const pass=can&&sc.every(x=>x[1]>=40)&&avg>=60;
    if(can){EX.push({ts:Date.now(),n:S.exam.n,ct:S.exam.ct,sc,pass});touch('meta')}
    html=`<div class="card"><h2>${esc(S.title)} 결과</h2>${can?sc.map(([n,v])=>`<div class="subj"><span class="nm">${n}</span><span class="sc" style="color:${color(v)}">${v}점</span><div class="bar"><i style="width:${v}%;background:${color(v)}"></i></div></div>`).join('')+`<div class="row" style="margin-top:10px"><span class="grow">평균 <b>${avg.toFixed(1)}</b>점</span><b class="${pass?'pass':'fail'}">${pass?'합격권 🎉':sc.some(x=>x[1]<40)?'과락 있음':'평균 60점 미달'}</b></div>
    <div class="muted" style="margin-top:6px">${S.exam.ct===11?'1차는 두 과목 모두 40점 이상, 평균 60점 이상이면 합격이에요.':S.exam.ct===22?'공시법·세법은 한 과목(40문항)으로 채점해요. 2차는 3과목 모두 40점 이상, 평균 60점 이상이어야 합격이에요.':'2차는 1·2교시 3과목 모두 40점 이상, 평균 60점 이상이어야 합격이에요.'}</div>`:'<div class="muted">정답이 아직 공개되지 않아 채점할 수 없어요. (12/2 이후 추가 예정)</div>'}</div>`;
  }else{
    const ok=graded.filter(q=>S.ans[q.id]&&isRight(q,S.ans[q.id])).length;const done=graded.filter(q=>S.ans[q.id]).length;
    html=`<div class="card"><h2>${esc(S.title)} 결과</h2><div class="big">${ok} <span class="muted">/ ${done} 정답</span></div><div class="muted">정답률 ${done?Math.round(ok/done*100):0}%</div></div>`;
  }
  const wr=L.filter(q=>S.ans[q.id]&&isRight(q,S.ans[q.id])===false);
  if(S.exam){const used=Math.max(0,Math.round(((S.exam.sec*1000)-(S.end-(S.doneAt||Date.now())))/60000));const un=L.filter(q=>!S.ans[q.id]).length;
    const wu={};wr.forEach(q=>{const k=SUBS[q.s]+' › '+q.u;wu[k]=(wu[k]||0)+1});const top=Object.entries(wu).sort((a,b)=>b[1]-a[1]).slice(0,5);
    html+=`<div class="card"><h2>📋 성적 분석</h2><div class="muted">걸린 시간 약 ${used}분 / ${Math.round(S.exam.sec/60)}분 · 맞힘 ${L.length-wr.length-un} · 틀림 ${wr.length} · 안 푼 문제 ${un}</div>${top.length?`<div class="exh" style="margin-top:10px">많이 틀린 단원</div>${top.map(([k,v])=>`<div class="row"><span class="grow">${esc(k)}</span><b class="fail">${v}문제</b></div>`).join('')}`:''}</div>`}
  V.innerHTML=html+`<div class="row"><button class="btn grow" id="rr">문제 다시 보기</button>${wr.length?`<button class="btn pri grow" id="rw">틀린 ${wr.length}문제 다시</button>`:''}</div>
  <div class="row" style="margin-top:8px"><button class="btn grow" id="rh">홈으로</button></div>`;
  document.getElementById('rr').onclick=()=>{S.i=0;go('quiz')};
  if(wr.length)document.getElementById('rw').onclick=()=>startQuiz(wr,{from:S.from,title:'틀린 문제 다시'});
  document.getElementById('rh').onclick=()=>go('home');
}

/* ---------- AI 해설 (구조화 + 도식) ---------- */
let sampleFn,EXC={};// EXC[qid]=해설 객체 캐시
const isCalc=q=>q.k.includes('계산');
async function getSample(){if(sampleFn===undefined){try{sampleFn=(window.claude&&claude.use)?await claude.use('sample'):null}catch(e){sampleFn=null}}return sampleFn}
async function loadEx(q){if(EXC[q.id])return EXC[q.id];try{const m=window.__mcx&&window.__mcx(q.id);if(m){EXC[q.id]=m;return m}}catch(e){}if(!db)return null;try{const sn=await db.collection('data/users/'+uid).doc('x'+q.id).get();if(sn.exists){EXC[q.id]=sn.data().e;return EXC[q.id]}}catch(e){}return null}
async function saveEx(q,e){EXC[q.id]=e;if(!db)return;try{await db.collection('data/users/'+uid).doc('x'+q.id).set({e,s:q.s,t:q.t,ts:Date.now()})}catch(err){}}
function exPrompt(q){const calc=isCalc(q);return `너는 한국 공인중개사 시험 1타 강사다. 아래 기출문제를 "그림과 식으로" 해설하라. 수험생은 계산 문제에 특히 약하다.
[출제] 제${q.n}회(${q.y}년) ${CT[q.ct]} ${q.no}번 / 과목: ${SUB[q.s]} / 단원·테마: ${q.u} · ${q.t} / 유형: ${q.k||'일반'}
[공식 정답] ${ansText(q)}
[문제 원문]${q.ocr?' (스캔 문자인식 결과라 오탈자·깨진 기호가 있음. 문맥으로 바로잡아 읽을 것)':''}
${q.x}

아래 JSON 하나만 출력하라(설명 문장 금지). 모든 문자열은 한국어.
{
 "summary": "이 문제의 핵심을 한 문장으로",
 "concept": "핵심 개념을 수험생이 처음 배우듯 4~6문장으로. 원리·요건·예외·관련 조문 취지까지",
 "formulas": [{"name":"공식 이름","tex":"수식","note":"언제 쓰는지 한 줄"}],
 "steps": [{"title":"단계 이름","tex":"수식 또는 숫자 대입식(없으면 빈 문자열)","say":"설명 1~2문장"}],
 "answer": "정답 보기 번호와 값 (예: ③ 2억 4천만원)",
 "choices": [{"no":1,"ox":"O 또는 X","why":"2~3문장. 맞는 보기는 근거를, 틀린 보기는 어느 부분이 왜 틀렸고 바른 내용이 무엇인지","bad":"틀린 보기면 보기 원문에서 틀린 부분을 글자 그대로(맞는 보기면 빈 문자열)","fix":"bad를 바르게 고친 말(맞는 보기면 빈 문자열)"}],
 "diagram": 아래 형식 중 이 문제를 가장 잘 보여주는 하나, 그림이 도움 안 되면 null,
 "diagram2": 계산 문제만 계산 한눈에 표(아니면 null),
 "memo": ["시험장에서 떠올릴 암기 포인트(두문자·숫자 위주) 2~4개"],
 "trap": "출제자가 노린 함정과 피하는 법 1~2문장",
 "warn": "출제 이후 법령 개정으로 지금은 답이 달라지는 내용이 있으면 설명, 없으면 빈 문자열"
}
수식(tex) 표기: 분수 \\frac{분자}{분모}, 거듭제곱 ^{n}, 아래첨자 _{i}, 곱하기 \\times, 나누기 \\div, 루트 \\sqrt{x}, 합 \\sum, 부등호 \\le \\ge, 화살표 \\rightarrow, 한글은 그대로. 금액은 "억·만원" 단위로 읽기 쉽게.
diagram 형식(필요한 것 하나만):
- 현금흐름·연금·감채기금·대출상환: {"type":"timeline","title":"","points":[{"t":"0","label":"","amount":"","dir":"in 또는 out"}]}
- 수요·공급·균형·탄력성: {"type":"curve","title":"","curves":[{"name":"D","kind":"demand 또는 supply","shift":"left, right 또는 none"}],"note":"가격·거래량 변화 한 줄"}
- 당사자 관계(甲乙丙, 등기·대리·임대차·저당 등): {"type":"flow","title":"","nodes":[{"id":"a","label":"甲","sub":"매도인"}],"edges":[{"from":"a","to":"b","label":"매매"}]}  (노드 2~6개)
- 금액 비교·배당 순서·세액 구성: {"type":"bar","title":"","unit":"억원","items":[{"label":"","value":숫자,"hl":true/false}]}
- 요건·기간·세율 등 비교 정리: {"type":"table","title":"","head":["",""],"rows":[["",""]]}
규칙: ${calc?'계산 문제다. diagram은 반드시 넣어라(null 금지): 甲乙丙 같은 당사자·권리·채권 관계가 있으면 flow, 없으면 금액 배분·비교는 bar, 기간·현금흐름은 timeline. 그리고 diagram2에 계산 한눈에 보기 표를 넣어라: {"type":"table","title":"계산 한눈에","head":["단계","식","값"],"rows":[["","",""]]} (steps와 같은 순서, 값은 단위까지). steps에 공식→숫자 대입→중간 계산→최종값을 한 단계씩 빠짐없이 적고(최소 3단계), 마지막 값이 공식 정답 보기와 정확히 일치하는지 스스로 검산하라. 일치하지 않으면 다시 풀어라. 계산기 없이 따라갈 수 있게 숫자를 쪼개라.':'계산이 없으면 formulas는 관련 법 요건·숫자(기간·비율)를 공식처럼 정리하고 steps는 판단 순서로 써라.'} choices는 ①~⑤ 다섯 개 모두. 확실하지 않은 조문 번호는 쓰지 마라.${/^[\d,]+$/.test(q.a)?'':' 공식 정답이 없으니 가장 유력한 답을 제시하고 answer 끝에 "(정답 미공개·추정)"이라 적어라.'}`}
function parseJSON(s){if(s&&typeof s==='object')return s;const m=String(s).match(/\{[\s\S]*\}/);if(!m)throw new Error('no json');return JSON.parse(m[0])}
async function explain(q){
  const box=document.getElementById('aibox');if(!box)return;
  const cached=await loadEx(q);if(cached){box.innerHTML=renderEx(cached);return}
  const sm=await getSample();
  if(!sm){box.innerHTML='<div class="ai">AI 해설은 claude.ai에서 이 페이지를 열었을 때만 쓸 수 있어요.</div>';return}
  box.innerHTML=`<div class="ai" id="aitxt"><div class="spin"></div>${isCalc(q)?'계산 과정을 한 단계씩 풀고 검산하는 중… (20~40초)':'해설과 도식을 정리하는 중…'}</div>`;
  const opts={modelTier:isCalc(q)?'complex':'default'};
  try{
    let e;
    try{e=sm.json?await sm.json(exPrompt(q),opts):parseJSON((await sm(exPrompt(q),opts)).text)}
    catch(err){if(err&&err.code)throw err;e=parseJSON((await sm(exPrompt(q)+'\n반드시 JSON 객체 하나만 출력.',opts)).text)}
    await saveEx(q,e);
    const b=document.getElementById('aibox');if(b&&S&&S.list[S.i]===q)b.innerHTML=renderEx(e);
  }catch(err){const el=document.getElementById('aitxt');if(el)el.textContent=err&&err.code==='quota'?err.message:err&&err.code==='not_granted'?'AI 해설 사용이 허용되지 않았어요.':err&&err.code==='rate_limited'?'잠시 후 다시 시도해 주세요.':'해설을 만들지 못했어요. 다시 눌러 주세요.'}
}

/* 미니 수식 렌더러: \frac{}{}, ^{}, _{}, \sqrt{}, 기호 */
const SYM={cap:'∩',cup:'∪',emptyset:'∅',varnothing:'∅',leftrightarrow:'↔',Leftrightarrow:'⇔',iff:'⇔',neg:'¬',lnot:'¬',in:'∈',notin:'∉',subset:'⊂',supset:'⊃',therefore:'∴',because:'∵',ldots:'…',cdots:'⋯',circ:'°',times:'×',div:'÷',cdot:'·',le:'≤',ge:'≥',leq:'≤',geq:'≥',neq:'≠',ne:'≠',approx:'≈',sum:'Σ',Sigma:'Σ',rightarrow:'→',to:'→',Rightarrow:'⇒',leftarrow:'←',pm:'±',infty:'∞',Delta:'Δ',delta:'δ',alpha:'α',beta:'β',sigma:'σ',mu:'μ',quad:'  ',qquad:'    ',left:'',right:'',percent:'%'};
function tex(s){s=String(s||'');let i=0;
  function grp(){while(s[i]===' ')i++;if(s[i]==='{'){i++;const r=seq('}');i++;return r}if(s[i]==='\\'){return cmd()}return esc(s[i++]||'')}
  function cmd(){i++;let n='';while(i<s.length&&/[a-zA-Z]/.test(s[i]))n+=s[i++];if(!n){const c=s[i++]||'';return esc(c==='%'?'%':c)}
    if(n==='frac'||n==='dfrac'||n==='tfrac'){const a=grp(),b=grp();return `<span class="fr"><span>${a}</span><span>${b}</span></span>`}
    if(n==='sqrt'){return `√<span class="ov">${grp()}</span>`}
    if(n==='text'||n==='mathrm'||n==='mathbf'||n==='textbf'){return grp()}
    return SYM[n]!==undefined?SYM[n]:esc(n)}
  function seq(end){let o='';while(i<s.length&&s[i]!==end){const c=s[i];
    if(c==='\\')o+=cmd();else if(c==='^'){i++;o+=`<sup>${grp()}</sup>`}else if(c==='_'){i++;o+=`<sub>${grp()}</sub>`}
    else if(c==='{'){i++;o+=seq('}');i++}else if(c==='$'){i++}else{o+=esc(c);i++}}return o}
  return seq(null)}

    const h=(a,f)=>{try{ms.setActionHandler(a,f)}catch(e){}};h('play',()=>oxResume());h('pause',()=>oxPause());h('nexttrack',()=>oxJump(1));h('previoustrack',()=>oxJump(-1));try{ms.playbackState='playing'}catch(e){}}}
let OXWL=null,OXNV=null;
async function oxWakeOn(){if(!OXP.wk)return;try{if(navigator.wakeLock&&!OXWL){OXWL=await navigator.wakeLock.request('screen');OXWL.addEventListener('release',()=>{OXWL=null});return}}catch(e){}
  try{if(!OXNV){const c=document.createElement('canvas');c.width=c.height=2;const g=c.getContext('2d');let k=0;setInterval(()=>{g.fillStyle=(k++%2)?'#000':'#111';g.fillRect(0,0,2,2)},1000);const v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.loop=true;v.srcObject=c.captureStream(1);v.style.cssText='position:fixed;width:1px;height:1px;opacity:0.01;bottom:0;left:0;pointer-events:none';document.body.appendChild(v);OXNV=v}OXNV.play().catch(()=>{})}catch(e){}}
function oxWakeOff(){try{OXWL&&OXWL.release()}catch(e){}OXWL=null;try{OXNV&&OXNV.pause()}catch(e){}}
function oxMediaOff(){oxWakeOff();OXAUP=true;try{OXAU&&OXAU.pause()}catch(e){}try{navigator.mediaSession.playbackState='paused'}catch(e){}}
function oxPause(auto){OXH=false;OXT++;stopSpeak();if(!auto)OXPAUSED=false;oxMediaOff();if(cur==='ox')ox()}
function oxResume(){if(OXP.m==='mn'&&MN&&MN.items)return mnPlay();if(OXR&&OXR.i<OXR.list.length)oxHands()}
function oxStopAll(){OXH=false;OXT++;OXPAUSED=false;stopSpeak();oxMediaOff()}
document.addEventListener('visibilitychange',()=>{if(cur!=='ox')return;if(document.hidden){if(OXH){OXPAUSED=true;oxPause(true)}}else if(OXPAUSED){OXPAUSED=false;setTimeout(()=>{if(cur==='ox'&&!OXH&&!document.hidden)oxResume()},1500)}});
function oxToggle(){if(OXH)return oxPause();if(OXP.m==='mn'){if(MN&&MN.items)return mnPlay();return oxStart(true)}if(!OXR||OXR.i>=OXR.list.length)return oxStart(true);oxHands()}
document.addEventListener('keydown',e=>{if(cur!=='ox'||(typeof AU!=='undefined'&&AU.el&&AU.ti>=0&&!OXH&&!OXR)||e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target;if(t&&/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))return;const k=e.key;
  if(k===' '||k==='Enter'||k==='MediaPlayPause'||k==='k'||k==='K'){e.preventDefault();oxToggle()}
  else if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k==='MediaTrackNext'){e.preventDefault();if(OXR||MN)oxJump(1)}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='MediaTrackPrevious'){e.preventDefault();if(OXR||MN)oxJump(-1)}});
function oxTimerUp(){if(OXSLEND&&Date.now()>OXSLEND){OXSLEND=0;oxPause();oxTalk('타이머가 끝났어요. 수고하셨어요.');return true}return false}

/* 문제 만들기 */
function buildOX(){OXQ=[];Q.forEach(q=>{if(q.ocr||!/^[1-5]$/.test(q.a)||q.k.includes('박스형')||isCalc(q))return;
  const x=q.x;const idx=[...'①②③④⑤'].map(m=>x.indexOf(m));if(idx.some(i=>i<0)||idx.some((v,i)=>i&&v<idx[i-1]))return;
  const stem=x.slice(0,idx[0]).trim();const neg=/틀린 것|옳지 않은 것|아닌 것|해당하지 않는|잘못된 것|부적절한 것/.test(stem.replace(/\s+/g,' '));const pos=/옳은 것|맞는 것|해당하는 것|적절한 것/.test(stem);if(!neg&&!pos)return;
  for(let i=0;i<5;i++){const s=x.slice(idx[i]+1,i<4?idx[i+1]:undefined).replace(/\s+/g,' ').trim();if(s.length<8||s.length>260)continue;const isAns=String(i+1)===q.a;OXQ.push({q,i,s,o:neg?!isAns:isAns,ctx:stem.replace(/\s+/g,' ').replace(/\(다툼이 있으면[^)]*\)/,'').slice(0,70)})}});if(window.oxVarAdd)oxVarAdd()}
const NUMRE=/\d+(?:[.,]\d+)?\s*(?:분의\s*\d+|개월|년|월|일|주|시간|%|퍼센트|배|명|인|층|㎡|제곱미터|억\s*원|억|만\s*원|원|세|회|필지)?/g;
function blankOf(o){if(!o.o)return null;for(const m of o.s.matchAll(NUMRE)){const p=o.s[m.index-1]||'';if(p==='제'||/^\d+(?:[.,]\d+)?$/.test(m[0].trim())||/^(19|20)\d\d\s*년/.test(m[0]))continue;return{pre:o.s.slice(0,m.index),ans:m[0].trim(),post:o.s.slice(m.index+m[0].length)}}return null}
function oxPool(){if(!OXQ)buildOX();const now=Date.now();let L=OXQ.filter(o=>OXP.sub===''||String(o.q.s)===OXP.sub);
  if(OXP.src==='review')L=L.filter(o=>{const e=OXSR[oxKey(o)];return e&&e.d<=now});else if(OXP.src==='check')L=L.filter(o=>OXC.includes(oxKey(o)));
  if(OXP.m==='blank')L=L.map(o=>{const b=blankOf(o);return b?Object.assign({},o,b):null}).filter(Boolean);
  return OXP.src==='all'?shuffle(L.slice()).slice(0,20):L.slice(0,60)}
async function oxStart(hands){OXSLEND=0;if(OXP.m==='mn'){await mnLoad(false);if(MN&&MN.items)mnPlay();return}
  const L=oxPool();OXR={list:L,i:0,ok:0,ans:null,show:false,exp:null,m:OXP.m,src:OXP.src};if(hands&&L.length)oxHands();else ox()}

/* 듣기 진행 */
async function oxHands(){if(!OXR)return;if(window.AU&&AU.el&&!AU.el.paused)AU.el.pause();const my=++OXT;OXH=true;OXPAUSED=false;oxMediaOn();if(OXP.sl&&!OXSLEND)OXSLEND=Date.now()+OXP.sl*60000;
  while(OXH&&my===OXT&&cur==='ox'){const R=OXR;if(R.i>=R.list.length)break;if(oxTimerUp())return;
    const o=R.list[R.i];R.ans=null;R.show=false;R.exp=null;ox();
    if(OXP.ex){oxWhyP(o);const nx=R.list[R.i+1];if(nx)oxWhyP(nx)}
    await oxChime();if(my!==OXT)return;
    if(R.m==='blank'){await oxTalk(`빈칸 문제. ${o.ctx.replace(/[?.\s]+$/,'')}.`);if(my!==OXT)return;if(o.pre.trim()){await oxTalk(o.pre);if(my!==OXT)return}await oxBeep();if(my!==OXT)return;await oxTalk(`${o.post.trim()} 빈칸에 들어갈 말은?`)}
    else await oxTalk(`${o.ctx.replace(/[?.\s]+$/,'')}. 지문. ${o.s.replace(/[.\s]+$/,'')}. 오일까요, 엑스일까요?`);
    if(my!==OXT)return;await oxSleep(3000);if(my!==OXT)return;
    R.show=true;ox();await oxTalk(R.m==='blank'?`정답은 ${o.ans}.`:`정답은 ${o.o?'오, 맞는 말':'엑스, 틀린 말'}이에요.`);if(my!==OXT)return;
    if(OXP.ex){const pr=oxWhyP(o);let w=await Promise.race([pr,oxSleep(1500).then(()=>'wait')]);if(my!==OXT)return;
      if(w==='wait'){R.exp={loading:true};ox();await oxTalk('해설을 준비하고 있어요.');if(my!==OXT)return;w=await Promise.race([pr,oxSleep(45000).then(()=>null)]);if(my!==OXT)return}
      if(w){const T=oxExpText(o,w,R.m);R.exp={text:T.show};ox();await oxTalk('해설. '+T.say);if(my!==OXT)return}else{R.exp=null;ox()}}
    if(OXP.sh&&(R.m==='blank'||o.o)){await oxTalk('따라 해 보세요. '+o.s);if(my!==OXT)return;await oxSleep(Math.max(2500,o.s.length*110));if(my!==OXT)return}
    if(R.src==='review')srsSet(oxKey(o),true);
    await oxSleep(1200);if(my!==OXT)return;R.i++}
  if(my===OXT){const fin=OXR.i>=OXR.list.length;OXH=false;oxMediaOff();ox();if(fin)oxTalk('한 판이 끝났어요. 수고하셨어요.')}}
function oxJump(d){const was=OXH;OXH=false;OXT++;stopSpeak();
  if(OXP.m==='mn'&&MN&&MN.items){MN.i=Math.max(0,Math.min(MN.items.length-1,MN.i+d));if(was)return mnPlay();oxMediaOff();return ox()}
  const R=OXR;if(!R)return;R.i=Math.max(0,Math.min(R.list.length,R.i+d));R.ans=null;R.show=false;R.exp=null;if(was&&R.i<R.list.length)oxHands();else{oxMediaOff();ox()}}

/* 지문 해설 */
async function oxWhy(o){if(o.v)return {why:(o.w||'')+(o.bad&&o.fix?` (바뀐 말: '${o.bad}' ↔ 원래 '${o.fix}')`:''),trap:'',memo:''};let e=await loadEx(o.q);
  if(!e){const sm=await getSample();if(!sm)throw new Error('AI 해설은 claude.ai에서 열었을 때만 쓸 수 있어요.');const opts={modelTier:'default'};
    try{e=sm.json?await sm.json(exPrompt(o.q),opts):parseJSON((await sm(exPrompt(o.q),opts)).text)}
    catch(err){if(err&&err.code)throw new Error(err.code==='rate_limited'?'잠시 후 다시 눌러 주세요.':'해설을 만들지 못했어요.');e=parseJSON((await sm(exPrompt(o.q)+'\n반드시 JSON 객체 하나만 출력.',opts)).text)}
    await saveEx(o.q,e)}
  const c=(Array.isArray(e.choices)?e.choices:[]).find(c=>+c.no===o.i+1);
  return {why:(c&&c.why)||e.concept||e.summary||'',trap:e.trap||'',memo:(Array.isArray(e.memo)?e.memo:[])[0]||''}}
const OXWP={};function oxWhyP(o){const k=oxKey(o);if(!OXWP[k])OXWP[k]=oxWhy(o).catch(()=>{delete OXWP[k];return null});return OXWP[k]}
function oxExpText(o,w,m){const head=m==='blank'?`정답은 ${o.ans}.`:`이 지문은 ${o.o?'O, 맞는 말':'X, 틀린 말'}이에요.`,body=`${w.why}${w.trap?' 함정: '+w.trap:''}${w.memo?' 암기: '+w.memo:''}`;return{show:head+' '+body,say:body}}
async function oxExplain(){const R=OXR;if(!R||R.i>=R.list.length||(R.exp&&R.exp.loading))return;const o=R.list[R.i],resume=OXH;OXH=false;OXT++;stopSpeak();const my=OXT;R.show=true;R.exp={loading:true};ox();
  try{const w=await oxWhy(o);if(my!==OXT||OXR!==R||R.list[R.i]!==o)return;
    const T=oxExpText(o,w,R.m);
    R.exp={text:T.show};ox();await oxTalk(T.show.replace('O, 맞는','오, 맞는').replace('X, 틀린','엑스, 틀린'));
    if(my!==OXT)return;if(resume){await oxSleep(1200);if(my!==OXT)return;R.i++;oxHands()}}
  catch(err){if(my!==OXT)return;R.exp={err:(err&&err.message)||'해설을 못 가져왔어요.'};ox()}}

/* 두문자 암기 */
function mnThemes(){const c={};Q.forEach(q=>{if(OXP.sub!==''&&String(q.s)!==OXP.sub)return;const k=q.s+'|'+q.t;c[k]=(c[k]||0)+1});
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k])=>{const j=k.indexOf('|');return{s:+k.slice(0,j),t:k.slice(j+1)}})}
async function mnLoad(force){const key='oxMN:'+OXP.sub;MN={key,items:null,i:0,loading:false,err:''};
  if(!force){try{const c=JSON.parse(localStorage.getItem(key)||'null');if(c&&c.length){MN.items=c;return ox()}}catch(e){}}
  const sm=await getSample();if(!sm){MN.err='두문자 대본은 claude.ai에서 열었을 때만 만들 수 있어요.';return ox()}
  MN.loading=true;ox();const th=mnThemes();
  const p=`너는 한국 공인중개사 시험 강사다. 아래 빈출 테마마다 귀로만 듣고 외울 수 있는 암기 대본을 써라.
각 테마는 3~5문장. 수험가에서 널리 쓰는 두문자(앞글자 암기법)가 있으면 소개하고, 없으면 새로 만들어 "직접 만든 두문자"라고 밝혀라. 핵심 요건·기간을 넣되, 법 개정으로 바뀌었을 수 있는 수치는 넣지 마라. 기호·괄호·마크다운 없이 말하듯 써라.
테마: ${th.map(x=>SUB[x.s]+' - '+x.t).join(' / ')}
JSON만 출력: {"items":[{"theme":"테마 이름","script":"대본"}]}`;
  try{let r;const opts={modelTier:'default'};try{r=sm.json?await sm.json(p,opts):parseJSON((await sm(p,opts)).text)}catch(err){if(err&&err.code)throw err;r=parseJSON((await sm(p+'\n반드시 JSON 객체 하나만 출력.',opts)).text)}
    MN.items=(Array.isArray(r.items)?r.items:[]).filter(x=>x&&x.script).slice(0,8);if(!MN.items.length)throw new Error('empty');try{localStorage.setItem(key,JSON.stringify(MN.items))}catch(e){}}
  catch(err){MN.items=null;MN.err=err&&err.code==='rate_limited'?'잠시 후 다시 시도해 주세요.':'대본을 만들지 못했어요. 다시 눌러 주세요.'}
  MN.loading=false;ox()}
async function mnPlay(){if(!MN||!MN.items)return;if(window.AU&&AU.el&&!AU.el.paused)AU.el.pause();const my=++OXT;OXH=true;OXPAUSED=false;oxMediaOn();if(OXP.sl&&!OXSLEND)OXSLEND=Date.now()+OXP.sl*60000;
  while(OXH&&my===OXT&&cur==='ox'&&MN.i<MN.items.length){if(oxTimerUp())return;
    const it=MN.items[MN.i];ox();await oxChime();if(my!==OXT)return;await oxTalk(it.theme+'. '+it.script);if(my!==OXT)return;
    await oxSleep(OXP.sh?4000:1200);if(my!==OXT)return;MN.i++}
  if(my===OXT){OXH=false;oxMediaOff();if(MN.i>=MN.items.length){MN.i=0;ox();oxTalk('암기 대본을 다 들었어요.')}else ox()}}

/* 화면 */
function oxSeg(id,opts,val){return `<div class="seg" id="${id}">${opts.map(([v,l])=>`<button data-v="${v}" class="${String(val)===String(v)?'on':''}">${l}</button>`).join('')}</div>`}
function oxCtrl(canPrev){return `<div class="card" style="display:flex;align-items:center;justify-content:center;gap:18px">
  <button class="btn" id="oxp" ${canPrev?'':'disabled'} style="font-size:20px;width:56px">⏮</button>
  <button class="btn pri" id="oxpp" style="font-size:24px;width:76px;height:60px;border-radius:30px">${OXH?'⏸':'▶'}</button>
  <button class="btn" id="oxnx" style="font-size:20px;width:56px">⏭</button></div>
  <div style="text-align:center"><button class="btn sm" id="oxhome" style="border:0;background:none;color:var(--sub)">그만하고 처음으로</button></div>`}
function ox(arg){if(arg&&arg.home){oxStopAll();OXR=null;MN=null;OXSLEND=0}
  if(!OXQ)buildOX();const top=backBar('🎧 귀로 듣기');
  if(OXP.m==='mn'&&MN)return oxMnView(top);
  if(!OXR)return oxSetup(top);
  oxSession(top)}

  <details class="card" id="oxset" ${OXDO?'open':''}><summary style="cursor:pointer;font-weight:500">⚙️ 듣기 설정</summary>
  <label class="f">목소리</label><button class="btn sm" id="oxvc">🗣 ${esc(oxVName())}</button>
  <label class="f">속도</label>${oxSeg('oxrt',[[0.9,'0.9x'],[1,'1x'],[1.2,'1.2x'],[1.4,'1.4x']],LST.rate||1)}
  <label class="f">해설도 듣기 (정답 뒤에 이유·함정을 자동으로 읽어요)</label>${oxSeg('oxex',[[0,'끄기'],[1,'켜기']],OXP.ex?1:0)}
  <label class="f">화면 꺼짐 방지 (듣는 동안)</label>${oxSeg('oxwk',[[0,'끄기'],[1,'켜기']],OXP.wk?1:0)}

  <div class="muted" style="font-size:12px;margin-top:10px">전화가 오거나 다른 앱을 열면 멈췄다가, 돌아오면 이어서 읽어요. 화면 꺼짐 방지가 안 되는 휴대폰이면 설정에서 '화면 자동 꺼짐' 시간을 늘려 주세요. 이어폰·블루투스 리모컨 버튼(재생·다음·이전)이나 키보드 스페이스(재생/멈춤)·방향키(이전/다음)로도 조작할 수 있어요. 오늘 복습: 틀리거나 ☆ 체크한 지문이 1·3·7·14·30일 뒤에 다시 나와요.</div></details>`;
  bindBack();if(typeof bindAudio==='function')bindAudio();const $=id=>document.getElementById(id),pick=(id,f)=>{const el=$(id);if(el)el.onclick=e=>{const b=e.target.closest('button');if(b){f(b.dataset.v);oxSave();ox()}}};
  pick('oxm',v=>OXP.m=v);pick('oxsrc',v=>OXP.src=v);pick('oxrt',v=>LST.rate=+v);pick('oxsh',v=>OXP.sh=v==='1');pick('oxsl',v=>OXP.sl=+v);pick('oxex',v=>OXP.ex=v==='1');pick('oxwk',v=>OXP.wk=v==='1');
  $('oxset').ontoggle=e=>{OXDO=e.target.open};$('oxsub').onchange=e=>{OXP.sub=e.target.value;oxSave()};$('oxvc').onclick=oxNextVoice;
  $('oxgo').onclick=()=>oxStart(true);const s=$('oxself');if(s)s.onclick=()=>oxStart(false)}

let VAR=null;
function varPrompt(q){return `너는 공인중개사 시험 출제위원이다. 아래 기출 계산 문제와 "같은 공식·같은 풀이 구조"로 숫자만 바꾼 새 문제를 만들어라. 수험생이 공식을 손에 익히는 연습용이다.
[원문제] 제${q.n}회(${q.y}) ${SUB[q.s]} · ${q.t} / 공식 정답 ${ansText(q)}
${q.x}

규칙: 숫자(금액·비율·기간)는 계산하기 깔끔하게 바꾸고, 정답 값이 원문제와 달라야 한다. 오답 보기 4개는 학생이 자주 하는 실수(공식 혼동, 단위 누락, 기초/기말 혼동 등)로 나온 값으로 만든다. 직접 끝까지 계산해 정답이 정확히 하나인지 검산하라. 원문제가 계산 문제가 아니면 같은 개념의 간단한 계산 문제를 새로 만들어라.
아래 JSON 하나만 출력:
{"question":"문제 전문(조건 포함)","choices":["보기1","보기2","보기3","보기4","보기5"],"answer":정답번호(1~5),
"formulas":[{"name":"","tex":"","note":""}],"steps":[{"title":"","tex":"숫자 대입식","say":""}],"memo":["암기 포인트"],"trap":"오답 보기가 나오는 실수"}
수식(tex): \\frac{a}{b}, ^{n}, \\times, \\div, \\sqrt{x}. steps는 공식→대입→중간값→최종값 최소 3단계.`}
async function variant(arg){
  let base=arg&&arg.q;if(!base&&VAR&&VAR.base&&!(arg&&arg.fresh))base=VAR.base;
  if(!base){const W=Q.filter(q=>isCalc(q)&&graded(q)&&!q.ocr&&P[q.id]&&P[q.id][1]===0);const L=W.length?W:Q.filter(q=>isCalc(q)&&graded(q)&&!q.ocr);base=L[Math.random()*L.length|0]}
  if(arg&&(arg.q||arg.fresh||arg.again)){VAR={base,data:null,pick:null,loading:true};genVariant()}
  else if(!VAR){VAR={base,data:null,pick:null,loading:true};genVariant()}
  renderVariant()}
async function genVariant(){const v=VAR;const sm=await getSample();if(!sm){v.err='계산 변형은 claude.ai에서 열었을 때만 쓸 수 있어요.';v.loading=false;if(cur==='variant')renderVariant();return}
  try{const d=await sm.json(varPrompt(v.base),{modelTier:'complex',cache:false});if(!d||!Array.isArray(d.choices)||d.choices.length<5)throw{code:'invalid_json'};v.data=d}
  catch(e){v.err=e&&e.code==='not_granted'?'AI 사용이 허용되지 않았어요.':e&&e.code==='rate_limited'?'잠시 후 다시 시도해 주세요.':e&&(e.code==='quota'||e.code==='no_key')?e.message:'문제를 만들지 못했어요. 다시 눌러 주세요.'}
  v.loading=false;if(cur==='variant'&&VAR===v)renderVariant()}
function renderVariant(){const v=VAR,b=v.base,d=v.data;
  V.innerHTML=backBar('🔁 계산 변형 연습')+`<div class="card"><div class="chips"><span class="chip">${SUB[b.s]}</span><span class="chip g">${esc(b.t)}</span><span class="chip g">원문제 제${b.n}회 ${b.no}번</span></div>
  ${v.loading?`<div class="ai"><div class="spin"></div>숫자를 바꾼 새 문제를 만들고 검산하는 중… (20~60초)</div>`:v.err?`<div class="ai">${esc(v.err)}</div>`:`<div class="qtext">${esc(d.question)}</div>
  <div class="vch">${d.choices.slice(0,5).map((c,i)=>{let cl='';if(v.pick){if(i+1===+d.answer)cl='ok';else if(i+1===v.pick)cl='no'}return `<button data-c="${i+1}" class="${cl}"><b>${MARK[i]}</b> ${tex(c)}</button>`}).join('')}</div>
  ${v.pick?`<div class="fb ${v.pick===+d.answer?'ok':'no'}">${v.pick===+d.answer?'정답! 공식이 손에 붙고 있어요':'오답 — 정답 '+MARK[d.answer-1]}</div>${renderEx({formulas:d.formulas,steps:d.steps,memo:d.memo,trap:d.trap})}`:''}`}
  <div class="row" style="margin-top:12px"><button class="btn grow" id="vo">원문제 보기</button><button class="btn pri grow" id="va" ${v.loading?'disabled':''}>🔁 숫자 또 바꾸기</button></div>
  <button class="btn full" style="margin-top:8px" id="vf" ${v.loading?'disabled':''}>다른 계산 문제로</button></div>`;
  bindBack();V.querySelectorAll('.vch button').forEach(x=>x.onclick=()=>{if(!v.pick){v.pick=+x.dataset.c;renderVariant()}});
  document.getElementById('vo').onclick=()=>startQuiz([b],{from:'home',title:'원문제'});
  document.getElementById('va').onclick=()=>variant({q:b});document.getElementById('vf').onclick=()=>{VAR=null;variant({fresh:true})}}

function texSay(s){return String(s||'').replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,'$2 분의 $1').replace(/\^\{?([^{}\s]+)\}?/g,' $1제곱').replace(/\\times/g,' 곱하기 ').replace(/\\div/g,' 나누기 ').replace(/\\sqrt\{([^{}]*)\}/g,'루트 $1').replace(/\\le|\\leq/g,' 이하 ').replace(/\\ge|\\geq/g,' 이상 ').replace(/\\[a-zA-Z]+/g,' ').replace(/[{}_$]/g,'').replace(/\s+/g,' ')}
function listenItems(){const t0=today0().getTime();let L;
  if(LST.src==='today')L=Q.filter(q=>P[q.id]&&P[q.id][4]>=t0-DAY);else if(LST.src==='wrong')L=Q.filter(q=>P[q.id]&&P[q.id][1]===0);else L=Q.filter(q=>EXC[q.id]&&(EXC[q.id].formulas||[]).length);

async function loadPhotos(){const el=document.getElementById('plist');if(!el)return;if(!db){el.innerHTML='<div class="muted">claude.ai에서 열면 저장돼요.</div>';return}
  try{const qs=await db.collection('data/users/'+uid).get();PH.items=qs.docs.filter(d=>d.id.startsWith('m')).map(d=>(d.data()||{}).m).filter(Boolean).sort((a,b)=>b.ts-a.ts);
    el.innerHTML=PH.items.length?PH.items.map((m,i)=>`<div class="it" data-i="${i}"><div class="chips"><span class="chip">${esc(m.subject||'')}</span><span class="chip g">${new Date(m.ts).toLocaleDateString('ko-KR')}</span></div><div class="t">${esc((m.question||'').slice(0,100))}</div></div>`).join(''):'<div class="muted">아직 없어요.</div>';
    el.querySelectorAll('.it').forEach(x=>x.onclick=()=>{PH.cur=PH.items[+x.dataset.i];document.getElementById('pout').innerHTML=photoView(PH.cur);window.scrollTo(0,0)})}catch(e){el.innerHTML='<div class="muted">불러오지 못했어요.</div>'}}

/* ---------- 모달 ---------- */
function openModal(t,m,btns){const M=document.getElementById('modal');M.innerHTML=`<div class="modal"><div class="card"><h2>${esc(t)}</h2><div class="muted">${esc(m)}</div><div class="row" style="margin-top:14px">${btns.map((b,i)=>`<button class="btn grow ${i===btns.length-1?'pri':''}" data-i="${i}">${esc(b[0])}</button>`).join('')}</div></div></div>`;M.querySelectorAll('button').forEach(b=>b.onclick=btns[+b.dataset.i][1])}
function closeModal(){document.getElementById('modal').innerHTML=''}

go('home');
</script>
