수자가 주도하는 시장에서 매도자가 주도하는 시장으로 바뀌는 경향이 있다.\n⑤ 안정시장 국면에서는 과거의 거래가격을 새로운 거래가격의 기준으로 활용하기 어렵다.","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",1,0],[33,2022,11,8,0,"경제론","수요·공급 결정요인·균형","","A지역 아파트시장에서 공급은 변화하지 않고 수요는 다음 조건과 같이 변화하였다. 이 경우 균형가격(ㄱ)과 균형거래량(ㄴ)의 변화는?(단, P는 가격, Q_D1, Q_D2는 수요량, Q_S는 공급량, X축은 수량, Y축은 가격을 나타내고, 가격과 수량의 단위는 무시하며, 주어진 조건에 한함)\n○ 수요함수: Q_D1 = 120 - 2P (변화 전) → Q_D2 = 120 - 3/2P (변화 후)\n○ 공급함수: Q_S = 2P - 20\n\n① ㄱ: 5 상승, ㄴ: 5 증가\n\n② ㄱ: 5 상승, ㄴ: 10 증가\n\n③ ㄱ: 10 상승, ㄴ: 10 증가\n\n④ ㄱ: 10 상승, ㄴ: 15 증가\n\n⑤ ㄱ: 15 상승, ㄴ: 15 증가","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",2,0],[33,2022,11,9,0,"시장론","부동산시장 일반","틀린것 고르기","부동산시장에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)\n① 부동산시장에서는 정보의 비대칭성으로 인해 부동산가 격의 왜곡현상이 나타나기도 한다.\n② 부동산시장은 장기보다 단기에서 공급의 가격탄력성이 크므로 단기 수급조절이 용이하다.\n③ 부동산시장은 규모, 유형, 품질 등에 따라 세분화 되고, 지역별로 구분되는 특성이 있다.\n④ 부동산시장에서는 일반적으로 매수인의 제안가격과 매도인의 요구가격 사이에서 가격이 형성된다.\n⑤ 부동산시장은 불완전하더라도 할당효율적일 수 있다.","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",2,0],[33,2022,11,10,0,"입지·지대이론","상업입지이론","박스형(모두고르기), 옳은것 고르기","허프(D. Huff)모형에 관한 설명으로 옳은 것을 모두고른 것은?(단, 다른 조건은 동일함)\nㄱ. 어떤 매장이 고객에게 주는 효용이 클수록 그 매장이 고객들에게 선택될 확률이 더 높아진 다는 공리에 바탕을 두고 있다.\nㄴ. 해당 매장을 방문하는 고객의 행동력은 방문하고자 하는 매장의 크기에 비례하고, 매장까 지의 거리에 반비례한다.\nㄷ. 공간(거리)마찰계수는 시장의 교통조건과 매장 물건의 특성에 따라 달라지는 값이며, 교통조건이 나빠지면 더 커진다.\nㄹ. 일반적으로 소비자는 가장 가까운 곳에서 상품을 선택하려는 경향이 있다.\nㅁ. 고정된 상권을 놓고 경쟁함으로써 제로섬\n(zero-sum)게임이 된다는 한계가 있다.\n① ㄱ, ㄴ ② ㄴ, ㄷ, ㄹ\n③ ㄷ, ㄹ, ㅁ ④ ㄱ, ㄴ, ㄷ, ㅁ\n⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ 2022년 제33회 공인중개","전항정답","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",2,0],[33,2022,11,11,0,"입지·지대이론","상업입지이론","","다음 설명에 모두 해당하는 입지이론은?\n○ 인간정주체계의 분포원리와 상업입지의 계층체 계를 설명하고 있다.\n○ 재화의 도달거리와 최소요구치와의 관계를 설명하는 것으로 최소요구치가 재화의 도달범위 내에 있을 때 판매자의 존속을 위한 최소한의 상권 범위가 된다.\n○ 고객의 다목적 구매행동, 고객의 지역 간 문화적 차이를 반영하지 않았다는 비판이 있다.\n① 애플바움(W. Applebaum)의 소비자분포기법\n② 레일리(W. Reilly)의 소매중력모형\n③ 버제스(E. Burgess)의 동심원이론\n④ 컨버스(P. Converse)의 분기점 모형\n⑤ 크리스탈러(W. Christaller)의 중심지이론","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",2,0],[33,2022,11,12,0,"감정평가론","가치·가격원칙·지역분석","계산","대형마트가 개발된다는 다음과 같은 정보가 있을 때 합리적인 투자자가 최대한 지불할 수 있는 이 정보의 현재가치는?(단, 주어진 조건에 한함)\n○ 대형마트 개발예정지 인근에 일단의 A토지가 있다.\n○ 2년 후 대형마트가 개발될 가능성은 45%로 알려져 있다.\n○ 2년 후 대형마트가 개발되면 A토지의 가격은 12억 1,000만원, 개발되지 않으면 4억 8,400만원으로 예상된다.\n○ 투자자의 요구수익률(할인율)은 연 10%이다.\n① 3억 1,000만원 ② 3억 2,000만원 ③ 3억 3,000만원\n④ 3억 4,000만원 ⑤ 3억 5,000만원","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",2,0],[33,2022,11,13,0,"입지·지대이론","상업입지이론","옳은것 고르기","다음 설명에 모두 해당하는 것은?\n○ 서로 다른 지대곡선을 가진 농산물들이 입지경쟁을 벌이면서 각 지점에 따라 가장 높은 지대를 지불하는 농업적 토지이용에 토지가 할당된다.\n○ 농산물 생산활동의 입지경쟁 과정에서 토지이용이 할당되어 지대가 결정되는데, 이를 입찰지대라 한다.\n○ 중심지에 가까울수록 집약 농업이 입지하고, 교외로 갈수록 조방 농업이 입지한다.\n① 튀넨(J.H.von Thünen)의 위치지대설\n② 마샬(A. Marshall)의 준지대설\n③ 리카도(D. Ricardo)의 차액지대설\n④ 마르크스(K. Marx)의 절대지대설\n⑤ 파레토(V. Pareto)의 경제지대론","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",2,0],[33,2022,11,14,0,"입지·지대이론","상업입지이론","계산","레일리(W. Reilly)의 소매중력모형에 따라 C신도시의 소비자가 A도시와 B도시에서 소비하는 월 추정소비 액은 각각 얼마인가?(단, C신도시의 인구는 모두 소 비자이고, A, B도시에서만 소비하는 것으로 가정함)\n○ A도시 인구: 50,000명, B도시 인구: 32,000명\n○ C신도시: A도시와 B도시 사이에 위치\n○ A도시와 C신도시 간의 거리: 5km\n○ B도시와 C신도시 간의 거리: 2km\n○ C신도시 소비자의 잠재 월 추정소비액: 10억원\n① A도시: 1억원, B도시: 9억원\n② A도시: 1억 5천만원, B도시: 8억 5천만원\n③ A도시: 2억원, B도시: 8억원\n④ A도시: 2억 5천만원, B도시: 7억 5천만원\n⑤ A도시: 3억원, B도시: 7억원","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",3,0],[33,2022,11,15,0,"입지·지대이론","도시공간구조이론","박스형(모두고르기), 옳은것 고르기","다음 입지 및 도시공간구조 이론에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 베버(A. Weber)의 최소비용이론은 산업입지의 영향요소를 운송비, 노동비, 집적이익으로 구분하고, 이 요소들을 고려하여 비용이 최소화 되는 지점이 공장의 최적입지가 된다는 것이다.\nㄴ. 뢰시(A. Lösch)의 최대수요이론은 장소에 따라 수요가 차별적이라는 전제하에 수요측면에서 경제활동의 공간조직과 상권조직을 파악한 것이다.\nㄷ. 넬슨(R. Nelson)의 소매입지이론은 특정 점포가 최대 이익을 얻을 수 있는 매출액을 확보하기 위해서는 어떤 장소에 입지하여야 하는가에 대한 원칙을 제시한 것이다.\nㄹ. 해리스(C. Harris)와 울만(E. Ullman)의 다핵심이론은 단일의 중심업무지구를 핵으로 하여 발달하는 것이 아니라, 몇 개의 분리된 핵이 점진적으로 통합됨에 따라 전체적인 도시구조가 형성된다는 것이다.\n① ㄱ, ㄴ ② ㄷ, ㄹ ③ ㄱ, ㄴ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",3,0],[33,2022,11,16,0,"정책론","토지정책·지역지구제","박스형(모두고르기)","국토의 계획 및 이용에 관한 법령상 용도지역으로서 도시지역에 속하는 것을 모두 고른 것은?\nㄱ. 농림지역 ㄴ. 관리지역 ㄷ. 취락지역\nㄹ. 녹지지역 ㅁ. 산업지역 ㅂ. 유보지역\n① ㄹ ② ㄷ, ㅁ ③ ㄹ, ㅁ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄴ, ㄷ, ㅂ 2022년 제33회 공인중개","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",3,0],[33,2022,11,17,0,"금융론","유동화·MBS·리츠·PF","옳은것 고르기, 빈칸","부동산투자회사법령상 ( )에 들어갈 내용으로 옳은 것은?\n○ ( ㄱ ) 부동산투자회사: 자산운용 전문인력을 포함한 임직원을 상근으로 두고 자산의 투자ㆍ운용을 직접 수행하는 회사\n○ ( ㄴ ) 부동산투자회사: 자산의 투자ㆍ운용을 자산관리회사에 위탁하는 회사\n① ㄱ: 자치관리, ㄴ: 위탁관리\n② ㄱ: 자치관리, ㄴ: 간접관리\n③ ㄱ: 자기관리, ㄴ: 위탁관리\n④ ㄱ: 자기관리, ㄴ: 간접관리\n⑤ ㄱ: 직접관리, ㄴ: 간접관리","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",3,0],[33,2022,11,18,0,"정책론","토지정책·지역지구제","옳은것 고르기","부동산정책과 관련된 설명으로 옳은 것은?\n① 분양가상한제와 택지소유상한제는 현재 시행되고 있다.\n② 토지비축제도(토지은행)와 부동산가격공시제도는 정부가 간접적으로 부동산시장에 개입하는 수단이다.\n③ 법령상 개발부담금제가 재건축부담금제보다 먼저 도입 되었다.\n④ 주택시장의 지표로서 PIR(Price to Income Ratio)은 개인의 주택지불능력을 나타내며, 그 값이 클수록 주택구 매가 더 쉽다는 의미다.\n⑤ 부동산실명제의 근거 법률은 ｢부동산등기법｣이다.","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",3,0],[33,2022,11,19,0,"감정평가론","가치·가격원칙·지역분석","박스형(모두고르기), 옳은것 고르기","부동산조세에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 양도소득세와 부가가치세는 국세에 속한다.\nㄴ. 취득세와 등록면허세는 지방세에 속한다.\nㄷ. 상속세와 재산세는 부동산의 취득단계에 부과한다.\nㄹ. 증여세와 종합부동산세는 부동산의 보유단계에 부과한다.\n① ㄱ ② ㄱ, ㄴ ③ ㄴ, ㄹ\n④ ㄱ, ㄷ, ㄹ ⑤ ㄴ, ㄷ, ㄹ","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",3,0],[33,2022,11,20,0,"부동산의 개념·특성","부동산 개념·특성·분류","","건축물 A의 현황이 다음과 같을 경우, 건축법령상 용도별 건축물의 종류는?\n○ 층수가 4층인 1개 동의 건축물로서 지하층과 필로티 구조는 없음\n○ 전체 층을 주택으로 쓰며, 주택으로 쓰는 바닥면적의 합계가 600m2임\n○ 세대수 합계는 8세대로서 모든 세대에 취사시 설이 설치됨\n① 기숙사 ② 다중주택 ③ 연립주택\n④ 다가구주택 ⑤ 다세대주택","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",3,0],[33,2022,11,21,0,"투자론","현금흐름·수익률·위험","틀린것 고르기","부동산투자에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)\n① 투자자는 부동산의 자산가치와 운영수익의 극대화를 위해 효과적인 자산관리 운영전략을 수립할 필요가 있다.\n② 금리상승은 투자자의 요구수익률을 상승시키는 요인이다.\n③ 동일 투자자산이라도 개별투자자가 위험을 기피할수록 요구수익률이 높아진다.\n④ 민감도분석을 통해 미래의 투자환경 변화에 따른 투자 가치의 영향을 검토할 수 있다.\n⑤ 순현재가치는 투자자의 내부수익률로 할인한 현금유입의 현가에서 현금유출의 현가를 뺀 값이다.","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",4,0],[33,2022,11,22,0,"투자론","현금흐름·수익률·위험","틀린것 고르기","포트폴리오이론에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)\n① 개별자산의 기대수익률 간 상관계수가 “0”인 두 개의 자산으로 포트폴리오를 구성할 때 포트폴리오의 위험감소 효과가 최대로 나타난다.\n② 포트폴리오의 기대수익률은 개별자산의 기대수익률을 가중평균하여 구한다.\n③ 동일한 자산들로 포트폴리오를 구성하여도 개별자산의 투자비중에 따라 포트폴리오의 기대수익률과 분산은 다를 수 있다.\n④ 무차별곡선은 투자자에게 동일한 효용을 주는 수익과 위험의 조합을 나타낸 곡선이다.\n⑤ 최적 포트폴리오의 선정은 투자자의 위험에 대한 태도에 따라 달라질 수 있다.","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",4,0],[33,2022,11,23,0,"감정평가론","감정평가 3방식·시산가액","틀린것 고르기","자본환원율에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)\n① 자본환원율은 시장추출법, 조성법, 투자결합법 등을 통해 구할 수 있다.\n② 자본환원율은 자본의 기회비용을 반영하며, 금리의 상승은 자본환원율을 높이는 요인이 된다.\n③ 순영업소득(NOI)이 일정할 때 투자수요의 증가로 인한 자산가격 상승은 자본환원율을 높이는 요인이 된다.\n④ 투자위험의 감소는 자본환원율을 낮추는 요인이 된다.\n⑤ 부동산시장이 균형을 이루더라도 자산의 유형, 위치 등 특성에 따라 자본환원율이 서로 다른 부동산들이 존재할 수 있다.","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",4,0],[33,2022,11,24,0,"투자론","현금흐름·수익률·위험","틀린것 고르기","부동산투자의 분석기법에 관한 설명으로 틀린 것은?\n(단, 다른 조건은 동일함)\n① 수익률법과 승수법은 투자현금흐름의 시간가치를 반영하여 투자타당성을 분석하는 방법이다.\n② 투자자산의 현금흐름에 따라 복수의 내부수익률이 존재할 수 있다. 2022년 제33회 공인중개\n③ 세후지분투자수익률은 지분투자액에 대한 세후현금흐름의 비율이다.\n④ 투자의 타당성은 총투자액 또는 지분투자액을 기준으로 분석할 수 있으며, 총소득승수는 총투자액을 기준으로 분석하는 지표다.\n⑤ 총부채상환비율(DTI)이 높을수록 채무불이행 위험이 높아진다.","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",4,0],[33,2022,11,25,0,"투자론","투자분석기법(NPV·IRR 등)","계산","다음 자료를 활용하여 산정한 대상 부동산의 순소득승수는?(단, 주어진 조건에 한함)\n○ 총투자액: 10,000만원\n○ 지분투자액: 6,000만원\n○ 가능총소득(PGI): 1,100만원/년\n○ 유효총소득(EGI): 1,000만원/년\n○ 영업비용(OE): 500만원/년\n○ 부채서비스액(DS): 260만원/년\n○ 영업소득세: 120만원/년\n① 6 ② 9 ③ 10 ④ 12 ⑤ 20","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",4,0],[33,2022,11,26,0,"금융론","대출 상환방식·대출한도","계산","부동산투자에서 ( ㄱ )타인자본을 40% 활용하는 경우와 ( ㄴ )타인자본을 활용하지 않는 경우, 각각의 1년간 자기자본수익률(%)은?(단, 주어진 조건에 한함)\n○ 부동산 매입가격: 20,000만원\n○ 1년 후 부동산 처분\n○ 순영업소득(NOI): 연 700만원(기간 말 발생)\n○ 보유기간 동안 부동산가격 상승률: 연 3%\n○ 대출조건: 이자율 연 5%, 대출기간 1년, 원리금은 만기일시상환\n① ㄱ: 7.0, ㄴ: 6.0 ② ㄱ: 7.0, ㄴ: 6.5\n③ ㄱ: 7.5, ㄴ: 6.0 ④ ㄱ: 7.5, ㄴ: 6.5\n⑤ ㄱ: 7.5, ㄴ: 7.0","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",4,0],[33,2022,11,27,0,"금융론","부동산금융 일반·주택금융","틀린것 고르기","주택금융에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)\n① 정부는 주택소비금융의 확대와 금리인하, 대출규제의 완화로 주택가격의 급격한 상승에 대처한다.\n② 주택소비금융은 주택구입능력을 제고시켜 자가주택 소유를 촉진시킬 수 있다.\n③ 주택자금대출의 확대는 주택거래를 활성화 시킬 수 있다.\n④ 주택금융은 주택과 같은 거주용 부동산을 매입 또는 임대하는데 필요한 자금조달을 위한 금융상품을 포괄한다.\n⑤ 주택도시기금은 국민주택의 건설이나 국민주택규모 이하의 주택 구입에 출자 또는 융자할 수 있다.","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",4,0],[33,2022,11,28,0,"금융론","부동산금융 일반·주택금융","","주택연금(주택담보노후연금) 관련 법령상 주택연금의 보증기관은?\n① 한국부동산원 ② 신용보증기금\n③ 주택도시보증공사 ④ 한국토지주택공사\n⑤ 한국주택금융공사","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",5,0],[33,2022,11,29,0,"금융론","대출 상환방식·대출한도","계산","A씨는 원리금균등분할상환조건으로 1억원을 대출받았\n다. 은행의 대출조건이 다음과 같을 때, 대출 후 5년이 지난 시점에 남아있는 대출잔액은?(단, 만원 단위 미만은 절사하며, 주어진 조건에 한함)\n○ 대출금리: 고정금리, 연 5%\n○ 총 대출기간과 상환주기: 30년, 월말 분할상환\n○ 월별 원리금지급액: 54만원\n○ 기간이 30년인 저당상수: 0.0054\n○ 기간이 25년인 연금의 현가계수: 171.06\n① 8,333만원 ② 8,500만원 ③ 8,750만원\n④ 9,237만원 ⑤ 9,310만원","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",5,0],[33,2022,11,30,0,"금융론","대출 상환방식·대출한도","옳은것 고르기","대출조건이 동일할 경우 대출상환방식별 대출채권의 가중평균상환기간(duration)이 짧은 기간에서 긴 기간의 순서로 옳은 것은?\nㄱ. 원금균등분할상환\nㄴ. 원리금균등분할상환\nㄷ. 만기일시상환\n① ㄱ → ㄴ → ㄷ ② ㄱ → ㄷ → ㄴ\n③ ㄴ → ㄱ → ㄷ ④ ㄴ → ㄷ → ㄱ\n⑤ ㄷ → ㄴ → ㄱ","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",5,0],[33,2022,11,31,0,"금융론","유동화·MBS·리츠·PF","틀린것 고르기","자산유동화에 관한 법령에 규정된 내용으로 틀린 것은?\n① 유동화자산이라 함은 자산유동화의 대상이 되는 채권ㆍ부동산 기타의 재산권을 말한다.\n② 양도인은 유동화자산에 대한 반환청구권을 가지지 아니한다.\n③ 유동화자산의 양도는 매매 또는 교환에 의한다.\n④ 유동화전문회사는 유한회사로 한다.\n⑤ PF 자산담보부 기업어음(ABCP)의 반복적인 유동화는 금융감독원에 등록한 자산유동화계획의 기재내용대로 수행하여야 한다.","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",5,0],[33,2022,11,32,0,"정책론","주택·임대료 정책","틀린것 고르기","공공주택 특별법령상 공공임대주택에 해당하지 않는 것은?\n① 영구임대주택 ② 국민임대주택\n③ 분양전환공공임대주택 ④ 공공지원민간임대주택\n⑤ 기존주택등매입임대주택 2022년 제33회 공인중개","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",5,0],[33,2022,11,33,0,"개발·관리·마케팅","부동산마케팅","틀린것 고르기","부동산마케팅 전략에 관한 설명으로 틀린 것은?\n① 시장점유 전략은 수요자 측면의 접근으로 목표시장을 선점하거나 점유율을 높이는 것을 말한다.\n② 적응가격 전략이란 동일하거나 유사한 제품으로 다양한 수요자들의 구매를 유입하고, 구매량을 늘리도록 유도하기 위하여 가격을 다르게 하여 판매하는 것을 말한다.\n③ 마케팅믹스란 기업의 부동산 상품이 표적시장에 도달하기 위해 이용하는 마케팅에 관련된 여러 요소들의 조합을 말한다.\n④ 시장세분화 전략이란 수요자 집단을 인구ㆍ경제적 특성에 따라 세분하고, 세분된 시장에서 상품의 판매지향점을 분명히 하는 것을 말한다.\n⑤ 고객점유 전략은 소비자의 구매의사결정 과정의 각 단 계에서 소비자와의 심리적인 접점을 마련하고 전달하려는 정보의 취지와 강약을 조절하는 것을 말한다.","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",5,0],[33,2022,11,34,0,"개발·관리·마케팅","부동산관리","","다음 설명에 모두 해당하는 부동산관리방식은?\n○ 관리의 전문성과 효율성을 제고할 수 있다.\n○ 건물설비의 고도화에 대응할 수 있다.\n○ 전문업자의 관리서비스를 받을 수 있다.\n○ 대형건물의 관리에 더 유용하다.\n○ 기밀유지에 어려움이 있다.\n① 자치관리방식 ② 위탁관리방식 ③ 공공관리방식\n④ 조합관리방식 ⑤ 직영관리방식","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",5,0],[33,2022,11,35,0,"감정평가론","감정평가 3방식·시산가액","박스형(모두고르기), 옳은것 고르기","감가수정에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 감가수정과 관련된 내용연수는 경제적 내용연수가 아닌 물리적 내용연수를 의미한다.\nㄴ. 대상물건에 대한 재조달원가를 감액할 요인이 있는 경우에는 물리적 감가, 기능적 감가, 경제적 감가 등을 고려한다.\nㄷ. 감가수정방법에는 내용연수법, 관찰감가법, 분해 법 등이 있다.\nㄹ. 내용연수법으로는 정액법, 정률법, 상환기금법이 있다.\nㅁ. 정률법은 매년 일정한 감가율을 곱하여 감가액을 구하는 방법으로 매년 감가액이 일정하다.\n① ㄱ, ㄴ ② ㄴ, ㄷ ③ ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄷ, ㄹ, ㅁ","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",5,0],[33,2022,11,36,0,"감정평가론","감정평가에 관한 규칙","틀린것 고르기","감정평가에 관한 규칙상 시장가치기준에 관한 설명으로 틀린 것은?\n① 대상물건에 대한 감정평가액은 원칙적으로 시장가치를 기준으로 결정한다.\n② 감정평가법인등은 법령에 다른 규정이 있는 경우에는 대상물건의 감정평가액을 시장가치 외의 가치를 기준으로 결정할 수 있다.\n③ 감정평가법인등은 대상물건의 특성에 비추어 사회통념상 필요하다고 인정되는 경우에는 대상물건의 감정평가액을 시장가치 외의 가치를 기준으로 결정할 수 있다.\n④ 감정평가법인등은 감정평가 의뢰인이 요청하여 시장가치 외의 가치를 기준으로 감정평가할 때에는 해당 시장가치 외의 가치의 성격과 특징을 검토하지 않는다.\n⑤ 감정평가법인등은 시장가치 외의 가치를 기준으로 하는 감정평가의 합리성 및 적법성이 결여(缺如)되었다고 판단할 때에는 의뢰를 거부하거나 수임(受任)을 철회할 수 있다.","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",6,0],[33,2022,11,37,0,"감정평가론","감정평가 3방식·시산가액","계산","다음 자료를 활용하여 산정한 대상부동산의 수익가액은?(단, 연간 기준이며, 주어진 조건에 한함)\n○가능총소득(PGI): 44,000,000원\n○공실손실상당액 및 대손충당금: 가능총소득의 10%\n○운영경비(OE): 가능총소득의 2.5%\n○대상부동산의 가치구성비율 : 토지(60%), 건물(40%)\n○토지환원율: 5%, 건물환원율: 10%\n○환원방법: 직접환원법\n○환원율 산정방법: 물리적 투자결합법\n① 396,000,000원 ② 440,000,000원 ③ 550,000,000원\n④ 770,000,000원 ⑤ 792,000,000원","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",6,0],[33,2022,11,38,0,"감정평가론","부동산가격공시","","부동산 가격공시에 관한 법령에 규정된 내용으로 옳은 것은?\n① 국토교통부장관이 표준지공시지가를 조사ㆍ평가할 때에는 반드시 둘 이상의 감정평가법인등에게 의뢰하여야 한다.\n② 표준지공시지가의 공시에는 표준지의 지번, 표준지의 단위면적당 가격, 표준지의 면적 및 형상, 표준지 및 주 변토지의 이용상황, 그 밖에 대통령령으로 정하는 사항이 포함되어야 한다.\n③ 국토교통부장관은 표준주택에 대하여 매년 공시기준일 현재 적정가격을 조사ㆍ산정하고, 시ㆍ군ㆍ구부동산가 격공시위원회의 심의를 거쳐 이를 공시하여야 한다.\n④ 국토교통부장관은 표준주택가격을 조사ㆍ산정하고자 할 때에는 감정평가법인등 또는 한국부동산원에 의뢰한다.\n⑤ 표준공동주택가격은 개별공동주택가격을 산정하는 경우에 그 기준이 된다. 2022년 제33회 공인중개","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",6,0],[33,2022,11,39,0,"감정평가론","감정평가 3방식·시산가액","계산","다음 자료를 활용하여 거래사례비교법으로 산정한 토지의 비준가액은?(단, 주어진 조건에 한함)\n○ 대상토지: A시 B구 C동 350번지, 150m2(면적), 대(지목), 주상용(이용상황), 제2종일반주거지역(용도지역)\n○ 기준시점: 2022.10.29.\n○ 거래사례\n- 소재지: A시 B구 C동 340번지\n- 200m2(면적), 대(지목), 주상용(이용상황)\n- 제2종일반주거지역(용도지역)\n- 거래가격: 800,000,000원\n- 거래시점: 2022.06.01.\n○ 사정보정치: 0.9\n○ 지가변동률(A시 B구, 2022.06.01.～2022.10.29.) : 주거지역 5% 상승, 상업지역 4% 상승\n○ 지역요인: 거래사례와 동일\n○ 개별요인: 거래사례에 비해 5% 열세\n○ 상승식으로 계산\n① 533,520,000원 ② 538,650,000원 ③ 592,800,000원\n④ 595,350,000원 ⑤ 598,500,000원","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",6,0],[33,2022,11,40,0,"감정평가론","감정평가에 관한 규칙","틀린것 고르기","감정평가에 관한 규칙에 규정된 내용으로 틀린 것은?\n① 기준시점이란 대상물건의 감정평가액을 결정하는 기준이 되는 날짜를 말한다.\n② 하나의 대상물건이라도 가치를 달리하는 부분은 이를 구분하여 감정평가할 수 있다.\n③ 거래사례비교법은 감정평가방식 중 비교방식에 해당되나, 공시지가기준법은 비교방식에 해당되지 않는다.\n④ 감정평가법인등은 대상물건별로 정한 감정평가방법(이하 “주된 방법”이라 함)을 적용하여 감정평가하되, 주된 방법을 적용하는 것이 곤란하거나 부적절한 경우에는 다른 감정평가방법을 적용할 수 있다.\n⑤ 감정평가법인등은 감정평가서를 감정평가 의뢰인과 이 해관계자가 이해할 수 있도록 명확하고 일관성 있게 작성해야 한다.","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",6,0],[33,2022,11,41,1,"민법총칙","법률행위(반사회·불공정)","옳은것 고르기","상대방 없는 단독행위에 해당하는 것은?\n① 착오로 인한 계약의 취소\n② 무권대리로 체결된 계약에 대한 본인의 추인\n③ 미성년자의 법률행위에 대한 법정대리인의 동의\n④ 손자에 대한 부동산의 유증\n⑤ 이행불능으로 인한 계약의 해제","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",7,0],[33,2022,11,42,1,"민법총칙","무효·취소·추인","판례","다음 중 무효인 법률행위는?(다툼이 있으면 판례에 따름)\n① 개업공인중개사가 임대인으로서 직접 중개의뢰인과 체결한 주택임대차계약\n② 공인중개사 자격이 없는 자가 우연히 1회성으로 행한 중개행위에 대한 적정한 수준의 수수료 약정\n③ 민사사건에서 변호사와 의뢰인 사이에 체결된 적정한 수준의 성공보수약정\n④ 매도인이 실수로 상가지역을 그보다 가격이 비싼 상업지역이라 칭하였고, 부동산 거래의 경험이 없는 매수인이 이를 믿고서 실제 가격보다 2배 높은 대금을 지급한 매매계약\n⑤ 보험계약자가 오로지 보험사고를 가장하여 보험금을 취득할 목적으로 선의의 보험자와 체결한 생명보험계약","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",7,0],[33,2022,11,43,1,"민법총칙","의사표시(착오·사기·통정허위)","판례, 옳은것 고르기","통정허위표시(민법 제108조)에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 통정허위표시는 표의자가 의식적으로 진의와 다른 표시를 한다는 것을 상대방이 알았다면 성립한다.\n② 가장행위가 무효이면 당연히 은닉행위도 무효이다.\n③ 대리인이 본인 몰래 대리권의 범위 안에서 상대방과 통정허위표시를 한 경우, 본인은 선의의 제3자로서 그 유효를 주장할 수 있다.\n④ 민법 제108조제2항에 따라 보호받는 선의의 제3자에 대해서는 그 누구도 통정허위표시의 무효로써 대항할 수 없다.\n⑤ 가장소비대차에 따른 대여금채권의 선의의 양수인은 민법 제108조제2항에 따라 보호받는 제3자가 아니다. 2022년 제33회 공인중개","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",7,0],[33,2022,11,44,1,"민법총칙","무효·취소·추인","박스형(모두고르기), 판례, 옳은것 고르기","토지거래허가구역 내의 토지에 대한 매매계약이 체결된 경우(유동적 무효)에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 해약금으로서 계약금만 지급된 상태에서 당사자가 관할관청에 허가를 신청하였다면 이는 이행의 착수이므로 더 이상 계약금에 기한 해제는 허용되지 않는다.\nㄴ. 당사자 일방이 토지거래허가 신청절차에 협력할 의무를 이행하지 않는다면 다른 일방은 그 이행을 소구할 수 있다.\nㄷ. 매도인의 채무가 이행불능임이 명백하고 매수인도 거래의 존속을 바라지 않는 경우, 위 매매계약은 확정적 무효로 된다.\nㄹ. 위 매매계약 후 토지거래허가구역 지정이 해제되었다고 해도 그 계약은 여전히 유동적 무효이다.\n① ㄱ, ㄴ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",7,0],[33,2022,11,45,1,"민법총칙","무효·취소·추인","판례, 틀린것 고르기","법률행위의 취소에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 제한능력자가 제한능력을 이유로 자신의 법률행위를 취소하기 위해서는 법정대리인의 동의를 받아야 한다.\n② 취소권은 추인할 수 있는 날로부터 3년 내에, 법률행위를 한 날로부터 10년 내에 행사하여야 한다.\n③ 취소된 법률행위는 특별한 사정이 없는 한 처음부터 무효인 것으로 본다.\n④ 제한능력을 이유로 법률행위가 취소된 경우, 제한능력자는 그 법률행위에 의해 받은 급부를 이익이 현존하는 한도에서 상환할 책임이 있다.\n⑤ 취소할 수 있는 법률행위에 대해 취소권자가 적법하게 추인하면 그의 취소권은 소멸한다.","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",7,0],[33,2022,11,46,1,"민법총칙","조건·기한","틀린것 고르기","조건에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 조건성취의 효력은 특별한 사정이 없는 한 소급하지 않는다.\n② 해제조건이 선량한 풍속 기타 사회질서에 위반한 것인 때에는 특별한 사정이 없는 한 조건 없는 법률행위로 된다.\n③ 정지조건과 이행기로서의 불확정기한은 표시된 사실이 발생하지 않는 것으로 확정된 때에 채무를 이행하여야 하는지 여부로 구별될 수 있다.\n④ 이행지체의 경우 채권자는 상당한 기간을 정한 최고와 함께 그 기간 내에 이행이 없을 것을 정지조건으로 하여 계약을 해제할 수 있다.\n⑤ 신의성실에 반하는 방해로 말미암아 조건이 성취된 것으로 의제되는 경우, 성취의 의제시점은 그 방해가 없 었더라면 조건이 성취되었으리라고 추산되는 시점이다.","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",7,0],[33,2022,11,47,1,"민법총칙","대리(무권대리·표현대리)","판례, 틀린것 고르기","甲은 그 소유의 X건물을 매도하기 위하여 乙에게 대리권을 수여하였다. 이에 관한 설명으로 틀린 것은?\n(다툼이 있으면 판례에 따름)\n① 乙이 사망하면 특별한 사정이 없는 한 乙의 상속인에게 그 대리권이 승계된다.\n② 乙은 특별한 사정이 없는 한 X건물의 매매계약에서 약정한 중도금이나 잔금을 수령할 수 있다.\n③ 甲의 수권행위는 묵시적인 의사표시에 의하여도 할 수 있다.\n④ 乙이 대리행위를 하기 전에 甲이 그 수권행위를 철회한 경우, 특별한 사정이 없는 한 乙의 대리권은 소멸한다.\n⑤ 乙은 甲의 허락이 있으면 甲을 대리하여 자신을 X건물의 매수인으로 하는 계약을 체결할 수 있다.","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",8,0],[33,2022,11,48,1,"민법총칙","대리(무권대리·표현대리)","판례, 옳은것 고르기","민법상 대리에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 임의대리인이 수인(數人)인 경우, 대리인은 원칙적으로 공동으로 대리해야 한다.\n② 대리행위의 하자로 인한 취소권은 원칙적으로 대리인에게 귀속된다.\n③ 대리인을 통한 부동산거래에서 상대방 앞으로 소유권이전등기가 마쳐진 경우, 대리권 유무에 대한 증명책임은 대리행위의 유효를 주장하는 상대방에게 있다.\n④ 복대리인은 대리인이 자신의 이름으로 선임한 대리인의 대리인이다.\n⑤ 법정대리인은 특별한 사정이 없는 한 그 책임으로 복대리인을 선임할 수 있다.","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",8,0],[33,2022,11,49,1,"민법총칙","대리(무권대리·표현대리)","판례, 옳은것 고르기","권한을 넘은 표현대리에 관한 설명으로 옳은 것은?\n(다툼이 있으면 판례에 따름)\n① 기본대리권이 처음부터 존재하지 않는 경우에도 표현대리는 성립할 수 있다.\n② 복임권이 없는 대리인이 선임한 복대리인의 권한은 기본대리권이 될 수 없다.\n③ 대리행위가 강행규정을 위반하여 무효인 경우에도 표현대리는 성립할 수 있다.\n④ 법정대리권을 기본대리권으로 하는 표현대리는 성립할 수 없다.\n⑤ 상대방이 대리인에게 대리권이 있다고 믿을 만한 정당한 이유가 있는지의 여부는 대리행위 당시를 기준으로 판정한다.","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",8,0],[33,2022,11,50,1,"민법총칙","대리(무권대리·표현대리)","판례, 틀린것 고르기","대리권 없는 甲은 乙 소유의 X부동산에 관하여 乙을 대리하여 丙과 매매계약을 체결하였고, 丙은 甲이 무권대리인이라는 사실에 대하여 선의ㆍ무과실이었다. 이에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름) 2022년 제33회 공인중개\n① 丙이 乙에 대하여 상당한 기간을 정하여 추인여부를 최고하였으나 그 기간 내에 乙이 확답을 발하지 않은 때에는 乙이 추인한 것으로 본다.\n② 乙이 甲에 대해서만 추인의 의사표시를 하였더라도 丙 은 乙의 甲에 대한 추인이 있었음을 주장할 수 있다.\n③ 乙이 甲에게 매매계약을 추인하더라도 그 사실을 알지 못하고 있는 丙은 매매계약을 철회할 수 있다.\n④ 乙이 丙에 대하여 추인하면 특별한 사정이 없는 한, 추인은 매매계약 체결 시에 소급하여 그 효력이 생긴다.\n⑤ 乙이 丙에게 추인을 거절한 경우, 甲이 제한능력자가 아니라면 甲은 丙의 선택에 따라 계약을 이행할 책임 또는 손해를 배상할 책임이 있다.","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",8,0],[33,2022,11,51,1,"물권법","점유권","박스형(모두고르기)","토지를 점유할 수 있는 물권을 모두 고른 것은?\nㄱ. 전세권 ㄴ. 지상권\nㄷ. 저당권 ㄹ. 임차권\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄹ\n④ ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",8,0],[33,2022,11,52,1,"물권법","점유권","옳은것 고르기","점유에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 제3자가 직접점유자의 점유를 방해한 경우, 특별한 사정이 없는 한 간접점유자에게는 점유권에 기한 방해배 제청구권이 인정되지 않는다.\n② 취득시효의 요건인 점유에는 간접점유가 포함되지 않는다.\n③ 소유권의 시효취득을 주장하는 점유자는 특별한 사정이 없는 한 자신의 점유가 자주점유에 해당함을 증명하여야 한다.\n④ 선의의 점유자가 본권에 관한 소에 패소한 경우, 그 자는 패소가 확정된 때부터 악의의 점유자로 본다.\n⑤ 양도인이 등기부상의 명의인과 동일인이며 그 명의를 의 심할 만한 특별한 사정이 없는 경우, 그 부동산을 양수하여 인도받은 자는 과실(過失) 없는 점유자에 해당한다.","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",8,0],[33,2022,11,53,1,"민법총칙","조건·기한","판례, 옳은것 고르기","물권적 청구권에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 지상권을 설정한 토지의 소유자는 그 토지 일부의 불법점유자에 대하여 소유권에 기한 방해배제를 청구할 수 없다.\nㄴ. 토지의 소유권을 양도하여 소유권을 상실한 전(前) 소유자도 그 토지 일부의 불법점유자에 대하여 소유권에 기한 방해배제를 청구할 수 있다.\nㄷ. 소유자는 자신의 소유권을 방해할 염려있는 행위를 하는 자에 대하여 그 예방이나 손해배상의 담보를 청구할 수 있다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",8,0],[33,2022,11,54,1,"물권법","점유권","판례, 옳은것 고르기","점유자와 회복자의 관계에 관한 설명으로 옳은 것은?\n(다툼이 있으면 판례에 따름)\n① 악의의 점유자가 점유물의 과실을 수취하여 소비한 경우, 특별한 사정이 없는 한 그 점유자는 그 과실의 대가를 보상하여야 한다.\n② 은비(隱秘)에 의한 점유자는 점유물의 과실을 수취할 권리가 있다.\n③ 점유물의 전부가 점유자의 책임있는 사유로 멸실된 경우, 선의의 자주점유자는 특별한 사정이 없는 한 그 멸실로 인한 손해의 전부를 배상해야 한다.\n④ 점유자는 특별한 사정이 없는 한 회복자가 점유물의 반환을 청구하기 전에도 그 점유물의 반환 없이 그 회복자에게 유익비상환청구권을 행사할 수 있다.\n⑤ 악의의 점유자는 특별한 사정이 없는 한 점유물에 지출한 통상의 필요비의 상환을 청구할 수 없다.","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",9,0],[33,2022,11,55,1,"물권법","소유권(취득시효·부합·상린)","박스형(모두고르기), 판례, 옳은것 고르기","민법상 상린관계에 관한 설명으로 옳은 것을 모두고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 토지 주변의 소음이 사회통념상 수인한도를 넘지 않은 경우에도 그 토지소유자는 소유권에 기하여 소음피해의 제거를 청구할 수 있다.\nㄴ. 우물을 파는 경우에 경계로부터 2미터 이상의 거리를 두어야 하지만, 당사자 사이에 이와 다른 특약이 있으면 그 특약이 우선한다.\nㄷ. 토지소유자가 부담하는 자연유수의 승수의무\n(承水義務)에는 적극적으로 그 자연유수의 소 통을 유지할 의무가 포함된다.\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄴ ⑤ ㄴ, ㄷ","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",9,0],[33,2022,11,56,1,"물권법","소유권(취득시효·부합·상린)","판례, 옳은것 고르기","소유권의 취득에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 저당권 실행을 위한 경매절차에서 매수인이 된 자가 매각부동산의 소유권을 취득하기 위해서는 소유권이전등기를 완료하여야 한다.\n② 무주(無主)의 부동산을 점유한 자연인은 그 부동산의 소유권을 즉시 취득한다.\n③ 점유취득시효에 따른 부동산소유권 취득의 효력은 시효취득자가 이전등기를 한 이후부터 발생한다.\n④ 타인의 토지에서 발견된 매장물은 특별한 사정이 없는 한 발견자가 단독으로 그 소유권을 취득한다.\n⑤ 타주점유자는 자신이 점유하는 부동산에 대한 소유권을 시효취득할 수 없다.","3,5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",9,0],[33,2022,11,57,1,"민법총칙","무효·취소·추인","판례, 옳은것 고르기","민법상 공동소유에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 공유자끼리 그 지분을 교환하는 것은 지분권의 처분이 므로 이를 위해서는 교환당사자가 아닌 다른 공유자의 동의가 필요하다. 2022년 제33회 공인중개\n② 부동산 공유자 중 일부가 자신의 공유지분을 포기한 경우, 등기를 하지 않아도 공유지분 포기에 따른 물권변동의 효력이 발생한다.\n③ 합유자 중 1인은 다른 합유자의 동의 없이 자신의 지분을 단독으로 제3자에게 유효하게 매도할 수 있다.\n④ 합유물에 관하여 경료된 원인 무효의 소유권이전등기의 말소를 구하는 소는 합유자 각자가 제기할 수 있다.\n⑤ 법인 아닌 종중이 그 소유 토지의 매매를 중개한 중개업자에게 중개수수료를 지급하기로 하는 약정을 체결하는 것은 총유물의 관리ㆍ처분행위에 해당한다.","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",9,0],[33,2022,11,58,1,"민법총칙","법률행위(반사회·불공정)","판례","1필의 토지의 일부를 객체로 할 수 없는 권리는?(다툼이 있으면 판례에 따름)\n① 저당권 ② 전세권 ③ 지상권\n④ 임차권 ⑤ 점유권","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",9,0],[33,2022,11,59,1,"물권법","저당권·근저당권","판례, 옳은것 고르기, 계산","8. 1. 甲은 乙에게 2억 원(대여기간 1년, 이자 월 1.5%)을 대여하면서 乙 소유 X토지(가액 3억 원)에 근저당권(채권최고액 2억 5천만 원)을 취득하였고, 2020. 7. 1. 丙은 乙에게 1억 원(대여기간 1년, 이자 월 1%)을 대여하면서 X토지에 2번 근저당권(채권최고액 1억 5천만 원)을 취득하였다. 甲과 丙이 변제를 받지 못한 상황에서 丙이 2022. 6. 1. X토지에 관해 근저당권 실행을 위한 경매를 신청하면서 배당을 요구한 경우, 이에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 2022. 6. 1. 甲의 근저당권의 피담보채권액은 확정되지 않는다.\nㄴ. 甲에게 2022. 6. 1. 이후에 발생한 지연이자는 채권최고액의 범위 내라도 근저당권에 의해 담보되지 않는다.\nㄷ. 甲이 한 번도 이자를 받은 바 없고 X토지가 3억 원에 경매되었다면 甲은 경매대가에서 3억 원을 변제받는다.\n\n\n① ㄱ\n\n② ㄴ\n\n③ ㄱ, ㄷ\n\n④ ㄴ, ㄷ\n\n⑤ ㄱ, ㄴ, ㄷ","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",9,0],[33,2022,11,60,1,"민법총칙","조건·기한","박스형(모두고르기), 판례","법률에 특별한 규정 또는 설정행위에 다른 약정이 없는 경우, 저당권의 우선변제적 효력이 미치는 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 토지에 저당권이 설정된 후 그 토지 위에 완공된 건물\nㄴ. 토지에 저당권이 설정된 후 토지소유자가 그 토지에 매설한 유류저장탱크\nㄷ. 저당토지가 저당권 실행으로 압류된 후 그 토지에 관하여 발생한 저당권설정자의 차임채권\nㄹ. 토지에 저당권이 설정된 후 토지의 전세권자가 그 토지에 식재하고 등기한 입목\n① ㄴ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄱ, ㄷ, ㄹ ⑤ ㄴ, ㄷ, ㄹ","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",9,0],[33,2022,11,61,1,"물권법","유치권","판례, 옳은것 고르기","민법상 유치권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 유치권자는 유치물에 대한 경매신청권이 없다.\n② 유치권자는 유치물의 과실인 금전을 수취하여 다른 채권보다 먼저 피담보채권의 변제에 충당할 수 있다.\n③ 유치권자는 채무자의 승낙 없이 유치물을 담보로 제공할 수 있다.\n④ 채권자가 채무자를 직접점유자로 하여 간접점유하는 경우에도 유치권은 성립한다.\n⑤ 유치권자는 유치물에 관해 지출한 필요비를 소유자에게 상환 청구할 수 없다.","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",10,0],[33,2022,11,62,1,"계약법","계약의 성립(청약·승낙)","박스형(모두고르기), 판례","甲에게 법정지상권 또는 관습법상 법정지상권이 인정되는 경우를 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 乙 소유의 토지 위에 乙의 승낙을 얻어 신축한 丙 소유의 건물을 甲이 매수한 경우\nㄴ. 乙 소유의 토지 위에 甲과 乙이 건물을 공유하면서 토지에만 저당권을 설정하였다가, 그 실행을 위한 경매로 丙이 토지소유권을 취득한 경우\nㄷ. 甲이 乙로부터 乙 소유의 미등기건물과 그 대지를 함께 매수하고 대지에 관해서만 소유권이전등기를 한 후, 건물에 대한 등기 전 설정된 저당권에 의해 대지가 경매되어 丙이 토지소유권을 취득한 경우\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",10,0],[33,2022,11,63,1,"물권법","지역권","판례, 옳은것 고르기","지역권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 요역지는 1필의 토지 일부라도 무방하다.\n② 요역지의 소유권이 이전되어도 특별한 사정이 없는 한 지역권은 이전되지 않는다.\n③ 지역권의 존속기간을 영구무한으로 약정할 수는 없다.\n④ 지역권자는 승역지를 권원 없이 점유한 자에게 그 반환을 청구할 수 있다.\n⑤ 요역지공유자의 1인은 지분에 관하여 그 토지를 위한 지역권을 소멸하게 하지 못한다.","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",10,0],[33,2022,11,64,1,"물권법","전세권","판례, 옳은것 고르기","토지전세권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 토지전세권을 처음 설정할 때에는 존속기간에 제한이 없다.\n② 토지전세권의 존속기간을 1년 미만으로 정한 때에는 1년으로 한다.\n③ 토지전세권의 설정은 갱신할 수 있으나 그 기간은 갱신 한 날로부터 10년을 넘지 못한다.\n④ 토지전세권자에게는 토지임차인과 달리 지상물매수청구 권이 인정될 수 없다. 2022년 제33회 공인중개사\n⑤ 토지전세권설정자가 존속기간 만료 전 6월부터 1월 사이에 갱신거절의 통지를 하지 않은 경우, 특별한 사정이 없는 한 동일한 조건으로 다시 전세권을 설정한 것으로 본다.","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",10,0],[33,2022,11,65,1,"민법총칙","조건·기한","판례, 틀린것 고르기","甲은 乙에게 우편으로 자기 소유의 X건물을 3억 원에 매도하겠다는 청약을 하면서, 자신의 청약에 대한 회신을 2022. 10. 5.까지 해 줄 것을 요청하였다. 甲 의 편지는 2022. 9. 14. 발송되어 2022. 9. 16. 乙에게 도달되었다. 이에 관한 설명으로 틀린 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 甲이 2022. 9. 23. 자신의 청약을 철회한 경우, 특별한 사정이 없는 한 甲의 청약은 효력을 잃는다.\nㄴ. 乙이 2022. 9. 20. 甲에게 승낙의 통지를 발송 하여 2022. 9. 22. 甲에게 도달한 경우, 甲과 乙의 계약은 2022. 9. 22.에 성립한다.\nㄷ. 乙이 2022. 9. 27. 매매가격을 2억 5천만 원으로 조정해 줄 것을 조건으로 승낙한 경우, 乙 의 승낙은 청약의 거절과 동시에 새로 청약한 것으로 본다.\n① ㄱ ② ㄴ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",10,0],[33,2022,11,66,1,"민사특별법","주택임대차보호법","박스형(모두고르기), 판례","특별한 사정이 없는 한 동시이행의 관계에 있는 경우를 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 임대차계약 종료에 따른 임차인의 임차목적물 반환의무와 임대인의 권리금 회수 방해로 인한 손해배상의무\nㄴ. ｢주택임대차보호법｣상 임차권등기명령에 따라 행해진 임차권등기의 말소의무와 임대차보증 금 반환의무\nㄷ. 구분소유적 공유관계의 해소로 인하여 공유지분권자 상호간에 발생한 지분이전등기의무\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",10,0],[33,2022,11,67,1,"계약법","제3자를 위한 계약","판례, 옳은것 고르기","제3자를 위한 유상ㆍ쌍무계약에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 제3자를 위한 계약의 당사자는 요약자, 낙약자, 수익자이다.\n② 수익자는 계약체결 당시 특정되어 있어야 한다.\n③ 수익자는 제3자를 위한 계약에서 발생한 해제권을 가지는 것이 원칙이다.\n④ 낙약자는 특별한 사정이 없는 한 요약자와의 기본관계에서 발생한 항변으로써 수익자의 청구에 대항할 수 있다.\n⑤ 요약자는 특별한 사정이 없는 한 수익자의 동의 없이 낙약자의 이행불능을 이유로 계약을 해제할 수 없다.","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",10,0],[33,2022,11,68,1,"계약법","해제·해지","박스형(모두고르기), 판례, 틀린것 고르기","甲은 자신의 X토지를 乙에게 매도하고 소유권이전등기를 마쳐주었으나, 乙은 변제기가 지났음에도 매매대금을 지급하지 않고 있다. 이에 관한 설명으로 틀린 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 甲은 특별한 사정이 없는 한 별도의 최고 없이 매매계약을 해제할 수 있다.\nㄴ. 甲이 적법하게 매매계약을 해제한 경우, X토지의 소유권은 등기와 무관하게 계약이 없었던 상태로 복귀한다.\nㄷ. 乙이 X토지를 丙에게 매도하고 그 소유권이전등기를 마친 후 甲이 乙을 상대로 적법하게 매매계약을 해제하였다면, 丙은 X토지의 소유권을 상실한다.\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄷ ⑤ ㄴ, ㄷ","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",11,0],[33,2022,11,69,1,"계약법","계약 일반","옳은것 고르기","계약의 유형에 관한 설명으로 옳은 것은?\n① 매매계약은 요물계약이다.\n② 교환계약은 무상계약이다.\n③ 증여계약은 낙성계약이다.\n④ 도급계약은 요물계약이다.\n⑤ 임대차계약은 편무계약이다.","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",11,0],[33,2022,11,70,1,"계약법","매매(계약금·담보책임·환매)","판례","甲은 그 소유의 X부동산에 관하여 乙과 매매의 일방 예약을 체결하면서 예약완결권은 乙이 가지고 20년내에 행사하기로 약정하였다. 이에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 乙이 예약체결시로부터 1년 뒤에 예약완결권을 행사한 경우, 매매는 예약체결시로 소급하여 그 효력이 발생한다.\n② 乙의 예약완결권은 형성권에 속하므로 甲과의 약정에도 불구하고 그 행사기간은 10년으로 단축된다.\n③ 乙이 가진 예약완결권은 재산권이므로 특별한 사정이 없는 한 타인에게 양도할 수 있다.\n④ 乙이 예약완결권을 행사기간 내에 행사하였는지에 관해 甲의 주장이 없다면 법원은 이를 고려할 수 없다.\n⑤ 乙이 예약완결권을 행사하더라도 甲의 승낙이 있어야 비로소 매매계약은 그 효력이 발생한다.","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",11,0],[33,2022,11,71,1,"민법총칙","법률행위(반사회·불공정)","박스형(모두고르기), 옳은것 고르기","권리의 하자에 대한 매도인의 담보책임과 관련하여 ‘악의의 매수인에게 인정되는 권리’로 옳은 것을 모두 고른 것은?\nㄱ. 권리의 전부가 타인에게 속하여 매수인에게 이전할 수 없는 경우 - 계약해제권\nㄴ. 권리의 일부가 타인에게 속하여 그 권리의 일부를 매수인에게 이전할 수 없는 경우 - 대금감액청구권\nㄷ. 목적물에 설정된 저당권의 실행으로 인하여 매수인이 소유권을 취득할 수 없는 경우 - 계약해제권\nㄹ. 목적물에 설정된 지상권에 의해 매수인의 권리행사가 제한되어 계약의 목적을 달성할 수 없는 경우 - 계약해제권 2022년 제33회 공인중개사\n① ㄱ, ㄴ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",11,0],[33,2022,11,72,1,"계약법","매매(계약금·담보책임·환매)","판례, 틀린것 고르기","부동산의 환매에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 환매특약은 매매계약과 동시에 이루어져야 한다.\n② 매매계약이 취소되어 효력을 상실하면 그에 부수하는 환매특약도 효력을 상실한다.\n③ 환매 시 목적물의 과실과 대금의 이자는 특별한 약정이 없으면 이를 상계한 것으로 본다.\n④ 환매기간을 정하지 않은 경우, 그 기간은 5년으로 한다.\n⑤ 환매기간을 정한 경우, 환매권의 행사로 발생한 소유권이전등기청구권은 특별한 사정이 없는 한 그 환매기간 내에 행사하지 않으면 소멸한다.","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",11,0],[33,2022,11,73,1,"민법총칙","법률행위(반사회·불공정)","틀린것 고르기","토지임차인에게 인정될 수 있는 권리가 아닌 것은?\n① 부속물매수청구권 ② 유익비상환청구권\n③ 지상물매수청구권 ④ 필요비상환청구권\n⑤ 차임감액청구권","1","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",11,0],[33,2022,11,74,1,"계약법","임대차(민법)","박스형(모두고르기), 판례, 틀린것 고르기","건물임대차계약상 보증금에 관한 설명으로 틀린 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 임대차계약에서 보증금을 지급하였다는 사실에 대한 증명책임은 임차인이 부담한다.\nㄴ. 임대차계약이 종료하지 않은 경우, 특별한 사정이 없는 한 임차인은 보증금의 존재를 이유로 차임의 지급을 거절할 수 없다.\nㄷ. 임대차 종료 후 보증금이 반환되지 않고 있는 한, 임차인의 목적물에 대한 점유는 적법점유이 므로 임차인이 목적물을 계속하여 사용ㆍ수익하 더라도 부당이득 반환의무는 발생하지 않는다.\n① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄴ ⑤ ㄴ, ㄷ","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",11,0],[33,2022,11,75,1,"민사특별법","주택임대차보호법","박스형(모두고르기), 판례, 옳은것 고르기","주택임대차보호법에 관한 설명으로 옳은 것을 모두고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 다가구용 단독주택 일부의 임차인이 대항력을 취득하였다면, 후에 건축물 대장상으로 다가구용 단독주택이 다세대 주택으로 변경되었다는 사정만 으로는 이미 취득한 대항력을 상실하지 않는다.\nㄴ. 우선변제권 있는 임차인은 임차주택과 별도로 그 대지만이 경매될 경우, 특별한 사정이 없는 한 그 대지의 환가대금에 대하여 우선변제권을 행사할 수 있다.\nㄷ. 임차인이 대항력을 가진 후 그 임차주택의 소유권이 양도되어 양수인이 임차보증금반환채 무를 부담하게 되었더라도, 임차인이 주민등록을 이전하면 양수인이 부담하는 임차보증금반 환채무는 소멸한다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",11,0],[33,2022,11,76,1,"민사특별법","상가건물임대차보호법","박스형(모두고르기), 옳은것 고르기","세종특별자치시에 소재하는 甲 소유의 X상가건물의 1층 점포를 乙이 분식점을 하려고 甲으로부터 2022.\n2. 16. 보증금 6억 원, 차임 월 100만 원에 임차하였고 임차권 등기는 되지 않았다. 이에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 乙이 점포를 인도받은 날에 사업자등록을 신청한 경우, 그 다음 날부터 임차권의 대항력이 생긴다.\nㄴ. 乙이 대항요건을 갖춘 후 임대차계약서에 확정일자를 받은 경우, ｢민사집행법｣상 경매 시 乙은 임차건물의 환가대금에서 후순위권리자보다 우선하여 보증금을 변제받을 권리가 있다.\nㄷ. 乙은 ｢감염병의 예방 및 관리에 관한 법률｣ 제49조제1항제2호에 따른 집합 제한 또는 금지 조치를 총 3개월 이상 받음으로써 발생한 경제사정의 중대한 변동으로 폐업한 경우에는 임대차계약을 해지할 수 있다.\n① ㄴ ② ㄷ ③ ㄱ, ㄴ\n④ ㄱ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",12,0],[33,2022,11,77,1,"민사특별법","집합건물법","박스형(모두고르기), 판례, 옳은것 고르기","집합건물의 소유 및 관리에 관한 법률상 공용부분에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 관리단집회 결의나 다른 구분소유자의 동의 없이 구분소유자 1인이 공용부분을 독점적으로 점유ㆍ사용하는 경우, 다른 구분소유자는 공용부분의 보존행위로서 그 인도를 청구할 수 있다.\nㄴ. 구분소유자 중 일부가 정당한 권원 없이 구조상 공용부분인 복도를 배타적으로 점유ㆍ사용하여 다른 구분소유자가 사용하지 못하였다면, 특별한 사정이 없는 한 이로 인하여 얻은 이익을 다른 구분소유자에게 부당이득으로 반환 하여야 한다.\nㄷ. 관리단은 관리비 징수에 관한 유효한 규약이 없더라도 공용부분에 대한 관리비를 그 부담 의무자인 구분소유자에게 청구할 수 있다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",12,0],[33,2022,11,78,1,"민사특별법","가등기담보법","판례, 옳은것 고르기","가등기담보 등에 관한 법률이 적용되는 가등기담보에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 채무자가 아닌 제3자는 가등기담보권의 설정자가 될 수 없다.\n② 귀속청산에서 변제기 후 청산금의 평가액을 채무자에게 통지한 경우, 채권자는 그가 통지한 청산금의 금액에 관하여 다툴 수 있다.\n③ 공사대금채권을 담보하기 위하여 담보가등기를 한 경우, ｢가등기담보 등에 관한 법률｣이 적용된다. 2022년 제33회 공인중개사\n④ 가등기담보권자는 특별한 사정이 없는 한 가등기담보권을 그 피담보채권과 함께 제3자에게 양도할 수 있다.\n⑤ 가등기담보권자는 담보목적물에 대한 경매를 청구할 수 없다.","4","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",12,0],[33,2022,11,79,1,"민사특별법","부동산실명법(명의신탁)","판례, 틀린것 고르기","2022. 8. 16. 甲은 조세포탈의 목적으로 친구인 乙과 명의신탁약정을 맺고 乙은 이에 따라 甲으로부터 매수자금을 받아 丙 소유의 X토지를 자신의 명의로 매수하여 등기를 이전받았다. 이에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 甲과 乙의 명의신탁약정은 무효이다.\n② 甲과 乙의 명의신탁약정이 있었다는 사실을 丙이 몰랐다면, 乙은 丙으로부터 X토지의 소유권을 승계취득한 다.\n③ 乙이 X토지의 소유권을 취득하더라도, 甲은 乙에 대하여 부당이득을 원인으로 X토지의 소유권이전등기를 청구할 수 없다.\n④ 甲은 乙에 대해 가지는 매수자금 상당의 부당이득반환 청구권에 기하여 X토지에 유치권을 행사할 수 없다.\n⑤ 만일 乙이 丁에게 X토지를 양도한 경우, 丁이 명의신탁약정에 대하여 단순히 알고 있었다면 丁은 X토지의 소유권을 취득하지 못한다.","5","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",12,0],[33,2022,11,80,1,"민사특별법","집합건물법","옳은것 고르기","집합건물의 소유 및 관리에 관한 법령상 관리인 및 관리위원회 등에 관한 설명으로 옳은 것은?\n① 구분소유자가 아닌 자는 관리인이 될 수 없다.\n② 구분소유자가 10인 이상일 때에는 관리단을 대표하고 관리단의 사무를 집행할 관리인을 선임하여야 한다.\n③ 관리위원회를 둔 경우에도 규약에서 달리 정한 바가 없으면, 관리인은 공용부분의 보존행위를 함에 있어 관리위원회의 결의를 요하지 않는다.\n④ 규약에서 달리 정한 바가 없으면, 관리인은 관리위원회의 위원이 될 수 있다.\n⑤ 규약에서 달리 정한 바가 없으면, 관리위원회 위원은 부득이한 사유가 없더라도 서면이나 대리인을 통하여 의결권을 행사할 수 있다.","2","1gqoe3xf9oIhyw8BzN1BZC_yNd6z4Ue8C",12,0],[33,2022,21,1,2,"공인중개사법","중개대상물·용어","틀린것 고르기","공인중개사법령상 용어의 설명으로 틀린 것은?\n① 중개는 중개대상물에 대하여 거래당사자간의 매매ㆍ교환ㆍ임대차 그 밖의 권리의 득실변경에 관한 행위를 알선하는 것을 말한다.\n② 개업공인중개사는 이 법에 의하여 중개사무소의 개설등록을 한 자를 말한다.\n③ 중개업은 다른 사람의 의뢰에 의하여 일정한 보수를 받고 중개를 업으로 행하는 것을 말한다.\n④ 개업공인중개사인 법인의 사원 또는 임원으로서 공인중개사인 자는 소속공인중개사에 해당하지 않는다.\n⑤ 중개보조원은 공인중개사가 아닌 자로서 개업공인중개사에 소속되어 개업공인중개사의 중개업무와 관련된 단순한 업무를 보조하는 자를 말한다.","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",1,0],[33,2022,21,2,2,"공인중개사법","중개대상물·용어","박스형(모두고르기), 판례, 옳은것 고르기","공인중개사법령상 중개대상물에 해당하는 것을 모두고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 동ㆍ호수가 특정되어 분양계약이 체결된 아파트분양권\nㄴ. 기둥과 지붕 그리고 주벽이 갖추어진 신축 중인 미등기상태의 건물\nㄷ. 아파트 추첨기일에 신청하여 당첨되면 아파트의 분양예정자로 선정될 수 있는 지위인 입주권\nㄹ. 주택이 철거될 경우 일정한 요건 하에 택지개발지구 내에 이주자택지를 공급받을 지위인 대토권\n① ㄱ, ㄴ ② ㄴ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",1,0],[33,2022,21,3,2,"공인중개사법","중개보수·실비","옳은것 고르기","공인중개사법령상 공인중개사 정책심의위원회의 공인중개사 업무에 관한 심의사항에 해당하는 것을 모두 고른 것은?\nㄱ. 공인중개사의 시험 등 공인중개사의 자격취득에 관한 사항\nㄴ. 부동산 중개업의 육성에 관한 사항\nㄷ. 중개보수 변경에 관한 사항\nㄹ. 손해배상책임의 보장 등에 관한 사항\n① ㄱ ② ㄴ, ㄷ ③ ㄴ, ㄹ\n④ ㄱ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",1,0],[33,2022,21,4,2,"공인중개사법","정책심의위원회·자격·시험","틀린것 고르기","공인중개사법령상 공인중개사자격증에 관한 설명으로 틀린 것은?\n① 시ㆍ도지사는 공인중개사자격 시험합격자의 결정 공고일부터 2개월 이내에 시험합격자에게 공인중개사자격증을 교부해야 한다.\n② 공인중개사자격증의 재교부를 신청하는 자는 재교부신 청서를 자격증을 교부한 시ㆍ도지사에게 제출해야 한다. 2022년 제33회 공인중개\n③ 공인중개사자격증의 재교부를 신청하는 자는 해당 지방자치단체의 조례로 정하는 바에 따라 수수료를 납부해야 한다.\n④ 공인중개사는 유ㆍ무상 여부를 불문하고 자기의 공인중개사자격증을 양도해서는 아니된다.\n⑤ 공인중개사가 아닌 자로서 공인중개사 명칭을 사용한 자는 1년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",1,0],[33,2022,21,5,2,"공인중개사법","중개사무소 개설등록·결격사유","박스형(모두고르기), 계산","공인중개사법령상 중개사무소 개설등록의 결격사유가 있는 자를 모두 고른 것은?\nㄱ. 금고 이상의 실형의 선고를 받고 그 집행이 면제된 날부터 2년이 된 자\nㄴ. 공인중개사법을 위반하여 200만원의 벌금형의 선고를 받고 2년이 된 자\nㄷ. 사원 중 금고 이상의 형의 집행유예를 받고 그 유예기간 중에 있는 자가 있는 법인\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",1,0],[33,2022,21,6,2,"공인중개사법","거래정보망·기타","옳은것 고르기","공인중개사법령상 중개업 등에 관한 설명으로 옳은 것은?\n① 소속공인중개사는 중개사무소의 개설등록을 신청할 수 있다.\n② 법인인 개업공인중개사는 ‘중개업’과 ‘개업공인중개사를 대상으로 한 중개업의 경영기법 및 경영정보의 제공업 무’를 함께 할 수 없다.\n③ 법인인 개업공인중개사가 등록관청의 관할 구역 외의 지역에 분사무소를 두기 위해서는 등록관청의 허가를 받아야 한다.\n④ 소속공인중개사는 등록관청에 신고를 거쳐 천막 그 밖에 이동이 용이한 임시 중개시설물을 설치할 수 있다.\n⑤ 개업공인중개사는 의뢰받은 중개대상물에 대한 표시ㆍ광고에 중개보조원에 관한 사항을 명시해서는 아니된다.","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",1,0],[33,2022,21,7,2,"부동산거래신고법","부동산 거래신고","","부동산 거래신고 등에 관한 법령상 2년 이하의 징역 또는 계약 체결 당시의 개별공시지가에 따른 해당 토지가격의 100분의 30에 해당하는 금액 이하의 벌금에 처해지는 자는?\n① 신고관청의 관련 자료의 제출요구에도 거래대금 지급을 증명할 수 있는 자료를 제출하지 아니한 자\n② 토지거래허가구역 내에서 토지거래계약허가를 받은 사항을 변경하려는 경우 변경허가를 받지 아니하고 토지거래계약을 체결한 자\n③ 외국인이 경매로 대한민국 안의 부동산을 취득한 후 취득 신고를 하지 아니한 자\n④ 개업공인중개사에게 부동산거래신고를 하지 아니하게 한 자\n⑤ 부동산의 매매계약을 체결한 후 신고 의무자가 아닌 자가 거짓으로 부동산거래신고를 하는 자","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",1,0],[33,2022,21,8,2,"공인중개사법","중개계약(일반·전속)","옳은것 고르기","공인중개사법령상 개업공인중개사의 일반중개계약과 전속중개계약에 관한 설명으로 옳은 것은?\n① 일반중개계약은 중개의뢰인이 중개대상물의 중개를 의 뢰하기 위해 특정한 개업공인중개사를 정하여 그 개업공인중개사에 한정하여 중개대상물을 중개하도록 하는 계약을 말한다.\n② 개업공인중개사가 일반중개계약을 체결한 때에는 중개의뢰인이 비공개를 요청하지 않은 경우, 부동산거래정보망에 해당 중개대상물에 관한 정보를 공개해야 한다.\n③ 개업공인중개사가 일반중개계약을 체결한 때에는 중개의뢰인에게 2주일에 1회 이상 중개업무 처리상황을 문서로 통지해야 한다.\n④ 개업공인중개사가 국토교통부령으로 정하는 전속중개계약서에 의하지 아니하고 전속중개계약을 체결한 행위는 업무정지 사유에 해당하지 않는다.\n⑤ 표준서식인 일반중개계약서와 전속중개계약서에는 개업공인중개사가 중개보수를 과다수령 시 그 차액의 환급을 공통적으로 규정하고 있다.","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",2,0],[33,2022,21,9,2,"공인중개사법","확인·설명(서)","틀린것 고르기","공인중개사법령상 중개대상물 확인ㆍ설명서[Ⅱ](비주거용 건축물)에서 개업공인중개사의 기본 확인사항이 아닌 것은?\n① 소재지, 면적 등 대상물건의 표시에 관한 사항\n② 소유권 외의 권리사항\n③ 비선호시설(1km이내)의 유무에 관한 사항\n④ 관리주체 등 관리에 관한 사항\n⑤ 소유권에 관한 사항","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",2,0],[33,2022,21,10,2,"공인중개사법","중개보수·실비","박스형(모두고르기), 판례","공인중개사법령상 중개보수의 제한에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 공인중개사법령상 중개보수 제한 규정들은 공매대상 부동산 취득의 알선에 대해서는 적용되지 않는다.\nㄴ. 공인중개사법령에서 정한 한도를 초과하는 부동산 중개보수 약정은 한도를 초과하는 범위 내에서 무효이다.\nㄷ. 개업공인중개사는 중개대상물에 대한 거래계약이 완료되지 않을 경우에도 중개의뢰인과 중개행위에 상응하는 보수를 지급하기로 약정할 수 있고, 이 경우 공인중개사법령상 중개보수 제한 규정들이 적용된다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ 2022년 제33회 공인중개","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",2,0],[33,2022,21,11,2,"공인중개사법","손해배상책임·보증·계약금 예치","빈칸","공인중개사법령상 ( )에 들어갈 숫자가 큰 것부터 작은 것 순으로 옳게 나열된 것은?\n○개업공인중개사가 공제금으로 손해배상을 한 때에는 ( ㄱ )일 이내에 공제에 다시 가입해야 한다.\n○개업공인중개사가 등록한 인장을 변경한 경우 변경일부터 ( ㄴ )일 이내에 그 변경된 인장을 등록관청에 등록해야 한다.\n○개업공인중개사는 중개사무소를 이전한 때에는 이전한 날부터 ( ㄷ )일 이내에 국토교통부령으로 정하는 바에 따라 등록관청에 이전사실을 신고해야 한다.\n① ㄱ-ㄷ-ㄴ ② ㄴ-ㄱ-ㄷ ③ ㄴ-ㄷ-ㄱ\n④ ㄷ-ㄱ-ㄴ ⑤ ㄷ-ㄴ-ㄱ","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",2,0],[33,2022,21,12,2,"공인중개사법","거래계약서","옳은것 고르기","공인중개사법령상 개업공인중개사의 거래계약서 작성 등에 관한 설명으로 옳은 것은?\n① 개업공인중개사가 국토교통부장관이 정하는 거래계약서 표준서식을 사용하지 아니한 경우, 시ㆍ도지사는 그 자격을 취소해야 한다.\n② 중개대상물확인ㆍ설명서 교부일자는 거래계약서에 기재해야 하는 사항이다.\n③ 하나의 거래계약에 대하여 서로 다른 둘 이상의 거래계약서를 작성한 경우, 시ㆍ도지사는 3개월의 범위 안에서 그 업무를 정지해야 한다.\n④ 중개행위를 한 소속공인중개사가 거래계약서를 작성하는 경우, 그 소속공인중개사가 거래계약서에 서명 및 날인하여야 하며 개업공인중개사는 서명 및 날인의무가 없다.\n⑤ 거래계약서가 ｢전자문서 및 전자거래 기본법｣에 따른 공인전자문서센터에 보관된 경우 3년간 그 사본을 보존해야 한다.","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",2,0],[33,2022,21,13,2,"공인중개사법","중개사무소 개설등록·결격사유","","공인중개사법령상 등록관청이 중개사무소의 개설등록을 취소하여야 하는 사유로 명시되지 않은 것은?\n① 개업공인중개사가 업무정지기간 중에 중개업무를 한 경우\n② 개인인 개업공인중개사가 사망한 경우\n③ 개업공인중개사가 이중으로 중개사무소의 개설등록을 한 경우\n④ 개업공인중개사가 천막 그 밖에 이동이 용이한 임시 중개시설물을 설치한 경우\n⑤ 개업공인중개사가 최근 1년 이내에 이 법에 의하여 2회이상 업무정지처분을 받고 다시 업무정지처분에 해당하는 행위를 한 경우","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",2,0],[33,2022,21,14,2,"공인중개사법","중개대상물·용어","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 거래정보사업자의 지정을 취소할 수 있는 사유에 해당하는 것을 모두 고른 것은?\nㄱ. 거짓 등 부정한 방법으로 지정을 받은 경우\nㄴ. 정당한 사유 없이 지정받은 날부터 1년 이내에 부동산거래정보망을 설치ㆍ운영하지 아니한 경우\nㄷ. 개업공인중개사로부터 공개를 의뢰받은 중개대상물의 내용과 다르게 부동산거래정보망에 정보를 공개한 경우\nㄹ. 부동산거래정보망의 이용 및 정보제공방법 등에 관한 운영규정을 위반하여 부동산거래정보망을 운영한 경우\n① ㄱ, ㄴ ② ㄴ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",3,0],[33,2022,21,15,2,"공인중개사법","벌칙·과태료·포상금","틀린것 고르기","공인중개사법령상 3년 이하의 징역 또는 3천만원 이하의 벌금에 처해지는 개업공인중개사등의 행위가 아닌 것은?\n① 관계 법령에서 양도가 금지된 부동산의 분양과 관련 있는 증서의 매매를 중개하는 행위\n② 법정 중개보수를 초과하여 수수하는 행위\n③ 중개의뢰인과 직접 거래를 하는 행위\n④ 거래당사자 쌍방을 대리하는 행위\n⑤ 단체를 구성하여 특정 중개대상물에 대하여 중개를 제한하는 행위","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",3,0],[33,2022,21,16,2,"공인중개사법","교육·협회·공제","틀린것 고르기","공인중개사법령상 공인중개사협회(이하 ‘협회’라 함) 의 공제사업에 관한 설명으로 틀린 것은?\n① 협회는 공제사업을 다른 회계와 구분하여 별도의 회계로 관리해야 한다.\n② 공제규정에서 정하는 책임준비금의 적립비율은 공제료 수입액의 100분의 20이상으로 한다.\n③ 국토교통부장관은 협회의 자산상황이 불량하여 공제 가 입자의 권익을 해칠 우려가 있다고 인정하면 자산예탁기관의 변경을 명할 수 있다.\n④ 국토교통부장관은 협회의 자산상황이 불량하여 중개사고 피해자의 권익을 해칠 우려가 있다고 인정하면 불건전한 자산에 대한 적립금의 보유를 명할 수 있다.\n⑤ 협회는 대통령령으로 정하는 바에 따라 매년도의 공제사업 운용실적을 일간신문ㆍ협회보 등을 통하여 공제계약자에게 공시해야 한다.","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",3,0],[33,2022,21,17,2,"공인중개사법","중개보수·실비","","공인중개사법령상 중개보수 등에 관한 설명으로 옳은 것은?\n① 개업공인중개사의 과실로 인하여 중개의뢰인간의 거래행위가 취소된 경우에도 개업공인중개사는 중개업무에 관하여 중개의뢰인으로부터 소정의 보수를 받는다.\n② 개업공인중개사는 권리를 이전하고자 하는 중개의뢰인으로부터 중개대상물의 권리관계 등의 확인에 소요되는 실비를 받을 수 없다. 2022년 제33회 공인중개\n③ 개업공인중개사는 권리를 취득하고자 하는 중개의뢰인으로부터 계약금등의 반환채무이행 보장에 소요되는 실비를 받을 수 없다.\n④ 개업공인중개사의 중개보수의 지급시기는 개업공인중개사와 중개의뢰인간의 약정에 따르되, 약정이 없을 때에는 중개대상물의 거래대금 지급이 완료된 날로 한다.\n⑤ 주택 외의 중개대상물의 중개에 대한 보수는 시ㆍ도의 조례로 정한다.","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",3,0],[33,2022,21,18,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 행정제재처분효과의 승계 등에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 폐업신고 전에 개업공인중개사에게 한 업무정지처분의 효과는 그 처분일부터 2년간 재등록 개업공인중개사에게 승계된다.\nㄴ. 폐업기간이 2년을 초과한 재등록 개업공인중개사에 대해 폐업신고 전의 중개사무소 업무정지사유에 해당하는 위반행위를 이유로 행정처분을 할 수 없다.\nㄷ. 폐업신고 전에 개업공인중개사에게 한 과태료부 과처분의 효과는 그 처분일부터 10개월된 때에 재등록을 한 개업공인중개사에게 승계된다.\nㄹ. 폐업기간이 3년 6개월이 지난 재등록 개업공인중개사에게 폐업신고 전의 중개사무소 개설등록 취소사유에 해당하는 위반행위를 이유로 개설등록취소처분을 할 수 없다.\n① ㄱ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",3,0],[33,2022,21,19,2,"공인중개사법","중개사무소 개설등록·결격사유","박스형(모두고르기)","공인중개사법령상 법인이 중개사무소를 개설하려는 경우 개설등록 기준에 부합하는 것을 모두 고른 것은?(단, 다른 법률의 규정은 고려하지 않음)\nㄱ. 대표자가 공인중개사이다.\nㄴ. 건축물대장(｢건축법｣에 따른 가설건축물대장은 제외)에 기재된 건물에 전세로 중개사무소를 확보하였다.\nㄷ. 중개사무소를 개설하려는 법인이 자본금 5천만원 이상인 ｢협동조합 기본법｣상 사회적협동 조합이다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",3,0],[33,2022,21,20,2,"공인중개사법","벌칙·과태료·포상금","박스형(모두고르기)","공인중개사법령상 포상금을 지급받을 수 있는 신고 또는 고발의 대상을 모두 고른 것은?\nㄱ. 중개대상물의 매매를 업으로 하는 행위를 한 자\nㄴ. 공인중개사자격증을 다른 사람으로부터 대여 받은 자\nㄷ. 해당 중개대상물의 거래상의 중요사항에 관하여 거짓된 언행으로 중개의뢰인의 판단을 그르치게 하는 행위를 한 자\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",3,0],[33,2022,21,21,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","틀린것 고르기","공인중개사법령상 공인중개사의 자격취소에 관한 설명으로 틀린 것은?\n① 시ㆍ도지사는 공인중개사가 이 법을 위반하여 300만원이상 벌금형의 선고를 받은 경우에는 그 자격을 취소해야 한다.\n② 공인중개사의 자격이 취소된 자는 공인중개사자격증을 교부한 시ㆍ도지사에게 반납해야 한다.\n③ 시ㆍ도지사는 공인중개사의 자격취소처분을 한 때에는 5일 이내에 이를 국토교통부장관에게 보고하고 다른 시ㆍ도지사에게 통지해야 한다.\n④ 시ㆍ도지사는 공인중개사의 자격을 취소하고자 하는 경우에는 청문을 실시해야 한다.\n⑤ 시ㆍ도지사는 공인중개사가 부정한 방법으로 공인중개사의 자격을 취득한 경우에는 그 자격을 취소해야 한다.","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",4,0],[33,2022,21,22,2,"부동산거래신고법","토지거래허가","빈칸","부동산 거래신고 등에 관한 법령에 대한 설명이다. ( ) 에 들어갈 숫자는?(단, 국토교통부장관 또는 시ㆍ도지사가 따로 정하여 공고한 경우와 종전 규정에 따라 공고된 면제대상 토지면적 기준은 고려하지 않음) 경제 및 지가의 동향과 거래단위면적 등을 종합적으로 고려하여 ｢국토의 계획 및 이용에 관한 법률｣에 따른 도시지역 중 아래의 세부 용도지역별 면적 이하의 토지에 대한 토지거래계약허가는 필요하지 아니하다.\n◦주거지역: ( ㄱ )제곱미터\n◦상업지역: ( ㄴ )제곱미터\n◦공업지역: ( ㄷ )제곱미터\n◦녹지지역: ( ㄹ )제곱미터\n① ㄱ: 60, ㄴ: 100, ㄷ: 100, ㄹ: 200\n② ㄱ: 60, ㄴ: 150, ㄷ: 150, ㄹ: 200\n③ ㄱ: 180, ㄴ: 180, ㄷ: 660, ㄹ: 500\n④ ㄱ: 180, ㄴ: 200, ㄷ: 660, ㄹ: 200\n⑤ ㄱ: 180, ㄴ: 250, ㄷ: 500, ㄹ: 1천","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",4,0],[33,2022,21,23,2,"부동산거래신고법","토지거래허가","박스형(모두고르기)","부동산 거래신고 등에 관한 법령상 부동산정보체계의 관리 대상 정보로 명시된 것을 모두 고른 것은?\nㄱ. 부동산 거래계약 등 부동산거래 관련 정보\nㄴ. ｢부동산등기 특별조치법｣ 제3조에 따른 검인 관련 정보\nㄷ. 중개사무소의 개설등록에 관한 정보\nㄹ. 토지거래계약의 허가 관련 정보\n① ㄱ, ㄷ ② ㄴ, ㄹ ③ ㄱ, ㄴ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",4,0],[33,2022,21,24,2,"부동산거래신고법","외국인 등의 부동산 취득","옳은것 고르기","부동산 거래신고 등에 관한 법령상 외국인의 부동산 취득 등에 관한 설명으로 옳은 것은?(단, 상호주의에 따른 제한은 고려하지 않음) 2022년 제33회 공인중개\n① ｢자연환경보전법｣에 따른 생태ㆍ경관보전지역에서 외국인이 토지취득의 허가를 받지 아니하고 체결한 토지취 득계약은 유효하다.\n② 외국인이 건축물의 신축을 원인으로 대한민국 안의 부동산을 취득한 때에는 신고관청으로부터 부동산 취득의 허가를 받아야 한다.\n③ 외국인이 취득하려는 토지가 토지거래허가구역과 ｢문화재보호법｣에 따른 지정문화재와 이를 위한 보호물 또는 보호구역에 있으면 토지거래계약허가와 토지취득허가를 모두 받아야 한다.\n④ 대한민국 안의 부동산을 가지고 있는 대한민국국민이 외국인으로 변경된 경우 그 외국인이 해당 부동산을 계속 보유하려는 경우에는 부동산 보유의 허가를 받아야 한다.\n⑤ 외국인으로부터 토지취득의 허가 신청서를 받은 신고관청은 신청서를 받은 날부터 15일 이내에 허가 또는 불허가 처분을 해야 한다.","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",4,0],[33,2022,21,25,2,"부동산거래신고법","토지거래허가","옳은것 고르기, 빈칸","부동산 거래신고 등에 관한 법령상 이행강제금에 관한 설명이다. ( )에 들어갈 숫자로 옳은 것은?\n시장ㆍ군수는 토지거래계약허가를 받아 토지를 취득한 자가 당초의 목적대로 이용하지 아니하고 방치한 경우 그에 대하여 상당한 기간을 정하여 토지의 이용 의무를 이행하도록 명할 수 있다. 그 의무의 이행기간은 ( ㄱ )개월 이내로 정하여야 하며, 그 정해진 기간 내에 이행되지 않은 경우, 토지 취득가액의 100분의 ( ㄴ )에 상당하는 금액의 이행강제금을 부과한다.\n① ㄱ: 3, ㄴ: 7 ② ㄱ: 3, ㄴ: 10 ③ ㄱ: 6, ㄴ: 7\n④ ㄱ: 6, ㄴ: 10 ⑤ ㄱ: 12, ㄴ: 15","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",4,0],[33,2022,21,26,2,"부동산거래신고법","토지거래허가","틀린것 고르기","부동산 거래신고 등에 관한 법령상 토지거래허가구역 등에 관한 설명으로 틀린 것은?\n① 시장ㆍ군수 또는 구청장은 공익사업용 토지에 대해 토지거래계약에 관한 허가신청이 있는 경우, 한국토지주택공사가 그 매수를 원하는 경우에는 한국토지주택공사를 선매자(先買者)로 지정하여 그 토지를 협의 매수하 게 할 수 있다.\n② 국토교통부장관 또는 시ㆍ도지사는 허가구역의 지정 사유가 없어졌다고 인정되면 지체 없이 허가구역의 지정을 해제해야 한다.\n③ 토지거래허가신청에 대해 불허가처분을 받은 자는 그 통지를 받은 날부터 1개월 이내에 시장ㆍ군수 또는 구청장에게 해당 토지에 관한 권리의 매수를 청구할 수 있다.\n④ 허가구역의 지정은 허가구역의 지정을 공고한 날의 다음 날부터 그 효력이 발생한다.\n⑤ 토지거래허가를 받으려는 자는 그 허가신청서에 계약내 용과 그 토지의 이용계획, 취득자금 조달계획 등을 적어 시장ㆍ군수 또는 구청장에게 제출해야 한다.","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",4,0],[33,2022,21,27,2,"부동산거래신고법","외국인 등의 부동산 취득","박스형(모두고르기)","부동산 거래신고 등에 관한 법령상 외국인등에 해당되는 것을 모두 고른 것은?\nㄱ. 국제연합의 전문기구\nㄴ. 대한민국의 국적을 보유하고 있지 아니한 개인\nㄷ. 외국의 법령에 따라 설립된 법인\nㄹ. 비정부간 국제기구\nㅁ. 외국 정부\n① ㄱ, ㄴ ② ㄴ, ㄷ, ㅁ\n③ ㄱ, ㄴ, ㄷ, ㅁ ④ ㄱ, ㄷ, ㄹ, ㅁ\n⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",5,0],[33,2022,21,28,2,"부동산거래신고법","토지거래허가","박스형(모두고르기), 옳은것 고르기","부동산 거래신고 등에 관한 법령상 토지거래허가 등에 관한 설명으로 옳은 것은 모두 몇 개인가?\n○ 농지에 대하여 토지거래계약 허가를 받은 경우에는 ｢농지법｣에 따른 농지전용허가를 받은 것으로 본다.\n○ 국세의 체납처분을 하는 경우에는 ‘허가구역 내 토지거래에 대한 허가’의 규정을 적용한다.\n○ 시장ㆍ군수는 토지 이용 의무기간이 지난 후에도 이행강제금을 부과할 수 있다.\n○ 토지의 소유권자에게 부과된 토지 이용에 관한 의무는 그 토지에 관한 소유권의 변동과 동시에 그 승계인에게 이전한다.\n① 0개 ② 1개 ③ 2개 ④ 3개 ⑤ 4개","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",5,0],[33,2022,21,29,2,"중개실무","명의신탁·실무 기타","박스형(모두고르기), 판례, 옳은것 고르기","개업공인중개사가 중개의뢰인에게 ｢부동산 실권리자명의 등기에 관한 법률｣의 내용에 관하여 설명한 것으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 부동산의 위치와 면적을 특정하여 2인 이상이 구분소유하기로 하는 약정을 하고 그 구분소유자의 공유로 등기한 경우, 그 등기는 ｢부동산 실권리자명의 등기에 관한 법률｣ 위반으로 무효이다.\nㄴ. 배우자 명의로 부동산에 관한 물권을 등기한 경우 조세 포탈, 강제집행의 면탈 또는 법령상 제한의 회피를 목적으로 하지 아니하는 경우 그 등기는 유효하다.\nㄷ. 명의신탁자가 계약의 당사자가 되는 3자간 등기명의신탁이 무효인 경우 명의신탁자는 매도인을 대위하여 명의수탁자 명의의 등기의 말소를 청구할 수 있다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",5,0],[33,2022,21,30,2,"중개실무","경매·매수신청대리","판례, 틀린것 고르기","매수신청대리인으로 등록한 개업공인중개사가 매수신청대리 위임인에게 ｢민사집행법｣의 내용에 관하여 설명한 것으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 후순위 저당권자가 경매신청을 하면 매각부동산 위의 모든 저당권은 매각으로 소멸된다. 2022년 제33회 공인중개\n② 전세권 및 등기된 임차권은 저당권ㆍ압류채권ㆍ가압류 채권에 대항할 수 없는 경우에는 매각으로 소멸된다.\n③ 유치권자는 유치권이 성립된 목적물을 경매로 매수한 자에 대하여 그 피담보채권의 변제를 청구할 수 있다.\n④ 최선순위 전세권은 그 전세권자가 배당요구를 하면 매각으로 소멸된다.\n⑤ 매수인은 매각대금을 다 낸 때에 매각의 목적인 권리를 취득한다.","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",5,0],[33,2022,21,31,2,"중개실무","주택·상가 임대차 실무","박스형(모두고르기), 옳은것 고르기","개업공인중개사가 중개의뢰인에게 ｢상가건물 임대차보호법｣의 내용에 관하여 설명한 것으로 옳은 것을 모두 고른 것은?\nㄱ. 대통령령으로 정하는 보증금액을 초과하는 임대차인 경우에도 ｢상가건물 임대차보호법｣상 권리금에 관한 규정이 적용된다.\nㄴ. 임차인이 2기의 차임액에 해당하는 금액에 이 르도록 차임을 연체한 사실이 있는 경우, 임대인은 임차인의 계약갱신요구를 거절할 수 있다.\nㄷ. 임대인의 동의를 받고 전대차계약을 체결한 전차인은 임차인의 계약갱신요구권 행사기간 이내에 임차인을 대위하여 임대인에게 계약갱신요구권을 행사할 수 있다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",5,0],[33,2022,21,32,2,"중개실무","주택·상가 임대차 실무","틀린것 고르기","개업공인중개사가 중개의뢰인에게 ｢주택임대차보호법｣의 내용에 관하여 설명한 것으로 틀린 것은?(단, 임차인은 자연인임)\n① ｢주택임대차보호법｣은 주거용 건물의 임대차에 적용되며, 그 임차주택의 일부가 주거 외의 목적으로 사용되는 경우에도 적용된다.\n② 임차인의 계약갱신요구권의 행사를 통해 갱신되는 임대차의 존속기간은 2년으로 본다.\n③ 임차인은 임차주택에 대한 경매신청의 등기 전에 대항요건을 갖추지 않은 경우에도 보증금 중 일정액에 대해서는 다른 담보물권자보다 우선하여 변제받을 권리가 있다.\n④ 임차인이 대항력을 갖춘 경우 임차주택의 양수인은 임대인의 지위를 승계한 것으로 본다.\n⑤ 임차권등기명령의 집행에 따른 임차권등기를 마친 임차인은 이후 대항요건을 상실하더라도 이미 취득한 대항력 또는 우선변제권을 상실하지 아니한다.","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",5,0],[33,2022,21,33,2,"공인중개사법","확인·설명(서)","박스형(모두고르기)","개업공인중개사가 주택의 임대차를 중개하면서 중개대상물 확인ㆍ설명서[I](주거용 건축물)를 작성하는 경우 제외하거나 생략할 수 있는 것을 모두 고른 것은?\nㄱ. 취득 시 부담할 조세의 종류 및 세율\nㄴ. 개별공시지가(m2당) 및 건물(주택)공시가격\nㄷ. 다가구주택 확인서류 제출여부\nㄹ. 건축물의 방향\n① ㄱ, ㄴ ② ㄱ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄴ, ㄷ, ㄹ","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",5,0],[33,2022,21,34,2,"공인중개사법","중개계약(일반·전속)","틀린것 고르기","중개의뢰인 甲과 개업공인중개사 乙은 공인중개사법령에 따른 전속중개계약을 체결하고 전속중개계약서를 작성하였다. 이에 관한 설명으로 틀린 것은?\n① 甲과 乙이 전속중개계약의 유효기간을 4개월로 약정한 것은 유효하다.\n② 乙은 전속중개계약서를 3년 동안 보존해야 한다.\n③ 甲은 乙이 공인중개사법령상의 중개대상물 확인ㆍ설명 의무를 이행하는데 협조해야 한다.\n④ 전속중개계약에 정하지 않은 사항에 대하여는 甲과 乙 이 합의하여 별도로 정할 수 있다.\n⑤ 전속중개계약의 유효기간 내에 甲이 스스로 발견한 상대방과 거래한 경우, 甲은 乙에게 지급해야 할 중개보수 전액을 위약금으로 지급해야 한다.","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",6,0],[33,2022,21,35,2,"중개실무","경매·매수신청대리","박스형(모두고르기), 옳은것 고르기","개업공인중개사 甲은 ｢공인중개사의 매수신청대리인 등록 등에 관한 규칙｣에 따라 매수신청대리인으로 등록하였다. 이에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 甲은 ｢공장 및 광업재단 저당법｣에 따른 광업재단에 대한 매수신청대리를 할 수 있다.\nㄴ. 甲의 중개사무소 개설등록이 취소된 경우 시ㆍ도지사는 매수신청대리인 등록을 취소해야 한다.\nㄷ. 중개사무소 폐업신고로 甲의 매수신청대리인 등록이 취소된 경우 3년이 지나지 아니하면 甲은 다시 매수신청대리인 등록을 할 수 없다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",6,0],[33,2022,21,36,2,"공인중개사법","거래정보망·기타","옳은것 고르기","개업공인중개사가 아파트를 매수하려는 의뢰인에게 ｢집합건물의 소유 및 관리에 관한 법률｣의 내용에 관하여 설명한 것으로 옳은 것은?\n① 전유부분이 속하는 1동의 건물의 설치 또는 보존의 흠 으로 인하여 다른 자에게 손해를 입힌 경우, 그 흠은 공용부분에 존재하는 것으로 추정한다.\n② 구분소유자는 그 전유부분을 개량하기 위하여 필요한 범위에서 다른 구분소유자의 전유부분의 사용을 청구할 수 없다.\n③ 공용부분의 공유자가 공용부분에 관하여 다른 공유자에 대하여 가지는 채권은 그 특별승계인에 대하여 행사할 수 없다.\n④ 대지 위에 구분소유권의 목적인 건물이 속하는 1동의 건물이 있을 때에는 그 대지의 공유자는 그 건물 사용에 필요한 범위의 대지에 대하여 분할을 청구할 수 있다.\n⑤ 공용부분에 대한 공유자의 지분은 그가 가지는 전유부분의 처분에 따르지 않는다.","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",6,0],[33,2022,21,37,2,"공인중개사법","중개계약(일반·전속)","","개업공인중개사가 주택을 임차하려는 중개의뢰인과 일반중개계약을 체결하면서 공인중개사법령상 표준서식인 일반중개계약서를 작성할 때 기재할 사항은?\n① 소유자 및 등기명의인\n② 은행융자ㆍ권리금ㆍ제세공과금 등\n③ 중개의뢰 금액\n④ 희망 지역\n⑤ 거래규제 및 공법상 제한사항 2022년 제33회 공인중개","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",6,0],[33,2022,21,38,2,"공인중개사법","중개보수·실비","박스형(모두고르기), 옳은것 고르기","A시에 중개사무소를 둔 개업공인중개사 甲은 B시에 소재하는 乙 소유의 오피스텔(건축법령상 업무시설로 전용면적 80제곱미터이고, 상ㆍ하수도 시설이 갖추어진 전용입식 부엌, 전용수세식 화장실 및 목욕시설을 갖춤)에 대하여, 이를 매도하려는 乙과 매수하려는 丙 의 의뢰를 받아 매매계약을 중개하였다. 이 경우 공인중개사법령상 甲이 받을 수 있는 중개보수 및 실비에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 甲이 乙로부터 받을 수 있는 실비는 A시가 속한 시ㆍ도의 조례에서 정한 기준에 따른다.\nㄴ. 甲이 丙으로부터 받을 수 있는 중개보수의 상 한요율은 거래금액의 1천분의 5이다.\nㄷ. 甲은 乙과 丙으로부터 각각 중개보수를 받을 수 있다.\nㄹ. 주택(부속토지 포함)의 중개에 대한 보수 및 실비 규정을 적용한다.\n① ㄹ ② ㄱ, ㄷ ③ ㄴ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",6,0],[33,2022,21,39,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기","부동산 거래신고 등에 관한 법령상 부동산거래계약 신고서 작성에 관한 설명으로 틀린 것은?\n① 거래당사자가 외국인인 경우 거래당사자의 국적을 반드시 적어야 한다.\n② ‘계약대상 면적’란에는 실제 거래면적을 계산하여 적되, 건축물 면적은 집합건축물의 경우 전용면적을 적는다.\n③ ‘종전 부동산’란은 입주권 매매의 경우에만 작성한다.\n④ ‘계약의 조건 및 참고사항’란은 부동산 거래계약 내용에 계약조건이나 기한을 붙인 경우, 거래와 관련한 참고내 용이 있을 경우에 적는다.\n⑤ 거래대상의 종류가 공급계약(분양)인 경우 물건별 거래가격 및 총 실제거래가격에 부가가치세를 제외한 금액을 적는다.","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",6,0],[33,2022,21,40,2,"중개실무","분묘기지권·장사법","판례, 옳은것 고르기","개업공인중개사가 분묘가 있는 토지를 매수하려는 의뢰인에게 분묘기지권에 관해 설명한 것으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 분묘기지권의 존속기간은 지상권의 존속기간에 대한 규정이 유추적용되어 30년으로 인정된다.\n② ｢장사 등에 관한 법률｣이 시행되기 전에 설치된 분묘의 경우 그 법의 시행 후에는 분묘기지권의 시효취득이 인정되지 않는다.\n③ 자기 소유 토지에 분묘를 설치한 사람이 분묘이장의 특약 없이 토지를 양도함으로써 분묘기지권을 취득한 경우, 특별한 사정이 없는 한 분묘기지권이 성립한 때부터 지료지급의무가 있다.\n④ 분묘기지권을 시효로 취득한 사람은 토지소유자의 지료지급청구가 있어도 지료지급의무가 없다.\n⑤ 분묘가 멸실된 경우 유골이 존재하여 분묘의 원상회복이 가능한 일시적인 멸실에 불과하여도 분묘기지권은 소멸한다.","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",6,0],[33,2022,21,41,3,"국토계획법","용도지역·용도지구·용도구역","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 용도지역ㆍ용도지구ㆍ용도구역에 관한 설명으로 옳은 것은? (단, 조례는 고려하지 않음)\n① 대도시 시장은 유통상업지역에 복합용도지구를 지정할 수 있다.\n② 대도시 시장은 재해의 반복 발생이 우려되는 지역에 대해서는 특정용도제한지구를 지정하여야 한다.\n③ 용도지역 안에서의 건축물의 용도ㆍ종류 및 규모의 제한에 대한 규정은 도시ㆍ군계획시설에 대해서도 적용된다.\n④ 공유수면의 매립 목적이 그 매립구역과 이웃하고 있는 용도지역의 내용과 다른 경우 그 매립준공구역은 이와 이웃하고 있는 용도지역으로 지정된 것으로 본다.\n⑤ ｢택지개발촉진법｣에 따른 택지개발지구로 지정ㆍ고시된 지역은 ｢국토의 계획 및 이용에 관한 법률｣에 따른 도시지역으로 결정ㆍ고시된 것으로 본다.","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",7,0],[33,2022,21,42,3,"국토계획법","개발행위허가·성장관리","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 개발행위허가에 관한 설명으로 옳은 것은? (단, 조례는 고려하지 않음)\n① ｢사방사업법｣에 따른 사방사업을 위한 개발행위를 허가 하려면 지방도시계획위원회의 심의를 거쳐야 한다.\n② 토지의 일부가 도시ㆍ군계획시설로 지형도면고시가 된 당해 토지의 분할은 개발행위허가를 받아야 한다.\n③ 국토교통부장관은 개발행위로 인하여 주변의 환경이 크게 오염될 우려가 있는 지역에서 개발행위허가를 제한하고자 하는 경우 중앙도시계획위원회의 심의를 거쳐야 한다.\n④ 시ㆍ도지사는 기반시설부담구역으로 지정된 지역에 대해서는 10년간 개발행위허가를 제한할 수 있다.\n⑤ 토지분할을 위한 개발행위허가를 받은 자는 그 개발행위를 마치면 시ㆍ도지사의 준공검사를 받아야 한다.","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",7,0],[33,2022,21,43,3,"국토계획법","도시·군관리계획·기본계획","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 성장관리계획에 관한 설명으로 옳은 것은? (단, 조례, 기타 강화ㆍ완화조건은 고려하지 않음)\n① 시장 또는 군수는 공업지역 중 향후 시가화가 예상되는 지역의 전부 또는 일부에 대하여 성장관리계획구역을 지정할 수 있다.\n② 성장관리계획구역 내 생산녹지지역에서는 30퍼센트 이하의 범위에서 성장관리계획으로 정하는 바에 따라 건폐율을 완화하여 적용할 수 있다.\n③ 성장관리계획구역 내 보전관리지역에서는 125퍼센트 이하의 범위에서 성장관리계획으로 정하는 바에 따라 용적률을 완화하여 적용할 수 있다.\n④ 시장 또는 군수는 성장관리계획구역을 지정할 때에는도시ㆍ군관리계획의 결정으로 하여야 한다.\n⑤ 시장 또는 군수는 성장관리계획구역을 지정하려면 성장관 리계획구역안을 7일간 일반이 열람할 수 있도록 해야 한다. 2022년 제33회 공인중개","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",7,0],[33,2022,21,44,3,"국토계획법","개발행위허가·성장관리","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 개발행위허가를 받은 자가 행정청인 경우 개발행위에 따른 공공시설의 귀속에 관한 설명으로 옳은 것은? (단, 다른 법률은 고려하지 않음)\n① 개발행위허가를 받은 자가 새로 공공시설을 설치한 경우, 새로 설치된 공공시설은 그 시설을 관리할 관리청에 무상으로 귀속된다.\n② 개발행위로 용도가 폐지되는 공공시설은 새로 설치한 공공시설의 설치비용에 상당하는 범위에서 개발행위허가를 받은 자에게 무상으로 양도할 수 있다.\n③ 공공시설의 관리청이 불분명한 경우 하천에 대하여는 국토교통부장관을 관리청으로 본다.\n④ 관리청에 귀속되거나 개발행위허가를 받은 자에게 양도될 공공시설은 준공검사를 받음으로써 관리청과 개발행위허가를 받은 자에게 각각 귀속되거나 양도된 것으로 본다.\n⑤ 개발행위허가를 받은 자는 국토교통부장관의 허가를 받아 그에게 귀속된 공공시설의 처분으로 인한 수익금을도시ㆍ군계획사업 외의 목적에 사용할 수 있다.","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",7,0],[33,2022,21,45,3,"국토계획법","도시·군관리계획·기본계획","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 광역계획권에 관한 설명으로 옳은 것은?\n① 광역계획권이 둘 이상의 도의 관할 구역에 걸쳐 있는 경우, 해당 도지사들은 공동으로 광역계획권을 지정하여야 한다.\n② 광역계획권이 하나의 도의 관할 구역에 속하여 있는 경우, 도지사는 국토교통부장관과 공동으로 광역계획권을 지정 또는 변경하여야 한다.\n③ 도지사가 광역계획권을 지정하려면 관계 중앙행정기관의 장의 의견을 들은 후 중앙도시계획위원회의 심의를 거쳐야 한다.\n④ 국토교통부장관이 광역계획권을 변경하려면 관계 시ㆍ도지사, 시장 또는 군수의 의견을 들은 후 지방도시계획위원회의 심의를 거쳐야 한다.\n⑤ 중앙행정기관의 장, 시ㆍ도지사, 시장 또는 군수는 국토교통부장관이나 도지사에게 광역계획권의 지정 또는 변경을 요청할 수 있다.","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",7,0],[33,2022,21,46,3,"국토계획법","국토계획법 일반","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 도시계획위원회에 관한 설명으로 옳은 것은?\n① 시ㆍ군ㆍ구에는 지방도시계획위원회를 두지 않는다.\n② 중앙도시계획위원회가 분과위원회에 위임하는 사항에 대한 모든 심의는 중앙도시계획위원회의 심의로 본다.\n③ 국토교통부장관이 해당 도시ㆍ군계획시설에 대한 도시ㆍ군관리계획 결정권자에게 도시ㆍ군계획시설결정의 해제를 권고하려는 경우에는 중앙도시계획위원회의 심의를 거쳐야 한다.\n④ 중앙도시계획위원회 회의록의 공개는 열람하는 방법으로 하며 사본을 제공할 수는 없다.\n⑤ 시장 또는 군수가 성장관리계획구역을 지정하려면 시ㆍ도지사의 의견을 들은 후 중앙도시계획위원회의 심의를 거쳐야 한다.","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",7,0],[33,2022,21,47,3,"국토계획법","용도지역·용도지구·용도구역","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 시가화조정구역 안에서 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ특별자치도지사ㆍ시장 또는 군수의 허가를 받아 할 수 있는 행위에 해당하지 않는 것은? (단, 도시ㆍ군계획사업은 고려하지 않음)\n① 농업ㆍ임업 또는 어업을 영위하는 자가 관리용건축물로서 기존 관리용건축물의 면적을 제외하고 33제곱미터를 초과하는 것을 건축하는 행위\n② 주택의 증축(기존 주택의 면적을 포함하여 100제곱미터 이하에 해당하는 면적의 증축을 말한다)\n③ 마을공동시설로서 정자 등 간이휴게소의 설치\n④ 마을공동시설로서 농로ㆍ제방 및 사방시설의 설치\n⑤ 마을공동시설로서 농기계수리소 및 농기계용 유류판매 소(개인소유의 것을 포함한다)의 설치","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",8,0],[33,2022,21,48,3,"국토계획법","개발행위허가·성장관리","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 개발행위에 따른 기반시설의 설치에 관한 설명으로 틀린 것은?\n(단, 조례는 고려하지 않음)\n① 개발밀도관리구역에서는 해당 용도지역에 적용되는 용적률의 최대한도의 50퍼센트 범위에서 강화하여 적용한다.\n② 기반시설의 설치가 필요하다고 인정하는 지역으로서, 해당 지역의 전년도 개발행위허가 건수가 전전년도 개발행위허가 건수보다 20퍼센트 이상 증가한 지역에 대하여는 기반시설부담구역으로 지정하여야 한다.\n③ 기반시설부담구역이 지정되면 기반시설설치계획을 수립하여야 하며, 이를 도시ㆍ군관리계획에 반영하여야 한다.\n④ 기반시설설치계획은 기반시설부담구역의 지정고시일부터 3년이 되는 날까지 수립하여야 한다.\n⑤ 기반시설설치비용의 관리 및 운용을 위하여 기반시설부 담구역별로 특별회계를 설치하여야 한다.","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",8,0],[33,2022,21,49,3,"국토계획법","도시·군관리계획·기본계획","박스형(모두고르기)","국토의 계획 및 이용에 관한 법령상 도시지역에서 미리 도시ㆍ군관리계획으로 결정하지 않고 설치할 수 있는 시설을 모두 고른 것은?\nㄱ. 광장(건축물부설광장은 제외한다)\nㄴ. 대지면적이 500제곱미터 미만인 도축장\nㄷ. 폐기물처리 및 재활용시설 중 재활용시설\nㄹ. ｢고등교육법｣에 따른 방송대학ㆍ통신대학 및 방송통신대학\n① ㄱ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ 2022년 제33회 공인중개","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",8,0],[33,2022,21,50,3,"국토계획법","국토계획법 일반","빈칸","국토의 계획 및 이용에 관한 법령상 토지에의 출입에 관한 규정의 일부이다. ( )에 들어갈 내용을 바르게 나열한 것은?\n제130조(토지에의 출입 등) ① 국토교통부장관, 시ㆍ도지사, 시장 또는 군수나 도시ㆍ군계획시설사업의 시행자는 다음 각 호의 행위를 하기 위하여 필요하면 타인의 토지에 출입하거나 타인의 토지를 재료 적치장 또는 임시통로로 일시 사용할 수 있으며, 특히 필요한 경우에는 나무, 흙, 돌, 그 밖의 장애물을 변경하거나 제거할 수 있다.\n1. < 생략 >\n2. ( ㄱ ), ( ㄴ ) 및 제67조제4항에 따른 기반시 설설치계획에 관한 기초조사 < 이하 생략 >\n① ㄱ: 기반시설부담구역, ㄴ: 성장관리계획구역\n② ㄱ: 성장관리계획구역, ㄴ: 시가화조정구역\n③ ㄱ: 시가화조정구역, ㄴ: 기반시설부담구역\n④ ㄱ: 개발밀도관리구역, ㄴ: 시가화조정구역\n⑤ ㄱ: 개발밀도관리구역, ㄴ: 기반시설부담구역","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",8,0],[33,2022,21,51,3,"국토계획법","도시·군관리계획·기본계획","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 시장 또는 군수가도시ㆍ군기본계획의 승인을 받으려 할 때, 도시ㆍ군기본계획안에 첨부하여야 할 서류에 해당하는 것은?\n① 기초조사 결과\n② 청문회의 청문조서\n③ 해당 시ㆍ군 및 도의 의회의 심의ㆍ의결 결과\n④ 해당 시ㆍ군 및 도의 지방도시계획위원회의 심의 결과\n⑤ 관계 중앙행정기관의 장과의 협의 및 중앙도시계획위원회의 심의에 필요한 서류","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",8,0],[33,2022,21,52,3,"국토계획법","용도지역·용도지구·용도구역","빈칸","국토의 계획 및 이용에 관한 법령상 용도지역별 용적률의 최대한도에 관한 내용이다. ( )에 들어갈 숫자를 바르게 나열한 것은? (단, 조례, 기타 강화ㆍ완화조건은 고려하지 않음)\n○ 주거지역: ( ㄱ )퍼센트 이하\n○ 계획관리지역: ( ㄴ )퍼센트 이하\n○ 농림지역: ( ㄷ )퍼센트 이하\n① ㄱ: 400, ㄴ: 150, ㄷ: 80 ② ㄱ: 400, ㄴ: 200, ㄷ: 80\n③ ㄱ: 500, ㄴ: 100, ㄷ: 80 ④ ㄱ: 500, ㄴ: 100, ㄷ: 100\n⑤ ㄱ: 500, ㄴ: 150, ㄷ: 100","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",8,0],[33,2022,21,53,3,"도시개발법","도시개발채권·기타","옳은것 고르기","도시개발법령상 ｢지방공기업법｣에 따라 설립된 지방공사가 단독으로 토지상환채권을 발행하는 경우에 관한 설명으로 옳은 것은?\n① ｢은행법｣에 따른 은행으로부터 지급보증을 받은 경우에만 토지상환채권을 발행할 수 있다.\n② 토지상환채권의 발행규모는 그 토지상환채권으로 상환할 토지ㆍ건축물이 해당 도시개발사업으로 조성되는 분양토지 또는 분양건축물 면적의 2분의 1을 초과하지 아니하도록 하여야 한다.\n③ 토지상환채권은 이전할 수 없다.\n④ 토지가격의 추산방법은 토지상환채권의 발행계획에 포함되지 않는다.\n⑤ 토지등의 매수 대금 일부의 지급을 위하여 토지상환채권을 발행할 수 없다.","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",9,0],[33,2022,21,54,3,"도시개발법","수용·사용·환지","틀린것 고르기","도시개발법령상 환지처분에 관한 설명으로 틀린 것은?\n① 도시개발구역의 토지 소유자나 이해관계인은 환지 방식에 의한 도시개발사업 공사 관계 서류의 공람 기간에 시행자에게 의견서를 제출할 수 있다.\n② 환지를 정하거나 그 대상에서 제외한 경우 그 과부족분\n(過不足分)은 금전으로 청산하여야 한다.\n③ 시행자는 지정권자에 의한 준공검사를 받은 경우에는 90일 이내에 환지처분을 하여야 한다.\n④ 시행자가 환지처분을 하려는 경우에는 환지 계획에서 정한 사항을 토지 소유자에게 알리고 관보 또는 공보에의해 이를 공고하여야 한다.\n⑤ 환지 계획에서 정하여진 환지는 그 환지처분이 공고된 날의 다음 날부터 종전의 토지로 본다.","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",9,0],[33,2022,21,55,3,"도시개발법","도시개발구역 지정·계획","틀린것 고르기","도시개발법령상 국토교통부장관이 도시개발구역을 지정할 수 있는 경우에 해당하지 않는 것은?\n① 국가가 도시개발사업을 실시할 필요가 있는 경우\n② 관계 중앙행정기관의 장이 요청하는 경우\n③ 한국토지주택공사 사장이 20만 제곱미터의 규모로 국가계획과 밀접한 관련이 있는 도시개발구역의 지정을 제안하는 경우\n④ 천재지변, 그 밖의 사유로 인하여 도시개발사업을 긴급하게 할 필요가 있는 경우\n⑤ 도시개발사업이 필요하다고 인정되는 지역이 둘 이상의 도의 행정구역에 걸치는 경우에 도시개발구역을 지정할 자에 관하여 관계 도지사 간에 협의가 성립되지 아니하는 경우","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",9,0],[33,2022,21,56,3,"도시개발법","시행자·조합","틀린것 고르기","도시개발법령상 도시개발사업 조합에 관한 설명으로 틀린 것은?\n① 조합은 그 주된 사무소의 소재지에서 등기를 하면 성립한다.\n② 주된 사무소의 소재지를 변경하려면 지정권자로부터 변경인가를 받아야 한다.\n③ 조합 설립의 인가를 신청하려면 해당 도시개발구역의 토지면적의 3분의 2 이상에 해당하는 토지 소유자와 그 구역의 토지 소유자 총수의 2분의 1 이상의 동의를 받아야 한다.\n④ 조합의 조합원은 도시개발구역의 토지 소유자로 한다. 2022년 제33회 공인중개\n⑤ 조합의 설립인가를 받은 조합의 대표자는 설립인가를 받은 날부터 30일 이내에 주된 사무소의 소재지에서 설립등기를 하여야 한다.","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",9,0],[33,2022,21,57,3,"도시개발법","도시개발구역 지정·계획","틀린것 고르기","도시개발법령상 도시개발사업 시행자로 지정될 수 있는 자에 해당하지 않는 것은?\n① 국가\n② ｢한국부동산원법｣에 따른 한국부동산원\n③ ｢한국수자원공사법｣에 따른 한국수자원공사\n④ ｢한국관광공사법｣에 따른 한국관광공사\n⑤ ｢지방공기업법｣에 따라 설립된 지방공사","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",9,0],[33,2022,21,58,3,"도시개발법","도시개발구역 지정·계획","빈칸","도시개발법령상 환지방식으로 시행하는 도시개발사업 개발계획의 경미한 변경에 관한 규정의 일부이다.\n( )에 들어갈 숫자를 바르게 나열한 것은?\n제7조(개발계획의 경미한 변경) ① 법 제4조제4항 후단에서 “대통령령으로 정하는 경미한 사항의 변경”이란 개발계획을 변경하는 경우로서 다음 각 호에 해당하는 경우를 제외한 경우를 말한다.\n1. 환지방식을 적용하는 지역의 면적 변경이 다음 각 목의 어느 하나에 해당하는 경우\n가. < 생략 >\n나. 제외되는 토지의 면적이 종전 환지방식이 적용되는 면적의 100분의 ( ㄱ ) 이상인 경우\n다. 편입 또는 제외되는 면적이 각각 ( ㄴ )만 제곱미터 이상인 경우\n라. 토지의 편입이나 제외로 인하여 환지방식이 적용되는 면적이 종전보다 100분의 ( ㄷ ) 이상 증감하는 경우 < 이하 생략 >\n① ㄱ: 5, ㄴ: 1, ㄷ: 5 ② ㄱ: 5, ㄴ: 1, ㄷ: 10\n③ ㄱ: 5, ㄴ: 3, ㄷ: 5 ④ ㄱ: 10, ㄴ: 3, ㄷ: 10\n⑤ ㄱ: 10, ㄴ: 5, ㄷ: 10","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",9,0],[33,2022,21,59,3,"정비법","정비사업 일반","틀린것 고르기","도시 및 주거환경정비법령상 사업시행자가 국민주택규모 주택을 건설하여야 하는 경우 그 주택의 공급및 인수에 관한 설명으로 틀린 것은?\n① 사업시행자는 건설한 국민주택규모 주택을 국토교통부장관, 시ㆍ도지사, 시장, 군수, 구청장 또는 토지주택공 사등에 공급하여야 한다.\n② 사업시행자는 인수자에게 공급해야 하는 국민주택규모 주택을 공개추첨의 방법으로 선정해야 한다.\n③ 선정된 국민주택규모 주택을 공급하는 경우에는 시ㆍ도지사, 시장ㆍ군수ㆍ구청장 순으로 우선하여 인수할 수 있다.\n④ 인수자에게 공급하는 국민주택규모 주택의 부속 토지는 인수자에게 기부채납한 것으로 본다.\n⑤ 시ㆍ도지사 및 시장ㆍ군수ㆍ구청장이 국민주택규모 주택을 인수할 수 없는 경우 한국토지주택공사가 인수하여야 한다.","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",9,0],[33,2022,21,60,3,"정비법","조합·추진위원회","틀린것 고르기","도시 및 주거환경정비법령상 조합의 임원에 관한 설명으로 틀린 것은?\n① 토지등소유자의 수가 100인을 초과하는 경우 조합에 두는 이사의 수는 5명 이상으로 한다.\n② 조합임원의 임기는 3년 이하의 범위에서 정관으로 정하되, 연임할 수 있다.\n③ 조합장이 아닌 조합임원은 대의원이 될 수 있다.\n④ 조합임원은 같은 목적의 정비사업을 하는 다른 조합의 임원 또는 직원을 겸할 수 없다.\n⑤ 시장ㆍ군수등이 전문조합관리인을 선정한 경우 전문조합관리인이 업무를 대행할 임원은 당연 퇴임한다.","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",10,0],[33,2022,21,61,3,"정비법","사업시행·관리처분","빈칸","도시 및 주거환경정비법령상 분양신청을 하지 아니한 자 등에 대한 조치에 관한 설명이다. ( )에 들어갈 내용을 바르게 나열한 것은?\n○ 분양신청을 하지 아니한 토지등소유자가 있는 경우 사업시행자는 관리처분계획이 인가ㆍ고시된 다음 날부터 ( ㄱ )일 이내에 그 자와 토지, 건축물 또는 그 밖의 권리의 손실보상에 관한 협의를 하여야 한다.\n○ 위 협의가 성립되지 아니하면 사업시행자는 그 기간의 만료일 다음 날부터 ( ㄴ )일 이내에 수용재결을 신청하거나 매도청구소송을 제기하 여야 한다.\n① ㄱ: 60, ㄴ: 30 ② ㄱ: 60, ㄴ: 60 ③ ㄱ: 60, ㄴ: 90\n④ ㄱ: 90, ㄴ: 60 ⑤ ㄱ: 90, ㄴ: 90","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",10,0],[33,2022,21,62,3,"정비법","조합·추진위원회","옳은것 고르기","도시 및 주거환경정비법령상 조합설립추진위원회가 운영에 필요한 사항 중 추진위원회 구성에 동의한 토지등소유자에게 등기우편으로 통지하여야 하는 사항에 해당하는 것은?\n① 재건축사업 정비계획 입안을 위한 안전진단의 결과\n② 조합설립 동의서에 포함되는 사항으로서 정비사업비의 분담기준\n③ 토지등소유자의 부담액 범위를 포함한 개략적인 사업시 행계획서\n④ 정비사업전문관리업자의 선정에 관한 사항\n⑤ 추진위원회 위원의 선정에 관한 사항","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",10,0],[33,2022,21,63,3,"정비법","정비사업 일반","틀린것 고르기","도시 및 주거환경정비법령상 한국토지주택공사가 단독으로 정비사업을 시행하는 경우에 작성하는 시행 규정에 포함하여야 하는 사항이 아닌 것은? (단, 조례는 고려하지 않음)\n① 토지등소유자 전체회의\n② 토지등소유자의 권리ㆍ의무\n③ 토지 및 건축물에 관한 권리의 평가방법\n④ 정비사업의 시행연도 및 시행방법\n⑤ 공고ㆍ공람 및 통지의 방법 2022년 제33회 공인중개사","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",10,0],[33,2022,21,64,3,"국토계획법","도시·군계획시설·매수청구","박스형(모두고르기)","도시 및 주거환경정비법령상 시장ㆍ군수등이 아닌 사업시행자가 시행하는 정비사업의 정비계획에 따라 설치되는 도시ㆍ군계획시설 중 그 건설에 드는 비용을 시장ㆍ군수등이 부담할 수 있는 시설을 모두 고른 것은?\nㄱ. 공원 ㄴ. 공공공지\nㄷ. 공동구 ㄹ. 공용주차장\n① ㄱ ② ㄴ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",10,0],[33,2022,21,65,3,"주택법","용어(주택·공동주택 등)","박스형(모두고르기), 옳은것 고르기","주택법령상 도시형 생활주택으로서 소형 주택의 요건에 해당하는 것을 모두 고른 것은?\nㄱ. 세대별 주거전용면적은 60제곱미터 이하일 것\nㄴ. 세대별로 독립된 주거가 가능하도록 욕실 및 부엌을 설치할 것\nㄷ. 주거전용면적이 30제곱미터 미만인 경우에는 욕실 및 부엌을 제외한 부분을 하나의 공간으로 구성할 것\nㄹ. 지하층에는 세대를 설치하지 아니할 것\n① ㄱ ② ㄴ, ㄷ ③ ㄱ, ㄴ, ㄷ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",10,0],[33,2022,21,66,3,"주택법","리모델링·기타","옳은것 고르기","주택법령상 주택상환사채에 관한 설명으로 옳은 것은?\n① 법인으로서 자본금이 3억원인 등록사업자는 주택상환사채를 발행할 수 있다.\n② 발행 조건은 주택상환사채권에 적어야 하는 사항에 포함된다.\n③ 주택상환사채를 발행하려는 자는 주택상환사채발행계획을 수립하여 시․도지사의 승인을 받아야 한다.\n④ 주택상환사채는 액면으로 발행하고, 할인의 방법으로는 발행할 수 없다.\n⑤ 주택상환사채는 무기명증권(無記名證券)으로 발행한다.","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",10,0],[33,2022,21,67,3,"주택법","리모델링·기타","옳은것 고르기","주택법령상 토지임대부 분양주택에 관한 설명으로 옳은 것은?\n① 토지임대부 분양주택의 토지에 대한 임대차기간은 50년 이내로 한다.\n② 토지임대부 분양주택의 토지에 대한 임대차기간을 갱신 하기 위해서는 토지임대부 분양주택 소유자의 3분의 2 이상이 계약갱신을 청구하여야 한다.\n③ 토지임대료를 보증금으로 전환하여 납부하는 경우, 그 보증금을 산정할 때 적용되는 이자율은 ｢은행법｣에 따른 은행의 3년 만기 정기예금 평균이자율 이상이어야 한다.\n④ 토지임대부 분양주택을 공급받은 자가 토지임대부 분양주택을 양도하려는 경우에는 시․도지사에게 해당 주택의 매입을 신청하여야 한다.\n⑤ 토지임대료는 분기별 임대료를 원칙으로 한다.","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",10,0],[33,2022,21,68,3,"주택법","리모델링·기타","","주택법령상 징역 또는 벌금의 부과 대상자는?\n① 지방자치단체의 장이 관계 공무원으로 하여금 사업장에 출입하여 필요한 검사를 하게 한 경우 그 검사를 방해한 자\n② 공동주택 품질점검단의 점검에 따르지 아니한 사업주체\n③ 주택조합의 임원으로서 다른 주택조합의 발기인을 겸직한 자\n④ 국토교통부장관이 거주의무자의 실제 거주 여부를 확인하기 위하여 소속 공무원으로 하여금 분양가상한제 적용주택에 출입하여 조사하게 한 경우 그 조사를 기피한 자\n⑤ 공동주택 품질점검단의 점검결과에 따라 사용검사권자 로부터 보수ㆍ보강 등의 조치 명령을 받았으나 이를 이행하지 아니한 사업주체","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",11,0],[33,2022,21,69,3,"주택법","주택공급·분양가상한·전매제한","박스형(모두고르기), 옳은것 고르기","주택법령상 분양가상한제 적용주택에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 도시형 생활주택은 분양가상한제 적용주택에 해당하지 않는다.\nㄴ. 토지임대부 분양주택의 분양가격은 택지비와 건축비로 구성된다.\nㄷ. 사업주체는 분양가상한제 적용주택으로서 공공 택지에서 공급하는 주택에 대하여 입주자 모집 공고에 분양가격을 공시해야 하는데, 간접비는 공시해야 하는 분양가격에 포함되지 않는다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",11,0],[33,2022,21,70,3,"주택법","리모델링·기타","옳은것 고르기","주택법령상 리모델링에 관한 설명으로 옳은 것은?\n(단, 조례는 고려하지 않음)\n① 대수선은 리모델링에 포함되지 않는다.\n② 공동주택의 리모델링은 동별로 할 수 있다.\n③ 주택단지 전체를 리모델링하고자 주택조합을 설립하기 위해서는 주택단지 전체의 구분소유자와 의결권의 각 과반수의 결의가 필요하다.\n④ 공동주택 리모델링의 허가는 시ㆍ도지사가 한다.\n⑤ 리모델링주택조합 설립에 동의한 자로부터 건축물을 취득하였더라도 리모델링주택조합 설립에 동의한 것으로 보지 않는다.","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",11,0],[33,2022,21,71,3,"주택법","리모델링·기타","틀린것 고르기","주택법령상 시ㆍ도지사에게 위임한 국토교통부장관의 권한이 아닌 것은?\n① 주택건설사업의 등록\n② 주택건설사업자의 등록말소\n③ 사업계획승인을 받아 시행하는 주택건설사업을 완료한 경우의 사용검사\n④ 사업계획승인을 받아 시행하는 주택건설사업을 완료한 경우의 임시 사용승인\n⑤ 주택건설사업자의 영업의 정지 2022년 제33회 공인중개사","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",11,0],[33,2022,21,72,3,"건축법","건축법 일반","틀린것 고르기","건축법령상 안전영향평가기관이 안전영향평가를 실시할 때 검토하여야 하는 사항에 해당하지 않는 것은?\n(단, 기타 국토교통부장관이 필요하다고 인정하는 사항은 고려하지 않음)\n① 해당 건축물에 적용된 설계 기준 및 하중의 적정성\n② 해당 건축물의 하중저항시스템의 해석 및 설계의 적정성\n③ 지반조사 방법 및 지내력(地耐力) 산정결과의 적정성\n④ 굴착공사에 따른 지하수위 변화 및 지반 안전성에 관한 사항\n⑤ 해당 건축물의 안전영향평가를 위하여 지방건축위원회가 결정하는 사항","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",11,0],[33,2022,21,73,3,"건축법","대지·도로·건축선","빈칸","건축법령상 대지 안의 피난 및 소화에 필요한 통로 설치에 관한 규정의 일부이다. ( )에 들어갈 숫자를 바르게 나열한 것은?\n제41조(대지 안의 피난 및 소화에 필요한 통로 설치) ① 건축물의 대지 안에는 그 건축물 바깥쪽으로 통하는 주된 출구와 지상으로 통하는 피난계단및 특별피난계단으로부터 도로 또는 공지 (…생략…) 로 통하는 통로를 다음 각 호의 기준에 따라 설치하여야 한다.\n1. 통로의 너비는 다음 각 목의 구분에 따른 기준에 따라 확보할 것\n가. 단독주택: 유효 너비 ( ㄱ )미터 이상\n나. 바닥면적의 합계가 ( ㄴ )제곱미터 이상인 문화및 집회시설, 종교시설, 의료시설, 위락시설 또는 장례시설: 유효 너비 ( ㄷ )미터 이상\n다. 그 밖의 용도로 쓰는 건축물: 유효 너비 ( ㄹ ) 미터 이상 < 이하 생략 >\n① ㄱ: 0.9, ㄴ: 300, ㄷ: 1, ㄹ: 1.5\n② ㄱ: 0.9, ㄴ: 500, ㄷ: 3, ㄹ: 1.5\n③ ㄱ: 1, ㄴ: 300, ㄷ: 1, ㄹ: 1.5\n④ ㄱ: 1, ㄴ: 500, ㄷ: 3, ㄹ: 1.2\n⑤ ㄱ: 1.5, ㄴ: 300, ㄷ: 3, ㄹ: 1.2","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",11,0],[33,2022,21,74,3,"건축법","건축물·용어·적용범위","옳은것 고르기","건축법령상 제1종 근린생활시설에 해당하는 것은?\n(단, 동일한 건축물 안에서 당해 용도에 쓰이는 바닥면적의 합계는 1,000m2임)\n① 극장 ② 서점 ③ 탁구장\n④ 파출소 ⑤ 산후조리원","5","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",11,0],[33,2022,21,75,3,"건축법","특별건축구역·건축협정·이행강제금","틀린것 고르기","건축법령상 결합건축을 할 수 있는 지역ㆍ구역에 해당하지 않는 것은? (단, 조례는 고려하지 않음)\n① ｢국토의 계획 및 이용에 관한 법률｣에 따라 지정된 상업지역\n② ｢역세권의 개발 및 이용에 관한 법률｣에 따라 지정된 역세권개발구역\n③ 건축협정구역\n④ 특별가로구역\n⑤ 리모델링 활성화 구역","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",12,0],[33,2022,21,76,3,"건축법","건축물·용어·적용범위","박스형(모두고르기)","건축법령상 특별건축구역에서 국가가 건축하는 건축물에 적용하지 아니할 수 있는 사항을 모두 고른 것은? (단, 건축법령상 특례 및 조례는 고려하지 않음)\nㄱ. ｢건축법｣ 제42조 대지의 조경에 관한 사항\nㄴ. ｢건축법｣ 제44조 대지와 도로의 관계에 관한 사항\nㄷ. ｢건축법｣ 제57조 대지의 분할 제한에 관한 사항\nㄹ. ｢건축법｣ 제58조 대지 안의 공지에 관한 사항\n① ㄱ, ㄴ ② ㄱ, ㄷ ③ ㄱ, ㄹ ④ ㄴ, ㄷ ⑤ ㄷ, ㄹ","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",12,0],[33,2022,21,77,3,"건축법","건축물·용어·적용범위","틀린것 고르기","건축법령상 건축물의 면적 등의 산정방법에 관한 설명으로 틀린 것은? (단, 건축법령상 특례는 고려하지 않음)\n① 공동주택으로서 지상층에 설치한 조경시설의 면적은 바닥면적에 산입하지 않는다.\n② 지하주차장의 경사로의 면적은 건축면적에 산입한다.\n③ 태양열을 주된 에너지원으로 이용하는 주택의 건축면적은 건축물의 외벽중 내측 내력벽의 중심선을 기준으로 한다.\n④ 용적률을 산정할 때에는 지하층의 면적은 연면적에 산입하지 않는다.\n⑤ 층의 구분이 명확하지 아니한 건축물의 높이는 4미터마 다 하나의 층으로 보고 그 층수를 산정한다.","2","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",12,0],[33,2022,21,78,3,"국토계획법","개발행위허가·성장관리","박스형(모두고르기)","건축법령상 건축허가대상 건축물을 건축하려는 자가 건축 관련 입지와 규모의 사전결정 통지를 받은 경우에 허가를 받은 것으로 볼 수 있는 것을 모두 고른 것은? (단, 미리 관계 행정기관의 장과 사전결정에 관하여 협의한 것을 전제로 함)\nㄱ. ｢농지법｣ 제34조에 따른 농지전용허가\nㄴ. ｢하천법｣ 제33조에 따른 하천점용허가\nㄷ. ｢국토의 계획 및 이용에 관한 법률｣ 제56조에 따른 개발행위허가\nㄹ. 도시지역 외의 지역에서 ｢산지관리법｣ 제14조에 따른 보전산지에 대한 산지전용허가\n① ㄱ, ㄴ ② ㄷ, ㄹ ③ ㄱ, ㄴ, ㄷ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ 2022년 제33회 공인중개사","3","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",12,0],[33,2022,21,79,3,"농지법","농지 소유·이용·보전","틀린것 고르기","농지법령상 농지는 자기의 농업경영에 이용하거나 이용할 자가 아니면 소유하지 못함이 원칙이다. 그 예외에 해당하지 않는 것은?\n① 8년 이상 농업경영을 하던 사람이 이농한 후에도 이농 당시 소유 농지 중 1만제곱미터를 계속 소유하면서 농업경영에 이용되도록 하는 경우\n② 농림축산식품부장관과 협의를 마치고 ｢공익사업을 위한 토지 등의 취득 및 보상에 관한 법률｣에 따라 농지를 취득하여 소유하면서 농업경영에 이용되도록 하는 경우\n③ ｢공유수면 관리 및 매립에 관한 법률｣에 따라 매립농지를 취득하여 소유하면서 농업경영에 이용되도록 하는 경우\n④ 주말ㆍ체험영농을 하려고 농업진흥지역 내의 농지를 소유하는 경우\n⑤ ｢초ㆍ중등교육법｣ 및 ｢고등교육법｣에 따른 학교가 그 목적사업을 수행하기 위하여 필요한 연구지ㆍ실습지로 쓰기 위하여 농림축산식품부령으로 정하는 바에 따라 농지를 취득하여 소유하는 경우","4","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",12,0],[33,2022,21,80,3,"농지법","농지 소유·이용·보전","틀린것 고르기","농지법령상 농지대장에 관한 설명으로 틀린 것은?\n① 농지대장은 모든 농지에 대해 필지별로 작성하는 것은 아니다.\n② 농지대장에 적을 사항을 전산정보처리조직으로 처리하는 경우 그 농지대장 파일은 농지대장으로 본다.\n③ 시ㆍ구ㆍ읍ㆍ면의 장은 관할구역 안에 있는 농지가 농지전용허가로 농지에 해당하지 않게 된 경우에는 그 농지대장을 따로 편철하여 10년간 보존해야 한다.\n④ 농지소유자 또는 임차인은 농지의 임대차계약이 체결된 경우 그 날부터 60일 이내에 시ㆍ구ㆍ읍ㆍ면의 장에게 농지대장의 변경을 신청하여야 한다.\n⑤ 농지대장의 열람은 해당 시ㆍ구ㆍ읍ㆍ면의 사무소 안에서 관계공무원의 참여 하에 해야 한다.","1","1W3EzvIabI8O9ZoY_yShPOe3yXfRq9r5T",12,0],[33,2022,22,1,4,"공간정보법","공간정보법 일반","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 대지권등록부의 등록사항만으로 나열된 것이 아닌 것은?\n① 지번, 지목\n② 토지의 소재, 토지의 고유번호\n③ 대지권 비율, 전유부분(專有部分)의 건물표시\n④ 소유권 지분, 토지소유자가 변경된 날과 그 원인\n⑤ 건물의 명칭, 집합건물별 대지권등록부의 장번호","1","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",1,0],[33,2022,22,2,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","옳은것 고르기, 빈칸","공간정보의 구축 및 관리 등에 관한 법령상 축척변경에 따른 청산금에 관한 이의신청에 대한 설명이다.\n( )에 들어갈 내용으로 옳은 것은?\n○ 납부고지되거나 수령통지된 청산금에 관하여 이의가 있는 자는 납부고지 또는 수령통지를 받은 날부터 ( ㄱ )에 지적소관청에 이의신청을 할 수 있다.\n○ 이의신청을 받은 지적소관청은 ( ㄴ )에 축척변경위원회의 심의ㆍ의결을 거쳐 그 인용(認容) 여부를 결정한 후 지체 없이 그 내용을 이의신 청인에게 통지하여야 한다.\n① ㄱ: 15일 이내, ㄴ: 2개월 이내\n② ㄱ: 1개월 이내, ㄴ: 2개월 이내\n③ ㄱ: 1개월 이내, ㄴ: 1개월 이내\n④ ㄱ: 2개월 이내, ㄴ: 1개월 이내\n⑤ ㄱ: 2개월 이내, ㄴ: 15일 이내","3","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",1,0],[33,2022,22,3,4,"공간정보법","지번·지목·면적·경계","옳은것 고르기, 빈칸","공간정보의 구축 및 관리 등에 관한 법령상 토지의 조사ㆍ등록에 관한 설명이다. ( )에 들어갈 내용으로 옳은 것은?\n지적소관청은 토지의 이동현황을 직권으로 조사ㆍ측량하여 토지의 지번ㆍ지목ㆍ면적ㆍ경계 또는 좌표를 결정하려는 때에는 토지이동현황 조사계획을 수립하여야 한다. 이 경우 토지이동현황 조사계획은 ( ㄱ )별로 수립하되, 부득이한 사유가 있는 때에는 ( ㄴ )별로 수립할 수 있다.\n① ㄱ: 시ㆍ군ㆍ구, ㄴ: 읍ㆍ면ㆍ동\n② ㄱ: 시ㆍ군ㆍ구, ㄴ: 시ㆍ도\n③ ㄱ: 읍ㆍ면ㆍ동, ㄴ: 시ㆍ군ㆍ구\n④ ㄱ: 읍ㆍ면ㆍ동, ㄴ: 시ㆍ도\n⑤ ㄱ: 시ㆍ도, ㄴ: 시ㆍ군ㆍ구","1","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",1,0],[33,2022,22,4,4,"공간정보법","지번·지목·면적·경계","옳은것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지목의 구분에 관한 설명으로 옳은 것은?\n① 온수ㆍ약수ㆍ석유류 등을 일정한 장소로 운송하는 송수 관ㆍ송유관 및 저장시설의 부지는 “광천지”로 한다. 2022년 제33회 공인중개\n② 사과ㆍ배ㆍ밤ㆍ호두ㆍ귤나무 등 과수류를 집단적으로 재배하는 토지와 이에 접속된 주거용 건축물의 부지는 “과수원”으로 한다.\n③ 종교용지에 있는 유적ㆍ고적ㆍ기념물 등을 보호하기 위하여 구획된 토지는 “사적지”로 한다.\n④ 물을 정수하여 공급하기 위한 취수ㆍ저수ㆍ도수(導水)ㆍ정수ㆍ송수 및 배수 시설의 부지 및 이에 접속된 부속시설물의 부지는 “수도용지”로 한다.\n⑤ 교통 운수를 위하여 일정한 궤도 등의 설비와 형태를 갖추어 이용되는 토지와 이에 접속된 차고ㆍ발전시설 등 부속시설물의 부지는 “도로”로 한다.","4","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",1,0],[33,2022,22,5,4,"공간정보법","지적공부·부동산종합공부","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 부동산종합공부의 등록사항에 해당하지 않는 것은?\n① 토지의 이용 및 규제에 관한 사항: ｢토지이용규제 기본법｣ 제10조에 따른 토지이용계획확인서의 내용\n② 건축물의 표시와 소유자에 관한 사항(토지에 건축물이 있는 경우만 해당한다): ｢건축법｣ 제38조에 따른 건축물대장의 내용\n③ 토지의 표시와 소유자에 관한 사항: ｢공간정보의 구축및 관리 등에 관한 법률｣에 따른 지적공부의 내용\n④ 부동산의 가격에 관한 사항: ｢부동산 가격공시에 관한 법률｣ 제10조에 따른 개별공시지가, 같은 법 제16조, 제17조및 제18조에 따른 개별주택가격 및 공동주택가격 공시내용\n⑤ 부동산의 효율적 이용과 토지의 적성에 관한 종합적 관리ㆍ운영을 위하여 필요한 사항: ｢국토의 계획 및 이용에 관한 법률｣ 제20조 및 제27조에 따른 토지적성평가서의 내용","5","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",1,0],[33,2022,22,6,4,"공간정보법","공간정보법 일반","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적전 산자료의 이용 또는 활용에 관한 승인신청을 받은 국토교통부장관, 시ㆍ도지사 또는 지적소관청이 심사하여야 하는 사항이 아닌 것은?\n① 개인의 사생활 침해 여부\n② 지적전산코드 지정의 적정 여부\n③ 자료의 목적 외 사용 방지 및 안전관리대책\n④ 신청한 사항의 처리가 전산정보처리조직으로 가능한지 여부\n⑤ 신청한사항의처리가지적업무수행에지장을주지않는지여부","전항정답","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",1,0],[33,2022,22,7,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 축척변경에 관한 설명으로 틀린 것은?\n① 축척변경에 관한 사항을 심의ㆍ의결하기 위하여 지적소관청에 축척변경위원회를 둔다.\n② 축척변경위원회의 위원장은 위원 중에서 지적소관청이 지명한다.\n③ 지적소관청은 축척변경에 관한 측량을 완료하였을 때에는 축척변경 신청일 현재의 지적공부상의 면적과 측량 후의 면적을 비교하여 그 변동사항을 표시한 토지이동현황 조사서를 작성하여야 한다.\n④ 지적소관청은 청산금의 결정을 공고한 날부터 20일 이내에 토지소유자에게 청산금의 납부고지 또는 수령통지를 하여야 한다.\n⑤ 청산금의 납부 및 지급이 완료되었을 때에는 지적소관청은 지체 없이 축척변경의 확정공고를 하여야 한다. 개","3","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",1,0],[33,2022,22,8,4,"공간정보법","지적측량·지적위원회","옳은것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적측량의 의뢰, 지적기준점성과의 보관ㆍ열람 및 등본 발급 등에 관한 설명으로 옳은 것은?\n① 지적삼각보조점성과 및 지적도근점성과를 열람하거나 등본을 발급받으려는 자는 지적측량수행자에게 신청하여야 한다.\n② 지적측량을 의뢰하려는 자는 지적측량 의뢰서에 의뢰 사유를 증명하는 서류를 첨부하여 지적소관청에 제출하여야 한다.\n③ 시ㆍ도지사나 지적소관청은 지적기준점성과와 그 측량기 록을 보관하고 일반인이 열람할 수 있도록 하여야 한다.\n④ 지적소관청이 지적측량 의뢰를 받은 때에는 측량기간, 측량일자 및 측량 수수료 등을 적은 지적측량 수행계획서를 그 다음 날까지 지적측량수행자에게 제출하여야 한다.\n⑤ 지적측량 의뢰인과 지적측량수행자가 서로 합의하여 따로 기간을 정하는 경우에는 그 기간에 따르되, 전체 기간의 4분의 1은 측량기간으로, 전체 기간의 4분의 3은 측량검사기간으로 본다.","3","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",2,0],[33,2022,22,9,4,"공간정보법","지적측량·지적위원회","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적측량을 실시하여야 하는 경우로 틀린 것은?\n① 지적기준점을 정하는 경우\n② 경계점을 지상에 복원하는 경우\n③ 지상건축물 등의 현황을 지형도에 표시하는 경우\n④ 바다가 된 토지의 등록을 말소하는 경우로서 측량을 할 필요가 있는 경우\n⑤ 지적공부의 등록사항을 정정하는 경우로서 측량을 할 필요가 있는 경우","3","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",2,0],[33,2022,22,10,4,"공간정보법","지적공부·부동산종합공부","옳은것 고르기, 빈칸","공간정보의 구축 및 관리 등에 관한 법령상 토지소유자의 정리에 관한 설명이다. ( )에 들어갈 내용으로 옳은 것은?\n지적공부에 등록된 토지소유자의 변경사항은 등기관서에서 등기한 것을 증명하는 등기필증, 등기 완료통지서, 등기사항증명서 또는 등기관서에서 제공한 등기전산정보자료에 따라 정리한다. 다만,\n( ㄱ )하는 토지의 소유자는 ( ㄴ )이(가) 직접 조사하여 등록한다.\n① ㄱ: 축척변경, ㄴ: 등기관\n② ㄱ: 축척변경, ㄴ: 시ㆍ도지사\n③ ㄱ: 신규등록, ㄴ: 등기관\n④ ㄱ: 신규등록, ㄴ: 지적소관청\n⑤ ㄱ: 등록전환, ㄴ: 시ㆍ도지사","4","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",2,0],[33,2022,22,11,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","옳은것 고르기, 빈칸","공간정보의 구축 및 관리 등에 관한 법령상 축척변경 신청에 관한 설명이다. ( )에 들어갈 내용으로 옳은 것은?\n축척변경을 신청하는 토지소유자는 축척변경 사유를 적은 신청서에 축척변경 시행지역의 토지소유자 ( )의 동의서를 첨부하여 지적소관청에 제출하여야 한다.\n① 2분의 1 이상 ② 3분의 2 이상 ③ 4분의 1 이상\n④ 5분의 2 이상 ⑤ 5분의 3 이상 2022년 제33회 공인중개","2","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",2,0],[33,2022,22,12,4,"공간정보법","지적공부·부동산종합공부","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적공부의 복구에 관한 관계 자료가 아닌 것은?\n① 지적측량 의뢰서\n② 지적공부의 등본\n③ 토지이동정리 결의서\n④ 법원의 확정판결서 정본 또는 사본\n⑤ 지적소관청이 작성하거나 발행한 지적공부의 등록내용을 증명하는 서류","1","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",2,0],[33,2022,22,13,4,"부동산등기법","등기신청(공동·단독·전자신청)","옳은것 고르기","매매를 원인으로 한 토지소유권이전등기를 신청하는 경우에 부동산등기규칙상 신청정보의 내용으로 등기소에 제공해야 하는 사항으로 옳은 것은?\n① 등기권리자의 등기필정보\n② 토지의 표시에 관한 사항 중 면적\n③ 토지의 표시에 관한 사항 중 표시번호\n④ 신청인이 법인인 경우에 그 대표자의 주민등록번호\n⑤ 대리인에 의하여 등기를 신청하는 경우에 그 대리인의 주민등록번호","2","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",2,0],[33,2022,22,14,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","박스형(모두고르기), 옳은것 고르기","등기신청인에 관한 설명 중 옳은 것을 모두 고른 것은?\nㄱ. 부동산표시의 변경이나 경정의 등기는 소유권의 등기명의인이 단독으로 신청한다.\nㄴ. 채권자가 채무자를 대위하여 등기신청을 하는 경우, 채무자가 등기신청인이 된다.\nㄷ. 대리인이 방문하여 등기신청을 대리하는 경우, 그 대리인은 행위능력자임을 요하지 않는다.\nㄹ. 부동산에 관한 근저당권설정등기의 말소등기를 함에 있어 근저당권 설정 후 소유권이 제3자에게 이전된 경우, 근저당권설정자 또는 제3취득자는 근저당권자와 공동으로 그 말소등기를 신청할 수 있다.\n① ㄱ, ㄷ ② ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",2,0],[33,2022,22,15,4,"부동산등기법","등기부·등기기록·구분건물","틀린것 고르기","전산이기된 등기부 등에 관한 설명으로 틀린 것은?\n① 등기부는 영구(永久)히 보존해야 한다.\n② 등기부는 법관이 발부한 영장에 의하여 압수하는 경우에는 대법원규칙으로 정하는 보관ㆍ관리 장소 밖으로 옮길 수 있다.\n③ 등기관이 등기를 마쳤을 때는 등기부부본자료를 작성해야 한다.\n④ 등기원인을 증명하는 정보에 대하여는 이해관계 있는 부분만 열람을 청구할 수 있다.\n⑤ 등기관이 등기기록의 전환을 위해 등기기록에 등기된 사항을 새로운 등기기록에 옮겨 기록한 때에는 종전 등기기록을 폐쇄해야 한다. 개","2","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",2,0],[33,2022,22,16,4,"부동산등기법","등기신청(공동·단독·전자신청)","판례, 틀린것 고르기","등기신청에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 상속인이 상속포기를 할 수 있는 기간 내에는 상속인의 채권자가 대위권을 행사하여 상속등기를 신청할 수 없다.\n② 가등기를 마친 후에 가등기권자가 사망한 경우, 그 상속인은 상속등기를 할 필요 없이 상속을 증명하는 서면을 첨부하여 가등기의무자와 공동으로 본등기를 신청할 수 있다.\n③ 건물이 멸실된 경우, 그 건물소유권의 등기명의인이 1 개월 이내에 멸실등기신청을 하지 않으면 그 건물대지의 소유자가 그 건물소유권의 등기명의인을 대위하여 멸실등기를 신청할 수 있다.\n④ 피상속인으로부터 그 소유의 부동산을 매수한 매수인이 등기신청을 하지 않고 있던 중 상속이 개시된 경우, 상속인은 신분을 증명할 수 있는 서류를 첨부하여 피상속인으로부터 바로 매수인 앞으로 소유권이전등기를 신청할 수 있다.\n⑤ 1동의 건물에 속하는 구분건물 중 일부만에 관하여 소유권보존등기를 신청하면서 나머지 구분건물의 표시에 관한 등기를 동시에 신청하는 경우, 구분건물의 소유자는 1동에 속하는 다른 구분건물의 소유자를 대위하여 그 건물의 표시에 관한 등기를 신청할 수 있다.","1","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",3,0],[33,2022,22,17,4,"부동산등기법","소유권 등기(보존·이전·신탁·공동소유)","틀린것 고르기","2022년에 체결된 ｢부동산 거래신고 등에 관한 법률｣ 제3 조제1항제1호의 부동산 매매계약의 계약서를 등기원인증서로 하는 소유권이전등기에 관한 설명으로 틀린 것은?\n① 신청인은 위 법률에 따라 신고한 거래가액을 신청정보의 내용으로 등기소에 제공해야 한다.\n② 신청인은 시장ㆍ군수 또는 구청장이 제공한 거래계약신 고필증정보를 첨부정보로서 등기소에 제공해야 한다.\n③ 신고 관할관청이 같은 거래부동산이 2개 이상인 경우, 신청인은 매매목록을 첨부정보로서 등기소에 제공해야 한다.\n④ 거래부동산이 1개라 하더라도 여러 명의 매도인과 여러 명의 매수인 사이의 매매계약인 경우에는 매매목록을 첨부정보로서 등기소에 제공해야 한다.\n⑤ 등기관은 거래가액을 등기기록 중 갑구의 등기원인란에 기록하는 방법으로 등기한다.","5","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",3,0],[33,2022,22,18,4,"공간정보법","지적공부·부동산종합공부","틀린것 고르기","대장은 편성되어 있으나 미등기인 부동산의 소유권보존등기에 관한 설명으로 틀린 것은?\n① 등기관이 보존등기를 할 때에는 등기원인과 그 연월일을 기록해야 한다.\n② 대장에 최초 소유자로 등록된 자의 상속인은 보존등기를 신청할 수 있다.\n③ 수용으로 인하여 소유권을 취득하였음을 증명하는 자는 미등기토지에 대한 보존등기를 신청할 수 있다.\n④ 군수의 확인에 의해 미등기건물에 대한 자기의 소유권을 증명하는 자는 보존등기를 신청할 수 있다.\n⑤ 등기관이 법원의 촉탁에 따라 소유권의 처분제한의 등기를 할 때는 직권으로 보존등기를 한다.","1","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",3,0],[33,2022,22,19,4,"부동산등기법","부기·말소·회복·변경·경정 등기","옳은것 고르기","부기로 하는 등기로 옳은 것은?\n① 부동산멸실등기 2022년 제33회 공인중개\n② 공유물 분할금지의 약정등기\n③ 소유권이전등기\n④ 토지분필등기\n⑤ 부동산의 표시변경등기 등 표제부의 등기","2","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",3,0],[33,2022,22,20,4,"부동산등기법","등기 일반·효력","틀린것 고르기","환매특약의 등기에 관한 설명으로 틀린 것은?\n① 매매비용을 기록해야 한다.\n② 매수인이 지급한 대금을 기록해야 한다.\n③ 환매특약등기는 매매로 인한 소유권이전등기가 마쳐진 후에 신청해야 한다.\n④ 환매기간은 등기원인에 그 사항이 정하여져 있는 경우에만 기록한다.\n⑤ 환매에 따른 권리취득의 등기를 한 경우, 등기관은 특별한 사정이 없는 한 환매특약의 등기를 직권으로 말소해 야 한다.","3","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",3,0],[33,2022,22,21,4,"부동산등기법","가등기","옳은것 고르기","가등기에 관한 설명으로 옳은 것은?\n① 가등기명의인은 그 가등기의 말소를 단독으로 신청할 수 없다.\n② 가등기의무자는 가등기명의인의 승낙을 받더라도 가등기의 말소를 단독으로 신청할 수 없다.\n③ 가등기권리자는 가등기를 명하는 법원의 가처분명령이 있더라도 단독으로 가등기를 신청할 수 없다.\n④ 하나의 가등기에 관하여 여러 사람의 가등기권자가 있는 경우, 그 중 일부의 가등기권자는 공유물보존행위에 준하여 가등기 전부에 관한 본등기를 신청할 수 없다.\n⑤ 가등기목적물의 소유권이 가등기 후에 제3자에게 이전된 경우, 가등기에 의한 본등기신청의 등기의무자는 그 제3자이다.","4","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",3,0],[33,2022,22,22,4,"부동산등기법","용익권·담보권 등기","판례, 틀린것 고르기","전세권 등기에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 전세권 설정등기를 하는 경우, 등기관은 전세금을 기록해야 한다.\n② 전세권의 사용ㆍ수익 권능을 배제하고 채권담보만을 위해 전세권을 설정한 경우, 그 전세권설정등기는 무효이다.\n③ 집합건물에 있어서 특정 전유부분의 대지권에 대하여는 전세권설정등기를 할 수가 없다.\n④ 전세권의 목적인 범위가 건물의 일부로서 특정 층 전부 인 경우에는 전세권설정등기 신청서에 그 층의 도면을 첨부해야 한다.\n⑤ 乙 명의의 전세권등기와 그 전세권에 대한 丙 명의의 가압류가 순차로 마쳐진 甲 소유 부동산에 대하여 乙 명의의 전세권등기를 말소하라는 판결을 받았다고 하더라도 그 판결에 의하여 전세권말소등기를 신청할 때에는 丙의 승낙서 또는 丙에게 대항할 수 있는 재판의 등본을 첨부해야 한다. 개","4","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",3,0],[33,2022,22,23,4,"부동산등기법","소유권 등기(보존·이전·신탁·공동소유)","틀린것 고르기","토지에 대한 소유권이전청구권보전 가등기에 기하여 소유권이전의 본등기를 한 경우, 그 가등기 후 본등기 전에 마쳐진 등기 중 등기관의 직권말소 대상이 아닌 것은?\n① 지상권설정등기\n② 지역권설정등기\n③ 저당권설정등기\n④ 임차권설정등기\n⑤ 해당 가등기상 권리를 목적으로 하는 가압류등기","5","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",4,0],[33,2022,22,24,4,"부동산등기법","소유권 등기(보존·이전·신탁·공동소유)","틀린것 고르기","부동산등기법상 신탁등기에 관한 설명으로 틀린 것은?\n① 수익자는 수탁자를 대위하여 신탁등기를 신청할 수 있다.\n② 신탁등기의 말소등기는 수탁자가 단독으로 신청할 수 있다.\n③ 신탁가등기는 소유권이전청구권보전을 위한 가등기와 동일한 방식으로 신청하되, 신탁원부 작성을 위한 정보를 첨부정보로서 제공해야 한다.\n④ 여러 명의 수탁자 중 1인의 임무종료로 인한 합유명의인 변경등기를 한 경우에는 등기관은 직권으로 신탁원부 기록을 변경해야 한다.\n⑤ 법원이 신탁관리인 선임의 재판을 한 경우, 그 신탁관리인은 지체없이 신탁원부 기록의 변경등기를 신청해야 한다.","5","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",4,0],[33,2022,22,25,5,"조세총론","조세총론(납세의무·부과·징수)","박스형(모두고르기), 옳은것 고르기","지방세기본법상 이의신청과 심판청구에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 통고처분은 이의신청 또는 심판청구의 대상이 되는 처분에 포함된다.\nㄴ. 이의신청인은 신청 또는 청구 금액이 8백만원인 경우에는 그의 배우자를 대리인으로 선임할 수 있다.\nㄷ. 보정기간은 결정기간에 포함하지 아니한다.\nㄹ. 이의신청을 거치지 아니하고 바로 심판청구를 할 수는 없다.\n① ㄱ ② ㄴ ③ ㄱ, ㄹ ④ ㄴ, ㄷ ⑤ ㄷ, ㄹ","4","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",4,0],[33,2022,22,26,5,"조세총론","조세총론(납세의무·부과·징수)","틀린것 고르기","지방세기본법상 서류의 송달에 관한 설명으로 틀린 것은?\n① 연대납세의무자에게 납세의 고지에 관한 서류를 송달할 때에는 연대납세의무자 모두에게 각각 송달하여야 한다.\n② 기한을 정하여 납세고지서를 송달하였더라도 서류가 도달한 날부터 10일이 되는 날에 납부기한이 되는 경우 지방자치단체의 징수금의 납부기한은 해당 서류가 도달한 날부터 14일이 지난 날로 한다.\n③ 납세관리인이 있을 때에는 납세의 고지와 독촉에 관한 서류는 그 납세관리인의 주소 또는 영업소에 송달한다.\n④ 교부에 의한 서류송달의 경우에 송달할 장소에서 서류를 송달받아야 할 자를 만나지 못하였을 때에는 그의 사용인으로서 사리를 분별할 수 있는 사람에게 서류를 송달할 수 있다.\n⑤ 서류송달을 받아야 할 자의 주소 또는 영업소가 분명하지 아니한 경우에는 서류의 주요 내용을 공고한 날부터 14일이 지나면 서류의 송달이 된 것으로 본다. 2022년 제33회 공인중개","2","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",4,0],[33,2022,22,27,5,"재산세","재산세","박스형(모두고르기), 옳은것 고르기","지방세법상 재산세 과세대상의 구분에 있어 주거용과 주거 외의 용도를 겸하는 건물 등에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 1동(棟)의 건물이 주거와 주거 외의 용도로 사용되고 있는 경우에는 주거용으로 사용되는 부분만을 주택으로 본다.\nㄴ. 1구(構)의 건물이 주거와 주거 외의 용도로 사용되고 있는 경우 주거용으로 사용되는 면적이 전체의 100분의 60인 경우에는 주택으로 본다.\nㄷ. 주택의 부속토지의 경계가 명백하지 아니한 경우에는 그 주택의 바닥면적의 10배에 해당하는 토지를 주택의 부속토지로 한다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","5","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",4,0],[33,2022,22,28,5,"재산세","재산세","틀린것 고르기","지방세법상 재산세에 관한 설명으로 틀린 것은?(단, 주어진 조건 외에는 고려하지 않음)\n① 재산세 과세기준일 현재 공부상에 개인 등의 명의로 등재되어 있는 사실상의 종중재산으로서 종중소유임을 신고하지 아니하였을 때에는 공부상 소유자는 재산세를 납부할 의무가 있다.\n② 지방자치단체가 1년 이상 공용으로 사용하는 재산에 대하여는 소유권의 유상이전을 약정한 경우로서 그 재산을 취득하기 전에 미리 사용하는 경우 재산세를 부과하지 아니한다.\n③ 재산세 과세기준일 현재 소유권의 귀속이 분명하지 아니하여 사실상의 소유자를 확인할 수 없는 경우에는 그 사용자가 재산세를 납부할 의무가 있다.\n④ 재산세의 납기는 토지의 경우 매년 9월 16일부터 9월 30일까지이며, 건축물의 경우 매년 7월 16일부터 7월 31일까지이다.\n⑤ 재산세의 납기에도 불구하고 지방자치단체의 장은 과세대상 누락, 위법 또는 착오 등으로 인하여 이미 부과한 세액을 변경하거나 수시부과하여야 할 사유가 발생하면 수시로 부과ㆍ징수할 수 있다.","2","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",4,0],[33,2022,22,29,5,"종합부동산세","종합부동산세","옳은것 고르기","종합부동산세법상 주택에 대한 과세 및 납세지에 관한 설명으로 옳은 것은?\n① 납세의무자가 법인이며 3주택 이상을 소유한 경우 소유한 주택 수에 따라 과세표준에 1.2%∼6%의 세율을 적용하여 계산한 금액을 주택분 종합부동산세액으로 한다.\n② 납세의무자가 법인으로 보지 않는 단체인 경우 주택에 대한 종합부동산세 납세지는 해당 주택의 소재지로 한다.\n③ 과세표준 합산의 대상에 포함되지 않는 주택을 보유한 납세의무자는 해당 연도 10월 16일부터 10월 31일까지 관할세무서장에게 해당 주택의 보유현황을 신고하여야 한다.\n④ 종합부동산세 과세대상 1세대 1주택자로서 과세기준일 현재 해당 주택을 12년 보유한 자의 보유기간별 세액공 제에 적용되는 공제율은 100분의 50이다.\n⑤ 과세기준일 현재 주택분 재산세의 납세의무자는 종합부동산세를 납부할 의무가 있다. 개","5","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",4,0],[33,2022,22,30,5,"종합부동산세","종합부동산세","옳은것 고르기","종합부동산세법상 토지 및 주택에 대한 과세와 부과ㆍ징수에 관한 설명으로 옳은 것은?\n① 종합합산과세대상인 토지에 대한 종합부동산세의 세액은 과세표준에 1%∼5%의 세율을 적용하여 계산한 금액으로 한다.\n② 종합부동산세로 납부해야 할 세액이 200만원인 경우 관할세무서장은 그 세액의 일부를 납부기한이 지난 날부터 6개월 이내에 분납하게 할 수 있다.\n③ 관할세무서장이 종합부동산세를 징수하려면 납부기간 개시 5일 전까지 주택분과 토지분을 합산한 과세표준과 세액을 납부고지서에 기재하여 발급하여야 한다.\n④ 종합부동산세를 신고납부방식으로 납부하고자 하는 납세의무자는 종합부동산세의 과세표준과 세액을 해당 연도 12월 1일부터 12월 15일까지 관할세무서장에게 신고하여야 한다.\n⑤ 별도합산과세대상인 토지에 대한 종합부동산세의 세액은 과세표준에 0.5%∼0.8%의 세율을 적용하여 계산한 금액으로 한다.","4","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",5,0],[33,2022,22,31,5,"종합소득세","부동산임대 사업소득","계산","다음은 거주자 甲이 소유하고 있는 상가건물 임대에 관한 자료이다. 부동산임대업의 사업소득을 장부에 기 장하여 신고하는 경우 2022년도 부동산임대업의 총수입금액은?(단, 법령에 따른 적격증명서류를 수취ㆍ보관하고 있으며, 주어진 조건 이외에는 고려하지 않음)\n○ 임대기간: 2022. 1. 1. ∼ 2023. 12. 31.\n○ 임대계약 내용: 월임대료 1,000,000원 임대보증금 500,000,000원\n○ 임대부동산(취득일자: 2021. 1. 23.)\n- 건물 취득가액: 200,000,000원\n- 토지 취득가액: 300,000,000원\n○ 기획재정부령으로 정하는 이자율: 연 6%\n○ 임대보증금 운용수익: 수입이자 1,000,000원 유가증권처분이익 2,000,000원\n① 18,000,000원 ② 29,000,000원 ③ 30,000,000원\n④ 39,000,000원 ⑤ 40,000,000원","2","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",5,0],[33,2022,22,32,5,"양도소득세","양도소득세","계산","거주자 甲의 매매(양도일: 2022. 5. 1.)에 의한 등기된 토지 취득 및 양도에 관한 다음의 자료를 이용하여 양도소득세 과세표준을 계산하면?(단, 법령에 따른 적격증명서류를 수취ㆍ보관하고 있으며, 주어진 조건 이외에는 고려하지 않음) 항목 기준시가 실지거래가액 양도가액 40,000,000원 67,000,000원 취득가액 35,000,000원 42,000,000원\n○ 양도비용: 4,000,000원 추가사항\n○ 보유기간: 2년\n① 18,500,000원 ② 19,320,000원 ③ 19,740,000원\n④ 21,000,000원 ⑤ 22,500,000원 2022년 제33회 공인중개","1","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",5,0],[33,2022,22,33,5,"양도소득세","양도소득세","옳은것 고르기","소득세법상 거주자의 양도소득세 신고납부에 관한 설명으로 옳은 것은?\n① 건물을 신축하고 그 취득일부터 3년 이내에 양도하는 경우로서 감정가액을 취득가액으로 하는 경우에는 그 감정가액의 100분의 3에 해당하는 금액을 양도소득 결정세액에 가산한다.\n② 공공사업의 시행자에게 수용되어 발생한 양도소득세액이 2천만원을 초과하는 경우 납세의무자는 물납을 신청할 수 있다.\n③ 과세표준 예정신고와 함께 납부하는 때에는 산출세액에서 납부할 세액의 100분의 5에 상당하는 금액을 공제한다.\n④ 예정신고납부할 세액이 1천 5백만원인 자는 그 세액의 100분의 50의 금액을 납부기한이 지난 후 2개월 이내에 분할납부할 수 있다.\n⑤ 납세의무자가 법정신고기한까지 양도소득세의 과세표준 신고를 하지 아니한 경우(부정행위로 인한 무신고는 제외)에는 그 무신고납부세액에 100분의 20을 곱한 금액을 가산세로 한다.","5","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",5,0],[33,2022,22,34,5,"양도소득세","양도소득세","틀린것 고르기, 계산","거주자 甲은 2016. 10. 20. 취득한 토지(취득가액 1억원, 등기함)를 동생인 거주자 乙(특수관계인임)에게\n2019. 10. 1. 증여(시가 3억원, 등기함)하였다. 乙은 해당 토지를 2022. 6. 30. 특수관계가 없는 丙에게 양도(양도가액 10억원)하였다. 양도소득은 乙에게 실질적으로 귀속되지 아니하고, 乙의 증여세와 양도소득세를 합한 세액이 甲이 직접 양도하는 경우로 보아 계산한 양도소득세보다 적은 경우에 해당한다. 소득세법상 양도소득세 납세의무에 관한 설명으로 틀린 것은?\n① 乙이 납부한 증여세는 양도차익 계산 시 필요경비에 산입한다.\n② 양도차익 계산 시 취득가액은 甲의 취득 당시를 기준으로 한다.\n③ 양도소득세에 대해서는 甲과 乙이 연대하여 납세의무를 진다.\n④ 甲은 양도소득세 납세의무자이다.\n⑤ 양도소득세 계산 시 보유기간은 甲의 취득일부터 乙의 양도일까지의 기간으로 한다.","1","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",5,0],[33,2022,22,35,5,"취득세","취득세","옳은것 고르기","지방세법상 취득세의 부과ㆍ징수에 관한 설명으로 옳은 것은?\n① 취득세의 징수는 보통징수의 방법으로 한다.\n② 상속으로 취득세 과세물건을 취득한 자는 상속개시일부터 60일 이내에 산출한 세액을 신고하고 납부하여야 한다.\n③ 신고ㆍ납부기한 이내에 재산권과 그 밖의 권리의 취득ㆍ이전에 관한 사항을 공부에 등기하거나 등록(등재 포함) 하려는 경우에는 등기 또는 등록 신청서를 등기ㆍ등록관서에 접수하는 날까지 취득세를 신고ㆍ납부하여야 한다.\n④ 취득세 과세물건을 취득한 후에 그 과세물건이 중과 세율의 적용대상이 되었을 때에는 중과 세율을 적용하여 산출한 세액에서 이미 납부한 세액(가산세 포함)을 공제한 금액을 세액으로 하여 신고ㆍ납부하여야 한다.\n⑤ 법인의 취득당시가액을 증명할 수 있는 장부가 없는 경우 지방자치단체의 장은 그 산출된 세액의 100분의 20 을 징수하여야 할 세액에 가산한다. 개","3","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",5,0],[33,2022,22,36,5,"종합소득세","부동산임대 사업소득","틀린것 고르기","소득세법상 부동산임대업에서 발생한 소득에 관한 설명으로 틀린 것은?\n① 해당 과세기간의 주거용 건물 임대업을 제외한 부동산임대업에서 발생한 결손금은 그 과세기간의 종합소득과 세표준을 계산할 때 공제하지 않는다.\n② 사업소득에 부동산임대업에서 발생한 소득이 포함되어 있는 사업자는 그 소득별로 구분하여 회계처리하여야 한다.\n③ 3주택(주택 수에 포함되지 않는 주택 제외) 이상을 소유한 거주자가 주택과 주택부수토지를 임대(주택부수토지만 임대하는 경우 제외)한 경우에는 법령으로 정하는 바에 따라 계산한 금액(간주임대료)을 총수입금액에 산입한다.\n④ 간주임대료 계산 시 3주택 이상 여부 판정에 있어 주택 수에 포함되지 않는 주택이란 주거의 용도로만 쓰이는 면적이 1호 또는 1세대당 40m2 이하인 주택으로서 해당 과세기간의 기준시가가 2억원 이하인 주택을 말한다.\n⑤ 해당 과세기간에 분리과세 주택임대소득이 있는 거주자\n(종합소득과세표준이 없거나 결손금이 있는 거주자 포함)는 그 종합소득 과세표준을 그 과세기간의 다음 연도 5월 1일부터 5월 31일까지 신고하여야 한다.","3","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",6,0],[33,2022,22,37,5,"등록면허세","등록면허세","틀린것 고르기","지방세법상 등록에 대한 등록면허세에 관한 설명으로 틀린 것은?\n① 채권금액으로 과세액을 정하는 경우에 일정한 채권금액이 없을 때에는 채권의 목적이 된 것의 가액 또는 처분의 제한의 목적이 된 금액을 그 채권금액으로 본다.\n② 같은 채권의 담보를 위하여 설정하는 둘 이상의 저당권을 등록하는 경우에는 이를 하나의 등록으로 보아 그 등록에 관계되는 재산을 처음 등록하는 등록관청 소재지를 납세지로 한다.\n③ 부동산 등기에 대한 등록면허세의 납세지가 분명하지 아니한 경우에는 등록관청 소재지를 납세지로 한다.\n④ 지상권 등기의 경우에는 특별징수의무자가 징수할 세액을 납부기한까지 부족하게 납부하면 특별징수의무자에 게 과소납부분 세액의 100분의 1을 가산세로 부과한다.\n⑤ 지방자치단체의 장은 채권자대위자의 부동산의 등기에 대한 등록면허세 신고납부가 있는 경우 납세의무자에게 그 사실을 즉시 통보하여야 한다.","4","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",6,0],[33,2022,22,38,5,"양도소득세","양도소득세","옳은것 고르기","소득세법상 거주자의 양도소득세 징수와 환급에 관한 설명으로 옳은 것은?\n① 과세기간별로 이미 납부한 확정신고세액이 관할세무서장이 결정한 양도소득 총결정세액을 초과한
