5점","1","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",1,0],[29,2018,22,7,4,"공간정보법","공간정보법 일반","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 토지소유자의 정리 등에 관한 설명으로 틀린 것은?\n① 지적소관청은 등기부에 적혀 있는 토지의 표시가 지적공부와 일치하지 아니하면 토지소유자를 정리할 수 없다.\n② 「국유재산법」에 따른 총괄청이나 같은 법에 따른 중 앙관서의 장이 소유자 없는 부동산에 대한 소유자 등록을 신청하는 경우 지적소관청은 지적공부에 해당 토지의 소유자가 등록되지 아니한 경우에만 등록할 수 있다.\n③ 지적공부에 신규등록하는 토지의 소유자에 관한 사항은 등기관서에서 등기한 것을 증명하는 등기필증, 등기완 료통지서, 등기사항증명서 또는 등기관서에서 제공한 등기전산정보자료에 따라 정리한다.\n④ 지적소관청은 필요하다고 인정하는 경우에는 관할 등기 관서의 등기부를 열람하여 지적공부와 부동산등기부가 일치하는지 여부를 조사ㆍ확인하여야 한다.\n⑤ 지적소관청 소속 공무원이 지적공부와 부동산등기부의 부합 여부를 확인하기 위하여 등기전산정보자료의 제공을 요청하는 경우 그 수수료는 무료로 한다. 개","3","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",1,0],[29,2018,22,8,4,"공간정보법","지적공부·부동산종합공부","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적도 면 등의 등록사항 등에 관한 설명으로 틀린 것은?\n① 지적소관청은 지적도면의 관리에 필요한 경우에는 지번부여 지역마다 일람도와 지번색인표를 작성하여 갖춰 둘 수 있다.\n② 지적도면의 축척은 지적도 7종, 임야도 2종으로 구분한다.\n③ 지적도면의 색인도, 건축물 및 구조물 등의 위치는 지적도면의 등록사항에 해당한다.\n④ 경계점좌표등록부를 갖춰 두는 지역의 임야도에는 해당 도면의 제명 끝에 “(좌표)”라고 표시하고, 도곽선의 오른쪽 아래 끝에 “이 도면에 의하여 측량을 할 수 없음” 이라고 적어야 한다.\n⑤ 지적도면에는 지적소관청의 직인을 날인하여야 한다. 다만, 정보처리시스템을 이용하여 관리하는 지적도면의 경우에는 그러하지 아니하다.","4","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",2,0],[29,2018,22,9,4,"공간정보법","지적측량·지적위원회","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적위 원회 및 지적측량의 적부심사 등에 관한 설명으로 틀린 것은?\n① 토지소유자, 이해관계인 또는 지적측량수행자는 지적측량성과에 대하여 다툼이 있는 경우에는 관할 시ㆍ도지사를 거쳐 지방지적위원회에 지적측량 적부심사를 청구할 수 있다.\n② 지방지적위원회는 지적측량에 대한 적부심사 청구사항과 지적기술자의 징계요구에 관한 사항을 심의ㆍ의결한다.\n③ 시ㆍ도지사는 지방지적위원회의 의결서를 받은 날부터 7일 이내에 지적측량 적부심사 청구인 및 이해관계인에게 그 의결서를 통지하여야 한다.\n④ 시ㆍ도지사로부터 의결서를 받은 자가 지방지적위원회의 의결에 불복하는 경우에는 그 의결서를 받은 날부터 90일 이내에 국토교통부장관을 거쳐 중앙지적위원회에 재심사를 청구할 수 있다.\n⑤ 중앙지적위원회는 관계인을 출석하게 하여 의견을 들을 수 있으며, 필요하면 현지조사를 할 수 있다.","2","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",2,0],[29,2018,22,10,4,"공간정보법","공간정보법 일반","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적서고의 설치기준 등에 관한 설명으로 틀린 것은?\n① 지적서고는 지적사무를 처리하는 사무실과 연접하여 설치하여야 한다.\n② 바닥과 벽은 2중으로 하고 영구적인 방수설비를 하여야 한다.\n③ 창문과 출입문은 2중으로 하되, 안쪽 문은 반드시 철제로 하고 바깥쪽 문은 곤충ㆍ쥐 등의 침입을 막을 수 있도록 철망 등을 설치하여야 한다.\n④ 온도 및 습도 자동조절장치를 설치하고, 연중 평균온도는 섭씨 20±5도를, 연중평균습도는 65±5퍼센트를 유지 하여야 한다.\n⑤ 전기시설을 설치하는 때에는 단독퓨즈를 설치하고 소화 장비를 갖춰 두어야 한다. 2018년 제29회 공인중개","3","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",2,0],[29,2018,22,11,4,"공간정보법","공간정보법 일반","박스형(모두고르기)","공간정보의 구축 및 관리 등에 관한 법령상 공유지 연명부와 대지권등록부의 공통된 등록사항을 모두고른 것은?\nㄱ. 대지권 비율\nㄴ. 토지소유자가 변경된 날과 그 원인\nㄷ. 토지의 소재\nㄹ. 토지의 고유번호\nㅁ. 소유권 지분\n① ㄱ, ㄷ, ㄹ ② ㄱ, ㄷ, ㅁ ③ ㄴ, ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄹ, ㅁ ⑤ ㄴ, ㄷ, ㄹ, ㅁ","5","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",2,0],[29,2018,22,12,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 축척변경에 따른 청산금 등에 관한 설명으로 틀린 것은?\n① 지적소관청은 청산금의 결정을 공고한 날부터 20일 이내에 토지소유자에게 청산금의 납부고지 또는 수령통지를 하여야 한다.\n② 청산금의 납부고지를 받은 자는 그 고지를 받은 날부터 1년 이내에 청산금을 지적소관청에 내야 한다.\n③ 지적소관청은 청산금의 수령통지를 한 날부터 6개월 이내에 청산금을 지급하여야 한다.\n④ 지적소관청은 청산금을 지급받을 자가 행방불명 등으로 받을 수 없거나 받기를 거부할 때에는 그 청산금을 공탁할 수 있다.\n⑤ 수령통지된 청산금에 관하여 이의가 있는 자는 수령통지를 받은 날부터 1개월 이내에 지적소관청에 이의신청을 할 수 있다.","2","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",2,0],[29,2018,22,13,4,"부동산등기법","등기신청(공동·단독·전자신청)","판례, 옳은것 고르기","소유권이전등기에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 甲이 그 명의로 등기된 부동산을 乙에게 매도한 뒤 단독상속인 丙을 두고 사망한 경우, 丙 은 자신을 등기의무자로 하여 甲에서 직접 乙 로의 이전등기를 신청할 수는 없다.\nㄴ. 甲소유 토지에 대해 사업시행자 乙이 수용보 상금을 지급한 뒤 乙 명의로 재결수용에 기한 소유권이전등기를 하는 경우, 수용개시일 후 甲이 丙에게 매매를 원인으로 경료한 소유권이전등기는 직권 말소된다.\nㄷ. 공동상속인이 법정상속분과 다른 비율의 지분이전등기를 상속을 원인으로 신청하는 경우, 그 지분이 신청인이 주장하는 지분으로 변동 된 사실을 증명하는 서면을 신청서에 첨부하여 제출하지 않으면 등기관은 그 신청을 각하 한다.\nㄹ. 甲소유 토지에 대해 甲과 乙의 가장매매에 의해 乙 앞으로 소유권이전등기가 된 후에 선의의 丙 앞으로 저당권설정등기가 설정된 경우, 甲과 乙은 공동으로 진정명의회복을 위한 이전등기를 신청할 수 없다.\n① ㄱ, ㄴ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄷ, ㄹ ⑤ ㄴ, ㄷ, ㄹ 개","3","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",2,0],[29,2018,22,14,4,"부동산등기법","등기신청(공동·단독·전자신청)","틀린것 고르기","방문신청을 위한 등기신청서의 작성 및 제공에 관한 설명으로 틀린 것은?\n① 등기신청서에는 신청인 또는 그 대리인이 기명날인하거 나 서명하여야 한다.\n② 신청서에 간인을 하는 경우, 등기권리자가 여러 명이고 등기의무자가 1명일 때에는 등기권리자 중 1명과 등기의무자가 간인하는 방법으로 한다.\n③ 신청서의 문자를 삭제한 경우에는 그 글자 수를 난외\n(欄外)에 적으며 문자의 앞뒤에 괄호를 붙이고 이에 서 명하고 날인하여야 한다.\n④ 특별한 사정이 없는 한, 등기의 신청은 1건당 1개의 부동산에 관한 신청정보를 제공하는 방법으로 하여야 한다.\n⑤ 같은 채권의 담보를 위하여 여러 개의 부동산에 대한 저당권설정등기를 신청하는 경우, 부동산의 관할 등기 소가 서로 다르면 1건의 신청정보로 일괄하여 등기를 신청할 수 없다.","3","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",3,0],[29,2018,22,15,4,"공간정보법","지적공부·부동산종합공부","틀린것 고르기","건축물대장에 甲 건물을 乙 건물에 합병하는 등록을 2018년 8월 1일에 한 후, 건물의 합병등기를 하고자 하는 경우에 관한 설명으로 틀린 것은?\n① 乙 건물의 소유권의 등기명의인은 건축물대장상 건물의 합병등록이 있은 날로부터 1개월 이내에 건물합병등기를 신청하여야 한다.\n② 건물합병등기를 신청할 의무있는 자가 그 등기신청을 게을리하였더라도,「부동산등기법」상 과태료를 부과받 지 아니한다.\n③ 합병등기를 신청하는 경우, 乙 건물의 변경 전과 변경 후의 표시에 관한 정보를 신청정보의 내용으로 등기소에 제공하여야 한다.\n④ 甲 건물에만 저당권등기가 존재하는 경우에 건물합병등 기가 허용된다.\n⑤ 등기관이 합병제한 사유가 있음을 이유로 신청을 각하 한 경우 지체 없이 그 사유를 건축물대장 소관청에 알려야 한다.","4","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",3,0],[29,2018,22,16,4,"부동산등기법","등기신청(공동·단독·전자신청)","박스형(모두고르기), 옳은것 고르기","등기신청의 각하사유에 해당하는 것을 모두 고른 것은?\nㄱ. 매매로 인한 소유권이전등기 이후에 환매특약등 기를 신청한 경우\nㄴ. 관공서의 공매처분으로 인한 권리이전의 등기를 매수인이 신청한 경우\nㄷ. 전세권의 양도금지 특약을 등기신청한 경우\nㄹ. 소유권이전등기의무자의 등기기록상 주소가 신청정보의 주소로 변경된 사실이 명백한 때\n① ㄱ, ㄴ ② ㄴ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","1","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",3,0],[29,2018,22,17,4,"부동산등기법","등기 일반·효력","옳은것 고르기","집합건물의 등기에 관한 설명으로 옳은 것은?\n① 등기관이 구분건물의 대지권등기를 하는 경우에는 건축물대장 소관청의 촉탁으로 대지권의 목적인 토지의 등기기록에 소유권, 지역권, 전세권 또는 임차권이 대지권이라는 뜻을 기록하여야 한다. 2018년 제29회 공인중개\n② 구분건물로서 그 대지권의 변경이 있는 경우에는 구분건물의 소유권의 등기명의인은 1동의 건물에 속하는 다른 구분건물의 소유권의 등기명의인을 대위하여 대지권의 변경등기를 신청할 수 있다.\n③ ‘대지권에 대한 등기로서 효력이 있는 등기’와 ‘대지권의 목적인 토지의 등기기록 중 해당 구에 한 등기’의 순서는 순위번호에 따른다.\n④ 구분건물의 등기기록에 대지권이 등기된 후 건물만에 관해 저당권설정계약을 체결한 경우, 그 설정계약을 원인으로 구분건물만에 관한 저당권설정등기를 할 수 있다.\n⑤ 토지의 소유권이 대지권인 경우 토지의 등기기록에 대지권이라는 뜻의 등기가 되어 있더라도, 그 토지에 대한 새로운 저당권설정계약을 원인으로 하여, 그 토지의 등기기록에 저당권설정등기를 할 수 있다.","2","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",3,0],[29,2018,22,18,4,"부동산등기법","소유권 등기(보존·이전·신탁·공동소유)","박스형(모두고르기), 옳은것 고르기","말소등기를 신청하는 경우 그 말소에 관하여 승낙서를 첨부하여야 하는 등기상 이해관계 있는 제3자에 해당하는 것을 모두 고른 것은?\nㄱ. 지상권등기를 말소하는 경우 그 지상권을 목적으로 하는 저당권자\nㄴ. 순위 2번 저당권등기를 말소하는 경우 순위 1 번 저당권자\nㄷ. 순위 1번 저당권등기를 말소하는 경우 순위 2 번 저당권자\nㄹ. 토지에 대한 저당권등기를 말소하는 경우 그 토지에 대한 지상권자\nㅁ. 소유권보존등기를 말소하는 경우 가압류권자\n① ㄱ, ㄹ ② ㄱ, ㅁ ③ ㄴ, ㄷ ④ ㄴ, ㅁ ⑤ ㄷ, ㄹ","2","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",3,0],[29,2018,22,19,4,"부동산등기법","가등기","판례, 틀린것 고르기","가등기에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 부동산임차권의 이전청구권을 보전하기 위한 가등기는 허용된다.\n② 가등기에 기한 본등기를 금지하는 취지의 가처분등기는 할 수 없다.\n③ 가등기의무자도 가등기명의인의 승낙을 받아 단독으로 가등기의 말소를 청구할 수 있다.\n④ 사인증여로 인하여 발생한 소유권이전등기청구권을 보전하기 위한 가등기는 할 수 없다.\n⑤ 甲이 자신의 토지에 대해 乙에게 저당권설정청구권 보전을 위한 가등기를 해준 뒤 丙에게 그 토지에 대해 소유권이전등기를 했더라도 가등기에 기한 본등기 신청의 등기의무자는 甲이다.","4","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",3,0],[29,2018,22,20,4,"부동산등기법","부기·말소·회복·변경·경정 등기","","등기상 이해관계 있는 제3자가 있는 경우에 그 제3 자의 승낙이 없으면 부기등기로 할 수 없는 것은?\n① 환매특약등기\n② 지상권의 이전등기\n③ 등기명의인표시의 변경등기\n④ 지상권 위에 설정한 저당권의 이전등기\n⑤ 근저당권에서 채권최고액 증액의 변경등기 개","5","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",3,0],[29,2018,22,21,4,"부동산등기법","등기 일반·효력","옳은것 고르기","담보물권에 관한 등기에 대한 설명으로 옳은 것은?\n① 민법상 조합 자체를 채무자로 표시하여 근저당설정등기를 할 수 없다.\n② 근저당권의 존속기간은 등기할 수 없다.\n③ 채무자 변경을 원인으로 하는 저당권변경등기는 변경전 채무자를 등기권리자로, 변경 후 채무자를 등기의무자로 하여 공동으로 신청한다.\n④ 근저당권설정등기신청서에변제기및이자를기재하여야한다.\n⑤ 민법상 저당권부 채권에 대한 질권을 설정함에 있어서 채권최고액은 등기할 수 없다.","1","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",4,0],[29,2018,22,22,4,"부동산등기법","소유권 등기(보존·이전·신탁·공동소유)","옳은것 고르기","공동소유에 관한 등기에 대한 설명으로 옳은 것은?\n① 합유등기에는 합유지분을 표시한다.\n② 농지에 대하여 공유물분할을 원인으로 하는 소유권이전등기를 신청하는 경우, 농지취득자격증명을 첨부하여야 한다.\n③ 미등기 부동산의 공유자 중 1인은 자기 지분만에 대하여 소유권보존등기를 신청할 수 있다.\n④ 갑구 순위번호 2번에 기록된 A의 공유지분 4분의 3 중 절반을 B에게 이전하는 경우, 등기목적란에 “2번 A 지분 4분의 3 중 일부(2분의 1)이전”으로 기록한다.\n⑤ 법인 아닌 사단 A 명의의 부동산에 관해 A와 B의 매매를 원인으로 이전등기를 신청하는 경우, 특별한 사정이 없는 한 A의 사원총회 결의가 있음을 증명하는 정보를 제출하여야 한다.","5","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",4,0],[29,2018,22,23,4,"부동산등기법","소유권 등기(보존·이전·신탁·공동소유)","옳은것 고르기","소유권보존등기에 관한 설명으로 옳은 것은?\n① 보존등기에는 등기원인과 그 연월일을 기록한다.\n② 군수의 확인에 의하여 미등기 토지가 자기의 소유임을 증명하는 자는 보존등기를 신청할 수 있다.\n③ 등기관이 미등기 부동산에 관하여 과세관청의 촉탁에 따라 체납처분으로 인한 압류등기를 하기 위해서는 직권으로 소유권보존등기를 하여야 한다.\n④ 미등기 토지에 관한 소유권보존등기는 수용으로 인하여 소유권을 취득하였음을 증명하는 자도 신청할 수 있다.\n⑤ 소유권보존등기를 신청하는 경우 신청인은 등기소에 등기필정보를 제공하여야 한다.","4","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",4,0],[29,2018,22,24,4,"부동산등기법","등기신청(공동·단독·전자신청)","옳은것 고르기","등기신청에 관한 설명으로 옳은 것은?\n① 외국인은「출입국관리법」에 따라 외국인등록을 하더라도 전산정보처리조직에 의한 사용자등록을 할 수 없으므로 전자신청을 할 수 없다.\n② 법인 아닌 사단이 등기권리자로서 등기신청을 하는 경우, 그 대표자의 성명 및 주소를 증명하는 정보를 첨부정보로 제공하여야 하지만 주민등록번호를 제공할 필요는 없다.\n③ 이행판결에 의한 등기는 승소한 등기권리자 또는 패소한 등기의무자가 단독으로 신청한다.\n④ 신탁재산에 속하는 부동산의 신탁등기는 신탁자와 수탁자가 공동으로 신청하여야 한다.\n⑤ 전자표준양식에 의한 등기신청의 경우, 자격자대리인\n(법무사 등)이 아닌 자도 타인을 대리하여 등기를 신청할 수 있다. 2018년 제29회 공인중개","5","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",4,0],[29,2018,22,25,5,"조세총론","조세총론(납세의무·부과·징수)","틀린것 고르기","국세기본법 및 지방세기본법상 조세채권과 일반채권의 관계에 관한 설명으로 틀린 것은?\n① 납세담보물 매각 시 압류에 관계되는 조세채권은 담보 있는 조세채권보다 우선한다.\n② 재산의 매각대금 배분 시 당해 재산에 부과된 종합부동산세는 당해 재산에 설정된 전세권에 따라 담보된 채권보다 우선한다.\n③ 취득세 신고서를 납세지 관할 지방자치단체장에게 제출한 날 전에 저당권 설정 등기 사실이 증명되는 재산을 매각하여 그 매각금액에서 취득세를 징수하는 경우, 저당권에 따라 담보된 채권은 취득세에 우선한다.\n④ 강제집행으로 부동산을 매각할 때 그 매각금액 중에 국세를 징수하는 경우, 강제집행 비용은 국세에 우선한다.\n⑤ 재산의 매각대금 배분 시 당해 재산에 부과된 재산세는 당해 재산에 설정된 저당권에 따라 담보된 채권보다 우선한다.","1","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",4,0],[29,2018,22,26,5,"종합부동산세","종합부동산세","틀린것 고르기","거주자 甲은 A주택을 3년간 소유하며 직접 거주하고 있다. 甲이 A주택에 대하여 납부하게 되는 2018년 귀속 재산세와 종합부동산세에 관한 설명으로 틀린 것은?(단, 甲은 종합부동산세법상 납세의무자로서 만 61세이며 1세대 1주택자라 가정함)\n① 재산세 및 종합부동산세의 과세기준일은 매년 6월 1일이다.\n② 甲의 고령자 세액공제액은 종합부동산세법에 따라 산출된 세액에 100분의 10을 곱한 금액으로 한다.\n③ 재산세 납부세액이 600만원인 경우, 100만원은 납부기한이 지난 날부터 2개월 이내에 분납할 수 있다.\n④ 재산세 산출세액은 지방세법령에 따라 계산한 직전 연도 해당 재산에 대한 재산세액 상당액의 100분의 150에 해당하는 금액을 한도로 한다.\n⑤ 만약 甲이 A주택을「신탁법」에 따라 수탁자 명의로 신탁등기하게 하는 경우로서 A주택이 위탁자별로 구분된 재산이라면, 수탁자를 재산세 납세의무자로 본다.","4","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",4,0],[29,2018,22,27,5,"종합부동산세","종합부동산세","틀린것 고르기","2018년 귀속 종합부동산세에 관한 설명으로 틀린 것은?\n① 과세대상 토지가 매매로 유상이전 되는 경우로서 매매계약서 작성일이 2018년 6월 1일이고, 잔금지급 및 소유권이전등기일이 2018년 6월 29일인 경우, 종합부동산세의 납세의무자는 매도인이다.\n② 납세의무자가 국내에 주소를 두고 있는 개인의 경우 납세지는 주소지이다.\n③ 납세자에게 부정행위가 없으며 특례제척기간에 해당하지 않는 경우, 원칙적으로 납세의무 성립일부터 5년이 지나면 종합부동산세를 부과할 수 없다.\n④ 납세의무자는 선택에 따라 신고ㆍ납부할 수 있으나, 신고를 함에 있어 납부세액을 과소하게 신고한 경우라도 과소신고가산세가 적용되지 않는다.\n⑤ 종합부동산세는 물납이 허용되지 않는다. 개","4","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",4,0],[29,2018,22,28,5,"재산세","재산세","","지방세법상 재산세 종합합산과세대상 토지는?\n① 「문화재보호법」제2조 제2항에 따른 지정문화재 안의 임야\n② 국가가 국방상의 목적 외에는 그 사용 및 처분 등을 제한하는 공장 구내의 토지\n③ 「건축법」등 관계 법령에 따라 허가 등을 받아야 할 건축물로서 허가 등을 받지 아니한 공장용 건축물의 부속토지\n④ 「자연공원법」에 따라 지정된 공원자연환경지구의 임야\n⑤ 「개발제한구역의 지정 및 관리에 관한 특별조치법」에 따른 개발제한구역의 임야","3,5","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",5,0],[29,2018,22,29,5,"재산세","재산세","틀린것 고르기","지방세법상 2018년도 귀속 재산세의 부과ㆍ징수에 관한 설명으로 틀린 것은?(단, 세액변경이나 수시부 과사유는 없음)\n① 토지분 재산세 납기는 매년 9월 16일부터 9월 30일까지이다.\n② 선박분 재산세 납기는 매년 7월 16일부터 7월 31일까지이다.\n③ 재산세를 징수하려면 재산세 납세고지서를 납기개시 5 일 전까지 발급하여야 한다.\n④ 주택분 재산세로서 해당 연도에 부과할 세액이 20만원 이하인 경우 9월 30일 납기로 한꺼번에 부과ㆍ징수한다.\n⑤ 재산세를 물납하려는 자는 납부기한 10일 전까지 납세지를 관할하는 시장ㆍ군수ㆍ구청장에게 물납을 신청하여야 한다.","4","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",5,0],[29,2018,22,30,5,"양도소득세","양도소득세","옳은것 고르기, 계산","甲은 특수관계 없는 乙로부터 다음과 같은 내용으로 주택을 취득하였다. 취득세 과세표준 금액으로 옳은 것은?\n○ 아래의 계약내용은 「부동산 거래신고 등에 관한 법률」제3조에 따른 신고서를 제출하여 같은 법 제5조에 따라 검증이 이루어짐\n○ 계약내용\n- 총매매대금 500,000,000원 2018년 7월 2일 계약금 50,000,000원 2018년 8월 2일 중도금 150,000,000원 2018년 9월 3일 잔금 300,000,000원\n○ 甲이 주택 취득과 관련하여 지출한 비용\n- 총매매대금 외에 당사자약정에 의하여 乙의 은행 채무를 甲이 대신 변제한 금액 10,000,000원\n- 법령에 따라 매입한 국민주택채권을 해당 주택의 취득 이전에 금융회사에 양도함으로써 발생하는 매각차손 1,000,000원\n① 500,000,000원 ② 501,000,000원 ③ 509,000,000원\n④ 510,000,000원 ⑤ 511,000,000원","5","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",5,0],[29,2018,22,31,5,"조세총론","조세총론(납세의무·부과·징수)","옳은것 고르기","국세 및 지방세의 납세의무 성립시기에 관한 내용으로 옳은 것은?(단, 특별징수 및 수시부과와 무관함)\n① 재산분 주민세: 매년 7월 1일\n② 거주자의 양도소득에 대한 지방소득세: 매년 3월 31일\n③ 재산세에 부가되는 지방교육세: 매년 8월 1일\n④ 중간예납 하는 소득세: 매년 12월 31일\n⑤ 자동차 소유에 대한 자동차세: 납기가 있는 달의 10일 2018년 제29회 공인중개","1","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",5,0],[29,2018,22,32,5,"취득세","취득세","박스형(모두고르기), 틀린것 고르기","지방세법상 과점주주의 간주취득세가 과세되는 경우가 아닌 것은 모두 몇 개인가?(단, 주식발행법인은 「자본시장과 금융투자업에 관한 법률 시행령」제176 조의 9 제1항에 따른 유가증권시장에 상장한 법인이 아니며,「지방세특례제한법」은 고려하지 않음)\nㄱ. 법인설립 시에 발행하는 주식을 취득함으로써 과점주주가 된 경우\nㄴ. 과점주주가 아닌 주주가 다른 주주로부터 주식을 취득함으로써 최초로 과점주주가 된 경우\nㄷ. 이미 과점주주가 된 주주가 해당 법인의 주식을 취득하여 해당 법인의 주식의 총액에 대한 과점주주가 가진 주식의 비율이 증가된 경우\nㄹ. 과점주주 집단 내부에서 주식이 이전되었으나 과점주주 집단이 소유한 총주식의 비율에 변동이 없는 경우\n① 0개 ② 1개 ③ 2개 ④ 3개 ⑤ 4개","3","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",5,0],[29,2018,22,33,5,"취득세","취득세","박스형(모두고르기)","지방세법상 신탁(「신탁법」에 따른 신탁으로서 신탁등기가 병행되는 것임)으로 인한 신탁재산의 취득 으로서 취득세를 부과하는 경우는 모두 몇 개인가?\nㄱ. 위탁자로부터 수탁자에게 신탁재산을 이전하는 경우\nㄴ. 신탁의 종료로 인하여 수탁자로부터 위탁자에 게 신탁재산을 이전하는 경우\nㄷ. 수탁자가 변경되어 신수탁자에게 신탁재산을 이전하는 경우\nㄹ.「주택법」에 따른 주택조합이 비조합원용 부동산을 취득하는 경우\n① 0개 ② 1개 ③ 2개 ④ 3개 ⑤ 4개","2","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",5,0],[29,2018,22,34,5,"양도소득세","양도소득세","옳은것 고르기, 계산","소득세법상 거주자의 양도소득과세표준 계산에 관한 설명으로 옳은 것은?\n① 양도소득금액을 계산할 때 부동산을 취득할 수 있는 권리에서 발생한 양도차손은 토지에서 발생한 양도소득금액에서 공제할 수 없다.\n② 양도차익을 실지거래가액에 의하는 경우 양도가액에서 공제할 취득가액은 그 자산에 대한 감가상각비로서 각 과세기간의 사업소득금액을 계산하는 경우 필요경비에 산입한 금액이 있을 때에는 이를 공제하지 않은 금액으로 한다.\n③ 양도소득에 대한 과세표준은 종합소득 및 퇴직소득에 대한 과세표준과 구분하여 계산한다.\n④ 1세대 1주택 비과세 요건을 충족하는 고가주택의 양도 가액이 12억원이고 양도차익이 4억원인 경우 양도소득세가 과세되는 양도차익은 3억원이다.\n⑤ 2018년 4월 1일 이후 지출한 자본적지출액은 그 지출에 관한 증명서류를 수취ㆍ보관하지 않고 실제 지출 사실이 금융거래 증명서류에 의하여 확인되지 않는 경우에도 양도차익 계산 시 양도가액에서 공제할 수 있다. 개","3","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",5,0],[29,2018,22,35,5,"양도소득세","양도소득세","옳은것 고르기","소득세법상 거주자의 양도소득세 신고 및 납부에 관한 설명으로 옳은 것은?\n① 토지 또는 건물을 양도한 경우에는 그 양도일이 속하는 분기의 말일부터 2개월 이내에 양도소득과세표준을 신고해야 한다.\n② 양도차익이 없거나 양도차손이 발생한 경우에는 양도소득과세표준 예정신고 의무가 없다.\n③ 건물을 신축하고 그 신축한 건물의 취득일부터 5년 이내에 해당 건물을 양도하는 경우로서 취득 당시의 실지거래가액을 확인할 수 없어 환산가액을 그 취득가액으로 하는 경우에는 양도소득세 산출세액의 100분의 5에 해당하는 금액을 양도소득 결정세액에 더한다.\n④ 양도소득과세표준 예정신고 시에는 납부할 세액이 1천만원을 초과하더라도 그 납부할 세액의 일부를 분할납부할 수 없다.\n⑤ 당해 연도에 누진세율의 적용대상 자산에 대한 예정신고를 2회 이상 한 자가 법령에 따라 이미 신고한 양도소득금액과 합산하여 신고하지 아니한 경우 양도소득세 확정신고를 해야 한다.","5","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",6,0],[29,2018,22,36,5,"양도소득세","양도소득세","옳은것 고르기","소득세법상 미등기양도자산에 관한 설명으로 옳은 것은?\n① 미등기양도자산도 양도소득에 대한 소득세의 비과세에 관한 규정을 적용할 수 있다.\n② 건설업자가「도시개발법」에 따라 공사용역 대가로 취득한 체비지를 토지구획환지처분공고 전에 양도하는 토지는 미등기양도자산에 해당하지 않는다.\n③ 미등기양도자산의 양도소득금액 계산 시 양도소득 기본 공제를 적용할 수 있다.\n④ 미등기양도자산은 양도소득세 산출세액에 100분의 70을 곱한 금액을 양도소득 결정세액에 더한다.\n⑤ 미등기양도자산의 양도소득금액 계산 시 장기보유 특별 공제를 적용할 수 있다.","2","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",6,0],[29,2018,22,37,5,"양도소득세","양도소득세","틀린것 고르기","소득세법 시행령 제162조에서 규정하는 양도 또는 취득의 시기에 관한 내용으로 틀린 것은?\n① 제1항 제4호: 자기가 건설한 건축물에 있어서 건축허가를 받지 아니하고 건축하는 건축물은 추후 사용승인 또는 임시사용승인을 받는 날\n② 제1항 제3호: 기획재정부령이 정하는 장기할부조건의 경우에는 소유권이전등기(등록 및 명의개서를 포함)접수일ㆍ인도일 또는 사용수익일 중 빠른 날\n③ 제1항 제2호: 대금을 청산하기 전에 소유권이전등기(등록 및 명의개서를 포함)를 한 경우에는 등기부ㆍ등록부 또는 명부 등에 기재된 등기접수일\n④ 제1항 제5호: 상속에 의하여 취득한 자산에 대하여는 그 상속이 개시된 날\n⑤ 제1항 제9호:「도시개발법」에 따른 환지처분으로 교부받은 토지의 면적이 환지처분에 의한 권리면적보다 증가한 경우 그 증가된 면적의 토지에 대한 취득시기는 환지처분의 공고가 있은 날의 다음날 2018년 제29회 공인중개","1","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",6,0],[29,2018,22,38,5,"양도소득세","양도소득세","빈칸","다음은 소득세법 시행령 제155조 ‘1세대 1주택의 특례’에 관한 조문의 내용이다. 괄호 안에 들어갈 법령상의 숫자를 순서대로 옳게 나열한 것은?\n○ 1주택을 보유하는 자가 1주택을 보유하는 자와 혼인함으로써 1세대가 2주택을 보유하게 되는 경우 혼인한 날부터 ( )년 이내에 먼저 양도하는 주택은 이를 1세대 1주택으로 보아 제154 조 제1항을 적용한다.\n○ 1주택을 보유하고 1세대를 구성하는 자가 1주택을 보유하고 있는 ( )세 이상의 직계존속\n(배우자의 직계존속을 포함하며, 직계존속 중 어느 한 사람이 ( )세 미만인 경우를 포함) 을 동거봉양하기 위하여 세대를 합침으로써 1 세대가 2주택을 보유하게 되는 경우 합친 날부터 ( )년 이내에 먼저 양도하는 주택은 이를 1세대 1주택으로 보아 제154조 제1항을 적용한다.\n① 3, 55, 55, 5 ② 3, 60, 60, 5 ③ 3, 60, 55, 10\n④ 5, 55, 55, 10 ⑤ 5, 60, 60, 10","5","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",6,0],[29,2018,22,39,5,"등록면허세","등록면허세","틀린것 고르기","지방세법상 등록면허세가 과세되는 등록 또는 등기가 아닌 것은?(단, 2018년 1월 1일 이후 등록 또는 등기한 것으로 가정함)\n① 광업권의 취득에 따른 등록\n② 외국인 소유의 선박을 직접 사용하기 위하여 연부취득 조건으로 수입하는 선박의 등록\n③ 취득세 부과제척기간이 경과한 주택의 등기\n④ 취득가액이 50만원 이하인 차량의 등록\n⑤ 계약상의 잔금지급일을 2017년 12월 1일로 하는 부동산\n(취득가액 1억원)의 소유권이전등기","5","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",6,0],[29,2018,22,40,5,"등록면허세","등록면허세","틀린것 고르기","甲이 乙소유 부동산에 관해 전세권설정등기를 하는 경우 지방세법상 등록에 대한 등록면허세에 관한 설명으로 틀린 것은?\n① 등록면허세의 납세의무자는 전세권자인 甲이다.\n② 부동산소재지와 乙의 주소지가 다른 경우 등록면허세의 납세지는 乙의 주소지로 한다.\n③ 전세권설정등기에 대한 등록면허세의 표준세율은 전세금액의 1,000분의 2이다.\n④ 전세권설정등기에 대한 등록면허세의 산출세액이 건당 6천 원보다 적을 때에는 등록면허세의 세액은 6천원으로 한다.\n⑤ 만약 丙이 甲으로부터 전세권을 이전받아 등기하는 경우라면 등록면허세의 납세의무자는 丙이다. 개","2","1fOCn2Cwi3svevfdptdv19-DA9t_I2NcU",6,0],[30,2019,11,1,0,"부동산의 개념·특성","부동산 개념·특성·분류","옳은것 고르기","부동산의 개념에 관한 것으로 옳은 것으로만 짝지어진 것은?\nㄱ. 자본 ㄴ. 소비재 ㄷ. 공간\nㄹ. 생산요소 ㅁ. 자연 ㅂ. 자산\nㅅ. 위치 경제적 개념 물리적(기술적) 개념\n① ㄱ, ㄴ, ㄷ, ㅂ ㄹ, ㅁ, ㅅ\n② ㄱ, ㄴ, ㄹ, ㅂ ㄷ, ㅁ, ㅅ\n③ ㄱ, ㄹ, ㅁ, ㅅ ㄴ, ㄷ, ㅂ\n④ ㄴ, ㄹ, ㅁ, ㅂ ㄱ, ㄷ, ㅅ\n⑤ ㄷ, ㄹ, ㅂ, ㅅ ㄱ, ㄴ, ㅁ","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",1,0],[30,2019,11,2,0,"투자론","현금흐름·수익률·위험","","토지의 자연적 특성 중 다음 설명과 모두 관련 있는 것은?\n○ 부동산관리의 의의를 높게 한다.\n○ 장기투자를 통해 자본이득과 소득이득을 얻을 수 있다.\n○ 부동산활동에 있어서 장기배려를 하게 한다.\n① 적재성 ② 부동성 ③ 영속성\n④ 개별성 ⑤ 인접성","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",1,0],[30,2019,11,3,0,"정책론","토지정책·지역지구제","옳은것 고르기","부동산정책에 관한 설명으로 옳은 것은?\n① 개발이익환수제에서 개발이익은 개발사업의 시행에 의해 물가상승분을 초과해 개발사업을 시행하는 자에게 귀속되는 사업이윤의 증가분이다.\n② 도시ㆍ군관리계획은 국토의 계획 및 이용에 관한 법령상 특별시ㆍ광역시 또는 군의 관할 구역에 대하여 기본적인 공간구조와 장기발전방향을 제시하는 종합계획이다.\n③ 개발손실보상제는 토지이용계획의 결정 등으로 종래의 용도규제가 완화됨으로 인해 발생한 손실을 보상하는 제도로 대표적인 것 중에 개발부담금제도가 있다.\n④ 주택마련 또는 리모델링하기 위해 결성하는 주택조합에는 주택법령상 지역주택조합, 직장주택조합, 리모델링주택조합이 있다.\n⑤ 재건축부담금은 정비사업 중 재건축사업 및 재개발사업에서 발생되는 초과이익을 환수하기 위한 제도로 도시및 주거환경정비법령에 의해 시행되고 있다.","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",1,0],[30,2019,11,4,0,"부동산의 개념·특성","부동산 개념·특성·분류","옳은것 고르기","토지의 이용목적과 활동에 따른 토지 관련 용어에 관한 설명으로 옳은 것은?\n① 부지(敷地)는 건부지 중 건물을 제외하고 남은 부분의 토지로, 건축법령에 의한 건폐율 등의 제한으로 인해 필지 내에 비어있는 토지를 말한다. 2019년 제30회 공인중개\n② 대지(垈地)는 공간정보의 구축 및 관리 등에 관한 법령과 부동산등기법령에서 정한 하나의 등록단위로 표시하는 토지를 말한다.\n③ 빈지(濱地)는 과거에는 소유권이 인정되는 전ㆍ답 등 이었으나, 지반이 절토되어 무너져 내린 토지로 바다나 하천으로 변한 토지를 말한다.\n④ 포락지(浦落地)는 소유권이 인정되지 않는 바다와 육지 사이의 해변토지를 말한다.\n⑤ 소지(素地)는 대지 등으로 개발되기 이전의 자연 상태 로서의 토지를 말한다.","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",1,0],[30,2019,11,5,0,"입지·지대이론","상업입지이론","","주택정책과 관련하여 다음에서 설명하는 도시 및 주거환경정비법령상 정비사업은?\n정비기반시설이 열악하고 노후ㆍ불량건축물이 밀집한 지역에서 주거환경을 개선하거나 상업지역ㆍ공업지역 등에서 도시기능의 회복 및 상권활성화 등을 위하여 도시환경을 개선하기 위한 사업\n① 재개발사업 ② 주거환경개선사업\n③ 도시환경사업 ④ 재건축사업\n⑤ 가로주택정비사업","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",1,0],[30,2019,11,6,0,"정책론","조세정책·조세전가","옳은것 고르기, 빈칸","부동산 관련 조세에서 ( )에 들어갈 내용으로 옳은 것은?\n구분 보유단계 취득단계 처분단계 국세 ( ㄱ ) 상속세 ( ㄷ ) 지방세 ( ㄴ ) 취득세 -\n① ㄱ: 종합부동산세, ㄴ: 재산세, ㄷ: 양도소득세\n② ㄱ: 종합부동산세, ㄴ: 양도소득세, ㄷ: 재산세\n③ ㄱ: 재산세, ㄴ: 종합부동산세, ㄷ: 양도소득세\n④ ㄱ: 재산세, ㄴ: 양도소득세, ㄷ: 종합부동산세\n⑤ ㄱ: 양도소득세, ㄴ: 재산세, ㄷ: 종합부동산세","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",1,0],[30,2019,11,7,0,"경제론","수요·공급 결정요인·균형","옳은것 고르기","부동산의 수요와 공급에 관한 설명으로 옳은 것은?\n(단, 수요곡선은 우하향하고 공급곡선은 우상향하며, 다른 조건은 동일함)\n① 가격이 상승하면 공급량이 감소한다.\n② 수요량은 일정기간에 실제로 구매한 수량이다.\n③ 공급량은 주어진 가격수준에서 실제로 매도한 수량이다.\n④ 건설종사자들의 임금상승은 부동산가격을 하락시킨다.\n⑤ 가격 이외의 다른 요인이 수요량을 변화시키면 수요곡선이 좌측 또는 우측으로 이동한다.","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",1,0],[30,2019,11,8,0,"경제론","탄력성","계산","아파트에 대한 수요의 가격탄력성은 0.6, 소득탄력성은 0.4이고, 오피스텔가격에 대한 아파트 수요량의 교차탄력성은 0.2이다. 아파트가격, 아파트 수요자의 소득, 오피스텔가격이 각각 3%씩 상승할 때, 아파트 전체 수요량의 변화율은?(단, 두 부동산은 모두 정상재이고 서로 대체재이며, 아파트에 대한 수요의 가격탄력성은 절댓값으로 나타내며, 다른 조건은 동일함)\n① 1.2% 감소 ② 1.8% 증가 ③ 2.4% 감소\n④ 3.6% 증가 ⑤ 변화 없음","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",2,0],[30,2019,11,9,0,"정책론","토지정책·지역지구제","틀린것 고르기","공공재에 관한 일반적인 설명으로 틀린 것은?\n① 소비의 비경합적 특성이 있다.\n② 비내구재이기 때문에 정부만 생산비용을 부담한다.\n③ 무임승차 문제와 같은 시장실패가 발생한다.\n④ 생산을 시장기구에 맡기면 과소생산되는 경향이 있다.\n⑤ 비배제성에 의해 비용을 부담하지 않은 사람도 소비할 수 있다.","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",2,0],[30,2019,11,10,0,"정책론","주택·임대료 정책","옳은것 고르기, 빈칸","다음의 ( )에 들어갈 내용으로 옳은 것은?(단, P는 가격, Qd는 수요량이며, 다른 조건은 동일함) 어떤 도시의 이동식 임대주택 시장의 수요함수는 Qd = 800 - 2P, 공급함수는 P1 = 200 이다. 공급함수가 P2 = 300으로 변할 경우 균형거래량의 변화량은 ( ㄱ )이고, 공급곡선은 가격에 대하여 ( ㄴ )이다.\n\n① ㄱ: 100 증가, ㄴ: 완전탄력적\n\n② ㄱ: 100 증가, ㄴ: 완전비탄력적\n\n③ ㄱ: 100 증가, ㄴ: 단위탄력적\n\n④ ㄱ: 200 감소, ㄴ: 완전비탄력적\n\n⑤ ㄱ: 200 감소, ㄴ: 완전탄력적","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",2,0],[30,2019,11,11,0,"경제론","탄력성","틀린것 고르기","부동산에 관한 수요와 공급의 가격탄력성에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)\n① 수요의 가격탄력성이 완전탄력적일 때 수요가 증가할 경우 균형가격은 변하지 않는다.\n② 오피스텔에 대한 대체재가 감소함에 따라 오피스텔 수요의 가격탄력성이 작아진다.\n③ 공급의 가격탄력성이 수요의 가격탄력성보다 작은 경우 공급자가 수요자보다 세금부담이 더 크다.\n④ 임대주택 수요의 가격탄력성이 1인 경우 임대주택의 임대료가 하락하더라도 전체 임대료 수입은 변하지 않는다.\n⑤ 일반적으로 임대주택을 건축하여 공급하는 기간이 짧을 수록 공급의 가격탄력성은 커진다. 2019년 제30회 공인중개","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",2,0],[30,2019,11,12,0,"입지·지대이론","도시공간구조이론","","다음에서 설명하는 내용을 <보기>에서 올바르게 고른 것은?\nㄱ. 토지이용이 도시를 중심으로 지대지불능력에 따라 달라진다는 튀넨(J.H.von Thünen)의 이론을 도시 내부에 적용하였다.\nㄴ. 공간적 중심지 규모의 크기에 따라 상권의 규모가 달라진다는 것을 실증하였다.\nㄷ. 특정 점포가 최대 이익을 얻을 수 있는 매출액을 확보하기 위해서는 어떤 장소에 입지하여야 하는지를 제시하였다.\n<보기> 가: 버제스(E. Burgess)의 동심원이론 나: 레일리(W. Reilly)의 소매인력법칙 다: 크리스탈러(W. Christaller)의 중심지이론 라: 넬슨(R. Nelson)의 소매입지이론\n① ㄱ: 가, ㄴ: 나, ㄷ: 다 ② ㄱ: 가, ㄴ: 나, ㄷ: 라\n③ ㄱ: 가, ㄴ: 다, ㄷ: 라 ④ ㄱ: 나, ㄴ: 다, ㄷ: 가\n⑤ ㄱ: 나, ㄴ: 다, ㄷ: 라","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",2,0],[30,2019,11,13,0,"입지·지대이론","상업입지이론","틀린것 고르기","허프(D. Huff)모형에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)\n① 중력모형을 활용하여 상권의 규모 또는 매장의 매출액을 추정할 수 있다.\n② 모형의 공간(거리)마찰계수는 시장의 교통조건과 쇼핑 물건의 특성에 따라 달라지는 값이다.\n③ 모형을 적용하기 전에 공간(거리)마찰계수가 먼저 정해져야 한다.\n④ 교통조건이 나쁠 경우, 공간(거리)마찰계수가 커지게 된다.\n⑤ 전문품점의 경우는 일상용품점보다 공간(거리)마찰계수가 크다.","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",2,0],[30,2019,11,14,0,"입지·지대이론","도시공간구조이론","박스형(모두고르기), 옳은것 고르기","다음 이론에 관한 설명 중 옳은 것을 모두 고른 것은?\nㄱ. 호이트(H. Hoyt)에 의하면 도시는 전체적으로 원을 반영한 부채꼴 모양의 형상으로 그 핵심의 도심도 하나이나 교통의 선이 도심에서 방사되는 것을 전제로 하였다.\nㄴ. 뢰시(A. Lösch)는 수요측면의 입장에서 기업은 시장확대 가능성이 가장 높은 지점에 위치해야 한다고 보았다.\nㄷ. 튀넨(J.H.von Thünen)은 완전히 단절된 고립국을 가정하여 이곳의 작물재배활동은 생산비와 수송비를 반영하여 공간적으로 분화된다고 보았다.\n① ㄱ ② ㄷ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",2,0],[30,2019,11,15,0,"정책론","주택·임대료 정책","옳은것 고르기","주택여과과정과 주거분리에 관한 설명으로 옳은 것은?\n① 주택여과과정은 주택의 질적 변화와 가구의 이동과의 관계를 설명해 준다.\n② 상위계층에서 사용되는 기존주택이 하위계층에서 사용되는 것을 상향여과라 한다.\n③ 공가(空家)의 발생은 주거지 이동과는 관계가 없다.\n④ 주거분리는 소득과 무관하게 주거지역이 지리적으로 나 뉘는 현상이다.\n⑤ 저급주택이 수선되거나 재개발되어 상위계층에서 사용되는 것을 하향여과라 한다.","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",3,0],[30,2019,11,16,0,"입지·지대이론","공업입지·지대이론","계산","각 지역과 산업별 고용자수가 다음과 같을 때, A지역 X산업과 B지역 Y산업의 입지계수(LQ)를 올바르게 계산한 것은?(단, 주어진 조건에 한하며, 결과값은 소수점 셋째자리에서 반올림함) 전지역 구 분 A지역 B지역 고용자수 고용자수 100 140 X산업 240 입지계수 ( ㄱ ) 1.17 고용자수 100 60 Y산업 160 입지계수 1.25 ( ㄴ ) 고용자수 합계 200 200 400\n① ㄱ: 0.75, ㄴ: 0.83 ② ㄱ: 0.75, ㄴ: 1.33\n③ ㄱ: 0.83, ㄴ: 0.75 ④ ㄱ: 0.83, ㄴ: 1.20\n⑤ ㄱ: 0.83, ㄴ: 1.33","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",3,0],[30,2019,11,17,0,"금융론","유동화·MBS·리츠·PF","틀린것 고르기","저당담보부증권(MBS) 도입에 따른 부동산시장의 효과에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)\n① 주택금융이 확대됨에 따라 대출기관의 자금이 풍부해져 궁극적으로 주택자금대출이 확대될 수 있다.\n② 주택금융의 대출이자율 하락과 다양한 상품설계에 따라 주택 구입 시 융자받을 수 있는 금액이 증가될 수 있다.\n③ 주택금융의 활성화로 주택건설이 촉진되어 주거안정에 기여할 수 있다.\n④ 주택금융의 확대로 자가소유가구 비중이 감소한다.\n⑤ 대출기관의 유동성이 증대되어 소비자의 담보대출 접근 성이 개선될 수 있다.","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",3,0],[30,2019,11,18,0,"정책론","토지정책·지역지구제","틀린것 고르기","정부가 시행중인 부동산정책에 관한 설명으로 틀린 것은?\n① 국토교통부장관은 도시의 무질서한 확산을 방지하고 도시주변의 자연환경을 보전하여 도시민의 건전한 생활환 경을 확보하기 위하여 개발제한구역을 지정할 수 있다.\n② 도시계획구역안의 택지에 한하여 가구별 소유상한을 초과하는 해당 택지에 대하여는 초과소유부담금을 부과한다.\n③ 정부는 한국토지주택공사를 통하여 토지비축업무를 수행할 수 있다. 2019년 제30회 공인중개\n④ 토지를 경제적ㆍ효율적으로 이용하고 공공복리의 증진을 도모하기 위하여 용도지역제를 실시하고 있다.\n⑤ 국토교통부장관은 주택가격의 안정을 위하여 필요한 경우 일정한 지역을 투기과열지구로 지정할 수 있다.","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",3,0],[30,2019,11,19,0,"개발·관리·마케팅","부동산개발·민간투자","틀린것 고르기","부동산 개발사업에 관한 설명으로 틀린 것은?\n① 프로젝트 파이낸싱(PF)은 예상되는 제반 위험을 프로젝 트회사와 이해당사자 간의 계약에 의해 적절하게 배분 한다.\n② 부동산소유자가 소유권을 신탁회사에 이전하고 신탁회 사로부터 수익증권을 교부받아 수익증권을 담보로 금융기관에서 대출을 받는 상품을 토지신탁이라 한다.\n③ 도시개발법령상 도시개발사업의 시행방식에는 환지방식, 수용 또는 사용방식, 혼용방식이 있다.\n④ 지방자치단체와 민간기업이 합동으로 개발하는 방식은 민관합동개발사업에 해당한다.\n⑤ 도시개발법령상 도시개발구역에서 주거, 상업, 산업, 유통 등의 기능이 있는 단지 또는 시가지를 조성하기 위하여 시행하는 사업을 도시개발사업이라 한다.","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",3,0],[30,2019,11,20,0,"정책론","주택·임대료 정책","틀린것 고르기","분양가규제에 관한 설명으로 틀린 것은?\n① 주택법령상 분양가상한제 적용주택의 분양가격은 택지비와 건축비로 구성된다.\n② 주택법령상 분양가상한제 적용주택 및 그 주택의 입주자로 선정된 지위에 대하여 전매를 제한할 수 있다.\n③ 분양가상한제의 목적은 주택가격을 안정시키고 무주택 자의 신규주택 구입부담을 경감시키기 위해서이다.\n④ 주택법령상 국민주택건설사업을 추진하는 공공사업에 의하여 개발ㆍ조성되는 공동주택이 건설되는 용지에는 주택의 분양가격을 제한할 수 없다.\n⑤ 분양가규제는 신규분양주택의 분양가격을 정부가 통제 하는 것이다.","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",3,0],[30,2019,11,21,0,"투자론","현금흐름·수익률·위험","","부동산 관리에 관하여 다음 설명과 모두 관련이 있는 것은?\n○ 포트폴리오 관리 및 분석\n○ 부동산 투자의 위험 관리\n○ 재투자ㆍ재개발 과정분석\n○ 임대마케팅 시장분석\n① 재산관리(property management)\n② 시설관리(facility management)\n③ 자산관리(asset management)\n④ 건설사업관리(construction management)\n⑤ 임대차관리(leasing management)","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",3,0],[30,2019,11,22,0,"경제론","수요·공급 결정요인·균형","틀린것 고르기","주택공급제도에 관한 설명으로 틀린 것은?\n① 후분양제도는 초기 주택건설자금의 대부분을 주택구매 자로부터 조달하므로 건설자금에 대한 이자의 일부를 주택구매자가 부담하게 된다.\n② 선분양제도는 준공 전 분양대금의 유입으로 사업자의 초기자금부담을 완화할 수 있다.\n③ 후분양제도는 주택을 일정 절차에 따라 건설한 후에 분양하는 방식이다.\n④ 선분양제도는 분양권 전매를 통하여 가수요를 창출하여 부동산시장의 불안을 야기할 수 있다.\n⑤ 소비자측면에서 후분양제도는 선분양제도보다 공급자의 부실시공 및 품질저하에 대처할 수 있다.","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",4,0],[30,2019,11,23,0,"개발·관리·마케팅","부동산개발·민간투자","틀린것 고르기","부동산신탁에 관한 설명으로 틀린 것은?\n① 부동산신탁에 있어서 당사자는 부동산 소유자인 위탁자와 부동산 신탁사인 수탁자 및 신탁재산의 수익권을 배당 받는 수익자로 구성되어 있다.\n② 부동산의 소유권관리, 건물수선 및 유지, 임대차관리 등 제반 부동산 관리업무를 신탁회사가 수행하는 것을 관리신탁이라 한다.\n③ 처분신탁은 처분방법이나 절차가 까다로운 부동산에 대한 처분업무 및 처분완료시까지의 관리업무를 신탁회사가 수행하는 것이다.\n④ 관리신탁에 의하는 경우 법률상 부동산 소유권의 이전 없이 신탁회사가 부동산의 관리업무를 수행하게 된다.\n⑤ 분양신탁관리는 상가 등 건축물 분양의 투명성과 안정 성을 확보하기 위하여 신탁회사에게 사업부지의 신탁과 분양에 따른 자금관리업무를 부담시키는 것이다.","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",4,0],[30,2019,11,24,0,"감정평가론","가치·가격원칙·지역분석","박스형(모두고르기), 옳은것 고르기","화폐의 시간가치에 관한 설명으로 옳은 것을 모두고른 것은?(단, 다른 조건은 동일함)\nㄱ. 은행으로부터 주택구입자금을 대출한 가구가 매월 상환할 금액을 산정하는 경우 감채기금계수를 사용한다.\nㄴ. 연금의 현재가치계수와 저당상수는 역수관계이다.\nㄷ. 연금의 미래가치란 매 기간마다 일정 금액을 불입해 나갈 때, 미래의 일정시점에서의 원금과 이자의 총액을 말한다.\nㄹ. 일시불의 현재가치계수는 할인율이 상승할수 록 작아진다.\n① ㄱ ② ㄴ, ㄷ ③ ㄱ, ㄴ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",4,0],[30,2019,11,25,0,"투자론","현금흐름·수익률·위험","틀린것 고르기","부동산투자의 현금흐름 추정에 관한 설명으로 틀린 것은?\n① 순영업소득은 유효총소득에서 영업경비를 차감한 소득을 말한다.\n② 영업경비는 부동산 운영과 직접 관련 있는 경비로, 광고비, 전기세, 수선비가 이에 해당된다. 2019년 제30회 공인중개\n③ 세전현금흐름은 지분투자자에게 귀속되는 세전소득을 말하는 것으로, 순영업소득에 부채서비스액(원리금상환액)을 가산한 소득이다.\n④ 세전지분복귀액은 자산의 순매각금액에서 미상환 저당 잔액을 차감하여 지분투자자의 몫으로 되돌아오는 금액을 말한다.\n⑤ 부동산투자에 대한 대가는 보유 시 대상부동산의 운영 으로부터 나오는 소득이득과 처분 시의 자본이득의 형 태로 나타난다.","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",4,0],[30,2019,11,26,0,"투자론","현금흐름·수익률·위험","계산, 빈칸","상가 경제상황별 예측된 확률이 다음과 같을 때, 상가의 기대수익률이 8%라고 한다. 정상적 경제상황의 경우 ( )에 들어갈 예상수익률은?(단, 주어진 조건에 한함) 상가의 경제상황 경제상황별 상가의 상황별 확률(%) 예상수익률(%) 기대수익률(%) 비관적 20 4 정상적 40 ( ) 8 낙관적 40 10\n① 4 ② 6 ③ 8 ④ 10 ⑤ 12","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",4,0],[30,2019,11,27,0,"투자론","현금흐름·수익률·위험","틀린것 고르기","포트폴리오이론에 관한 설명으로 틀린 것은?\n① 분산투자효과는 포트폴리오를 구성하는 투자자산 종목의 수를 늘릴수록 체계적 위험이 감소되어 포트폴리오 전체의 위험이 감소되는 것이다.\n② 포트폴리오전략에서 구성자산 간에 수익률이 반대 방향으로 움직일 경우 위험감소의 효과가 크다.\n③ 효율적 프런티어(효율적 전선)란 평균-분산 지배원리에의해 모든 위험수준에서 최대의 기대수익률을 얻을 수 있는 포트폴리오의 집합을 말한다.\n④ 효율적 프런티어(효율적 전선)의 우상향에 대한 의미는 투자자가 높은 수익률을 얻기 위해 많은 위험을 감수하는 것이다.\n⑤ 포트폴리오이론은 투자 시 여러 종목에 분산투자함으로 써 위험을 분산시켜 안정된 수익을 얻으려는 자산투자 이론이다.","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",4,0],[30,2019,11,28,0,"투자론","투자분석기법(NPV·IRR 등)","틀린것 고르기","부동산투자의 할인현금흐름기법(DCF)과 관련된 설명으로 틀린 것은?\n① 내부수익률(IRR)은 투자로부터 발생하는 현재와 미래 현금흐름의 순현재가치를 1로 만드는 할인율을 말한다.\n② 순현재가치(NPV)는 투자자의 요구수익률로 할인한 현금유입의 현가에서 현금유출의 현가를 뺀 값이다.\n③ 할인현금흐름기법이란 부동산투자로부터 발생하는 현금흐름을 일정한 할인율로 할인하는 투자의사결정 기법이다.\n④ 수익성지수(PI)는 투자로 인해 발생하는 현금유입의 현가를 현금유출의 현가로 나눈 비율이다.\n⑤ 민감도분석은 모형의 투입요소가 변화함에 따라, 그 결과치인 순현재가치와 내부수익률이 어떻게 변화하는지를 분석하는 것이다.","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",4,0],[30,2019,11,29,0,"감정평가론","가치·가격원칙·지역분석","틀린것 고르기, 계산","비율분석법을 이용하여 산출한 것으로 틀린 것은?\n(단, 주어진 조건에 한하며, 연간 기준임)\n○ 주택담보대출액: 1억원\n○ 주택담보대출의 연간 원리금상환액: 500만원\n○ 부동산가치: 2억원\n○ 차입자의 연소득: 1,250만원\n○ 가능총소득: 2,000만원\n○ 공실손실상당액 및 대손충당금: 가능총소득의 25%\n○ 영업경비: 가능총소득의 50%\n① 담보인정비율(LTV)= 0.5\n② 부채감당률(DCR)= 1.0\n③ 총부채상환비율(DTI)= 0.4\n④ 채무불이행률(DR)= 1.0\n⑤ 영업경비비율(OER, 유효총소득 기준)= 0.8","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",5,0],[30,2019,11,30,0,"금융론","유동화·MBS·리츠·PF","옳은것 고르기","자산유동화에 관한 법령상 부동산 프로젝트 파이낸싱(PF)의 유동화에 관한 설명으로 옳은 것은?\n① 프로젝트 파이낸싱의 유동화는 자산유동화에 관한 법령에 의해서만 가능하다.\n② 유동화자산의 양도방식은 매매 또는 교환에 의한다.\n③ 유동화전문회사는 상법상 주식회사로 한다.\n④ 자산담보부 기업어음(ABCP)은 금융위원회에 등록한 유동화계획의 기재내용대로 유사자산을 반복적으로 유동화한다.\n⑤ 자산보유자(양도인)는 유동화자산에 대한 양수인의 반환청구권을 보장해야 한다.","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",5,0],[30,2019,11,31,0,"금융론","유동화·MBS·리츠·PF","틀린것 고르기","부동산투자회사법상 위탁관리 부동산투자회사(REITs) 에 관한 설명으로 틀린 것은?\n① 주주 1인당 주식소유의 한도가 제한된다.\n② 주주를 보호하기 위해서 직원이 준수해야 할 내부통제 기준을 제정하여야 한다.\n③ 자산의 투자ㆍ운용을 자산관리회사에 위탁하여야 한다.\n④ 주요 주주의 대리인은 미공개 자산운용정보를 이용하여 부동산을 매매하거나 타인에게 이용하게 할 수 없다.\n⑤ 설립 자본금은 3억원 이상으로 한다.","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",5,0],[30,2019,11,32,0,"감정평가론","가치·가격원칙·지역분석","계산","임대인 A와 임차인 B는 임대차계약을 체결하려고 한다. 향후 3년간 순영업소득의 현재가치 합계는?\n(단, 주어진 조건에 한하며, 모든 현금유출입은 매 기간말에 발생함)\n○ 연간 임대료는 1년차 5,000만원에서 매년 200 만원씩 증가\n○ 연간 영업경비는 1년차 2,000만원에서 매년 100만원씩 증가\n○ 1년 후 일시불의 현가계수 0.95\n○ 2년 후 일시불의 현가계수 0.90\n○ 3년 후 일시불의 현가계수 0.85 2019년 제30회 공인중개\n① 8,100만원 ② 8,360만원 ③ 8,620만원\n④ 9,000만원 ⑤ 9,300만원","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",5,0],[30,2019,11,33,0,"금융론","부동산금융 일반·주택금융","틀린것 고르기","부동산 금융 및 투자에 관한 설명으로 틀린 것은?\n(단, 다른 조건은 동일함)\n① 프로젝트의 채무불이행위험이 높아질수록 대출기관이 요구하는 금리가 높아진다.\n② 자본환원율은 자본의 기회비용과 프로젝트의 투자위험을 반영한다.\n③ 분양형 개발사업의 핵심 상환재원은 준공 이후 발생하는 임대료ㆍ관리비 등의 영업현금흐름이다.\n④ 프로젝트는 자본시장 내 다른 투자수단들과 경쟁하므로 동일 위험수준의 투자수익률에 수렴하는 경향이 있다.\n⑤ 자본환원율이 상승하면 부동산자산의 가격이 하락 압력을 받으므로 신규개발사업 추진이 어려워진다.","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",5,0],[30,2019,11,34,0,"정책론","주택·임대료 정책","계산","A회사는 분양면적 500m2의 매장을 손익분기점 매출액 이하이면 기본임대료만 부담하고, 손익분기점 매출액을 초과하는 매출액에 대하여 일정 임대료율을 적용한 추가임대료를 가산하는 비율임대차(percentage lease)방식으로 임차하고자 한다. 향후 1년 동안 A회사가 지급할 것으로 예상되는 연임대료는?(단, 주어진 조건에 한하며, 연간 기준임)\n○ 예상매출액: 분양면적 m2당 20만원\n○ 기본임대료: 분양면적 m2당 6만원\n○ 손익분기점 매출액: 5,000만원\n○ 손익분기점 매출액 초과 매출액에 대한 임대료율: 10%\n① 3,200만원 ② 3,300만원 ③ 3,400만원\n④ 3,500만원 ⑤ 3,600만원","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",5,0],[30,2019,11,35,0,"감정평가론","감정평가에 관한 규칙","틀린것 고르기","감정평가에 관한 규칙에 규정된 내용으로 틀린 것은?\n① 감정평가업자는 법령에 다른 규정이 있는 경우에는 대상물건의 감정평가액을 시장가치 외의 가치를 기준으로 결정할 수 있다.\n② 감정평가업자는 법령에 다른 규정이 있는 경우에는 기준시점의 가치형성요인 등을 실제와 다르게 가정하거나 특수한 경우로 한정하는 조건(감정평가조건)을 붙여 감정평가할 수 있다.\n③ 둘 이상의 대상물건이 일체로 거래되거나 대상물건 상호간에 용도상 불가분의 관계가 있는 경우에는 일괄하여 감정평가할 수 있다.\n④ 하나의 대상물건이라도 가치를 달리하는 부분은 이를 구분하여 감정평가할 수 있다.\n⑤ 기준시점은 대상물건의 가격조사를 개시한 날짜로 한\n다. 다만, 기준시점을 미리 정하였을 때에는 그 날짜에 가격조사가 가능한 경우에만 기준시점으로 할 수 있다.","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",5,0],[30,2019,11,36,0,"감정평가론","감정평가 3방식·시산가액","틀린것 고르기","감정평가 3방식 및 시산가액 조정에 관한 설명으로 틀린 것은?\n① 감정평가 3방식은 수익성, 비용성, 시장성에 기초하고 있다.\n② 시산가액은 감정평가 3방식에 의하여 도출된 각각의 가 액이다.\n③ 시산가액 조정은 각 시산가액을 상호 관련시켜 재검토 함으로써 시산가액 상호간의 격차를 합리적으로 조정하는 작업이다.\n④ 시산가액 조정은 각 시산가액을 산술평균하는 방법만 인정된다.\n⑤ 감정평가에 관한 규칙에서는 시산가액 조정에 대하여 규정하고 있다.","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",6,0],[30,2019,11,37,0,"감정평가론","감정평가 3방식·시산가액","계산","다음 자료를 활용하여 직접환원법으로 평가한 대상부동산의 수익가액은?(단, 주어진 조건에 한하며, 연간 기준임)\n○ 가능총소득: 8,000만원\n○ 공실손실상당액 및 대손충당금: 가능총소득의 10%\n○ 수선유지비: 400만원\n○ 화재보험료: 100만원\n○ 재산세: 200만원\n○ 영업소득세: 300만원\n○ 부채서비스액: 500만원\n○ 환원율: 10%\n① 5억 7천만원 ② 6억원 ③ 6억 5천만원\n④ 6억 7천만원 ⑤ 6억 8천만원","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",6,0],[30,2019,11,38,0,"감정평가론","부동산가격공시","틀린것 고르기","부동산 가격공시에 관한 법률에 규정된 내용으로 틀린 것은?\n① 표준지공시지가에 이의가 있는 자는 그 공시일부터 30 일 이내에 서면으로 국토교통부장관에게 이의를 신청할 수 있다.\n② 표준지공시지가는 국가ㆍ지방자치단체 등이 그 업무와 관련하여 지가를 산정하거나 감정평가업자가 개별적으로 토지를 감정평가하는 경우에 기준이 된다.\n③ 표준지로 선정된 토지에 대하여 개별공시지가를 결정ㆍ공시하여야 한다.\n④ 시장ㆍ군수 또는 구청장은 공시기준일 이후에 분할ㆍ합병 등이 발생한 토지에 대하여는 대통령령으로 정하는 날을 기준으로 하여 개별공시지가를 결정ㆍ공시하여야 한다.\n⑤ 개별공시지가에 이의가 있는 자는 그 결정ㆍ공시일부터 30일 이내에 서면으로 시장ㆍ군수 또는 구청장에게 이의를 신청할 수 있다. 2019년 제30회 공인중개","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",6,0],[30,2019,11,39,0,"감정평가론","감정평가 3방식·시산가액","계산","다음 자료를 활용하여 공시지가기준법으로 평가한 대상 토지의 가액(원/m2)은?(단, 주어진 조건에 한함)\n○ 소재지 등: A시 B구 C동 100, 일반상업지역, 상업용\n○ 기준시점: 2019.10.26\n○ 표준지공시지가(A시 B구 C동, 2019.01.01기준) 기 공시지가 소재지 용도지역 이용상황 호 (원/m2) 일반공업 1 C동 90 상업용 1,000,000 지역 일반상업 2 C동 110 상업용 2,000,000 지역\n○ 지가변동률(A시 B구, 2019.01.01∼2019.10.26)\n- 공업지역: 4% 상승\n- 상업지역: 5% 상승\n○ 지역요인: 표준지와 대상토지는 인근지역에 위 치하여 지역요인은 동일함\n○ 개별요인: 대상토지는 표준지 기호 1, 2에 비해 각각 가로조건에서 10% 우세하고, 다른 조건은 동일함(상승식으로 계산할 것)\n○ 그 밖의 요인으로 보정할 사항 없음\n① 1,144,000 ② 1,155,000 ③ 2,100,000\n④ 2,288,000 ⑤ 2,310,000","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",6,0],[30,2019,11,40,0,"감정평가론","가치·가격원칙·지역분석","틀린것 고르기","감정평가 과정상 지역분석과 개별분석에 관한 설명으로 틀린 것은?\n① 해당 지역 내 부동산의 표준적 이용과 가격수준 파악을 위해 지역분석이 필요하다.\n② 지역분석은 대상부동산에 대한 미시적ㆍ국지적 분석인 데 비하여, 개별분석은 대상지역에 대한 거시적ㆍ광역 적 분석이다.\n③ 인근지역이란 대상부동산이 속한 지역으로서 부동산의 이용이 동질적이고 가치형성요인 중 지역요인을 공유하는 지역을 말한다.\n④ 동일수급권이란 대상부동산과 대체ㆍ경쟁 관계가 성립하고 가치 형성에 서로 영향을 미치는 관계에 있는 다른 부동산이 존재하는 권역을 말하며, 인근지역과 유사지역을 포함한다.\n⑤ 대상부동산의 최유효이용을 판정하기 위해 개별분석이 필요하다.","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",6,0],[30,2019,11,41,1,"민법총칙","법률행위(반사회·불공정)","판례, 틀린것 고르기","반사회질서의 법률행위에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 반사회질서의 법률행위에 해당하는지 여부는 해당 법률행위가 이루어진 때를 기준으로 판단해야 한다.\n② 반사회질서의 법률행위의 무효는 이를 주장할 이익이 있는 자는 누구든지 주장할 수 있다.\n③ 법률행위가 사회질서에 반한다는 판단은 부단히 변천하는 가치관념을 반영한다.\n④ 다수의 보험계약을 통하여 보험금을 부정취득할 목적으로 체결한 보험계약은 반사회질서의 법률행위이다.\n⑤ 대리인이 매도인의 배임행위에 적극 가담하여 이루어진 부동산의 이중매매는 본인인 매수인이 그러한 사정을 몰랐다면 반사회질서의 법률행위가 되지 않는다.","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",7,0],[30,2019,11,42,1,"민법총칙","의사표시(착오·사기·통정허위)","판례, 틀린것 고르기","통정허위표시에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 통정허위표시가 성립하기 위해서는 진의와 표시의 불일 치에 관하여 상대방과 합의가 있어야 한다.\n② 통정허위표시로서 무효인 법률행위라도 채권자취소권의 대상이 될 수 있다.\n③ 당사자가 통정하여 증여를 매매로 가장한 경우, 증여와 매매 모두 무효이다.\n④ 통정허위표시의 무효로 대항할 수 없는 제3자의 범위는 통정허위표시를 기초로 새로운 법률상 이해관계를 맺었는지 여부에 따라 실질적으로 파악해야 한다.\n⑤ 통정허위표시의 무효로 대항할 수 없는 제3자에 해당하 는지의 여부를 판단할 때, 파산관재인은 파산채권자 모두가 악의로 되지 않는 한 선의로 다루어진다.","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",7,0],[30,2019,11,43,1,"민법총칙","조건·기한","판례, 옳은것 고르기","조건과 기한에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 해제조건 있는 법률행위는 조건이 성취한 때로부터 그 효력이 발생한다.\n② 기한이익 상실특약은 특별한 사정이 없는 한 정지조건부 기한이익 상실특약으로 추정한다.\n③ 조건이 법률행위 당시에 이미 성취할 수 없는 것인 경우, 그 조건이 정지조건이면 그 법률행위는 무효로 한다.\n④ 불확정한 사실의 발생시기를 이행기한으로 정한 경우, 그 사실의 발생이 불가능하게 되었다고 하여 이행기한이 도래한 것으로 볼 수는 없다.\n⑤ 상계의 의사표시에는 시기(始期)를 붙일 수 있다. 2019년 제30회 공인중개","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",7,0],[30,2019,11,44,1,"민법총칙","의사표시(착오·사기·통정허위)","판례, 옳은것 고르기","甲은 乙과 체결한 매매계약에 대한 적법한 해제의 의사표시를 내용증명우편을 통하여 乙에게 발송하였\n다. 다음 설명 중 옳은 것은?(다툼이 있으면 판례에 따름)\n① 甲이 그 후 사망하면 해제의 의사표시는 효력을 잃는다.\n② 乙이 甲의 해제의 의사표시를 실제로 알아야 해제의 효력이 발생한다.\n③ 甲은 내용증명우편이 乙에게 도달한 후에도 일방적으로 해제의 의사표시를 철회할 수 있다.\n④ 甲의 내용증명우편이 반송되지 않았다면, 특별한 사정이 없는 한 그 무렵에 乙에게 송달되었다고 봄이 상당하다.\n⑤ 甲의 내용증명우편이 乙에게 도달한 후 乙이 성년후견 개시의 심판을 받은 경우, 甲의 해제의 의사표시는 효력을 잃는다.","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",7,0],[30,2019,11,45,1,"민법총칙","대리(무권대리·표현대리)","판례, 틀린것 고르기","甲은 자신의 X토지를 매도하기 위하여 乙에게 대리권을 수여하였다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 乙이 한정후견개시의 심판을 받은 경우, 특별한 사정이 없는 한 乙의 대리권은 소멸한다.\n② 乙은 甲의 허락이 있으면 甲을 대리하여 자신이 X토지를 매수하는 계약을 체결할 수 있다.\n③ 甲은 특별한 사정이 없는 한 언제든지 乙에 대한 수권행위를 철회할 수 있다.\n④ 甲의 수권행위는 불요식행위로서 묵시적인 방법에 의해서도 가능하다.\n⑤ 乙은 특별한 사정이 없는 한 대리행위를 통하여 체결된 X토지 매매계약에 따른 잔금을 수령할 권한도 있다.","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",7,0],[30,2019,11,46,1,"민법총칙","대리(무권대리·표현대리)","판례, 틀린것 고르기","복대리에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 복대리인은 본인의 대리인이다.\n② 임의대리인이 본인의 승낙을 얻어서 복대리인을 선임한 경우, 본인에 대하여 그 선임감독에 관한 책임이 없다.\n③ 대리인이 복대리인을 선임한 후 사망한 경우, 특별한 사정이 없는 한 그 복대리권도 소멸한다.\n④ 복대리인의 대리행위에 대하여도 표현대리에 관한 규정이 적용될 수 있다.\n⑤ 법정대리인은 부득이한 사유가 없더라도 복대리인을 선임할 수 있다.","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",7,0],[30,2019,11,47,1,"민법총칙","대리(무권대리·표현대리)","판례, 틀린것 고르기","대리권 없는 乙이 甲을 대리하여 甲의 토지에 대한 임대차계약을 丙과 체결하였다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 위 임대차계약은 甲이 추인하지 아니하면, 특별한 사정이 없는 한 甲에 대하여 효력이 없다.\n② 甲은 위 임대차계약을 묵시적으로 추인할 수 있다.\n③ 丙이 계약 당시에 乙에게 대리권 없음을 알았던 경우에는 丙의 甲에 대한 최고권이 인정되지 않는다.\n④ 甲이 임대기간을 단축하여 위 임대차계약을 추인한 경우, 丙의 동의가 없는 한 그 추인은 무효이다.\n⑤ 甲이 추인하면, 특별한 사정이 없는 한 위 임대차계약은 계약 시에 소급하여 효력이 생긴다.","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",8,0],[30,2019,11,48,1,"민법총칙","대리(무권대리·표현대리)","박스형(모두고르기), 판례, 틀린것 고르기","임의대리에 관한 설명으로 틀린 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 대리인이 여러 명인 때에는 공동대리가 원칙이다.\nㄴ. 권한을 정하지 아니한 대리인은 보존행위만을 할 수 있다.\nㄷ. 유권대리에 관한 주장 속에는 표현대리의 주장이 포함되어 있다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",8,0],[30,2019,11,49,1,"민법총칙","무효·취소·추인","틀린것 고르기","법정추인이 인정되는 경우가 아닌 것은?(단, 취소권 자는 추인할 수 있는 상태이며, 행위자가 취소할 수 있는 법률행위에 관하여 이의보류 없이 한 행위임을 전제함)\n① 취소권자가 상대방에게 채무를 이행한 경우\n② 취소권자가 상대방에게 담보를 제공한 경우\n③ 상대방이 취소권자에게 이행을 청구한 경우\n④ 취소할 수 있는 행위로 취득한 권리를 취소권자가 타인에게 양도한 경우\n⑤ 취소권자가 상대방과 경개계약을 체결한 경우","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",8,0],[30,2019,11,50,1,"민법총칙","무효·취소·추인","판례, 틀린것 고르기","甲은 토지거래허가구역 내에 있는 그 소유 X토지에 관하여 乙과 매매계약을 체결하였다. 비록 이 계약이 토지거래허가를 받지는 않았으나 확정적으로 무효가 아닌 경우, 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 위 계약은 유동적 무효의 상태에 있다.\n② 乙이 계약내용에 따른 채무를 이행하지 않더라도 甲은이를 이유로 위 계약을 해제할 수 없다.\n③ 甲은 乙의 매매대금 이행제공이 없음을 이유로 토지거래허가 신청에 대한 협력의무의 이행을 거절할 수 없다.\n④ 토지거래허가구역 지정기간이 만료되었으나 재지정이 없는 경우, 위 계약은 확정적으로 유효로 된다. 2019년 제30회 공인중개\n⑤ 乙이 丙에게 X토지를 전매하고 丙이 자신과 甲을 매매 당사자로 하는 허가를 받아 甲으로부터 곧바로 등기를 이전받았다면 그 등기는 유효하다.","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",8,0],[30,2019,11,51,1,"물권법","물권적 청구권","판례, 틀린것 고르기","물권적 청구권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 소유권에 기한 물권적 청구권은 소멸시효에 걸리지 않는다.\n② 상대방의 귀책사유는 물권적 청구권의 행사요건이 아니다.\n③ 물권적 방해배제청구권의 요건으로 요구되는 방해는 개 념상 손해와 구별된다.\n④ 임차인은 임차목적물에 관한 임대인의 소유권에 기한 물권적 청구권을 대위행사할 수 없다.\n⑤ 유치권자는 점유권에 기한 물권적 청구권을 행사할 수 있다.","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",8,0],[30,2019,11,52,1,"물권법","물권변동·등기","판례, 틀린것 고르기","부동산 물권변동에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 부동산 물권변동 후 그 등기가 원인 없이 말소되었더라도 그 물권변동의 효력에는 영향이 없다.\n② 등기를 요하지 않는 물권취득의 원인인 판결이란 이행판결을 의미한다.\n③ 소유권이전등기청구권의 보전을 위한 가등기에 기하여 본등기가 행해지면 물권변동의 효력은 본등기가 행해진 때 발생한다.\n④ 매수한 토지를 인도받아 점유하고 있는 미등기 매수인으로부터 그 토지를 다시 매수한 자는 특별한 사정이 없는 한 최초 매도인에 대하여 직접 자신에게로의 소유권이전등기를 청구할 수 없다.\n⑤ 강제경매로 인해 성립한 관습상 법정지상권을 법률행위에 의해 양도하기 위해서는 등기가 필요하다.","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",8,0],[30,2019,11,53,1,"민법총칙","대리(무권대리·표현대리)","판례, 옳은것 고르기","등기의 추정력에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 사망자 명의로 신청하여 이루어진 이전등기에는 특별한 사정이 없는 한 추정력이 인정되지 않는다.\nㄴ. 대리에 의한 매매계약을 원인으로 소유권이전등기가 이루어진 경우, 대리권의 존재는 추정된다.\nㄷ. 근저당권등기가 행해지면 피담보채권뿐만 아니라 그 피담보채권을 성립시키는 기본계약의 존재도 추정된다.\nㄹ. 건물 소유권보존등기 명의자가 전(前)소유자로부터 그 건물을 양수하였다고 주장하는 경우, 전(前)소유자가 양도사실을 부인하더라도 그 보존등기의 추정력은 깨어지지 않는다.\n① ㄱ, ㄴ ② ㄱ, ㄷ ③ ㄴ, ㄷ ④ ㄴ, ㄹ ⑤ ㄷ, ㄹ","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",8,0],[30,2019,11,54,1,"물권법","점유권","판례, 틀린것 고르기","간접점유에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 주택임대차보호법상의 대항요건인 인도(引渡)는 임차인이 주택의 간접점유를 취득하는 경우에도 인정될 수 있다.\n② 점유취득시효의 기초인 점유에는 간접점유도 포함된다.\n③ 직접점유자가 그 점유를 임의로 양도한 경우, 그 점유 이전이 간접점유자의 의사에 반하더라도 간접점유가 침탈된 것은 아니다.\n④ 간접점유자에게는 점유보호청구권이 인정되지 않는다.\n⑤ 점유매개관계를 발생시키는 법률행위가 무효라 하더라도 간접점유는 인정될 수 있다.","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",9,0],[30,2019,11,55,1,"물권법","소유권(취득시효·부합·상린)","판례, 옳은것 고르기","점유취득시효에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 부동산에 대한 악의의 무단점유는 점유취득시효의 기초인 자주점유로 추정된다.\n② 집합건물의 공용부분은 별도로 취득시효의 대상이 되지 않는다.\n③ 1필의 토지 일부에 대한 점유취득시효는 인정될 여지가 없다.\n④ 아직 등기하지 않은 시효완성자는 그 완성 전에 이미 설정되어 있던 가등기에 기하여 시효완성 후에 소유권이전의 본등기를 마친 자에 대하여 시효완성을 주장할 수 있다.\n⑤ 부동산에 대한 압류 또는 가압류는 점유취득시효를 중 단시킨다.","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",9,0],[30,2019,11,56,1,"물권법","물권변동·등기","판례, 옳은것 고르기","등기청구권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 점유취득시효의 완성으로 점유자가 소유자에 대해 갖는 소유권이전등기청구권은 통상의 채권양도 법리에 따라 양도될 수 있다.\n② 부동산을 매수하여 인도받아 사용ㆍ수익하는 자의 매도인에 대한 소유권이전등기청구권은 소멸시효에 걸린다.\n③ 부동산 매수인이 매도인에 대해 갖는 소유권이전등기청구권은 물권적 청구권이다.\n④ 가등기에 기한 소유권이전등기청구권이 시효완성으로 소멸된 후 그 부동산을 취득한 제3자가 가등기권자에 대해 갖는 등기말소청구권은 채권적 청구권이다.\n⑤ 등기청구권과 등기신청권은 동일한 내용의 권리이다.","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",9,0],[30,2019,11,57,1,"물권법","소유권(취득시효·부합·상린)","틀린것 고르기","부합에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 부동산 간에도 부합이 인정될 수 있다.\n② 부동산에 부합된 동산의 가격이 부동산의 가격을 초과하더라도 동산의 소유권은 원칙적으로 부동산의 소유자에게 귀속된다.\n③ 부합으로 인하여 소유권을 상실한 자는 부당이득의 요건이 충족되는 경우에 보상을 청구할 수 있다. 2019년 제30회 공인중개\n④ 토지소유자와 사용대차계약을 맺은 사용차주가 자신 소유의 수목을 그 토지에 식재한 경우, 그 수목의 소유권 자는 여전히 사용차주이다.\n⑤ 매도인에게 소유권이 유보된 시멘트를 매수인이 제3자 소유의 건물 건축공사에 사용한 경우, 그 제3자가 매도인의 소유권 유보에 대해 악의라면 특별한 사정이 없는 한 시멘트는 건물에 부합하지 않는다.","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",9,0],[30,2019,11,58,1,"물권법","공동소유","옳은것 고르기","공유에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 공유자 전원이 임대인으로 되어 공유물을 임대한 경우, 그 임대차계약을 해지하는 것은 특별한 사정이 없는 한 공유물의 보존행위이다.\n② 개별 채권자들이 같은 기회에 특정 부동산에 관하여 하나의 근저당권을 설정받은 경우, 그들은 해당 근저당권을 준공유한다.\n③ 공유부동산에 대해 공유자 중 1인의 단독 명의로 원인 무효의 소유권이전등기가 행해졌다면 다른 공유자는 등기명의인인 공유자를 상대로 등기 전부의 말소를 청구할 수 있다.\n④ 과반수지분권자가 단독으로 공유토지를 임대한 경우, 소수지분권자는 과반수지분권자에게 부당이득반환을 청구할 수 없다.\n⑤ 부동산 공유자 중 1인의 공유지분 포기에 따른 물권변 동은 그 포기의 의사표시가 다른 공유자에게 도달함으로써 효력이 발생하며 등기를 요하지 않는다.","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",9,0],[30,2019,11,59,1,"물권법","지상권(법정지상권·분묘기지권)","판례, 옳은것 고르기","甲은 乙은행에 대한 채무의 이행을 담보하고자 그 소유 토지(X)에 乙명의의 저당권과 함께 X의 담보가 치 유지만을 위한 乙명의의 지상권을 설정하였다. 이후 甲과 丙은 X에 건축물(Y)을 축조하였다. 다음 설명 중 옳은 것은?(다툼이 있으면 판례에 따름)\n① 乙의 甲에 대한 위 채권이 시효소멸하여도 乙명의의 지상권은 존속한다.\n② 乙이 지상권침해를 이유로 丙에 대하여 Y의 철거를 청구할 경우, 특별한 사정이 없는 한 丙은 甲에 대한 채권을 이유로 乙에게 대항할 수 있다.\n③ 乙은 丙에게 X의 사용ㆍ수익을 이유로 부당이득의 반환을 청구할 수 있다.\n④ Y의 축조로 X의 교환가치가 피담보채권액 미만으로 하락하면 乙은 甲에게 저당권침해를 이유로 손해배상을 청구할 수 있다.\n⑤ 乙의 지상권은 담보물권이므로 그 피담보채무의 범위 확인을 구하는 청구는 적법하다.","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",9,0],[30,2019,11,60,1,"물권법","지역권","판례, 틀린것 고르기","지역권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 요역지는 1필의 토지여야 한다.\n② 요역지의 지상권자는 자신의 용익권 범위 내에서 지역권을 행사할 수 있다.\n③ 공유자 중 1인이 지역권을 취득한 때에는 다른 공유자도 지역권을 취득한다.\n④ 요역지의 불법점유자는 통행지역권을 시효취득할 수 없다.\n⑤ 통행지역권을 시효취득하였다면, 특별한 사정이 없는 한 요역지 소유자는 도로설치로 인해 승역지 소유자가 입은 손실을 보상하지 않아도 된다.","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",10,0],[30,2019,11,61,1,"물권법","전세권","판례, 틀린것 고르기","甲은 그 소유 X건물의 일부에 관하여 乙명의의 전세권을 설정하였다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 乙의 전세권이 법정갱신되는 경우, 그 존속기간은 1년이다.\n② 존속기간 만료시 乙이 전세금을 반환받지 못하더라도 乙은 전세권에 기하여 X건물 전체에 대한 경매를 신청할 수는 없다.\n③ 존속기간 만료시 乙은 특별한 사정이 없는 한 전세금반 환채권을 타인에게 양도할 수 있다.\n④ 甲이 X건물의 소유권을 丙에게 양도한 후 존속기간이 만료되면 乙은 甲에 대하여 전세금반환을 청구할 수 없다.\n⑤ 乙은 특별한 사정이 없는 한 전세목적물의 현상유지를 위해 지출한 통상필요비의 상환을 甲에게 청구할 수 없다.","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",10,0],[30,2019,11,62,1,"물권법","유치권","판례, 틀린것 고르기","X물건에 대한 甲의 유치권 성립에 영향을 미치지 않는 것은?(다툼이 있으면 판례에 따름)\n① X의 소유권자가 甲인지 여부\n② X에 관하여 생긴 채권의 변제기가 도래하였는지 여부\n③ X에 대한 甲의 점유가 채무자를 매개로 한 간접점유가 아닌 한, 직접점유인지 간접점유인지 여부\n④ X에 대한 甲의 점유가 불법행위에 의한 것인지 여부\n⑤ X에 관하여 생긴 채권에 기한 유치권을 배제하기로 한 채무자와의 약정이 있었는지 여부","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",10,0],[30,2019,11,63,1,"물권법","저당권·근저당권","틀린것 고르기","甲은 그 소유 나대지(X)에 乙에 대한 채무담보를 위해 乙명의의 저당권을 설정하였다. 이후 丙은 X에 건물(Y)을 신축하여 소유하고자 甲으로부터 X를 임차하여 Y를 완성한 후, Y에 丁명의의 저당권을 설정하였다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 乙은 甲에 대한 채권과 분리하여 자신의 저당권을 타인에게 양도할 수 없다.\n② 乙이 X에 대한 저당권을 실행하는 경우, Y에 대해서도 일괄경매를 청구할 수 있다.\n③ 丁의 Y에 대한 저당권 실행으로 戊가 경락을 받아 그 대금을 완납하면, 특별한 사정이 없는 한 丙의 X에 관한 임차권은 戊에게 이전된다. 2019년 제30회 공인중개사\n④ 丁의 Y에 대한 저당권이 실행되더라도 乙의 저당권은 소멸하지 않는다.\n⑤ 甲이 X를 매도하는 경우, 乙은 그 매매대금에 대해 물상대위권을 행사할 수 없다.","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",10,0],[30,2019,11,64,1,"물권법","소유권(취득시효·부합·상린)","박스형(모두고르기), 판례","법률상 특별한 규정이나 당사자 사이에 다른 약정이 없는 경우, 저당권의 효력이 미치는 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 저당권 설정 이전의 저당부동산의 종물로서 분리ㆍ반출되지 않은 것\nㄴ. 저당권 설정 이후의 저당부동산의 부합물로서 분리ㆍ반출되지 않은 것\nㄷ. 저당부동산에 대한 압류 이전에 저당부동산으 로부터 발생한 저당권설정자의 차임채권\n① ㄴ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",10,0],[30,2019,11,65,1,"계약법","해제·해지","박스형(모두고르기), 판례, 옳은것 고르기","계약금에 관한 설명으로 옳은 것을 모두 고른 것은?\n(다툼이 있으면 판례에 따름)\nㄱ. 계약금은 별도의 약정이 없는 한 해약금의 성질을 가진다.\nㄴ. 매수인이 이행기 전에 중도금을 지급한 경우, 매도인은 특별한 사정이 없는 한 계약금의 배액을 상환하여 계약을 해제할 수 없다.\nㄷ. 매도인이 계약금의 배액을 상환하여 계약을 해제하는 경우, 그 이행의 제공을 하면 족하고 매수인이 이를 수령하지 않더라도 공탁까 지 할 필요는 없다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",10,0],[30,2019,11,66,1,"계약법","제3자를 위한 계약","판례, 틀린것 고르기","甲(요약자)과 乙(낙약자)은 丙을 수익자로 하는 제3 자를 위한 계약을 체결하였다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 甲은 대가관계의 부존재를 이유로 자신이 기본관계에 기하여 乙에게 부담하는 채무의 이행을 거부할 수 없다.\n② 甲과 乙 간의 계약이 해제된 경우, 乙은 丙에게 급부한 것이 있더라도 丙을 상대로 부당이득반환을 청구할 수 없다.\n③ 丙이 수익의 의사표시를 한 후 甲이 乙의 채무불이행을 이유로 계약을 해제하면, 丙은 乙에게 그 채무불이행으로 자기가 입은 손해의 배상을 청구할 수 있다.\n④ 甲과 乙 간의 계약이 甲의 착오로 취소된 경우, 丙은 착오취소로써 대항할 수 없는 제3자의 범위에 속한다.\n⑤ 수익의 의사표시를 한 丙은 乙에게 직접 그 이행을 청구할 수 있다.","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",10,0],[30,2019,11,67,1,"민법총칙","법률행위(반사회·불공정)","박스형(모두고르기), 판례","계약해제 시 보호되는 제3자에 해당하지 않는 자를 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 계약해제 전 그 계약상의 채권을 양수하고 이를 피보전권리로 하여 처분금지가처분결정을 받은 채권자\nㄴ. 매매계약에 의하여 매수인 명의로 이전등기 된 부동산을 계약해제 전에 가압류 집행한 자\nㄷ. 계약해제 전 그 계약상의 채권을 압류한 자\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",11,0],[30,2019,11,68,1,"계약법","해제·해지","판례, 틀린것 고르기","합의해제ㆍ해지에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 계약을 합의해제할 때에 원상회복에 관하여 반드시 약정해야 하는 것은 아니다.\n② 계약이 합의해제된 경우, 다른 사정이 없는 한 채무불이행으로 인한 손해배상을 청구할 수 없다.\n③ 합의해지로 인하여 반환할 금전에 대해서는 특약이 없더라도 그 받은 날로부터 이자를 가산해야 한다.\n④ 계약의 합의해제에 관한 청약에 대하여 상대방이 변경을 가하여 승낙한 때에는 그 청약은 효력을 잃는다.\n⑤ 합의해제의 경우에도 법정해제의 경우와 마찬가지로 제 3자의 권리를 해하지 못한다.","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",11,0],[30,2019,11,69,1,"계약법","매매(계약금·담보책임·환매)","판례, 틀린것 고르기","매매계약에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 매매계약은 요물계약이다.\n② 매매계약은 유상ㆍ쌍무계약이다.\n③ 매도인의 담보책임은 무과실책임이다.\n④ 타인의 권리도 매매의 대상이 될 수 있다.\n⑤ 매매계약에 관한 비용은 특별한 사정이 없는 한 당사자 쌍방이 균분하여 부담한다.","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",11,0],[30,2019,11,70,1,"계약법","매매(계약금·담보책임·환매)","판례, 틀린것 고르기","甲은 그 소유의 X토지에 대하여 乙과 매매계약을 체결하였다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① X토지가 인도되지 않고 대금도 완제되지 않은 경우, 특별한 사정이 없는 한 乙은 인도의무의 지체로 인한 손해배상을 청구할 수 없다.\n② 乙이 대금지급을 거절할 정당한 사유가 있는 경우, X토지를 미리 인도받았더라도 그 대금에 대한 이자를 지급할 의무는 없다.\n③ X토지가 인도되지 않았다면, 특별한 사정이 없는 한 乙 이 잔대금지급을 지체하여도 甲은 잔대금의 이자상당액의 손해배상청구를 할 수 없다. 2019년 제30회 공인중개사\n④ X토지를 아직 인도받지 못한 乙이 미리 소유권이전등기를 경료받았다고 하여도 매매대금을 완제하지 않은이상 X토지에서 발생하는 과실은 甲에게 귀속된다.\n⑤ X토지가 인도되지 않았다면 乙이 대금을 완제하더라도 특별한 사정이 없는 한 X토지에서 발생하는 과실은 甲 에게 귀속된다.","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",11,0],[30,2019,11,71,1,"계약법","동시이행·위험부담","판례, 틀린것 고르기","위험부담에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 후발적 불능이 당사자 쌍방에게 책임없는 사유로 생긴 때에는 위험부담의 문제가 발생한다.\n② 편무계약의 경우 원칙적으로 위험부담의 법리가 적용되지 않는다.\n③ 당사자 일방이 대상청구권을 행사하려면 상대방에 대하여 반대급부를 이행할 의무가 있다.\n④ 당사자 쌍방의 귀책사유 없는 이행불능으로 매매계약이 종료된 경우, 매도인은 이미 지급받은 계약금을 반환하지 않아도 된다.\n⑤ 우리 민법은 채무자위험부담주의를 원칙으로 한다.","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",11,0],[30,2019,11,72,1,"계약법","매매(계약금·담보책임·환매)","판례, 틀린것 고르기","부동산매매에서 환매특약을 한 경우에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 매매등기와 환매특약등기가 경료된 이후, 그 부동산 매수인은 그로부터 다시 매수한 제3자에 대하여 환매특약의 등기사실을 들어 소유권이전등기절차 이행을 거절할 수 없다.\n② 환매기간을 정한 때에는 다시 이를 연장하지 못한다.\n③ 매도인이 환매기간 내에 환매의 의사표시를 하면 그는 그 환매에 의한 권리취득의 등기를 하지 않아도 그 부동산을 가압류 집행한 자에 대하여 권리취득을 주장할 수 있다.\n④ 환매기간에 관한 별도의 약정이 없으면 그 기간은 5년이다.\n⑤ 환매특약은 매매계약과 동시에 하여야 한다.","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",11,0],[30,2019,11,73,1,"민법총칙","법률행위(반사회·불공정)","박스형(모두고르기)","건물전세권자와 건물임차권자 모두에게 인정될 수 있는 권리를 모두 고른 것은?\nㄱ. 유익비상환청구권\nㄴ. 부속물매수청구권\nㄷ. 전세금 또는 차임의 증감청구권\n① ㄷ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",11,0],[30,2019,11,74,1,"계약법","임대차(민법)","판례, 옳은것 고르기","임차인 甲이 임대인 乙에게 지상물매수청구권을 행사하는 경우에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 甲의 매수청구가 유효하려면 乙의 승낙을 요한다.\n② 건축허가를 받은 건물이 아니라면 甲은 매수청구를 하지 못한다.\n③ 甲 소유 건물이 乙이 임대한 토지와 제3자 소유의 토지 위에 걸쳐서 건립된 경우, 甲은 건물 전체에 대하여 매수청구를 할 수 있다.\n④ 임대차가 甲의 채무불이행 때문에 기간 만료 전에 종료 되었다면, 甲은 매수청구를 할 수 없다.\n⑤ 甲은 매수청구권의 행사에 앞서 임대차계약의 갱신을 청구할 수 없다.","4","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",12,0],[30,2019,11,75,1,"계약법","임대차(민법)","판례, 틀린것 고르기","임차인의 부속물매수청구권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 토지 내지 건물의 임차인에게 인정된다.\n② 임대인으로부터 매수한 물건을 부속한 경우에도 인정된다.\n③ 적법한 전차인에게도 인정된다.\n④ 이를 인정하지 않는 약정으로 임차인에게 불리한 것은 그 효력이 없다.\n⑤ 오로지 임차인의 특수목적을 위해 부속된 물건은 매수청구의 대상이 아니다.","1","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",12,0],[30,2019,11,76,1,"계약법","임대차(민법)","틀린것 고르기","甲이 그 소유의 X주택에 거주하려는 乙과 존속기간 1년의 임대차계약을 체결한 경우에 관한 설명으로 틀린 것은?\n① 乙은 2년의 임대차 존속기간을 주장할 수 있다.\n② 乙은 1년의 존속기간이 유효함을 주장할 수 있다.\n③ 乙이 2기의 차임액에 달하도록 차임을 연체한 경우, 묵시적 갱신이 인정되지 아니한다.\n④ 임대차계약이 묵시적으로 갱신된 경우, 乙은 언제든지 甲에게 계약해지를 통지할 수 있다.\n⑤ X주택의 경매로 인한 환가대금에서 乙이 보증금을 우 선변제받기 위해서 X주택을 양수인에게 인도할 필요가 없다.","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",12,0],[30,2019,11,77,1,"민사특별법","상가건물임대차보호법","옳은것 고르기","상가건물 임대차보호법에 관한 설명으로 옳은 것은?\n① 임대차계약을 체결하려는 자는 임대인의 동의 없이도 관할 세무서장에게 해당 상가건물의 임대차에 관한 정보제공을 요구할 수 있다.\n② 임차인이 임차한 건물을 중대한 과실로 전부 파손한 경우, 임대인은 권리금회수의 기회를 보장할 필요가 없다.\n③ 임차인은 임대인에게 계약갱신을 요구할 수 있으나 전체 임대차기간이 7년을 초과해서는 안된다.\n④ 임대차가 종료한 후 보증금이 반환되지 않은 때에는 임차인은 관할 세무서에 임차권등기명령을 신청할 수 있다.\n⑤ 임대차계약이 묵시적으로 갱신된 경우, 임차인의 계약 해지의 통고가 있으면 즉시 해지의 효력이 발생한다. 2019년 제30회 공인중개사","2","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",12,0],[30,2019,11,78,1,"민사특별법","가등기담보법","판례, 옳은것 고르기","가등기담보 등에 관한 법률의 설명으로 옳은 것은?\n(다툼이 있으면 판례에 따름)\n① 가등기가 담보가등기인지, 청구권보전을 위한 가등기인 지의 여부는 등기부상 표시를 보고 결정한다.\n② 채권자가 담보권실행을 통지함에 있어서, 청산금이 없다고 인정되면 통지의 상대방에게 그 뜻을 통지하지 않아도 된다.\n③ 청산금은 담보권실행의 통지 당시 담보목적부동산의 가 액에서 피담보채권액을 뺀 금액이며, 그 부동산에 선순위담보권이 있으면 위 피담보채권액에 선순위담보로 담보한 채권액을 포함시킨다.\n④ 통지한 청산금액이 객관적으로 정확하게 계산된 액수와 맞지 않으면, 채권자는 정확하게 계산된 금액을 다시 통지해야 한다.\n⑤ 채권자가 채무자에게 담보권실행을 통지하고 난 후부터는 담보목적물에 대한 과실수취권은 채권자에게 귀속한다.","3","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",12,0],[30,2019,11,79,1,"민사특별법","집합건물법","틀린것 고르기","집합건물의 소유 및 관리에 관한 법률의 설명으로 틀린 것은?\n① 규약 및 관리단집회의 결의는 구분소유자의 특별승계인에 대하여도 효력이 있다.\n② 구분소유건물의 공용부분에 관한 물권의 득실변경은 등기가 필요하지 않다.\n③ 관리인은 구분소유자가 아니더라도 무방하다.\n④ 재건축 결의는 구분소유자 및 의결권의 각 5분의 4 이상의 결의에 의한다.\n⑤ 재건축 결의 후 재건축 참가 여부를 서면으로 촉구받은 재건축반대자가 법정기간 내에 회답하지 않으면 재건축에 참가하겠다는 회답을 한 것으로 본다.","5","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",12,0],[30,2019,11,80,1,"민사특별법","부동산실명법(명의신탁)","판례, 틀린것 고르기","X부동산을 매수하고자 하는 甲은 乙과 명의신탁약정을 하고 乙명의로 소유권이전등기를 하기로 하였다. 그 후 甲은 丙에게서 그 소유의 X부동산을 매수하고 대금을 지급하였으며, 丙은 甲의 부탁에 따라 乙 앞으로 이전등기를 해 주었다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 甲과 乙 사이의 명의신탁약정은 무효이다.\n② 甲은 乙을 상대로 부당이득반환을 원인으로 한 소유권이전등기를 구할 수 있다.\n③ 甲은 丙을 상대로 소유권이전등기청구를 할 수 있다.\n④ 甲은 丙을 대위하여 乙명의 등기의 말소를 구할 수 있다.\n⑤ 甲과 乙 간의 명의신탁약정 사실을 알고 있는 丁이 乙 로부터 X부동산을 매수하고 이전등기를 마쳤다면, 丁은 특별한 사정이 없는 한 그 소유권을 취득한다.","전항정답","12WUbep_jd8B_weBW8iT0e05uu3aAZ6jf",12,0],[30,2019,21,1,2,"공인중개사법","거래정보망·기타","판례, 틀린것 고르기","공인중개사법령에 관한 내용으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 개업공인중개사에 소속된 공인중개사로서 중개업무를 수행하거나 개업공인중개사의 중개업무를 보조하는 자는 소속공인중개사이다.\n② 개업공인중개사인 법인의 사원으로서 중개업무를 수행하는 공인중개사는 소속공인중개사이다.\n③ 무등록 중개업자에게 중개를 의뢰한 거래당사자는 무등록 중개업자의 중개행위에 대하여 무등록 중개업자와 공동정범으로 처벌된다.\n④ 개업공인중개사는 다른 개업공인중개사의 중개보조원 또는 개업공인중개사인 법인의 사원ㆍ임원이 될 수 없다.\n⑤ 거래당사자간 지역권의 설정과 취득을 알선하는 행위는 중개에 해당한다.","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",1,0],[30,2019,21,2,2,"공인중개사법","중개사무소 개설등록·결격사유","","공인중개사법령상 중개사무소 개설등록의 결격사유에 해당하지 않는 자는?\n① 공인중개사법을 위반하여 200만원의 벌금형의 선고를 받고 3년이 경과되지 아니한 자\n② 금고 이상의 실형의 선고를 받고 그 집행이 종료되거나 집행이 면제된 날부터 3년이 경과되지 아니한 자\n③ 공인중개사의 자격이 취소된 후 3년이 경과되지 아니한 자\n④ 업무정지처분을 받은 개업공인중개사인 법인의 업무정지의 사유가 발생한 당시의 사원 또는 임원이었던 자로서 당해 개업공인중개사에 대한 업무정지기간이 경과되지 아니한 자\n⑤ 공인중개사의 자격이 정지된 자로서 자격정지기간 중에 있는 자","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",1,0],[30,2019,21,3,2,"공인중개사법","정책심의위원회·자격·시험","옳은것 고르기","공인중개사법령상 공인중개사 자격시험 등에 관한 설명으로 옳은 것은?\n① 국토교통부장관이 직접 시험을 시행하려는 경우에는 미리 공인중개사 정책심의위원회의 의결을 거치지 않아도 된다.\n② 공인중개사자격증의 재교부를 신청하는 자는 재교부신 청서를 국토교통부장관에게 제출해야 한다.\n③ 국토교통부장관은 공인중개사시험의 합격자에게 공인중개사자격증을 교부해야 한다.\n④ 시험시행기관장은 시험에서 부정한 행위를 한 응시자에 대하여는 그 시험을 무효로 하고, 그 처분이 있은 날부터 5년간 시험응시자격을 정지한다.\n⑤ 시험시행기관장은 시험을 시행하고자 하는 때에는 시험 시행에 관한 개략적인 사항을 전년도 12월 31일까지 관보 및 일간신문에 공고해야 한다. 2019년 제30회 공인중개","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",1,0],[30,2019,21,4,2,"공인중개사법","중개대상물·용어","박스형(모두고르기), 틀린것 고르기","공인중개사법령상 중개대상물에 해당하지 않는 것을 모두 고른 것은?\nㄱ. 미채굴광물\nㄴ. 온천수\nㄷ. 금전채권\nㄹ. 점유\n① ㄱ, ㄴ ② ㄷ, ㄹ ③ ㄱ, ㄴ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",1,0],[30,2019,21,5,2,"공인중개사법","중개사무소·분사무소·인장·게시","틀린것 고르기","공인중개사법령상 중개사무소의 설치 등에 관한 설명으로 틀린 것은?\n① 개업공인중개사는 그 등록관청의 관할구역안에 1개의 중개사무소만을 둘 수 있다.\n② 개업공인중개사는 천막 그 밖에 이동이 용이한 임시 중개시설물을 설치하여서는 아니된다.\n③ 법인이 아닌 개업공인중개사는 분사무소를 둘 수 없다.\n④ 개업공인중개사는 등록관청의 관할구역 외의 지역에 있는 중개대상물을 중개할 수 없다.\n⑤ 법인인 개업공인중개사는 등록관청에 신고하고 그 관할구역 외의 지역에 분사무소를 둘 수 있다.","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",1,0],[30,2019,21,6,2,"공인중개사법","교육·협회·공제","옳은것 고르기","공인중개사법령상 “공인중개사협회”(이하 ‘협회’라 함) 에 관한 설명으로 옳은 것은?\n① 협회는 영리사업으로서 회원간의 상호부조를 목적으로 공제사업을 할 수 있다.\n② 협회는 총회의 의결내용을 지체 없이 등록관청에게 보고하고 등기하여야 한다.\n③ 협회가 그 지부 또는 지회를 설치한 때에는 그 지부는 시ㆍ도지사에게, 지회는 등록관청에 신고하여야 한다.\n④ 협회는 개업공인중개사에 대한 행정제재처분의 부과와 집행의 업무를 할 수 있다.\n⑤ 협회는 부동산 정보제공에 관한 업무를 직접 수행할 수 없다.","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",1,0],[30,2019,21,7,2,"공인중개사법","중개사무소·분사무소·인장·게시","틀린것 고르기","공인중개사법령상 인장등록 등에 관한 설명으로 틀린 것은?\n① 법인인 개업공인중개사의 인장등록은 상업등기규칙에 따른 인감증명서의 제출로 갈음한다.\n② 소속공인중개사가 등록하지 아니한 인장을 중개행위에 사용한 경우, 등록관청은 1년의 범위 안에서 업무의 정지를 명할 수 있다.\n③ 인장의 등록은 중개사무소 개설등록신청과 같이 할 수 있다.\n④ 소속공인중개사의 인장등록은 소속공인중개사에 대한 고용신고와 같이 할 수 있다.\n⑤ 개업공인중개사가 등록한 인장을 변경한 경우, 변경일부터 7일 이내에 그 변경된 인장을 등록관청에 등록하여야 한다.","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",1,0],[30,2019,21,8,2,"공인중개사법","정책심의위원회·자격·시험","틀린것 고르기","공인중개사법령상 “공인중개사 정책심의위원회”(이하 ‘심의위원회’라 함)에 관한 설명으로 틀린 것은?\n① 국토교통부에 심의위원회를 둘 수 있다.\n② 심의위원회는 위원장 1명을 포함하여 7명 이상 11명 이내의 위원으로 구성한다.\n③ 심의위원회의 위원이 해당 안건에 대하여 자문을 한 경우 심의위원회의 심의ㆍ의결에서 제척된다.\n④ 심의위원회의 위원장이 부득이한 사유로 직무를 수행할 수 없을 때에는 부위원장이 그 직무를 대행한다.\n⑤ 심의위원회의 회의는 재적위원 과반수의 출석으로 개의\n(開議)하고, 출석위원 과반수의 찬성으로 의결한다.","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",2,0],[30,2019,21,9,2,"공인중개사법","법인 겸업·업무범위","박스형(모두고르기)","공인중개사법령상 법인인 개업공인중개사가 겸업할 수 있는 것을 모두 고른 것은?(단, 다른 법률의 규정은 고려하지 않음)\nㄱ. 상업용 건축물 및 주택의 분양대행\nㄴ. 부동산의 이용ㆍ개발 및 거래에 관한 상담\nㄷ. 개업공인중개사를 대상으로 한 중개업의 경영기법 및 경영정보의 제공\nㄹ. 중개의뢰인의 의뢰에 따른 도배ㆍ이사업체의 소개 등 주거이전에 부수되는 용역의 알선\n① ㄱ, ㄴ ② ㄱ, ㄷ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",2,0],[30,2019,21,10,2,"공인중개사법","고용인(소속공인중개사·중개보조원)","판례, 틀린것 고르기","공인중개사법령상 개업공인중개사의 고용인에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 중개보조원의 업무상 행위는 그를 고용한 개업공인중개사의 행위로 본다.\n② 개업공인중개사는 중개보조원과의 고용관계가 종료된 때에는 고용관계가 종료된 날부터 14일 이내에 등록관청에 신고하여야 한다.\n③ 중개보조원이 중개업무와 관련된 행위를 함에 있어서 과실로 거래당사자에게 손해를 입힌 경우, 그를 고용한 개업공인중개사 뿐만 아니라 중개보조원도 손해배상책임이 있다.\n④ 개업공인중개사가 소속공인중개사를 고용한 경우에는 개업공인중개사 및 소속공인중개사의 공인중개사자격증 원본을 중개사무소에 게시하여야 한다.\n⑤ 중개보조원의 고용신고는 전자문서에 의해서도 할 수 있다.","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",2,0],[30,2019,21,11,2,"공인중개사법","중개사무소·분사무소·인장·게시","박스형(모두고르기)","공인중개사법령상 개업공인중개사가 의뢰받은 중개대상물에 대하여 표시ㆍ광고를 하려는 경우 ‘중개사무소, 개업공인중개사에 관한 사항’으로서 명시해야 하는 것을 모두 고른 것은?\nㄱ. 중개사무소의 연락처\nㄴ. 중개사무소의 명칭\nㄷ. 소속공인중개사의 성명\nㄹ. 개업공인중개사의 성명\n① ㄱ, ㄴ ② ㄴ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄱ, ㄷ, ㄹ 2019년 제30회 공인중개","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",2,0],[30,2019,21,12,2,"공인중개사법","확인·설명(서)","판례, 옳은것 고르기","공인중개사법령상 중개대상물의 확인ㆍ설명에 관한 내용으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 개업공인중개사는 선량한 관리자의 주의로 중개대상물의 권리관계 등을 조사ㆍ확인하여 중개의뢰인에게 설명할 의무가 있다.\n② 2명의 개업공인중개사가 공동중개한 경우 중개대상물확인ㆍ설명서에는 공동중개한 개업공인중개사 중 1인만서명ㆍ날인하면 된다.\n③ 개업공인중개사는 중개대상물에 대한 확인ㆍ설명을 중개가 완성된 후 해야 한다.\n④ 중개보조원은 중개의뢰인에게 중개대상물의 확인ㆍ설명 의무를 진다.\n⑤ 개업공인중개사는 중개대상물확인ㆍ설명서를 작성하여 거래당사자에게 교부하고 그 원본을 5년간 보존하여야 한다.","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",2,0],[30,2019,21,13,2,"공인중개사법","거래정보망·기타","틀린것 고르기","공인중개사법령상 부동산거래정보망의 지정 및 이용에 관한 설명으로 틀린 것은?\n① 국토교통부장관은 부동산거래정보망을 설치ㆍ운영할 자를 지정할 수 있다.\n② 부동산거래정보망을 설치ㆍ운영할 자로 지정을 받을 수 있는 자는 전기통신사업법의 규정에 의한 부가통신사업 자로서 국토교통부령이 정하는 요건을 갖춘 자이다.\n③ 거래정보사업자는 지정받은 날부터 3월 이내에 부동산거래정보망의 이용 및 정보제공방법 등에 관한 운영규정을 정하여 국토교통부장관의 승인을 얻어야 한다.\n④ 거래정보사업자가 부동산거래정보망의 이용 및 정보제공방법 등에 관한 운영규정을 변경하고자 하는 경우 국토교통부장관의 승인을 얻어야 한다.\n⑤ 거래정보사업자는 개업공인중개사로부터 공개를 의뢰받은 중개대상물의 정보를 개업공인중개사에 따라 차별적으로 공개할 수 있다.","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",2,0],[30,2019,21,14,2,"공인중개사법","금지행위·거래질서","옳은것 고르기","공인중개사법령상 금지행위에 관한 설명으로 옳은 것은?\n① 법인인 개업공인중개사의 사원이 중개대상물의 매매를 업으로 하는 것은 금지되지 않는다.\n② 개업공인중개사가 거래당사자 쌍방을 대리하는 것은 금지되지 않는다.\n③ 개업공인중개사가 중개의뢰인과 직접 거래를 하는 행위는 금지된다.\n④ 법인인 개업공인중개사의 임원이 중개의뢰인과 직접거 래를 하는 것은 금지되지 않는다.\n⑤ 중개보조원이 중개의뢰인과 직접 거래를 하는 것은 금지되지 않는다.","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",2,0],[30,2019,21,15,2,"공인중개사법","휴업·폐업","틀린것 고르기","공인중개사법령상 개업공인중개사의 휴업과 폐업 등에 관한 설명으로 틀린 것은?\n① 부동산중개업휴업신고서의 서식에 있는 ‘개업공인중개사의 종별’란에는 법인, 공인중개사, 법 제7638호 부칙 제6조 제2항에 따른 개업공인중개사가 있다.\n② 개업공인중개사가 부동산중개업폐업신고서를 작성하는 경우에는 폐업기간, 부동산중개업휴업신고서를 작성하는 경우에는 휴업기간을 기재하여야 한다.\n③ 중개사무소의 개설등록 후 업무를 개시하지 않은 개업공인중개사라도 3월을 초과하는 휴업을 하고자 하는 때에는 부동산중개업휴업신고서에 중개사무소등록증을 첨부하여 등록관청에 미리 신고하여야 한다.\n④ 개업공인중개사가 등록관청에 폐업사실을 신고한 경우에는 지체없이 사무소의 간판을 철거하여야 한다.\n⑤ 개업공인중개사가 취학을 하는 경우 6월을 초과하여 휴업을 할 수 있다.","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",3,0],[30,2019,21,16,2,"공인중개사법","거래정보망·기타","틀린것 고르기","공인중개사법령상 계약금등의 반환채무이행의 보장 등에 관한 설명으로 틀린 것은?\n① 개업공인중개사는 거래의 안전을 보장하기 위하여 필요하다고 인정하는 경우, 계약금등을 예치하도록 거래당사자에게 권고할 수 있다.\n② 예치대상은 계약금ㆍ중도금 또는 잔금이다.\n③ 보험업법에 따른 보험회사는 계약금등의 예치명의자가 될 수 있다.\n④ 개업공인중개사는 거래당사자에게 공인중개사법에 따른 공제사업을 하는 자의 명의로 계약금등을 예치하도록 권고할 수 없다.\n⑤ 개업공인중개사는 계약금등을 자기 명의로 금융기관 등에 예치하는 경우 자기 소유의 예치금과 분리하여 관리될 수 있도록 하여야 한다.","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",3,0],[30,2019,21,17,2,"공인중개사법","중개계약(일반·전속)","","중개의뢰인 甲은 자신 소유의 X부동산에 대한 임대차계약을 위해 개업공인중개사 乙과 전속중개계약을 체결하였다. X부동산에 기존 임차인 丙, 저당권자 丁이 있는 경우 乙이 부동산거래정보망 또는 일간신문에 공개해야만 하는 중개대상물에 관한 정보를 모두 고른 것은?(단, 중개의뢰인이 비공개 요청을 하지 않음)\nㄱ. 丙의 성명\nㄴ. 丁의 주소\nㄷ. X부동산의 공시지가\nㄹ. X부동산에 대한 일조(日照)ㆍ소음ㆍ진동 등 환경조건\n① ㄹ ② ㄱ, ㄴ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ 2019년 제30회 공인중개","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",3,0],[30,2019,21,18,2,"공인중개사법","중개사무소 개설등록·결격사유","박스형(모두고르기)","공인중개사법령상 조례가 정하는 바에 따라 수수료를 납부해야 하는 경우를 모두 고른 것은?\nㄱ. 분사무소설치신고필증의 재교부 신청\nㄴ. 국토교통부장관이 시행하는 공인중개사 자격시험 응시\nㄷ. 중개사무소의 개설등록 신청\nㄹ. 분사무소설치의 신고\n① ㄱ, ㄴ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",3,0],[30,2019,21,19,2,"공인중개사법","중개계약(일반·전속)","박스형(모두고르기)","무주택자인 甲이 주택을 물색하여 매수하기 위해 개업공인중개사인 乙과 일반중개계약을 체결하고자 한\n다. 이 경우 공인중개사법령상 표준서식인 일반중개계약서에 기재하는 항목을 모두 고른 것은?\nㄱ. 소유자 및 등기명의인\nㄴ. 희망 지역\nㄷ. 취득 희망가격\nㄹ. 거래규제 및 공법상 제한사항\n① ㄷ ② ㄱ, ㄴ ③ ㄴ, ㄷ\n④ ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",3,0],[30,2019,21,20,2,"공인중개사법","중개사무소 개설등록·결격사유","틀린것 고르기","공인중개사법령상 중개사무소 개설등록의 절대적 취소사유가 아닌 것은?\n① 개업공인중개사인 법인이 해산한 경우\n② 자격정지처분을 받은 소속공인중개사로 하여금 자격정지기간 중에 중개업무를 하게 한 경우\n③ 거짓 그 밖의 부정한 방법으로 중개사무소의 개설등록을 한 경우\n④ 법인이 아닌 개업공인중개사가 파산선고를 받고 복권되지 아니한 경우\n⑤ 공인중개사법령을 위반하여 2 이상의 중개사무소를 둔 경우","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",3,0],[30,2019,21,21,2,"공인중개사법","교육·협회·공제","빈칸","공인중개사법 시행령 제30조(협회의 설립)의 내용이다.\n( )에 들어갈 숫자를 올바르게 나열한 것은?\n○ 공인중개사협회를 설립하고자 하는 때에는 발기 인이 작성하여 서명ㆍ날인한 정관에 대하여 회원 ( ㄱ )인 이상이 출석한 창립총회에서 출석한 회원 과반수의 동의를 얻어 국토교통부장관의 설립인가를 받아야 한다.\n○ 창립총회에는 서울특별시에서는 ( ㄴ )인 이상, 광역시ㆍ도 및 특별자치도에서는 각각 ( ㄷ )인 이상의 회원이 참여하여야 한다.\n① ㄱ: 300, ㄴ: 50, ㄷ: 20\n② ㄱ: 300, ㄴ: 100, ㄷ: 50\n③ ㄱ: 600, ㄴ: 50, ㄷ: 20\n④ ㄱ: 600, ㄴ: 100, ㄷ: 20\n⑤ ㄱ: 800, ㄴ: 50, ㄷ: 50","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",3,0],[30,2019,21,22,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","틀린것 고르기","공인중개사법령상 중개업무를 수행하는 소속공인중개사의 자격정지사유에 해당하지 않는 것은?\n① 고객을 위하여 거래내용에 부합하는 동일한 거래계약서를 4부 작성한 경우\n② 2 이상의 중개사무소에 소속된 경우\n③ 고객의 요청에 의해 거래계약서에 거래금액을 거짓으로 기재한 경우\n④ 권리를 취득하고자 하는 중개의뢰인에게 중개가 완성되기 전까지 등기사항증명서 등 확인ㆍ설명의 근거자료를 제시하지 않은 경우\n⑤ 법인의 분사무소의 책임자가 서명 및 날인 하였기에 당해 중개행위를 한 소속공인중개사가 확인ㆍ설명서에 서명 및 날인을 하지 않은 경우","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",4,0],[30,2019,21,23,2,"공인중개사법","교육·협회·공제","틀린것 고르기","공인중개사법령상 공제사업에 관한 설명으로 틀린 것은?\n① 공인중개사협회는 공제사업을 하고자 하는 때에는 공제 규정을 제정하여 국토교통부장관의 승인을 얻어야 한다.\n② 금융감독원의 원장은 국토교통부장관의 요청이 있는 경우에는 공제사업에 관하여 조사 또는 검사를 할 수 있다.\n③ 공인중개사협회는 책임준비금을 다른 용도로 사용하고자 하는 경우에는 국토교통부장관의 승인을 얻어야 한다.\n④ 책임준비금의 적립비율은 공제사고 발생률 및 공제금 지급액 등을 종합적으로 고려하여 정하되, 공제료 수입액의 100분의 10이상으로 정한다.\n⑤ 공인중개사협회는 회계연도 종료 후 6개월 이내에 매년도의 공제사업 운용실적을 일간신문ㆍ협회보 등을 통하여 공제계약자에게 공시하여야 한다.","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",4,0],[30,2019,21,24,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","옳은것 고르기","공인중개사법령상 공인중개사의 자격취소에 관한 설명으로 옳은 것은?\n① 공인중개사의 자격취소처분은 공인중개사의 현주소지를 관할하는 시장ㆍ군수ㆍ구청장이 행한다.\n② 시ㆍ도지사는 공인중개사의 자격취소처분을 한 때에는 5일 이내에 이를 국토교통부장관에게 보고하고 다른 시ㆍ도지사에게 통지하여야 한다.\n③ 자격 취소사유가 발생한 경우에는 청문을 실시하지 않아도 해당 공인중개사의 자격을 취소할 수 있다.\n④ 공인중개사의 자격이 취소된 자는 공인중개사자격증을 7일 이내에 한국산업인력공단에 반납하여야 한다.\n⑤ 공인중개사 자격이 취소되었으나 공인중개사자격증을 분실 등의 사유로 반납할 수 없는 자는 신규발급절차를 거쳐 발급된 공인중개사자격증을 반납하여야 한다.","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",4,0],[30,2019,21,25,2,"공인중개사법","금지행위·거래질서","","공인중개사법령상 포상금 지급에 관한 설명으로 옳은 것은?\n① 포상금은 1건당 150만원으로 한다.\n② 검사가 신고사건에 대하여 기소유예의 결정을 한 경우에는 포상금을 지급하지 않는다. 2019년 제30회 공인중개\n③ 포상금의 지급에 소요되는 비용 중 시ㆍ도에서 보조할 수 있는 비율은 100분의 50이내로 한다.\n④ 포상금지급신청서를 제출받은 등록관청은 그 사건에 관한 수사기관의 처분내용을 조회한 후 포상금의 지급을 결정하고, 그 결정일부터 1월 이내에 포상금을 지급하여야 한다.\n⑤ 등록관청은 하나의 사건에 대하여 2건 이상의 신고가 접수된 경우, 공동으로 신고한 것이 아니면 포상금을 균등하게 배분하여 지급한다.","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",4,0],[30,2019,21,26,2,"공인중개사법","벌칙·과태료·포상금","","다음 중 공인중개사법령상 과태료를 부과할 경우 과태료의 부과기준에서 정하는 과태료 금액이 가장 큰 경우는?\n① 공제업무의 개선명령을 이행하지 않은 경우\n② 휴업한 중개업의 재개 신고를 하지 않은 경우\n③ 중개사무소의 이전신고를 하지 않은 경우\n④ 중개사무소등록증을 게시하지 않은 경우\n⑤ 휴업기간의 변경 신고를 하지 않은 경우","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",4,0],[30,2019,21,27,2,"부동산거래신고법","외국인 등의 부동산 취득","옳은것 고르기","부동산 거래신고 등에 관한 법령상 외국인등의 부동산 취득 등에 관한 특례에 대한 설명으로 옳은 것은?(단, 헌법과 법률에 따라 체결된 조약의 이행에 필요한 경우는 고려하지 않음)\n① 국제연합의 전문기구가 경매로 대한민국 안의 부동산등을 취득한 때에는 부동산등을 취득한 날부터 3개월 이내에 신고관청에 신고하여야 한다.\n② 외국인등이 부동산 임대차계약을 체결하는 경우 계약체 결일로부터 6개월 이내에 신고관청에 신고하여야 한다.\n③ 특별자치시장은 외국인등이 신고한 부동산등의 취득ㆍ계속보유 신고내용을 매 분기 종료일부터 1개월 이내에 직접 국토교통부장관에게 제출하여야 한다.\n④ 외국인등의 토지거래 허가신청서를 받은 신고관청은 신청서를 받은 날부터 30일 이내에 허가 또는 불허가 처분을 하여야 한다.\n⑤ 외국인등이 법원의 확정판결로 대한민국 안의 부동산등을 취득한 때에는 신고하지 않아도 된다.","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",4,0],[30,2019,21,28,2,"부동산거래신고법","토지거래허가","박스형(모두고르기)","부동산 거래신고 등에 관한 법령상 토지거래계약 불허가처분 토지에 대하여 매수청구를 받은 경우, 매수할 자로 지정될 수 있는 자를 모두 고른 것은?\nㄱ. 지방자치단체\nㄴ. 한국은행법에 따른 한국은행\nㄷ. 지방공기업법에 따른 지방공사\nㄹ. 한국석유공사법에 따른 한국석유공사\nㅁ. 항만공사법에 따른 항만공사\nㅂ. 한국관광공사법에 따른 한국관광공사\n① ㄴ, ㅁ ② ㄱ, ㄹ, ㅂ\n③ ㄴ, ㄷ, ㅁ ④ ㄱ, ㄹ, ㅁ, ㅂ\n⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",4,0],[30,2019,21,29,2,"부동산거래신고법","부동산 거래신고","옳은것 고르기","부동산 거래신고 등에 관한 법령상 신고포상금에 관한 설명으로 옳은 것은?\n① 포상금의 지급에 드는 비용은 국고로 충당한다.\n② 해당 위반행위에 관여한 자가 신고한 경우라도 신고포상금은 지급하여야 한다.\n③ 익명으로 고발하여 고발인을 확인할 수 없는 경우에는 당해 신고포상금은 국고로 환수한다.\n④ 부동산등의 거래가격을 신고하지 않은 자를 수사기관이 적발하기 전에 수사기관에 1건 고발한 경우 1천 5백만원의 신고포상금을 받을 수 있다.\n⑤ 신고관청 또는 허가관청으로부터 포상금 지급 결정을 통보받은 신고인은 포상금을 받으려면 국토교통부령으로 정하는 포상금 지급신청서를 작성하여 신고관청 또는 허가관청에 제출하여야 한다.","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",5,0],[30,2019,21,30,2,"부동산거래신고법","토지거래허가","옳은것 고르기","부동산 거래신고 등에 관한 법령상 이행강제금에 대하여 개업공인중개사가 중개의뢰인에게 설명한 내용으로 옳은 것은?\n① 군수는 최초의 의무이행위반이 있었던 날을 기준으로 1년에 한 번씩 그 이행명령이 이행될 때까지 반복하여 이행강제금을 부과ㆍ징수할 수 있다.\n② 시장은 토지의 이용 의무기간이 지난 후에도 이행명령 위반에 대해서는 이행강제금을 반복하여 부과할 수 있다.\n③ 시장ㆍ군수 또는 구청장은 이행명령을 받은 자가 그 명령을 이행하는 경우라도 명령을 이행하기 전에 이미 부과된 이행강제금은 징수하여야 한다.\n④ 토지거래계약허가를 받아 토지를 취득한 자가 직접 이용하지 아니하고 임대한 경우에는 토지 취득가액의 100 분의 20에 상당하는 금액을 이행강제금으로 부과한다.\n⑤ 이행강제금 부과처분을 받은 자가 국토교통부장관에게 이의를 제기하려는 경우에는 부과처분을 고지받은 날부터 14일 이내에 하여야 한다.","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",5,0],[30,2019,21,31,2,"공인중개사법","거래정보망·기타","박스형(모두고르기), 판례, 옳은것 고르기","X대지에 Y건물이 있고, X대지와 Y건물은 동일인의 소유이다. 개업공인중개사가 Y건물에 대해서만 매매를 중개하면서 중개의뢰인에게 설명한 내용으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. Y건물에 대한 철거특약이 없는 경우, Y건물이 건물로서의 요건을 갖추었다면 무허가건물이 라도 관습상의 법정지상권이 인정된다.\nㄴ. 관습상의 법정지상권이 성립한 후 Y건물을 증축하더라도 구 건물을 기준으로 관습상의 법정지상권은 인정된다.\nㄷ. Y건물 취득 시 Y건물을 위해 X대지에 대한 임대차계약을 체결하더라도 관습상의 법정지상권을 포기한 것은 아니다.\nㄹ. 대지소유자가 Y건물만을 매도하여 관습상의 법정지상권이 인정되면 Y건물 매수인은 대지 소유자에게 지료를 지급할 의무가 없다.\n① ㄱ, ㄴ ② ㄴ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄱ, ㄷ, ㄹ 2019년 제30회 공인중개","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",5,0],[30,2019,21,32,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기","부동산 거래신고 등에 관한 법령상 부동산거래계약 신고 내용의 정정신청사항이 아닌 것은?\n① 거래대상 건축물의 종류\n② 개업공인중개사의 성명․주소\n③ 거래대상 부동산의 면적\n④ 거래 지분 비율\n⑤ 거래당사자의 전화번호","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",5,0],[30,2019,21,33,2,"중개실무","경매·매수신청대리","옳은것 고르기","법원은 X부동산에 대하여 담보권 실행을 위한 경매절차를 개시하는 결정을 내렸고, 최저매각가격을 1억원으로 정하였다. 기일입찰로 진행되는 이 경매에서 매수신청을 하고자 하는 중개의뢰인 甲에게 개업공인중개사가 설명한 내용으로 옳은 것은?\n① 甲이 1억 2천만원에 매수신청을 하려는 경우, 법원에서 달리 정함이 없으면 1천 2백만원을 보증금액으로 제공하여야 한다.\n② 최고가매수신고를 한 사람이 2명인 때에는 법원은 그 2명 뿐만 아니라 모든 사람에게 다시 입찰하게 하여야 한다.\n③ 甲이 다른 사람과 동일한 금액으로 최고가매수신고를 하여 다시 입찰하는 경우, 전의 입찰가격에 못미치는 가격으로 입찰하여 매수할 수 있다.\n④ 1억 5천만원의 최고가매수신고인이 있는 경우, 법원에서 보증금액을 달리 정하지 않았다면 甲이 차순위매수신고를 하기 위해서는 신고액이 1억 4천만원을 넘어야 한다.\n⑤ 甲이 차순위매수신고인인 경우 매각기일이 종결되면 즉시 매수신청의 보증을 돌려줄 것을 신청할 수 있다.","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",5,0],[30,2019,21,34,2,"중개실무","주택·상가 임대차 실무","계산","개업공인중개사가 선순위 저당권이 설정되어 있는 서울시 소재 상가건물(상가건물 임대차보호법이 적용됨)에 대해 임대차기간 2018. 10. 1.부터 1년, 보증금 5천만원, 월차임 100만원으로 임대차를 중개하면서 임대인 甲과 임차인 乙에게 설명한 내용으로 옳은 것은?\n① 乙의 연체차임액이 200만원에 이르는 경우 甲은 계약을 해지할 수 있다.\n② 차임 또는 보증금의 감액이 있은 후 1년 이내에는 다시 감액을 하지 못한다.\n③ 甲이 2019. 4. 1.부터 2019. 8. 31. 사이에 乙에게 갱신거절 또는 조건 변경의 통지를 하지 않은 경우, 2019. 10.\n1. 임대차계약이 해지된 것으로 본다.\n④ 상가건물에 대한 경매개시 결정등기 전에 乙이 건물의 인도와 부가가치세법에 따른 사업자등록을 신청한 때에는, 보증금 5천만원을 선순위 저당권자보다 우선변제 받을 수 있다.\n⑤ 乙이 임대차의 등기 및 사업자등록을 마치지 못한 상태에서 2019. 1. 5. 甲이 상가건물을 丙에게 매도한 경우, 丙의 상가건물 인도청구에 대하여 乙은 대항할 수 없다.","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",5,0],[30,2019,21,35,2,"공인중개사법","거래정보망·기타","판례, 틀린것 고르기","개업공인중개사가 묘소가 설치되어 있는 임야를 중개하면서 중개의뢰인에게 설명한 내용으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 분묘가 1995년에 설치되었다 하더라도 장사 등에 관한 법률이 2001년에 시행되었기 때문에 분묘기지권을 시효취득할 수 없다.\n② 암장되어 있어 객관적으로 인식할 수 있는 외형을 갖추고 있지 않은 묘소에는 분묘기지권이 인정되지 않는다.\n③ 아직 사망하지 않은 사람을 위한 장래의 묘소인 경우 분묘기지권이 인정되지 않는다.\n④ 분묘기지권이 시효취득된 경우 특별한 사정이 없는 한 시효취득자는 지료를 지급할 필요가 없다.\n⑤ 분묘기지권의 효력이 미치는 지역의 범위 내라고 할지 라도 기존의 분묘 외에 새로운 분묘를 신설할 권능은 포함되지 않는다.","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",6,0],[30,2019,21,36,2,"중개실무","명의신탁·실무 기타","박스형(모두고르기), 판례, 옳은것 고르기","甲은 乙과 乙 소유의 X부동산의 매매계약을 체결하고, 친구 丙과의 명의신탁약정에 따라 乙로부터 바로 丙 명의로 소유권이전등기를 하였다. 이와 관련하여 개업공인중개사가 甲과 丙에게 설명한 내용으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 甲과 丙간의 약정이 조세포탈, 강제집행의 면탈 또는 법령상 제한의 회피를 목적으로 하지 않은 경우 명의신탁약정 및 그 등기는 유효하다.\nㄴ. 丙이 X부동산을 제3자에게 처분한 경우 丙은 甲과의 관계에서 횡령죄가 성립하지 않는다.\nㄷ. 甲과 乙 사이의 매매계약은 유효하므로 甲은 乙 을 상대로 소유권이전등기를 청구할 수 있다.\nㄹ. 丙이 소유권을 취득하고 甲은 丙에게 대금 상당의 부당이득반환청구권을 행사할 수 있다.\n① ㄱ, ㄷ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄴ, ㄷ, ㄹ","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",6,0],[30,2019,21,37,2,"공인중개사법","거래정보망·기타","판례, 옳은것 고르기","甲 소유의 X주택에 대하여 임차인 乙이 주택의 인도를 받고 2019. 6. 3. 10:00에 확정일자를 받으면서 주민등록을 마쳤다. 그런데 甲의 채권자 丙이 같은 날 16:00에, 다른 채권자 丁은 다음날 16:00에 X주택에 대해 근저당권설정등기를 마쳤다. 임차인 乙에게 개업공인중개사가 설명한 내용으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 丁이 근저당권을 실행하여 X주택이 경매로 매각된 경우, 乙은 매수인에 대하여 임차권으로 대항할 수 있다.\n② 丙 또는 丁 누구든 근저당권을 실행하여 X주택이 경매로 매각된 경우, 매각으로 인하여 乙의 임차권은 소멸한다.\n③ 乙은 X주택의 경매시 경매법원에 배당요구를 하면 丙 과 丁보다 우선하여 보증금 전액을 배당받을 수 있다.\n④ X주택이 경매로 매각된 후 乙이 우선변제권 행사로 보증금을 반환받기 위해서는 X주택을 먼저 법원에 인도 하여야 한다. 2019년 제30회 공인중개\n⑤ X주택에 대해 乙이 집행권원을 얻어 강제경매를 신청하였더라도 우선변제권을 인정받기 위해서는 배당요구의 종기까지 별도로 배당요구를 하여야 한다.","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",6,0],[30,2019,21,38,2,"중개실무","명의신탁·실무 기타","옳은것 고르기","부동산 전자계약에 관한 설명으로 옳은 것은?\n① 시ㆍ도지사는 부동산거래의 계약ㆍ신고ㆍ허가ㆍ관리 등의 업무와 관련된 정보체계를 구축ㆍ운영하여야 한다.\n② 부동산 거래계약의 신고를 하는 경우 전자인증의 방법으로 신분을 증명할 수 없다.\n③ 정보처리시스템을 이용하여 주택임대차계약을 체결하였 더라도 해당 주택의 임차인은 정보처리시스템을 통하여 전자계약증서에 확정일자 부여를 신청할 수 없다.\n④ 개업공인중개사가 부동산거래계약시스템을 통하여 부동산거래계약을 체결한 경우 부동산거래계약이 체결된 때에 부동산거래계약 신고서를 제출한 것으로 본다.\n⑤ 거래계약서 작성 시 확인ㆍ설명사항이 전자문서 및 전자거래 기본법에 따른 공인전자문서센터에 보관된 경우라도 개업공인중개사는 확인ㆍ설명사항을 서면으로 작성하여 보존하여야 한다.","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",6,0],[30,2019,21,39,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기","부동산 거래신고 등에 관한 법령상 부동산 거래신고의 대상이 되는 계약이 아닌 것은?\n① 주택법에 따라 공급된 주택의 매매계약\n② 택지개발촉진법에 따라 공급된 토지의 임대차계약\n③ 도시개발법에 따른 부동산에 대한 공급계약\n④ 체육시설의 설치ㆍ이용에 관한 법률에 따라 등록된 시설이 있는 건물의 매매계약\n⑤ 도시 및 주거환경정비법에 따른 관리처분계약의 인가로 취득한 입주자로 선정된 지위의 매매계약","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",6,0],[30,2019,21,40,2,"부동산거래신고법","부동산 거래신고","판례, 옳은것 고르기","부동산 거래신고 등에 관한 법령상 부동산 거래신고에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 개업공인중개사가 거래계약서를 작성ㆍ교부한 경우 거래당사자는 60일 이내에 부동산거래신고를 하여야 한다.\n② 소속공인중개사 및 중개보조원은 부동산거래신고를 할 수 있다.\n③ 지방공기업법에 따른 지방공사와 개인이 매매계약을 체결한 경우 양 당사자는 공동으로 신고하여야 한다.\n④ 거래대상 부동산의 공법상 거래규제 및 이용제한에 관한 사항은 부동산거래계약 신고서의 기재사항이다.\n⑤ 매매대상 토지 중 공장부지로 편입되지 아니할 부분의 토지를 매도인에게 원가로 반환한다는 조건을 당사자가 약정한 경우 그 사항은 신고사항이다.","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",6,0],[30,2019,21,41,3,"국토계획법","개발행위허가·성장관리","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 광역시의 기반시설부담구역에 관한 설명으로 틀린 것은?\n① 기반시설부담구역이 지정되면 광역시장은 대통령령으로 정하는 바에 따라 기반시설설치계획을 수립하여야 하며, 이를 도시ㆍ군관리계획에 반영하여야 한다.\n② 기반시설부담구역의 지정은 해당 광역시에 설치된 지방도시계획위원회의 심의대상이다.\n③ 광역시장은 「국토의 계획 및 이용에 관한 법률」의 개정으로 인하여 행위 제한이 완화되는 지역에 대하여는이를 기반시설부담구역으로 지정할 수 없다.\n④ 지구단위계획을 수립한 경우에는 기반시설설치계획을 수립한 것으로 본다.\n⑤ 기반시설부담구역의 지정고시일부터 1년이 되는 날까지 광역시장이 기반시설설치계획을 수립하지 아니하면 그 1년이 되는 날의 다음날에 기반시설부담구역의 지정은 해제된 것으로 본다.","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",7,0],[30,2019,21,42,3,"국토계획법","도시·군관리계획·기본계획","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 주민이 도시ㆍ군관리계획의 입안을 제안하는 경우에 관한 설명으로 틀린 것은?\n① 도시ㆍ군관리계획의 입안을 제안받은 자는 제안자와 협의하여 제안된 도시ㆍ군관리계획의 입안 및 결정에 필요한 비용의 전부 또는 일부를 제안자에게 부담시킬 수 있다.\n② 제안서에는 도시ㆍ군관리계획도서뿐만 아니라 계획설명서도 첨부하여야 한다.\n③ 도시ㆍ군관리계획의 입안을 제안받은 자는 그 처리 결과를 제안자에게 알려야 한다.\n④ 산업ㆍ유통개발진흥지구의 지정 및 변경에 관한 사항은 입안제안의 대상에 해당하지 않는다.\n⑤ 도시ㆍ군관리계획의 입안을 제안하려는 자가 토지소유자의 동의를 받아야 하는 경우 국ㆍ공유지는 동의 대상 토지 면적에서 제외된다.","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",7,0],[30,2019,21,43,3,"국토계획법","개발행위허가·성장관리","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 개발행위허가에 관한 설명으로 옳은 것은?(단, 다른 법령은 고려하지 않음)\n① 재해복구를 위한 응급조치로서 공작물의 설치를 하려는 자는 도시ㆍ군계획사업에 의한 행위가 아닌 한 개발행위허가를 받아야 한다.\n② 국가나 지방자치단체가 시행하는 개발행위에도 이행보증금을 예치하게 하여야 한다.\n③ 환경오염 방지조치를 할 것을 조건으로 개발행위허가를 하려는 경우에는 미리 개발행위허가를 신청한 자의 의견을 들어야 한다. 2019년 제30회 공인중개\n④ 개발행위허가를 받은 자가 행정청인 경우, 그가 기존의 공공시설에 대체되는 공공시설을 설치하면 기존의 공공시설은 대체되는 공공시설의 설치비용에 상당하는 범위안에서 개발행위허가를 받은 자에게 무상으로 양도될 수 있다.\n⑤ 개발행위허가를 받은 자가 행정청이 아닌 경우, 개발행위로 용도가 폐지되는 공공시설은 개발행위허가를 받은 자에게 전부 무상으로 귀속된다.","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",7,0],[30,2019,21,44,3,"국토계획법","도시·군관리계획·기본계획","","국토의 계획 및 이용에 관한 법령상 아래 내용을 뜻 하는 용어는?\n도시ㆍ군계획 수립 대상지역의 일부에 대하여 토지이용을 합리화하고 그 기능을 증진시키며 미관을 개선하고 양호한 환경을 확보하며, 그 지역을 체계적ㆍ계획적으로 관리하기 위하여 수립하는 도시ㆍ군관리계획\n① 일부관리계획 ② 지구단위계획\n③ 도시ㆍ군기본계획 ④ 시가화조정구역계획\n⑤ 입지규제최소구역계획","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",7,0],[30,2019,21,45,3,"국토계획법","국토계획법 일반","","국토의 계획 및 이용에 관한 법령상 시장 또는 군수가 주민의 의견을 들어야 하는 경우로 명시되어 있지 않은 것은?(단, 국토교통부장관이 따로 정하는 경우는 고려하지 않음)\n① 광역도시계획을 수립하려는 경우\n② 성장관리방안을 수립하려는 경우\n③ 시범도시사업계획을 수립하려는 경우\n④ 기반시설부담구역을 지정하려는 경우\n⑤ 개발밀도관리구역을 지정하려는 경우","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",7,0],[30,2019,21,46,3,"국토계획법","국토계획법 일반","박스형(모두고르기)","국토의 계획 및 이용에 관한 법령상 국가 또는 지방자치단체가 자연취락지구안의 주민의 생활편익과 복 지증진 등을 위하여 시행하거나 지원할 수 있는 사업만을 모두 고른 것은?\nㄱ. 어린이놀이터ㆍ마을회관의 설치\nㄴ. 쓰레기처리장ㆍ하수처리시설의 개량\nㄷ. 하천정비 등 재해방지를 위한 시설의 설치\nㄹ. 주택의 개량\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",7,0],[30,2019,21,47,3,"국토계획법","용도지역·용도지구·용도구역","","국토의 계획 및 이용에 관한 법령상 용도지역별 용적률의 최대한도가 다음 중 가장 큰 것은?(단, 조례 등 기타 강화ㆍ완화조건은 고려하지 않음)\n① 제1종전용주거지역 ② 제3종일반주거지역\n③ 준주거지역 ④ 일반공업지역\n⑤ 준공업지역","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",7,0],[30,2019,21,48,3,"국토계획법","도시·군관리계획·기본계획","빈칸","국토의 계획 및 이용에 관한 법령상 도시ㆍ군계획시설에 관한 설명이다. ( )에 들어갈 내용을 바르게 나열한 것은?\n도시ㆍ군계획시설결정이 고시된 도시ㆍ군계획시설에 대하여 그 고시일부터 ( ㄱ )년이 지날 때까지 그 시설의 설치에 관한 도시ㆍ군계획시설사업이 시행되지 아니하는 경우 그 도시ㆍ군계획시설결정은 그 고시일부터 ( ㄱ )년이 ( ㄴ )에 그 효력을 잃는다.\n① ㄱ: 10, ㄴ: 되는 날\n② ㄱ: 20, ㄴ: 되는 날\n③ ㄱ: 10, ㄴ: 되는 날의 다음날\n④ ㄱ: 15, ㄴ: 되는 날의 다음날\n⑤ ㄱ: 20, ㄴ: 되는 날의 다음날","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",8,0],[30,2019,21,49,3,"국토계획법","국토계획법 일반","","국토의 계획 및 이용에 관한 법령상 제3종일반주거지역 안에서 도시ㆍ군계획조례가 정하는 바에 의하여 건축할 수 있는 건축물은?(단, 건축물의 종류는 「건축법 시행령」 별표 1에 규정된 용도별 건축물의 종류에 따름)\n① 제2종 근린생활시설 중 단란주점\n② 의료시설 중 격리병원\n③ 문화 및 집회시설 중 관람장\n④ 위험물저장 및 처리시설 중 액화가스 취급소ㆍ판매소\n⑤ 업무시설로서 그 용도에 쓰이는 바닥면적의 합계가 4천제곱미터인 것","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",8,0],[30,2019,21,50,3,"국토계획법","용도지역·용도지구·용도구역","박스형(모두고르기)","국토의 계획 및 이용에 관한 법령상 용도지구와 그 세분(細分)이 바르게 연결된 것만을 모두 고른 것은?(단, 조례는 고려하지 않음)\nㄱ. 보호지구 - 역사문화환경보호지구, 중요시설물 보호지구, 생태계보호지구\nㄴ. 방재지구 - 자연방재지구, 시가지방재지구, 특정개발방재지구\nㄷ. 경관지구 - 자연경관지구, 주거경관지구, 시가 지경관지구\nㄹ. 취락지구 - 자연취락지구, 농어촌취락지구, 집단취락지구\n① ㄱ ② ㄹ ③ ㄱ, ㄷ ④ ㄴ, ㄹ ⑤ ㄷ, ㄹ","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",8,0],[30,2019,21,51,3,"국토계획법","도시·군계획시설·매수청구","","국토의 계획 및 이용에 관한 법령상 건축물별 기반시설유발계수가 다음 중 가장 큰 것은?\n① 단독주택\n② 장례시설\n③ 관광휴게시설\n④ 제2종 근린생활시설\n⑤ 비금속 광물제품 제조공장 2019년 제30회 공인중개","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",8,0],[30,2019,21,52,3,"국토계획법","용도지역·용도지구·용도구역","빈칸","「국토의 계획 및 이용에 관한 법률」상 용어의 정의에 관한 조문의 일부이다. ( )에 들어갈 내용을 바르게 나열한 것은?\n“( ㄱ )”(이)란 토지의 이용 및 건축물의 용도ㆍ건폐율ㆍ용적률ㆍ높이 등에 대한 ( ㄴ )의 제한을 강화하거나 완화하여 적용함으로써 ( ㄴ )의 기능을 증진시키고 경관ㆍ안전 등을 도모하기 위하여도시ㆍ군관리계획으로 결정하는 지역을 말한다.\n① ㄱ: 용도지구, ㄴ: 용도지역\n② ㄱ: 용도지구, ㄴ: 용도구역\n③ ㄱ: 용도지역, ㄴ: 용도지구\n④ ㄱ: 용도지구, ㄴ: 용도지역 및 용도구역\n⑤ ㄱ: 용도지역, ㄴ: 용도구역 및 용도지구","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",8,0],[30,2019,21,53,3,"도시개발법","도시개발구역 지정·계획","옳은것 고르기","도시개발법령상 도시개발구역의 지정에 관한 설명으로 옳은 것은?(단, 특례는 고려하지 않음)\n① 대도시 시장은 직접 도시개발구역을 지정할 수 없고, 도지사에게 그 지정을 요청하여야 한다.\n② 도시개발사업이 필요하다고 인정되는 지역이 둘 이상의도의 행정구역에 걸치는 경우에는 해당 면적이 더 넓은 행정구역의 도지사가 도시개발구역을 지정하여야 한다.\n③ 천재지변으로 인하여 도시개발사업을 긴급하게 할 필요가 있는 경우 국토교통부장관이 도시개발구역을 지정할 수 있다.\n④ 도시개발구역의 총 면적이 1만제곱미터 미만인 경우 둘 이상의 사업시행지구로 분할하여 지정할 수 있다.\n⑤ 자연녹지지역에서 도시개발구역을 지정한 이후 도시개발사업의 계획을 수립하는 것은 허용되지 아니한다.","3","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",8,0],[30,2019,21,54,3,"도시개발법","도시개발구역 지정·계획","","도시개발법령상 지정권자가 ‘도시개발구역 전부를 환지 방식으로 시행하는 도시개발사업’을 ‘지방자치단체의 장이 집행하는 공공시설에 관한 사업’과 병행하 여 시행할 필요가 있다고 인정하는 경우, 이 도시개발사업의 시행자로 지정될 수 없는 자는?(단, 지정될 수 있는 자가 도시개발구역의 토지 소유자는 아니며, 다른 법령은 고려하지 않음)\n① 국가\n② 지방자치단체\n③ 「지방공기업법」에 따른 지방공사\n④ 「한국토지주택공사법」에 따른 한국토지주택공사\n⑤ 「자본시장과 금융투자업에 관한 법률」에 따른 신탁업자 중 「주식회사 등의 외부감사에 관한 법률」 제4조에 따른 외부감사의 대상이 되는 자","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",8,0],[30,2019,21,55,3,"도시개발법","수용·사용·환지","옳은것 고르기","도시개발법령상 환지 방식에 의한 도시개발사업의 시행에 관한 설명으로 옳은 것은?\n① 시행자는 준공검사를 받은 후 60일 이내에 지정권자에게 환지처분을 신청하여야 한다.\n② 도시개발구역이 2 이상의 환지계획구역으로 구분되는 경우에도 사업비와 보류지는 도시개발구역 전체를 대상으로 책정하여야 하며, 환지계획구역별로는 책정할 수 없다.\n③ 도시개발구역에 있는 조성토지등의 가격은 개별공시지가로 한다.\n④ 환지 예정지가 지정되어도 종전 토지의 임차권자는 환지처분 공고일까지 종전 토지를 사용ㆍ수익할 수 있다.\n⑤ 환지 계획에는 필지별로 된 환지 명세와 필지별과 권리 별로 된 청산 대상 토지 명세가 포함되어야 한다.","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",9,0],[30,2019,21,56,3,"국토계획법","도시·군계획시설·매수청구","박스형(모두고르기), 옳은것 고르기","도시개발법령상 도시개발사업의 시행자인 국가 또는 지방자치단체가 「주택법」에 따른 주택건설사업자에게 대행하게 할 수 있는 도시개발사업의 범위에 해당하는 것만을 모두 고른 것은?\nㄱ. 실시설계 ㄴ. 기반시설공사\nㄷ. 부지조성공사 ㄹ. 조성된 토지의 분양\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",9,0],[30,2019,21,57,3,"도시개발법","도시개발채권·기타","옳은것 고르기","도시개발법령상 도시개발사업의 시행방식에 관한 설명으로 옳은 것은?\n① 분할 혼용방식은 수용 또는 사용 방식이 적용되는 지역과 환지 방식이 적용되는 지역을 사업시행지구별로 분할하여 시행하는 방식이다.\n② 계획적이고 체계적인 도시개발 등 집단적인 조성과 공급이 필요한 경우에는 환지 방식으로 정하여야 하며, 다른 시행방식에 의할 수 없다.\n③ 도시개발구역지정 이후에는 도시개발사업의 시행방식을 변경할 수 없다.\n④ 시행자는 도시개발사업의 시행방식을 토지등을 수용 또는 사용하는 방식, 환지 방식 또는 이를 혼용하는 방식 중에서 정하여 국토교통부장관의 허가를 받아야 한다.\n⑤ 지방자치단체가 도시개발사업의 전부를 환지 방식으로 시행하려고 할 때에는 도시개발사업에 관한 규약을 정하여야 한다.","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",9,0],[30,2019,21,58,3,"도시개발법","수용·사용·환지","옳은것 고르기","도시개발법령상 수용 또는 사용의 방식에 따른 사업시행에 관한 설명으로 옳은 것은?\n① 「지방공기업법」에 따라 설립된 지방공사가 시행자인 경우 토지 소유자 전원의 동의 없이는 도시개발사업에 필요한 토지등을 수용하거나 사용할 수 없다.\n② 지방자치단체가 시행자인 경우 지급보증 없이 토지상환채권을 발행할 수 있다.\n③ 지정권자가 아닌 시행자는 조성토지등을 공급받거나 이 용하려는 자로부터 지정권자의 승인 없이 해당 대금의 전부 또는 일부를 미리 받을 수 있다. 2019년 제30회 공인중개\n④ 원형지의 면적은 도시개발구역 전체 토지 면적의 3분의 1을 초과하여 공급될 수 있다.\n⑤ 공공용지가 아닌 조성토지등의 공급은 수의계약의 방법에 의하여야 한다.","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",9,0],[30,2019,21,59,3,"정비법","정비사업 일반","옳은것 고르기","도시 및 주거환경정비법령상 정비사업의 시행에 관한 설명으로 옳은 것은?\n① 조합의 정관에는 정비구역의 위치 및 면적이 포함되어야 한다.\n② 조합설립인가 후 시장ㆍ군수등이 토지주택공사등을 사업시행자로 지정ㆍ고시한 때에는 그 고시일에 조합설립인가가 취소된 것으로 본다.\n③ 조합은 명칭에 “정비사업조합”이라는 문자를 사용하지 않아도 된다.\n④ 조합장이 자기를 위하여 조합과 소송을 할 때에는 이사가 조합을 대표한다.\n⑤ 재건축사업을 하는 정비구역에서 오피스텔을 건설하여 공급하는 경우에는 「국토의 계획 및 이용에 관한 법률」에 따른 준주거지역 및 상업지역 이외의 지역에서 오피스텔을 건설할 수 있다.","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",9,0],[30,2019,21,60,3,"정비법","정비사업 일반","틀린것 고르기","도시 및 주거환경정비법령상 비용의 부담 등에 관한 설명으로 틀린 것은?\n① 정비사업비는 「도시 및 주거환경정비법」 또는 다른 법령에 특별한 규정이 있는 경우를 제외하고는 사업시행자가 부담한다.\n② 지방자치단체는 시장ㆍ군수등이 아닌 사업시행자가 시행하는 정비사업에 드는 비용에 대해 융자를 알선할 수는 있으나 직접적으로 보조할 수는 없다.\n③ 정비구역의 국유ㆍ공유재산은 사업시행자 또는 점유자및 사용자에게 다른 사람에 우선하여 수의계약으로 매각될 수 있다.\n④ 시장ㆍ군수등이 아닌 사업시행자는 부과금 또는 연체료를 체납하는 자가 있는 때에는 시장ㆍ군수등에게 그 부과ㆍ징수를 위탁할 수 있다.\n⑤ 사업시행자는 정비사업을 시행하는 지역에 전기ㆍ가스 등의 공급시설을 설치하기 위하여 공동구를 설치하는 경우에는 다른 법령에 따라 그 공동구에 수용될 시설을 설치할 의무가 있는 자에게 공동구의 설치에 드는 비용을 부담시킬 수 있다.","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",9,0],[30,2019,21,61,3,"정비법","정비사업 일반","","도시 및 주거환경정비법령상 분양공고에 포함되어야 할 사항으로 명시되지 않은 것은?(단, 토지등소유자 1인이 시행하는 재개발사업은 제외하고, 조례는 고려하지 않음)\n① 분양신청자격\n② 분양신청방법\n③ 분양신청기간 및 장소\n④ 분양대상자별 분담금의 추산액\n⑤ 분양대상 대지 또는 건축물의 내역","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",9,0],[30,2019,21,62,3,"정비법","정비계획·정비구역","틀린것 고르기","도시 및 주거환경정비법령상 도시ㆍ주거환경정비기 본계획을 변경할 때 지방의회의 의견청취를 생략할 수 있는 경우가 아닌 것은?\n① 공동이용시설에 대한 설치계획을 변경하는 경우\n② 정비사업의 계획기간을 단축하는 경우\n③ 사회복지시설 및 주민문화시설 등에 대한 설치계획을 변경하는 경우\n④ 구체적으로 명시된 정비예정구역 면적의 25퍼센트를 변경하는 경우\n⑤ 정비사업의 시행을 위하여 필요한 재원조달에 관한 사항을 변경하는 경우","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",10,0],[30,2019,21,63,3,"정비법","조합·추진위원회","빈칸","도시 및 주거환경정비법령상 조합총회의 소집에 관한 규정내용이다. ( )에 들어갈 숫자를 바르게 나열한 것은?\n○ 정관의 기재사항 중 조합임원의 권리ㆍ의무ㆍ보수ㆍ선임방법ㆍ변경 및 해임에 관한 사항을 변경하기 위한 총회의 경우는 조합원 ( ㄱ )분의 1 이상의 요구로 조합장이 소집한다.\n○ 총회를 소집하려는 자는 총회가 개최되기 ( ㄴ ) 일 전까지 회의 목적ㆍ안건ㆍ일시 및 장소를 정하여 조합원에게 통지하여야 한다.\n① ㄱ: 3, ㄴ: 7 ② ㄱ: 5, ㄴ: 7 ③ ㄱ: 5, ㄴ: 10\n④ ㄱ: 10, ㄴ: 7 ⑤ ㄱ: 10, ㄴ: 10","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",10,0],[30,2019,21,64,3,"정비법","정비계획·정비구역","틀린것 고르기","도시 및 주거환경정비법령상 도시ㆍ주거환경정비기 본계획의 수립 및 정비구역의 지정에 관한 설명으로 틀린 것은?\n① 기본계획의 수립권자는 기본계획을 수립하려는 경우에는 14일 이상 주민에게 공람하여 의견을 들어야 한다.\n② 기본계획의 수립권자는 기본계획을 수립한 때에는 지체없이 이를 해당 지방자치단체의 공보에 고시하고 일반인이 열람할 수 있도록 하여야 한다.\n③ 정비구역의 지정권자는 정비구역의 진입로 설치를 위하여 필요한 경우에는 진입로 지역과 그 인접지역을 포함하여 정비구역을 지정할 수 있다.\n④ 정비구역에서는 「주택법」에 따른 지역주택조합의 조합원을 모집해서는 아니 된다.\n⑤ 정비구역에서 이동이 쉽지 아니한 물건을 14일 동안 쌓아두기 위해서는 시장ㆍ군수등의 허가를 받아야 한다.","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",10,0],[30,2019,21,65,3,"주택법","용어(주택·공동주택 등)","옳은것 고르기","주택법령상 용어에 관한 설명으로 옳은 것은?\n① “주택단지”에 해당하는 토지가 폭 8미터 이상인 도시계 획예정도로로 분리된 경우, 분리된 토지를 각각 별개의 주택단지로 본다.\n② “단독주택”에는「건축법 시행령」에 따른 다가구주택이 포함되지 않는다.\n③ “공동주택”에는 「건축법 시행령」에 따른 아파트, 연립주택, 기숙사 등이 포함된다. 2019년 제30회 공인중개사\n④ “주택”이란 세대의 구성원이 장기간 독립된 주거생활을 할 수 있는 구조로 된 건축물의 전부 또는 일부를 말하며, 그 부속토지는 제외한다.\n⑤ 주택단지에 딸린 어린이놀이터, 근린생활시설, 유치원, 주민운동시설, 지역난방공급시설 등은 “부대시설”에 포함된다.","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",10,0],[30,2019,21,66,3,"주택법","사업주체·주택조합","틀린것 고르기","주택법령상 지역주택조합의 설립인가신청을 위하여 제출하여야 하는 서류에 해당하지 않는 것은?\n① 조합장선출동의서\n② 조합원의 동의를 받은 정산서\n③ 조합원 전원이 자필로 연명한 조합규약\n④ 조합원 자격이 있는 자임을 확인하는 서류\n⑤ 해당 주택건설대지의 80퍼센트 이상에 해당하는 토지의 사용권원을 확보하였음을 증명하는 서류","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",10,0],[30,2019,21,67,3,"주택법","주택공급·분양가상한·전매제한","박스형(모두고르기)","주택법령상 주거정책심의위원회의 심의를 거치도록 규정되어 있는 것만을 모두 고른 것은?\nㄱ. 「주택법」제20조에 따라 시장ㆍ군수ㆍ구청장의 요청을 받아 국토교통부장관이 임대주택의 인수자를 지정하는 경우\nㄴ. 「주택법」제58조에 따라 국토교통부장관이 분양가상한제 적용 지역을 지정하는 경우\nㄷ.「주택법」제63조에 따라 국토교통부장관이 투기과열지구의 지정을 해제하는 경우\n① ㄴ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",10,0],[30,2019,21,68,3,"주택법","사업계획승인·사용검사","틀린것 고르기","주택법령상 주택건설사업계획승인에 관한 설명으로 틀린 것은?\n① 사업계획에는 부대시설 및 복리시설의 설치에 관한 계획 등이 포함되어야 한다.\n② 주택단지의 전체 세대수가 500세대인 주택건설사업을 시행하려는 자는 주택단지를 공구별로 분할하여 주택을 건설ㆍ공급할 수 있다.\n③ 「한국토지주택공사법」에 따른 한국토지주택공사는 동일한 규모의 주택을 대량으로 건설하려는 경우에는 국토교통부장관에게 주택의 형별(型別)로 표본설계도서를 작성ㆍ제출하여 승인을 받을 수 있다.\n④ 사업계획승인권자는 사업계획을 승인할 때 사업주체가 제출하는 사업계획에 해당 주택건설사업과 직접적으로 관련이 없거나 과도한 기반시설의 기부채납을 요구하여서는 아니 된다.\n⑤ 사업계획승인권자는 사업계획승인의 신청을 받았을 때에는 정당한 사유가 없으면 신청받은 날부터 60일 이내에 사업주체에게 승인 여부를 통보하여야 한다.","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",10,0],[30,2019,21,69,3,"주택법","사업계획승인·사용검사","빈칸","「주택법」상 사용검사 후 매도청구 등에 관한 조문의 일부이다. ( )에 들어갈 숫자를 바르게 나열한 것은?\n「주택법」제62조(사용검사 후 매도청구 등)\n①～③ <생략>\n④ 제1항에 따라 매도청구를 하려는 경우에는 해당 토지의 면적이 주택단지 전체 대지 면적의 ( ㄱ )퍼센트 미만이어야 한다.\n⑤ 제1항에 따른 매도청구의 의사표시는 실소유자가 해당 토지 소유권을 회복한 날부터 ( ㄴ )년 이내에 해당 실소유자에게 송달되어야 한다.\n⑥ <생략>\n① ㄱ: 5, ㄴ: 1 ② ㄱ: 5, ㄴ: 2 ③ ㄱ: 5, ㄴ: 3\n④ ㄱ: 10, ㄴ: 1 ⑤ ㄱ: 10, ㄴ: 2","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",11,0],[30,2019,21,70,3,"주택법","리모델링·기타","틀린것 고르기","「주택법」상 청문을 하여야 하는 처분이 아닌 것은?(단, 다른 법령에 따른 청문은 고려하지 않음)\n① 공업화주택의 인정취소\n② 주택조합의 설립인가취소\n③ 주택건설 사업계획승인의 취소\n④ 공동주택 리모델링허가의 취소\n⑤ 주택건설사업의 등록말소","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",11,0],[30,2019,21,71,3,"주택법","사업주체·주택조합","","주택법령상 사업계획승인권자가 사업주체의 신청을 받아 공사의 착수기간을 연장할 수 있는 경우가 아닌 것은?(단, 공사에 착수하지 못할 다른 부득이한 사유는 고려하지 않음)\n① 사업계획승인의 조건으로 부과된 사항을 이행함에 따라 공사 착수가 지연되는 경우\n② 공공택지의 개발ㆍ조성을 위한 계획에 포함된 기반시설의 설치 지연으로 공사 착수가 지연되는 경우\n③ 「매장문화재 보호 및 조사에 관한 법률」에 따라 문화 재청장의 매장문화재 발굴허가를 받은 경우\n④ 해당 사업시행지에 대한 소유권 분쟁을 사업주체가 소 송 외의 방법으로 해결하는 과정에서 공사 착수가 지연되는 경우\n⑤ 사업주체에게 책임이 없는 불가항력적인 사유로 인하여 공사 착수가 지연되는 경우","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",11,0],[30,2019,21,72,3,"국토계획법","개발행위허가·성장관리","박스형(모두고르기)","건축법령상 건축허가 대상 건축물을 건축하려는 자가 허가권자의 사전결정통지를 받은 경우 그 허가를 받은 것으로 볼 수 있는 것만을 모두 고른 것은?\nㄱ.「국토의 계획 및 이용에 관한 법률」 제56조에 따른 개발행위허가\nㄴ.「산지관리법」 제15조의2에 따른 도시지역 안의 보전산지에 대한 산지일시사용허가\nㄷ.「산지관리법」 제14조에 따른 농림지역 안의 보전산지에 대한 산지전용허가\nㄹ.「농지법」 제34조에 따른 농지전용허가\n① ㄱ, ㄴ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ 2019년 제30회 공인중개사","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",11,0],[30,2019,21,73,3,"건축법","건축법 일반","틀린것 고르기","건축법령상 건축민원전문위원회에 관한 설명으로 틀린 것은?(단, 조례는 고려하지 않음)\n① 도지사는 건축위원회의 심의 등을 효율적으로 수행하기 위하여 필요하면 자신이 설치하는 건축위원회에 건축민 원전문위원회를 두어 운영할 수 있다.\n② 건축민원전문위원회가 위원회에 출석하게 하여 의견을 들을 수 있는 자는 신청인과 허가권자에 한한다.\n③ 건축민원전문위원회에 질의민원의 심의를 신청하려는 자는 문서에 의할 수 없는 특별한 사정이 있는 경우에는 구술로도 신청할 수 있다.\n④ 건축민원전문위원회는 심의에 필요하다고 인정하면 위원 또는 사무국의 소속 공무원에게 관계 서류를 열람하게 하거나 관계 사업장에 출입하여 조사하게 할 수 있다.\n⑤ 건축민원전문위원회는 건축법령의 운영 및 집행에 관한 민원을 심의할 수 있다.","2","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",11,0],[30,2019,21,74,3,"건축법","건축물·용어·적용범위","빈칸","건축법령상 건축공사현장 안전관리 예치금에 관한 조문의 내용이다. ( )에 들어갈 내용을 바르게 나열한 것은?(단, 적용 제외는 고려하지 않음) 허가권자는 연면적이 ( ㄱ )제곱미터 이상인 건축물로서 해당 지방자치단체의 조례로 정하는 건축물에 대하여는 착공신고를 하는 건축주에게 장기간 건축물의 공사현장이 방치되는 것에 대비하여 미리 미관 개선과 안전관리에 필요한 비용을 건축 공사비의 ( ㄴ )퍼센트의 범위에서 예치하게 할 수 있다.\n① ㄱ: 1천, ㄴ: 1 ② ㄱ: 1천, ㄴ: 3 ③ ㄱ: 1천, ㄴ: 5\n④ ㄱ: 3천, ㄴ: 3 ⑤ ㄱ: 3천, ㄴ: 5","1","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",11,0],[30,2019,21,75,3,"건축법","건축허가·신고·사용승인","옳은것 고르기","건축법령상 국가가 소유한 대지의 지상 여유공간에 구분지상권을 설정하여 시설을 설치하려는 경우, 허가권자가 구분지상권자를 건축주로 보고 구분지상권이 설정된 부분을 대지로 보아 건축허가를 할 수 있는 시설에 해당하는 것은?\n① 수련시설 중 「청소년활동진흥법」에 따른 유스호스텔\n② 제2종 근린생활시설 중 다중생활시설\n③ 제2종 근린생활시설 중 노래연습장\n④ 문화 및 집회시설 중 공연장\n⑤ 업무시설 중 오피스텔","4","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",11,0],[30,2019,21,76,3,"건축법","건축물·용어·적용범위","","건축법령상 철도의 선로 부지(敷地)에 있는 시설로서 「건축법」의 적용을 받지 않는 건축물만을 모두 고른 것은?(단, 건축법령 이외의 특례는 고려하지 않음)\nㄱ. 플랫폼\nㄴ. 운전보안시설\nㄷ. 철도 선로의 아래를 가로지르는 보행시설\nㄹ. 해당 철도사업용 급수(給水)ㆍ급탄(給炭) 및 급유(給油) 시설\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",11,0],[30,2019,21,77,3,"건축법","건축물·용어·적용범위","틀린것 고르기","건축법령상 대지를 조성하기 위하여 건축물과 분리하여 공작물을 축조하려는 경우, 특별자치시장ㆍ특별자치도지사 또는 시장․군수․구청장에게 신고하여야 하는 공작물에 해당하지 않는 것은?(단, 공용건축물에 대한 특례는 고려하지 않음)\n① 상업지역에 설치하는 높이 8미터의 통신용 철탑\n② 높이 4미터의 옹벽\n③ 높이 8미터의 굴뚝\n④ 바닥면적 40제곱미터의 지하대피호\n⑤ 높이 4미터의 장식탑","5","1b65xyNY3AdScqy_uhOmB4W52t2L93Kj0",12,0],[30,2019,21,78,3,"건축법","건축허가·신고·사용승인","틀린것 고르기","건축법령상 결합건축을 하고자 하는 건축주가 건축허가를 신청할 때 결합건축협정서에 명시하여야 하는 사항이 아닌 것은?\n① 결합건축 대상 대지의 용도지역\n② 결합건축협정서를 체결하는 자가 자연인인 경우 성명, 주소 및 생년월일\n③ 결합건축
