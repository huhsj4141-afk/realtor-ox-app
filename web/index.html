에는 대상물건의 감정평가액을 시장가치 외의 가치를 기준으로 결정할 수 있다.\n② 적산법이란 일반기업 경영에 의하여 산출된 총수익을 분석하여 대상물건이 일정한 기간에 산출할 것으로 기대되는 순수익에 대상물건을 계속하여 임대하는 데에 필요한 경비를 더하여 대상물건의 임대료를 산정하는 감정평가방법을 말한다.\n③ 둘 이상의 대상물건이 일체로 거래되거나 대상물건 상호간에 용도상 불가분의 관계가 있는 경우에는 일괄하여 감정평가할 수 있다.\n④ 임대사례비교법이란 대상물건과 가치형성요인이 같거나 비슷한 물건의 임대사례와 비교하여 대상물건의 현황에 맞게 사정보정, 시점수정, 가치형성요인 비교 등의 과정을 거쳐 대상물건의 임대료를 산정하는 감정평가방법을 말한다.\n⑤ 감정평가법인등은 법령에 다른 규정이 있는 경우에는 기준시점의 가치형성요인 등을 실제와 다르게 가정하거나 특수한 경우로 한정하는 조건을 붙여 감정평가할 수 있다.","2","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",5,0],[36,2025,11,36,0,"감정평가론","가치·가격원칙·지역분석","틀린것 고르기","감정평가 과정상 지역분석 및 개별분석에 관한 설명으로 틀린 것은?\n\n① 대상부동산의 최유효이용을 판정하기 위해 개별분석이 필요하다.\n\n② 유사지역이란 대상부동산이 속하지 아니하는 지역으로서 인근지역과 유사한 특성을 갖는 지역을 말한다.\n\n③ 개별분석보다 지역분석을 먼저 실시하는 것이 일반적이다.\n\n④ 해당 지역 내 부동산의 표준적 이용과 가격수준 파악을 위해 지역분석이 필요하다.\n\n⑤ 인근지역이란 대상부동산이 속한 지역으로서 부동산의 이용이 동질적이고 가치형성요인 중 개별요인을 공유하는 지역을 말한다.","5","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",6,0],[36,2025,11,37,0,"감정평가론","감정평가 3방식·시산가액","계산","다음 자료를 활용하여 공시지가기준법으로 산정한 대상토지의 단위면적(m²)당 시산가액은?(단, 주어진 조건에 한함)\n○ 대상토지 현황\n- 소재지: A시 B구 C동 123번지\n- 용도지역: 제2종일반주거지역\n- 이용상황: 상업용\n○ 기준시점: 2025.10.25.\n○ 비교표준지\n- 소재지: A시 B구 C동 135번지\n- 용도지역: 제2종일반주거지역\n- 이용상황: 상업용\n- 2025.01.01. 기준 공시지가: 5,000,000원/m²\n○ 지가변동률(A시 B구, 2025.01.01.~2025.10.25.)\n- 주거지역 5% 상승\n- 상업용 10% 상승\n○ 지역요인: 비교표준지와 대상토지는 인근지역에 위치하여 지역요인 동일함\n○ 개별요인: 대상토지는 비교표준지에 비해 가로조건 5% 열세하고, 획지조건 8% 우세하며, 다른 조건은 동일함\n○ 그 밖의 요인 보정: 대상토지 인근지역의 가치형성요인이 유사한 정상적인 거래사례 및 평가사례 등을 고려하여 그 밖의 요인으로 60% 증액 보정함\n○ 상승식으로 계산할 것\n\n① 5,386,500원\n\n② 5,643,000원\n\n③ 8,400,000원\n\n④ 8,618,400원\n\n⑤ 9,028,800원","4","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",6,0],[36,2025,11,38,0,"감정평가론","부동산가격공시","틀린것 고르기","부동산 가격공시에 관한 법령에 규정된 내용으로 틀린 것은?\n\n① 표준지공시지가의 공시기준일은 1월 1일로 한다. 다만, 국토교통부장관은 표준지공시지가 조사·평가인력 등을 고려하여 부득이하다고 인정하는 경우에는 일부 지역을 지정하여 해당 지역에 대한 공시기준일을 따로 정할 수 있다.\n\n② 표준지공시지가에 이의가 있는 자는 그 공시일부터 30일 이내에 서면(전자문서를 포함한다)으로 국토교통부장관에게 이의를 신청할 수 있다.\n\n③ 표준지로 선정된 토지에 대하여는 개별공시지가를 결정·공시하지 아니할 수 있다.\n\n④ 시장·군수 또는 구청장은 공시기준일 이후에 분할·합병 등이 발생한 토지에 대하여는 그 사유가 발생한 시기에 따라 그 해 6월 1일 또는 다음 해 1월 1일을 기준으로 하여 개별공시지가를 결정·공시하여야 한다.\n\n⑤ 표준지공시지가는 토지시장에 지가정보를 제공하고 일반적인 토지거래의 지표가 되며, 국가·지방자치단체 등이 그 업무와 관련하여 지가를 산정하거나 감정평가법인등이 개별적으로 토지를 감정평가하는 경우에 기준이 된다.","4","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",6,0],[36,2025,11,39,0,"감정평가론","감정평가 3방식·시산가액","계산","다음 자료를 활용하여 원가법으로 산정한 대상건물의 시산가액은?(단, 주어진 조건에 한함)\n○ 대상건물 현황: 철근콘크리트조, 단독주택, 연면적 200m²\n○ 기준시점: 2025.10.25.\n○ 사용승인시점: 2019.10.25.\n○ 사용승인시점의 신축공사비: 1,400,000원/m²(신축공사비는 적정함)\n○ 건축비지수(건설공사비지수)\n- 사용승인시점: 100\n- 기준시점: 125\n○ 경제적 내용연수: 50년\n○ 감가수정방법: 정액법\n○ 내용연수 만료 시 잔존가치 없음\n\n① 246,400,000원\n\n② 274,400,000원\n\n③ 308,000,000원\n\n④ 329,000,000원\n\n⑤ 350,000,000원","3","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",6,0],[36,2025,11,40,0,"감정평가론","가치·가격원칙·지역분석","박스형(모두고르기)","감정평가에 관한 규칙상 대상물건과 대상물건별로 정한 감정평가방법(주된 방법)의 연결이 옳은 것은 모두 몇 개인가?\n○ 광업재단 - 원가법\n○ 항공기 - 거래사례비교법\n○ 기업가치 - 수익환원법\n○ 임대료 - 수익환원법\n○ 건물 - 원가법\n○ 과수원 - 수익환원법\n○ 자동차 - 원가법\n\n① 2개\n\n② 3개\n\n③ 4개\n\n④ 5개\n\n⑤ 6개","1","1MNr-9ifimtZhAw9ZK5WLvxI_iE7wRzwD",6,0],[36,2025,11,41,1,"민법총칙","법률행위(반사회·불공정)","판례, 틀린것 고르기","부동산학의 연구대상 및 연구분야에 관한 설명으로 옳은 것은?\n① 부동산학의 연구대상은 부동산활동과 부동산현상이다.\n② 부동산활동의 주체는 공적 부문으로 한정된다.\n③ 부동산학의 연구분야 중 결정분야에는 투자, 금융, 개발, 관리, 마케팅 등이 포함된다.\n④ 부동산학은 순수과학으로서의 성격을 강하게 띤다.\n⑤ 부동산학의 접근방법 중 종합식 접근방법은 부동산을 기술, 경제, 법률적 측면의 복합개념으로 이해하여 이들 측면의 복합적 접근을 시도한다.","2","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",7,0],[36,2025,11,42,1,"민법총칙","의사표시(착오·사기·통정허위)","박스형(모두고르기), 판례","부동산의 개념에 관한 설명으로 옳은 것은?\n① 부동산학상 부동산은 토지 및 그 정착물에 한정된다.\n② 민법상 부동산은 토지 및 그 정착물을 말한다.\n③ 토지와 독립된 정착물에는 건물, 명인방법을 갖춘 수목, 권원에 의해 타인의 토지에서 재배되는 농작물 등이 있다.\n④ 준부동산은 부동산과 유사한 성질을 가지므로 민법상 부동산으로 분류된다.\n⑤ 토지의 정착물 중 토지와 일부로 간주되는 것에는 건물, 교량, 담장 등이 있다.","3","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",7,0],[36,2025,11,43,1,"민법총칙","대리(무권대리·표현대리)","판례, 틀린것 고르기","토지의 용어에 관한 설명으로 옳은 것은?\n① 택지는 주거, 상업, 공업용지 등의 용도로 이용되고 있거나 이용할 목적으로 조성된 토지를 말한다.\n② 후보지는 임지지역, 농지지역, 택지지역 상호 간에 전환되고 있는 지역의 토지를 말한다.\n③ 이행지는 택지지역 내에서 주거지역이 상업지역으로 변경되는 것과 같이 용도지역 내에서 세분된 지역 간에 전환이 이루어지고 있는 토지를 말한다.\n④ 필지는 하나의 지번이 붙는 토지의 등록단위를 말한다.\n⑤ 획지는 인위적, 자연적, 행정적 조건에 따라 다른 토지와 구별되는 가격수준이 비슷한 일단의 토지를 말한다.","1","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",7,0],[36,2025,11,44,1,"민법총칙","대리(무권대리·표현대리)","","토지의 자연적 특성 중 영속성에 관한 설명으로 옳은 것은?\n① 소모를 전제로 하는 재생산이론이나 사고방식이 토지에는 적용되지 않는다.\n② 토지의 물리적 공급을 불가능하게 한다.\n③ 토지의 이용을 집약화하게 한다.\n④ 토지시장에서 소유이익과 이용이익의 분리를 가능하게 한다.\n⑤ 토지의 가치보존력을 우수하게 하여 부동산활동에서 감가상각의 필요성을 근거로 제시한다.","5","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",7,0],[36,2025,11,45,1,"민법총칙","의사표시(착오·사기·통정허위)","판례, 틀린것 고르기","부동산의 수요와 공급에 관한 설명으로 옳은 것은?\n① 부동산의 수요는 유량(flow) 개념이다.\n② 부동산의 공급은 일정 시점에 시장에 존재하는 양인 저량(stock) 개념이다.\n③ 부동산의 수요곡선은 우상향한다.\n④ 부동산의 공급곡선은 우하향한다.\n⑤ 부동산의 수요량은 가격이 상승하면 증가하고, 가격이 하락하면 감소한다.","3","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",7,0],[36,2025,11,46,1,"민법총칙","의사표시(착오·사기·통정허위)","판례, 틀린것 고르기","부동산의 수요와 공급의 탄력성에 관한 설명으로 옳은 것은?\n① 수요의 가격탄력성이 완전탄력적일 때, 가격이 변하여도 수요량은 변하지 않는다.\n② 수요의 가격탄력성이 비탄력적이라는 것은 가격의 변화율보다 수요량의 변화율이 더 크다는 것을 의미한다.\n③ 공급의 가격탄력성이 1보다 크면 공급은 탄력적이다.\n④ 부동산의 공급은 단기보다 장기에 더 비탄력적이다.\n⑤ 수요의 교차탄력성이 0보다 크면 두 재화는 보완재 관계이다.","1","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",7,0],[36,2025,11,47,1,"민법총칙","법률행위(반사회·불공정)","틀린것 고르기","부동산투자분석기법에 관한 설명으로 옳은 것은?\n① 어림셈법 중 승수법의 경우 승수값이 클수록 자본회수기간이 길어진다.\n② 순현가법은 투자안의 내부수익률을 요구수익률과 비교하여 투자여부를 결정하는 방법이다.\n③ 수익성지수법은 화폐의 시간가치를 고려하지 않는 방법이다.\n④ 내부수익률이란 투자안의 순현가를 0보다 크게 만드는 할인율을 말한다.\n⑤ 회계적 수익률법은 투자안의 수익률을 내부수익률과 비교하여 투자여부를 결정하는 방법이다.","2","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",8,0],[36,2025,11,48,1,"민법총칙","법률행위(반사회·불공정)","판례, 틀린것 고르기","부동산 금융에 관한 설명으로 옳은 것은?\n① 지분금융은 타인자본을 조달하는 방법이다.\n② 저당대출의 상환방식 중 원금균등상환방식은 매기 상환하는 원리금이 점차 감소한다.\n③ 주택담보대출비율(LTV)은 대출금액을 주택가치로 나눈 비율이다.\n④ 총부채상환비율(DTI)은 차주의 총소득에서 주택담보대출의 원리금 상환액이 차지하는 비율만을 고려한다.\n⑤ 부동산투자회사(REITs)는 직접투자의 일종이다.","3","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",8,0],[36,2025,11,49,1,"민법총칙","무효·취소·추인","판례, 틀린것 고르기","부동산 개발 및 관리 등에 관한 설명으로 틀린 것은?\n① 부동산 개발은 토지소유자의 노력과 자본을 투입하여 토지의 가치를 증진시키는 행위이다.\n② 부동산 관리란 부동산의 물리적, 기능적, 경제적 가치를 유지·보존하고 증진시키는 활동이다.\n③ 위탁관리는 전문적인 관리가 가능하고 관리의 효율성을 높일 수 있다는 장점이 있다.\n④ 부동산 신탁방식은 토지소유자가 신탁회사에 토지소유권을 이전하고 신탁회사가 개발·관리·처분하여 수익을 돌려주는 방식이다.\n⑤ 자체관리는 관리업무의 타성(惰性)을 방지할 수 있다는 장점이 있다.","4","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",8,0],[36,2025,11,50,1,"민법총칙","법률행위(반사회·불공정)","박스형(모두고르기)","부동산 마케팅 전략에 관한 설명으로 옳은 것은?\n① STP 전략은 시장세분화(Segmentation), 표적시장 선정(Targeting), 포지셔닝(Positioning)의 약자이다.\n② 4P Mix 전략은 제품(Product), 가격(Price), 유통경로(Place), 촉진(Promotion)의 4가지 요소를 의미한다.\n③ 고객점유 마케팅 전략은 공급자 중심의 마케팅 전략이다.\n④ 관계 마케팅 전략은 고객과 생산자의 일회성 거래를 강조한다.\n⑤ 포지셔닝 전략은 시장을 세분화하는 전략이다.","3","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",8,0],[36,2025,11,51,1,"물권법","물권변동·등기","박스형(모두고르기), 판례","부동산 감정평가론의 기초이론에 관한 설명으로 옳은 것은?\n① 감정평가란 부동산의 경제적 가치를 판정하여 그 결과를 가액으로 표시하는 것이다.\n② 감정평가는 시장가치를 기준으로 하는 것이 원칙이나, 법령에 다른 규정이 있는 경우에는 시장가치 외의 가치를 기준으로 할 수 없다.\n③ 가치란 장래 기대되는 편익을 현재가치로 환원한 값이다.\n④ 가격은 특정 시점에서 대상물건에 대하여 실제 지불된 금액이다.\n⑤ 가치와 가격은 항상 일치한다.","4","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",8,0],[36,2025,11,52,1,"물권법","유치권","판례, 틀린것 고르기","부동산 가격공시에 관한 법률상 표준지공시지가의 효력으로 옳은 것은?\n① 토지시장의 지가정보를 제공한다.\n② 일반적인 토지거래의 지표가 된다.\n③ 국가·지방자치단체 등이 그 업무와 관련하여 지가를 산정하는 경우에 그 기준이 된다.\n④ 감정평가업자가 개별적으로 토지를 감정평가하는 경우에 그 기준이 된다.\n⑤ 이상 모두 해당한다.","2","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",8,0],[36,2025,11,53,1,"민법총칙","법률행위(반사회·불공정)","박스형(모두고르기)","감정평가 3방식에 관한 설명으로 옳은 것은?\n① 원가법은 비용성 사고에 근거한다.\n② 비교방식은 수익성 사고에 근거한다.\n③ 수익방식은 시장성 사고에 근거한다.\n④ 적산법은 임대료를 구하는 방법이 아니다.\n⑤ 거래사례비교법은 대상물건의 재조달원가를 구하는 방법이다.","1","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",8,0],[36,2025,11,54,1,"물권법","공동소유","판례, 틀린것 고르기","부동산투자분석기법에 관한 설명으로 옳은 것은?\n① 어림셈법 중 순소득승수법의 역수는 종합환원율이다.\n② 순현재가치법은 재투자율로 요구수익률을 사용한다.\n③ 내부수익률이란 순현재가치를 0보다 크게 만드는 할인율을 말한다.\n④ 수익성지수법은 화폐의 시간가치를 고려하지 않는 방법이다.\n⑤ 회계적 이익률법은 투자안의 경제적 수익률을 측정하기 위해 화폐의 시간가치를 고려한다.","5","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",9,0],[36,2025,11,55,1,"물권법","물권변동·등기","틀린것 고르기","부동산금융에 관한 설명으로 옳은 것은?\n① 지분금융에는 신디케이트, 조인트 벤처, 부동산투자회사(REITs) 등이 있다.\n② 저당유동화는 2차 저당시장에서 이루어지며, 1차 저당시장은 대출자와 차입자 간의 시장이다.\n③ 주택저당증권(MBS) 중 다계층저당증권(CMO)은 발행자와 투자자 모두에게 콜 방어(call protection)를 제공한다.\n④ 주택연금은 주택을 담보로 연금을 지급받는 제도로, 한국주택금융공사가 보증한다.\n⑤ 부동산투자회사(REITs)는 다수의 투자자로부터 자금을 모아 부동산에 투자하여 발생한 수익을 투자자에게 배당하는 회사이다.","4","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",9,0],[36,2025,11,56,1,"물권법","공동소유","판례, 틀린것 고르기","부동산개발 및 관리에 관한 설명으로 옳은 것은?\n① 부동산개발은 토지취득부터 건물건설, 분양까지의 과정을 포함하는 광의의 개념이다.\n② 부동산관리 중 위탁관리는 관리업무의 전문성과 효율성을 높일 수 있다는 장점이 있다.\n③ 부동산개발의 위험 중 법률적 위험은 인허가 지연, 용도지역 변경 등으로 발생한다.\n④ 부동산관리의 방식 중 혼합관리는 자치관리와 위탁관리의 장점을 취할 수 있으나, 관리업무의 책임소재가 불분명해질 수 있다.\n⑤ 부동산개발의 타당성 분석은 시장분석과 경제성분석으로 나뉘며, 경제성분석은 시장분석보다 선행되어야 한다.","4","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",9,0],[36,2025,11,57,1,"물권법","물권변동·등기","","부동산 마케팅에 관한 설명으로 옳은 것은?\n① 마케팅 믹스(Marketing Mix)는 4P 전략(Product, Price, Place, Promotion)을 의미한다.\n② 시장점유 마케팅 전략은 공급자 중심의 마케팅 전략이다.\n③ 고객점유 마케팅 전략은 AIDA 원리(Attention, Interest, Desire, Action)를 강조한다.\n④ 관계 마케팅 전략은 생산자와 소비자의 지속적인 관계 유지를 중시한다.\n⑤ 부동산 마케팅은 부동산 상품의 특성에 따라 차별화된 전략이 필요하다.","3","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",9,0],[36,2025,11,58,1,"물권법","전세권","판례, 틀린것 고르기","부동산 감정평가론의 기초이론에 관한 설명으로 옳은 것은?\n① 감정평가는 부동산의 가치를 화폐액으로 표시하는 작업이다.\n② 가치는 주관적·추상적 개념이며, 가격은 객관적·구체적 개념이다.\n③ 부동산의 가치는 수요와 공급의 상호작용에 의해 결정된다.\n④ 부동산의 가격은 교환의 대가로 지불된 금액이며, 가치는 장래 기대되는 편익의 현재가치이다.\n⑤ 감정평가에 관한 규칙에서 정하는 가치형성요인은 일반요인, 지역요인, 개별요인으로 구분된다.","1","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",9,0],[36,2025,11,59,1,"물권법","지상권(법정지상권·분묘기지권)","판례","부동산 가격공시에 관한 법률상 표준지공시지가의 효력으로 옳은 것은?\n① 토지시장의 지가정보를 제공한다.\n② 일반적인 토지거래의 지표가 된다.\n③ 국가·지방자치단체 등이 그 업무와 관련하여 지가를 산정하는 경우에 그 기준이 된다.\n④ 감정평가업자가 개별적으로 토지를 감정평가하는 경우에 그 기준이 된다.\n⑤ 개별공시지가의 산정기준이 된다.","2","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",9,0],[36,2025,11,60,1,"물권법","지역권","틀린것 고르기","감정평가 3방식에 관한 설명으로 옳은 것은?\n① 원가법은 비용성, 비교방식은 시장성, 수익방식은 수익성을 기초로 한다.\n② 원가법은 대상물건의 재조달원가에 감가수정을 하여 대상물건의 가액을 산정하는 방법이다.\n③ 거래사례비교법은 대상물건과 가치형성요인이 같거나 비슷한 물건의 거래사례와 비교하여 대상물건의 가액을 산정하는 방법이다.\n④ 수익환원법은 대상물건이 장래 산출할 것으로 기대되는 순수익이나 미래의 현금흐름을 환원하거나 할인하여 대상물건의 가액을 산정하는 방법이다.\n⑤ 감정평가 3방식은 각각 독립적으로 적용되며, 서로 보완적인 관계가 아니다.","5","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",9,0],[36,2025,11,61,1,"물권법","지상권(법정지상권·분묘기지권)","","부동산거래신고 등에 관한 법령상 토지거래허가구역에 관한 설명으로 옳은 것은?\n① 허가구역의 지정 당시의 지가상승률이 물가상승률보다 현저히 낮은 경우에 지정할 수 있다.\n② 국토교통부장관은 허가구역의 지정 사유가 없어졌다고 인정되는 경우에는 중앙도시계획위원회의 심의를 거쳐 허가구역의 지정을 해제하여야 한다.\n③ 시·도지사가 허가구역을 지정하려면 시·도도시계획위원회의 심의를 거쳐야 한다.\n④ 허가구역의 지정은 허가구역의 지정을 공고한 날부터 5일 후에 그 효력이 발생한다.\n⑤ 허가구역을 지정한 국토교통부장관은 지체 없이 허가구역 지정 공고 내용을 관할 시장·군수 또는 구청장에게 통지하여야 하며, 통지를 받은 시장·군수 또는 구청장은 지체 없이 그 공고 내용을 7일 이상 공고하고 15일간 일반이 열람할 수 있도록 하여야 한다.","4","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",10,0],[36,2025,11,62,1,"물권법","저당권·근저당권","틀린것 고르기","부동산거래신고 등에 관한 법령상 외국인등의 부동산 취득 등에 관한 설명으로 옳은 것은?\n① 외국인등이 건축물의 신축으로 부동산을 취득하는 경우에는 부동산 취득 신고 대상이 아니다.\n② 외국인등이 상속으로 부동산을 취득한 경우, 취득한 날부터 3개월 이내에 신고하지 않으면 300만 원 이하의 과태료가 부과된다.\n③ 외국인등이 허가구역 내의 토지를 취득하는 경우, 부동산거래신고 등에 관한 법령에 따른 토지거래계약 허가를 받았다면 외국인등의 토지 취득 허가를 받은 것으로 본다.\n④ 외국인등이 경매로 대한민국 안의 부동산을 취득한 경우, 취득한 날부터 6개월 이내에 신고하여야 한다.\n⑤ 외국인등이 토지 취득 허가를 받지 아니하고 토지 취득 계약을 체결한 경우, 그 계약은 효력이 발생한다.","4","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",10,0],[36,2025,11,63,1,"민법총칙","법률행위(반사회·불공정)","빈칸","부동산 실권리자명의 등기에 관한 법률에 관한 설명으로 옳은 것은?\n① 명의신탁약정은 무효로 하며, 명의신탁약정에 따른 등기로 이루어진 부동산에 관한 물권변동은 무효로 한다.\n② 명의신탁약정의 무효는 제3자에게 대항할 수 있다.\n③ 채무의 변제를 담보하기 위하여 채권자가 부동산에 관한 물권을 이전받는 경우, 채무자·채권자 및 당해 부동산의 평가액을 기재한 서면을 관할 등기소에 제출하여야 한다.\n④ 종중이 보유한 부동산에 관한 물권을 종중 외의 자의 명의로 등기하는 것은 조세 포탈, 강제집행의 면탈 또는 법령상 제한의 회피를 목적으로 하지 않는 경우에도 허용되지 않는다.\n⑤ 배우자 명의로 부동산에 관한 물권을 등기한 경우, 그 명의신탁약정은 언제나 유효하다.","2","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",10,0],[36,2025,11,64,1,"물권법","유치권","판례, 틀린것 고르기","주택임대차보호법상 임차인의 계약갱신요구권에 관한 설명으로 옳은 것은?\n① 임차인은 임대차기간이 끝나기 6개월 전부터 2개월 전까지의 기간에 계약갱신을 요구할 수 있다.\n② 임대인이 임차인의 동의 없이 직접 거주하려는 경우에는 임차인의 계약갱신 요구를 거절할 수 없다.\n③ 임차인은 계약갱신요구권을 2회에 한하여 행사할 수 있다.\n④ 갱신되는 임대차의 존속기간은 1년으로 본다.\n⑤ 임대인이 임차인에게 임대차기간이 끝나기 6개월 전부터 2개월 전까지의 기간에 갱신거절의 통지를 하지 아니한 경우, 그 기간이 끝난 때에 전 임대차와 동일한 조건으로 다시 임대차한 것으로 본다.","5","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",10,0],[36,2025,11,65,1,"물권법","소유권(취득시효·부합·상린)","박스형(모두고르기)","상가건물 임대차보호법상 임차인의 권리금 회수기회 보호 등에 관한 설명으로 옳은 것은?\n① 임대인은 임대차기간이 끝나기 6개월 전부터 임대차 종료 시까지 권리금 계약에 따라 임차인이 주선한 신규임차인이 되려는 자로부터 권리금을 지급받는 것을 방해하여서는 아니 된다.\n② 임대인이 선택한 신규임차인이 임차인과 권리금 계약을 체결하고 그 권리금을 지급하였다면 임대인은 임차인의 권리금 회수를 방해한 것으로 본다.\n③ 임차인이 주선한 신규임차인이 되려는 자가 보증금을 지급할 자력이 없는 경우, 임대인은 임대차계약 체결을 거절할 수 없다.\n④ 임대인이 임대차 목적물인 상가건물을 1년 6개월 이상 영리목적으로 사용하지 아니한 경우, 임대인은 임차인의 권리금 회수 기회를 거절할 수 있다.\n⑤ 권리금 회수 방해로 인한 임차인의 임대인에 대한 손해배상청구권은 임대차가 종료한 날부터 5년이 지나면 시효로 인하여 소멸한다.","1","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",10,0],[36,2025,11,66,1,"민법총칙","의사표시(착오·사기·통정허위)","판례","집합건물의 소유 및 관리에 관한 법률상 관리단 및 관리인에 관한 설명으로 옳은 것은?\n① 구분소유자가 10인 이상인 경우에만 관리단을 구성하여야 한다.\n② 관리인은 구분소유자가 아니더라도 선임될 수 있다.\n③ 관리인의 사무를 감독하는 것은 관리위원회의 권한이 아니다.\n④ 관리인은 매년 회계연도 종료 후 3개월 이내에 정기 관리단집회를 소집하여야 한다.\n⑤ 관리단집회의 결의는 이 법에 특별한 규정이 없으면 구분소유자의 3/4 이상 및 의결권의 3/4 이상의 찬성으로 의결한다.","3","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",10,0],[36,2025,11,67,1,"민사특별법","상가건물임대차보호법","박스형(모두고르기), 판례, 틀린것 고르기","가등기담보 등에 관한 법률에 관한 설명으로 옳은 것은?\n① 이 법은 차용물의 반환에 관하여 재산권을 이전하기로 한 경우에만 적용된다.\n② 채권자가 담보권 실행을 통지할 때, 청산금이 없다고 인정되는 경우에는 그 뜻을 채무자등에게 통지하지 않아도 된다.\n③ 채권자는 담보권 실행을 통지한 날부터 2개월의 청산기간이 지나기 전에는 담보목적 부동산에 대하여 본등기를 청구할 수 없다.\n④ 채무자가 청산기간이 지나기 전에 한 청산금에 관한 권리의 양도는 이로써 제3자에게 대항할 수 있다.\n⑤ 채권자가 채무자에게 담보권 실행을 통지하고 청산금을 지급한 경우, 담보목적 부동산의 소유권은 청산금을 지급한 때에 채권자에게 귀속된다.","5","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",10,0],[36,2025,11,68,1,"민법총칙","법률행위(반사회·불공정)","판례, 틀린것 고르기","부동산투자회사법령상 부동산투자회사에 관한 설명으로 옳은 것은?\n① 자기관리 부동산투자회사는 상근 임직원을 둘 수 없다.\n② 위탁관리 부동산투자회사는 본점 외의 지점을 설치할 수 없으며, 직원과 상근 임원을 둘 수 없다.\n③ 기업구조조정 부동산투자회사는 영업인가를 받은 날부터 6개월 이내에 최저자본금 이상을 갖추어야 한다.\n④ 부동산투자회사는 영업인가를 받기 전에는 현물출자를 받는 방식으로 신주를 발행할 수 없다.\n⑤ 부동산투자회사가 영업인가를 받은 날부터 1년 6개월이 지난 경우, 최저자본금 준비금은 30억 원 이상이어야 한다.","4","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",11,0],[36,2025,11,69,1,"계약법","매매(계약금·담보책임·환매)","박스형(모두고르기), 판례","부동산개발의 타당성 분석에 관한 설명으로 옳은 것은?\n① 시장분석은 특정 부동산에 대한 수요와 공급 상황을 분석하여 가격이나 임대료 수준을 결정하는 것을 목적으로 한다.\n② 시장성 분석은 개발된 부동산이 현재나 미래의 시장 상황에서 매매되거나 임대될 수 있는 가능성을 조사하는 것이다.\n③ 타당성 분석은 개발사업에 투입되는 비용과 수익을 비교하여 투자 여부를 결정하는 것으로, 경제성 분석보다 선행되는 단계이다.\n④ 투자분석은 개발사업의 수익성을 분석하여 투자자의 요구수익률을 충족하는지 여부를 판단하는 것이다.\n⑤ 지역경제분석은 대상 부동산이 속한 지역의 경제적 기반을 분석하여 부동산의 가치를 추정하는 것이다.","1","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",11,0],[36,2025,11,70,1,"계약법","매매(계약금·담보책임·환매)","","부동산관리방식에 관한 설명으로 옳은 것을 모두 고른 것은? ㄱ. 자치관리는 관리업무의 타성화를 방지할 수 있고, 기밀유지에 유리하다. ㄴ. 위탁관리는 전문적인 관리서비스를 받을 수 있어 대형건물 관리에 효율적이다. ㄷ. 혼합관리는 자치관리에서 위탁관리로 이행하는 과도기에 유용하게 활용될 수 있다. ㄹ. 위탁관리는 관리업무의 전문성을 높일 수 있으나, 관리비가 과다하게 지출될 우려가 있다.\n① ㄱ, ㄴ\n② ㄱ, ㄷ\n③ ㄴ, ㄹ\n④ ㄱ, ㄴ, ㄷ\n⑤ ㄴ, ㄷ, ㄹ","4","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",11,0],[36,2025,11,71,1,"계약법","계약의 성립(청약·승낙)","박스형(모두고르기)","부동산 마케팅에 관한 설명으로 옳은 것은?\n① 마케팅 믹스(Marketing Mix)는 기업이 표적시장에 도달하기 위해 사용하는 마케팅 도구들의 조합을 의미한다.\n② 시장점유 마케팅 전략은 공급자 중심의 전략으로, STP 전략과 4P Mix 전략이 대표적이다.\n③ 고객점유 마케팅 전략은 소비자의 구매의사결정 과정의 각 단계에서 소비자와의 접점을 마련하여 심리적 접점을 구축하는 전략이다.\n④ 관계 마케팅 전략은 생산자와 소비자 간의 일회성 거래를 강조하는 전략이다.\n⑤ STP 전략에서 S는 시장세분화(Segmentation), T는 표적시장 선정(Targeting), P는 포지셔닝(Positioning)을 의미한다.","5","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",11,0],[36,2025,11,72,1,"민법총칙","무효·취소·추인","박스형(모두고르기), 판례, 틀린것 고르기","부동산 감정평가론에서 사용하는 가치형성요인에 관한 설명으로 옳은 것은?\n① 일반적 요인은 대상 부동산의 가치에 직접적인 영향을 미치는 요인이다.\n② 지역요인은 대상 부동산이 속한 지역의 가격 수준을 형성하는 요인이다.\n③ 개별요인은 대상 부동산의 개별적인 상태나 조건에 관한 요인이다.\n④ 가치형성요인은 가치발생요인에 영향을 미치지 않는다.\n⑤ 가치형성요인은 부동산의 경제적 가치를 결정하는 요인이다.","3","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",11,0],[36,2025,11,73,1,"계약법","해제·해지","박스형(모두고르기), 판례, 옳은것 고르기","감정평가에 관한 규칙상 용어의 정의로 옳은 것은?\n① '기준시점'이란 대상물건의 감정평가액을 결정하는 기준이 되는 날짜를 말한다.\n② '가치형성요인'이란 대상물건의 경제적 가치에 영향을 미치는 일반요인, 지역요인 및 개별요인을 말한다.\n③ '시장가치'란 통상적인 시장에서 충분한 기간 동안 거래를 위하여 공개된 후, 그 대상물건의 내용에 정통한 당사자 사이에 신중하고 자발적인 거래가 있을 경우 성립될 가능성이 가장 높다고 인정되는 대상물건의 가액을 말한다.\n④ '적산법'이란 대상물건의 재조달원가에 감가수정액을 공제하여 대상물건의 가액을 산정하는 감정평가방법을 말한다.\n⑤ '수익환원법'이란 대상물건이 장래 산출할 것으로 기대되는 순수익이나 미래의 현금흐름을 환원하거나 할인하여 대상물건의 가액을 산정하는 감정평가방법을 말한다.","2","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",11,0],[36,2025,11,74,1,"계약법","매매(계약금·담보책임·환매)","","부동산 가격공시에 관한 법률상 표준지공시지가의 효력으로 옳은 것은?\n① 토지시장의 지가정보를 제공한다.\n② 일반적인 토지거래의 지표가 된다.\n③ 국가·지방자치단체 등이 그 업무와 관련하여 지가를 산정하는 경우에 그 기준이 된다.\n④ 감정평가업자가 개별적으로 토지를 감정평가하는 경우에 그 기준이 된다.\n⑤ 개별공시지가를 산정하는 경우에 그 기준이 된다.","2","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",11,0],[36,2025,11,75,1,"민사특별법","주택임대차보호법","박스형(모두고르기)","부동산거래신고 등에 관한 법령상 외국인등의 부동산 취득 등에 관한 설명으로 옳은 것은?\n① 외국인등이 건축물의 개축으로 부동산을 취득하는 경우, 계약 외의 원인에 의한 취득이므로 신고대상이 아니다.\n② 외국인등이 경매로 대한민국 안의 부동산을 취득한 때에는 취득한 날부터 6개월 이내에 신고관청에 신고하여야 한다.\n③ 외국인등이 신고관청으로부터 부동산 취득 허가를 받지 아니하고 체결한 토지취득계약은 그 효력이 발생하지 아니한다.\n④ 외국인등이 군사기지 및 군사시설 보호구역 안의 토지를 취득하려는 경우, 계약 체결 전에 신고관청으로부터 토지취득 허가를 받아야 한다.\n⑤ 외국인등이 자연환경보전법에 따른 생태·경관보전지역 안의 토지를 취득하려는 경우, 계약 체결 전에 신고관청으로부터 토지취득 허가를 받아야 한다.","5","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",12,0],[36,2025,11,76,1,"민사특별법","집합건물법","판례, 틀린것 고르기","부동산거래신고 등에 관한 법령상 부동산거래계약 신고서 작성방법으로 옳은 것은?\n① 거래당사자가 외국인인 경우, 국적을 반드시 기재하여야 한다.\n② 거래대상 부동산이 공급가액과 부가가치세를 포함한 금액인 경우, 거래금액란에는 부가가치세를 제외한 금액을 적는다.\n③ 종전 부동산란은 입주권 매매의 경우에만 작성한다.\n④ 계약대상 면적에는 실제 거래면적을 계산하여 적되, 건축물 면적은 집합건축물의 경우 전용면적을 적는다.\n⑤ 거래당사자가 다수인 경우, 주소란에 대표자만 기재하고 나머지는 생략한다.","2","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",12,0],[36,2025,11,77,1,"민사특별법","가등기담보법","박스형(모두고르기), 판례, 계산","부동산거래신고 등에 관한 법령상 부동산거래신고에 관한 설명으로 옳은 것은?\n① 개업공인중개사가 거래계약서를 작성·교부한 경우, 거래당사자가 신고하여야 한다.\n② 신고관청은 신고내용을 확인하기 위하여 필요한 경우, 거래당사자에게 거래계약서 등 관련 자료의 제출을 요구할 수 있다.\n③ 부동산거래계약 신고를 받은 신고관청은 그 내용을 확인한 후 신고인에게 신고필증을 지체 없이 발급하여야 한다.\n④ 거래당사자는 부동산거래계약 신고를 한 후 해당 계약이 해제된 경우, 해제 등이 확정된 날부터 60일 이내에 신고관청에 공동으로 신고하여야 한다.\n⑤ 신고관청은 부동산거래신고 내용을 매 분기 종료일부터 1개월 이내에 시·도지사에게 보고하여야 한다.","3","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",12,0],[36,2025,11,78,1,"민사특별법","부동산실명법(명의신탁)","판례, 틀린것 고르기","주택임대차보호법상 임차인의 계약갱신요구권에 관한 설명으로 옳은 것은?\n① 임차인은 임대차기간이 끝나기 6개월 전부터 2개월 전까지의 기간에 계약갱신을 요구할 수 있다.\n② 임대인이 임차인의 동의 없이 임대주택에 거주하려는 경우에는 임차인의 계약갱신 요구를 거절할 수 있다.\n③ 임차인은 계약갱신요구권을 2회에 한하여 행사할 수 있다.\n④ 갱신되는 임대차의 존속기간은 1년으로 본다.\n⑤ 임대인이 실거주를 이유로 갱신을 거절하였음에도 불구하고, 정당한 사유 없이 제3자에게 임대한 경우 임대인은 임차인이 입은 손해를 배상하여야 한다.","5","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",12,0],[36,2025,11,79,1,"민사특별법","부동산실명법(명의신탁)","판례","상가건물 임대차보호법상 임차인의 권리금 회수기회 보호 등에 관한 설명으로 옳은 것은?\n① 임대인은 임대차기간이 끝나기 3개월 전부터 임대차 종료 시까지 권리금 계약에 따라 임차인이 주선한 신규임차인이 되려는 자로부터 권리금을 지급받는 것을 방해하여서는 아니 된다.\n② 임대인이 임차인이 주선한 신규임차인이 되려는 자와 임대차계약의 체결을 거절하는 행위는 어떠한 경우에도 방해행위로 본다.\n③ 임대인이 선택한 신규임차인이 임차인과 권리금 계약을 체결하고 그 권리금을 지급한 경우, 임대인은 임차인의 권리금 회수를 방해한 것으로 본다.\n④ 임차인이 주선한 신규임차인이 되려는 자가 보증금 또는 차임을 지급할 자력이 없는 경우, 임대인은 임대차계약 체결을 거절할 수 있다.\n⑤ 권리금 회수기회 보호 규정은 임대차 목적물인 상가건물을 1년 6개월 이상 영리목적으로 사용하지 아니한 경우에도 적용된다.","1","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",12,0],[36,2025,11,80,1,"민사특별법","상가건물임대차보호법","박스형(모두고르기), 판례, 옳은것 고르기","부동산 실권리자명의 등기에 관한 법률에 관한 설명으로 옳은 것은?\n① 명의신탁약정은 무효로 한다.\n② 명의신탁약정의 무효는 제3자에게 대항할 수 있다.\n③ 채무의 변제를 담보하기 위하여 채권자가 부동산에 관한 물권을 이전받는 경우, 채무변제 담보의 뜻을 등기부에 기재하여야 한다.\n④ 배우자 명의로 부동산에 관한 물권을 등기한 경우, 조세 포탈의 목적이 없더라도 무효이다.\n⑤ 종중이 보유한 부동산에 관한 물권을 종중 외의 자의 명의로 등기한 경우, 조세 포탈의 목적이 없으면 유효하다.","2","1_eY2XOgjZulIPd0IsEVsEEgexMnPYr9_",12,0],[36,2025,21,1,2,"공인중개사법","중개대상물·용어","틀린것 고르기","공인중개사법령상 용어의 정의로 틀린 것은?\n\n① 중개라 함은 이 법 제3조에 따른 중개대상물에 대하여 거래당사자간의 매매·교환·임대차 그 밖의 권리의 득실변경에 관한 행위를 알선하는 것을 말한다.\n\n② 공인중개사라 함은 이 법에 의한 공인중개사자격을 취득한 자를 말한다.\n\n③ 중개업이라 함은 다른 사람의 의뢰에 의하여 일정한 보수를 받고 중개를 업으로 행하는 것을 말한다.\n\n④ 개업공인중개사라 함은 이 법에 의하여 중개사무소의 개설등록을 한 자를 말한다.\n\n⑤ 소속공인중개사라 함은 개업공인중개사에 소속된 공인중개사로서 중개업무를 수행하는 자를 말하며, 개업공인중개사인 법인의 사원으로서 공인중개사인 자는 제외된다.","5","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",1,0],[36,2025,21,2,2,"공인중개사법","정책심의위원회·자격·시험","박스형(모두고르기)","공인중개사법령상 공인중개사자격증에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 공인중개사는 다른 사람에게 자기의 공인중개사자격증을 양도하여서는 아니된다.\nㄴ. 누구든지 다른 사람의 공인중개사자격증을 양수하여 이를 사용하여서는 아니된다.\nㄷ. 공인중개사는 다른 공인중개사가 공인중개사자격증을 대여하는 것을 알선할 수 있다.\n\n① ㄱ\n\n② ㄱ, ㄴ\n\n③ ㄱ, ㄷ\n\n④ ㄴ, ㄷ\n\n⑤ ㄱ, ㄴ, ㄷ","2","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",1,0],[36,2025,21,3,2,"공인중개사법","중개사무소 개설등록·결격사유","틀린것 고르기","공인중개사법령상 중개사무소의 개설등록 및 등록의 결격사유 등에 관한 설명으로 틀린 것은?\n\n① 개업공인중개사는 다른 개업공인중개사의 중개보조원이 될 수 있다.\n\n② 피성년후견인은 중개사무소의 개설등록을 할 수 없다.\n\n③ 공인중개사(소속공인중개사는 제외) 또는 법인이 아닌 자는 중개사무소의 개설등록을 신청할 수 없다.\n\n④ 자본금이 3천만원인 「상법」상 회사는 다른 법률의 규정이 있는 경우를 제외하고, 중개사무소의 개설등록을 할 수 없다.\n\n⑤ 금고 이상의 형의 집행유예를 받고 그 유예기간이 만료된 날부터 2년이 지나지 아니한 자는 소속공인중개사가 될 수 없다.","1","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",1,0],[36,2025,21,4,2,"공인중개사법","중개사무소·분사무소·인장·게시","틀린것 고르기","공인중개사법령상 인장의 등록에 관한 설명으로 틀린 것은?\n\n① 개업공인중개사는 중개사무소 개설등록신청을 하면서 동시에 인장을 등록하여야 한다.\n\n② 소속공인중개사는 업무를 개시하기 전에 중개행위에 사용할 인장을 등록관청에 등록하여야 한다.\n\n③ 분사무소가 없는 법인인 개업공인중개사는 「상업등기규칙」에 따라 신고한 법인의 인장을 등록관청에 등록하여야 한다.\n\n④ 법인인 개업공인중개사의 분사무소에서 사용할 인장의 경우에는 「상업등기규칙」에 따라 법인의 대표자가 보증하는 인장을 등록할 수 있다.\n\n⑤ 등록관청에 등록한 인장을 변경한 개업공인중개사는 변경일부터 7일 이내에 그 변경된 인장을 등록관청에 등록하여야 한다.","1","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",1,0],[36,2025,21,5,2,"공인중개사법","표시·광고","박스형(모두고르기)","공인중개사법령상 인터넷 표시·광고 모니터링 등에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 국토교통부장관은 「공공기관의 운영에 관한 법률」 제4조에 따른 공공기관에 모니터링 업무를 위탁할 수 있다.\nㄴ. 모니터링 기관은 기본 모니터링 업무에 관한 결과보고서를 해당 모니터링 업무를 완료한 날부터 15일 이내에 국토교통부장관에게 제출해야 한다.\nㄷ. 국토교통부장관은 모니터링 기관으로부터 모니터링 업무에 관하여 제출받은 결과보고서를 시·도지사 및 등록관청 등에 통보하고 필요한 조사 및 조치를 요구할 수 있다.\n\n① ㄴ\n\n② ㄷ\n\n③ ㄱ, ㄴ\n\n④ ㄱ, ㄷ\n\n⑤ ㄱ, ㄴ, ㄷ","4","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",1,0],[36,2025,21,6,2,"공인중개사법","중개사무소·분사무소·인장·게시","박스형(모두고르기)","공인중개사법령상 중개사무소의 설치기준에 관한 설명으로 옳은 것을 모두 고른 것은?(단, 다른 법률의 규정은 고려하지 않음)\nㄱ. 법인이 아닌 개업공인중개사는 그 등록관청의 관할 구역안에 중개사무소를 두되, 1개의 중개사무소만을 둘 수 있다.\nㄴ. 개업공인중개사는 천막 그 밖에 이동이 용이한 임시 중개시설물을 설치하여서는 아니된다.\nㄷ. 분사무소를 설치하려는 개업공인중개사는 분사무소설치신고서를 분사무소의 소재지를 관할하는 등록관청에 제출하여야 한다.\n\n① ㄱ\n\n② ㄷ\n\n③ ㄱ, ㄴ\n\n④ ㄴ, ㄷ\n\n⑤ ㄱ, ㄴ, ㄷ","3","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",1,0],[36,2025,21,7,2,"공인중개사법","중개사무소·분사무소·인장·게시","틀린것 고르기","공인중개사법령상 명칭 및 중개대상물의 표시·광고 등에 관한 설명으로 틀린 것은?\n① 개업공인중개사가 아닌 자는 “부동산중개”라는 명칭을 사용하여서는 아니된다.\n② 개업공인중개사가 아닌 자는 중개대상물에 대한 표시·광고를 사용하여서는 아니된다.\n③ 개업공인중개사는 중개대상물이 존재하지만 실제로 중개의 대상이 될 수 없는 중개대상물에 대한 표시·광고를 사용하여서는 아니된다.\n④ 등록관청은 개업공인중개사의 성명의 표기방법을 위반한 중개사무소의 벽면 이용간판에 대하여 철거를 명할 수 있다.\n⑤ 개업공인중개사가 의뢰받은 중개대상물에 대하여 표시·광고를 하려면 개업공인중개사 및 중개보조원에 관한 사항을 명시하여야 한다.","5","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",2,0],[36,2025,21,8,2,"공인중개사법","거래정보망·기타","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 법인인 개업공인중개사가 겸업할 수 있는 업무에 해당하는 것을 모두 고른 것은?(단, 다른 법률의 규정은 고려하지 않음) ㄱ. 상업용 건축물의 분양대행 ㄴ. 부동산의 개발에 관한 상담 ㄷ. 상업용 건축물의 관리대행\n① ㄴ\n② ㄱ, ㄴ\n③ ㄱ, ㄷ\n④ ㄴ, ㄷ\n⑤ ㄱ, ㄴ, ㄷ","5","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",2,0],[36,2025,21,9,2,"공인중개사법","중개사무소·분사무소·인장·게시","","공인중개사법령상 중개사무소의 이전신고 및 휴업 또는 폐업의 신고 등에 관한 설명으로 옳은 것은?\n① 개업공인중개사가 출산하는 경우에는 6개월을 초과하여 휴업할 수 있다.\n② 개업공인중개사는 등록관청의 관할 지역 외의 지역으로 중개사무소를 이전한 때에는 이전한 날부터 10일 이내에 이전하기 전의 등록관청에 이전사실을 신고해야 한다.\n③ 법인인 개업공인중개사는 분사무소를 두었더라도 폐업신고는 분사무소별로 하여서는 아니된다.\n④ 개업공인중개사가 3개월을 초과하여 휴업한 부동산중개업을 재개하려는 경우 신고서에 중개사무소등록증을 첨부하여 등록관청에 미리 신고해야 한다.\n⑤ 관할 세무서장이 「부가가치세법 시행령」에 따라 중개업 폐업신고서를 받아 해당 등록관청에 송부하였더라도 등록관청에 그 폐업신고서가 제출된 것으로 보지 않는다.","1","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",2,0],[36,2025,21,10,2,"공인중개사법","확인·설명(서)","판례, 틀린것 고르기","공인중개사법령상 중개대상물의 확인·설명에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 개업공인중개사는 중개를 의뢰받은 경우 중개가 완성되기 전에 중개대상물에 관한 확인·설명을 해야 한다.\n② 개업공인중개사는 중개가 완성되어 거래계약서를 작성하는 때에는 중개대상물 확인·설명서를 작성해야 한다.\n③ 개업공인중개사는 자기가 조사·확인하여 설명할 의무가 없는 사항이라도 중개의뢰인이 계약을 맺을지를 결정하는 중요한 것이라면 그에 관해 그릇된 정보를 제공해서는 아니된다.\n④ 아파트인 공동주택 임대차 중개의 경우 관리비 금액과 그 산출내역은 개업공인중개사가 확인·설명해야 하는 사항이 아니다.\n⑤ 중개의뢰인이 개업공인중개사에게 소정의 보수를 지급하지 아니하였다고 해서 개업공인중개사의 확인·설명의무와 이에 위반한 경우의 손해배상의무가 당연히 소멸되는 것이 아니다.","4","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",2,0],[36,2025,21,11,2,"공인중개사법","거래계약서","박스형(모두고르기)","공인중개사법령상 거래계약서의 작성 등에 관한 설명으로 옳은 것을 모두 고른 것은? ㄱ. 국토교통부장관은 개업공인중개사가 작성하는 거래계약서의 표준이 되는 서식을 정하여 그 사용을 권장할 수 있다. ㄴ. 계약일과 중개대상물확인·설명서 교부일자는 거래계약서에 기재하여야 하는 사항이다. ㄷ. 개업공인중개사가 거래계약서를 작성한 경우 그 원본, 사본 또는 전자문서를 보존하여야 하는 기간은 3년이다.\n① ㄱ\n② ㄷ\n③ ㄱ, ㄴ\n④ ㄴ, ㄷ\n⑤ ㄱ, ㄴ, ㄷ","3","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",2,0],[36,2025,21,12,2,"공인중개사법","중개계약(일반·전속)","","공인중개사법령상 중개계약에 관한 설명으로 옳은 것은?\n① 전속중개계약의 유효기간은 당사자간에 다른 약정이 있더라도 3개월을 초과할 수 없다.\n② 개업공인중개사는 전속중개계약을 체결한 때에는 해당 계약서를 5년 동안 보존하여야 한다.\n③ 중개의뢰인은 개업공인중개사에게 중개대상물의 규모를 기재한 일반중개계약서의 작성을 요청할 수 있다.\n④ 임대차에 관한 전속중개계약을 체결한 개업공인중개사는 중개대상물에 관한 정보 중 공시지가를 공개하여야 한다.\n⑤ 개업공인중개사가 전속중개계약을 체결한 경우 해당 중개대상물의 도배상태에 대하여 중개의뢰인이 비공개를 요청하더라도 그 정보를 공개해야 한다.","3","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",2,0],[36,2025,21,13,2,"공인중개사법","중개보수·실비","틀린것 고르기","공인중개사법령상 개업공인중개사의 중개보수에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 주택(부속토지 포함)의 중개에 대한 보수는 국토교통부령으로 정하는 범위 안에서 시·도의 조례로 정한다.\n② 중개대상물인 건축물 중 주택의 면적이 2분의 1미만인 경우에는 주택 외의 중개대상물에 대한 중개보수 규정을 적용한다.\n③ 주택 외의 중개대상물의 소재지와 중개사무소의 소재지가 다른 경우 중개사무소의 소재지를 관할하는 시·도의 조례에서 정한 기준에 따라 중개보수를 받아야 한다.\n④ 거래금액의 계산에 있어 동일한 중개대상물에 대하여 동일 당사자간에 매매를 포함한 둘 이상의 거래가 동일 기회에 이루어지는 경우 매매계약에 관한 거래금액만을 적용한다.\n⑤ 아파트 분양권의 매매를 중개한 경우 당사자가 거래 당시 수수하게 되는 총 대금을 거래금액으로 보아야 한다.","3","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",2,0],[36,2025,21,14,2,"공인중개사법","거래정보망·기타","박스형(모두고르기)","공인중개사법령상 부동산거래정보망의 지정 및 이용에 관한 설명으로 옳은 것을 모두 고른 것은? ㄱ. 부동산거래정보망을 설치·운영할 자로 지정받으려는 자는 정보처리기사 2명 이상을 확보하여야 한다. ㄴ. 국토교통부장관은 거래정보사업자가 정당한 사유 없이 지정받은 날부터 1년 이내에 부동산거래정보망을 설치·운영하지 아니하는 경우에는 그 지정을 취소할 수 있다. ㄷ. 부동산거래정보망을 설치·운영할 자로 지정받으려는 자가 국토교통부장관에게 제출하여야 할 서류에는 공인중개사 자격증 사본이 포함된다.\n① ㄱ\n② ㄴ\n③ ㄱ, ㄷ\n④ ㄴ, ㄷ\n⑤ ㄱ, ㄴ, ㄷ","4","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",3,0],[36,2025,21,15,2,"공인중개사법","금지행위·거래질서","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 개업공인중개사의 금지행위에 해당하는 것을 모두 고른 것은? ㄱ. 중개대상물의 매매를 업으로 하는 행위 ㄴ. 무등록 중개업을 영위하는 자인 사실을 알면서 그를 통하여 중개를 의뢰받는 행위 ㄷ. 제3자에게 부당한 이익을 얻게 할 목적으로 거짓으로 거래가 완료된 것처럼 꾸미는 등 중개대상물의 시세에 부당한 영향을 주는 행위\n① ㄱ\n② ㄱ, ㄴ\n③ ㄱ, ㄷ\n④ ㄴ, ㄷ\n⑤ ㄱ, ㄴ, ㄷ","5","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",3,0],[36,2025,21,16,2,"공인중개사법","거래정보망·기타","틀린것 고르기","공인중개사법령상 공인중개사의 자격을 취소하여야 하는 경우가 아닌 것은?\n① 공인중개사 자격정지처분을 받은 자가 그 자격정지기간 중에 중개업무를 행한 경우\n② 공인중개사 자격정지처분을 받은 자가 자격정지기간 중에 다른 개업공인중개사의 소속공인중개사가 되는 경우\n③ 공인중개사 자격정지처분을 받은 자가 자격정지기간 중에 법인인 개업공인중개사의 임원이 되는 경우\n④ 공인중개사가 직무와 관련하여 벌금형을 선고받은 경우\n⑤ 공인중개사가 다른 사람에게 자기의 성명을 사용하여 중개업무를 하게 한 경우","4","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",3,0],[36,2025,21,17,2,"공인중개사법","고용인(소속공인중개사·중개보조원)","박스형(모두고르기)","공인중개사법령상 시·도지사가 소속공인중개사의 공인중개사 자격을 정지할 수 있는 경우를 모두 고른 것은? ㄱ. 중개의뢰인과 직접 거래를 하는 행위를 한 경우 ㄴ. 해당 중개대상물의 거래상의 중요사항에 관하여 거짓된 언행으로 중개의뢰인의 판단을 그르치게 하는 행위를 한 경우 ㄷ. 하나의 거래계약에 대하여 서로 다른 둘 이상의 거래계약서를 작성한 경우\n① ㄴ\n② ㄱ, ㄴ\n③ ㄱ, ㄷ\n④ ㄴ, ㄷ\n⑤ ㄱ, ㄴ, ㄷ","5","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",3,0],[36,2025,21,18,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 개업공인중개사의 행위로서 중개사무소 개설등록 취소사유에 해당하는 것을 모두 고른 것은? ㄱ. 다른 사람에게 자기의 중개사무소등록증을 대여한 경우 ㄴ. 최근 1년 이내에 이 법에 의하여 2회 이상 업무정지처분을 받고 다시 업무정지처분에 해당하는 행위를 한 경우 ㄷ. 국토교통부령으로 정하는 전속중개계약서에 의하지 아니하고 전속중개계약을 체결한 경우\n① ㄱ\n② ㄱ, ㄴ\n③ ㄱ, ㄷ\n④ ㄴ, ㄷ\n⑤ ㄱ, ㄴ, ㄷ","2","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",3,0],[36,2025,21,19,2,"공인중개사법","교육·협회·공제","틀린것 고르기","공인중개사법령상 공인중개사협회(이하 “협회”라 함)의 공제규정에 관한 설명으로 틀린 것은?\n① 협회는 개업공인중개사의 손해배상책임을 보장하기 위하여 공제사업을 하고자 하는 때에는 공제규정을 제정하여야 한다.\n② 협회가 공제규정을 제정 또는 변경하는 경우에는 국토교통부장관의 승인을 얻어야 한다.\n③ 공제사업의 부대업무로서 공제규정으로 정하는 사업도 협회의 공제사업에 해당한다.\n④ 공제사업의 범위, 공제계약의 내용, 공제금, 공제료, 회계기준 등 공제사업의 운용에 관하여 필요한 사항은 공제규정으로 정한다.\n⑤ 책임준비금의 적립비율은 공제규정으로 정하되, 공제료 수입액의 100분의 20이상이 되도록 하여야 한다.","5","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",3,0],[36,2025,21,20,2,"공인중개사법","거래정보망·기타","틀린것 고르기","공인중개사법령상 수수료를 납부하여야 하는 자에 해당하지 않는 것은?(단, 조례의 내용은 고려하지 않음)\n① 중개사무소의 개설등록을 신청하는 자\n② 중개사무소등록증의 재교부를 신청하는 자\n③ 분사무소설치의 신고를 하는 자\n④ 개업공인중개사의 등록인장을 변경 신고하는 자\n⑤ 분사무소설치신고확인서의 재교부를 신청하는 자","4","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",3,0],[36,2025,21,21,2,"공인중개사법","벌칙·과태료·포상금","박스형(모두고르기)","공인중개사법령상 포상금에 관한 설명으로 옳은 것을 모두 고른 것은? ㄱ. 포상금을 지급받으려는 자는 포상금지급신청서를 국토교통부장관에게 제출하여야 한다. ㄴ. 포상금은 수사기관에 고발한 자에게 그 사건에 대해 검사가 공소제기의 결정을 한 경우에 한하여 지급한다. ㄷ. 포상금은 1건당 50만원으로 한다.\n① ㄱ\n② ㄷ\n③ ㄱ, ㄴ\n④ ㄴ, ㄷ\n⑤ ㄱ, ㄴ, ㄷ","2","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",3,0],[36,2025,21,22,2,"공인중개사법","금지행위·거래질서","박스형(모두고르기)","공인중개사법령상 부동산거래질서교란행위 신고센터(이하 “신고센터”라 함)에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 국토교통부장관은 부동산 시장의 건전한 거래질서를 조성하기 위하여 신고센터를 설치·운영할 수 있다.\nㄴ. 국토교통부장관은 신고센터의 업무를 「한국산업인력공단법」에 따른 한국산업인력공단에 위탁한다.\nㄷ. 누구든지 부동산거래질서교란행위를 발견하는 경우 그 사실을 신고센터에 신고할 수 있다.\n\n① ㄱ\n\n② ㄴ\n\n③ ㄱ, ㄷ\n\n④ ㄴ, ㄷ\n\n⑤ ㄱ, ㄴ, ㄷ","3","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",4,0],[36,2025,21,23,2,"공인중개사법","벌칙·과태료·포상금","옳은것 고르기","공인중개사법령상 과태료 부과 대상자에 해당하는 것은?\n\n① 다른 사람의 공인중개사자격증을 대여받은 자\n\n② 중개사무소의 개설등록을 하지 아니하고 중개업을 한 자\n\n③ 공인중개사가 아닌 자로서 공인중개사 또는 이와 유사한 명칭을 사용한 자\n\n④ 개업공인중개사가 아닌 자로서 중개업을 하기 위하여 중개대상물에 대한 표시·광고를 한 자\n\n⑤ 개업공인중개사로서 중개대상물의 확인·설명의 의무를 이행하면서 설명의 근거자료를 제시하지 아니한 자","5","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",4,0],[36,2025,21,24,2,"부동산거래신고법","부동산 거래신고","","부동산 거래신고 등에 관한 법령상 부동산 거래의 신고에 관한 설명으로 옳은 것은?\n\n① 「산업입지 및 개발에 관한 법률」에 따른 토지에 대한 공급계약은 거래신고의 대상이다.\n\n② 자연인과 지방자치단체가 건축물의 매매계약을 체결한 경우 자연인이 거래신고를 하여야 한다.\n\n③ 개업공인중개사가 거래계약서를 작성·교부한 경우에는 거래당사자 또는 해당 개업공인중개사가 거래신고를 할 수 있다.\n\n④ 부동산의 매수인은 신고인이 부동산거래계약 신고서를 제출한 때에 「부동산등기 특별조치법」에 따른 검인을 받은 것으로 본다.\n\n⑤ 거래당사자 중 일방이 신고를 거부하여 단독으로 거래신고를 하는 경우 신고기간은 거래계약의 체결일부터 60일이다.","1","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",4,0],[36,2025,21,25,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기, 계산","부동산 거래신고 등에 관한 법령상 법인이 주택법에 따라 5억원인 주택의 공급계약을 체결한 경우의 부동산 거래 신고사항에 해당하지 않는 것은?\n\n① 실제 거래가격\n\n② 계약 체결일\n\n③ 법인의 등기 현황\n\n④ 계약의 조건이 있는 경우 그 조건\n\n⑤ 중도금 지급일 및 잔금 지급일","3","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",4,0],[36,2025,21,26,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기","부동산 거래신고 등에 관한 법령상 징역 또는 벌금에 처해질 수 있는 자가 아닌 것은?\n\n① 부당하게 재물이나 재산상 이득을 취할 목적으로 거짓으로 부동산 거래신고를 하는 행위를 조장한 자\n\n② 토지취득의 허가를 받아야 함에도 허가를 받지 아니하고 토지취득계약을 체결한 대한민국의 국적을 보유하고 있지 아니한 개인\n\n③ 토지거래허가구역에서 허가를 받아야 함에도 허가를 받지 아니하고 토지거래계약을 체결한 자\n\n④ 토지거래허가구역에서 속임수나 그 밖의 부정한 방법으로 토지거래계약 허가를 받은 자\n\n⑤ 토지거래계약 허가를 받은 자가 그 토지를 허가받은 목적대로 이용하지 않음을 이유로 관할 행정청이 한 조치명령을 위반한 자","1","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",4,0],[36,2025,21,27,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기","부동산 거래신고 등에 관한 법령상 부동산 거래의 신고 내용에 대한 검증 및 조사에 관한 설명으로 틀린 것은?\n\n① 신고관청으로부터 신고 내용의 검증 결과를 통보받은 세무서장은 해당 신고 내용을 국세 또는 지방세 부과를 위한 과세자료로 활용할 수 있다.\n\n② 신고관청은 신고내용조사를 위하여 「공인중개사법」에 따른 공인중개사의 자격취소, 자격정지, 등록취소 및 업무정지에 관한 자료를 관계 행정기관의 장에게 요청할 수 있다.\n\n③ 국토교통부장관은 신고 받은 내용의 확인을 위하여 필요할 때에는 신고내용조사를 직접 또는 신고관청과 공동으로 실시할 수 있다.\n\n④ 군수 또는 구청장이 신고 내용을 조사한 경우 그 조사결과를 국토교통부장관에게 보고하여야 한다.\n\n⑤ 신고관청은 신고 내용을 조사하기 위하여 거래당사자 또는 개업공인중개사에게 거래대금의 지급을 확인할 수 있는 입금표 또는 통장사본의 제출을 요구할 수 있다.","4","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",4,0],[36,2025,21,28,2,"부동산거래신고법","토지거래허가","박스형(모두고르기)","부동산 거래신고 등에 관한 법령상 토지거래계약을 허가받은 자에게 부과되는 토지의 이용 의무에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 자기의 거주용 주택용지로 이용하려는 목적으로 토지거래계약의 허가를 받은 경우 토지 취득일부터 4년간 토지의 이용 의무가 있다.\nㄴ. 이행강제금은 이행명령이 이행될 때까지 반복하여 부과할 수 있으며, 토지의 이용 의무기간이 지난 후에도 부과할 수 있다.\nㄷ. 시장·군수 또는 구청장은 토지의 이용 의무 불이행에 따른 이행명령을 받은 자가 그 명령을 이행하는 경우에도 명령을 이행하기 전에 이미 부과된 이행강제금은 징수하여야 한다.\n\n① ㄱ\n\n② ㄷ\n\n③ ㄱ, ㄴ\n\n④ ㄴ, ㄷ\n\n⑤ ㄱ, ㄴ, ㄷ","2","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",4,0],[36,2025,21,29,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기","부동산 거래신고 등에 관한 법령상 A광역시 B구에 소재한 X토지에 대한 내국인 간의 부동산 거래의 신고에 관한 설명으로 틀린 것은?\n\n① X토지에 대한 임대차계약을 체결하는 경우에는 부동산 거래신고를 하지 않아도 된다.\n\n② X토지에 대한 부동산 거래계약의 신고를 하는 경우 신고관청은 B구의 구청장이 된다.\n\n③ 부동산거래계약시스템을 통하여 X토지에 대한 매매계약을 체결한 경우에는 매매계약이 체결된 때에 부동산 거래신고를 위한 부동산거래계약 신고서를 제출한 것으로 본다.\n\n④ X토지에 대한 부동산 거래계약 신고 내용 중 계약의 조건이 변경된 경우에는 「부동산등기법」에 따른 부동산에 관한 등기신청 후에 신고관청에 신고 내용의 변경을 신고하여야 한다.\n\n⑤ X토지에 대한 매매계약서를 개업공인중개사가 작성·교부한 경우 개업공인중개사의 인적사항은 부동산 거래 신고사항에 해당한다.","4","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",5,0],[36,2025,21,30,2,"부동산거래신고법","주택임대차계약 신고","계산","임대인 甲과 임차인 乙은 주택임대차보호법에 따른 X주택에 대해 보증금 1억원의 임대차 계약을 체결하였다. 부동산 거래신고 등에 관한 법령상 주택 임대차 계약의 신고에 관한 설명으로 옳은 것은?(단, 甲과 乙은 자연인임)\n\n① X주택이 경상북도의 관할구역에 있는 군에 소재한 경우에는 주택 임대차 계약의 신고를 하여야 한다.\n\n② 甲과 乙의 임대차 계약이 종전의 보증금을 그대로 유지하면서 임대차 기간만 연장하는 갱신계약 경우에도 주택 임대차 계약의 신고를 하여야 한다.\n\n③ 甲이 주택 임대차 계약의 신고를 거부하여 乙이 단독으로 신고하는 경우 乙은 신분증명서를 신고관청에 보여줘야 한다.\n\n④ 甲과 乙이 공동으로 주택 임대차 계약의 신고를 한 후 해당 계약의 보증금이 8천만원으로 감액된 경우에는 변경신고를 하지 않아도 된다.\n\n⑤ 甲이 「부동산 거래신고 등에 관한 법률」에 따른 주택 임대차 계약의 신고를 한 경우 「주민등록법」에 따라 전입신고를 한 것으로 본다.","3","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",5,0],[36,2025,21,31,2,"부동산거래신고법","외국인 등의 부동산 취득","틀린것 고르기","부동산 거래신고 등에 관한 법령상 외국인등이 대한민국 안의 부동산을 취득한 경우 “부동산을 취득한 날부터 6개월 이내에” 취득 신고를 하여야 하는 것으로 규정된 취득원인이 아닌 것은?\n\n① 상속\n\n② 증여\n\n③ 법원의 확정판결\n\n④ 건축물의 증축\n\n⑤ 법률에 따른 환매권의 행사","2","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",5,0],[36,2025,21,32,2,"중개실무","분묘기지권·장사법","판례, 틀린것 고르기","개업공인중개사가 분묘기지권의 제한을 받는 토지를 매수하려는 중개의뢰인에게 분묘기지권에 관하여 설명한 내용으로 틀린 것은?(다툼이 있으면 판례에 따름)\n\n① 분묘기지권에는 특별한 사정이 없는 한 그 효력이 미치는 지역의 범위 내에 기존의 분묘 외에 새로운 분묘를 신설할 권능도 포함된다.\n\n② 분묘기지권을 이미 시효로 취득한 경우 그 분묘기지권자는 이를 등기하지 않더라도 제3자에게 대항할 수 있다.\n\n③ 분묘가 멸실되었다고 하더라도 유골이 존재하여 분묘의 원상회복이 가능하고 일시적인 멸실에 불과하다면, 분묘기지권은 소멸하지 않고 존속한다.\n\n④ 분묘기지권은 특별한 사정이 없는 한 분묘의 기지 자체뿐만 아니라 분묘의 설치 목적인 분묘의 수호와 제사에 필요한 범위 내에서 분묘 기지 주위의 공지를 포함한 지역에까지 미친다.\n\n⑤ 토지 소유자의 승낙에 의하여 성립하는 분묘기지권의 경우 성립 당시 그 소유자와 분묘의 수호·관리자가 지료 지급의무의 존부나 범위 등에 관하여 약정을 하였다면 그 약정의 효력은 분묘 기지의 승계인에 대하여도 미친다.","1","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",5,0],[36,2025,21,33,2,"공인중개사법","확인·설명(서)","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 중개대상물 확인·설명서[I](주거용 건축물) 서식의 기재내용으로 개업공인중개사 기본 확인사항 중 임대차 확인사항에 해당하는 것을 모두 고른 것은?\nㄱ. 국세 및 지방세 체납정보\nㄴ. 민간임대등록 여부\nㄷ. 현장안내 중개보조원 신분 고지 여부\nㄹ. 계약갱신 요구권 행사 여부\n\n① ㄱ, ㄷ\n\n② ㄴ, ㄹ\n\n③ ㄱ, ㄴ, ㄹ\n\n④ ㄴ, ㄷ, ㄹ\n\n⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",5,0],[36,2025,21,34,2,"공인중개사법","중개보수·실비","빈칸","공인중개사법령상 중개보수의 한도에 관하여 ( )에 들어갈 내용으로 옳은 것은?\n전용면적이 85제곱미터 이하이고, 상·하수도 시설이 갖추어진 전용입식 부엌, 전용수세식 화장실 및 목욕시설(전용수세식 화장실에 목욕시설을 갖춘 경우 포함)을 갖춘 「건축법 시행령」에 따른 오피스텔의 중개보수는 중개의뢰인 쌍방으로부터 각각 받되, 매매·교환은 거래금액의 ( ㄱ ), 임대차 등은 거래금액의 ( ㄴ ) 범위에서 결정한다.\n\n① ㄱ: 1천분의 4, ㄴ: 1천분의 3\n\n② ㄱ: 1천분의 5, ㄴ: 1천분의 4\n\n③ ㄱ: 1천분의 6, ㄴ: 1천분의 5\n\n④ ㄱ: 1천분의 9, ㄴ: 1천분의 8\n\n⑤ ㄱ: 1천분의 9, ㄴ: 1천분의 9","2","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",5,0],[36,2025,21,35,2,"중개실무","경매·매수신청대리","틀린것 고르기","공인중개사의 매수신청대리인 등록 등에 관한 규칙상 매수신청대리에 관한 설명으로 틀린 것은?\n\n① 매수신청대리인으로 등록된 개업공인중개사가 매수신청대리의 위임을 받은 경우 「민사집행법」에 따른 공유자의 우선매수신고를 할 수 있다.\n\n② 소속공인중개사는 매수신청대리인으로 등록할 수 없다.\n\n③ 개업공인중개사는 매수신청대리 위임계약을 체결한 경우 확인·설명 사항을 서면으로 작성하여 서명날인한 후 위임인에게 교부하고, 그 사본을 3년간 보존하여야 한다.\n\n④ 개업공인중개사는 매수신청대리에 관하여 위임인으로부터 보수를 받은 경우 예규에서 정한 양식에 의한 영수증을 작성하여 서명날인한 후 위임인에게 교부하여야 한다.\n\n⑤ 부동산중개업의 폐업신고로 매수신청대리인 등록이 취소된 자는 등록이 취소된 후 3년이 지나지 아니하더라도 매수신청대리인 등록을 할 수 있다.","3","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",6,0],[36,2025,21,36,2,"중개실무","경매·매수신청대리","틀린것 고르기","개업공인중개사가 민사집행법에 의한 경매에 관하여 중개의뢰인에게 설명한 내용으로 틀린 것은?\n\n① 등기된 임차권은 저당권·압류채권·가압류채권에 대항할 수 없는 경우에도 매각으로 소멸되지 않는다.\n\n② 공인중개사인 개업공인중개사는 매수신청대리인으로 등록하지 않더라도 「민사집행법」에 의한 경매대상 부동산에 대한 권리분석 및 취득의 알선을 할 수 있다.\n\n③ 차순위매수신고는 그 신고액이 최고가매수신고액에서 그 보증액을 뺀 금액을 넘는 때에만 할 수 있다.\n\n④ 매각 부동산에 대한 인도명령의 신청은 매수인이 대금을 낸 뒤 6개월 이내에 하여야 한다.\n\n⑤ 재매각절차에서는 전(前)의 매수인은 매수신청을 할 수 없으며 매수신청의 보증을 돌려 줄 것을 요구하지 못한다.","1","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",6,0],[36,2025,21,37,2,"중개실무","명의신탁·실무 기타","박스형(모두고르기)","개업공인중개사가 부동산을 매수하려는 중개의뢰인에게 부동산 실권리자명의 등기에 관한 법령에 관하여 설명한 내용으로 옳은 것을 모두 고른 것은?\nㄱ. 3천만원의 이행강제금을 부과받은 자는 3천만원 전부에 대해 물납(物納)할 수 있다.\nㄴ. 명의수탁자는 과징금 부과대상자가 되며, 과징금을 부과받으면 지체 없이 해당 부동산에 관한 물권을 명의신탁자의 명의로 등기하여야 한다.\nㄷ. 3천만원의 과징금 납부의무자가 과징금 납부기한을 연장받고자 하는 경우에는 과징금 납부를 통지받은 날부터 30일 이내에 해당 특별자치도지사·특별자치시장·시장·군수 또는 구청장에게 연장신청을 하여야 한다.\n\n① ㄱ\n\n② ㄷ\n\n③ ㄱ, ㄴ\n\n④ ㄴ, ㄷ\n\n⑤ ㄱ, ㄴ, ㄷ","2","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",6,0],[36,2025,21,38,2,"공인중개사법","거래정보망·기타","","개업공인중개사가 중개의뢰인에게 상가건물 임대차보호법에 관하여 설명한 내용으로 옳은 것은?(단, 다른 사정은 고려하지 않음)\n\n① 경제사정의 변동을 이유로 인정되는 차임증액에 관한 청구는 약정한 차임의 증액이 있은 후 1년 이내에도 할 수 있다.\n\n② 임차인이 임차건물에 대하여 보증금반환청구소송의 확정판결에 의하여 경매를 신청하는 경우 반대의무의 이행을 집행개시의 요건으로 한다.\n\n③ 임차인의 계약갱신요구권은 최초의 임대차기간을 포함한 전체 임대차기간이 5년을 초과하지 아니하는 범위에서만 행사할 수 있다.\n\n④ 임대인의 변경이 없는 경우 임차인의 차임연체액이 3기의 차임액에 달하는 때에는 임대인은 계약을 해지할 수 있다.\n\n⑤ 경제사정의 중대한 변동으로 인한 폐업으로 임차인에게 해지권이 인정되는 경우 그 해지는 임대인이 계약해지의 통고를 받은 날부터 효력이 발생한다.","4","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",6,0],[36,2025,21,39,2,"중개실무","분묘기지권·장사법","틀린것 고르기","개업공인중개사가 토지를 매수하려는 중개의뢰인에게 장사 등에 관한 법령에 관하여 설명한 내용으로 틀린 것은?\n\n① 개인묘지는 30제곱미터를 초과하여 새로 설치할 수 없다.\n\n② 「상법」상 회사는 법인묘지의 설치·관리의 허가를 받을 수 있다.\n\n③ 가족묘지에 매장을 한 자는 매장 후 30일 이내에 매장지를 관할하는 시장등에게 신고하여야 한다.\n\n④ 문중묘지를 설치·관리하려는 자는 해당 묘지를 관할하는 시장등의 허가를 받아야 한다.\n\n⑤ 사설묘지를 설치·관리하는 자는 70세 이상인 자가 사망하기 전에 자신의 묘지로 사용하기 위해 그 사설묘지에 대한 매매를 요청한 경우에는 그 매매를 할 수 있다.","2","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",6,0],[36,2025,21,40,2,"중개실무","주택·상가 임대차 실무","","개업공인중개사가 중개의뢰인에게 주택임대차보호법의 내용에 관하여 설명한 것으로 옳은 것을 모두 고른 것은?(단, 임차인은 자연인이며 다른 사정은 고려하지 않음)\nㄱ. 임대인은 거짓이나 그 밖의 부정한 방법으로 임차한 임차인의 계약갱신 요구를 거절할 수 없다.\nㄴ. 임차인에게 인정되는 계약갱신요구권은 2회까지 행사할 수 있다.\nㄷ. 대항력이 없는 임차권은 「민사집행법」에 따른 경매로 그 임차주택이 경락되면 소멸한다.\n\n① ㄱ\n\n② ㄷ\n\n③ ㄱ, ㄴ\n\n④ ㄴ, ㄷ\n\n⑤ ㄱ, ㄴ, ㄷ","2","1w7aHNGcCMaqTj9jqxqhJdHPwyniazWLZ",6,0],[36,2025,21,41,3,"국토계획법","도시·군관리계획·기본계획","틀린것 고르기","민법상 상속에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 피상속인은 유언으로 상속재산의 분할방법을 정할 수 있다.\n\n② 공동상속인 중 피상속인으로부터 재산의 증여를 받은 자가 있는 경우, 그 수증재산이 자기의 상속분에 달하지 못한 때에는 그 부족한 부분의 한도에서 상속분이 있다.\n\n③ 상속재산의 분할은 상속이 개시된 때에 소급하여 그 효력이 있으나, 제3자의 권리를 해하지 못한다.\n\n④ 공동상속인 중 1인이 상속을 포기한 경우, 그 포기한 상속분은 다른 상속인의 상속분에 비례하여 귀속된다.\n\n⑤ 유언에 의한 상속재산 분할금지의 기간은 5년을 넘지 못한다.","3","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",7,0],[36,2025,21,42,3,"국토계획법","지구단위계획","","甲은 乙에게 1억 원을 대여하면서 乙 소유의 X토지에 근저당권을 설정받았다. 그 후 丙이 X토지에 저당권을 취득하였고, 丁은 乙과의 건물소유 목적의 토지임대차계약에 따라 X토지에 Y건물을 신축하여 소유하고 있다. 다음 설명 중 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 甲이 X토지에 대한 근저당권을 실행하는 경우, Y건물에 대해서도 일괄경매를 청구할 수 있다.\nㄴ. 丙의 저당권 실행으로 戊가 X토지를 매수한 경우, 丁은 戊에게 임차권을 주장할 수 없다.\nㄷ. 甲의 근저당권이 매각으로 소멸하더라도 丙의 저당권은 소멸하지 않는다.\n\n① ㄱ\n\n② ㄴ\n\n③ ㄷ\n\n④ ㄱ, ㄴ\n\n⑤ ㄴ, ㄷ","4","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",7,0],[36,2025,21,43,3,"국토계획법","도시·군관리계획·기본계획","틀린것 고르기","乙은 甲으로부터 1억 원을 빌리면서 乙 소유의 X토지(시가 3억 원)에 甲 명의로 양도담보권을 설정해 주었다. 그 후 甲은 丙에게 X토지를 매도하고 소유권이전등기를 마쳐주었다. 다음 설명 중 옳은 것은? (다툼이 있으면 판례에 따름)\n\n① 丙은 X토지의 소유권을 취득하지 못한다.\n\n② 乙은 丙을 상대로 X토지의 소유권이전등기말소를 청구할 수 있다.\n\n③ 乙은 甲에게 1억 원을 변제하고 甲 명의의 양도담보권 말소를 청구할 수 있다.\n\n④ 甲이 乙에게 변제기 후 담보권 실행을 위한 청산금을 지급한 경우, 乙은 X토지의 소유권을 상실한다.\n\n⑤ 丙이 선의인 경우, 丙은 X토지의 소유권을 취득하고 乙의 甲에 대한 채무는 소멸한다.","2","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",7,0],[36,2025,21,44,3,"국토계획법","용도지역·용도지구·용도구역","","물권적 청구권에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 소유권에 기한 물권적 청구권은 소멸시효에 걸리지 않는다.\n\n② 타인의 토지에 무단으로 건물을 축조한 자가 그 건물을 제3자에게 매도하고 점유를 넘겨준 경우, 토지소유자는 그 제3자를 상대로 건물의 철거를 청구할 수 있다.\n\n③ 부동산의 점유자에게 소유권이전등기청구권이 인정되는 경우, 점유자는 등기명의인의 소유물반환청구에 대해 점유할 권리를 주장하여 거부할 수 있다.\n\n④ 임차인은 임대인을 대위하여 임대차목적물의 무단점유자에게 물권적 청구권을 행사할 수 없다.\n\n⑤ 소유자는 소유권을 상실하면 무단점유자에 대해 물권적 청구권에 의한 방해배제를 청구할 수 없다.","5","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",7,0],[36,2025,21,45,3,"국토계획법","도시·군계획시설·매수청구","","부동산 점유취득시효에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 취득시효 완성 후 소유권이전등기 전에 원소유자가 제3자에게 처분한 경우, 점유자는 특별한 사정이 없는 한 그 제3자에게 취득시효 완성을 주장할 수 없다.\n\n② 취득시효 완성 후 명의신탁이 해지되어 명의수탁자로부터 명의신탁자에게 소유권이전등기가 마쳐진 경우, 점유자는 명의신탁자에게 취득시효 완성을 주장할 수 없다.\n\n③ 점유자가 취득시효 완성 후 소유권이전등기 청구소송을 제기하여 승소판결이 확정된 경우, 등기 없이도 소유권을 취득한다.\n\n④ 취득시효가 완성된 토지가 수용되어 소유권이전등기의무가 이행불능이 된 경우, 점유자는 원소유자에 대해 대상청구권을 행사할 수 있다.\n\n⑤ 취득시효 완성 후 점유자가 점유를 상실한 경우, 소유권이전등기청구권은 즉시 소멸하는 것이 아니라 그때부터 10년의 소멸시효가 진행한다.","2","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",7,0],[36,2025,21,46,3,"국토계획법","도시·군관리계획·기본계획","틀린것 고르기","乙은 甲 소유의 X토지를 임차하여 Y건물을 신축하고 소유권보존등기를 마쳤다. 다음 설명 중 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 임대차기간이 만료한 경우, 乙은 특별한 사정이 없는 한 甲에게 지상물매수청구권을 행사할 수 있다.\n\n② 乙의 차임연체액이 2기의 차임액에 달하여 甲이 임대차계약을 해지한 경우, 乙은 甲에게 지상물매수청구권을 행사할 수 없다.\n\n③ 乙이 Y건물에 대한 소유권보존등기를 마친 후 丙이 X토지의 소유권을 취득한 경우, 乙은 丙에게 지상물매수청구권을 행사할 수 없다.\n\n④ 乙의 지상물매수청구권이 유효하게 행사된 경우, 甲ㆍ乙 사이에는 Y건물에 대하여 매매계약이 성립한다.\n\n⑤ Y건물이 甲 소유의 토지와 丙 소유의 토지 지상에 걸쳐 건립된 경우, 乙은 Y건물 중 구분소유의 객체가 될 수 있는 부분에 한하여 甲에게 지상물매수청구권을 행사할 수 있다.","3","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",7,0],[36,2025,21,47,3,"국토계획법","지구단위계획","옳은것 고르기","집합건물의 소유 및 관리에 관한 법률상 구분소유자의 권리와 의무에 관한 설명으로 틀린 것은?\n\n① 구분소유자는 건물의 보존에 해로운 행위를 하여서는 아니 된다.\n\n② 전유부분이 속하는 1동의 건물의 설치 또는 보존의 하자 등으로 인하여 다른 자에게 손해를 가한 경우, 그 하자는 공용부분에 존재하는 것으로 추정한다.\n\n③ 각 구분소유자는 공용부분의 분할을 청구할 수 없다.\n\n④ 각 구분소유자는 공용부분을 그 용도에 따라 사용할 수 있다.\n\n⑤ 구분소유자는 그가 가지는 전유부분과 분리하여 대지사용권을 처분할 수 없음이 원칙이다.","5","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",7,0],[36,2025,21,48,3,"국토계획법","국토계획법 일반","틀린것 고르기","민법상 유치권에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 유치권자는 채권의 변제를 받기 위하여 유치물을 경매할 수 있다.\n\n② 유치권자는 유치물의 과실을 수취하여 다른 채권보다 먼저 자신의 채권의 변제에 충당할 수 있다.\n\n③ 유치권자가 유치물에 관한 유익비를 지출한 경우, 점유자의 과실(果實) 취득 여부를 불문하고 유치물 소유자에 대해 그 상환을 청구할 수 있다.\n\n④ 유치권자가 유치물인 주택에 거주하며 이를 사용하는 경우, 특별한 사정이 없는 한 유치권의 소멸청구 사유인 '유치물 보관의무 위반'에 해당하지 않는다.\n\n⑤ 유치권자가 유치물에 대한 점유를 상실한 경우, 점유보호청구권에 기한 점유회수의 소를 제기하여 승소판결을 받더라도 점유를 회복하지 않는 한 유치권은 소멸한다.","5","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",8,0],[36,2025,21,49,3,"국토계획법","용도지역·용도지구·용도구역","","점유권에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 점유물에 대한 악의의 점유자는 과실(果實)을 반환하여야 한다.\n\n② 점유물이 점유자의 귀책사유로 인하여 멸실된 때에는 악의의 점유자는 손해의 전부를 배상하여야 한다.\n\n③ 점유자가 점유물에 대하여 행사하는 권리는 적법하게 보유한 것으로 추정한다.\n\n④ 악의의 점유자는 점유물에 지출한 유익비의 상환을 청구할 수 없다.\n\n⑤ 점유자가 점유의 침탈을 당한 때에는 그 침탈당한 날부터 1년 내에 점유물의 반환을 청구할 수 있다.","4","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",8,0],[36,2025,21,50,3,"국토계획법","용도지역·용도지구·용도구역","틀린것 고르기","5. 10. 甲은 乙에게 자신의 X토지를 매도하면서 매매대금을 1억원으로 합의하였으나, 매매계약서 작성 시 매매대금을 1천만원으로 잘못 기재하였다. 다음 설명 중 옳은 것은? (다툼이 있으면 판례에 따름)\n\n① 甲과 乙 사이의 매매계약은 1천만원에 성립한다.\n\n② 甲은 착오를 이유로 매매계약을 취소할 수 있다.\n\n③ 乙은 1억원의 매매계약을 취소할 수 없다.\n\n④ 乙이 X토지의 소유권이전등기를 마친 경우, 乙은 X토지의 소유권을 취득한다.\n\n⑤ 乙이 1천만원을 변제공탁하면 甲의 소유권이전등기의무는 이행지체에 빠진다.","4","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",8,0],[36,2025,21,51,3,"국토계획법","도시·군계획시설·매수청구","","통정허위표시에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 통정허위표시의 무효는 선의의 제3자에게 대항하지 못한다.\n\n② 통정허위표시의 무효로 대항할 수 없는 '제3자'는 선의이면 족하고 무과실까지 요구되지 않는다.\n\n③ 통정허위표시의 무효로 대항할 수 없는 '제3자'가 악의라는 사실은 무효를 주장하는 자가 증명하여야 한다.\n\n④ 통정허위표시에 따라 체결된 매매계약에 기한 채권을 양수한 자는 통정허위표시의 무효로 대항할 수 없는 '제3자'에 해당하지 않는다.\n\n⑤ 당사자가 통정하여 증여를 매매로 가장한 경우, 매매계약은 무효이나 증여계약은 유효할 수 있다.","1","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",8,0],[36,2025,21,52,3,"국토계획법","용도지역·용도지구·용도구역","","대리권 없는 甲이 乙을 대리하여 丙에게 乙 소유의 X토지를 매도하였다. 다음 설명 중 옳은 것은? (다툼이 있으면 판례에 따름)\n\n① 甲과 丙 사이의 매매계약은 무효이므로 乙이 이를 추인하더라도 효력이 생기지 않는다.\n\n② 乙이 丙에게 추인한 경우, 丙이 추인 사실을 알지 못하였더라도 丙은 乙에게 매매계약을 철회할 수 없다.\n\n③ 乙이 甲에게 추인의 의사표시를 한 경우, 丙이 그 사실을 알았더라도 丙은 乙에게 매매계약을 철회할 수 있다.\n\n④ 丙이 계약 당시 甲에게 대리권 없음을 알았던 경우, 丙은 乙에게 최고권을 행사할 수 없다.\n\n⑤ 甲이 미성년자인 경우, 丙은 甲에게 계약의 이행이나 손해배상을 청구할 수 없다.","2","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",8,0],[36,2025,21,53,3,"도시개발법","도시개발구역 지정·계획","틀린것 고르기","민법상 조건과 기한에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 해제조건이 있는 법률행위는 조건이 성취한 때로부터 그 효력을 잃는다.\n\n② 당사자가 조건성취의 효력을 그 성취 전에 소급하게 할 의사를 표시한 때에는 그 의사에 따른다.\n\n③ 조건이 법률행위 당시에 이미 성취할 수 없는 것인 경우, 그 조건이 정지조건이면 그 법률행위는 무효로 한다.\n\n④ 기한은 채무자의 이익을 위한 것으로 추정한다.\n\n⑤ 당사자가 기한도래의 효력을 그 도래 전에 소급하게 할 의사를 표시한 때에는 그 의사에 따른다.","5","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",8,0],[36,2025,21,54,3,"도시개발법","도시개발구역 지정·계획","박스형(모두고르기)","甲은 乙에게 1억원을 차용하면서 이를 담보하기 위해 乙 명의로 X건물에 가등기를 마쳐주었다. 다음 설명 중 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 甲이 변제기에 차용원리금을 변제하면 가등기담보권은 소멸한다.\n\n② 乙의 가등기담보권 실행을 위한 청산절차에서 청산기간은 청산금의 평가액을 甲에게 통지한 날부터 2개월이다.\n\n③ 乙이 청산금이 없다고 판단한 경우에도 그 뜻을 甲에게 통지하여야 한다.\n\n④ 乙이 청산금의 지급을 지체한 경우, 甲은 청산기간이 지난 후에도 청산금을 지급받을 때까지 X건물의 소유권이전등기절차의 이행을 거절할 수 있다.\n\n⑤ 甲은 청산기간이 지나기 전에는 청산금에 관한 권리를 양도할 수 없다.","5","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",8,0],[36,2025,21,55,3,"도시개발법","시행자·조합","빈칸","매도인의 담보책임에 관한 설명으로 틀린 것은? (단, 특별한 사정은 고려하지 않음)\n\n① 타인의 권리를 매도한 자가 그 권리를 취득하여 매수인에게 이전할 수 없는 경우, 매수인은 계약을 해제할 수 있다.\n\n② 매매목적물에 설정된 저당권의 실행으로 인하여 매수인이 그 소유권을 취득할 수 없게 된 경우, 악의의 매수인은 계약의 해제와 함께 손해배상을 청구할 수 있다.\n\n③ 매매목적물에 설정된 전세권의 실행으로 인하여 매수인이 그 소유권을 취득할 수 없게 된 경우, 악의의 매수인은 손해배상을 청구할 수 없다.\n\n④ 저당권이 설정된 부동산의 매수인이 그 소유권을 보존하기 위해 출재(出財)를 한 경우, 매수인은 매도인에게 그 상환을 청구할 수 있다.\n\n⑤ 매매의 목적이 된 권리의 일부가 타인에게 속함으로 인하여 매도인이 그 권리를 취득하여 매수인에게 이전할 수 없는 경우, 선의의 매수인은 그 사실을 안 날로부터 1년 내에 권리를 행사해야 한다.","2","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",9,0],[36,2025,21,56,3,"도시개발법","수용·사용·환지","","부동산매매계약이 해제된 경우에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 해제의 소급효로 인하여 소멸하는 채권의 양수인은 특별한 사정이 없는 한 해제로 권리를 침해받지 않는 제3자에 해당한다.\n\n② 매도인이 매매계약의 해제를 원인으로 건물의 인도와 함께 소유권이전등기의 말소를 구하는 경우, 특별한 사정이 없는 한 건물의 점유자는 매도인에게 건물점유에 따른 임료 상당의 부당이득반환의무를 진다.\n\n③ 매매계약 해제 전 그 해제 대상인 계약상의 채권을 양수하여 피보전채권으로 하여 목적 부동산에 가압류를 한 가압류채권자는 해제로 권리를 침해받지 않는 제3자에 해당한다.\n\n④ 매매계약의 해제로 인하여 원상회복의무를 부담하는 매수인이 목적물을 이용한 경우, 그 이용으로 얻은 이익은 매도인에게 반환하여야 한다.\n\n⑤ 매매계약의 해제로 인하여 반환할 금전에 가산할 이자의 지급의무는 부당이득반환의 성질을 가진다.","4","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",9,0],[36,2025,21,57,3,"도시개발법","시행자·조합","틀린것 고르기","계약의 유형에 관한 설명으로 옳은 것은?\n\n① 매매계약은 요물계약이다.\n\n② 중개계약은 민법상의 전형계약이다.\n\n③ 교환계약은 유상·일시적 계약이다.\n\n④ 증여계약은 무상·쌍무계약이다.\n\n⑤ 임대차계약은 낙성·요식계약이다.","3","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",9,0],[36,2025,21,58,3,"도시개발법","도시개발채권·기타","","제3자를 위한 계약에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 제3자의 권리는 그 제3자가 수익의 의사를 표시한 때에 발생한다.\n\n② 제3자는 계약당사자가 아니므로 계약 해제권이나 해제를 원인으로 한 원상회복청구권이 없다.\n\n③ 요약자는 낙약자의 채무불이행을 이유로 제3자의 동의 없이 계약을 해제할 수 있다.\n\n④ 낙약자는 요약자와의 계약에 생긴 사유로 제3자에게 대항할 수 없다.\n\n⑤ 수익의 의사표시를 한 제3자는 낙약자에게 직접 채무의 이행을 청구할 수 있다.","5","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",9,0],[36,2025,21,59,3,"정비법","정비계획·정비구역","틀린것 고르기","甲은 자신의 X부동산을 乙에게 매도하는 계약을 체결하고 乙로부터 계약금을 수령하였다. 다음 설명 중 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 乙이 해약금에 의한 계약해제의 의사표시를 한 경우, 해제의 효력이 발생하기 위해서는 乙은 甲에게 손해배상을 해야 한다.\n\n② 乙이 중도금 지급기일 전 중도금을 지급한 경우, 특별한 사정이 없는 한 乙은 계약금을 포기하고 매매계약을 해제할 수 없다.\n\n③ 乙이 해약금에 의한 계약해제의 의사표시를 한 경우, 계약은 소급적으로 실효된다.\n\n④ 甲이 乙에게 이행을 최고하고 대금지급을 구하는 소송을 제기한 것만으로는 이행의 착수라고 볼 수 없다.\n\n⑤ 甲이 계약금의 배액을 상환하고 계약을 해제하려는 경우, 乙이 이를 수령하지 않는다 하여도 공탁까지 할 필요는 없다.","1","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",9,0],[36,2025,21,60,3,"정비법","정비계획·정비구역","","甲은 乙에게 1억 원을 대여하면서 이를 담보하기 위해 乙 소유의 X부동산(시가 3억 원)에 1번 가등기를 마쳤고, 丙은 X부동산에 2번 저당권을 취득하였다. 이에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)\n\n① 甲은 변제기가 도래하기 전이라도 乙에게 통지하고 귀속청산의 절차를 진행할 수 있다.\n\n② 乙이 변제기에 채무를 이행하지 않더라도 甲은 귀속청산의 절차를 거치지 않고는 X부동산의 소유권을 취득할 수 없다.\n\n③ 丙은 담보가등기 권리자의 변제기 도래 전에는 자신의 채권 변제기가 도래하더라도 X부동산의 경매를 청구할 수 없다.\n\n④ 甲의 담보가등기 권리행사를 위한 청산금 평가액 통지가 丙에게 도달하지 않더라도 그 통지로서의 효력이 있다.\n\n⑤ 甲의 청산금 평가액 통지가 乙에게 도달한 후, 乙은 청산기간이 지나기 전이라도 청산금에 관한 권리를 양도할 수 없다.","4","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",9,0],[36,2025,21,61,3,"정비법","사업시행·관리처분","틀린것 고르기","저당권의 효력이 미치는 목적물의 범위에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 명인방법을 갖춘 수목의 집단에는 저당권의 효력이 미치지 않는다.\n\n② 건물 소유를 목적으로 한 토지임차인이 그 토지 위에 소유하는 건물에 저당권을 설정한 경우, 토지임차권에도 저당권의 효력이 미친다.\n\n③ 저당권의 목적물인 토지가 공익사업을 위한 토지 등의 취득 및 보상에 관한 법률에 따라 협의취득된 경우, 저당권자는 그 보상금지급청구권에 대하여 물상대위권을 행사할 수 있다.\n\n④ 토지에 저당권이 설정된 후, 저당권설정자가 그 토지에 건물을 축조하고 소유하는 경우, 저당권자는 토지와 함께 그 건물에 대해서도 경매를 청구할 수 있다.\n\n⑤ 저당부동산에 대한 압류가 있으면 압류 이후의 저당권설정자의 저당부동산에 관한 과실수취채권에도 저당권의 효력이 미친다.","2","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",10,0],[36,2025,21,62,3,"정비법","정비사업 일반","틀린것 고르기","민법상 저당권에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 저당권자는 저당물의 매각으로 인하여 생긴 가액에서 우선변제를 받을 권리가 있다.\n\n② 저당권자는 채권의 변제를 받기 위하여 저당물의 경매를 청구할 수 있다.\n\n③ 지상권은 저당권의 목적이 될 수 있다.\n\n④ 저당권에 의하여 담보되는 채권은 원본에 한한다.\n\n⑤ 저당권자는 목적물의 점유를 취득하지 않고서도 저당권을 취득한다.","3","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",10,0],[36,2025,21,63,3,"정비법","정비사업 일반","빈칸","甲은 3억 원을 차용하면서 乙 소유의 X토지와 丙 소유의 Y토지에 각각 1번 저당권을 설정받았고, 丁은 乙에 대한 2억 원의 채권으로 X토지에 2번 저당권을, 戊는 丙에 대한 1억 원의 채권으로 Y토지에 2번 저당권을 각각 설정받았다. 甲이 X토지와 Y토지에 대하여 동시경매를 신청하여 X토지의 경매대가 4억 원, Y토지의 경매대가 2억 원이 동시에 배당되는 경우, 甲이 Y토지에서 배당받게 되는 금액은? (단, 경매비용 및 선순위 채권 등은 고려하지 않음)\n\n① 1억 원\n\n② 1억 5천만 원\n\n③ 2억 원\n\n④ 2억 5천만 원\n\n⑤ 3억 원","4","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",10,0],[36,2025,21,64,3,"정비법","조합·추진위원회","","계약의 유형에 관한 설명으로 옳은 것은?\n\n① 매매계약은 요식계약이다.\n\n② 현상광고계약은 무상계약이다.\n\n③ 교환계약은 편무계약이다.\n\n④ 임대차계약은 쌍무계약이다.\n\n⑤ 증여계약은 유상계약이다.","5","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",10,0],[36,2025,21,65,3,"주택법","사업주체·주택조합","빈칸","계약의 성립에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 따름)\n\n① 격지자간의 계약은 승낙의 통지를 발송한 때에 성립한다.\n\n② 청약은 그에 대한 승낙만 있으면 계약이 성립하는 구체적·확정적 의사표시이어야 한다.\n\n③ 청약자가 청약에 \"일정한 기간 내에 이의를 제기하지 아니하면 승낙한 것으로 본다\"는 뜻을 기재한 경우, 원칙적으로 상대방은 이에 구속된다.\n\n④ 승낙기간을 정하지 않은 청약은 청약자가 상당한 기간 내에 승낙의 통지를 받지 못한 때에는 그 효력을 잃는다.\n\n⑤ 승낙기간이 지나서 도달한 승낙은 청약자가 이를 새로운 청약으로 볼 수 있다.","4","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",10,0],[36,2025,21,66,3,"주택법","주택공급·분양가상한·전매제한","","제3자를 위한 계약에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)\n\n① 제3자의 권리는 그 제3자가 수익의 의사표시를 한 때에 생긴다.\n\n② 제3자는 계약당사자이므로 계약의 해제권이나 해제를 원인으로 한 원상회복청구권을 가진다.\n\n③ 낙약자는 요약자와의 계약에 기한 항변으로 제3자에게 대항할 수 없다.\n\n④ 요약자는 제3자의 동의 없이 낙약자의 채무불이행을 이유로 계약을 해제할 수 없다.\n\n⑤ 제3자의 수익의 의사표시 후에는 요약자와 낙약자가 합의로 제3자의 권리를 변경시킬 수 있음이 원칙이다.","3","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",10,0],[36,2025,21,74,3,"건축법","건축허가·신고·사용승인","틀린것 고르기","부동산등기에 관한 설명으로 틀린 것은?\n\n① 서류의 위조 등 원인무효의 등기신청에 의해 등기가 완료된 경우, 그 등기는 실체관계와 부합하더라도 무효이다.\n\n② 등기소장은 등기부가 멸실될 우려가 있는 때에는 대법원규칙이 정하는 바에 따라 필요한 처분을 할 수 있다.\n\n③ 등기권리자가 등기신청절차에 협력하지 않는 등기의무자를 상대로 등기신청에의 협력절차 이행을 명하는 판결을 얻은 경우, 등기의무자는 그 판결을 받아 단독으로 등기를 신청할 수 없다.\n\n④ 행정구역 변경으로 등기부에 기록된 행정구역의 명칭이 변경된 때에는 등기명의인의 신청이 없더라도 등기관은 직권으로 변경등기를 하여야 한다.\n\n⑤ 폐쇄한 등기기록에 대하여 등기사항전부증명서의 발급은 가능하나, 등기기록의 열람은 인정되지 않는다.","4","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",12,0],[36,2025,21,75,3,"건축법","건축물·용어·적용범위","틀린것 고르기","등기관의 처분에 대한 이의신청에 관한 설명으로 틀린 것은?\n\n① 등기관의 처분에 대한 이의신청은 관할 지방법원에 하여야 한다.\n\n② 관할 지방법원은 이의신청에 대하여 결정하기 전에 등기관에게 가등기(假登記)를 명할 수 있다.\n\n③ 이의신청은 집행정지의 효력이 없다.\n\n④ 이의신청서에는 이의신청인의 성명과 주소, 이의신청의 대상인 등기관의 처분, 이의신청의 취지와 이유, 그 밖에 대법원규칙으로 정하는 사항을 적고 신청인이 기명날인하거나 서명하여야 한다.\n\n⑤ 등기관의 처분에 대한 이의신청은 새로운 사실이나 새로운 증거방법을 근거로 할 수 있다.","4","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",12,0],[36,2025,21,76,3,"건축법","건축물·용어·적용범위","틀린것 고르기","소유권보존등기에 관한 설명으로 틀린 것은?\n\n① 부동산의 공유자 중 1인은 공유물에 대한 보존행위로서 공유자 전원을 위하여 부동산 전체에 대한 소유권보존등기를 신청할 수 있다.\n\n② 1동의 건물에 속하는 구분건물 중 일부에 대하여 소유권보존등기를 신청하는 경우, 나머지 구분건물에 대하여는 표시에 관한 등기를 동시에 신청하여야 한다.\n\n③ 토지대장상 최초의 소유자로 등록되어 있는 자로부터 그 토지를 포괄유증 받은 자는 자기 명의로 소유권보존등기를 신청할 수 있다.\n\n④ 미등기 부동산에 대하여 법원의 촉탁에 따라 소유권의 처분제한의 등기를 할 때에는 등기관이 직권으로 소유권보존등기를 한다.\n\n⑤ 미등기 토지에 대한 소유권보존등기는 수용으로 인하여 소유권을 취득하였음을 증명하는 자도 신청할 수 있다.","2","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",12,0],[36,2025,21,77,3,"건축법","건축물·용어·적용범위","틀린것 고르기","신탁등기에 관한 설명으로 옳은 것은?\n\n① 수탁자가 2인 이상인 경우, 등기관은 신탁재산이 합유(合有)인 뜻을 기록하여야 한다.\n\n② 신탁등기의 말소등기는 수탁자가 단독으로 신청할 수 없다.\n\n③ 신탁재산이 수탁자의 고유재산으로 된 경우, 그 뜻의 등기는 주등기로 하여야 한다.\n\n④ 신탁등기의 신청은 신탁으로 인한 권리의 이전 또는 설정등기나 보존등기의 신청과 별개로 하여야 한다.\n\n⑤ 수탁자가 신탁등기를 신청하지 아니하는 경우, 위탁자나 수익자는 수탁자를 대위하여 신탁등기를 신청할 수 없다.","1","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",12,0],[36,2025,21,78,3,"건축법","건축물·용어·적용범위","틀린것 고르기","가등기에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 의함)\n\n① 가등기로 보전하려는 청구권이 조건부인 경우에도 가등기를 할 수 있다.\n\n② 가등기명의인은 그 가등기의 말소를 단독으로 신청할 수 있다.\n\n③ 가등기의 의무자는 가등기명의인의 승낙을 받아 단독으로 가등기의 말소를 신청할 수 없다.\n\n④ 가등기권리자는 가등기를 명하는 법원의 가처분명령이 있는 경우, 단독으로 가등기를 신청할 수 있다.\n\n⑤ 가등기에 의한 본등기를 한 경우, 본등기의 순위는 가등기의 순위에 따른다.","3","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",12,0],[36,2025,21,79,3,"농지법","농지 소유·이용·보전","박스형(모두고르기)","근저당권등기에 관한 설명으로 틀린 것은?\n\n① 근저당권의 설정등기를 신청하는 경우, 채권최고액은 채무자별로 구분하여 기록하여야 한다.\n\n② 근저당권의 피담보채권이 확정되기 전에 그 채권이 양도된 경우, 이를 원인으로 하는 근저당권 이전등기를 신청할 수 없다.\n\n③ 근저당권설정자가 등기의무자로서 근저당권의 채권최고액을 감액하는 변경등기를 신청하는 경우, 그의 등기필정보를 등기소에 제공하여야 한다.\n\n④ 피담보채권이 확정되기 전에 근저당권의 채무자가 변경된 경우, 그 변경등기는 변경 전의 채무자가 변경 후의 채무자로 변경되었다는 뜻을 기록하는 방식으로 한다.\n\n⑤ 근저당권의 피담보채권이 확정된 후, 그 확정된 채권이 양도된 경우, 이를 원인으로 하는 근저당권 이전등기를 신청할 수 있다.","3","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",12,0],[36,2025,21,80,3,"농지법","농지 소유·이용·보전","빈칸","등기의 이행을 명하는 판결에 따른 등기신청에 관한 설명으로 틀린 것은? (다툼이 있으면 판례에 의함)\n\n① 승소한 원고 A가 패소한 피고 B를 상대로 등기절차의 이행을 명하는 판결을 받은 경우, A는 단독으로 등기를 신청할 수 있다.\n\n② 승소한 등기의무자가 단독으로 판결에 따른 등기를 신청할 때에는 등기필정보를 제공하지 않아도 된다.\n\n③ 패소한 등기의무자는 그 판결을 받아 단독으로 등기를 신청할 수 없다.\n\n④ 판결에 따른 등기신청은 판결 확정 후 10년이 지난 경우에도 신청할 수 있다.\n\n⑤ 공유물분할판결이 확정된 경우, 현물분할에 따라 권리를 취득한 공유자는 단독으로 공유물분할을 원인으로 하는 소유권이전등기를 신청할 수 있다.","1","1J-6BAPUS5pR15dOTxqEkFxyVJuhT9jto",12,0],[36,2025,22,1,4,"공간정보법","지적측량·지적위원회","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적측량을 실시하여야 하는 경우로 틀린 것은?\n① 토지의 합병에 따라 지적공부를 정리하는 경우\n② 지적측량수행자가 실시한 지적측량성과를 검사하는 경우\n③ 등록전환을 하는 경우로서 측량을 할 필요가 있는 경우\n④ 신규등록을 하는 경우로서 측량을 할 필요가 있는 경우\n⑤ 「지적재조사에 관한 특별법」에 따른 지적재조사사업에 따라 토지의 이동이 있는 경우로서 측량을 할 필요가 있는 경우","1","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",1,0],[36,2025,22,2,4,"공간정보법","지번·지목·면적·경계","","공간정보의 구축 및 관리 등에 관한 법령상 영구적 건축물 중 박물관, 미술관 등 문화시설과 이에 접속된 정원의 부지에 관한 지목의 구분으로 옳은 것은? (단, 다른 조건은 고려하지 않음)\n① 대\n② 공원\n③ 사적지\n④ 유원지\n⑤ 학교용지","1","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",1,0],[36,2025,22,3,4,"공간정보법","지적공부·부동산종합공부","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 부동산종합공부의 관리 및 운영 등에 관한 설명으로 틀린 것은?\n① 지적소관청은 부동산종합공부에 토지적성평가 확인서의 내용을 등록하여야 한다.\n② 지적소관청은 부동산종합공부의 멸실 또는 훼손에 대비하여 이를 별도로 복제하여 관리하는 정보관리체계를 구축하여야 한다.\n③ 부동산종합공부의 등록사항을 관리하는 기관의 장은 지적소관청에 상시적으로 관련 정보를 제공하여야 한다.\n④ 지적소관청은 부동산의 효율적 이용과 부동산과 관련된 정보의 종합적 관리·운영을 위하여 부동산종합공부를 관리·운영한다.\n⑤ 부동산종합공부 기록사항의 전부 또는 일부에 관한 증명서를 발급받으려는 자는 지적소관청이나 읍·면·동의 장에게 신청할 수 있다.","1","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",1,0],[36,2025,22,4,4,"공간정보법","지번·지목·면적·경계","","공간정보의 구축 및 관리 등에 관한 법령상 지적도의 축척이 600분의 1인 지역에서 신규등록할 1필지의 측정면적이 928.651㎡인 경우 토지대장에 등록할 면적은? (단, 다른 조건은 고려하지 않음)\n① 928㎡\n② 928.6㎡\n③ 928.65㎡\n④ 928.7㎡\n⑤ 929㎡","4","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",1,0],[36,2025,22,5,4,"공간정보법","공간정보법 일반","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 토지개발사업 등의 시행자가 그 사업의 착수·변경 및 완료 사실을 지적소관청에 신고하여야 한다. 이에 해당하는 사업으로 틀린 것은?\n① 「지적재조사에 관한 특별법」에 따른 지적재조사사업\n② 「철도의 건설 및 철도시설 유지관리에 관한 법률」에 따른 고속철도, 일반철도 및 광역철도 건설사업\n③ 「도로법」에 따른 고속국도 및 일반국도 건설사업\n④ 「항만법」에 따른 항만개발사업\n⑤ 「관광진흥법」에 따른 관광단지 개발사업","1","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",1,0],[36,2025,22,6,4,"공간정보법","지적공부·부동산종합공부","","공간정보의 구축 및 관리 등에 관한 법령상 연속지적도의 관리 등에 관한 설명으로 옳은 것은?\n① 지적소관청은 연속지적도의 관리 및 정비에 관한 정책을 수립·시행하여야 한다.\n② 지적소관청은 지적도·임야도에 등록된 사항에 대하여 토지의 이동 또는 오류사항을 정비한 때에는 이를 연속지적도에 반영하여야 한다.\n③ 시·도지사는 지적소관청의 연속지적도 정비에 필요한 경비의 전부 또는 일부를 지원하여야 한다.\n④ 시·도지사는 연속지적도를 체계적으로 관리하기 위하여 연속지적도 정보관리체계를 구축·운영하여야 한다.\n⑤ 시·도지사는 연속지적도 정보관리체계의 구축·운영에 관한 업무를 한국국토정보공사에 위탁하여야 한다.","2","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",1,0],[36,2025,22,7,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 축척변경에 관한 설명으로 틀린 것은?(단, 축척변경 시행공고지역으로 한정함)\n① 축척변경에 관한 사항을 심의·의결하기 위하여 지적소관청에 축척변경위원회를 둔다.\n② 축척변경위원회의 위원장은 위원 중에서 지적소관청이 지명한다.\n③ 지적소관청은 청산금의 결정을 공고한 날부터 20일 이내에 토지소유자에게 청산금의 납부고지 또는 수령통지를 하여야 한다.\n④ 지적소관청은 청산금의 납부 및 지급이 완료되었을 때에는 지체 없이 청산금 조서를 작성하여야 한다.\n⑤ 지적소관청은 축척변경에 관한 측량을 완료하였을 때에는 시행공고일 현재의 지적공부상의 면적과 측량 후의 면적을 비교하여 그 변동사항을 표시한 축척변경 지번별 조서를 작성하여야 한다.","4","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",1,0],[36,2025,22,8,4,"공간정보법","지번·지목·면적·경계","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지상경계의 구분 등에 관한 설명으로 틀린 것은?\n① 지적소관청은 토지의 이동에 따라 지상경계를 새로 정한 경우에는 지상경계점등록부를 작성·관리하여야 한다.\n② 경계점 좌표는 경계점좌표등록부 시행지역의 지상경계점등록부의 등록사항이다.\n③ 관계 법령에 따라 인가·허가 등을 받아 토지를 분할하려는 경우에는 지상 경계점에 경계점표지를 설치하여 측량할 수 있다.\n④ 경계점 위치 설명도, 경계점표지의 종류 및 경계점 위치는 지상경계점등록부의 등록사항이다.\n⑤ 지적확정측량의 경계는 사업계획도대로 결정하되, 공사가 완료된 현황이 사업계획도와 다를 때에는 미리 지적측량수행자에게 그 사실을 통지하여야 한다.","5","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",1,0],[36,2025,22,9,4,"공간정보법","지적측량·지적위원회","빈칸","공간정보의 구축 및 관리 등에 관한 법령상 지적측량의 적부심사 등에 관한 설명이다. ( )에 들어갈 내용으로 옳은 것은? ○ ( ㄱ )(으)로부터 지적측량 적부심사청구를 회부받은 지방지적위원회는 그 심사청구를 회부받은 날부터 ( ㄴ )이내에 심의·의결하여야 한다. 다만, 부득이한 경우에는 그 심의기간을 해당 지적위원회의 의결을 거쳐 30일 이내에서 한 번만 연장할 수 있다. ○ ( ㄷ )은(는) 지방지적위원회의 의결서를 받은 날부터 ( ㄹ )이내에 지적측량 적부심사 청구인 및 이해관계인에게 그 의결서를 통지하여야 한다.\n① ㄱ: 시·도지사, ㄴ: 60일, ㄷ: 시·도지사, ㄹ: 15일\n② ㄱ: 시·도지사, ㄴ: 90일, ㄷ: 지적소관청, ㄹ: 15일\n③ ㄱ: 시·도지사, ㄴ: 60일, ㄷ: 시·도지사, ㄹ: 7일\n④ ㄱ: 지적소관청, ㄴ: 60일, ㄷ: 지적소관청, ㄹ: 7일\n⑤ ㄱ: 지적소관청, ㄴ: 90일, ㄷ: 시·도지사, ㄹ: 15일","3","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",2,0],[36,2025,22,10,4,"공간정보법","지적공부·부동산종합공부","박스형(모두고르기)","공간정보의 구축 및 관리 등에 관한 법령상 토지대장과 공유지연명부의 공통 등록사항을 모두 고른 것은? ㄱ. 지번 ㄴ. 토지의 이동사유 ㄷ. 토지의 고유번호 ㄹ. 소유자의 성명 또는 명칭, 주소 및 주민등록번호(국가, 지방자치단체, 법인, 법인 아닌 사단이나 재단 및 외국인의 경우에는 「부동산등기법」 제49조에 따라 부여된 등록번호)\n① ㄱ, ㄷ\n② ㄱ, ㄴ, ㄹ\n③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ\n⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",2,0],[36,2025,22,11,4,"공간정보법","지적공부·부동산종합공부","박스형(모두고르기)","공간정보의 구축 및 관리 등에 관한 법령상 지적소관청이 지적공부의 등록사항에 잘못이 있는지를 직권으로 조사·측량하여 정정할 수 있는 경우를 모두 고른 것은? ㄱ. 토지이동정리 결의서의 내용과 다르게 정리된 경우 ㄴ. 지적도 및 임야도에 등록된 필지가 면적의 증감 없이 경계의 위치만 잘못된 경우 ㄷ. 지적공부의 등록사항이 잘못 입력된 경우 ㄹ. 지적공부의 작성 또는 제작상 당시 잘못 정리된 경우 ㅁ. 지적측량성과와 다르게 정리된 경우\n① ㄱ, ㄴ, ㄷ\n② ㄱ, ㄴ, ㄹ, ㅁ\n③ ㄱ, ㄷ, ㄹ, ㅁ\n④ ㄴ, ㄷ, ㄹ, ㅁ\n⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","5","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",2,0],[36,2025,22,12,4,"공간정보법","공간정보법 일반","계산","공간정보의 구축 및 관리 등에 관한 법령상 지적위원회 등에 관한 설명으로 옳은 것은?\n① 지적측량성과에 대하여 다툼이 있는 경우 토지소유자, 이해관계인 또는 지적측량수행자는 관할 시·도지사를 거쳐 중앙지적위원회에 지적측량 적부심사를 청구할 수 있다.\n② 중앙지적위원회는 지적재조사 기본계획의 수립 및 변경에 관한 사항을 심의·의결한다.\n③ 중앙지적위원회의 위원장이 회의를 소집할 때에는 회의 일시·장소 및 심의 안건을 회의 7일 전까지 각 위원에게 서면으로 통지하여야 한다.\n④ 중앙지적위원회가 현지조사를 위해 필요할 때에는 지적측량수행자에게 그 소속 측량기술자 중 지적기술자를 참여시키도록 요청할 수 있다.\n⑤ 중앙지적위원회로부터 의결서를 받은 국토교통부장관은 그 의결서를 지적소관청에 송부하여야 한다.","4","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",2,0],[36,2025,22,13,4,"부동산등기법","등기신청(공동·단독·전자신청)","","등기권리자와 등기의무자가 등기를 공동으로 신청해야 하는 경우는?\n① 특정유증에 따른 등기\n② 이행판결에 의한 등기\n③ 부동산표시의 변경등기\n④ 소유권보존등기의 말소등기\n⑤ 신탁재산에 속하는 부동산의 신탁등기","1","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",2,0],[36,2025,22,14,4,"공간정보법","토지의 이동(분할·합병·등록전환 등)","박스형(모두고르기)","합필의 등기를 할 수 있는 경우를 모두 고른 것은? (단, 토지소유자가 지적소관청에 토지합병을 신청할 당시부터 아래의 등기가 존재함) ㄱ. 합필하려는 토지에 지상권의 등기가 있는 경우 ㄴ. 합필하려는 토지의 소유자별 공유지분이 다른 경우 ㄷ. 합필하려는 토지에 가등기담보권의 등기가 있는 경우 ㄹ. 합필하려는 토지에 승역지에 하는 지역권의 등기가 있는 경우 ㅁ. 합필하려는 모든 토지에 등기원인 및 그 연월일과 접수번호가 동일한 저당권의 등기가 있는 경우\n① ㄱ, ㄴ\n② ㄷ, ㅁ\n③ ㄱ, ㄴ, ㄷ\n④ ㄱ, ㄹ, ㅁ\n⑤ ㄴ, ㄷ, ㄹ, ㅁ","4","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",2,0],[36,2025,22,15,4,"부동산등기법","등기신청(공동·단독·전자신청)","판례","부동산등기를 신청하는 경우에 등기소에 제공하여야 할 신청정보 및 첨부정보에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)\n① 「민법」상 사단법인이 부동산취득에 따른 소유권이전등기를 신청하는 경우에는 주무관청의 허가증명서면을 첨부해야 한다.\n② 학교법인의 기본재산인 부동산에 관한 처분에 따른 등기신청에는 관할청의 허가를 증명하는 서면을 첨부할 필요가 없다.\n③ 공동신청 또는 승소한 등기권리자의 단독신청에 의하여 권리에 관한 등기를 신청하는 경우에는 등기필정보를 제공해야 한다.\n④ 농지를 매수한 자가 농지에 관하여 소유권이전등기를 마쳤더라도 농지취득자격증명을 발급받지 못하였다면 그 소유권을 취득하지 못한다.\n⑤ 토지에 관한 매매계약 체결 후 토지거래허가구역으로 지정된 경우에도 관할청의 토지거래허가서를 첨부하지 않으면 소유권이전등기를 마칠 수 없다.","4","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",2,0],[36,2025,22,16,4,"부동산등기법","등기 일반·효력","틀린것 고르기","등기의 신청에 관한 설명으로 틀린 것은?\n\n① 공동상속인 중 일부는 자신의 상속지분만에 대한 상속등기를 신청할 수 없다.\n\n② 「민법」상 조합재산에 속하는 부동산의 등기는 그 조합의 명의로 조합원이 신청할 수 있다.\n\n③ 등기원인이 발생한 후에 등기권리자에 대하여 상속이 있는 경우, 상속인이 그 등기를 신청할 수 있다.\n\n④ 건물 또는 토지의 소유권을 포기한 경우, 그 소유권을 포기한 자는 단독으로 그에 따른 등기를 신청할 수 없다.\n\n⑤ 전세권의 범위를 10층 북쪽 201㎡에서 3층 동쪽 485㎡로 변경하는 경우, 전세권변경등기가 아니라 별개의 전세권설정등기를 신청해야 한다.","2","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",3,0],[36,2025,22,17,4,"부동산등기법","등기 일반·효력","","주등기의 방식으로 하는 등기는?\n\n① 환매특약의 등기\n\n② 지상권의 이전등기\n\n③ 공유물 분할금지의 약정등기\n\n④ 전세권을 목적으로 하는 저당권의 이전등기\n\n⑤ 등기의 전부가 말소된 경우 그 전부에 대한 회복등기","5","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",3,0],[36,2025,22,18,4,"부동산등기법","소유권 등기(보존·이전·신탁·공동소유)","박스형(모두고르기)","소유권에 관한 등기에 대한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 소유권보존등기에는 등기원인과 그 연월일을 기록한다.\nㄴ. 공유물분할금지 약정의 변경등기는 공유자 전원이 공동으로 신청하여야 한다.\nㄷ. 시장의 확인에 의하여 미등기 토지의 소유자임을 증명하는 자는 소유권보존등기를 신청할 수 있다.\nㄹ. 등기관이 미등기 토지에 관해 법원의 촉탁으로 경매개시결정 등기를 할 때에는 직권으로 소유권보존등기를 한다.\n\n① ㄹ\n\n② ㄱ, ㄷ\n\n③ ㄴ, ㄹ\n\n④ ㄱ, ㄴ, ㄷ\n\n⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",3,0],[36,2025,22,19,4,"부동산등기법","용익권·담보권 등기","틀린것 고르기","등기관이 승역지의 등기기록에 지역권설정의 등기를 할 때 기록하여야 할 사항이 아닌 것은?\n\n① 범위\n\n② 요역지\n\n③ 지역권자\n\n④ 지역권설정의 목적\n\n⑤ 등기원인 및 그 연월일","3","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",3,0],[36,2025,22,20,4,"부동산등기법","용익권·담보권 등기","틀린것 고르기","임차권등기에 관한 설명으로 틀린 것은?\n\n① 공유지분에 대한 임차권을 등기할 수 있다.\n\n② 지하공간에 상하의 범위를 정하여 하는 구분임차권등기는 허용되지 않는다.\n\n③ 상가건물 임차권등기명령은 임대인에게 그 결정이 송달된 때에 효력이 생긴다.\n\n④ 임차인이 「주택임대차보호법」상 우선변제권을 갖추고 임대인의 협력을 얻어 임대차등기를 신청하는 경우에는 신청서에 임차주택을 점유한 날을 기재하여야 한다.\n\n⑤ 임차인이 「상가건물임대차보호법」상 대항력을 갖추고 임대인의 협력을 얻어 임대차등기를 신청하는 경우에는 신청서에 사업자등록을 신청한 날을 기재하여야 한다.","1","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",3,0],[36,2025,22,21,4,"부동산등기법","등기 일반·효력","틀린것 고르기","부동산등기의 신청에 관한 설명으로 틀린 것은?\n\n① 법인 아닌 사단이나 재단은 전자신청을 할 수 없다.\n\n② 공유자 중 1인은 자기 지분만의 소유권이전등기를 신청할 수 없다.\n\n③ 공유지분을 목적으로 하는 지상권설정등기를 공동으로 신청할 수 없다.\n\n④ 외국인은 외국인등록을 하였거나 국내거소신고를 한 경우에 전자신청을 할 수 있다.\n\n⑤ 소유권의 등기명의인 지방자치단체가 등기의무자로서 등기를 방문신청하는 경우, 인감증명을 제출할 필요가 없다.","2","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",3,0],[36,2025,22,22,4,"부동산등기법","소유권 등기(보존·이전·신탁·공동소유)","틀린것 고르기","부동산등기법상 신탁등기에 관한 설명으로 틀린 것은?\n\n① 수탁자가 여러 명인 경우, 등기관은 신탁재산이 공유인 뜻을 기록하여야 한다.\n\n② 신탁원부에 신탁관리인의 성명 및 주소를 기록하는 경우, 수익자의 성명 및 주소를 기재하지 않을 수 있다.\n\n③ 수탁자가 동일한 여러 개의 신탁을 합병하는 경우, 수탁자는 단독으로 신탁부동산에 관한 권리변경등기를 신청할 수 있다.\n\n④ 위탁자와 수익자의 합의로 수탁자를 해임한 경우, 신수탁자는 단독으로 신탁부동산에 관한 권리이전등기를 신청할 수 있다.\n\n⑤ 등기관이 수탁자의 변경으로 인한 신탁부동산의 이전등기를 하는 경우, 직권으로 그 부동산에 관한 신탁원부 기록의 변경등기를 하여야 한다.","1","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",3,0],[36,2025,22,23,4,"부동산등기법","용익권·담보권 등기","","1필의 토지 전부에 대한 지상권설정기청구권보전 가등기에 의해 지상권설정의 본등기가 행해진 경우, 가등기 후 본등기 전에 마쳐진 등기로서 직권말소의 대상이 되는 것은?\n\n① 저당권설정등기\n\n② 토지임차권설정등기\n\n③ 체납처분으로 인한 압류등기\n\n④ 가압류 및 가처분 등 처분제한의 등기\n\n⑤ 소유권이전등기 및 소유권이전등기청구권보전 가등기","2","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",3,0],[36,2025,22,24,4,"부동산등기법","등기신청(공동·단독·전자신청)","박스형(모두고르기)","등기신청의 각하결정에 대한 이의신청에 따라 관할 지방법원이 그 등기의 기록명령을 하였더라도 그 기록명령에 따른 등기를 할 수 없는 경우를 모두 고른 것은?\nㄱ. 지상권말소등기의 기록명령이 있었으나, 그 기록명령에 따른 등기 전에 지상권을 목적으로 한 저당권이 성립한 경우\nㄴ. 소유권이전등기의 기록명령이 있었으나, 그 기록명령에 따른 등기 전에 제3자 명의로 소유권이전등기가 되어 있는 경우\nㄷ. 임차권설정등기의 기록명령이 있었으나, 그 기록명령에 따른 등기 전에 동일한 부분에 임차권설정등기가 되어 있는 경우\nㄹ. 등기관이 기록명령에 따른 등기를 하기 위하여 신청인에게 첨부정보를 다시 등기소에 제공할 것을 명령하였으나, 신청인이 이에 응하지 아니한 경우\n\n① ㄱ\n\n② ㄴ, ㄷ\n\n③ ㄷ, ㄹ\n\n④ ㄱ, ㄴ, ㄹ\n\n⑤ ㄱ, ㄴ, ㄷ, ㄹ","5","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",3,0],[36,2025,22,25,5,"조세총론","조세총론(납세의무·부과·징수)","틀린것 고르기","국세기본법령 및 지방세기본법령상 납세의무의 성립 시기에 관한 설명으로 틀린 것은?(단, 원천징수, 예정신고 및 수시부과의 경우는 고려하지 않음)\n\n① 토지에 대한 양도소득세: 과세기간이 끝나는 때\n\n② 주택에 대한 종합부동산세: 과세기준일\n\n③ 전세권설정등기에 대한 등록면허세: 등기하는 때\n\n④ 토지에 대한 재산세: 과세기준일\n\n⑤ 건축물에 대한 지역자원시설세: 취득하는 때","5","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",4,0],[36,2025,22,26,5,"조세총론","조세총론(납세의무·부과·징수)","틀린것 고르기","지방세기본법령상 가산세에 관한 설명으로 틀린 것은?\n\n① 지방세를 감면하는 경우 가산세는 감면대상에 포함하지 아니한다.\n\n② 사기나 그 밖의 부정한 행위로 법정신고기한까지 과세표준 신고를 하지 아니한 경우(기한 후 신고는 하지 않음) 무신고납부세액의 100분의 40에 상당하는 금액을 무신고가산세로 부과한다.\n\n③ 신고 당시 소유권에 대한 소송으로 상속재산으로 확정되지 아니하여 과소신고한 경우 과소신고가산세를 부과하지 아니한다.\n\n④ 지방자치단체의 장은 「지방세기본법」 또는 지방세관계법에 따라 가산세를 부과하는 경우 납세자가 해당 의무를 이행하지 아니한 정당한 사유가 있을 때에는 납세자가 법령에 따른 신청을 하는 경우 가산세를 부과하지 아니한다.\n\n⑤ 법정신고기한이 지난 후 1개월 이내에 지방자치단체의 장이 과세표준과 세액을 결정할 것을 미리 알고 기한후신고서를 제출한 경우 무신고가산세액의 100분의 50에 상당하는 금액을 감면한다.","5","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",4,0],[36,2025,22,27,5,"등록면허세","등록면허세","","지방세법령상 등록면허세에 관한 설명으로 옳은 것은?\n\n① 취득가액이 50만원인 토지의 소유권 이전 등기를 하는 자는 등록면허세 납세의무가 없다.\n\n② 부동산 등기에 대한 등록면허세의 납세지는 소유자의 주소지이다.\n\n③ 부동산 등기에 대한 등록면허세의 과세표준은 취득당시의 가액으로 한다.\n\n④ 월 임대차금액의 1천분의 2로 계산한 임차권 설정등기의 등록면허세액이 11만2천500원보다 적을 때에는 11만2천500원으로 한다.\n\n⑤ 채권자대위자는 납세의무자를 대위하여 부동산의 등기에 대한 등록면허세를 신고납부할 수 있다.","5","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",4,0],[36,2025,22,28,5,"재산세","재산세","틀린것 고르기","지방세법령상 재산세 징수에 관한 설명으로 틀린 것은?\n\n① 지방자치단체의 장은 재산세 납부세액이 1천만원을 초과하는 경우 납세의무자의 신청을 받아 해당 지방자치단체의 관할구역에 있는 부동산에 대하여만 대통령령으로 정하는 바에 따라 물납을 허가할 수 있다.\n\n② 지방자치단체의 장은 재산세 납부세액이 250만원을 초과하는 경우 대통령령으로 정하는 바에 따라 납부할 세액의 일부를 납부기한이 지난 날부터 3개월 이내에 분할납부하게 할 수 있다.\n\n③ 「지방세법」 제118조의2에 따른 주택 재산세의 납부유예를 신청한 납세의무자는 그 유예할 주택 재산세에 상당하는 담보를 제공하여야 한다.\n\n④ 고지서 1장당 재산세로 징수할 세액이 2천원 미만인 경우 해당 재산세를 징수하지 아니한다.\n\n⑤ 신탁재산의 수탁자는 신탁 설정일 전에 법정기일이 도래한 위탁자의 재산세에 대하여 그 신탁재산으로써 납부할 의무가 있다.","5","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",4,0],[36,2025,22,29,5,"재산세","재산세","박스형(모두고르기), 틀린것 고르기","지방세법령상 재산세에 관한 설명으로 틀린 것은 모두 몇 개인가?\n○ 재산세 과세대상 중 토지란 지적공부의 등록대상이 되는 토지뿐만 아니라 그 밖에 사용되고 있는 사실상의 토지를 말하므로 「주택법」 제2조 제1호에 따른 주택의 부속토지를 포함한다.\n○ 재산세 과세기준일 현재 공부상의 소유자가 매매 등의 사유로 소유권이 변동되었는데도 신고하지 아니하여 사실상의 소유자를 알 수 없을 때에는 재산세를 부과하지 않는다.\n○ 재산세 과세기준일 현재 소유권의 귀속이 분명하지 아니하여 사실상의 소유자를 확인할 수 없는 경우에는 재산세를 부과하지 않는다.\n○ 재산세 과세대상 물건의 공부상 등재현황과 사실상의 현황이 다른 경우 공부상 등재현황에 따라 재산세를 부과하는 경우가 있다.\n○ 건축물에 대한 재산세 과세대상은 종합합산과세대상, 별도합산과세대상 및 분리과세대상으로 구분한다.\n\n① 1개\n\n② 2개\n\n③ 3개\n\n④ 4개\n\n⑤ 5개","4","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",4,0],[36,2025,22,30,5,"취득세","취득세","박스형(모두고르기)","지방세법령상 취득세에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 취득이란 매매, 교환 등 유상의 취득을 말하며 기부는 제외한다.\nㄴ. 건축물 중 조작 설비, 그 밖의 부대설비에 속하는 부분으로서 그 주체구조부와 하나가 되어 건축물로서의 효용가치를 이루고 있는 것에 대하여는 주체구조부 취득자 외의 자가 가설한 경우에도 주체구조부의 취득자가 함께 취득한 것으로 본다.\nㄷ. 토지의 지목을 사실상 변경함으로써 그 가액이 증가하거나 감소한 경우에는 취득으로 본다.\nㄹ. 피상속인이 상속인에게 한 유증은 상속으로 인하여 취득하는 경우에 포함되지 않으므로 상속인 각자가 상속받는 취득물건을 취득한 것으로 보지 않는다.\nㅁ. 「주택법」 제11조에 따른 주택조합이 해당 조합원용으로 취득하는 조합주택용 부동산 중에서 공동주택 부대시설·복리시설은 조합원에게 귀속되는 부동산이라 하더라도 그 조합원이 취득한 것으로 보지 않는다.\n\n① ㄴ\n\n② ㄱ, ㅁ\n\n③ ㄴ, ㅁ\n\n④ ㄷ, ㄹ\n\n⑤ ㄷ, ㄹ, ㅁ","1","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",4,0],[36,2025,22,31,5,"재산세","재산세","계산","지방세법령상 2025년도에 납세의무가 성립하는 재산세의 과세표준을 산정하는 경우, 지방세법시행령 제110조의2에 따라 1세대 1주택으로 인정되는 주택 중 시가표준액이 6억원을 초과하는 주택에 적용하는 공정시장가액비율은?\n\n① 시가표준액의 100분의 43\n\n② 시가표준액의 100분의 44\n\n③ 시가표준액의 100분의 45\n\n④ 시가표준액의 100분의 60\n\n⑤ 시가표준액의 100분의 70","3","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",5,0],[36,2025,22,32,5,"취득세","취득세","","지방세법령상 취득세의 비과세에 관한 다음 설명에서 밑줄 친 '대통령령으로 정하는 가액 이하의 주택'이 의미하는 것은?\n「주택법」 제2조 제3호에 따른 공동주택의 개수(「건축법」 제2조 제1항 제9호에 따른 대수선은 제외한다)로 인한 취득 중 '대통령령으로 정하는 가액 이하의 주택'과 관련된 개수로 인한 취득에 대해서는 취득세를 부과하지 아니한다.\n\n① 공동주택의 개수 이전 최초 취득 당시 「지방세법」 제4조에 따른 주택의 시가표준액이 6억원 이하인 주택\n\n② 공동주택의 개수 이전 최초 취득 당시 실지거래가액이 9억원 이하인 주택\n\n③ 공동주택의 개수로 인한 취득 당시 「지방세법」 제4조에 따른 주택의 시가표준액이 9억원 이하인 주택\n\n④ 공동주택의 개수로 인한 취득 당시 주택의 실지거래가액이 6억원 이하인 주택\n\n⑤ 공동주택의 개수로 인한 취득 당시 인근 유사 주택의 부동산거래신고 내역으로 확인된 거래가액이 6억원 이하인 주택","3","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",5,0],[36,2025,22,33,5,"종합부동산세","종합부동산세","틀린것 고르기","종합부동산세법령상 토지에 대한 과세 및 부과·징수 등에 관한 설명으로 틀린 것은?(단, 2025년도 납세의무 성립분임)\n\n① 토지에 대한 종합부동산세는 국내에 소재하는 토지에 대하여 종합합산과세대상과 별도합산과세대상으로 구분하여 과세한다.\n\n② 별도합산과세대상인 토지에 대한 종합부동산세의 과세표준은 납세의무자별로 해당 과세대상토지의 공시가격을 합산한 금액에서 80억원을 공제한 금액에 100분의 100의 공정시장가액비율을 곱한 금액(영보다 작은 경우에는 영으로 본다)으로 한다.\n\n③ 종합부동산세를 신고납부방식으로 납부하고자 하는 납세의무자는 종합부동산세의 과세표준과 세액을 해당 연도 12월 1일부터 12월 15일까지 대통령령으로 정하는 바에 따라 관할세무서장에게 신고하여야 한다.\n\n④ 납세의무자가 토지분 종합부동산세의 납부유예를 그 납부기한 만료일까지 신청하는 경우 관할세무서장은 이를 허가할 수 있다.\n\n⑤ 관할세무서장은 법령에 따른 주택분 종합부동산세의 납부유예 신청을 받은 경우 납부기한 만료일까지 대통령령으로 정하는 바에 따라 납세의무자에게 납부유예 허가 여부를 통지하여야 한다.","4","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",5,0],[36,2025,22,34,5,"종합부동산세","종합부동산세","","종합부동산세법령상 주택에 대한 과세에 관한 설명으로 옳은 것은?(단, 2025년도 납세의무 성립분임)\n\n① 「신탁법」 제2조에 따른 수탁자의 명의로 등기된 신탁주택의 경우 그 위탁자는 종합부동산세를 납부할 의무가 없다.\n\n② 과세표준 합산의 대상에 포함되지 아니하는 주택을 보유한 납세의무자는 해당 연도 10월 16일부터 10월 31일까지 해당 주택의 보유현황을 신고하여야 한다.\n\n③ 공익법인등이 직접 공익목적사업에 사용하는 1주택만을 보유한 경우 종합부동산세의 세율은 1천분의 50을 적용한다.\n\n④ 「민간임대주택에 관한 특별법」에 따른 민간임대주택으로서 임대기간, 주택의 수, 가격, 규모 등을 고려하여 대통령령으로 정하는 주택은 법령에 따라 해당 주택의 보유현황을 신고한 경우 종합부동산세 과세표준 합산의 대상이 되는 주택의 범위에 포함되지 아니하는 것으로 본다.\n\n⑤ 2주택을 소유하여 1천분의 27의 세율이 적용되는 법인의 경우 해당 연도에 납부하여야 할 주택에 대한 총세액상당액으로서 세부담의 상한을 초과하는 세액에 대해서는 이를 없는 것으로 본다.","4","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",5,0],[36,2025,22,35,5,"양도소득세","양도소득세","","소득세법령상 거주자의 양도소득세 신고 및 납부에 관한 설명으로 옳은 것은?\n\n① 토지거래계약에 관한 허가구역에 있는 토지를 양도할 때 토지거래계약허가를 받기 전에 대금을 청산한 경우 그 허가일이 속하는 분기의 말일부터 2개월 이내에 양도소득세과세표준 예정신고를 하여야 한다.\n\n② 법령에 따른 부담부증여의 채무액에 해당하는 부분으로서 양도로 보는 경우 그 양도일이 속하는 반기의 말일부터 3개월 이내에 양도소득세과세표준을 신고하여야 한다.\n\n③ 양도차손이 발생한 경우 양도소득세과세표준 예정신고를 하지 아니한다.\n\n④ 해당 과세기간의 양도소득금액이 있는 경우 해당 과세기간의 과세표준이 없다면 양도소득과세표준 확정신고를 하지 아니한다.\n\n⑤ 확정신고납부를 하는 경우 「소득세법」 제107조에 따른 예정신고 산출세액이 있을 때에는 이를 공제하여 납부한다.","5","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",5,0],[36,2025,22,36,5,"종합소득세","부동산임대 사업소득","박스형(모두고르기)","소득세법령상 거주자의 부동산임대 등에 관한 설명으로 옳은 것을 모두 고른 것은? ㄱ. 부동산임대업에서 발생하는 사업소득이 있는 자가 사업장 소재지를 납세지로 신청한 경우 국세청장 또는 관할지방국세청장은 대통령령으로 정하는 바에 따라 사업장 소재지를 납세지로 지정할 수 있다. ㄴ. 국외에 소재하는 주택 1개만을 소유하는 자의 해당 주택 임대소득은 비과세소득이다. ㄷ. 광업재단을 대여하는 사업은 부동산임대업에 해당되지 않는다. ㄹ. 해당 과세기간의 주거용 건물 임대업을 제외한 부동산임대업에서 발생한 결손금은 그 과세기간의 종합소득 과세표준을 계산할 때 공제하지 아니한다.\n① ㄱ, ㄴ\n② ㄱ, ㄹ\n③ ㄴ, ㄷ\n④ ㄱ, ㄷ, ㄹ\n⑤ ㄴ, ㄷ, ㄹ","2","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",6,0],[36,2025,22,37,5,"양도소득세","양도소득세","빈칸","다음은 소득세법시행령 제168조의6 ‘비사업용 토지의 기간기준’의 일부이다. ( )에 들어갈 숫자로 옳은 것은? ○ 토지의 소유기간이 5년 이상인 경우에는 다음 각 목의 모두에 해당하는 기간 가. 양도일 직전 5년 중 ( ㄱ )년을 초과하는 기간 나. 양도일 직전 3년 중 ( ㄴ )년을 초과하는 기간 다. 토지의 소유기간의 100분의 ( ㄷ )에 상당하는 기간을 초과하는 기간\n① ㄱ: 2, ㄴ: 1, ㄷ: 30\n② ㄱ: 2, ㄴ: 1, ㄷ: 40\n③ ㄱ: 3, ㄴ: 2, ㄷ: 30\n④ ㄱ: 3, ㄴ: 2, ㄷ: 40\n⑤ ㄱ: 4, ㄴ: 2, ㄷ: 40","2","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",6,0],[36,2025,22,38,5,"양도소득세","양도소득세","틀린것 고르기, 계산","소득세법령상 거주자가 실지거래가액에 따른 양도차익을 계산할 때 양도가액에서 공제할 필요경비에 관한 설명으로 틀린 것은?(단, 자본적지출액 등 및 양도비 등은 그 지출에 관하여 법령에 따른 증명서류를 수취·보관하거나 실제 지출사실이 금융거래 증명서류에 의하여 확인되는 경우에 한함)\n① 양도자산을 취득한 후 쟁송이 있는 경우에 그 소유권을 확보하기 위하여 직접 소요된 소송비용·화해비용 등의 금액으로서 그 지출한 연도의 각 소득금액의 계산에 있어서 필요경비에 산입된 금액은 자본적지출액 등에 해당한다.\n② 「소득세법」 제94조 제1항 각 호의 자산을 양도하기 위하여 직접 지출한 비용으로서 매매계약에 따른 인도의무를 이행하기 위하여 양도자가 지출하는 명도비용은 양도비 등에 해당한다.\n③ 「소득세법시행령」 제163조 제1항 제1호을 적용할 때 당사자 약정에 의한 대금지급방법에 따라 취득원가에 이자상당액을 가산하여 거래가액을 확정하는 경우 당해 이자상당액은 취득원가에 포함한다. 다만, 당초 약정에 의한 거래가액의 지급기일의 지연으로 인하여 추가로 발생하는 이자상당액은 취득원가에 포함하지 아니한다.\n④ 「재건축초과이익 환수에 관한 법률」에 따른 재건축부담금(재건축부담금의 납부의무자와 양도자가 서로 다른 경우에는 양도자에게 사실상 배분될 재건축부담금상당액)은 자본적지출액 등에 해당한다.\n⑤ 「소득세법」 제94조 제1항 제1호의 토지를 취득함에 있어서 법령 등의 규정에 따라 매입한 토지개발채권을 만기전에 기획재정부령으로 정하는 금융기관에 양도함으로써 발생하는 매각차손은 양도비 등에 해당한다.","1","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",6,0],[36,2025,22,39,5,"양도소득세","양도소득세","박스형(모두고르기), 옳은것 고르기","소득세법령상 양도소득세 비과세의 배제와 관련하여 미등기양도제외 자산에 해당하는 것을 모두 고른 것은? ㄱ. 법원의 결정에 의하여 양도 당시 그 자산의 취득에 관한 등기가 불가능한 자산 ㄴ. 장기할부조건으로 취득한 자산으로서 그 계약조건에 의하여 양도 당시 그 자산의 취득에 관한 등기가 불가능한 자산 ㄷ. 「도시개발법」에 따른 도시개발사업이 종료되지 아니하여 토지 취득등기를 하지 아니하고 양도하는 토지 ㄹ. 건설사업자가 「도시개발법」에 따라 공사용역 대가로 취득한 체비지를 토지구획환지처분공고 후 에 양도하는 토지\n① ㄱ, ㄴ\n② ㄴ, ㄹ\n③ ㄱ, ㄴ, ㄷ\n④ ㄱ, ㄷ, ㄹ\n⑤ ㄱ, ㄴ, ㄷ, ㄹ","3","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",6,0],[36,2025,22,40,5,"양도소득세","양도소득세","계산","다음 자료를 바탕으로 소득세법령상 甲의 토지A에 대한 양도소득세를 계산할 때 양도차익은?(단, 양도차익 계산시 공제할 자본적지출액 등과 양도비 등은 없는 것으로 가정하고, 주어진 조건 이외에는 고려하지 않음) ○ 거주자 甲은 2010. 1. 10. 甲과 특수관계가 없는 자로부터 국내소재 토지A를 5억원에 매입하여 등기한 후, 2025. 5. 3. 은행B에게 토지A에 근저당권을 설정해주고 2억원을 차입하였다. ○ 甲은 2025. 8. 5. 甲의 동생인 거주자 乙에게 상기 차입금 2억원을 인수하는 조건으로 토지A를 증여(「상속세 및 증여세법」에 따른 시가 및 증여가액 10억원)하였고, 乙은 상기 차입금 전부를 인수하였다.\n① 0원\n② 1억원\n③ 2억원\n④ 4억원\n⑤ 5억원","2","1efkdr25XpBQOqWf-Cn021zgGeV4mA_Ad",6,0],[37,2026,11,1,0,"부동산의 개념·특성","부동산 개념·특성·분류","옳은것 고르기, 빈칸","토지에 관한 용어이다. ( )에 들어갈 내용으로 옳은 것은? ○ 자연적ㆍ인문적 조건에 따라 다른 토지와 구별되는 가격(가치)수준이 비슷한 일단의 토지는 ( ㄱ )이다. ○ 하천 양쪽에 연속적으로 설치한 제방으로부터 하천 쪽에 있는 토지는 ( ㄴ )이다.\n\n① ㄱ: 획지, ㄴ: 제내지\n\n② ㄱ: 획지, ㄴ: 제외지\n\n③ ㄱ: 단지, ㄴ: 제내지\n\n④ ㄱ: 단지, ㄴ: 제외지\n\n⑤ 이며, 다른 조건은 동일함)\n\n\n① 수요가 불변이고 공급이 증가하는 경우, 균형가격은 하락하고 균형거래량은 증가한다.\n\n② 수요가 감소하고 공급이 불변인 경우, 균형가격은 하락하고 균형거래량은 감소한다.\n\n③ 수요는 감소하고 공급이 증가하는데 수요의 감소폭보다 공급의 증가폭이 더 큰 경우, 균형가격은 하락하고 균형거래량은 감소한다.\n\n④ 수요는 증가하고 공급이 감소하는데 수요의 증가폭보다 공급의 감소폭보다 더 큰 경우, 균형가격은 상승하고 균형거래량은 증가한다.\n\n⑤ 수요와 공급이 동시에 증가하고 수요의 증가폭이 공급의 증가폭보다 더 큰 경우, 균형가격은 상승하고 균형거래량은 증가한다.","12/2 발표 후 추가","16y7rV494NY5-lTbsuBylbf6n6maI34Cc",2,0],[37,2026,11,14,0,"개발·관리·마케팅","부동산관리","빈칸","부동산관리방식에 관한 내용이다. ( )에 들어갈 내용으로 옳은 것은?\n\nㅇ ( ㄱ )관리방식은 건물관리의 전문성을 통하여 노후화의 최소화 및 효율적 관리가 가능하여 대형건물의 관리에 유용하나, 기밀유지가 어려운 단점이 있다.\nㅇ ( ㄴ )관리방식은 일반주택이나 소규모 부동산에 유효한 관리방법으로서 소유자의 통제력이 강하나, 관리의 전문성이 결여될 수 있다.\n\n\n① ㄱ: 위탁, ㄴ: 자치\n\n② ㄱ: 자치, ㄴ: 혼합\n\n③ ㄱ: 자치, ㄴ: 간접\n\n④ ㄱ: 혼합, ㄴ: 위탁\n\n⑤ ㄱ: 자치, ㄴ: 위탁","12/2 발표 후 추가","16y7rV494NY5-lTbsuBylbf6n6maI34Cc",2,0],[37,2026,11,15,0,"경제론","수요·공급 결정요인·균형","틀린것 고르기","수요와 공급에 관한 설명으로 틀린 것은?(단, X축은 수량, Y축은 가격을 나타내고, 수요곡선은 우하향, 공급곡선은 우상향하며, 다른 조건은 동일함)\n\n\n① 수요의 법칙에 따르면 가격과 수요량은 서로 반대방향으로 변화한다.\n\n② 공급곡선은 공급자가 상품을 공급할 때 각각의 수량 단위에서 얻고자 하는 최소한의 가격(공급가격)을 나타낸다.\n\n③ 수요함수는 수요에 영향을 미치는 요인들과 수요량의 관계를 나타낸 함수이다.\n\n④ 시장공급곡선은 개별공급곡선을 수직으로 합하여 도출한다.\n\n⑤ 수요곡선은 한계편익곡선을 의미한다.","12/2 발표 후 추가","16y7rV494NY5-lTbsuBylbf6n6maI34Cc",2,0],[37,2026,11,16,0,"경제론","수요·공급 결정요인·균형","틀린것 고르기","유량(flow)의 경제변수에 해당하지 않는 것은?\n\n\n① 주택재고\n\n② 가계소득\n\n③ 주택거래량\n\n④ 아파트 생산량\n\n⑤ 신규주택 공급량","12/2 발표 후 추가","16y7rV494NY5-lTbsuBylbf6n6maI34Cc",2,0],[37,2026,11,17,0,"시장론","부동산시장 일반","틀린것 고르기","부동산시장과 경기변동에 관한 이론의 내용으로 틀린 것은?(단, 다른 조건은 동일함)\n\n\n① 상향시장 국면에서는 매수자가 주도하는 시장이 형성되고, 직전 국면의 사례가격이 새로운 거래의 상한선이 된다.\n\n② 회복시장 국면에서는 매수자가 주도하는 시장에서 매도자가 주도하는 시장으로 변화하는 경향이 있다.\n\n③ 거미집모형에서는 수요곡선의 기울기 절댓값이 공급곡선의 기울기 절댓값보다 작으면 수렴형이다.\n\n④ 거미집모형에서는 수요의 가격탄력성 절댓값이 공급의 가격탄력성 절댓값보다 크면 수렴형이다.\n\n⑤ 벌집순환모형(honeycomb cycle model)은 주택시장의 경기가 수요자와 공급자의 반응 및 공급의 시차를 중심으로 6각형의 벌집모양을 띄며 순환한다는 경기변동 이론이다.","12/2 발표 후 추가","16y7rV494NY5-lTbsuBylbf6n6maI34Cc",3,0],[37,2026,11,18,0,"경제론","수요·공급 결정요인·균형","박스형(모두고르기), 옳은것 고르기","아파트에서 수요를 증가시키는 요인에 해당하는 것으로 옳은 것을 모두 고른 것은?(단 은것 고르기, 계산","A는 10년 후 기말에 목표금액 1억원을 상환할 목적으로 매월 초 일정금액을 감채기금으로 적립하려 한다. 정기적금의 명목 이자율이 연 5%일 때, A의 월 적립금액을 계산하는 수식으로 옳은 것은?(단, 월 복리이며, 주어진 조건에 한함)\n\n\n① $\\frac{0.05 / 12}{(1 + 0.05 / 12)^{12 \\times 10} - 1} \\times 100,000,000$\n\n② $\\frac{0.05 / 12}{(1 + 0.05 / 12)^{12 \\times 10} - 1} \\times \\frac{100,000,000}{1 + 0.05 / 12}$\n\n③ $\\frac{0.05}{12} \\times \\frac{(1 + 0.05 / 12)^{12 \\times 10 - 1}}{(1 + 0.05 / 12)^{12 \\times 10} - 1} \\times 100,000,000$\n\n④ $\\frac{0.05}{12} \\times \\frac{(1 + 0.05 / 12)^{12 \\times 10}}{(1 + 0.05 / 12)^{12 \\times 10} - 1} \\times 100,000,000$\n\n⑤ $\\frac{1}{(1 + 0.05 / 12)^{12 \\times 10}} \\times 100,000,000$","12/2 발표 후 추가","16y7rV494NY5-lTbsuBylbf6n6maI34Cc",5,0],[37,2026,11,34,0,"금융론","유동화·MBS·리츠·PF","박스형(모두고르기)","자산유동화에 관한 법령상 유동화자산의 양도방식에 관한 내용으로 옳은 것을 모두 고른 것은?\n\nㄱ. 매매 또는 교환으로 할 것\nㄴ. 유동화자산에 대한 수익권은 양수인이, 처분권은 양도인이 가질 것\nㄷ. 양도인은 유동화자산에 대한 반환청구권을 가지지 아니하고, 양수인은 유동화자산에 대한 대가의 반환청구권을 가지지 아니할 것\nㄹ. 양도인이 양도된 자산에 관한 위험을 인수할 것. 다만, 양수인이 일정 기간 하자담보책임을 지는 경우는 제외한다.\n\n\n① ㄱ, ㄴ\n\n② ㄱ, ㄷ\n\n③ ㄴ, ㄹ\n\n④ ㄱ, ㄷ, ㄹ\n\n⑤ ㄴ, ㄷ, ㄹ","12/2 발표 후 추가","16y7rV494NY5-lTbsuBylbf6n6maI34Cc",5,0],[37,2026,11,35,0,"감정평가론","감정평가에 관한 규칙","박스형(모두고르기)","다음 중 감정평가에 관한 규칙상 대상물건별로 정한 감정평가방법(주된 감정평가방법)에도 불구하고 본래 용도의 효용가치가 없는 경우 해체처분가액으로 감정평가할 수 있는 것은 모두 몇 개인가?\n\n토지, 건물, 자동차, 항공기, 상표권\n\n\n① 1개\n\n② 2개\n\n③ 3개\n\n④ 4개\n\n⑤ 5개","12/2 발표 후 추가","16y7rV494NY5-lTbsuBylbf6n6maI34Cc",5,0],[37,2026,11,36,0,"감정평가론","감정평가에 관한 규칙","","감정평가에 관한 규칙에 규정된 내용으로 옳은 것은?\n\n\n① 가치형성요인이란 대상물건의 경제적 가치에영향을 미치는 일반요인, 지역요인 및 개별요인 등을 말한다.\n\n② 기준시점이란 대상물건의 감정평가를 시작하는 기준이 되는 날짜를 말한다.\n\n③ 인근지역이란 대상부동산이 속한 지역으로서 부동산의 이용이 동질적이고 가치형성요인 중 개별요인을 공유하는 지역을 말한다.\n\n④ 유사지역이란 대상부동산이 속하는 지역으로서 인근지역과 유사한 특성을 갖는 지역을 말한다.\n\n⑤ 동일수급권이란 대상부동산과 대체·경쟁 관계가 성립하고 가치 형성에 서로 영향을 미치지 않는 관계에 있는 다른 부동산이 존재하는 권역을 말하며, 인근지역과 유사지역을 포함한다.","12/2 발표 후 추가","16y7rV494NY5-lTbsuBylbf6n6maI34Cc",5,0],[37,2026,11,37,0,"감정평가론","감정평가 3방식·시산가액","틀린것 고르기","감정평가방법 중 적산법에 관한 설명으로 틀린 것은?\n\n\n① 비용성의 원리에 기초한 감정평가방식에
