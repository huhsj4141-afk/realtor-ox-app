경우 다른 국세에 충당할 수 없다.\n② 양도소득과세표준과 세액을 결정 또는 경정한 경우 관할세무서장이 결정한 양도소득 총결정세액이 이미 납부한 확정신고세액을 초과할 때에는 그 초과하는 세액을 해당 거주자에게 알린 날부터 30일 이내에 징수한다. 2022년 제33회 공인중개\n③ 양도소득세 과세대상 건물을 양도한 거주자는 부담부증여의 채무액을 양도로 보는 경우 예정신고 없이 확정신고를 하여야 한다.\n④ 양도소득세 납세의무의 확정은 납세의무자의 신고에 의하지 않고 관할세무서장의 결정에 의한다.\n⑤ 이미 납부한 확정신고세액이 관할세무서장이 결정한 양도소득 총결정세액을 초과할 때에는 해당 결정일부터 90일 이내에 환급해야 한다.","2","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",6,0],[33,2022,22,39,5,"양도소득세","양도소득세","옳은것 고르기, 빈칸","소득세법 시행령 제155조 ‘1세대 1주택의 특례’에 관한 조문의 내용이다. ( )에 들어갈 숫자로 옳은 것은?\n○ 영농의 목적으로 취득한 귀농주택으로서 수도권 밖의 지역 중 면지역에 소재하는 주택과 일반주택을 국내에 각각 1개씩 소유하고 있는 1세대가 귀농주 택을 취득한 날부터 ( ㄱ )년 이내에 일반주택을 양도하는 경우에는 국내에 1개의 주택을 소유하고 있는 것으로 보아 제154조 제1항을 적용한다.\n○ 취학 등 부득이한 사유로 취득한 수도권 밖에 소재하는 주택과 일반주택을 국내에 각각 1개씩 소유하고 있는 1세대가 부득이한 사유가 해소된 날부터 ( ㄴ )년 이내에 일반주택을 양도하는 경우에는 국내에 1개의 주택을 소유하고 있는 것으로 보아 제154조 제1항을 적용한다.\n○ 1주택을 보유하는 자가 1주택을 보유하는 자와 혼인함으로써 1세대가 2주택을 보유하게 되는 경우 혼인한 날부터 ( ㄷ )년 이내에 먼저 양도하는 주택은 이를 1세대 1주택으로 보아 제154조 제1항을 적용한다.\n① ㄱ: 2, ㄴ: 2, ㄷ: 5 ② ㄱ: 2, ㄴ: 3, ㄷ: 10\n③ ㄱ: 3, ㄴ: 2, ㄷ: 5 ④ ㄱ: 5, ㄴ: 3, ㄷ: 5\n⑤ ㄱ: 5, ㄴ: 3, ㄷ: 10","4","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",6,0],[33,2022,22,40,5,"취득세","취득세","옳은것 고르기","지방세법상 취득세에 관한 설명으로 옳은 것은?\n① 건축물 중 부대설비에 속하는 부분으로서 그 주체구조부와 하나가 되어 건축물로서의 효용가치를 이루고 있는 것에 대하여는 주체구조부 취득자 외의 자가 가설한 경우에도 주체구조부의 취득자가 함께 취득한 것으로 본다.\n② 세대별 소유주택 수에 따른 중과 세율을 적용함에 있어 주택으로 재산세를 과세하는 오피스텔(2022년 취득)은 해당 오피스텔을 소유한 자의 주택 수에 가산하지 아니한다.\n③ 납세의무자가 토지의 지목을 사실상 변경한 후 산출세액에 대한 신고를 하지 아니하고 그 토지를 매각하는 경우에는 산출세액에 100분의 80을 가산한 금액을 세액으로 하여 징수한다.\n④ 공사현장사무소 등 임시건축물의 취득에 대하여는 그 존속기간에 관계없이 취득세를 부과하지 아니한다.\n⑤ 토지를 취득한 자가 취득한 날부터 1년 이내에 그에 인접한 토지를 취득한 경우 그 취득가액이 100만원일 때에는 취득세를 부과하지 아니한다. 개","1","1JMeJWkMcza7YqKVDFftZDtCz5tsBecCn",6,0],[34,2023,11,1,0,"부동산의 개념·특성","부동산 개념·특성·분류","틀린것 고르기","토지의 특성에 관한 설명으로 틀린 것은?\n① 용도의 다양성으로 인해 두 개 이상의 용도가 동시에 경 합할 수 없고 용도의 전환 및 합병ㆍ분할을 어렵게 한다.\n② 부증성으로 인해 토지의 물리적 공급이 어려우므로 토지이용의 집약화가 요구된다.\n③ 부동성으로 인해 주변 환경의 변화에 따른 외부효과가 나타날 수 있다.\n④ 영속성으로 인해 재화의 소모를 전제로 하는 재생산이 론과 물리적 감가상각이 적용되지 않는다.\n⑤ 개별성으로 인해 토지별 완전한 대체 관계가 제약된다.","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",1,0],[34,2023,11,2,0,"부동산의 개념·특성","부동산 개념·특성·분류","틀린것 고르기","부동산의 개념에 관한 설명으로 틀린 것은?\n① 민법 상 부동산은 토지 및 그 정착물이다.\n② 경제적 측면의 부동산은 부동산가치에 영향을 미치는 수익성, 수급조절, 시장정보를 포함한다.\n③ 물리적 측면의 부동산에는 생산요소, 자산, 공간, 자연이 포함된다.\n④ 등기ㆍ등록의 공시방법을 갖춤으로써 부동산에 준하여 취급되는 동산은 준부동산으로 간주한다.\n⑤ 공간적 측면의 부동산에는 지하, 지표, 공중공간이 포함된다.","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",1,0],[34,2023,11,3,0,"부동산의 개념·특성","부동산 개념·특성·분류","","토지 관련 용어의 설명으로 옳게 연결된 것은?\nㄱ. 소유권이 인정되지 않는 바다와 육지 사이의 해변 토지\nㄴ. 택지경계와 인접한 경사된 토지로 사실상 사용이 불가능한 토지\nㄷ. 택지지역 내에서 공업지역이 상업지역으로 용도가 전환되고 있는 토지\nㄹ. 임지지역ㆍ농지지역ㆍ택지지역 상호간에 다른 지역으로 전환되고 있는 일단의 토지\n① ㄱ: 공지, ㄴ: 빈지, ㄷ: 후보지, ㄹ: 이행지\n② ㄱ: 법지, ㄴ: 빈지, ㄷ: 이행지, ㄹ: 후보지\n③ ㄱ: 법지, ㄴ: 공지, ㄷ: 후보지, ㄹ: 이행지\n④ ㄱ: 빈지, ㄴ: 법지, ㄷ: 이행지, ㄹ: 후보지\n⑤ ㄱ: 빈지, ㄴ: 법지, ㄷ: 후보지, ㄹ: 이행지","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",1,0],[34,2023,11,4,0,"경제론","수요·공급 결정요인·균형","옳은것 고르기","해당 부동산시장의 수요곡선을 우측(우상향)으로 이동하게 하는 수요변화의 요인에 해당하는 것은?(단, 수요곡선은 우하향하고, 해당 부동산은 정상재이며, 다른 조건은 동일함)\n① 대출금리의 상승\n② 보완재 가격의 하락\n③ 대체재 수요량의 증가 2023년 제34회 공인중개\n④ 해당 부동산 가격의 상승\n⑤ 해당 부동산 선호도의 감소","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",1,0],[34,2023,11,5,0,"시장론","주택여과·주거분리·거미집","옳은것 고르기","거미집모형에 관한 설명으로 옳은 것은?(단, 다른 조건은 동일함)\n① 수요의 가격탄력성이 공급의 가격탄력성보다 크면 발산형이다.\n② 가격이 변동하면 수요와 공급은 모두 즉각적으로 반응 한다는 가정을 전제하고 있다.\n③ 수요곡선의 기울기 절댓값이 공급곡선의 기울기 절댓값보다 작으면 수렴형이다.\n④ 수요와 공급의 동시적 관계로 가정하여 균형의 변화를 정태적으로 분석한 모형이다.\n⑤ 공급자는 현재와 미래의 가격을 동시에 고려해 미래의 공급을 결정한다는 가정을 전제하고 있다.","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",1,0],[34,2023,11,6,0,"경제론","수요·공급 결정요인·균형","옳은것 고르기","A지역의 기존 아파트 시장의 수요함수는 P = -Qd + 40, 공급함수는 P = 2/3Qs + 20 이었다. 이후 수요함수는 변하지 않고 공급함수가 P = 2/3Qs + 10 으로 변하였다. 다음 설명으로 옳은 것은?[단, X축은 수량, Y축은 가격, P는 가격(단위는 만원/m²), Qd는 수요량(단위는 m²), Qs는 공급량(단위는 m²)이며, 다른 조건은 동일함]\n\n① 아파트 공급량의 증가에 따른 공급량의 변화로 공급곡선이 좌측(좌상향)으로 이동하였다.\n\n② 기존 아파트 시장 균형가격은 22만원/m²이다.\n\n③ 공급함수 변화 이후의 아파트 시장 균형량은 12m²이다.\n\n④ 기존 아파트 시장에서 공급함수 변화로 인한 아파트 시장 균형가격은 6만원/m² 만큼 하락하였다.\n\n⑤ 기존 아파트 시장에서 공급함수 변화로 인한 아파트 시장 균형량은 8m² 만큼 증가하였다.","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",1,0],[34,2023,11,7,0,"경제론","탄력성","옳은것 고르기","수요와 공급의 가격탄력성에 관한 설명으로 옳은 것은?(단, X축은 수량, Y축은 가격, 수요의 가격탄력성은 절댓값을 의미하며, 다른 조건은 동일함)\n\n① 가격이 변화하여도 수요량이 전혀 변화하지 않는다면, 수요의 가격탄력성은 완전탄력적이다.\n\n② 가격변화율보다 공급량의 변화율이 커서 1보다 큰 값을 가진다면, 공급의 가격탄력성은 비탄력적이다.\n\n③ 공급의 가격탄력성이 0이라면, 완전탄력적이다.\n\n④ 수요의 가격탄력성이 1보다 작은 값을 가진다면, 수요의 가격탄력성은 탄력적이다.\n\n⑤ 공급곡선이 수직선이면, 공급의 가격탄력성은 완전비탄력적이다.","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",1,0],[34,2023,11,8,0,"경제론","수요·공급 결정요인·균형","틀린것 고르기","부동산의 수요와 공급에 관한 설명으로 틀린 것은?\n(단, 부동산은 정상재이며, 다른 조건은 동일함)\n① 수요곡선상의 수요량은 주어진 가격에서 수요자들이 구입 또는 임차하고자 하는 부동산의 최대수량이다.\n② 부동산의 공급량과 그 공급량에 영향을 주는 요인들과의 관계를 나타낸 것이 공급함수이다.\n③ 공급의 법칙에 따르면 가격(임대료)과 공급량은 비례관계이다.\n④ 부동산 시장수요곡선은 개별수요곡선을 수직으로 합하 여 도출한다.\n⑤ 건축원자재의 가격 상승은 부동산의 공급을 축소시켜 공급곡선을 좌측(좌상향)으로 이동하게 한다.","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",2,0],[34,2023,11,9,0,"입지·지대이론","공업입지·지대이론","옳은것 고르기","지대이론에 관한 설명으로 옳은 것은?\n① 튀넨(J. H. von Thünen)의 위치지대설에 따르면, 비옥도 차이에 기초한 지대에 의해 비농업적 토지이용이 결정된다.\n② 마샬(A. Marshall)의 준지대설에 따르면, 생산을 위하여 사람이 만든 기계나 기구들로부터 얻은 일시적인 소득은 준지대에 속한다.\n③ 리카도(D. Ricardo)의 차액지대설에서 지대는 토지의 생산성과 운송비의 차이에 의해 결정된다.\n④ 마르크스(K. Marx)의 절대지대설에 따르면, 최열등지에서는 지대가 발생하지 않는다.\n⑤ 헤이그(R. Haig)의 마찰비용이론에서 지대는 마찰비용과 교통비의 합으로 산정된다.","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",2,0],[34,2023,11,10,0,"입지·지대이론","공업입지·지대이론","","도시공간구조이론 및 입지이론에 관한 설명으로 옳은 것은?\n① 버제스(E. Burgess)의 동심원이론에서 통근자지대는 가장 외곽에 위치한다.\n② 호이트(H. Hoyt)의 선형이론에 따르면, 도시공간구조의 성장과 분화는 점이지대를 향해 직선으로 확대되면서 나타난다.\n③ 해리스(C. Harris)와 울만(E. Ullman)의 다핵심이론에는 중심업무지구와 점이지대가 존재하지 않는다.\n④ 뢰쉬(A. Lösch)의 최대수요이론은 운송비와 집적이익을 고려한 특정 사업의 팔각형 상권체계 과정을 보여준다.\n⑤ 레일리(W. Reilly)의 소매인력법칙은 특정 점포가 최대 이익을 확보하기 위해 어떤 장소에 입지하는가에 대한 8원칙을 제시한다.","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",2,0],[34,2023,11,11,0,"입지·지대이론","공업입지·지대이론","","X와 Y지역의 산업별 고용자수가 다음과 같을 때, X 지역의 입지계수(LQ)에 따른 기반산업의 개수는?\n(단, 주어진 조건에 한함) 구 분 X지역 Y지역 전지역 A산업 30 50 80 B산업 50 40 90 C산업 60 50 110 D산업 100 20 120 E산업 80 60 140 전산업 고용자수 320 220 540\n① 0개 ② 1개 ③ 2개 ④ 3개 ⑤ 4개 2023년 제34회 공인중개","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",2,0],[34,2023,11,12,0,"입지·지대이론","상업입지이론","계산","허프(D. Huff)모형을 활용하여 점포 A의 월 매출액을 추정하였는데, 착오에 의해 공간(거리)마찰계수가 잘못 적용된 것을 확인하였다. 올바르게 추정한 점포 A의 월 매출액은 잘못 추정한 점포 A의 월 매출액 보다 얼마나 증가하는가?(단, 주어진 조건에 한함)\n○ X지역의 현재 주민: 10,000명\n○ 1인당 월 점포 소비액: 30만원\n○ 올바른 공간(거리)마찰계수: 2\n○ 잘못 적용된 공간(거리)마찰계수: 1\n○ X지역의 주민은 모두 구매자이고, 점포(A, B, C) 에서만 구매한다고 가정함\n○ 각 점포의 매출액은 X지역 주민에 의해서만 창출됨 구 분 점포 A 점포 B 점포 C 면 적 750 m2 2,500 m2 500 m2 X지역 거주지 5 km 10 km 5 km 로부터의 거리\n① 1억원 ② 2억원 ③ 3억원 ④ 4억원 ⑤ 5억원","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",2,0],[34,2023,11,13,0,"입지·지대이론","공업입지·지대이론","틀린것 고르기","베버(A. Weber)의 최소비용이론에 관한 설명으로 틀린 것은?(단, 기업은 단일 입지 공장이고, 다른 조건은 동일함)\n① 최소비용지점은 최소운송비 지점, 최소노동비 지점, 집적이익이 발생하는 구역을 종합적으로 고려해서 결정한다.\n② 등비용선(isodapane)은 최소운송비 지점으로부터 기업이 입지를 바꿀 경우, 운송비와 노동비가 동일한 지점을 연결한 곡선을 의미한다.\n③ 원료지수(material index)가 1보다 큰 공장은 원료지향 적 입지를 선호한다.\n④ 제품 중량이 국지원료 중량보다 큰 제품을 생산하는 공장은 시장지향적 입지를 선호한다.\n⑤ 운송비는 원료와 제품의 무게, 원료와 제품이 수송되는 거리에 의해 결정된다.","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",2,0],[34,2023,11,14,0,"입지·지대이론","상업입지이론","옳은것 고르기","크리스탈러(W. Christaller)의 중심지이론에 관한 설명으로 옳은 것은?\n① 최소요구범위 - 중심지 기능이 유지되기 위한 최소한의 수요 요구 규모\n② 최소요구치 - 중심지로부터 어느 기능에 대한 수요가 0 이 되는 곳까지의 거리\n③ 배후지 - 중심지에 의해 재화와 서비스를 제공받는 주 변지역\n④ 도달범위 - 판매자가 정상이윤을 얻을 만큼의 충분한 소비자들을 포함하는 경계까지의 거리\n⑤ 중심지 재화 및 서비스 - 배후지에서 중심지로 제공되는 재화 및 서비스","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",2,0],[34,2023,11,15,0,"정책론","조세정책·조세전가","옳은것 고르기","우리나라 부동산 관련 조세에 관한 설명으로 옳은 것은?\nㄱ. 지방세 ㄴ. 국세\nㄷ. 취득단계 ㄹ. 처분단계 ㅁ. 보유단계\nㅂ. 물건별 과세표준에 대한 과세\nㅅ. 납세의무자별로 합산한 과세표준에 대한 과세\n① 취득세와 재산세는 (ㄱ, ㅁ, ㅅ)에 해당한다.\n② 취득세는 (ㄱ, ㄷ)에, 종합부동산세는 (ㄴ, ㅁ)에 해당하고, 공통점은 (ㅂ)에 해당한다.\n③ 재산세는 (ㄱ, ㅂ)에, 종합부동산세는 (ㄴ, ㅅ)에 해당하고, 공통점은 (ㅁ)에 해당한다.\n④ 양도소득세는 (ㄴ)에, 재산세는 (ㄱ)에 해당하고, 공통점은 (ㅁ, ㅅ)에 해당한다.\n⑤ 양도소득세와 종합부동산세는 (ㄴ, ㅁ, ㅂ)에 해당한다.","전항정답","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",3,0],[34,2023,11,16,0,"정책론","토지정책·지역지구제","박스형(모두고르기)","현재 우리나라에서 시행되고 있지 않는 부동산 정책 수단을 모두 고른 것은?\nㄱ. 택지소유상한제 ㄴ. 부동산거래신고제\nㄷ. 토지초과이득세 ㄹ. 주택의 전매제한\nㅁ. 부동산실명제 ㅂ. 토지거래허가구역\nㅅ. 종합부동산세 ㅇ. 공한지세\n① ㄱ, ㅇ ② ㄱ, ㄷ, ㅇ\n③ ㄱ, ㄹ, ㅁ, ㅂ ④ ㄴ, ㄷ, ㄹ, ㅁ, ㅅ\n⑤ ㄴ, ㄹ, ㅁ, ㅂ, ㅅ, ㅇ","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",3,0],[34,2023,11,17,0,"시장론","부동산시장 일반","틀린것 고르기","부동산시장에 대한 정부의 개입에 관한 설명으로 틀린 것은?\n① 부동산투기, 저소득층 주거문제, 부동산자원배분의 비효 율성은 정부가 부동산시장에 개입하는 근거가 된다.\n② 부동산시장실패의 대표적인 원인으로 공공재, 외부효과, 정보의 비대칭성이 있다.\n③ 토지비축제도는 공익사업용지의 원활한 공급과 토지시 장 안정을 위해 정부가 직접적으로 개입하는 방식이다.\n④ 토지수용, 종합부동산세, 담보인정비율, 개발부담금은 부동산시장에 대한 직접개입수단이다.\n⑤ 정부가 주택시장에 개입하여 민간분양주택 분양가를 규 제할 경우 주택산업의 채산성․수익성을 저하시켜 신축 민간주택의 공급을 축소시킨다.","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",3,0],[34,2023,11,18,0,"감정평가론","가치·가격원칙·지역분석","계산","다음과 같은 투자안에서 부동산의 투자가치는?(단, 연간 기준이며, 주어진 조건에 한함)\n○ 무위험률: 3 %\n○ 위험할증률: 4 %\n○ 예상인플레이션율: 2 %\n○ 예상순수익: 4,500만원\n① 4억원 ② 4억5천만원 ③ 5억원\n④ 5억5천만원 ⑤ 6억원 2023년 제34회 공인중개","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",3,0],[34,2023,11,19,0,"정책론","주택·임대료 정책","박스형(모두고르기), 틀린것 고르기","주거정책에 관한 설명으로 틀린 것을 모두 고른 것은?\nㄱ. 우리나라는 주거에 대한 권리를 인정하고 있지 않다.\nㄴ. 공공임대주택, 주거급여제도, 주택청약종합저축제도는 현재 우리나라에서 시행되고 있다.\nㄷ. 주택바우처는 저소득임차가구에 주택임대료를 일부 지원해주는 소비자보조방식의 일종으로 임차인의 주거지 선택을 용이하게 할 수 있다.\nㄹ. 임대료 보조정책은 민간임대주택의 공급을 장기적으로 감소시키고 시장임대료를 높인다.\nㅁ. 임대료를 균형가격 이하로 통제하면 민간임대주택의 공급량은 증가하고 질적 수준은 저하된다.\n① ㄱ, ㄴ, ㅁ ② ㄱ, ㄷ, ㅁ ③ ㄱ, ㄹ, ㅁ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄷ, ㄹ, ㅁ","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",3,0],[34,2023,11,20,0,"금융론","부동산금융 일반·주택금융","빈칸","다음 ( )에 들어갈 알맞은 내용은?\n○ ( ㄱ )은 공공주택특별법 시행령에 따른 국가나 지방자치단체의 재정이나 주택도시기금의 자금을 지원받아 전세계약의 방식으로 공급하는 공공임대주택이다.\n○ ( ㄴ )은 민간임대주택에 관한 특별법 에 따른 임대사업자가 매매 등으로 소유권을 취득하여 임대하는 민간임대주택을 말한다. ㄱ ㄴ\n① 국민임대주택 장기전세주택\n② 장기전세주택 기존주택전세임대주택\n③ 기존주택전세임대주택 국민임대주택\n④ 국민임대주택 민간매입임대주택\n⑤ 장기전세주택 민간매입임대주택","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",3,0],[34,2023,11,21,0,"투자론","현금흐름·수익률·위험","박스형(모두고르기), 옳은것 고르기","부동산투자 위험에 관한 설명으로 옳은 것을 모두고른 것은?\nㄱ. 표준편차가 작을수록 투자에 수반되는 위험은 커진다.\nㄴ. 위험회피형 투자자는 변이계수(변동계수)가 작은 투자안을 더 선호한다.\nㄷ. 경기침체, 인플레이션 심화는 비체계적 위험에 해당한다.\nㄹ. 부동산투자자가 대상부동산을 원하는 시기와 가격에 현금화하지 못하는 경우는 유동성위험에 해당한다.\n① ㄱ, ㄴ ② ㄱ, ㄷ ③ ㄴ, ㄷ ④ ㄴ, ㄹ ⑤ ㄷ, ㄹ","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",3,0],[34,2023,11,22,0,"감정평가론","가치·가격원칙·지역분석","계산","甲은 시장가치 5억원의 부동산을 인수하고자 한다. 해당 부동산의 부채감당률(DCR)은?(단, 모든 현금유출입은 연말에만 발생하며, 주어진 조건에 한함)\n○ 담보인정비율(LTV): 시장가치의 50 %\n○ 연간 저당상수: 0.12\n○ 가능총소득(PGI): 5,000만원\n○ 공실손실상당액 및 대손충당금: 가능총소득의 10 %\n○ 영업경비비율: 유효총소득의 28 %\n① 1.08 ② 1.20 ③ 1.50 ④ 1.67 ⑤ 1.80","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",3,0],[34,2023,11,23,0,"금융론","대출 상환방식·대출한도","계산","다음 자료는 A부동산의 1년간 운영수지이다. A부동산의 세후현금흐름승수는?(단, 주어진 조건에 한함)\n○ 총투자액: 50,000만원\n○ 지분투자액: 36,000만원\n○ 가능총소득(PGI): 6,000만원\n○ 공실률: 15%\n○ 재산세: 500만원\n○ 원리금상환액: 600만원\n○ 영업소득세: 400만원\n① 8 ② 10 ③ 12 ④ 15 ⑤ 20","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",4,0],[34,2023,11,24,0,"투자론","현금흐름·수익률·위험","틀린것 고르기","부동산투자에 관한 설명으로 틀린 것은?(단, 주어진 조건에 한함)\n① 시중금리 상승은 부동산투자자의 요구수익률을 하락시키는 요인이다.\n② 기대수익률은 투자로 인해 기대되는 예상수입과 예상지 출로부터 계산되는 수익률이다.\n③ 정(+)의 레버리지효과는 자기자본수익률이 총자본수익 률(종합수익률)보다 높을 때 발생한다.\n④ 요구수익률은 투자에 대한 위험이 주어졌을 때, 투자자가 대상부동산에 자금을 투자하기 위해 충족되어야 할 최소한의 수익률이다.\n⑤ 부동산투자자는 담보대출과 전세를 통해 레버리지를 활용할 수 있다.","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",4,0],[34,2023,11,25,0,"금융론","대출 상환방식·대출한도","틀린것 고르기, 계산","甲은 아래 조건으로 부동산에 10억원을 투자하였다. 이에 관한 투자분석의 산출값으로 틀린 것은?(단, 주어진 조건에 한함)\n○ 순영업소득(NOI): 2억원/년\n○ 원리금상환액: 2,000만원/년\n○ 유효총소득승수: 4\n○ 지분투자액: 8억원\n① 유효총소득은 2억5천만원\n② 부채비율은 25%\n③ 지분환원율은 25%\n④ 순소득승수는 5\n⑤ 종합환원율은 20%","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",4,0],[34,2023,11,26,0,"투자론","투자분석기법(NPV·IRR 등)","틀린것 고르기","부동산투자분석에 관한 설명으로 틀린 것은?\n① 내부수익률은 수익성지수를 0으로, 순현재가치를 1로 만드는 할인율이다.\n② 회계적 이익률법은 현금흐름의 시간적 가치를 고려하지 않는다.\n③ 내부수익률법에서는 내부수익률과 요구수익률을 비교하여 투자여부를 결정한다.\n④ 순현재가치법, 내부수익률법은 할인현금수지분석법에 해당한다.\n⑤ 담보인정비율(LTV)은 부동산가치에 대한 융자액의 비율이다. 2023년 제34회 공인중개","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",4,0],[34,2023,11,27,0,"금융론","대출 상환방식·대출한도","옳은것 고르기","PF(Project Financing)대출을 유동화하는 자산유동 화증권(ABS)과 자산담보부 기업어음(ABCP)에 관한 설명으로 옳은 것은?\n① ABS는 유치권의 방법으로, ABCP는 근저당의 방법으로 사업부지를 피담보채무의 담보로 확보하여야 한다.\n② ABS는 금융위원회에 등록한 이전 회차의 유동화계획을 따를 경우, 금융위원회에 등록 없이 금번 회차에도 동일하게 재발행할 수 있다.\n③ ABS는 유동화 도관체(conduit)가 개발업체에 직접 PF 대출을 제공한 후 해당 대출채권을 유동화할 수 있다.\n④ 공사대금 재원이 필요한 경우, 시행사는 공사대금채권을 담보로 ABCP를 발행하고 이를 통해 조달한 재원을 시공사에 지급한다.\n⑤ 채권형 ABS와 ABCP에서 수령하는 이자에 대하여 모든 개인투자자는 소득세 납부의무를 가진다.","전항정답","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",4,0],[34,2023,11,28,0,"정책론","주택·임대료 정책","계산","A회사는 전년도에 임대면적 750 m2 의 매장을 비율임대차(percentage lease)방식으로 임차하였다. 계약내용에 따르면, 매출액이 손익분기점 매출액 이하이면 기본임대료만 지급하고, 이를 초과하는 매출액에 대해서는 일정 임대료율을 적용한 추가임대료를 기본임대료에 가산하도록 하였다. 전년도 연임대료로 총 12,000만원을 지급한 경우, 해당 계약내용에 따른 추가임대료율은?(단, 연간 기준이며, 주어진 조건에 한함)\n○ 전년도 매출액: 임대면적 m2당 100만원\n○ 손익분기점 매출액: 임대면적 m2당 60만원\n○ 기본임대료: 임대면적 m2당 10만원\n① 15% ② 20% ③ 25% ④ 30% ⑤ 35%","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",4,0],[34,2023,11,29,0,"금융론","유동화·MBS·리츠·PF","틀린것 고르기","부동산투자회사법상 ‘자기관리 부동산투자회사’(REITs, 이하 “회사”라 한다)에 관한 설명으로 틀린 것은?\n① 국토교통부장관은 회사가 최저자본금을 준비하였음을 확인한 때에는 지체 없이 주요 출자자(발행주식 총수의 100분의 5를 초과하여 주식을 소유하는 자)의 적격성을 심사하여야 한다.\n② 최저자본금준비기간이 지난 회사의 최저자본금은 70억원 이상이 되어야 한다.\n③ 주요 주주는 미공개 자산운용정보를 이용하여 부동산을 매매하거나 타인에게 이용하게 하여서는 아니 된다.\n④ 회사는 그 자산을 투자ㆍ운용할 때에는 전문성을 높이고 주주를 보호하기 위하여 자산관리회사에 위탁하여야 한다.\n⑤ 주주총회의 특별결의에 따른 경우, 회사는 해당 연도 이익배당한도의 100분의 50 이상 100분의 90 미만으로 이익배당을 정한다.","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",4,0],[34,2023,11,30,0,"금융론","유동화·MBS·리츠·PF","옳은것 고르기","저당담보부증권(MBS)의 가격변동에 관한 설명으로 옳은 것은?(단, 주어진 조건에 한함)\n① 투자자들이 가까운 시일에 채권시장 수익률의 하락을 예상한다면, 가중평균상환기간(duration)이 긴 저당담보부증권일수록 그 가격이 더 크게 하락한다.\n② 채무불이행위험이 없는 저당담보부증권의 가격은 채권시장 수익률의 변동에 영향을 받지 않는다.\n③ 자본시장 내 다른 투자수단들과 경쟁하므로, 동일위험 수준의 다른 투자수단들의 수익률이 상승하면 저당담보부증권의 가격은 상승한다.\n④ 채권시장 수익률이 상승할 때 가중평균상환기간이 긴 저당담보부증권일수록 그 가격의 변동 정도가 작다.\n⑤ 고정이자를 지급하는 저당담보부증권은 채권시장 수익률이 상승하면 그 가격이 하락한다.","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",5,0],[34,2023,11,31,0,"투자론","투자분석기법(NPV·IRR 등)","박스형(모두고르기)","부동산투자의 분석기법 및 위험에 관한 설명으로 옳은 것을 모두 고른 것은?(단, 주어진 조건에 한함)\nㄱ. 경기침체로 부동산 수익성 악화가 야기하는 위험은 사업위험(business risk)에 해당한다.\nㄴ. 공실률, 부채서비스액은 유효총소득을 산정하는데 필요한 항목이다.\nㄷ. 위험회피형 투자자의 최적 포트폴리오는 투자자의 무차별곡선과 효율적 프론티어의 접점에서 선택된다.\nㄹ. 포트폴리오를 통해 제거 가능한 체계적인 위험은 부동산의 개별성에 기인한다.\nㅁ. 민감도분석을 통해 투입요소의 변화가 그 투자안의 내부수익률에 미치는 영향을 분석할 수 있다.\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄷ, ㅁ\n③ ㄱ, ㄹ, ㅁ ④ ㄴ, ㄷ, ㄹ, ㅁ\n⑤ ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",5,0],[34,2023,11,32,0,"개발·관리·마케팅","부동산관리","","부동산관리방식에 따른 해당 내용을 옳게 묶은 것은?\nㄱ. 소유자의 직접적인 통제권이 강화된다.\nㄴ. 관리의 전문성과 효율성을 높일 수 있다.\nㄷ. 기밀 및 보안 유지가 유리하다.\nㄹ. 건물설비의 고도화에 대응할 수 있다.\nㅁ. 대형건물의 관리에 더 유용하다.\nㅂ. 소유와 경영의 분리가 가능하다.\n① 자기관리방식 - ㄱ, ㄴ, ㄷ, ㄹ\n② 자기관리방식 - ㄱ, ㄷ, ㅁ, ㅂ\n③ 자기관리방식 - ㄴ, ㄷ, ㄹ, ㅂ\n④ 위탁관리방식 - ㄱ, ㄷ, ㄹ, ㅁ\n⑤ 위탁관리방식 - ㄴ, ㄹ, ㅁ, ㅂ","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",5,0],[34,2023,11,33,0,"개발·관리·마케팅","부동산마케팅","틀린것 고르기","부동산마케팅에 관한 설명으로 틀린 것은?\n① 부동산마케팅은 부동산상품을 수요자의 욕구에 맞게 상품을 개발하고 가격을 결정한 후 시장에서 유통, 촉진, 판매를 관리하는 일련의 과정이다.\n② STP전략은 대상 집단의 시장세분화(segmentation), 표적시장 선정(targeting), 포지셔닝(positioning)으로 구성된다. 2023년 제34회 공인중개\n③ 시장세분화 전략은 부동산시장에서 마케팅활동을 수행하기 위하여 수요자의 집단을 세분하는 것이다.\n④ 표적시장 전략은 세분화된 시장을 통해 선정된 표적 집단을 대상으로 적합한 마케팅활동을 수행하는 것이다.\n⑤ AIDA원리는 주의(attention), 관심(interest), 욕망\n(desire), 행동(action)의 단계를 통해 공급자의 욕구를 파악하여 마케팅 효과를 극대화하는 시장점유마케팅 전략의 하나이다.","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",5,0],[34,2023,11,34,0,"투자론","현금흐름·수익률·위험","빈칸","사회기반시설에 대한 민간투자법령상 BOT(build-op erate-transfer) 방식에 대한 내용이다. ( )에 들어갈 내용을 <보기>에서 옳게 고른 것은?\n사회기반시설의 ( ㄱ )에 일정기간 동안 ( ㄴ )에게 해당 시설의 소유권이 인정되며 그 기간이 만료되면 ( ㄷ )이 ( ㄹ )에 귀속되는 방식이다.\n<보기>\na. 착공 후 b. 준공 후\nc. 사업시행자 d. 국가 또는 지방자치단체\ne. 시설소유권 f. 시설관리운영권\n① ㄱ-a, ㄴ-c, ㄷ- e, ㄹ-d\n② ㄱ-a, ㄴ-c, ㄷ- e, ㄹ-c\n③ ㄱ-a, ㄴ-d, ㄷ-f, ㄹ- c\n④ ㄱ-b, ㄴ- c, ㄷ-e, ㄹ- d\n⑤ ㄱ-b, ㄴ- d, ㄷ-f, ㄹ-c","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",5,0],[34,2023,11,35,0,"감정평가론","감정평가 3방식·시산가액","계산","다음 자료를 활용하여 공시지가기준법으로 산정한 대상토지의 단위면적당 시산가액은?(단, 주어진 조건에 한함)\n○ 대상토지 현황: A시 B구 C동 120번지, 일반상업지역, 상업용\n○ 기준시점: 2023.10.28.\n○ 표준지공시지가(A시 B구 C동, 2023.01.01.기준) 기 공시지가 소재지 용도지역 이용상황 호 (원/m2) 1 C동 110 준주거지역 상업용 6,000,000 2 C동 130 일반상업지역 상업용 8,000,000\n○ 지가변동률(A시 B구, 2023.01.01.∼2023.10.28.)\n- 주거지역: 3% 상승\n- 상업지역: 5% 상승\n○ 지역요인: 표준지와 대상토지는 인근지역에 위치하 여 지역요인 동일함\n○ 개별요인: 대상토지는 표준지 기호 1에 비해 개별요인 10% 우세하고, 표준지 기호 2에 비해 개별요인 3% 열세함\n○ 그 밖의 요인 보정: 대상토지 인근지역의 가치형성요인이 유사한 정상적인 거래사례 및 평가사례 등을 고려하여 그 밖의 요인으로 50% 증액 보정함\n○ 상승식으로 계산할 것\n① 6,798,000원/m2 ② 8,148,000원/m2\n③ 10,197,000원/m2 ④ 12,222,000원/m2\n⑤ 13,860,000원/m2","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",5,0],[34,2023,11,36,0,"감정평가론","감정평가 3방식·시산가액","계산","다음 자료를 활용하여 원가법으로 산정한 대상건물의 시산가액은?(단, 주어진 조건에 한함)\n○ 대상건물 현황: 철근콘크리트조, 단독주택, 연면적 250 m2\n○ 기준시점: 2023.10.28.\n○ 사용승인일: 2015.10.28.\n○ 사용승인일의 신축공사비: 1,200,000원/m2(신축공사비는 적정함)\n○ 건축비지수(건설공사비지수)\n- 2015.10.28.: 100\n- 2023.10.28.: 150\n○ 경제적 내용연수: 50년\n○ 감가수정방법: 정액법\n○ 내용연수 만료 시 잔존가치 없음\n① 246,000,000원 ② 252,000,000원 ③ 258,000,000원\n④ 369,000,000원 ⑤ 378,000,000원","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",6,0],[34,2023,11,37,0,"감정평가론","감정평가 3방식·시산가액","박스형(모두고르기)","감정평가에 관한 규칙상 대상물건별로 정한 감정평가방법(주된 방법)이 수익환원법인 대상물건은 모두 몇 개인가?\n○ 상표권 ○ 임대료\n○ 저작권 ○ 특허권\n○ 과수원 ○ 기업가치\n○ 광업재단 ○ 실용신안권\n① 2개 ② 3개 ③ 4개 ④ 5개 ⑤ 6개","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",6,0],[34,2023,11,38,0,"감정평가론","감정평가에 관한 규칙","틀린것 고르기","감정평가에 관한 규칙에 규정된 내용으로 틀린 것은?\n① 수익분석법이란 대상물건의 기초가액에 기대이율을 곱하여 산정된 기대수익에 대상물건을 계속하여 임대하는 데에 필요한 경비를 더하여 대상물건의 임대료를 산정하는 감정평가방법을 말한다.\n② 가치형성요인이란 대상물건의 경제적 가치에 영향을 미치는 일반요인, 지역요인 및 개별요인 등을 말한다.\n③ 감정평가법인등은 법령에 다른 규정이 있는 경우에는 기준시점의 가치형성요인 등을 실제와 다르게 가정하거나 특수한 경우로 한정하는 조건을 붙여 감정평가할 수 있다.\n④ 일체로 이용되고 있는 대상물건의 일부분에 대하여 감정평가하여야 할 특수한 목적이나 합리적인 이유가 있는 경우에는 그 부분에 대하여 감정평가할 수 있다.\n⑤ 감정평가법인등은 법령에 다른 규정이 있는 경우에는 대상물건의 감정평가액을 시장가치 외의 가치를 기준으로 결정할 수 있다. 2023년 제34회 공인중개","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",6,0],[34,2023,11,39,0,"감정평가론","부동산가격공시","틀린것 고르기","부동산 가격공시에 관한 법령에 규정된 내용으로 틀린 것은?\n① 표준지공시지가는 토지시장에 지가정보를 제공하고 일반적인 토지거래의 지표가 되며, 국가ㆍ지방자치단체등이 그 업무와 관련하여 지가를 산정하거나 감정평가 법인등이 개별적으로 토지를 감정평가하는 경우에 기준이 된다.\n② 국토교통부장관이 표준지공시지가를 조사ㆍ산정할 때에는 한국부동산원법 에 따른 한국부동산원에게 이를 의뢰하여야 한다.\n③ 표준지공시지가에 이의가 있는 자는 그 공시일부터 30 일 이내에 서면(전자문서를 포함한다)으로 국토교통부장관에게 이의를 신청할 수 있다.\n④ 시장ㆍ군수 또는 구청장이 개별공시지가를 결정ㆍ공시하는 경우에는 해당 토지와 유사한 이용가치를 지닌다고 인정되는 하나 또는 둘 이상의 표준지의 공시지가를 기준으로 토지가격비준표를 사용하여 지가를 산정하되, 해당 토지의 가격과 표준지공시지가가 균형을 유지하도록 하여야 한다.\n⑤ 표준지로 선정된 토지에 대하여는 개별공시지가를 결정ㆍ공시하지 아니할 수 있다. 이 경우 표준지로 선정된 토지에 대하여는 해당 토지의 표준지공시지가를 개별공 시지가로 본다.","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",6,0],[34,2023,11,40,0,"감정평가론","가치·가격원칙·지역분석","옳은것 고르기","감정평가 과정상 지역분석 및 개별분석에 관한 설명으로 옳은 것은?\n① 동일수급권(同一需給圈)이란 대상부동산과 대체ㆍ경쟁관계가 성립하고 가치 형성에 서로 영향을 미치는 관계에 있는 다른 부동산이 존재하는 권역(圈域)을 말하며, 인근지역과 유사지역을 포함한다.\n② 지역분석이란 대상부동산이 속해 있는 지역의 지역요인을 분석하여 대상부동산의 최유효이용을 판정하는 것을 말한다.\n③ 인근지역이란 대상부동산이 속한 지역으로서 부동산의 이용이 동질적이고 가치형성요인 중 개별요인을 공유하는 지역을 말한다.\n④ 개별분석이란 대상부동산의 개별적 요인을 분석하여 해당 지역 내 부동산의 표준적 이용과 가격수준을 판정하는 것을 말한다.\n⑤ 지역분석보다 개별분석을 먼저 실시하는 것이 일반적이다.","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",6,0],[34,2023,11,41,1,"민법총칙","대리(무권대리·표현대리)","판례","다음 중 연결이 잘못된 것은?(다툼이 있으면 판례에 따름)\n① 임차인의 필요비상환청구권 - 형성권\n② 지명채권의 양도 - 준물권행위\n③ 부동산 매매에 의한 소유권 취득 - 특정승계\n④ 부동산 점유취득시효완성으로 인한 소유권 취득 - 원시취득\n⑤ 무권대리에서 추인 여부에 대한 확답의 최고 - 의사의 통지","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",7,0],[34,2023,11,42,1,"민법총칙","대리(무권대리·표현대리)","판례, 틀린것 고르기","甲으로부터 甲 소유 X토지의 매도 대리권을 수여받은 乙은 甲을 대리하여 丙과 X토지에 대한 매매계약을 체결하였다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 乙은 특별한 사정이 없는 한 매매잔금의 수령 권한을 가진다.\n② 丙의 채무불이행이 있는 경우, 특별한 사정이 없는 한 乙은 매매계약을 해제할 수 없다.\n③ 매매계약의 해제로 인한 원상회복의무는 甲과 丙이 부담한다.\n④ 丙이 매매계약을 해제한 경우, 丙은 乙에게 채무불이행으로 인한 손해배상을 청구할 수 없다.\n⑤ 乙이 자기의 이익을 위하여 배임적 대리행위를 하였고 丙도 이를 안 경우, 乙의 대리행위는 甲에게 효력을 미친다.","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",7,0],[34,2023,11,43,1,"민법총칙","법률행위(반사회·불공정)","판례, 옳은것 고르기","불공정한 법률행위에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 불공정한 법률행위에도 무효행위의 전환에 관한 법리가 적용될 수 있다.\n② 경락대금과 목적물의 시가에 현저한 차이가 있는 경우에도 불공정한 법률행위가 성립할 수 있다.\n③ 급부와 반대급부 사이에 현저한 불균형이 있는 경우, 원칙적으로 그 불균형 부분에 한하여 무효가 된다.\n④ 대리인에 의한 법률행위에서 궁박과 무경험은 대리인을 기준으로 판단한다.\n⑤ 계약의 피해당사자가 급박한 곤궁 상태에 있었다면 그 상대방에게 폭리행위의 악의가 없었더라도 불공정한 법률행위는 성립한다.","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",7,0],[34,2023,11,44,1,"민법총칙","대리(무권대리·표현대리)","판례, 틀린것 고르기","복대리에 관한 설명으로 틀린 것은?(특별한 사정은 없으며, 다툼이 있으면 판례에 따름)\n① 복대리인은 행위능력자임을 요하지 않는다.\n② 복대리인은 본인에 대하여 대리인과 동일한 권리의무가 있다.\n③ 법정대리인은 그 책임으로 복대리인을 선임할 수 있다. 2023년 제34회 공인중개\n④ 대리인의 능력에 따라 사업의 성공여부가 결정되는 사 무에 대해 대리권을 수여받은 자는 본인의 묵시적 승낙 으로도 복대리인을 선임할 수 있다.\n⑤ 대리인이 대리권 소멸 후 선임한 복대리인과 상대방 사이의 법률행위에도 민법 제129조의 표현대리가 성립할 수 있다.","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",7,0],[34,2023,11,45,1,"민법총칙","의사표시(착오·사기·통정허위)","박스형(모두고르기), 판례","통정허위표시를 기초로 새로운 법률상 이해관계를 맺은 제3자에 해당하는 자를 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 파산선고를 받은 가장채권자의 파산관재인\nㄴ. 가장채무를 보증하고 그 보증채무를 이행하여 구상권을 취득한 보증인\nㄷ. 차주와 통정하여 가장소비대차계약을 체결한 금융기관으로부터 그 계약을 인수한 자\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",7,0],[34,2023,11,46,1,"민법총칙","대리(무권대리·표현대리)","판례, 옳은것 고르기","무권대리인 乙이 甲을 대리하여 甲 소유의 X토지를 丙에게 매도하는 계약을 체결하였다. 다음 설명 중 옳은 것은?(다툼이 있으면 판례에 따름)\n① 위 매매계약이 체결된 후에 甲이 X토지를 丁에게 매도하고 소유권이전등기를 마쳤다면, 甲이 乙의 대리행위를 추인하더라도 丁은 유효하게 그 소유권을 취득한다.\n② 乙이 甲을 단독상속한 경우, 특별한 사정이 없는 한 乙 은 본인의 지위에서 추인을 거절할 수 있다.\n③ 甲의 단독상속인 戊는 丙에 대해 위 매매계약을 추인할 수 없다.\n④ 丙은 乙과 매매계약을 체결할 당시 乙에게 대리권이 없음을 안 경우에도 甲의 추인이 있을 때까지 그 매매계약을 철회할 수 있다.\n⑤ 甲이 乙의 대리행위에 대하여 추인을 거절하면, 乙이 미 성년자라도 丙은 乙에 대해 손해배상을 청구할 수 있다.","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",7,0],[34,2023,11,47,1,"민법총칙","법률행위(반사회·불공정)","박스형(모두고르기), 판례, 틀린것 고르기","반사회질서의 법률행위에 해당하지 않는 것을 모두고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 2023년 체결된 형사사건에 관한 성공보수약정\nㄴ. 반사회적 행위에 의해 조성된 비자금을 소극적으로 은닉하기 위해 체결한 임치약정\nㄷ. 산모가 우연한 사고로 인한 태아의 상해에 대 비하기 위해 자신을 보험수익자로, 태아를 피 보험자로 하여 체결한 상해보험계약\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",7,0],[34,2023,11,48,1,"민법총칙","무효·취소·추인","박스형(모두고르기), 판례, 옳은것 고르기","甲은 허가받을 것을 전제로 토지거래허가구역 내 자신의 토지에 대해 乙과 매매계약을 체결하였다. 다음 설명 중 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 甲은 특별한 사정이 없는 한 乙의 매매대금 이행제공이 있을 때까지 허가신청절차 협력의무의 이행을 거절할 수 있다.\nㄴ. 乙이 계약금 전액을 지급한 후, 당사자의 일방이 이행에 착수하기 전이라면 특별한 사정이 없는 한 甲은 계약금의 배액을 상환하고 계약을 해제할 수 있다.\nㄷ. 일정기간 내 허가를 받기로 약정한 경우, 특별한 사정이 없는 한 그 허가를 받지 못하고 약정기간이 경과하였다는 사정만으로도 매매계약은 확정적 무효가 된다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",8,0],[34,2023,11,49,1,"민법총칙","법률행위(반사회·불공정)","판례, 틀린것 고르기","법률행위의 부관에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 조건이 선량한 풍속 기타 사회질서에 위반한 경우, 그 조건만 무효이고 법률행위는 유효하다.\n② 법률행위에 조건이 붙어 있는지 여부는 조건의 존재를 주장하는 자에게 증명책임이 있다.\n③ 기한은 특별한 사정이 없는 한 채무자의 이익을 위한 것으로 추정한다.\n④ 조건부 법률행위에서 기성조건이 해제조건이면 그 법률행위는 무효이다.\n⑤ 종기(終期) 있는 법률행위는 기한이 도래한 때로부터 그 효력을 잃는다.","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",8,0],[34,2023,11,50,1,"민법총칙","무효·취소·추인","박스형(모두고르기), 판례, 옳은것 고르기","법률행위의 무효와 추인에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 무효인 법률행위의 추인은 무효원인이 소멸된 후 본인이 무효임을 알고 추인해야 그 효력이 인정된다.\nㄴ. 무권리자의 처분이 계약으로 이루어진 경우, 권리자가 추인하면 원칙적으로 계약의 효과는 계약체결시에 소급하여 권리자에게 귀속된다.\nㄷ. 양도금지특약에 위반하여 무효인 채권양도에 대해 양도대상이 된 채권의 채무자가 승낙하 면 다른 약정이 없는 한 양도의 효과는 승낙 시부터 발생한다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ 2023년 제34회 공인중개","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",8,0],[34,2023,11,51,1,"물권법","점유권","판례, 옳은것 고르기","점유자와 회복자의 관계에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 점유물이 점유자의 책임 있는 사유로 멸실된 경우, 선의의 타주점유자는 이익이 현존하는 한도에서 배상해야 한다.\n② 악의의 점유자는 특별한 사정이 없는 한 통상의 필요비를 청구할 수 있다.\n③ 점유자의 필요비상환청구에 대해 법원은 회복자의 청구에 의해 상당한 상환기간을 허여할 수 있다.\n④ 이행지체로 인해 매매계약이 해제된 경우, 선의의 점유자인 매수인에게 과실취득권이 인정된다.\n⑤ 은비(隱秘)에 의한 점유자는 점유물의 과실을 취득한다.","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",8,0],[34,2023,11,52,1,"물권법","공동소유","판례, 틀린것 고르기","민법상 합유에 관한 설명으로 틀린 것은?(특약은 없으며, 다툼이 있으면 판례에 따름)\n① 합유자의 권리는 합유물 전부에 미친다.\n② 합유자는 합유물의 분할을 청구하지 못한다.\n③ 합유자 중 1인이 사망하면 그의 상속인이 합유자의 지위를 승계한다.\n④ 합유물의 보존행위는 합유자 각자가 할 수 있다.\n⑤ 합유자는 그 전원의 동의 없이 합유지분을 처분하지 못한다.","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",8,0],[34,2023,11,53,1,"물권법","물권변동·등기","판례, 옳은것 고르기","부동산 소유권이전등기청구권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 교환으로 인한 이전등기청구권은 물권적 청구권이다.\n② 점유취득시효 완성으로 인한 이전등기청구권의 양도는 특별한 사정이 없는 한 양도인의 채무자에 대한 통지만 으로는 대항력이 생기지 않는다.\n③ 매수인이 부동산을 인도받아 사용․수익하고 있는 이상 매수인의 이전등기청구권은 시효로 소멸하지 않는다.\n④ 점유취득시효 완성으로 인한 이전등기청구권은 점유가 계속되더라도 시효로 소멸한다.\n⑤ 매매로 인한 이전등기청구권의 양도는 특별한 사정이 없는 한 양도인의 채무자에 대한 통지만으로 대항력이 생긴다.","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",8,0],[34,2023,11,54,1,"물권법","물권적 청구권","판례, 틀린것 고르기","물권적 청구권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 저당권자는 목적물에서 임의로 분리, 반출된 물건을 자 신에게 반환할 것을 청구할 수 있다.\n② 진정명의회복을 원인으로 한 소유권이전등기청구권의 법적 성질은 소유권에 기한 방해배제청구권이다.\n③ 소유자는 소유권을 방해하는 자에 대해 민법 제214조에 기해 방해배제비용을 청구할 수 없다.\n④ 미등기 무허가건물의 양수인은 소유권에 기한 방해배제 청구권을 행사할 수 없다.\n⑤ 소유권에 기한 방해배제청구권은 현재 계속되고 있는 방해원인의 제거를 내용으로 한다.","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",8,0],[34,2023,11,55,1,"물권법","소유권(취득시효·부합·상린)","판례, 옳은것 고르기","부동산 점유취득시효에 관한 설명으로 옳은 것은?\n(다툼이 있으면 판례에 따름)\n① 국유재산 중 일반재산이 시효완성 후 행정재산으로 되더라도 시효완성을 원인으로 한 소유권이전등기를 청구할 수 있다.\n② 시효완성 당시의 소유권보존등기가 무효라면 그 등기명의인은 원칙적으로 시효완성을 원인으로 한 소유권이전 등기청구의 상대방이 될 수 없다.\n③ 시효완성 후 점유자 명의로 소유권이전등기가 경료되기 전에 부동산 소유명의자는 점유자에 대해 점유로 인한 부당이득반환청구를 할 수 있다.\n④ 미등기부동산에 대한 시효가 완성된 경우, 점유자는 등기 없이도 소유권을 취득한다.\n⑤ 시효완성 전에 부동산이 압류되면 시효는 중단된다.","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",9,0],[34,2023,11,56,1,"물권법","물권변동·등기","판례, 틀린것 고르기","민법 제187조(등기를 요하지 아니하는 부동산물권취 득)에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 상속인은 상속 부동산의 소유권을 등기 없이 취득한다.\n② 민법 제187조 소정의 판결은 형성판결을 의미한다.\n③ 부동산 강제경매에서 매수인이 매각 목적인 권리를 취득하는 시기는 매각대금 완납시이다.\n④ 부동산소유권이전을 내용으로 하는 화해조서에 기한 소유권취득에는 등기를 요하지 않는다.\n⑤ 신축에 의한 건물소유권취득에는 소유권보존등기를 요하지 않는다.","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",9,0],[34,2023,11,57,1,"물권법","물권 일반","옳은것 고르기","물권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 물건 이외의 재산권은 물권의 객체가 될 수 없다.\n② 물권은 부동산등기규칙 에 의해 창설될 수 있다.\n③ 구분소유의 목적이 되는 건물의 등기부상 표시에서 전유부분의 면적 표시가 잘못된 경우, 그 잘못 표시된 면적만큼의 소유권보존등기를 말소할 수 없다.\n④ 1필의 토지의 일부를 객체로 하여 지상권을 설정할 수 없다.\n⑤ 기술적인 착오로 지적도의 경계선이 실제 경계선과 다르게 작성된 경우, 토지의 경계는 지적도의 경계선에의해 확정된다.","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",9,0],[34,2023,11,58,1,"물권법","전세권","판례, 옳은것 고르기","전세권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 전세권설정자의 목적물 인도는 전세권의 성립요건이다.\n② 타인의 토지에 있는 건물에 전세권을 설정한 경우, 전세권의 효력은 그 건물의 소유를 목적으로 한 지상권에 미친다. 2023년 제34회 공인중개\n③ 전세권의 사용․수익 권능을 배제하고 채권담보만을 위해 전세권을 설정하는 것은 허용된다.\n④ 전세권설정자는 특별한 사정이 없는 한 목적물의 현상을 유지하고 그 통상의 관리에 속한 수선을 해야 한다.\n⑤ 건물전세권이 법정갱신된 경우, 전세권자는 이를 등기 해야 제3자에게 대항할 수 있다.","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",9,0],[34,2023,11,59,1,"물권법","소유권(취득시효·부합·상린)","박스형(모두고르기), 판례, 옳은것 고르기","乙은 甲과의 지상권설정계약으로 甲 소유의 X토지에 지상권을 취득한 후, 그 지상에 Y건물을 완성하여 소유권을 취득하였다. 다음 설명 중 옳은 것을 모두고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 乙은 지상권을 유보한 채 Y건물 소유권만을 제3자에게 양도할 수 있다.\nㄴ. 乙은 Y건물 소유권을 유보한 채 지상권만을 제3자에게 양도할 수 있다.\nㄷ. 지료지급약정이 있음에도 乙이 3년분의 지료를 미지급한 경우, 甲은 지상권 소멸을 청구할 수 있다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",9,0],[34,2023,11,60,1,"물권법","지역권","판례, 틀린것 고르기","지역권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 지역권은 요역지와 분리하여 양도할 수 없다.\n② 공유자 중 1인이 지역권을 취득한 때에는 다른 공유자도 이를 취득한다.\n③ 통행지역권을 주장하는 자는 통행으로 편익을 얻는 요역지가 있음을 주장․증명해야 한다.\n④ 요역지의 불법점유자도 통행지역권을 시효취득할 수 있다.\n⑤ 지역권은 계속되고 표현된 것에 한하여 시효취득할 수 있다.","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",9,0],[34,2023,11,61,1,"물권법","물권변동·등기","박스형(모두고르기), 판례, 옳은것 고르기, 계산","甲은 乙에게 1억원을 대여하면서 乙 소유의 Y건물에 저당권을 취득하였다. 다음 설명 중 옳은 것을 모두고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 乙이 甲에게 피담보채권 전부를 변제한 경우, 甲의 저당권은 말소등기를 하지 않아도 소멸한다.\nㄴ. 甲은 Y건물의 소실로 인하여 乙이 취득한 화재보험금청구권에 대하여 물상대위권을 행사할 수 있다.\nㄷ. 甲은 저당권을 피담보채권과 분리하여 제3자에게 양도하지 못한다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",9,0],[34,2023,11,62,1,"물권법","저당권·근저당권","판례, 틀린것 고르기","근저당권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 채권최고액에는 피담보채무의 이자가 산입된다.\n② 피담보채무 확정 전에는 채무자를 변경할 수 있다.\n③ 근저당권자가 피담보채무의 불이행을 이유로 경매신청을 한 경우, 특별한 사정이 없는 한 피담보채무액은 그 신청시에 확정된다.\n④ 물상보증인은 채권최고액을 초과하는 부분의 채권액까 지 변제할 의무를 부담한다.\n⑤ 특별한 사정이 없는 한, 존속기간이 있는 근저당권은 그 기간이 만료한 때 피담보채무가 확정된다.","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",10,0],[34,2023,11,63,1,"물권법","유치권","판례, 틀린것 고르기","민법상 유치권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 유치권자는 유치물에 대한 경매권이 있다.\n② 유치권 발생을 배제하는 특약은 무효이다.\n③ 건물신축공사를 도급받은 수급인이 사회통념상 독립한 건물이 되지 못한 정착물을 토지에 설치한 상태에서 공사가 중단된 경우, 그 토지에 대해 유치권을 행사할 수 없다.\n④ 유치권은 피담보채권의 변제기가 도래하지 않으면 성립할 수 없다.\n⑤ 유치권자는 선량한 관리자의 주의로 유치물을 점유해야 한다.","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",10,0],[34,2023,11,64,1,"물권법","저당권·근저당권","판례, 옳은것 고르기","저당권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 전세권은 저당권의 객체가 될 수 없다.\n② 저당권 설정은 권리의 이전적 승계에 해당한다.\n③ 민법 제365조에 따라 토지와 건물의 일괄경매를 청구한 토지 저당권자는 그 건물의 경매대가에서 우선변제를 받을 수 있다.\n④ 건물 건축 개시 전의 나대지에 저당권이 설정될 당시 저당권자가 그 토지 소유자의 건물 건축에 동의한 경우, 저당토지의 임의경매로 인한 법정지상권은 성립하지 않는다.\n⑤ 저당물의 소유권을 취득한 제3자는 그 저당물의 보존을 위해 필요비를 지출하더라도 특별한 사정이 없는 한 그 저당물의 경매대가에서 우선상환을 받을 수 없다.","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",10,0],[34,2023,11,65,1,"계약법","매매(계약금·담보책임·환매)","틀린것 고르기","민법상 환매에 관한 설명으로 틀린 것은?\n① 환매권은 양도할 수 없는 일신전속권이다.\n② 매매계약이 무효이면 환매특약도 무효이다.\n③ 환매기간을 정한 경우에는 그 기간을 다시 연장하지 못한다.\n④ 환매특약등기는 매수인의 권리취득의 등기에 부기하는 방식으로 한다.\n⑤ 환매특약은 매매계약과 동시에 해야 한다. 2023년 제34회 공인중개사","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",10,0],[34,2023,11,66,1,"민법총칙","의사표시(착오·사기·통정허위)","판례, 틀린것 고르기","甲은 그 소유의 토지를 乙에게 매도하면서 甲의 丙에 대한 채무변제를 위해 乙이 그 대금 전액을 丙에게 지급하기로 하는 제3자를 위한 계약을 乙과 체결하였고, 丙도 乙에 대해 수익의 의사표시를 하였다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)\n① 乙은 甲과 丙 사이의 채무부존재의 항변으로 丙에게 대항할 수 없다.\n② 丙은 乙의 채무불이행을 이유로 甲과 乙 사이의 계약을 해제할 수 없다.\n③ 乙이 甲의 채무불이행을 이유로 계약을 해제한 경우, 특별한 사정이 없는 한 乙은 이미 이행한 급부의 반환을 丙에게 청구할 수 있다.\n④ 甲이 乙의 채무불이행을 이유로 계약을 해제하면, 丙은 乙에게 채무불이행으로 인해 자신이 입은 손해의 배상을 청구할 수 있다.\n⑤ 甲은 丙의 동의 없이도 乙의 채무불이행을 이유로 계약을 해제할 수 있다.","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",10,0],[34,2023,11,67,1,"계약법","매매(계약금·담보책임·환매)","박스형(모두고르기), 판례, 옳은것 고르기","甲과 乙은 甲 소유의 X토지에 대하여 매매계약을 체결하였으나 그 후 甲의 채무인 소유권이전등기의무의 이행이 불가능하게 되었다. 다음 설명 중 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 甲의 채무가 쌍방의 귀책사유 없이 불능이 된 경우, 이미 대금을 지급한 乙은 그 대금을 부당이득법리에 따라 반환청구할 수 있다.\nㄴ. 甲의 채무가 乙의 귀책사유로 불능이 된 경우, 특별한 사정이 없는 한 甲은 乙에게 대금지급을 청구할 수 있다.\nㄷ. 乙의 수령지체 중에 쌍방의 귀책사유 없이 甲 의 채무가 불능이 된 경우, 甲은 乙에게 대금지급을 청구할 수 없다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",10,0],[34,2023,11,68,1,"민법총칙","무효·취소·추인","박스형(모두고르기), 판례, 옳은것 고르기","매매에서 과실의 귀속과 대금의 이자 등에 관한 설명으로 옳은 것을 모두 고른 것은?(대금지급과 목적물인도는 동시이행관계에 있고, 다툼이 있으면 판례에 따름)\nㄱ. 매매계약 후 목적물이 인도되지 않더라도 매수인이 대금을 완제한 때에는 그 시점 이후 목적물로 부터 생긴 과실은 매수인에게 귀속된다.\nㄴ. 매수인이 대금지급을 거절할 정당한 사유가 있는 경우, 매수인은 목적물을 미리 인도받더라도 대금 이자의 지급의무가 없다.\nㄷ. 매매계약이 취소된 경우, 선의의 점유자인 매수인의 과실취득권이 인정되는 이상 선의의 매도인도 지급받은 대금의 운용이익 내지 법정이자를 반환할 의무가 없다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",10,0],[34,2023,11,69,1,"계약법","매매(계약금·담보책임·환매)","판례, 틀린것 고르기","매매의 일방예약에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 일방예약이 성립하려면 본계약인 매매계약의 요소가 되는 내용이 확정되어 있거나 확정할 수 있어야 한다.\n② 예약완결권의 행사기간 도과 전에 예약완결권자가 예약 목적물인 부동산을 인도받은 경우, 그 기간이 도과되더 라도 예약완결권은 소멸되지 않는다.\n③ 예약완결권은 당사자 사이에 행사기간을 약정한 때에는 그 기간 내에 행사해야 한다.\n④ 상가에 관하여 매매예약이 성립한 이후 법령상의 제한에 의해 일시적으로 분양이 금지되었다가 다시 허용된 경우, 그 예약완결권 행사는 이행불능이라 할 수 없다.\n⑤ 예약완결권 행사의 의사표시를 담은 소장 부본의 송달로써 예약완결권을 재판상 행사하는 경우, 그 행사가 유효하기 위해서는 그 소장 부본이 제척기간 내에 상대방에게 송달되어야 한다.","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",11,0],[34,2023,11,70,1,"계약법","매매(계약금·담보책임·환매)","판례, 틀린것 고르기","민법상 매매계약에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 매매계약은 낙성ㆍ불요식계약이다.\n② 타인의 권리도 매매의 목적이 될 수 있다.\n③ 매도인의 담보책임 규정은 그 성질이 허용되는 한 교환계약에도 준용된다.\n④ 매매계약에 관한 비용은 특약이 없는 한 매수인이 전부 부담한다.\n⑤ 경매목적물에 하자가 있는 경우, 매도인은 물건의 하자로 인한 담보책임을 지지 않는다.","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",11,0],[34,2023,11,71,1,"계약법","해제·해지","박스형(모두고르기), 판례, 옳은것 고르기, 계산","甲은 2023. 9. 30. 乙에게 자신 소유의 X부동산을 3 억원에 매도하되, 계약금 2천만원은 계약 당일, 중도금 2억원은 2023. 10. 30., 잔금 8천만원은 2023. 11.\n30.에 지급받기로 하는 매매계약을 체결하고, 乙로부터 계약 당일 계약금 전액을 지급받았다. 다음 설명 중 옳은 것을 모두 고른 것은?(특별한 사정은 없으며, 다툼이 있으면 판례에 따름)\nㄱ. 乙이 2023. 10. 25. 중도금 2억원을 甲에게 지급한 경우, 乙은 2023. 10. 27. 계약금을 포기 하더라도 계약을 해제할 수 없다.\nㄴ. 乙이 2023. 10. 25. 중도금 2억원을 甲에게 지급한 경우, 甲은 2023. 10. 27. 계약금의 배액을 상환하더라도 계약을 해제할 수 없다.\nㄷ. 乙이 계약 당시 중도금 중 1억원의 지급에 갈음하여 자신의 丙에 대한 대여금채권을 甲에게 양도하기로 약정하고 그 자리에 丙도 참석 하였다면, 甲은 2023. 10. 27. 계약금의 배액을 상환하더라도 계약을 해제할 수 없다.\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ 2023년 제34회 공인중개사","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",11,0],[34,2023,11,72,1,"계약법","임대차(민법)","판례, 틀린것 고르기","민법상 임대차계약에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 임대인이 목적물을 임대할 권한이 없어도 임대차계약은 유효하게 성립한다.\n② 임차기간을 영구로 정한 임대차약정은 특별한 사정이 없는 한 허용된다.\n③ 임차인은 특별한 사정이 없는 한 자신이 지출한 임차물의 보존에 관한 필요비 금액의 한도에서 차임의 지급을 거절할 수 있다.\n④ 임대차가 묵시의 갱신이 된 경우, 전임대차에 대해 제3 자가 제공한 담보는 원칙적으로 소멸하지 않는다.\n⑤ 임대차 종료로 인한 임차인의 원상회복의무에는 임대인이 임대 당시의 부동산 용도에 맞게 다시 사용할 수 있도록 협력할 의무까지 포함된다.","4","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",11,0],[34,2023,11,73,1,"계약법","임대차(민법)","판례, 틀린것 고르기","甲은 건물 소유를 목적으로 乙 소유의 X토지를 임차한 후, 그 지상에 Y건물을 신축하여 소유하고 있다. 위 임대차계약이 종료된 후, 甲이 乙에게 Y건물에 관하여 지상물매수청구권을 행사하는 경우에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 특별한 사정이 없는 한 Y건물이 미등기 무허가건물이 라도 매수청구권의 대상이 될 수 있다.\n② 임대차기간이 만료되면 甲이 Y건물을 철거하기로 한 약정은 특별한 사정이 없는 한 무효이다.\n③ Y건물이 X토지와 제3자 소유의 토지 위에 걸쳐서 건립 되었다면, 甲은 Y건물 전체에 대하여 매수청구를 할 수 있다.\n④ 甲의 차임연체를 이유로 임대차계약이 해지된 경우, 甲 은 매수청구권을 행사할 수 없다.\n⑤ 甲이 적법하게 매수청구권을 행사한 후에도 Y건물의 점유․사용을 통하여 X토지를 계속하여 점유․사용하였다면, 甲은 乙에게 X토지 임료 상당액의 부당이득반 환의무를 진다.","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",11,0],[34,2023,11,74,1,"민법총칙","의사표시(착오·사기·통정허위)","판례, 옳은것 고르기","매매계약의 법정해제에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 일방 당사자의 계약위반을 이유로 한 상대방의 계약해제 의사표시에 의해 계약이 해제되 었음에도 상대방이 계약이 존속함을 전제로 계약상 의무의 이행을 구하는 경우, 특별한 사정이 없는 한 계약을 위반한 당사자도 당해 계약이 상대방의 해제로 소멸되었음을 들어 그 이행을 거절할 수 있다.\nㄴ. 계약해제로 인한 원상회복의 대상에는 매매대 금은 물론 이와 관련하여 그 계약의 존속을 전제로 수령한 지연손해금도 포함된다.\nㄷ. 과실상계는 계약해제로 인한 원상회복의무의 이행으로서 이미 지급한 급부의 반환을 구하는 경우에는 적용되지 않는다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",11,0],[34,2023,11,75,1,"민사특별법","집합건물법","판례, 틀린것 고르기","집합건물의 소유 및 관리에 관한 법률상 집합건물의 전 부공용부분 및 대지사용권에 관한 설명으로 틀린 것은?(특별한 사정은 없으며, 다툼이 있으면 판례에 따름)\n① 공용부분은 취득시효에 의한 소유권 취득의 대상이 될 수 없다.\n② 각 공유자는 공용부분을 그 용도에 따라 사용할 수 있다.\n③ 구조상 공용부분에 관한 물권의 득실변경은 등기가 필요하지 않다.\n④ 구분소유자는 규약 또는 공정증서로써 달리 정하지 않는 한 그가 가지는 전유부분과 분리하여 대지사용권을 처분할 수 없다.\n⑤ 대지사용권은 전유부분과 일체성을 갖게 된 후 개시된 강제경매절차에 의해 전유부분과 분리되어 처분될 수 있다.","5","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",12,0],[34,2023,11,76,1,"민사특별법","가등기담보법","판례","가등기담보 등에 관한 법률이 원칙적으로 적용되는 것은?(단, 이자는 고려하지 않으며, 다툼이 있으면 판례에 따름)\n① 1억원을 차용하면서 부동산에 관하여 가등기나 소유권이전등기를 하지 않은 경우\n② 매매대금채무 1억원의 담보로 2억원 상당의 부동산 소유권이전등기를 한 경우\n③ 차용금채무 1억원의 담보로 2억원 상당의 부동산에 대해 대물변제예약을 하고 가등기한 경우\n④ 차용금채무 3억원의 담보로 이미 2억원의 다른 채무에 대한 저당권이 설정된 4억원 상당의 부동산에 대해 대물변제예약을 하고 가등기한 경우\n⑤ 1억원을 차용하면서 2억원 상당의 그림을 양도담보로 제공한 경우","3","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",12,0],[34,2023,11,77,1,"민사특별법","부동산실명법(명의신탁)","박스형(모두고르기), 판례","부동산 명의신탁약정과 그에 따른 등기의 무효로 대항할 수 없는 제3자(부동산 실권리자명의 등기에 관한 법률 제4조 제3항)에 해당하는 자를 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 명의수탁자의 상속인\nㄴ. 명의신탁된 부동산을 가압류한 명의수탁자의 채권자\nㄷ. 명의신탁자와 명의신탁된 부동산소유권을 취득하기 위한 계약을 맺고 등기명의만을 명의수탁자로부터 경료받은 것과 같은 외 관을 갖춘 자\nㄹ. 학교법인이 명의수탁자로서 기본재산에 관한 등기를 마친 경우, 기본재산 처분에 관하여 허가권을 갖는 관할청\n① ㄴ ② ㄱ, ㄷ ③ ㄷ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄴ, ㄷ, ㄹ 2023년 제34회 공인중개사","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",12,0],[34,2023,11,78,1,"민사특별법","주택임대차보호법","판례, 틀린것 고르기, 계산","甲은 2023. 1. 5. 乙로부터 그 소유의 X주택을 보증금 2억원, 월 임료 50만원, 기간은 계약일로부터 1년으로 정하여 임차하는 내용의 계약을 체결하고, 당일 乙에게 보증금을 지급함과 동시에 X주택을 인도받아 주민등록을 마치고 확정일자를 받았다. 다음 중 주택 임대차보호법의 적용에 관한 설명으로 틀린 것은?\n(다툼이 있으면 판례에 따름)\n① 甲은 2023. 1. 6. 오전 영시부터 대항력을 취득한다.\n② 제3자에 의해 2023. 5. 9. 경매가 개시되어 X주택이 매각된 경우, 甲은 경매절차에서 배당요구를 하지 않아도 보증금에 대해 우선변제를 받을 수 있다.\n③ 乙이 X주택을 丙에게 매도하고 소유권이전등기를 마친 경우, 乙은 특별한 사정이 없는 한 보증금반환의무를 면한다.\n④ 甲이 2기의 차임액에 달하는 차임을 연체하면 묵시적 갱신이 인정되지 않는다.\n⑤ 묵시적 갱신이 된 경우, 갱신된 임대차계약의 존속기간은 2년이다.","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",12,0],[34,2023,11,79,1,"민사특별법","상가건물임대차보호법","박스형(모두고르기), 판례, 계산","乙은 식당을 운영하기 위해 2023. 5. 1. 甲으로부터 그 소유의 서울특별시 소재 X상가건물을 보증금 10 억원, 월 임료 100만원, 기간은 정함이 없는 것으로 하여 임차하는 상가임대차계약을 체결하였다. 상가건물 임대차보호법상 乙의 주장이 인정되는 것을 모두고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. X상가건물을 인도받고 사업자등록을 마친 乙 이 대항력을 주장하는 경우\nㄴ. 乙이 甲에게 1년의 존속기간을 주장하는 경우\nㄷ. 乙이 甲에게 계약갱신요구권을 주장하는 경우\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","1","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",12,0],[34,2023,11,80,1,"민사특별법","부동산실명법(명의신탁)","판례, 틀린것 고르기","甲은 법령상 제한을 회피할 목적으로 2023. 5. 1. 배우자 乙과 자신 소유의 X건물에 대해 명의신탁약정을 하고, 甲으로부터 乙 앞으로 소유권이전등기를 마쳤다. 다음 설명 중 틀린 것은?(특별한 사정은 없으며, 다툼이 있으면 판례에 따름)\n① 甲은 乙을 상대로 진정명의회복을 원인으로 한 소유권이전등기를 청구할 수 있다.\n② 甲은 乙을 상대로 부당이득반환을 원인으로 한 소유권이전등기를 청구할 수 있다.\n③ 甲은 乙을 상대로 명의신탁해지를 원인으로 한 소유권이전등기를 청구할 수 없다.\n④ 乙이 丙에게 X건물을 매도하고 소유권이전등기를 해준 경우, 丙은 소유권을 취득한다.\n⑤ 乙이 丙에게 X건물을 매도하고 소유권이전등기를 해준 경우, 乙은 甲에게 불법행위책임을 부담한다.","2","18u_GIN0s2GKJsN-CqLNVVbB0MVxFS3gQ",12,0],[34,2023,21,1,2,"공인중개사법","법인 겸업·업무범위","박스형(모두고르기)","공인중개사법령상 금지되는 행위를 모두 고른 것은?(단, 다른 법령의 규정은 고려하지 않음)\nㄱ. 법인인 개업공인중개사가 중개업과 함께 주택의 분양대행을 겸업하는 행위\nㄴ. 다른 사람의 중개사무소등록증을 양수하여 이를 사용하는 행위\nㄷ. 공인중개사로 하여금 그의 공인중개사자격증을 다른 사람에게 대여하도록 알선하는 행위\n① ㄴ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",1,0],[34,2023,21,2,2,"공인중개사법","정책심의위원회·자격·시험","틀린것 고르기","공인중개사법령상 공인중개사 정책심의위원회(이하 ‘위원회’라 함)에 관한 설명으로 틀린 것은?\n① 위원은 위원장이 임명하거나 위촉한다.\n② 심의사항에는 중개보수 변경에 관한 사항이 포함된다.\n③ 위원회에서 심의한 사항 중 공인중개사의 자격취득에 관한 사항의 경우 시ㆍ도지사는 이에 따라야 한다.\n④ 위원장 1명을 포함하여 7명 이상 11명 이내의 위원으로 구성한다.\n⑤ 위원이 속한 법인이 해당 안건의 당사자의 대리인이었 던 경우 그 위원은 위원회의 심의ㆍ의결에서 제척된다.","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",1,0],[34,2023,21,3,2,"공인중개사법","중개대상물·용어","옳은것 고르기","공인중개사법령상 용어에 관한 설명으로 옳은 것은?\n① 중개대상물을 거래당사자 간에 교환하는 행위는 ‘중개’ 에 해당한다.\n② 다른 사람의 의뢰에 의하여 중개를 하는 경우는 그에 대한 보수를 받지 않더라도 ‘중개업’에 해당한다.\n③ 개업공인중개사인 법인의 임원으로서 공인중개사인 자가 중개업무를 수행하는 경우에는 ‘개업공인중개사’에 해당한다.\n④ 공인중개사가 개업공인중개사에 소속되어 개업공인중개사의 중개업무와 관련된 단순한 업무를 보조하는 경우에는 ‘중개보조원’에 해당한다.\n⑤ 공인중개사자격을 취득한 자는 중개사무소의 개설등록 여부와 관계없이 ‘공인중개사’에 해당한다.","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",1,0],[34,2023,21,4,2,"공인중개사법","중개사무소·분사무소·인장·게시","틀린것 고르기","공인중개사법령상 중개사무소의 설치에 관한 설명으로 틀린 것은?\n① 개업공인중개사는 그 등록관청의 관할 구역 안에 1개의 중개사무소만을 둘 수 있다.\n② 개업공인중개사는 이동이 용이한 임시 중개시설물을 설치하여서는 아니된다. 2023년 제34회 공인중개\n③ 주된 사무소의 소재지가 속한 군에는 분사무소를 설치할 수 없다.\n④ 법인이 아닌 개업공인중개사가 그 관할 구역 외의 지역에 분사무소를 설치하기 위해서는 등록관청에 신고하여야 한다.\n⑤ 분사무소 설치신고를 받은 등록관청은 그 신고내용이 적합한 경우에는 신고확인서를 교부하여야 한다.","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",1,0],[34,2023,21,5,2,"공인중개사법","중개사무소 개설등록·결격사유","틀린것 고르기","공인중개사법령상 법인의 중개사무소 개설등록의 기준으로 틀린 것은?(단, 다른 법령의 규정은 고려하지 않음)\n① 대표자는 공인중개사일 것\n② 대표자를 포함한 임원 또는 사원(합명회사 또는 합자회사의 무한책임사원을 말함)의 3분의 1 이상은 공인중개사일 것\n③ 상법 상 회사인 경우 자본금은 5천만원 이상일 것\n④ 대표자, 임원 또는 사원(합명회사 또는 합자회사의 무한책임사원을 말함) 전원이 실무교육을 받았을 것\n⑤ 분사무소를 설치하려는 경우 분사무소의 책임자가 실무교육을 받았을 것","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",1,0],[34,2023,21,6,2,"공인중개사법","중개대상물·용어","박스형(모두고르기), 판례, 옳은것 고르기","공인중개사법령상 중개대상물에 해당하는 것을 모두고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 근저당권이 설정되어 있는 피담보채권\nㄴ. 아직 완성되기 전이지만 동ㆍ호수가 특정되어 분양계약이 체결된 아파트\nㄷ. 입목에 관한 법률 에 따른 입목\nㄹ. 점포 위치에 따른 영업상의 이점 등 무형의 재산적 가치\n① ㄱ, ㄹ ② ㄴ, ㄷ ③ ㄴ, ㄹ\n④ ㄱ, ㄴ, ㄷ ⑤ ㄱ, ㄷ, ㄹ","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",1,0],[34,2023,21,7,2,"공인중개사법","고용인(소속공인중개사·중개보조원)","옳은것 고르기","공인중개사법령상 개업공인중개사의 고용인에 관한 설명으로 옳은 것은?\n① 중개보조원의 업무상 행위는 그를 고용한 개업공인중개사의 행위로 보지 아니한다.\n② 소속공인중개사를 고용하려는 개업공인중개사는 고용 전에 미리 등록관청에 신고해야 한다.\n③ 개업공인중개사는 중개보조원과의 고용관계가 종료된 때에는 고용관계가 종료된 날부터 10일 이내에 등록관청에 신고하여야 한다.\n④ 개업공인중개사가 소속공인중개사의 고용 신고를 할 때에는 해당 소속공인중개사의 실무교육 수료확인증을 제출하여야 한다.\n⑤ 개업공인중개사는 외국인을 중개보조원으로 고용할 수 없다.","3","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",1,0],[34,2023,21,8,2,"공인중개사법","중개사무소 개설등록·결격사유","틀린것 고르기","공인중개사법령상 중개사무소의 개설등록을 위한 제출 서류에 관한 설명으로 틀린 것은?\n① 공인중개사자격증 사본을 제출하여야 한다.\n② 사용승인을 받았으나 건축물대장에 기재되지 아니한 건물에 중개사무소를 확보하였을 경우에는 건축물대장 기재가 지연되는 사유를 적은 서류를 제출하여야 한다.\n③ 여권용 사진을 제출하여야 한다.\n④ 실무교육을 위탁받은 기관이 실무교육 수료 여부를 등록관청이 전자적으로 확인할 수 있도록 조치한 경우에는 실무교육의 수료확인증 사본을 제출하지 않아도 된다.\n⑤ 외국에 주된 영업소를 둔 법인의 경우에는 상법 상 외국회사 규정에 따른 영업소의 등기를 증명할 수 있는 서류를 제출하여야 한다.","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",2,0],[34,2023,21,9,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 개업공인중개사의 부동산중개업 휴업 또는 폐업에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 분사무소의 폐업신고를 하는 경우 분사무소설치 신고확인서를 첨부해야 한다.\nㄴ. 임신은 6개월을 초과하여 휴업할 수 있는 사유에 해당한다.\nㄷ. 업무정지처분을 받고 부동산중개업 폐업신고를 한 개업공인중개사는 업무정지기간이 지나지 아니하더라도 중개사무소 개설등록을 할 수 있다.\n① ㄴ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",2,0],[34,2023,21,10,2,"공인중개사법","중개사무소·분사무소·인장·게시","틀린것 고르기","공인중개사법령상 인장등록 등에 관한 설명으로 틀린 것은?\n① 개업공인중개사는 중개사무소 개설등록 후에도 업무를 개시하기 전이라면 중개행위에 사용할 인장을 등록할 수 있다.\n② 소속공인중개사의 인장등록은 소속공인중개사에 대한고용 신고와 같이 할 수 있다.\n③ 분사무소에서 사용할 인장의 경우에는 상업등기규칙 에 따라 법인의 대표자가 보증하는 인장을 등록할 수 있다.\n④ 소속공인중개사가 등록하여야 할 인장의 크기는 가로ㆍ세로 각각 7밀리미터 이상 30밀리미터 이내이어야 한다.\n⑤ 소속공인중개사가 등록한 인장을 변경한 경우에는 변경일부터 10일 이내에 그 변경된 인장을 등록해야 한다.","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",2,0],[34,2023,21,11,2,"공인중개사법","중개사무소·분사무소·인장·게시","틀린것 고르기","공인중개사법령상 개업공인중개사의 중개사무소 이전신고 등에 관한 설명으로 틀린 것은?\n① 개업공인중개사가 중개사무소를 등록관청의 관할 지역 외의 지역으로 이전한 경우에는 이전 후의 중개사무소를 관할하는 시장ㆍ군수 또는 구청장에게 신고하여야 한다.\n② 개업공인중개사가 등록관청에 중개사무소의 이전사실을 신고한 경우에는 지체 없이 사무소의 간판을 철거하여야 한다.\n③ 분사무소의 이전신고를 하려는 경우에는 주된 사무소의 소재지를 관할하는 등록관청에 중개사무소이전신고서를 제출해야 한다.\n④ 업무정지 기간 중에 있는 개업공인중개사는 중개사무소의 이전신고를 하는 방법으로 다른 개업공인중개사의 중개사무소를 공동으로 사용할 수 없다. 2023년 제34회 공인중개\n⑤ 공인중개사인 개업공인중개사가 중개사무소이전신고서를 제출할 때 중개사무소등록증을 첨부하지 않아도 된다.","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",2,0],[34,2023,21,12,2,"공인중개사법","중개계약(일반·전속)","옳은것 고르기","공인중개사법령상 중개의뢰인 甲과 개업공인중개사 乙의 중개계약에 관한 설명으로 옳은 것은?\n① 甲의 요청에 따라 乙이 일반중개계약서를 작성한 경우 그 계약서를 3년간 보존해야 한다.\n② 일반중개계약은 표준이 되는 서식이 정해져 있다.\n③ 전속중개계약은 법령이 정하는 계약서에 의하여야 하며, 乙이 서명 및 날인하되 소속공인중개사가 있는 경우 소속공인중개사가 함께 서명 및 날인해야 한다.\n④ 전속중개계약의 유효기간은 甲과 乙이 별도로 정하더라도 3개월을 초과할 수 없다.\n⑤ 전속중개계약을 체결한 甲이 그 유효기간 내에 스스로 발견한 상대방과 거래한 경우 중개보수에 해당하는 금액을 乙에게 위약금으로 지급해야 한다.","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",2,0],[34,2023,21,13,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기","부동산 거래신고 등에 관한 법령상 부동산거래계약 신고서의 작성방법으로 틀린 것은?\n① 관련 필지 등 기재사항이 복잡한 경우에는 다른 용지에 작성하여 간인 처리한 후 첨부한다.\n② ‘거래대상’의 ‘종류’ 중 ‘공급계약’은 시행사 또는 건축주 등이 최초로 부동산을 공급(분양)하는 계약을 말한다.\n③ ‘계약대상 면적’란에는 실제 거래면적을 계산하여 적되, 집합건축물이 아닌 건축물의 경우 건축물 면적은 연면적을 적는다.\n④ ‘거래대상’의 ‘종류’ 중 ‘임대주택 분양전환’은 법인이 아닌 임대주택사업자가 임대기한이 완료되어 분양전환하는 주택인 경우에 √표시를 한다.\n⑤ 전매계약(분양권, 입주권)의 경우 ‘물건별 거래가격’란에는 분양가격, 발코니 확장 등 선택비용 및 추가 지급액 등을 각각 적되, 각각의 비용에 대한 부가가치세가 있는 경우 이를 포함한 금액으로 적는다.","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",2,0],[34,2023,21,14,2,"공인중개사법","확인·설명(서)","판례, 틀린것 고르기","공인중개사법령상 개업공인중개사 甲의 중개대상물확인ㆍ설명에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 甲은 중개가 완성되어 거래계약서를 작성하는 때에 중개대상물 확인ㆍ설명서를 작성하여 거래당사자에게 교부해야 한다.\n② 甲은 중개대상물에 근저당권이 설정된 경우, 실제의 피담보채무액을 조사ㆍ확인하여 설명할 의무가 있다.\n③ 甲은 중개대상물의 범위 외의 물건이나 권리 또는 지위를 중개하는 경우에도 선량한 관리자의 주의로 권리관계 등을 조사․확인하여 설명할 의무가 있다.\n④ 甲은 자기가 조사ㆍ확인하여 설명할 의무가 없는 사항이 라도 중개의뢰인이 계약을 맺을지를 결정하는 데 중요한 것이라면 그에 관해 그릇된 정보를 제공해서는 안 된다.\n⑤ 甲이 성실ㆍ정확하게 중개대상물의 확인ㆍ설명을 하지 않거나 설명의 근거자료를 제시하지 않은 경우 500만원 이하의 과태료 부과사유에 해당한다.","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",2,0],[34,2023,21,15,2,"공인중개사법","손해배상책임·보증·계약금 예치","틀린것 고르기","공인중개사법령상 공인중개사인 개업공인중개사 甲의 손해배상책임의 보장에 관한 설명으로 틀린 것은?\n① 甲은 업무를 시작하기 전에 손해배상책임을 보장하기 위한 조치를 하여야 한다.\n② 甲은 2억원 이상의 금액을 보장하는 보증보험 또는 공제에 가입하거나 공탁을 해야 한다.\n③ 甲은 보증보험금․공제금 또는 공탁금으로 손해배상을 한 때에는 15일 이내에 보증보험 또는 공제에 다시 가입하거나 공탁금 중 부족하게 된 금액을 보전해야 한다.\n④ 甲이 손해배상책임을 보장하기 위한 조치를 이행하지 아니하고 업무를 개시한 경우는 업무정지사유에 해당하지 않는다.\n⑤ 甲은 자기의 중개사무소를 다른 사람의 중개행위의 장소로 제공함으로써 거래당사자에게 재산상의 손해를 발생하게 한 때에는 그 손해를 배상할 책임이 있다.","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",3,0],[34,2023,21,16,2,"공인중개사법","중개사무소 개설등록·결격사유","틀린것 고르기","공인중개사법령상 중개사무소의 명칭 및 등록증 등의 게시에 관한 설명으로 틀린 것은?\n① 공인중개사인 개업공인중개사는 공인중개사자격증 원본을 해당 중개사무소 안의 보기 쉬운 곳에 게시하여야 한다.\n② 개업공인중개사는 부가가치세법 시행령 에 따른 사업 자등록증을 해당 중개사무소 안의 보기 쉬운 곳에 게시하여야 한다.\n③ 법인인 개업공인중개사는 그 사무소의 명칭에 ‘공인중개사사무소’ 또는 ‘부동산중개’라는 문자를 사용하여야 한다.\n④ 법인인 개업공인중개사의 분사무소에 옥외광고물을 설치하는 경우 분사무소설치 신고확인서에 기재된 책임자의 성명을 표기하여야 한다.\n⑤ 법 제7638호 부칙 제6조제2항에 따른 개업공인중개사는 그 사무소의 명칭에 ‘공인중개사사무소’ 및 ‘부동산중개’ 라는 문자를 사용하여서는 아니된다.","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",3,0],[34,2023,21,17,2,"공인중개사법","교육·협회·공제","옳은것 고르기","공인중개사법령상 개업공인중개사등의 교육 등에 관한 설명으로 옳은 것은?\n① 폐업신고 후 400일이 지난 날 중개사무소의 개설등록을 다시 신청하려는 자는 실무교육을 받지 않아도 된다.\n② 중개보조원의 직무수행에 필요한 직업윤리에 대한 교육시간은 5시간이다.\n③ 시ㆍ도지사는 연수교육을 실시하려는 경우 실무교육 또는 연수교육을 받은 후 2년이 되기 2개월 전까지 연수교육의 일시ㆍ장소ㆍ내용 등을 대상자에게 통지하여야 한다.\n④ 부동산 중개 및 경영 실무에 대한 교육시간은 36시간이다.\n⑤ 시ㆍ도지사가 부동산거래사고 예방을 위한 교육을 실시하려는 경우에는 교육일 7일 전까지 교육일시ㆍ교육장 소 및 교육내용을 교육대상자에게 통지하여야 한다. 2023년 제34회 공인중개","3","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",3,0],[34,2023,21,18,2,"공인중개사법","손해배상책임·보증·계약금 예치","박스형(모두고르기)","공인중개사법령상 계약금등을 예치하는 경우 예치명의자가 될 수 있는 자를 모두 고른 것은?\nㄱ. 보험업법 에 따른 보험회사\nㄴ. 자본시장과 금융투자업에 관한 법률 에 따른 투자중개업자\nㄷ. 자본시장과 금융투자업에 관한 법률 에 따른 신탁업자\nㄹ. 한국지방재정공제회법 에 따른 한국지방재정 공제회\n① ㄱ ② ㄱ, ㄷ ③ ㄱ, ㄴ, ㄷ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",3,0],[34,2023,21,19,2,"공인중개사법","벌칙·과태료·포상금","","공인중개사법령상 규정 위반으로 과태료가 부과되는 경우 과태료 부과기준에서 정하는 금액이 가장 적은 경우는?\n① 휴업한 중개업의 재개 신고를 하지 않은 경우\n② 중개사무소등록증을 게시하지 않은 경우\n③ 중개사무소의 이전신고를 하지 않은 경우\n④ 연수교육을 정당한 사유 없이 받지 않은 기간이 50일인 경우\n⑤ 손해배상책임의 보장에 관한 사항을 설명하지 않은 경우","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",3,0],[34,2023,21,20,2,"공인중개사법","중개보수·실비","계산","A시에 중개사무소를 둔 개업공인중개사가 A시에 소재하는 주택(부속토지 포함)에 대하여 아래와 같이 매매와 임대차계약을 동시에 중개하였다. 공인중개사법령상 개업공인중개사가 甲으로부터 받을 수 있는 중개보수의 최고한도액은?\n【계약에 관한 사항】\n1. 계약당사자: 甲(매도인, 임차인)과 乙(매수인, 임대인)\n2. 매매계약\n1) 매매대금: 2억 5천만원\n2) 매매계약에 대하여 합의된 중개보수: 160만원\n3. 임대차계약\n1) 임대보증금: 1천만원 2) 월차임: 30만원\n3) 임대기간: 2년 【A시 중개보수 조례 기준】\n1. 거래금액 2억원 이상 9억원 미만(매매․교환):\n상한요율 0.4%\n2. 거래금액 5천만원 미만(임대차 등): 상한요율\n0.5%(한도액 20만원)\n① 100만원 ② 115만 5천원 ③ 120만원\n④ 160만원 ⑤ 175만 5천원","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",3,0],[34,2023,21,21,2,"공인중개사법","중개사무소·분사무소·인장·게시","박스형(모두고르기)","공인중개사법령상 소속공인중개사에게 금지되는 행위를 모두 고른 것은?\nㄱ. 공인중개사 명칭을 사용하는 행위\nㄴ. 중개대상물에 대한 표시ㆍ광고를 하는 행위\nㄷ. 중개대상물의 매매를 업으로 하는 행위\nㄹ. 시세에 부당한 영향을 줄 목적으로 온라인 커뮤니티 등을 이용하여 특정 가격 이하로 중개를 의뢰하지 아니하도록 유도함으로써 개업공인중개사의 업무를 방해하는 행위\n① ㄱ, ㄴ ② ㄴ, ㄹ ③ ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",3,0],[34,2023,21,22,2,"공인중개사법","확인·설명(서)","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 소속공인중개사의 규정 위반행위 중 자격정지 기준이 6개월에 해당하는 것을 모두 고른 것은?\nㄱ. 2 이상의 중개사무소에 소속된 경우\nㄴ. 거래계약서에 서명․날인을 하지 아니한 경우\nㄷ. 등록하지 아니한 인장을 사용한 경우\nㄹ. 확인ㆍ설명의 근거자료를 제시하지 아니한 경우\n① ㄱ ② ㄱ, ㄷ ③ ㄴ, ㄷ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄴ, ㄷ, ㄹ","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",4,0],[34,2023,21,23,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","옳은것 고르기","공인중개사법령상 행정제재처분효과의 승계 등에 관한 설명으로 옳은 것은?\n① 폐업신고한 개업공인중개사의 중개사무소에 다른 개업공인중개사가 중개사무소를 개설등록한 경우 그 지위를 승계한다.\n② 중개대상물에 관한 정보를 거짓으로 공개한 사유로 행한 업무정지처분의 효과는 그 처분에 대한 불복기간이 지난 날부터 1년간 다시 중개사무소의 개설등록을 한 자에게 승계된다.\n③ 폐업신고 전의 위반행위에 대한 행정처분이 업무정지에 해당하는 경우로서 폐업기간이 6개월인 경우 재등록 개업공인중개사에게 그 위반행위에 대해서 행정처분을 할 수 없다.\n④ 재등록 개업공인중개사에 대하여 폐업신고 전의 업무정지에 해당하는 위반행위를 이유로 행정처분을 할 때 폐업기간과 폐업의 사유는 고려하지 않는다.\n⑤ 개업공인중개사가 2022. 4. 1. 과태료 부과 처분을 받은 후 폐업신고를 하고 2023. 3. 2. 다시 중개사무소의 개설등록을 한 경우 그 처분의 효과는 승계된다.","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",4,0],[34,2023,21,24,2,"공인중개사법","행정처분(등록취소·업무정지·자격)","틀린것 고르기","공인중개사법령상 공인중개사의 자격취소 등에 관한 설명으로 틀린 것은?\n① 공인중개사의 자격취소처분은 청문을 거쳐 중개사무소의 개설등록증을 교부한 시ㆍ도지사가 행한다.\n② 공인중개사가 자격정지처분을 받은 기간 중에 법인인 개업공인중개사의 임원이 되는 경우 시ㆍ도지사는 그 자격을 취소하여야 한다.\n③ 자격취소처분을 받아 공인중개사자격증을 반납하려는 자는 그 처분을 받은 날부터 7일 이내에 반납해야 한다.\n④ 시ㆍ도지사는 공인중개사의 자격취소처분을 한 때에는 5일 이내에 이를 국토교통부장관에게 보고하여야 한다.\n⑤ 분실로 인하여 공인중개사자격증을 반납할 수 없는 자는 자격증 반납을 대신하여 그 이유를 기재한 사유서를 시ㆍ도지사에게 제출하여야 한다.","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",4,0],[34,2023,21,25,2,"공인중개사법","교육·협회·공제","옳은것 고르기","공인중개사법령상 공인중개사협회(이하 ‘협회’라 함) 및 공제사업에 관한 설명으로 옳은 것은?\n① 협회는 총회의 의결내용을 10일 이내에 시․도지사에게 보고하여야 한다.\n② 협회는 매 회계연도 종료 후 3개월 이내에 공제사업 운용실적을 일간신문에 공시하거나 협회의 인터넷 홈페이 지에 게시해야 한다.\n③ 협회의 창립총회를 개최할 경우 특별자치도에서는 10인 이상의 회원이 참여하여야 한다. 2023년 제34회 공인중개\n④ 공제규정에는 책임준비금의 적립비율을 공제료 수입액의 100분의 5 이상으로 정한다.\n⑤ 협회는 공제사업을 다른 회계와 구분하여 별도의 회계로 관리하여야 한다.","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",4,0],[34,2023,21,26,2,"공인중개사법","확인·설명(서)","박스형(모두고르기), 옳은것 고르기","공인중개사법령상 중개대상물 확인․설명서[Ⅰ] (주거용 건축물)의 작성방법으로 옳은 것을 모두 고른 것은?\nㄱ. 임대차의 경우 ‘취득 시 부담할 조세의 종류 및 세율’은 적지 않아도 된다.\nㄴ. ‘환경조건’은 중개대상물에 대해 개업공인중개사가 매도(임대)의뢰인에게 자료를 요구하여 확인한 사항을 적는다.\nㄷ. 중개대상물에 법정지상권이 있는지 여부는 ‘실제 권리관계 또는 공시되지 않은 물건의 권리 사항’란에 개업공인중개사가 직접 확인한 사항을 적는다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",4,0],[34,2023,21,27,2,"중개실무","경매·매수신청대리","판례, 옳은것 고르기","공인중개사의 매수신청대리인 등록 등에 관한 규칙에 따른 개업공인중개사의 매수신청대리에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n① 미등기건물은 매수신청대리의 대상물이 될 수 없다.\n② 공유자의 우선매수신고에 따라 차순위매수신고인으로 보게 되는 경우 그 차순위매수신고인의 지위를 포기하는 행위는 매수신청대리권의 범위에 속하지 않는다.\n③ 소속공인중개사도 매수신청대리인으로 등록할 수 있다.\n④ 매수신청대리인이 되려면 관할 지방자치단체의 장에게 매수신청대리인 등록을 하여야 한다.\n⑤ 개업공인중개사는 매수신청대리행위를 함에 있어서 매각장소 또는 집행법원에 직접 출석하여야 한다.","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",4,0],[34,2023,21,28,2,"부동산거래신고법","토지거래허가","틀린것 고르기","부동산 거래신고 등에 관한 법령상 토지거래계약을 허가받은 자가 그 토지를 허가받은 목적대로 이용하지 않을 수 있는 예외사유가 아닌 것은?(단, 그 밖의 사유로 시ㆍ군ㆍ구도시계획위원회가 인정한 경우는 고려하지 않음)\n① 건축법 시행령 에 따른 제1종 근린생활시설인 건축물을 취득하여 실제로 이용하는 자가 해당 건축물의 일부를 임대하는 경우\n② 건축법 시행령 에 따른 단독주택 중 다중주택인 건축물을 취득하여 실제로 이용하는 자가 해당 건축물의 일부를 임대하는 경우\n③ 산업집적활성화 및 공장설립에 관한 법률 에 따른 공 장을 취득하여 실제로 이용하는 자가 해당 공장의 일부를 임대하는 경우\n④ 건축법 시행령 에 따른 제2종 근린생활시설인 건축물을 취득하여 실제로 이용하는 자가 해당 건축물의 일부를 임대하는 경우\n⑤ 건축법 시행령 에 따른 공동주택 중 다세대주택인 건축물을 취득하여 실제로 이용하는 자가 해당 건축물의 일부를 임대하는 경우","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",4,0],[34,2023,21,29,2,"부동산거래신고법","주택임대차계약 신고","박스형(모두고르기), 옳은것 고르기, 계산","甲이 서울특별시에 있는 자기 소유의 주택에 대해 임차인 乙과 보증금 3억원의 임대차계약을 체결하는 경우, 부동산 거래신고 등에 관한 법률 에 따른 신고에 관한 설명으로 옳은 것을 모두 고른 것은?(단, 甲과 乙은 자연인임)\nㄱ. 보증금이 증액되면 乙이 단독으로 신고해야 한다.\nㄴ. 乙이 주민등록법 에 따라 전입신고를 하는 경우 주택 임대차 계약의 신고를 한 것으로 본다.\nㄷ. 임대차계약서를 제출하면서 신고를 하고 접수가 완료되면 주택임대차보호법 에 따른 확정일자가 부여된 것으로 본다.\n① ㄱ ② ㄴ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",5,0],[34,2023,21,30,2,"중개실무","분묘기지권·장사법","틀린것 고르기","개업공인중개사가 묘지를 설치하고자 토지를 매수하려는 중개의뢰인에게 장사 등에 관한 법령에 관하여 설명한 내용으로 틀린 것은?\n① 가족묘지는 가족당 1개소로 제한하되, 그 면적은 100제곱미터 이하여야 한다.\n② 개인묘지란 1기의 분묘 또는 해당 분묘에 매장된 자와 배우자 관계였던 자의 분묘를 같은 구역 안에 설치하는 묘지를 말한다.\n③ 법인묘지에는 폭 4미터 이상의 도로와 그 도로로부터 각 분묘로 통하는 충분한 진출입로를 설치하여야 한다.\n④ 화장한 유골을 매장하는 경우 매장 깊이는 지면으로부 터 30센티미터 이상이어야 한다.\n⑤ 민법 에 따라 설립된 사단법인은 법인묘지의 설치 허가를 받을 수 없다.","3","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",5,0],[34,2023,21,31,2,"부동산거래신고법","부동산 거래신고","틀린것 고르기","부동산 거래신고 등에 관한 법령상 부동산 매매계약의 거래신고에 관한 설명으로 틀린 것은?(단, 거래당사자는 모두 자연인이고, 공동중개는 고려하지 않음)\n① 신고할 때는 실제 거래가격을 신고해야 한다.\n② 거래당사자 간 직접거래의 경우 매도인이 거래신고를 거부하면 매수인이 단독으로 신고할 수 있다.\n③ 거래신고 후에 매도인이 매매계약을 취소하면 매도인이 단독으로 취소를 신고해야 한다.\n④ 개업공인중개사가 매매계약의 거래계약서를 작성ㆍ교부한 경우에는 그 개업공인중개사가 신고를 해야 한다.\n⑤ 개업공인중개사가 매매계약을 신고한 경우에 그 매매계약이 해제되면 그 개업공인중개사가 해제를 신고할 수 있다. 2023년 제34회 공인중개","3","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",5,0],[34,2023,21,32,2,"중개실무","경매·매수신청대리","판례, 틀린것 고르기","매수신청대리인으로 등록한 개업공인중개사가 X부동산에 대한 민사집행법 상 경매절차에서 매수신청대리의 위임인에게 설명한 내용으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 최선순위의 전세권자는 배당요구 없이도 우선변제를 받을 수 있으며, 이 때 전세권은 매각으로 소멸한다.\n② X부동산에 대한 경매개시결정의 기입등기 전에 유치권을 취득한 자는 경매절차의 매수인에게 자기의 유치권으로 대항할 수 있다.\n③ 최선순위의 지상권은 경매절차의 매수인이 인수한다.\n④ 후순위 저당권자의 신청에 의한 경매라 하여도 선순위 저당권자의 저당권은 매각으로 소멸한다.\n⑤ 집행법원은 배당요구의 종기를 첫 매각기일 이전으로 정한다.","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",5,0],[34,2023,21,33,2,"부동산거래신고법","외국인 등의 부동산 취득","옳은것 고르기, 빈칸","부동산 거래신고 등에 관한 법령상 국내 토지를 외국인이 취득하는 것에 관한 설명이다. ( )에 들어갈 숫자로 옳은 것은?(단, 상호주의에 따른 제한은 고려하지 않음)\n○ 외국인이 토지를 매수하는 계약을 체결하면 계약체결일부터 ( ㄱ )일 이내에 신고해야 한다.\n○ 외국인이 토지를 증여받는 계약을 체결하면 계약체결일부터 ( ㄴ )일 이내에 신고해야 한다.\n○ 외국인이 토지를 상속받으면 취득일부터 ( ㄷ ) 개월 이내에 신고해야 한다.\n① ㄱ: 30, ㄴ: 30, ㄷ: 3 ② ㄱ: 30, ㄴ: 30, ㄷ: 6\n③ ㄱ: 30, ㄴ: 60, ㄷ: 6 ④ ㄱ: 60, ㄴ: 30, ㄷ: 3\n⑤ ㄱ: 60, ㄴ: 60, ㄷ: 6","3","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",5,0],[34,2023,21,34,2,"부동산거래신고법","토지거래허가","박스형(모두고르기), 판례, 옳은것 고르기","부동산 거래신고 등에 관한 법령상 토지거래허가구역 내의 토지매매에 관한 설명으로 옳은 것을 모두고른 것은?(단, 법령상 특례는 고려하지 않으며, 다툼이 있으면 판례에 따름)\nㄱ. 허가를 받지 아니하고 체결한 매매계약은 그 효력이 발생하지 않는다.\nㄴ. 허가를 받기 전에 당사자는 매매계약상 채무불이행을 이유로 계약을 해제할 수 있다.\nㄷ. 매매계약의 확정적 무효에 일부 귀책사유가 있는 당사자도 그 계약의 무효를 주장할 수 있다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",5,0],[34,2023,21,35,2,"부동산거래신고법","부동산 거래신고","박스형(모두고르기), 틀린것 고르기","부동산 거래신고 등에 관한 법령상 포상금의 지급에 관한 설명으로 틀린 것을 모두 고른 것은?\nㄱ. 가명으로 신고하여 신고인을 확인할 수 없는 경우에는 포상금을 지급하지 아니할 수 있다.\nㄴ. 신고관청에 포상금지급신청서가 접수된 날부터 1개월 이내에 포상금을 지급하여야 한다.\nㄷ. 신고관청은 하나의 위반행위에 대하여 2명 이상이 각각 신고한 경우에는 포상금을 균등하게 배분하여 지급한다.\n① ㄱ ② ㄱ, ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",6,0],[34,2023,21,36,2,"공인중개사법","거래정보망·기타","판례, 틀린것 고르기","개업공인중개사가 집합건물을 매수하려는 의뢰인에게 집합건물의 소유 및 관리에 관한 법률 에 관하여 설명한 것으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 전유부분이란 구분소유권의 목적인 건물부분을 말한다.\n② 소유자가 기존 건물에 증축을 하고 기존 건물에 마쳐진 등기를 증축한 건물의 현황과 맞추어 1동의 건물로서 증축으로 인한 건물표시변경등기를 마친 경우, 그 증축 부분에 대해서는 구분소유권이 성립하지 않는다.\n③ 구분소유자는 건물의 관리 및 사용에 관하여 구분소유자 공동의 이익에 어긋나는 행위를 하여서는 아니 된다.\n④ 일부의 구분소유자만이 공용하도록 제공되는 것임이 명백한 공용부분은 그들 구분소유자의 공유에 속한다.\n⑤ 일부공용부분의 관리에 관한 사항 중 구분소유자 전원에게 이해관계가 있는 사항은 그것을 공용하는 구분소 유자만의 집회결의로써 결정한다.","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",6,0],[34,2023,21,37,2,"중개실무","경매·매수신청대리","박스형(모두고르기), 판례, 틀린것 고르기","개업공인중개사가 주택임대차보호법 의 적용에 관하여 설명한 내용으로 틀린 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 주택의 미등기 전세계약에 관하여는 주택임대차보호법 을 준용한다.\nㄴ. 주거용 건물에 해당하는지 여부는 임대차목적 물의 공부상의 표시만을 기준으로 정하여야 한다.\nㄷ. 임차권등기 없이 우선변제청구권이 인정되는 소액임차인의 소액보증금반환채권은 배당요구가 필요한 배당요구채권에 해당하지 않는다.\n① ㄱ ② ㄴ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ 2023년 제34회 공인중개","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",6,0],[34,2023,21,38,2,"중개실무","분묘기지권·장사법","박스형(모두고르기), 판례, 틀린것 고르기","개업공인중개사가 중개의뢰인에게 분묘가 있는 토지에 관하여 설명한 내용으로 틀린 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 토지 소유자의 승낙에 의하여 성립하는 분묘기지권의 경우 성립 당시 토지 소유자와 분묘의 수호ㆍ관리자가 지료 지급의무의 존부에 관하여 약정을 하였다면 그 약정의 효력은 분묘 기지의 승계인에게 미치지 않는다.\nㄴ. 분묘기지권은 지상권 유사의 관습상 물권이다.\nㄷ. 장사 등에 관한 법률 시행일(2001. 1. 13.) 이후 토지 소유자의 승낙 없이 설치한 분묘에 대해서 분묘기지권의 시효취득을 주장할 수 있다.\n① ㄱ ② ㄷ ③ ㄱ, ㄷ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ","3","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",6,0],[34,2023,21,39,2,"부동산거래신고법","토지거래허가","틀린것 고르기","부동산 거래신고 등에 관한 법령상 토지거래허가구역 등에 관한 설명으로 틀린 것은?(단, 거래당사자는 모두 대한민국 국적의 자연인임)\n① 허가구역의 지정은 그 지정을 공고한 날부터 7일 후에 그 효력이 발생한다.\n② 허가구역에 있는 토지거래에 대한 처분에 이의가 있는 자는 그 처분을 받은 날부터 1개월 이내에 시장ㆍ군수 또는 구청장에게 이의를 신청할 수 있다.\n③ 허가구역에 있는 토지에 관하여 사용대차계약을 체결하는 경우에는 토지거래허가를 받을 필요가 없다.\n④ 허가관청은 허가신청서를 받은 날부터 15일 이내에 허가 또는 불허가 처분을 하여야 한다.\n⑤ 허가신청에 대하여 불허가처분을 받은 자는 그 통지를 받은 날부터 1개월 이내에 시장ㆍ군수 또는 구청장에게 해당 토지에 관한 권리의 매수를 청구할 수 있다.","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",6,0],[34,2023,21,40,2,"중개실무","명의신탁·실무 기타","박스형(모두고르기), 판례, 옳은것 고르기","2023. 10. 7. 甲은 친구 乙과 X부동산에 대하여 乙을 명의수탁자로 하는 명의신탁약정을 체결하였다. 개업공인중개사가 이에 관하여 설명한 내용으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 甲과 乙 사이의 명의신탁약정은 무효이다.\nㄴ. X부동산의 소유자가 甲이라면, 명의신탁약정에 기하여 甲에서 乙로 소유권이전등기가 마쳐졌다는 이유만으로 당연히 불법원인급여에 해당한다고 볼 수 없다.\nㄷ. X부동산의 소유자가 丙이고 계약명의신탁이라 면, 丙이 그 약정을 알았더라도 丙으로부터 소유권이전등기를 마친 乙은 유효하게 소유권을 취득한다.\n① ㄱ ② ㄴ ③ ㄷ\n④ ㄱ, ㄴ ⑤ ㄱ, ㄴ, ㄷ","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",6,0],[34,2023,21,41,3,"국토계획법","개발행위허가·성장관리","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 개발행위허가에 관한 설명으로 틀린 것은?\n① 농림지역에 물건을 1개월 이상 쌓아놓는 행위는 개발행위허가의 대상이 아니다.\n② 사방사업법 에 따른 사방사업을 위한 개발행위에 대하여 허가를 하는 경우 중앙도시계획위원회와 지방도시계획위원회의 심의를 거치지 아니한다.\n③ 일정 기간 동안 개발행위허가를 제한할 수 있는 대상지역에 지구단위계획구역은 포함되지 않는다.\n④ 기반시설부담구역으로 지정된 지역에 대해서는 중앙도 시계획위원회나 지방도시계획위원회의 심의를 거치지 아니하고 개발행위허가의 제한을 연장할 수 있다.\n⑤ 개발행위허가의 제한을 연장하는 경우 그 연장 기간은 2년을 넘을 수 없다.","3","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",7,0],[34,2023,21,42,3,"국토계획법","개발행위허가·성장관리","틀린것 고르기","국토의 계획 및 이용에 관한 법령상 개발행위허가 시 개발행위 규모의 제한을 받지 않는 경우에 해당하지 않는 것은?\n① 지구단위계획으로 정한 가구 및 획지의 범위 안에서 이루어지는 토지의 형질변경으로서 당해 형질변경과 그와 관련된 기반시설의 설치가 동시에 이루어지는 경우\n② 해당 개발행위가 농어촌정비법 에 따른 농어촌정비사 업으로 이루어지는 경우\n③ 건축물의 건축, 공작물의 설치 또는 지목의 변경을 수반하지 아니하고 시행하는 토지복원사업\n④ 환경친화적 자동차의 개발 및 보급 촉진에 관한 법률에 따른 수소연료공급시설의 설치를 수반하는 경우\n⑤ 해당 개발행위가 국방ㆍ군사시설 사업에 관한 법률 에 따른 국방ㆍ군사시설사업으로 이루어지는 경우","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",7,0],[34,2023,21,43,3,"국토계획법","용도지역·용도지구·용도구역","박스형(모두고르기)","국토의 계획 및 이용에 관한 법령상 시ㆍ도지사가 복합용도지구를 지정할 수 있는 용도지역에 해당하는 것을 모두 고른 것은?\nㄱ. 준주거지역 ㄴ. 근린상업지역\nㄷ. 일반공업지역 ㄹ. 계획관리지역\nㅁ. 일반상업지역\n① ㄱ, ㄴ ② ㄷ, ㄹ ③ ㄱ, ㄴ, ㄷ\n④ ㄷ, ㄹ, ㅁ ⑤ ㄱ, ㄴ, ㄹ, ㅁ","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",7,0],[34,2023,21,44,3,"국토계획법","지구단위계획","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 지구단위계획구역의 지정에 관한 설명으로 옳은 것은?(단, 조례는 고려하지 않음)\n① 군수는 개발밀도관리구역에 관한 기초조사를 하기 위하여 필요하면 타인의 토지에 출입할 수 있다.\n② 개발밀도관리구역의 지정기준, 개발밀도관리구역의 관리 등에 관하여 필요한 사항은 대통령령으로 정하는 바에 따라 국토교통부장관이 정한다.\n③ 개발밀도관리구역에서는 해당 용도지역에 적용되는 용적률의 최대한도의 50퍼센트 범위에서 용적률을 강화하여 적용한다.\n④ 시장 또는 군수는 개발밀도관리구역을 지정하거나 변경하려면 해당 지방자치단체에 설치된 지방도시계획위원회의 심의를 거쳐야 한다.\n⑤ 기반시설을 설치하거나 그에 필요한 용지를 확보하게 하기 위하여 개발밀도관리구역에 기반시설부담구역을 지정할 수 있다.","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",8,0],[34,2023,21,50,3,"국토계획법","도시·군관리계획·기본계획","박스형(모두고르기)","국토의 계획 및 이용에 관한 법령상 시ㆍ군ㆍ구도시 계획위원회의 업무를 모두 고른 것은?\nㄱ. 도시ㆍ군관리계획과 관련하여 시장ㆍ군수 또는 구청장이 자문하는 사항에 대한 조언\nㄴ. 시범도시사업계획의 수립에 관하여 시장ㆍ군수ㆍ구청장이 자문하는 사항에 대한 조언\nㄷ. 시장 또는 군수가 결정하는 도시ㆍ군관리계획의 심의\n① ㄱ ② ㄷ ③ ㄱ, ㄴ\n④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ 2023년 제34회 공인중개","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",8,0],[34,2023,21,51,3,"국토계획법","도시·군계획시설·매수청구","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 도시ㆍ군계획시설사업 시행을 위한 타인의 토지에의 출입 등에 관한 설명으로 옳은 것은?\n① 타인의 토지에 출입하려는 행정청인 사업시행자는 출입하려는 날의 7일 전까지 그 토지의 소유자ㆍ점유자 또는 관리인에게 그 일시와 장소를 알려야 한다.\n② 토지의 소유자ㆍ점유자 또는 관리인의 동의 없이 타인의 토지를 재료 적치장 또는 임시통로로 일시 사용한 사업시행자는 사용한 날부터 14일 이내에 시장 또는 군수의 허가를 받아야 한다.\n③ 토지 점유자가 승낙하지 않는 경우에도 사업시행자는 시장 또는 군수의 허가를 받아 일몰 후에 울타리로 둘러싸인 타인의 토지에 출입할 수 있다.\n④ 토지에의 출입에 따라 손실을 입은 자가 보상에 관하여 국토교통부장관에게 조정을 신청하지 아니하는 경우에는 관할 토지수용위원회에 재결을 신청할 수 없다.\n⑤ 사업시행자가 행정청인 경우라도 허가를 받지 아니하면 타인의 토지에 출입할 수 없다.","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",8,0],[34,2023,21,52,3,"국토계획법","도시·군계획시설·매수청구","옳은것 고르기","국토의 계획 및 이용에 관한 법령상 도시ㆍ군계획시설사업의 시행에 관한 설명으로 옳은 것은?\n① 도시 및 주거환경정비법 에 따라 도시ㆍ군관리계획의 결정이 의제되는 경우에는 해당 도시ㆍ군계획시설결정의 고시일부터 3개월 이내에 도시ㆍ군계획시설에 대하여 단계별 집행계획을 수립하여야 한다.\n② 5년 이내에 시행하는 도시ㆍ군계획시설사업은 단계별 집행계획 중 제1단계 집행계획에 포함되어야 한다.\n③ 한국토지주택공사가 도시ㆍ군계획시설사업의 시행자로 지정을 받으려면 토지소유자 총수의 3분의 2 이상에 해당하는 자의 동의를 얻어야 한다.\n④ 국토교통부장관은 국가계획과 관련되거나 그 밖에 특히 필요하다고 인정되는 경우에는 관계 특별시장ㆍ광역시장ㆍ특별자치시장ㆍ특별자치도지사ㆍ시장 또는 군수의 의견을 들어 직접 도시ㆍ군계획시설사업을 시행할 수 있다.\n⑤ 사업시행자는 도시ㆍ군계획시설사업 대상시설을 둘 이상으로 분할하여 도시ㆍ군계획시설사업을 시행하여서는 아니 된다.","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",8,0],[34,2023,21,53,3,"도시개발법","도시개발구역 지정·계획","계산","도시개발법령상 환지 설계를 평가식으로 하는 경우 다음 조건에서 환지 계획에 포함되어야 하는 비례율은?\n(단, 제시된 조건 이외의 다른 조건은 고려하지 않음)\n○ 총 사업비: 250억원\n○ 환지 전 토지ㆍ건축물의 평가액 합계: 500억원\n○ 도시개발사업으로 조성되는 토지ㆍ건축물의 평가액 합계: 1,000억원\n① 100% ② 125% ③ 150% ④ 200% ⑤ 250%","3","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",8,0],[34,2023,21,54,3,"도시개발법","도시개발채권·기타","옳은것 고르기","도시개발법령상 원형지의 공급과 개발에 관한 설명으로 옳은 것은?\n① 원형지를 공장 부지로 직접 사용하는 원형지개발자의 선정은 경쟁입찰의 방식으로 하며, 경쟁입찰이 2회 이상 유찰된 경우에는 수의계약의 방법으로 할 수 있다.\n② 지정권자는 원형지의 공급을 승인할 때 용적률 등 개발밀도에 관한 이행조건을 붙일 수 없다.\n③ 원형지 공급가격은 원형지의 감정가격과 원형지에 설치한 기반시설 공사비의 합산 금액을 기준으로 시ㆍ도의 조례로 정한다.\n④ 원형지개발자인 지방자치단체는 10년의 범위에서 대통령령으로 정하는 기간 안에는 원형지를 매각할 수 없다.\n⑤ 원형지개발자가 공급받은 토지의 전부를 시행자의 동의 없이 제3자에게 매각하는 경우 시행자는 원형지개발자에 대한 시정요구 없이 원형지 공급계약을 해제할 수 있다.","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",9,0],[34,2023,21,55,3,"도시개발법","도시개발구역 지정·계획","박스형(모두고르기), 옳은것 고르기","도시개발법령상 도시개발사업 조합에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 금고 이상의 형을 선고받고 그 형의 집행유예 기간 중에 있는 자는 조합의 임원이 될 수 없다.\nㄴ. 조합이 조합 설립의 인가를 받은 사항 중 공고방법을 변경하려는 경우 지정권자로부터 변경인가를 받아야 한다.\nㄷ. 조합장 또는 이사의 자기를 위한 조합과의 계약이나 소송에 관하여는 대의원회가 조합을 대표한다.\nㄹ. 의결권을 가진 조합원의 수가 50인 이상인 조합은 총회의 권한을 대행하게 하기 위하여 대의원회를 둘 수 있으며, 대의원회에 두는 대의원의 수는 의결권을 가진 조합원 총수의 100 분의 10 이상으로 한다.\n① ㄱ, ㄷ ② ㄱ, ㄹ ③ ㄴ, ㄷ\n④ ㄱ, ㄴ, ㄹ ⑤ ㄴ, ㄷ, ㄹ","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",9,0],[34,2023,21,56,3,"도시개발법","시행자·조합","틀린것 고르기","도시개발법령상 도시개발사업의 시행자인 지방자치단체가 주택법 제4조에 따른 주택건설사업자 등으로 하여금 대행하게 할 수 있는 도시개발사업의 범위에 해당하지 않는 것은?\n① 실시설계 ② 부지조성공사\n③ 기반시설공사 ④ 조성된 토지의 분양\n⑤ 토지상환채권의 발행","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",9,0],[34,2023,21,57,3,"도시개발법","도시개발구역 지정·계획","","도시개발법령상 개발계획에 따라 도시개발구역을 지정한 후에 개발계획에 포함시킬 수 있는 사항은?\n① 환경보전계획\n② 보건의료시설 및 복지시설의 설치계획\n③ 원형지로 공급될 대상 토지 및 개발 방향\n④ 임대주택건설계획 등 세입자 등의 주거 및 생활 안정 대책 2023년 제34회 공인중개\n⑤ 도시개발구역을 둘 이상의 사업시행지구로 분할하여 도시개발사업을 시행하는 경우 그 분할에 관한 사항","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",9,0],[34,2023,21,58,3,"도시개발법","수용·사용·환지","틀린것 고르기","도시개발법령상 환지 방식에 의한 사업 시행에서의 청산금에 관한 설명으로 틀린 것은?\n① 시행자는 토지 소유자의 동의에 따라 환지를 정하지 아니하는 토지에 대하여는 환지처분 전이라도 청산금을 교부할 수 있다.\n② 토지 소유자의 신청에 따라 환지 대상에서 제외한 토지에 대하여는 청산금을 교부하는 때에 청산금을 결정할 수 없다.\n③ 청산금을 받을 권리나 징수할 권리를 5년간 행사하지 아니하면 시효로 소멸한다.\n④ 청산금은 대통령령으로 정하는 바에 따라 이자를 붙여 분할징수하거나 분할교부할 수 있다.\n⑤ 행정청이 아닌 시행자가 군수에게 청산금의 징수를 위 탁한 경우 그 시행자는 군수가 징수한 금액의 100분의 4에 해당하는 금액을 해당 군에 지급하여야 한다.","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",9,0],[34,2023,21,59,3,"국토계획법","도시·군계획시설·매수청구","틀린것 고르기","도시 및 주거환경정비법령상 정비기반시설에 해당하지 않는 것은?(단, 주거환경개선사업을 위하여 지정ㆍ고시된 정비구역이 아님)\n① 녹지\n② 공공공지\n③ 공용주차장\n④ 소방용수시설\n⑤ 공동으로 사용하는 구판장","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",9,0],[34,2023,21,60,3,"정비법","사업시행·관리처분","박스형(모두고르기)","도시 및 주거환경정비법령상 토지등소유자에 대한 분양 신청의 통지 및 분양공고 양자에 공통으로 포함되어야 할 사항을 모두 고른 것은?(단, 토지등소유자 1인이 시행하는 재개발사업은 제외하고, 조례는 고려하지 않음)\nㄱ. 분양을 신청하지 아니한 자에 대한 조치\nㄴ. 토지등소유자외의 권리자의 권리신고방법\nㄷ. 분양신청서\nㄹ. 분양대상자별 분담금의 추산액\n① ㄱ ② ㄱ, ㄴ ③ ㄴ, ㄷ\n④ ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄹ","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",9,0],[34,2023,21,61,3,"정비법","조합·추진위원회","틀린것 고르기","도시 및 주거환경정비법령상 조합의 정관을 변경하기 위하여 총회에서 조합원 3분의 2 이상의 찬성을 요하는 사항이 아닌 것은?\n① 정비구역의 위치 및 면적\n② 조합의 비용부담 및 조합의 회계\n③ 정비사업비의 부담 시기 및 절차\n④ 청산금의 징수ㆍ지급의 방법 및 절차\n⑤ 시공자ㆍ설계자의 선정 및 계약서에 포함될 내용","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",9,0],[34,2023,21,62,3,"국토계획법","도시·군계획시설·매수청구","옳은것 고르기","도시 및 주거환경정비법령상 공동구의 설치 및 관리 비용에 관한 설명으로 옳은 것은?\n① 공동구점용예정자가 부담할 공동구의 설치에 드는 비용의 부담비율은 공동구의 권리지분비율을 고려하여 시장ㆍ군수등이 정한다.\n② 공동구의 설치로 인한 보상비용은 공동구의 설치비용에 포함되지 않는다.\n③ 사업시행자로부터 공동구의 설치비용 부담금의 납부통지를 받은 공동구점용예정자는 공동구의 설치공사가 착수 되기 전에 부담금액의 3분의 1 이상을 납부하여야 한다.\n④ 공동구 관리비용은 반기별로 산출하여 부과한다.\n⑤ 시장ㆍ군수등은 필요한 경우 공동구 관리비용을 분할하여 분기별로 납부하게 할 수 있다.","3","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",10,0],[34,2023,21,63,3,"정비법","조합·추진위원회","틀린것 고르기","도시 및 주거환경정비법령상 조합의 임원에 관한 설명으로 틀린 것은?\n① 조합임원의 임기만료 후 6개월 이상 조합임원이 선임되 지 아니한 경우에는 시장ㆍ군수등이 조합임원 선출을 위한 총회를 소집할 수 있다.\n② 조합임원이 결격사유에 해당하게 되어 당연 퇴임한 경우 그가 퇴임 전에 관여한 행위는 그 효력을 잃는다.\n③ 총회에서 요청하여 시장ㆍ군수등이 전문조합관리인을 선정한 경우 전문조합관리인이 업무를 대행할 임원은 당연 퇴임한다.\n④ 조합장이 아닌 조합임원은 대의원이 될 수 없다.\n⑤ 대의원회는 임기중 궐위된 조합장을 보궐선임할 수 없다.","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",10,0],[34,2023,21,64,3,"정비법","정비계획·정비구역","옳은것 고르기, 빈칸","도시 및 주거환경정비법령상 소규모 토지 등의 소유자에 대한 토지임대부 분양주택 공급에 관한 내용이\n다. ( )에 들어갈 숫자로 옳은 것은?(단, 조례는 고려하지 않음) 국토교통부장관, 시ㆍ도지사, 시장, 군수, 구청장 또는 토지주택공사등은 정비구역에 세입자와 다음의 어느 하나에 해당하는 자의 요청이 있는 경우에는 인수한 재개발임대주택의 일부를 주택법 에 따른 토지임대부 분양주택으로 전환하여 공급하여야 한다.\n1. 면적이 ( ㄱ )제곱미터 미만의 토지를 소유한 자로서 건축물을 소유하지 아니한 자\n2. 바닥면적이 ( ㄴ )제곱미터 미만의 사실상 주거를 위하여 사용하는 건축물을 소유한 자로서 토지를 소유하지 아니한 자\n① ㄱ: 90, ㄴ: 40 ② ㄱ: 90, ㄴ: 50\n③ ㄱ: 90, ㄴ: 60 ④ ㄱ: 100, ㄴ: 40\n⑤ ㄱ: 100, ㄴ: 50 2023년 제34회 공인중개사","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",10,0],[34,2023,21,65,3,"주택법","주택공급·분양가상한·전매제한","옳은것 고르기, 빈칸","주택법령상 조정대상지역의 지정기준의 일부이다.\n( )에 들어갈 숫자로 옳은 것은?\n조정대상지역지정직전월부터 소급하여 6개월간의 평균 주택가격상승률이 마이너스 ( ㄱ )퍼센트 이하인 지역으로서 다음에 해당하는 지역\n○ 조정대상지역지정직전월부터 소급하여 ( ㄴ ) 개월 연속 주택매매거래량이 직전 연도의 같은 기간보다 ( ㄷ )퍼센트 이상 감소한 지역\n○ 조정대상지역지정직전월부터 소급하여 ( ㄴ ) 개월간의 평균 미분양주택( 주택법 제15조제 1항에 따른 사업계획승인을 받아 입주자를 모 집했으나 입주자가 선정되지 않은 주택을 말한다)의 수가 직전 연도의 같은 기간보다 2배 이상인 지역\n① ㄱ: 1, ㄴ: 3, ㄷ: 20 ② ㄱ: 1, ㄴ: 3, ㄷ: 30\n③ ㄱ: 1, ㄴ: 6, ㄷ: 30 ④ ㄱ: 3, ㄴ: 3, ㄷ: 20\n⑤ ㄱ: 3, ㄴ: 6, ㄷ: 20","1","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",10,0],[34,2023,21,66,3,"주택법","사업계획승인·사용검사","틀린것 고르기","주택법령상 주택의 사용검사 등에 관한 설명으로 틀린 것은?\n① 하나의 주택단지의 입주자를 분할 모집하여 전체 단지의 사용검사를 마치기 전에 입주가 필요한 경우에는 공사가 완료된 주택에 대하여 동별로 사용검사를 받을 수 있다.\n② 사용검사는 사용검사 신청일부터 15일 이내에 하여야 한다.\n③ 사업주체는 건축물의 동별로 공사가 완료된 경우로서 사용검사권자의 임시 사용승인을 받은 경우에는 사용검사를 받기 전에 주택을 사용하게 할 수 있다.\n④ 사업주체가 파산 등으로 사용검사를 받을 수 없는 경우에는 해당 주택의 시공을 보증한 자, 해당 주택의 시공자 또는 입주예정자는 사용검사를 받을 수 있다.\n⑤ 무단거주가 아닌 입주예정자가 사업주체의 파산 등으로 사용검사를 받을 때에는 입주예정자의 대표회의가 사용검사권자에게 사용검사를 신청할 때 하자보수보증금을 예치하여야 한다.","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",10,0],[34,2023,21,67,3,"주택법","사업주체·주택조합","박스형(모두고르기), 옳은것 고르기","주택법령상 지역주택조합의 조합원을 모집하기 위하여 모집주체가 광고를 하는 경우 광고에 포함되어야 하는 내용에 해당하는 것을 모두 고른 것은?\nㄱ. 조합의 명칭 및 사무소의 소재지\nㄴ. 조합원의 자격기준에 관한 내용\nㄷ. 조합설립 인가일\nㄹ. 조합원 모집 신고 수리일\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","2","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",10,0],[34,2023,21,68,3,"주택법","용어(주택·공동주택 등)","옳은것 고르기","주택법령상 공동주택관리법 에 따른 행위의 허가를 받거나 신고를 하고 설치하는 세대구분형 공동주택이 충족하여야 하는 요건에 해당하는 것을 모두 고른 것은?(단, 조례는 고려하지 않음)\nㄱ. 하나의 세대가 통합하여 사용할 수 있도록 세대 간에 연결문 또는 경량구조의 경계벽 등을 설치할 것\nㄴ. 구분된 공간의 세대수는 기존 세대를 포함하여 2세대 이하일 것\nㄷ. 세대별로 구분된 각각의 공간마다 별도의 욕실, 부엌과 구분 출입문을 설치할 것\nㄹ. 구조, 화재, 소방 및 피난안전 등 관계 법령에서 정하는 안전 기준을 충족할 것\n① ㄱ, ㄴ, ㄷ ② ㄱ, ㄴ, ㄹ ③ ㄱ, ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",11,0],[34,2023,21,69,3,"주택법","리모델링·기타","","주택법령상 주택건설사업자 등에 관한 설명으로 옳은 것은?\n① 공익법인의 설립ㆍ운영에 관한 법률 에 따라 주택건설사업을 목적으로 설립된 공익법인이 연간 20호 이상의 단독주택 건설사업을 시행하려는 경우 국토교통부장관에게 등록하여야 한다.\n② 세대수를 증가하는 리모델링주택조합이 그 구성원의 주택을 건설하는 경우에는 국가와 공동으로 사업을 시행할 수 있다.\n③ 고용자가 그 근로자의 주택을 건설하는 경우에는 대통령령으로 정하는 바에 따라 등록사업자와 공동으로 사업을 시행하여야 한다.\n④ 국토교통부장관은 등록사업자가 타인에게 등록증을 대여한 경우에는 1년 이내의 기간을 정하여 영업의 정지를 명할 수 있다.\n⑤ 영업정지 처분을 받은 등록사업자는 그 처분 전에 사업계획승인을 받은 사업을 계속 수행할 수 없다.","3","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",11,0],[34,2023,21,70,3,"주택법","용어(주택·공동주택 등)","틀린것 고르기","주택법령상 용어에 관한 설명으로 틀린 것은?\n① 건축법 시행령 에 따른 다세대주택은 공동주택에 해당한다.\n② 건축법 시행령 에 따른 오피스텔은 준주택에 해당한다.\n③ 주택단지에 해당하는 토지가 폭 8미터 이상인 도시계획 예정도로로 분리된 경우, 분리된 토지를 각각 별개의 주택단지로 본다.\n④ 주택에 딸린 자전거보관소는 복리시설에 해당한다.\n⑤ 도로ㆍ상하수도ㆍ전기시설ㆍ가스시설ㆍ통신시설ㆍ지역 난방시설은 기간시설(基幹施設)에 해당한다.","4","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",11,0],[34,2023,21,71,3,"주택법","리모델링·기타","틀린것 고르기","주택법령상 리모델링에 관한 설명으로 틀린 것은?\n(단, 조례는 고려하지 않음)\n① 세대수 증가형 리모델링으로 인한 도시과밀, 이주수요 집중 등을 체계적으로 관리하기 위하여 수립하는 계획을 리모델링 기본계획이라 한다. 2023년 제34회 공인중개사\n② 리모델링에 동의한 소유자는 리모델링 결의를 한 리모델링주택조합이나 소유자 전원의 동의를 받은 입주자대표회의가 시장ㆍ군수ㆍ구청장에게 리모델링 허가신청서를 제출하기 전까지 서면으로 동의를 철회할 수 있다.\n③ 특별시장ㆍ광역시장 및 대도시의 시장은 리모델링 기본계획을 수립하거나 변경한 때에는 이를 지체 없이 해당 지방자치단체의 공보에 고시하여야 한다.\n④ 수직증축형 리모델링의 설계자는 국토교통부장관이 정하여 고시하는 구조기준에 맞게 구조설계도서를 작성하여야 한다.\n⑤ 대수선인 리모델링을 하려는 자는 시장ㆍ군수ㆍ구청장에게 안전진단을 요청하여야 한다.","5","19bGwi7INpofnwwgpLE188D-ukWsSxPHk",11,0],[34,2023,21,72,3,"건축법","건축물·용어·적용범위","옳은것 고르기, 빈칸","건축법령상 건축선과 대지의 면적에 관한 설명이다.\n( )에 들어갈 내용으로 옳은 것은?(단, 허가권자의 건축선의 별도지정, 건축법 제3조에 따른 적용제 외, 건축법령상 특례 및 조례는 고려하지 않음) 건축법 제2조제1항제11호에 따른 소요 너비에 못 미치는 너비의 도로인 경우에는 그 중심선으로부터 그 ( ㄱ )을 건축선으로 하되, 그 도로의 반대쪽에 하천이 있는 경우에는 그 하천이 있는 쪽의 도로경계선에서 ( ㄴ )을 건축선으로 하며, 그 건축선과 도로 사이의 대지면적은 건축물의 대지면적 산정 시 ( ㄷ )한다.\n① ㄱ: 소요 너비에 해당하는 수평거리만큼 물러난 선,\nㄴ: 소요 너비에 해당하는 수평거리의 선,\nㄷ: 제외\n② ㄱ: 소요 너비의 2분의 따른 업무 등 중앙지적위원회의 서무를 담당한다.\nㄴ. 중앙지적위원회의 회의는 재적위원 과반수의 출석으로 개의(開議)하고, 출석위원 과반수의 찬성으로 의결한다.\nㄷ. 중앙지적위원회는 관계인을 출석하게 하여 의견을 들을 수 있으며, 필요하면 현지조사를 할 수 있다.\nㄹ. 위원장이 중앙지적위원회의 회의를 소집할 때에는 회의 일시ㆍ장소 및 심의 안건을 회의 7일 전까지 각 위원에게 서면으로 통지하여야 한다.\n① ㄱ, ㄴ ② ㄴ, ㄷ ③ ㄱ, ㄴ, ㄷ\n④ ㄱ, ㄷ, ㄹ ⑤ ㄴ, ㄷ, ㄹ","2","1se300Izd-VtBgkobPweUithz9bpNnchf",2,0],[34,2023,22,10,4,"공간정보법","지적측량·지적위원회","옳은것 고르기, 빈칸","공간정보의 구축 및 관리 등에 관한 법령상 지적측량의 측량기간 및 검사기간에 대한 설명이다. ( ) 에 들어갈 내용으로 옳은 것은?(단, 지적측량 의뢰인과 지적측량수행자가 서로 합의하여 따로 기간을 정하는 경우는 제외함) 지적측량의 측량기간은 ( ㄱ )일로 하며, 측량검사기간은 ( ㄴ )일로 한다. 다만, 지적기준점을 설치하여 측량 또는 측량검사를 하는 경우 지적기준점이 15점 이하인 경우에는 ( ㄷ )일을, 15점을 초과하는 경우에는 ( ㄹ )일에 15점을 초과하는 ( ㅁ ) 점마다 1일을 가산한다.\n① ㄱ: 4, ㄴ: 4, ㄷ: 4, ㄹ: 4, ㅁ: 3\n② ㄱ: 5, ㄴ: 4, ㄷ: 4, ㄹ: 4, ㅁ: 4\n③ ㄱ: 5, ㄴ: 4, ㄷ: 4, ㄹ: 5, ㅁ: 3\n④ ㄱ: 5, ㄴ: 4, ㄷ: 5, ㄹ: 5, ㅁ: 4\n⑤ ㄱ: 6, ㄴ: 5, ㄷ: 5, ㄹ: 5, ㅁ: 3","2","1se300Izd-VtBgkobPweUithz9bpNnchf",2,0],[34,2023,22,11,4,"공간정보법","지적공부·부동산종합공부","옳은것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지적소관청은 축척변경 확정공고를 하였을 때에는 지체 없이 축척변경에 따라 확정된 사항을 지적공부에 등록하여야 한다. 이 경우 토지대장에 등록하는 기준으로 옳은 것은?\n① 축척변경 확정측량 결과도에 따른다.\n② 청산금납부고지서에 따른다.\n③ 토지이동현황 조사계획서에 따른다.\n④ 확정공고된 축척변경 지번별 조서에 따른다.\n⑤ 축척변경 시행계획에 따른다. 2023년 제34회 공인중개","4","1se300Izd-VtBgkobPweUithz9bpNnchf",2,0],[34,2023,22,12,4,"공간정보법","지번·지목·면적·경계","틀린것 고르기","공간정보의 구축 및 관리 등에 관한 법령상 지상경계점등록부의 등록사항으로 틀린 것은?\n① 지적도면의 번호\n② 토지의 소재\n③ 공부상 지목과 실제 토지이용 지목\n④ 경계점의 사진 파일\n⑤ 경계점표지의 종류 및 경계점 위치","1","1se300Izd-VtBgkobPweUithz9bpNnchf",2,0],[34,2023,22,13,4,"부동산등기법","등기신청(공동·단독·전자신청)","틀린것 고르기","등기신청에 관한 설명으로 틀린 것은?\n① 정지조건이 붙은 유증을 원인으로 소유권이전등기를 신청하는 경우, 조건성취를 증명하는 서면을 첨부하여야 한다.\n② 사립대학이 부동산을 기증받은 경우, 학교 명의로 소유권이전등기를 할 수 있다.\n③ 법무사는 매매계약에 따른 소유권이전등기를 매도인과 매수인 쌍방을 대리하여 신청할 수 있다.\n④ 법인 아닌 사단인 종중이 건물을 매수한 경우, 종중의 대표자는 종중 명의로 소유권이전등기를 신청할 수 있다.\n⑤ 채권자대위권에 의한 등기신청의 경우, 대위채권자는 채무자의 등기신청권을 자기의 이름으로 행사한다.","2","1se300Izd-VtBgkobPweUithz9bpNnchf",2,0],[34,2023,22,14,4,"부동산등기법","용익권·담보권 등기","박스형(모두고르기)","부동산등기법상 등기할 수 없는 것을 모두 고른 것은?\nㄱ. 분묘기지권 ㄴ. 전세권저당권\nㄷ. 주위토지통행권 ㄹ. 구분지상권\n① ㄱ, ㄷ ② ㄴ, ㄹ ③ ㄱ, ㄴ, ㄷ\n④ ㄱ, ㄷ, ㄹ ⑤ ㄴ, ㄷ, ㄹ","1","1se300Izd-VtBgkobPweUithz9bpNnchf",2,0],[34,2023,22,15,4,"부동산등기법","등기 일반·효력","판례, 틀린것 고르기","등기한 권리의 순위에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 부동산에 대한 가압류등기와 저당권설정등기 상호간의 순위는 접수번호에 따른다.\n② 2번 저당권이 설정된 후 1번 저당권 일부이전의 부기등기가 이루어진 경우, 배당에 있어서 그 부기등기가 2번 저당권에 우선한다.\n③ 위조된 근저당권해지증서에 의해 1번 근저당권등기가 말소된 후 2번 근저당권이 설정된 경우, 말소된 1번 근저당권등기가 회복되더라도 2번 근저당권이 우선한다.\n④ 가등기 후에 제3자 명의의 소유권이전등기가 이루어진 경우, 가등기에 기한 본등기가 이루어지면 본등기는 제 3자 명의 등기에 우선한다.\n⑤ 집합건물 착공 전의 나대지에 대하여 근저당권이 설정된 경우, 그 근저당권등기는 집합건물을 위한 대지권등 기에 우선한다. 개","3","1se300Izd-VtBgkobPweUithz9bpNnchf",2,0],[34,2023,22,16,4,"공간정보법","지적공부·부동산종합공부","박스형(모두고르기), 옳은것 고르기","등기신청을 위한 첨부정보에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 토지에 대한 표시변경등기를 신청하는 경우, 등기원인을 증명하는 정보로서 토지대장정보를 제공하면 된다.\nㄴ. 매매를 원인으로 소유권이전등기를 신청하는 경우, 등기의무자의 주소를 증명하는 정보도 제공하여야 한다.\nㄷ. 상속등기를 신청하면서 등기원인을 증명하는 정보로서 상속인 전원이 참여한 공정증서에의한 상속재산분할협의서를 제공하는 경우, 상속인들의 인감증명을 제출할 필요가 없다.\nㄹ. 농지에 대한 소유권이전등기를 신청하는 경우, 등기원인을 증명하는 정보가 집행력 있는 판결인 때에는 특별한 사정이 없는 한 농지취득자격증명을 첨부하지 않아도 된다.\n① ㄱ, ㄴ ② ㄷ, ㄹ ③ ㄱ, ㄴ, ㄷ\n④ ㄱ, ㄷ, ㄹ ⑤ ㄴ, ㄷ, ㄹ","3","1se300Izd-VtBgkobPweUithz9bpNnchf",3,0],[34,2023,22,17,4,"부동산등기법","이의신청·등기관 처분","옳은것 고르기","등기관이 용익권의 등기를 하는 경우에 관한 설명으로 옳은 것은?\n① 1필 토지 전부에 지상권설정등기를 하는 경우, 지상권설정의 범위를 기록하지 않는다.\n② 지역권의 경우, 승역지의 등기기록에 설정의 목적, 범위 등을 기록할 뿐, 요역지의 등기기록에는 지역권에 관한 등기사항을 기록하지 않는다.\n③ 전세권의 존속기간이 만료된 경우, 그 전세권설정등기를 말소하지 않고 동일한 범위를 대상으로 하는 다른 전세권설정등기를 할 수 있다.\n④ 2개의 목적물에 하나의 전세권설정계약으로 전세권설정등기를 하는 경우, 공동전세목록을 작성하지 않는다.\n⑤ 차임이 없이 보증금의 지급만을 내용으로 하는 채권적 전세의 경우, 임차권설정등기기록에 차임 및 임차보증 금을 기록하지 않는다.","4","1se300Izd-VtBgkobPweUithz9bpNnchf",3,0],[34,2023,22,18,4,"부동산등기법","용익권·담보권 등기","틀린것 고르기","등기관이 근저당권등기를 하는 경우에 관한 설명으로 틀린 것은?\n① 채무자의 성명, 주소 및 주민등록번호를 등기기록에 기록하여야 한다.\n② 채무자가 수인인 경우라도 채무자별로 채권최고액을 구분하여 기록할 수 없다.\n③ 신청정보의 채권최고액이 외국통화로 표시된 경우, 외 화표시금액을 채권최고액으로 기록한다.\n④ 선순위근저당권의 채권최고액을 감액하는 변경등기는 그 저당목적물에 관한 후순위권리자의 승낙서가 첨부되 지 않더라도 할 수 있다.\n⑤ 수용으로 인한 소유권이전등기를 하는 경우, 특별한 사정이 없는 한 그 부동산의 등기기록 중 근저당권등기는 직권으로 말소하여야 한다. 2023년 제34회 공인중개","1","1se300Izd-VtBgkobPweUithz9bpNnchf",3,0],[34,2023,22,19,4,"부동산등기법","가등기","틀린것 고르기","가등기에 관한 설명으로 틀린 것은?\n① 가등기로 보전하려는 등기청구권이 해제조건부인 경우에는 가등기를 할 수 없다.\n② 소유권이전청구권 가등기는 주등기의 방식으로 한다.\n③ 가등기는 가등기권리자와 가등기의무자가 공동으로 신청할 수 있다.\n④ 가등기에 기한 본등기를 금지하는 취지의 가처분등기의 촉탁이 있는 경우, 등기관은 이를 각하하여야 한다.\n⑤ 소유권이전청구권 가등기에 기하여 본등기를 하는 경우, 등기관은 그 가등기를 말소하는 표시를 하여야 한다.","5","1se300Izd-VtBgkobPweUithz9bpNnchf",3,0],[34,2023,22,20,4,"부동산등기법","이의신청·등기관 처분","틀린것 고르기","등기관의 처분에 대한 이의신청에 관한 설명으로 틀린 것은?\n① 등기신청인이 아닌 제3자는 등기신청의 각하결정에 대하여 이의신청을 할 수 없다.\n② 이의신청은 대법원규칙으로 정하는 바에 따라 관할 지방법원에 이의신청서를 제출하는 방법으로 한다.\n③ 이의신청기간에는 제한이 없으므로 이의의 이익이 있는 한 언제라도 이의신청을 할 수 있다.\n④ 등기관의 처분시에 주장하거나 제출하지 아니한 새로운 사실을 근거로 이의신청을 할 수 없다.\n⑤ 등기관의 처분에 대한 이의신청이 있더라도 그 부동산에 대한 다른 등기신청은 수리된다.","2","1se300Izd-VtBgkobPweUithz9bpNnchf",3,0],[34,2023,22,21,4,"부동산등기법","등기신청(공동·단독·전자신청)","박스형(모두고르기), 판례, 옳은것 고르기","부동산등기법 제29조제2호의 ‘사건이 등기할 것이 아닌 경우’에 해당하는 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\nㄱ. 위조한 개명허가서를 첨부한 등기명의인 표시 변경등기신청\nㄴ. 하천법 상 하천에 대한 지상권설정등기신청\nㄷ. 법령에 근거가 없는 특약사항의 등기신청\nㄹ. 일부지분에 대한 소유권보존등기신청\n① ㄱ ② ㄱ, ㄴ ③ ㄷ, ㄹ\n④ ㄴ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","4","1se300Izd-VtBgkobPweUithz9bpNnchf",3,0],[34,2023,22,22,4,"부동산등기법","등기부·등기기록·구분건물","틀린것 고르기","구분건물의 등기에 관한 설명으로 틀린 것은?\n① 대지권의 표시에 관한 사항은 전유부분의 등기기록 표제부에 기록하여야 한다.\n② 토지전세권이 대지권인 경우에 대지권이라는 뜻의 등기가 되어 있는 토지의 등기기록에는 특별한 사정이 없는 한 저당권설정등기를 할 수 없다.\n③ 대지권의 변경이 있는 경우, 구분건물의 소유권의 등기명의인은 1동의 건물에 속하는 다른 구분건물의 소유권의 등기명의인을 대위하여 대지권변경등기를 신청할 수 있다.\n④ 1동의 건물에 속하는 구분건물 중 일부만에 관하여 소유권보존등기를 신청하는 경우에는 나머지 구분건물의 표시에 관한 등기를 동시에 신청하여야 한다.\n⑤ 집합건물의 규약상 공용부분이라는 뜻을 정한 규약을 폐지한 경우, 그 공용부분의 취득자는 소유권이전등기를 신청하여야 한다. 개","2,5","1se300Izd-VtBgkobPweUithz9bpNnchf",3,0],[34,2023,22,23,4,"부동산등기법","소유권 등기(보존·이전·신탁·공동소유)","판례, 틀린것 고르기","소유권등기에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)\n① 미등기 건물의 건축물대장상 소유자로부터 포괄유증을 받은 자는 자기 명의로 소유권보존등기를 신청할 수 있다.\n② 미등기 부동산이 전전양도된 경우, 최후의 양수인이 소유권보존등기를 한 때에도 그 등기가 결과적으로 실질 적 법률관계에 부합된다면, 특별한 사정이 없는 한 그 등기는 무효라고 볼 수 없다.\n③ 미등기 토지에 대한 소유권을 군수의 확인에 의해 증명한 자는 그 토지에 대한 소유권보존등기를 신청할 수 있다.\n④ 특정유증을 받은 자로서 아직 소유권등기를 이전받지 않은 자는 직접 진정명의회복을 원인으로 한 소유권이전등기를 청구할 수 없다.\n⑤ 부동산 공유자의 공유지분 포기에 따른 등기는 해당 지분에 관하여 다른 공유자 앞으로 소유권이전등기를 하는 형태가 되어야 한다.","3","1se300Izd-VtBgkobPweUithz9bpNnchf",4,0],[34,2023,22,24,4,"부동산등기법","등기 일반·효력","옳은것 고르기","등기필정보에 관한 설명으로 옳은 것은?\n① 등기필정보는 아라비아 숫자와 그 밖의 부호의 조합으로 이루어진 일련번호와 비밀번호로 구성한다.\n② 법정대리인이 등기를 신청하여 본인이 새로운 권리자가 된 경우, 등기필정보는 특별한 사정이 없는 한 본인에게 통지된다.\n③ 등기절차의 인수를 명하는 판결에 따라 승소한 등기의무자가 단독으로 등기를 신청하는 경우, 등기필정보를 등기소에 제공할 필요가 없다.\n④ 등기권리자의 채권자가 등기권리자를 대위하여 등기신청을 한 경우, 등기필정보는 그 대위채권자에게 통지된다.\n⑤ 등기명의인의 포괄승계인은 등기필정보의 실효신고를 할 수 없다.","1","1se300Izd-VtBgkobPweUithz9bpNnchf",4,0],[34,2023,22,25,5,"조세총론","조세총론(납세의무·부과·징수)","옳은것 고르기","국세기본법령상 국세의 부과제척기간에 관한 설명으로 옳은 것은?\n① 납세자가 조세범 처벌법 에 따른 사기나 그 밖의 부정한 행위로 종합소득세를 포탈하는 경우(역외거래 제외) 그 국세를 부과할 수 있는 날부터 15년을 부과제척기간으로 한다.\n② 지방국세청장은 행정소송법 에 따른 소송에 대한 판결이 확정된 경우 그 판결이 확정된 날부터 2년이 지나기 전까지 경정이나 그 밖에 필요한 처분을 할 수 있다.\n③ 세무서장은 감사원법 에 따른 심사청구에 대한 결정에 의하여 명의대여 사실이 확인되는 경우에는 당초의 부과처분을 취소하고 그 결정이 확정된 날부터 1년 이내에 실제로 사업을 경영한 자에게 경정이나 그 밖에 필요한 처분을 할 수 있다.\n④ 종합부동산세의 경우 부과제척기간의 기산일은 과세표준과 세액에 대한 신고기한의 다음 날이다.\n⑤ 납세자가 법정신고기한까지 과세표준신고서를 제출하지 아니한 경우(역외거래 제외)에는 해당 국세를 부과할 수 있는 날부터 10년을 부과제척기간으로 한다.","3","1se300Izd-VtBgkobPweUithz9bpNnchf",4,0],[34,2023,22,26,5,"조세총론","조세총론(납세의무·부과·징수)","","국세 및 지방세의 연대납세의무에 관한 설명으로 옳은 것은?\n① 공동주택의 공유물에 관계되는 지방자치단체의 징수금은 공유자가 연대하여 납부할 의무를 진다. 2023년 제34회 공인중개\n② 공동으로 소유한 자산에 대한 양도소득금액을 계산하는 경우에는 해당 자산을 공동으로 소유하는 공유자가 그 양도소득세를 연대하여 납부할 의무를 진다.\n③ 공동사업에 관한 소득금액을 계산하는 경우(주된 공동 사업자에게 합산과세되는 경우 제외)에는 해당 공동사 업자가 그 종합소득세를 연대하여 납부할 의무를 진다.\n④ 상속으로 인하여 단독주택을 상속인이 공동으로 취득하는 경우에는 상속인 각자가 상속받는 취득물건을 취득한 것으로 보고, 공동상속인이 그 취득세를 연대하여 납부할 의무를 진다.\n⑤ 어느 연대납세의무자에 대하여 소멸시효가 완성된 때에도 다른 연대납세의무자의 납세의무에는 영향을 미치지 아니한다.","4","1se300Izd-VtBgkobPweUithz9bpNnchf",4,0],[34,2023,22,27,5,"취득세","취득세","틀린것 고르기","지방세법령상 취득세에 관한 설명으로 틀린 것은?\n① 건축물 중 조작 설비에 속하는 부분으로서 그 주체구조 부와 하나가 되어 건축물로서의 효용가치를 이루고 있는 것에 대하여는 주체구조부 취득자 외의 자가 가설한 경우에도 주체구조부의 취득자가 함께 취득한 것으로 본다.\n② 도시개발법 에 따른 환지방식에 의한 도시개발사업의 시행으로 토지의 지목이 사실상 변경됨으로써 그 가액이 증가한 경우에는 그 환지계획에 따라 공급되는 환지는 사업시행자가, 체비지 또는 보류지는 조합원이 각각 취득한 것으로 본다.\n③ 경매를 통하여 배우자의 부동산을 취득하는 경우에는 론에 관한 설명으로 틀린 것은?\n① 호이트(H. Hoyt)의 선형이론은 단핵의 중심지를 가진 동심원 도시구조를 기본으로 하고 있다는 점에서 동심원이론을 발전시킨 것이라 할 수 있다.\n② 크리스탈러(W. Christaller)는 중심성의 크기를 기초로 중심지가 고차중심지와 저차중심지로 구분되는 동심원 이론을 설명했다.\n③ 해리스(C. Harris)와 울만(E. Ullman)은 도시 내부의 토지이용이 단일한 중심의 주위에 형성되는 것이 아니라 몇 개의 핵심지역 주위에 형성된다는 점을 강조하면서, 도시공간구조가 다핵심구조를 가질 수 있다고 보았다.\n④ 베버(A. Weber)는 운송비의 관점에서 특정 공장이 원 료지향적인지 또는 시장지향적인지를 판단하기 위해 원료지수(material index)개념을 사용했다.\n⑤ 허프(D. Huff)모형의 공간(거리)마찰계수는 도로환경, 지형, 주행수단 등 다양한 요인에 영향을 받을 수 있는 값이며, 이 모형을 적용하려면 공간(거리)마찰계수가 정 해져야 한다.","2","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",2,0],[35,2024,11,16,0,"입지·지대이론","공업입지·지대이론","옳은것 고르기","다음 설명에 모두 해당하는 것은?\n○ 토지의 비옥도가 동일하더라도 중심도시와의 접 근성 차이에 의해 지대가 차별적으로 나타난다.\n○ 한계지대곡선은 작물의 종류나 농업의 유형에 따라 그 기울기가 달라질 수 있으며, 이 곡선의 기울기에 따라 집약적 농업과 조방적 농업 으로 구분된다.\n○ 가장 높은 지대를 지불하는 농업적 토지이용에 토지가 할당된다.\n① 마샬(A. Marshall)의 준지대설\n② 헤이그(R. Haig)의 마찰비용이론\n③ 튀넨(J. H. von Thünen)의 위치지대설\n④ 마르크스(K. Marx)의 절대지대설\n⑤ 파레토(V. Pareto)의 경제지대론","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",3,0],[35,2024,11,17,0,"감정평가론","가치·가격원칙·지역분석","계산","지하철 역사가 개발된다는 다음과 같은 정보가 있을 때, 합리적인 투자자가 최대한 지불할 수 있는 이 정보의 현재가치는?(단, 주어진 조건에 한함)\n○ 지하철 역사 개발예정지 인근에 A토지가 있다.\n○ 1년 후 지하철 역사가 개발될 가능성은 60 % 로 알려져 있다.\n○ 1년 후 지하철 역사가 개발되면 A토지의 가격은 14억 3천만원, 개발되지 않으면 8억 8천만원으로 예상된다.\n○ 투자자의 요구수익률(할인율)은 연 10 %다.\n① 1억 6천만원 ② 1억 8천만원 ③ 2억원\n④ 2억 2천만원 ⑤ 2억 4천만원","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",3,0],[35,2024,11,18,0,"정책론","토지정책·지역지구제","틀린것 고르기","부동산정책에 관한 내용으로 틀린 것은?\n① 국토의 계획 및 이용에 관한 법령상 지구단위계획은 도시ㆍ군계획 수립 대상지역의 일부에 대하여 토지 이용을 합리화하고 그 기능을 증진시키며 미관을 개선하고 양호한 환경을 확보하며, 그 지역을 체계적ㆍ계획적으로 관리하기 위하여 수립하는 도시ㆍ군기본계획을 말한다.\n② 지역지구제는 토지이용에 수반되는 부(-)의 외부효과를 제거하거나 완화시킬 목적으로 활용된다.\n③ 개발권양도제(TDR)는 토지이용규제로 인해 개발행위의 제약을 받는 토지소유자의 재산적 손실을 보전해 주는 수단으로 활용될 수 있으며, 법령상 우리나라에서는 시행되고 있지 않다.\n④ 부동산 가격공시제도에 따라 국토교통부장관은 일단의 토지 중에서 선정한 표준지에 대하여 매년 공시기준일 현재의 단위면적당 적정가격을 조사ㆍ평가하여 공시하여야 한다. 2024년 제35회 공인중개\n⑤ 토지비축제는 정부가 토지를 매입한 후 보유하고 있다가 적절한 때에 이를 매각하거나 공공용으로 사용하는 제도를 말한다.","1","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",3,0],[35,2024,11,19,0,"금융론","부동산금융 일반·주택금융","박스형(모두고르기), 옳은것 고르기","공공주택 특별법령상 공공임대주택에 관한 내용으로 옳은 것은 모두 몇 개인가?(단, 주택도시기금은 ｢주택도시기금법｣에 따른 주택도시기금을 말함)\n○ 통합공공임대주택: 국가나 지방자치단체의 재정이나 주택도시기금의 자금을 지원받아 최저소득 계층, 저소득 서민, 젊은 층 및 장애인ㆍ국가유공자 등 사회 취약계층 등의 주거안정을 목적으로 공급하는 공공임대주택\n○ 행복주택: 국가나 지방자치단체의 재정이나 주택도시기금의 자금을 지원받아 대학생, 사회초년생, 신혼부부 등 젊은 층의 주거안정을 목적으로 공급하는 공공임대주택\n○ 장기전세주택: 국가나 지방자치단체의 재정이나 주택도시기금의 자금을 지원받아 전세계약의 방식으로 공급하는 공공임대주택\n○ 분양전환공공임대주택: 일정 기간 임대 후 분양전환할 목적으로 공급하는 공공임대주택\n① 0개 ② 1개 ③ 2개 ④ 3개 ⑤ 4개","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",3,0],[35,2024,11,20,0,"금융론","부동산금융 일반·주택금융","옳은것 고르기","부동산정책 중 금융규제에 해당하는 것은?\n① 택지개발지구 지정\n② 토지거래허가제 시행\n③ 개발부담금의 부담률 인상\n④ 분양가상한제의 적용 지역 확대\n⑤ 총부채원리금상환비율(DSR) 강화","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",3,0],[35,2024,11,21,0,"부동산의 개념·특성","부동산 개념·특성·분류","틀린것 고르기","주택법령상 주택의 유형과 내용에 관한 설명으로 틀린 것은?\n① 도시형 생활주택은 ｢국토의 계획 및 이용에 관한 법률｣에 따른 도시지역에 건설하여야 한다.\n② 도시형 생활주택은 300세대 미만의 국민주택규모로 구성된다.\n③ 토지임대부 분양주택의 경우, 토지의 소유권은 분양주택 건설사업을 시행하는 자가 가지고, 건축물 및 복리시설 등에 대한 소유권은 주택을 분양받은 자가 가진다.\n④ 세대구분형 공동주택은 주택 내부 공간의 일부를 세대별로 구분하여 생활이 가능한 구조이어야 하며, 그 구분된 공간의 일부를 구분소유 할 수 있다.\n⑤ 장수명 주택은 구조적으로 오랫동안 유지ㆍ관리될 수 있는 내구성을 갖추고, 입주자의 필요에 따라 내부 구조를 쉽게 변경할 수 있는 가변성과 수리 용이성 등이 우수한 주택을 말한다.","4","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",3,0],[35,2024,11,22,0,"정책론","조세정책·조세전가","박스형(모두고르기), 옳은것 고르기","부동산조세에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 양도소득세의 중과는 부동산 보유자로 하여금 매각을 앞당기게 하는 동결효과(lock-in effect)를 발생시킬 수 있다.\nㄴ. 재산세와 종합부동산세의 과세기준일은 매년 6월 1일로 동일하다.\nㄷ. 취득세와 상속세는 취득단계에서 부과하는 지방세이다.\nㄹ. 증여세와 양도소득세는 처분단계에서 부과하는 국세이다.\n① ㄴ ② ㄱ, ㄷ ③ ㄴ, ㄹ\n④ ㄱ, ㄷ, ㄹ ⑤ ㄱ, ㄴ, ㄷ, ㄹ","1","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",4,0],[35,2024,11,23,0,"금융론","대출 상환방식·대출한도","계산","다음 자료는 A부동산의 1년간 운영수지이다. A부동산의 총투자액은 6억원이며, 투자자는 총투자액의 40 % 를 은행에서 대출받았다. 이 경우 순소득승수(ㄱ)와 세 전현금흐름승수(ㄴ)는?(단, 주어진 조건에 한함)\n○ 가능총소득(PGI): 7,000만원\n○ 공실손실상당액 및 대손충당금: 500만원\n○ 기타소득: 100만원\n○ 부채서비스액: 1,500만원\n○ 영업소득세: 500만원\n○ 수선유지비: 200만원\n○ 용역비: 100만원\n○ 재산세: 100만원\n○ 직원인건비: 200만원\n① ㄱ: 9.0, ㄴ: 8.0 ② ㄱ: 9.0, ㄴ: 9.0\n③ ㄱ: 9.0, ㄴ: 10.0 ④ ㄱ: 10.0, ㄴ: 8.0\n⑤ ㄱ: 10.0, ㄴ: 9.0","4","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",4,0],[35,2024,11,24,0,"투자론","현금흐름·수익률·위험","틀린것 고르기, 계산","다음은 시장전망에 따른 자산의 투자수익률을 합리적으로 예상한 결과이다. 이에 관한 설명으로 틀린 것은?(단, 주어진 조건에 한함) 시장 발생 예상수익률 전망 확률 자산 A 자산 B 자산 C 자산 D 낙관적 25 % 6 % 10 % 9 % 14 % 정상적 50 % 4 % 4 % 8 % 8 % 비관적 25 % 2 % -2 % 7 % 2 % 평균(기댓값) 4.0 % 4.0 % 8.0 % 8.0 % 표준편차 1.41 % 4.24 % 0.71 % 4.24 %\n① 자산 A와 자산 B는 동일한 기대수익률을 가진다.\n② 낙관적 시장전망에서는 자산 D의 수익률이 가장 높다.\n③ 자산 C와 자산 D는 동일한 투자위험을 가진다.\n④ 평균-분산 지배원리에 따르면 자산 C는 자산 A보다 선호된다.\n⑤ 자산 A, B, C, D로 구성한 포트폴리오의 수익과 위험은 각 자산의 투자비중에 따라 달라진다.","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",4,0],[35,2024,11,25,0,"투자론","투자분석기법(NPV·IRR 등)","틀린것 고르기","부동산투자분석 기법에 관한 설명으로 틀린 것은?\n① 순현재가치법과 내부수익률법은 화폐의 시간가치를 반영한 투자분석방법이다. 2024년 제35회 공인중개\n② 복수의 투자안을 비교할 때 투자금액의 차이가 큰 경우, 순현재가치법과 내부수익률법은 분석결과가 서로 다를 수 있다.\n③ 하나의 투자안에 있어 수익성지수가 1보다 크면 순현재가치는 0보다 크다.\n④ 투자자산의 현금흐름에 따라 복수의 내부수익률이 존재할 수 있다.\n⑤ 내부수익률법에서는 현금흐름의 재투자율로 투자자의 요구수익률을 가정한다.","5","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",4,0],[35,2024,11,26,0,"정책론","조세정책·조세전가","","토지세를 제외한 다른 모든 조세를 없애고 정부의 재정은 토지세만으로 충당하는 토지단일세를 주장한 학자는?\n① 뢰쉬(A. Lösch) ② 레일리(W. Reilly)\n③ 알론소(W. Alonso) ④ 헨리 조지(H. George)\n⑤ 버제스(E. Burgess)","4","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",4,0],[35,2024,11,27,0,"감정평가론","감정평가 3방식·시산가액","틀린것 고르기","자본환원율에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)\n① 자본환원율은 순영업소득을 부동산의 가격으로 나누어 구할 수 있다.\n② 부동산시장이 균형을 이루더라도 자산의 유형, 위치 등 특성에 따라 자본환원율이 서로 다른 부동산들이 존재할 수 있다.\n③ 자본환원율은 자본의 기회비용을 반영하며, 금리의 상승은 자본환원율을 낮추는 요인이 된다.\n④ 투자위험의 증가는 자본환원율을 높이는 요인이 된다.\n⑤ 서로 다른 유형별, 지역별 부동산시장을 비교하여 분석하는데 활용될 수 있다.","3","1B8oII6H9U4wdIYrxa5XAqSGasKMoZtHD",4,0],[35,2024,11,28,0,"정책론","주택·임대료 정책","계산","A임차인은 비율임대차(percentage lease)방식의 임대차계약을 체결하였다. 이 계약에서는 매장의 월 매출액이 손익분기점 매출액 이하이면 기본임대료만 지급하고, 손익분기점 매출액 초과이면 초과매출액에 대해 일정 임대료율을 적용한 추가임대료를 기본임대료에 가산하여 임대료를 지급한다고 약정하였다. 구체적인 계약조건과 예상매출액은 다음과 같다. 해당 계약내용에 따라 A임차인이 지급할 것으로 예상되는 임대료의 합계는?(단, 주어진 조건에 한함)\n○ 계약기간: 1년(1월 ∼ 12월)\n○ 매장 임대면적: 300 m2\n○ 임대면적당 기본임대료: 매월 5만원/m2\n○ 손익분기점 매출액: 매월 3,500만원\n○ 월별 임대면적당 예상매출액\n- 1월 ∼ 6월: 매월 10만원/m2\n- 7월 ∼ 12월: 매월 19만
