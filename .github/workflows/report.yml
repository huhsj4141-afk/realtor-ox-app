name: report
# 앱의 🚩 신고 → 시험지 원본으로 문제 글 다시 옮겨 적기 + 해설 새로 만들기 → 새 버전 → 이슈에 답글
on:
  issues: { types: [opened, reopened] }   # 처리 못 하고 넘어간 신고는 닫았다 다시 열면 재처리
concurrency: { group: report, cancel-in-progress: false }   # 앱 만들기와 따로 줄 서기(서로 대기 취소 안 되게)
permissions: { contents: write, issues: write, actions: write }
jobs:
  fix:
    if: startsWith(github.event.issue.title, '[신고]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # 기다렸다 시작해도 최신 상태에서
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: 원본 시험지 풀기
        env: { K: '${{ secrets.GEMINI_API_KEY }}' }
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in private/priv.enc -out /tmp/priv.pem
          openssl pkeyutl -decrypt -inkey /tmp/priv.pem -in private/key.enc -out /tmp/aes.key
          mkdir -p /tmp/pdfs && openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/aes.key -in private/pdfs.enc | tar xf - -C /tmp
      - name: 고치기
        id: fx
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}', BODY: '${{ github.event.issue.body }}' }
        run: |
          printf '%s' "$BODY" > /tmp/body.md
          set +e; python3 tools/report.py /tmp/body.md /tmp/pdfs; echo "code=$?" >> $GITHUB_OUTPUT
      - name: 저장·새 버전
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add web/index.html data/mc.json gen/mc_exp.json gen/ocrfix.json
          git commit -m "신고 #${{ github.event.issue.number }} 반영 [skip ci]" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
          gh workflow run build.yml --ref main
      - name: 답글
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh issue comment ${{ github.event.issue.number }} -F /tmp/report_result.md
          if [ "${{ steps.fx.outputs.code }}" = "0" ]; then gh issue close ${{ github.event.issue.number }}; else gh issue edit ${{ github.event.issue.number }} --add-label "검토 필요" || true; fi
