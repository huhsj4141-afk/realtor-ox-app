name: ocrfix
# 원본 시험지 이미지(암호화)로 OCR이 깨진 객관식 문항을 다시 옮겨 적기
on:
  schedule:
    - cron: '25 8 * * *'      # 매일 17:25(한국), 무료 한도가 새로 채워진 직후 남은 문항 이어서
    - cron: '13 11 * * *'     # 20:13 한 번 더(GitHub 예약이 가끔 빠져서 — 이미 했으면 금방 끝남)
  workflow_dispatch:
    inputs:
      step: { description: 'keygen 또는 run', default: run }
concurrency: { group: build, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # 기다렸다 시작해도 최신 상태에서
      - name: 열쇠 만들기 (처음 한 번)
        if: github.event.inputs.step == 'keygen'
        env: { K: '${{ secrets.GEMINI_API_KEY }}' }
        run: |
          mkdir -p private
          openssl genrsa -out /tmp/priv.pem 3072
          openssl rsa -in /tmp/priv.pem -pubout -out private/pub.pem
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:K -in /tmp/priv.pem -out private/priv.enc
      - name: 옮겨 적기
        if: github.event.inputs.step != 'keygen'
        env: { K: '${{ secrets.GEMINI_API_KEY }}', GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}', K2: '${{ secrets.GEMINI_API_KEY_2 }}' }
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in private/priv.enc -out /tmp/priv.pem
          openssl pkeyutl -decrypt -inkey /tmp/priv.pem -in private/key.enc -out /tmp/aes.key
          openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/tmp/aes.key -in private/pages.enc | tar xf - -C /tmp
          MINUTES=12 python3 tools/glossgen.py || true   # 용어 풍선말 늘리기 (새 후보가 있을 때만)
          MINUTES=20 python3 tools/exp_audit.py || true  # 해설 검수 (결과는 앱에 바로 안 보임, 두 번 지적되면 다시 만들기)
          MINUTES=10 python3 tools/law_audit.py || true  # 법 개정 확인 (하루 40문제씩, 구글 검색)
          python3 tools/oxmark.py || true          # OX 틀린 지문의 틀린 부분 표시 (먼저, 금방 끝남)
          python3 tools/ocrfix.py /tmp/pg2 || true
          MINUTES=15 python3 tools/oxvar.py || true   # 남은 무료 한도로 OX 변형(기출 보기 뒤집기) 만들기
          # 두 번째 키(다른 구글 프로젝트 = 무료 한도 따로)가 있으면 이어서 한 번 더
          if [ -n "$K2" ]; then GEMINI_API_KEY="$K2" python3 tools/oxmark.py || true; GEMINI_API_KEY="$K2" python3 tools/ocrfix.py /tmp/pg2 || true; GEMINI_API_KEY="$K2" MINUTES=15 python3 tools/oxvar.py || true; fi
      - name: 앱 문항에 반영
        if: github.event.inputs.step != 'keygen'
        run: |
          python3 tools/fixtext.py
          python3 - <<'PY'
          import json
          import os
          fix = json.load(open('gen/ocrfix.json')); p = 'gen/mc_exp.json'; e = json.load(open(p))
          ap = 'gen/ocrfix_applied.json'; done = set(json.load(open(ap))) if os.path.exists(ap) else set()
          for k in fix:
              if k not in done:
                  e.pop(k, None)      # 이번에 새로 고친 문항만: 깨진 글로 만든 해설 지우고 다시 만들기
          import sys; sys.path.insert(0, 'tools'); import jline; jline.dump(e, p)
          json.dump(sorted(set(fix) | done), open(ap, 'w'))
          PY
      - name: 저장
        if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A private web/index.html data/mc.json gen/mc_exp.json 2>/dev/null || true; git add gen/ocrfix.json gen/ocrfix_applied.json gen/ox_mark.json 2>/dev/null || true; git add gen/ox_var.json web/glossary.json gen/gloss_seen.json gen/exp_audit.json gen/exp_redo.json gen/law_audit.json 2>/dev/null || true
          git commit -m "OCR 다시 옮겨 적기 [skip ci]" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
      - name: 새 앱 만들기
        if: github.event.inputs.step != 'keygen'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run build.yml --ref main
