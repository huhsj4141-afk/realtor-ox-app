name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['gen/**', '**.md']
  schedule:
    - cron: '41 11 * * *'      # 20:41 한 번 더(예약이 빠질 때 대비)
    - cron: '47 8 * * *'       # 매일 17:47(한국): 무료 한도가 다시 채워진 직후(17:00) 객관식 해설 이어서 만들기
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      done: ${{ steps.st.outputs.done }}
      newly: ${{ steps.st.outputs.newly }}
      mcnew: ${{ steps.st.outputs.mcnew }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # 기다렸다 시작해도 최신 상태에서
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: before
        id: pre
        run: |
          echo "had=$([ -f gen/DONE ] && echo 1 || echo 0)" >> $GITHUB_OUTPUT
          echo "mc0=$(python -c "import json;print(len(json.load(open('gen/mc_exp.json'))))" 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT
      - name: 해설·음성 생성 (이어서)
        if: github.event_name != 'push'   # 앱 고칠 때마다 AI 한도를 쓰지 않게: 밤에 한 번만
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}', GCLOUD_TTS_KEY: '${{ secrets.GCLOUD_TTS_KEY }}', MINUTES: '300' }
        run: 'python tools/oxctx.py || true; [ -f gen/DONE ] && python tools/gen.py cues || python tools/gen.py full'
      - name: 객관식 해설 (무료 Flash-Lite, 하루 한도만큼 이어서)
        if: github.event_name != 'push'
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}', MINUTES: '120', MC_MAX: '400' }
        run: python tools/gen.py mc
      - name: 객관식 해설 (두 번째 키 — 있으면 무료 한도 한 번 더)
        if: github.event_name != 'push'
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY_2 }}', MINUTES: '100', MC_MAX: '600' }
        run: '[ -n "$GEMINI_API_KEY" ] && python tools/gen.py mc || echo "두 번째 키 없음"'
      - name: 진행 저장
        if: always()
        run: |
          rm -rf gen/tmp
          git config user.name "ox-bot"; git config user.email "ox-bot@users.noreply.github.com"
          git add -A gen 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "음성 생성 진행 [skip ci]"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
          echo "객관식 해설 $(python -c "import json;print(len(json.load(open('gen/mc_exp.json'))))" 2>/dev/null || echo 0)개, 녹음 $(ls gen/m 2>/dev/null | wc -l)개" >> $GITHUB_STEP_SUMMARY
          echo "해설 $(python -c "import json;print(len(json.load(open('gen/exp.json'))))" 2>/dev/null || echo 0)개, 음성 $(ls gen/a 2>/dev/null | wc -l)개" >> $GITHUB_STEP_SUMMARY
      - name: state
        id: st
        run: |
          echo "done=$([ -f gen/DONE ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "newly=$([ -f gen/DONE ] && [ '${{ steps.pre.outputs.had }}' = 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          mc1=$(python -c "import json;print(len(json.load(open('gen/mc_exp.json'))))" 2>/dev/null || echo 0)
          echo "mcnew=$([ "$mc1" != '${{ steps.pre.outputs.mc0 }}' ] && echo true || echo false)" >> $GITHUB_OUTPUT
  apk:
    needs: gen
    if: always() && (github.event_name != 'schedule' || needs.gen.outputs.mcnew == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 300 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: 자료 넣기
        run: |
          python3 tools/gen.py sounds
          mkdir -p app/src/main/assets/snd
          python3 tools/test_exp_consistency.py   # 해설이 공식 정답과 모순되면 빌드 멈춤
          cp data/ox.json app/src/main/assets/
          [ -f gen/exp.json ] && cp gen/exp.json app/src/main/assets/ || echo '{}' > app/src/main/assets/exp.json
          [ -f gen/ox_mark.json ] && cp gen/ox_mark.json app/src/main/assets/ || echo '{}' > app/src/main/assets/ox_mark.json
          [ -f gen/ox_ctx.json ] && cp gen/ox_ctx.json app/src/main/assets/ || echo '{}' > app/src/main/assets/ox_ctx.json
          cp gen/snd/*.wav app/src/main/assets/snd/
          [ -d gen/a ] && cp -r gen/a gen/cue app/src/main/assets/ || true
          mkdir -p app/src/main/assets/web && cp web/* app/src/main/assets/web/
          [ -f gen/mc_exp.json ] && cp gen/mc_exp.json app/src/main/assets/web/ || true
          [ -f gen/law_audit.json ] && cp gen/law_audit.json app/src/main/assets/web/ || true
          python3 -c "import json;a=json.load(open('gen/exp_audit.json',encoding='utf8'));json.dump({k:[1 if v.get('ok') else 0,v.get('d',''),[str(i)[:140] for i in v.get('issues',[])[:2]]] for k,v in a.items()},open('app/src/main/assets/web/exp_check.json','w',encoding='utf8'),ensure_ascii=False,separators=(',',':'))" || true
          [ -f gen/ox_var.json ] && cp gen/ox_var.json app/src/main/assets/web/ || true
          python3 - <<'PY'   # 📜 업데이트 내역: 사람이 고친 커밋만, 첫 줄을 쉬운 말로
          import json, subprocess, re
          out = []
          for l in subprocess.run(['git', 'log', '-300', '--no-merges', '--date=format:%Y-%m-%d', '--pretty=%ad\t%an\t%s', '--', 'web', 'app'], capture_output=True, text=True).stdout.splitlines():
              d, a, msg = (l.split('\t', 2) + ['', ''])[:3]
              if 'bot' in a.lower() or 'skip ci' in msg or re.match(r'^(test|wip|merge)', msg, re.I): continue
              out.append([d, re.sub(r'\s*\(#\d+\)$', '', msg)[:160]])
              if len(out) >= 80: break
          json.dump(out, open('app/src/main/assets/web/changes.json', 'w', encoding='utf8'), ensure_ascii=False)
          PY
          python3 - <<'PY'
          p='app/src/main/assets/web/index.html'; s=open(p,encoding='utf8').read()
          i=s.find('<script'); s=s[:i]+'<script src="shim.js"></script>\n'+s[i:]
          j=s.rfind('</body>'); s=(s[:j]+'<script src="app.js"></script>\n'+s[j:]) if j>0 else s+'<script src="app.js"></script>'
          open(p,'w',encoding='utf8').write(s)
          PY
      - name: 빌드
        env: { VCODE: '${{ github.run_number }}', OX_KS_B64: '${{ secrets.OX_KS }}', OX_KS_PW: '${{ secrets.OX_KS_PW }}' }
        run: |
          if [ -n "$OX_KS_B64" ]; then echo "$OX_KS_B64" | base64 -d > /tmp/ox.jks && export OX_KS_PATH=/tmp/ox.jks && echo "새 서명 열쇠 사용"; fi
          gradle assembleSideRelease bundlePlayRelease --no-daemon --stacktrace
      - name: 올리기
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/side/release/app-side-release.apk realtor-ox.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab realtor-ox-play.aab
          echo ${{ github.run_number }} > version.txt
          gh release delete latest -y --cleanup-tag 2>/dev/null || true
          for d in $(gh api repos/${{ github.repository }}/releases -q '.[]|select(.draft)|.id'); do gh api -X DELETE repos/${{ github.repository }}/releases/$d || true; done
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest realtor-ox.apk realtor-ox-play.aab version.txt -t "중개사 OX 듣기 v${{ github.run_number }}" -n "폰에서 realtor-ox.apk 를 받아 설치하세요" --latest
